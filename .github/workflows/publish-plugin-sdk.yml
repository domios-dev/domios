name: publish-plugin-sdk

# Publishes @codeterm/plugin-sdk to npm via OIDC Trusted Publishing.
# No NPM_TOKEN secret: npm mints a short-lived token from the GitHub OIDC
# identity, so the trusted-publisher link must be configured once on
# npmjs.com (package Settings -> Trusted Publisher -> GitHub Actions:
# owner=rollacode, repo=codeterm, workflow=publish-plugin-sdk.yml).

on:
  workflow_dispatch:

jobs:
  publish:
    if: ${{ github.repository == 'rollacode/codeterm' && github.actor == 'rollacode' && github.triggering_actor == 'rollacode' && startsWith(github.ref, 'refs/heads/release/') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    environment: release
    runs-on: [self-hosted, linux-build]
    permissions:
      id-token: write # required for OIDC trusted publishing
      contents: read
    defaults:
      run:
        working-directory: packages/plugin-sdk
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          package-manager-cache: false
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing (OIDC) requires npm >= 11.5.1.
      - run: npm install -g npm@latest

      - run: npm publish --access public
