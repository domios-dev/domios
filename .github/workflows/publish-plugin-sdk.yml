name: publish-plugin-sdk

# Publishes @codeterm/plugin-sdk to npm via OIDC Trusted Publishing.
# No NPM_TOKEN secret: npm mints a short-lived token from the GitHub OIDC
# identity, so the trusted-publisher link must be configured once on
# npmjs.com (package Settings -> Trusted Publisher -> GitHub Actions:
# owner=rollacode, repo=codeterm, workflow=publish-plugin-sdk.yml).

on:
  workflow_dispatch:
  push:
    tags:
      - "plugin-sdk-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for OIDC trusted publishing
      contents: read
    defaults:
      run:
        working-directory: packages/plugin-sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing (OIDC) requires npm >= 11.5.1.
      - run: npm install -g npm@latest

      - name: Guard tag matches package version
        if: startsWith(github.ref, 'refs/tags/plugin-sdk-v')
        run: |
          pkg_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#plugin-sdk-v}"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "tag $tag_version != package.json $pkg_version" >&2
            exit 1
          fi

      - run: npm publish --access public
