name: publish-plugin-sdk

# Publishes @codeterm/plugin-sdk to npm via OIDC Trusted Publishing.
# No NPM_TOKEN secret: npm mints a short-lived token from the GitHub OIDC
# identity, so the trusted-publisher link must be configured once on
# npmjs.com (package Settings -> Trusted Publisher -> GitHub Actions:
# owner=rollacode, repo=codeterm, workflow=publish-plugin-sdk.yml).

on:
  workflow_dispatch:

jobs:
  publish:
    if: ${{ (github.repository_owner == 'rollacode' || github.repository_owner == 'domios-dev') && github.actor == 'rollacode' && github.triggering_actor == 'rollacode' && startsWith(github.ref, 'refs/heads/release/') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    environment: release
    runs-on: [self-hosted, linux-build]
    permissions:
      id-token: write # required for OIDC trusted publishing
      contents: read
    defaults:
      run:
        working-directory: packages/plugin-sdk
    steps:

      - name: Use the runner bundled Node
        if: runner.environment == 'self-hosted'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |-
            const path = require('node:path');
            core.addPath(path.dirname(process.execPath));
            core.info('Using runner Node ' + process.version);
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          package-manager-cache: false
          node-version: 22.22.0
          registry-url: https://registry.npmjs.org
        if: runner.environment == 'github-hosted'
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
      - name: Discover installed runner tools
        if: runner.environment == 'self-hosted'
        run: node scripts/ci-runner-paths.mjs --paths-only

      # Trusted publishing (OIDC) requires npm >= 11.5.1.
      - run: npm install -g npm@latest

      - run: npm publish --access public
