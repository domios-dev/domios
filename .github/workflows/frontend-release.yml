name: frontend-release
on:
  # The release run calls this for a frontend-only release/X.Y.Z, after the frontend tests pass.
  workflow_call:
    inputs:
      tag:
        description: Frontend tag frontend-vX.Y.Z matching frontend-release-contract.json
        required: true
        type: string
      source_sha:
        description: Exact release branch SHA to build
        required: true
        type: string
  workflow_dispatch:
    inputs:
      dry_run:
        description: Produce fixture-signed CI artifacts without public mutations
        type: boolean
        default: true
      tag:
        description: Frontend tag matching frontend-release-contract.json
        required: true
        type: string
permissions:
  contents: read
  actions: read
# Publications serialize and are never cancelled; a PR's dry run is superseded by its next push.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('frontend-release-pr-{0}', github.event.pull_request.number) || 'frontend-release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  # Builders are shared with agents; a CI job queues for the slot instead of failing busy (75).
  CODETERM_BUILD_GATEWAY_MODE: queue
jobs:
  build:
    if: ${{ (github.repository_owner == 'rollacode' || github.repository_owner == 'domios-dev') && github.actor == 'rollacode' && github.triggering_actor == 'rollacode' && (((startsWith(github.ref, 'refs/heads/release/') || startsWith(github.head_ref, 'release/')) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.path == '.github/workflows/tests.yml' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.actor.login == 'rollacode' && github.event.workflow_run.triggering_actor.login == 'rollacode' && startsWith(github.event.workflow_run.head_branch, 'release/'))) }}
    runs-on: [self-hosted, Linux, light, host-ubunta]
    timeout-minutes: 30
    environment: release
    env:
      FRONTEND_TAG: ${{ inputs.tag || github.ref_name }}
      FRONTEND_DRY_RUN: ${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.dry_run)) && 'true' || 'false' }}
    steps:
      - name: Use the runner bundled Node
        if: runner.environment == 'self-hosted'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |-
            const path = require('node:path');
            core.addPath(path.dirname(process.execPath));
            core.info('Using runner Node ' + process.version);
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          package-manager-cache: false
          node-version: 22.22.0
        if: runner.environment == 'github-hosted'
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
        if: runner.environment == 'github-hosted'
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 1
      - name: Discover installed runner tools
        if: runner.environment == 'self-hosted'
        run: node scripts/ci-runner-paths.mjs --paths-only
      - name: Fetch scoped master history
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-git-history.mjs master
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.32.1
          run_install: false
          dest: ${{ runner.tool_cache }}/setup-pnpm
        if: runner.environment == 'github-hosted'
      - name: Require exact-SHA dev qualification before frontend publication
        if: env.FRONTEND_DRY_RUN != 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |-
            const {pathToFileURL} = require('node:url');
            const {requireQualificationWithGithub} = await import(pathToFileURL(process.env.GITHUB_WORKSPACE + '/scripts/ci-workflow-api.mjs').href);
            const sha = process.env.QUALIFICATION_SHA || require('node:child_process').execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
            await requireQualificationWithGithub(github, context, sha);
      - name: Resolve committed frontend version for pull request dry run
        if: github.event_name == 'pull_request'
        run: node scripts/frontend-release/release.mjs resolve-pr-tag
      - name: Validate independent frontend tag
        run: node scripts/frontend-release/release.mjs validate "$FRONTEND_TAG"
      - name: Require reviewed production tag on master for a manual publication
        if: env.FRONTEND_DRY_RUN != 'true' && github.event_name == 'workflow_dispatch'
        run: |
          test "$(git rev-parse "$FRONTEND_TAG^{commit}")" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
      - name: Frozen dependencies and build.sh dependency freshness marker
        run: |
          pnpm install --frozen-lockfile --store-dir "$RUNNER_TOOL_CACHE/pnpm-store"
          touch node_modules/.package-lock.json
      - name: Focused producer tests
        run: node --test scripts/frontend-release/*.test.mjs
      - name: Build frontend only (TypeScript and Vite)
        run: ./build.sh frontend
      - name: Install dedicated signer
        if: env.FRONTEND_DRY_RUN != 'true'
        env:
          MINISIGN_SHA256: 9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73
        run: |
          if command -v minisign; then exit 0; fi
          dir="$RUNNER_TEMP/minisign"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/minisign.tar.gz" https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz
          echo "$MINISIGN_SHA256  $dir/minisign.tar.gz" | sha256sum -c -
          tar -xzf "$dir/minisign.tar.gz" -C "$dir"
          echo "$dir/minisign-linux/$(uname -m)" >> "$GITHUB_PATH"
      - name: Package and verify fixture signature
        if: env.FRONTEND_DRY_RUN == 'true'
        run: node scripts/frontend-release/release.mjs prepare "$FRONTEND_TAG"
      - name: Package and verify dedicated frontend signature
        if: env.FRONTEND_DRY_RUN != 'true'
        env:
          FRONTEND_SIGNING_PRIVATE_KEY: ${{ secrets.FRONTEND_SIGNING_PRIVATE_KEY }}
        run: node scripts/frontend-release/release.mjs prepare "$FRONTEND_TAG"
      - name: Store the frontend release for publication
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
          CI_STORE_LAN_ENDPOINT: ${{ secrets.CI_STORE_LAN_ENDPOINT }}
          CI_STORE_PUBLIC_ENDPOINT: ${{ secrets.CI_STORE_PUBLIC_ENDPOINT }}
        run: |
          shopt -s nullglob
          files=(frontend-release-output/*)
          stored=0
          for file in "${files[@]}"; do
            [ -f "$file" ] || continue
            bash scripts/ci-artifact.sh put "$GITHUB_RUN_ID/frontend-release/${file##*/}" "$file"
            stored=$((stored + 1))
          done
          [ "$stored" -gt 0 ] || { echo "no frontend release files to store" >&2; exit 1; }
      - name: Upload artifacts spooled while the private store was unreachable
        if: always()
        uses: ./.github/actions/ci-artifact-spool
  publish:
    needs: build
    if: ${{ (github.repository_owner == 'rollacode' || github.repository_owner == 'domios-dev') && github.actor == 'rollacode' && github.triggering_actor == 'rollacode' && (((startsWith(github.ref, 'refs/heads/release/') || startsWith(github.head_ref, 'release/')) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.path == '.github/workflows/tests.yml' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.actor.login == 'rollacode' && github.event.workflow_run.triggering_actor.login == 'rollacode' && startsWith(github.event.workflow_run.head_branch, 'release/'))) && (github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || !inputs.dry_run)) }}
    runs-on: [self-hosted, Linux, light, host-ubunta]
    timeout-minutes: 30
    environment: release
    env:
      FRONTEND_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Use the runner bundled Node
        if: runner.environment == 'self-hosted'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |-
            const path = require('node:path');
            core.addPath(path.dirname(process.execPath));
            core.info('Using runner Node ' + process.version);
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          package-manager-cache: false
          node-version: 22.22.0
        if: runner.environment == 'github-hosted'
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 1
      - name: Discover installed runner tools
        if: runner.environment == 'self-hosted'
        run: node scripts/ci-runner-paths.mjs --paths-only
      - name: Fetch fallback run artifact evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: ci-artifact-spool-*
          path: ${{ runner.temp }}/ci-artifact-fallback/${{ github.run_id }}
      - name: Fetch the frontend release
        env:
          GH_TOKEN: ${{ github.token }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
          CI_STORE_LAN_ENDPOINT: ${{ secrets.CI_STORE_LAN_ENDPOINT }}
          CI_STORE_PUBLIC_ENDPOINT: ${{ secrets.CI_STORE_PUBLIC_ENDPOINT }}
        run: bash scripts/ci-artifact.sh get-prefix "$GITHUB_RUN_ID/frontend-release/" frontend-release-output
      - name: Install GitHub CLI
        env:
          GH_CLI_SHA256: bb766f710eef8ede859c18578c72c327597cd4c8a85b06001b1f3843c6019386
        run: |
          if command -v gh; then exit 0; fi
          dir="$RUNNER_TEMP/gh"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/gh.tar.gz" https://github.com/cli/cli/releases/download/v2.102.0/gh_2.102.0_linux_amd64.tar.gz
          echo "$GH_CLI_SHA256  $dir/gh.tar.gz" | sha256sum -c -
          tar -xzf "$dir/gh.tar.gz" -C "$dir"
          echo "$dir/gh_2.102.0_linux_amd64/bin" >> "$GITHUB_PATH"
      - name: Verify, upload immutable assets, then update frontend discovery
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
        run: node scripts/frontend-release/release.mjs publish "$FRONTEND_TAG"
