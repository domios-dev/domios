name: file-sizes

# Source size and exact provider boundary guards.

on:
  pull_request:
    paths:
      - '**/*.rs'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.py'
      - '**/*.swift'
      - 'scripts/provider-boundary-allowlist.json'
      - 'scripts/check-provider-boundary.mjs'
      - 'scripts/tests/check-provider-boundary.test.mjs'
      - 'src-tauri/src/**'
      - 'src-tauri/crates/**'
      - 'crates/**'
      - 'scripts/check-file-sizes.sh'
      - '.github/workflows/file-sizes.yml'
  push:
    branches: [master]
    paths-ignore:
      - '.codeterm/build-machine/**'
      - '.github/workflows/release*.yml'

concurrency:
  group: file-sizes-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: [self-hosted, linux-ci]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Run file-size discipline check
        run: bash scripts/check-file-sizes.sh --fail
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test provider boundary guard
        run: node --test scripts/tests/check-provider-boundary.test.mjs
      - name: Check provider boundary against target baseline
        env:
          PROVIDER_BOUNDARY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          RELEASE_TO_MASTER: ${{ github.base_ref == 'master' && startsWith(github.head_ref, 'release/') }}
        run: |
          # A release PR carries develop's already-guarded allowlist; master predates it.
          if [ "$RELEASE_TO_MASTER" = true ]; then
            git fetch --no-tags origin develop
            PROVIDER_BOUNDARY_BASE="$(git rev-parse FETCH_HEAD)"
          fi
          PROVIDER_BOUNDARY_BASE="$PROVIDER_BOUNDARY_BASE" node scripts/check-provider-boundary.mjs
