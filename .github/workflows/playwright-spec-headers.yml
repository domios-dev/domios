name: playwright-spec-headers

on:
  pull_request:
    paths:
      - 'tests/playwright/suites/**/*.spec.ts'
      - 'scripts/check-playwright-spec-headers.mjs'
      - '.github/workflows/playwright-spec-headers.yml'
  push:
    branches:
      - develop
      - master
    paths:
      - 'tests/playwright/suites/**/*.spec.ts'
      - 'scripts/check-playwright-spec-headers.mjs'
      - '.github/workflows/playwright-spec-headers.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Playwright spec header contract
        run: node scripts/check-playwright-spec-headers.mjs
