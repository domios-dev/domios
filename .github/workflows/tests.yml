name: CI
on:
  push:
    branches: [release/next]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Full 40-hex commit SHA already on master, develop or the release/next branch
        required: true
        type: string
      scope:
        type: choice
        default: full
        options:
          - full
          - frontend
          - fast
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'push' && !github.event.deleted && 'release-qualification-push' || format('tests-dispatch-{0}', github.run_id) }}
  cancel-in-progress: true
jobs:
  admission:
    name: Select CI owner
    if: ${{ !github.event.deleted }}
    runs-on: ${{ fromJSON(vars.CI_LINUX_LIGHT_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      run: ${{ steps.route.outputs.run }}
      release_head: ${{ steps.route.outputs.release_head }}
      source_sha: ${{ steps.route.outputs.source_sha }}
    steps:
      - id: route
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        with:
          script: |-
            const owner = ['rollacode', 'domios-dev'].includes(context.repo.owner) &&
              context.actor === 'rollacode' && process.env.GITHUB_TRIGGERING_ACTOR === 'rollacode';
            const trusted = context.ref === 'refs/heads/release/next';
            const release = context.eventName === 'push' && trusted;
            if (!owner || !trusted || !(release || context.eventName === 'workflow_dispatch'))
              throw new Error('CI requires an owner release push or diagnostic dispatch');
            const source = release ? context.sha : process.env.SOURCE_REF;
            if (!release) {
              // Diagnostics run with farm secrets: only commits already on an owner-only branch are admitted.
              if (!/^[0-9a-f]{40}$/.test(source)) throw new Error('source_ref must be a full 40-hex commit SHA');
              let reachable = false;
              for (const branch of ['release/next', 'develop', 'master']) {
                const status = await github.rest.repos.compareCommitsWithBasehead({...context.repo,
                  basehead: source + '...' + branch, per_page: 1}).then(response => response.data.status, error => {
                  if (error.status === 404) return 'missing';
                  throw error;
                });
                if (status === 'ahead' || status === 'identical') { reachable = true; break; }
              }
              if (!reachable) throw new Error('source_ref is not reachable from an owner-only branch');
            }
            core.setOutput('source_sha', source);
            core.setOutput('release_head', String(release));
            core.setOutput('run', 'true');
  policy:
    name: Repository guards
    runs-on: ${{ fromJSON(vars.CI_LINUX_LIGHT_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 8
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          package-manager-cache: false
          node-version: 22.22.0
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.admission.outputs.source_sha }}
          fetch-depth: 1
      - name: Fetch scoped policy history
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: node scripts/ci-git-history.mjs policy
      - name: Runner preflight
        id: preflight
        run: node scripts/ci-runner-paths.mjs bash,curl,git,node,tar
      - name: Embedded docs and generated contract preflight
        if: ${{ !cancelled() && steps.preflight.outcome == 'success' }}
        run: node scripts/check-ci-docs.mjs
      - name: Select guard change set
        id: change
        if: ${{ !cancelled() && steps.preflight.outcome == 'success' }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        shell: bash
        run: |-
          set -euo pipefail
          head=$(git rev-parse HEAD)
          if [ "$EVENT_NAME" = pull_request ]; then
            base=$(git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA")
          elif git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            base="$PUSH_BEFORE"
          else
            base=$(git rev-parse HEAD^)
          fi
          git diff --name-only --diff-filter=ACMR "$base" "$head" > "$RUNNER_TEMP/ci-changed.txt"
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: Installed application identity
        run: node scripts/check-installed-identity.mjs
        if: ${{ !cancelled() && steps.change.outcome == 'success' }}
      - name: Current tracked tree privacy
        run: node scripts/check-public-privacy.mjs
        if: ${{ !cancelled() && steps.change.outcome == 'success' }}
      - name: Archive-portable Rust test paths
        run: node scripts/check-archive-portable-test-paths.mjs
        if: ${{ !cancelled() && steps.change.outcome == 'success' }}
      - name: Persisted plan schema contract
        run: python scripts/check-plan-schema.py
      - name: Run file-size discipline check
        run: bash scripts/check-file-sizes.sh --fail
        if: ${{ !cancelled() && steps.change.outcome == 'success' }}
      - name: Check crate layering and the thin native client
        run: bash scripts/check-crate-layering.sh
        if: ${{ !cancelled() && steps.change.outcome == 'success' }}
      - name: Check API docs
        run: bash scripts/check-api-docs.sh
        if: ${{ !cancelled() && steps.change.outcome == 'success' }}
      - name: Check prompt docs
        run: bash scripts/check-prompts-doc.sh
        if: ${{ !cancelled() && steps.change.outcome == 'success' }}
      - name: Scan new commits and working tree
        env:
          SCAN_BASE: ${{ steps.change.outputs.base }}
        run: bash scripts/secret-scan.sh "$SCAN_BASE"
        if: ${{ !cancelled() && steps.change.outcome == 'success' }}
    needs: admission
  fast:
    name: Fast checks
    uses: ./.github/workflows/tests-fast.yml
    with:
      source_ref: ${{ needs.admission.outputs.source_sha }}
      scope: ${{ inputs.scope || 'full' }}
      cancel_run: false
    permissions:
      contents: read
      actions: write
      pull-requests: write
    secrets: inherit
    if: ${{ needs.admission.outputs.run == 'true' }}
    # Starts beside the repository guards; CI result still requires them.
    needs: [admission]
  rust:
    name: Rust tests
    # Starts with the push, beside the guards and the fast tier.
    needs: [admission]
    if: ${{ !cancelled() && inputs.scope != 'fast' && github.event_name == 'push' && needs.admission.outputs.run == 'true' }}
    uses: ./.github/workflows/tests-rust.yml
    with:
      source_ref: ${{ needs.admission.outputs.source_sha }}
      cancel_run: false
      resolved_scope: '{"heavy":"true"}'
      scope: full
    permissions:
      contents: read
      actions: write
      pull-requests: write
    secrets: inherit
  rust-warnings:
    permissions:
      contents: read
      actions: write
      pull-requests: write
    needs:
      - admission
      - fast
      - rust
      - release-dry-run
    if: ${{ !cancelled() && inputs.scope != 'fast' && inputs.source_ref == '' && needs.fast.outputs.heavy != '' }}
    uses: ./.github/workflows/rust-warnings-summary.yml
    secrets: inherit
    with:
      source_ref: ${{ needs.fast.outputs.source_sha || github.ref }}
      report_name: rust-warnings-tests-all-report
      comment: false
      additional_artifacts: ${{ needs.admission.outputs.release_head == 'true' && '["rust-warnings-release-macOS-aarch64-apple-darwin","rust-warnings-release-macOS-x86_64-apple-darwin","rust-warnings-release-Linux-aarch64-unknown-linux-gnu","rust-warnings-release-Linux-x86_64-unknown-linux-gnu","rust-warnings-release-Windows-x86_64-pc-windows-msvc","rust-warnings-release-Windows-aarch64-pc-windows-msvc"]' || '[]' }}
      artifacts: ${{ needs.fast.outputs.heavy == 'true' && format('["{0}","rust-warnings-tests-platform-macOS-aarch64-apple-darwin","rust-warnings-tests-platform-Windows-x86_64-pc-windows-msvc"]', needs.rust.outputs.warnings) || '[]' }}
  qualification:
    name: qualification receipt
    needs:
      - admission
      - fast
      - rust
      - rust-warnings
      - policy
    if: ${{ (github.repository_owner == 'rollacode' || github.repository_owner == 'domios-dev') && github.actor == 'rollacode' && needs.admission.outputs.release_head == 'true' && (inputs.scope != 'fast' && !cancelled() && needs.fast.result == 'success' && needs.rust.result == 'success' && needs.rust-warnings.result == 'success' && needs.policy.result == 'success' && needs.fast.outputs.heavy == 'true') }}
    runs-on: ${{ fromJSON(vars.CI_LINUX_LIGHT_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 5
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
      CI_STORE_LAN_ENDPOINT: ${{ secrets.CI_STORE_LAN_ENDPOINT }}
      CI_STORE_PUBLIC_ENDPOINT: ${{ secrets.CI_STORE_PUBLIC_ENDPOINT }}
      CI_ARTIFACT_STORAGE: ''
    steps:
      - name: Select runner environment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          CI_HOSTED: ${{ runner.environment == 'github-hosted' }}
        with:
          script: |
            // Runner context is available after allocation, not in job-level env.
            for (const key of ["CI_HOSTED"]) {
              core.exportVariable(key, process.env[key]);
            }
      - name: Use the runner bundled Node
        if: runner.environment == 'self-hosted'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |-
            const path = require('node:path');
            core.addPath(path.dirname(process.execPath));
            core.info('Using runner Node ' + process.version);
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          package-manager-cache: false
          node-version: 22.22.0
        if: runner.environment == 'github-hosted'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.fast.outputs.source_sha }}
          fetch-depth: 1
      - name: Discover installed runner tools
        if: runner.environment == 'self-hosted'
        run: node scripts/ci-runner-paths.mjs --paths-only
      - name: Runner preflight
        run: node scripts/ci-runner-paths.mjs bash,curl,git,node
      - name: Fetch fallback run artifact evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: ci-artifact-spool-*
          path: ${{ runner.temp }}/ci-artifact-fallback/${{ github.run_id }}
      - name: Fetch executed Rust receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-artifact.sh get-prefix "$GITHUB_RUN_ID/rust-receipt/" qualification-rust
      - name: Record green qualification for this SHA
        env:
          SOURCE_SHA: ${{ needs.fast.outputs.source_sha }}
          QUALIFICATION_RESULTS: '{"fast":"${{ needs.fast.result }}","rust":"${{ needs.rust.result }}","warnings":"${{ needs.rust-warnings.result }}"}'
        run: node scripts/ci-qualification.mjs record "$SOURCE_SHA" qualification-rust
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: qualification-${{ needs.fast.outputs.source_sha }}
          overwrite: true
          path: qualification.json
          if-no-files-found: error
          retention-days: 3
  release-dry-run:
    name: Release packaging
    # Packaging starts with the push, beside every check; publication still requires this run's green qualification.
    needs: [admission]
    if: ${{ !cancelled() && needs.admission.outputs.release_head == 'true' }}
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
      actions: write
      issues: write
      pull-requests: write
    with:
      source_sha: ${{ needs.admission.outputs.source_sha }}
      dry_run: true
      mirror: false
    secrets: inherit
  result:
    # A diagnostic attaches to the dispatching branch head, so it never shares the push context name.
    name: ${{ github.event_name == 'push' && 'CI result' || 'CI diagnostic result' }}
    if: ${{ !cancelled() && !github.event.deleted }}
    needs:
      - admission
      - policy
      - fast
      - rust
      - rust-warnings
      - qualification
      - release-dry-run
    runs-on: ${{ fromJSON(vars.CI_LINUX_LIGHT_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          package-manager-cache: false
          node-version: 22.22.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.fast.outputs.source_sha || github.sha }}
          fetch-depth: 1
      - name: Read named job failures and timeouts
        if: ${{ contains(toJSON(needs), 'failure') || contains(toJSON(needs), 'cancelled') }}
        continue-on-error: true
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |-
            const {pathToFileURL} = require('node:url');
            const {listFailureJobs} = await import(pathToFileURL(process.env.GITHUB_WORKSPACE + '/scripts/ci-workflow-api.mjs').href);
            await core.summary.addHeading('Job failures').addList(await listFailureJobs(github, context)).write();
      - name: Require the complete event graph
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_SCOPE: ${{ inputs.scope }}
          CI_RELEASE_HEAD: ${{ needs.admission.outputs.release_head }}
          CI_SKIP_HEAVY: ${{ needs.admission.outputs.run == 'false' }}
        run: node scripts/ci-result.mjs
