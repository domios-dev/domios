name: tests

# Full test rig on the self-hosted build farm (free, warm incremental caches).
# The farm machines sit idle between releases — this puts them to work on every
# push/PR: Rust lib+CLI tests on all three platforms, TS gates on Linux.

on:
  workflow_call:
    inputs:
      source_ref:
        description: Immutable release source SHA
        required: true
        type: string
      scope:
        description: full for an app release (every platform), frontend for a frontend release
        required: false
        default: full
        type: string
  pull_request:
  push:
    branches: [master]
    paths-ignore:
      - '.codeterm/**'
      - '.agents/skills/**'
      - 'essences/**'
      - 'evals/**'
  workflow_dispatch:
  # Nightly full matrix on develop while the farm is idle, so parallel-test races
  # and flakes surface days before a release instead of on release day.
  schedule:
    - cron: '0 1 * * *'

# A branch is tested through its pull request, never through its own pushes:
# release/feat/lane pushes duplicated the matrix the PR already ran, and the
# single self-hosted Linux runner they contend for is the one a release needs.
# master stays because a real three-way merge produces a tree neither side tested.
#
# One group per pull request and per pushed ref: a new push to a PR, or a newer
# master commit, cancels the run it supersedes instead of queueing behind it on
# the shared runners. The nightly schedule shares master's group.
permissions:
  contents: read

concurrency:
  group: ${{ inputs.source_ref != '' && format('release-tests-{0}-{1}', github.run_id, inputs.source_ref) || format('tests-{0}', github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref) }}
  cancel-in-progress: true

env:
  DOMIOS_FIREBASE_API_KEY: ${{ secrets.DOMIOS_FIREBASE_API_KEY }}
  DOMIOS_FIREBASE_PROJECT_ID: ${{ secrets.DOMIOS_FIREBASE_PROJECT_ID }}
  DOMIOS_FIREBASE_APP_ID: ${{ secrets.DOMIOS_FIREBASE_APP_ID }}
  DOMIOS_ACCOUNT_REDEEM_URL: ${{ secrets.DOMIOS_ACCOUNT_REDEEM_URL }}
  DOMIOS_BILLING_FUNCTIONS_URL: ${{ secrets.DOMIOS_BILLING_FUNCTIONS_URL }}
  DOMIOS_AMPLITUDE_API_KEY_TEST: ${{ secrets.DOMIOS_AMPLITUDE_API_KEY_TEST }}
  DOMIOS_AMPLITUDE_API_KEY_PROD: ${{ secrets.DOMIOS_AMPLITUDE_API_KEY_PROD }}

jobs:
  # A push whose tree equals a parent's tree introduces nothing that parent had
  # not already carried through its own pull request, so the matrix would retest
  # an identical tree. Concurrency cannot see that: the merge is a new commit.
  # A real three-way merge matches no parent and still runs.
  #
  # Push only. A pull_request checks out refs/pull/N/merge, whose parents are the
  # base tip and the PR head; with an unmoved base its tree equals the head tree,
  # and skipping there would skip the one run that has never happened.
  changed:
    name: tree is new
    # Every job waits on this gate, so any free light runner takes it.
    runs-on: [self-hosted, light]
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.tree.outputs.run == 'true' && steps.scope.outputs.frontend == 'true' }}
      rust: ${{ steps.tree.outputs.run == 'true' && steps.scope.outputs.rust == 'true' }}
      heavy: ${{ steps.tree.outputs.run == 'true' && steps.scope.outputs.heavy == 'true' }}
      plugins: ${{ steps.tree.outputs.run == 'true' && steps.scope.outputs.plugins || '[]' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || (github.event_name == 'schedule' && 'refs/heads/develop') || github.ref }}
          fetch-depth: 2
      - id: tree
        env:
          CI_RELEASE_CALL: ${{ inputs.source_ref != '' || github.event_name == 'schedule' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$CI_RELEASE_CALL" = true ] || [ "${{ github.event_name }}" != push ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tree=$(git rev-parse HEAD^{tree})
          for parent in $(git rev-parse HEAD^@); do
            if [ "$(git rev-parse "$parent^{tree}")" = "$tree" ]; then
              echo "HEAD tree $tree already carried by parent $parent"
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "run=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        if: steps.tree.outputs.run == 'true'
        with:
          package-manager-cache: false
          node-version: '22.22.0'

      - id: scope
        if: steps.tree.outputs.run == 'true'
        env:
          CI_FULL_MATRIX: ${{ (inputs.source_ref != '' && inputs.scope != 'frontend') || github.event_name == 'schedule' }}
          CI_FRONTEND_ONLY: ${{ inputs.source_ref != '' && inputs.scope == 'frontend' }}
          CI_FAST_ONLY: ${{ github.event_name == 'pull_request' }}
        run: node scripts/ci-scope.mjs HEAD^ HEAD

  plugin-metadata:
    name: plugin release contracts
    needs: changed
    if: ${{ needs.changed.result == 'success' }}
    runs-on: [self-hosted, linux-ci]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || (github.event_name == 'schedule' && 'refs/heads/develop') || github.ref }}
      - uses: actions/setup-node@v5
        with:
          package-manager-cache: false
          node-version: '22.22.0'
      - run: node scripts/release-plugin.mjs check
      - run: node --test scripts/tests/plugin-releases.test.mjs scripts/tests/ci-scope.test.mjs

  plugins:
    name: plugin (${{ matrix.plugin.id }})
    needs: changed
    if: ${{ needs.changed.outputs.plugins != '[]' }}
    runs-on: [self-hosted, linux-ci]
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.changed.outputs.plugins) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || (github.event_name == 'schedule' && 'refs/heads/develop') || github.ref }}
      - uses: actions/setup-node@v5
        with:
          package-manager-cache: false
          node-version: '22.22.0'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - run: pnpm install --frozen-lockfile --store-dir "$RUNNER_TOOL_CACHE/pnpm-store"
      - run: node scripts/check-plugin.mjs '${{ matrix.plugin.id }}'

  # Formatting is platform-independent, so it does not belong inside a platform
  # lane: gating that lane off silences the check with it, which is how 22 files
  # drifted unseen. Its own job on any free light runner, seconds long.
  fmt:
    name: fmt
    needs: changed
    if: ${{ needs.changed.outputs.rust == 'true' }}
    runs-on: [self-hosted, light]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || (github.event_name == 'schedule' && 'refs/heads/develop') || github.ref }}
      # Light runners include Linux services whose PATH can miss the runner user's rustup.
      - name: Ensure Rust toolchain on PATH
        run: |
          if command -v cargo >/dev/null 2>&1; then exit 0; fi
          for dir in "${CARGO_HOME:-}/bin" "$HOME/.cargo/bin" /home/*/.cargo/bin /Users/*/.cargo/bin; do
            if [ -x "$dir/cargo" ]; then echo "$dir" >> "$GITHUB_PATH"; exit 0; fi
          done
          echo "cargo not found; restore Rust on the runner" >&2
          exit 1
      - name: cargo fmt --check
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo fmt --manifest-path cli/Cargo.toml --check

  rust-linux:
    name: rust (linux)
    # A seconds-long fmt failure stops the heavy builds before they start.
    needs: [changed, fmt]
    if: ${{ needs.changed.outputs.heavy == 'true' }}
    runs-on: [self-hosted, linux-ci]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || (github.event_name == 'schedule' && 'refs/heads/develop') || github.ref }}

      # Runner service PATH has no node (same as release-linux.yml).
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          package-manager-cache: false
          node-version: '22.22.0'

      - uses: dtolnay/rust-toolchain@stable

      # The Linux runner service PATH can miss rustc even when rustup is
      # installed for the runner user; prepare-embed-stub.js shells out to it.
      - name: Ensure Rust toolchain on PATH
        run: |
          if command -v rustc >/dev/null 2>&1; then rustc -vV; exit 0; fi
          for dir in "$CARGO_HOME/bin" "$HOME/.cargo/bin" /home/*/.cargo/bin; do
            if [ -x "$dir/rustc" ]; then
              echo "$dir" >> "$GITHUB_PATH"
              "$dir/rustc" -vV
              exit 0
            fi
          done
          echo "rustc not found; restore Rust on the runner" >&2
          exit 1

      - name: Prepare compile stubs
        id: stubs
        run: |
          mkdir -p dist src-tauri/bundled-cli
          [ -n "$(ls -A src-tauri/bundled-cli)" ] || touch src-tauri/bundled-cli/codeterm
          node scripts/prepare-embed-stub.js

      - name: Build runtime embed sidecar for semantic tests
        id: embed
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --bin codeterm-embed
          file src-tauri/target/debug/codeterm-embed | grep -q ELF
          cp src-tauri/target/debug/codeterm-embed "$RUNNER_TEMP/codeterm-embed-runtime"



      - name: Restore runtime embed sidecar
        if: ${{ !cancelled() && steps.embed.outcome == 'success' }}
        run: |
          install -m 755 "$RUNNER_TEMP/codeterm-embed-runtime" src-tauri/target/debug/codeterm-embed
          file src-tauri/target/debug/codeterm-embed | grep -q ELF

      - name: Rust lib tests
        if: ${{ !cancelled() && steps.embed.outcome == 'success' }}
        # Whole workspace — app + every extracted crate. Warm execution ~33s;
        # cold cost is compilation, absorbed by sccache + incremental caches.
        run: 'cargo test --workspace --manifest-path src-tauri/Cargo.toml --lib -- --skip startup::rest_api::tests::'

      # A concurrent test's fork holds a copy of the listener until exec, so listener
      # rebind tests run in their own process (#620).
      - name: Rust REST listener lifecycle tests
        if: ${{ !cancelled() && steps.embed.outcome == 'success' }}
        run: 'cargo test --manifest-path src-tauri/Cargo.toml --lib startup::rest_api::tests::'


      # The _work checkout is shared with release jobs on this runner — never
      # leave 0-byte stubs where the release resource glob would ship them.
      - name: Clean 0-byte stubs
        if: always()
        run: find src-tauri/bundled-cli src-tauri/bundled-embed -maxdepth 1 -type f -size 0 -delete 2>/dev/null || true

  rust-macos:
    name: rust (macos)
    # A seconds-long fmt failure stops the heavy builds before they start.
    needs: [changed, fmt]
    if: ${{ needs.changed.outputs.heavy == 'true' }}
    # Any Mac runner: tests need no signing keys, so air takes them while eight builds bundles.
    runs-on: [self-hosted, macOS]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || (github.event_name == 'schedule' && 'refs/heads/develop') || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          package-manager-cache: false
          node-version: '22.22.0'

      - name: Prepare compile stubs
        run: |
          mkdir -p dist src-tauri/bundled-cli
          [ -n "$(ls -A src-tauri/bundled-cli)" ] || touch src-tauri/bundled-cli/codeterm
          node scripts/prepare-embed-stub.js

      - name: Build runtime embed sidecar for semantic tests
        id: embed
        run: cargo build --manifest-path src-tauri/Cargo.toml --bin codeterm-embed

      - name: Rust lib tests
        if: ${{ !cancelled() && steps.embed.outcome == 'success' }}
        # Whole workspace — app + every extracted crate. Warm execution ~33s;
        # cold cost is compilation, absorbed by sccache + incremental caches.
        run: 'cargo test --workspace --manifest-path src-tauri/Cargo.toml --lib -- --skip startup::rest_api::tests::'

      # A concurrent test's fork holds a copy of the listener until exec, so listener
      # rebind tests run in their own process (#620).
      - name: Rust REST listener lifecycle tests
        if: ${{ !cancelled() && steps.embed.outcome == 'success' }}
        run: 'cargo test --manifest-path src-tauri/Cargo.toml --lib startup::rest_api::tests::'


      - name: Clean 0-byte stubs
        if: always()
        run: find src-tauri/bundled-cli src-tauri/bundled-embed -maxdepth 1 -type f -size 0 -delete 2>/dev/null || true

  rust-windows:
    name: rust (windows)
    # A seconds-long fmt failure stops the heavy builds before they start.
    needs: [changed, fmt]
    if: ${{ needs.changed.outputs.heavy == 'true' }}
    # windows-ci = ROG and BLACKSTAR native, so the Windows lib and CLI jobs run in parallel.
    runs-on: [self-hosted, windows-ci]
    timeout-minutes: 50
    steps:
      # Plan-sidecar filenames under .codeterm/plans/** exceed MAX_PATH; the
      # runner service account (NETWORK SERVICE) can't take a system gitconfig,
      # so inject core.longpaths per-invocation via GIT_CONFIG_* env instead.
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || (github.event_name == 'schedule' && 'refs/heads/develop') || github.ref }}
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.longpaths
          GIT_CONFIG_VALUE_0: 'true'

      # The runner service session PATH can drop ~\.cargo\bin (same self-heal
      # as release-windows.yml — rustup vanished from PATH on 2026-06-29).
      - name: Ensure Rust toolchain on PATH
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Get-Command rustup -ErrorAction SilentlyContinue) { Write-Host "rustup already on PATH"; exit 0 }
          $candidates = @()
          if ($env:CARGO_HOME)  { $candidates += (Join-Path $env:CARGO_HOME 'bin') }
          if ($env:USERPROFILE) { $candidates += (Join-Path $env:USERPROFILE '.cargo\bin') }
          $candidates += (Get-ChildItem 'C:\Users' -Directory -ErrorAction SilentlyContinue |
                          ForEach-Object { Join-Path $_.FullName '.cargo\bin' })
          $hit = $candidates | Where-Object { Test-Path (Join-Path $_ 'rustup.exe') } | Select-Object -First 1
          if (-not $hit) { Write-Error "rustup.exe not found in: $($candidates -join '; '). Restore Rust on the runner."; exit 1 }
          $hit | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "Prepended Rust bin to PATH: $hit"

      # The runner service session (NETWORK SERVICE) lacks Windows PowerShell on
      # PATH; host_exec tests spawn `powershell` by name and fail with
      # "program not found" without this.
      - name: Ensure Windows PowerShell on PATH
        shell: pwsh
        run: |
          $psDir = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0'
          if (-not (Test-Path (Join-Path $psDir 'powershell.exe'))) { Write-Error "powershell.exe not found at $psDir"; exit 1 }
          $psDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "Prepended $psDir"

      - name: Set up fixture Node interpreter
        uses: actions/setup-node@v5
        with:
          node-version: '22.22.0'

      - name: Prepare compile stubs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist, src-tauri\bundled-cli | Out-Null
          if (-not (Get-ChildItem src-tauri\bundled-cli -ErrorAction SilentlyContinue)) {
            New-Item -ItemType File -Path src-tauri\bundled-cli\codeterm.exe | Out-Null
          }
          node scripts/prepare-embed-stub.js

      - name: Build runtime embed sidecar for semantic tests
        id: embed
        shell: pwsh
        run: cargo build --manifest-path src-tauri/Cargo.toml --bin codeterm-embed

      # The app always points the PTY fork at the bundled ConPTY host (see
      # startup/conpty_host.rs); without this CI would test the in-box conhost,
      # whose ClosePseudoConsole deadlocks and which we never ship against.
      - name: Use the bundled ConPTY host
        shell: pwsh
        run: |
          $arch = if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'arm64' } else { 'x64' }
          $dir = Join-Path $PWD "src-tauri\conpty\$arch"
          if (-not (Test-Path (Join-Path $dir 'conpty.dll'))) { Write-Error "bundled conpty.dll not found at $dir"; exit 1 }
          "CODETERM_CONPTY_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "CODETERM_CONPTY_DIR=$dir"

      - name: Rust lib tests
        if: ${{ !cancelled() && steps.embed.outcome == 'success' }}
        shell: pwsh
        run: 'cargo test --workspace --manifest-path src-tauri/Cargo.toml --lib -- --skip startup::rest_api::tests::'

      # Same rebind isolation as Unix (#620): on Windows a concurrent child launch also holds the listener.
      - name: Rust REST listener lifecycle tests
        if: ${{ !cancelled() && steps.embed.outcome == 'success' }}
        shell: pwsh
        run: 'cargo test --manifest-path src-tauri/Cargo.toml --lib startup::rest_api::tests::'


      - name: Clean 0-byte stubs
        if: always()
        shell: pwsh
        run: |
          foreach ($dir in @('src-tauri\bundled-cli', 'src-tauri\bundled-embed')) {
            Get-ChildItem $dir -File -ErrorAction SilentlyContinue | Where-Object Length -eq 0 | Remove-Item -Force
          }

  clippy-linux:
    name: clippy (linux)
    needs: [changed, fmt]
    if: ${{ needs.changed.outputs.heavy == 'true' }}
    runs-on: [self-hosted, linux-ci]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || (github.event_name == 'schedule' && 'refs/heads/develop') || github.ref }}
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          package-manager-cache: false
          node-version: '22.22.0'
      - name: Ensure Rust toolchain on PATH
        run: |
          if command -v cargo >/dev/null 2>&1; then exit 0; fi
          for dir in "${CARGO_HOME:-}/bin" "$HOME/.cargo/bin" /home/*/.cargo/bin /Users/*/.cargo/bin; do
            if [ -x "$dir/cargo" ]; then echo "$dir" >> "$GITHUB_PATH"; exit 0; fi
          done
          echo "cargo not found; restore Rust on the runner" >&2
          exit 1
      - name: Prepare compile stubs
        run: |
          mkdir -p dist src-tauri/bundled-cli
          [ -n "$(ls -A src-tauri/bundled-cli)" ] || touch src-tauri/bundled-cli/codeterm
          node scripts/prepare-embed-stub.js
      - name: clippy (repo gate)
        run: bash scripts/clippy-gate.sh
      - name: Clean 0-byte stubs
        if: always()
        run: find src-tauri/bundled-cli src-tauri/bundled-embed -maxdepth 1 -type f -size 0 -delete 2>/dev/null || true

  cli-linux:
    name: cli (linux)
    needs: [changed, fmt]
    if: ${{ needs.changed.outputs.heavy == 'true' }}
    runs-on: [self-hosted, linux-ci]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || (github.event_name == 'schedule' && 'refs/heads/develop') || github.ref }}
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          package-manager-cache: false
          node-version: '22.22.0'
      - name: Ensure Rust toolchain on PATH
        run: |
          if command -v cargo >/dev/null 2>&1; then exit 0; fi
          for dir in "${CARGO_HOME:-}/bin" "$HOME/.cargo/bin" /home/*/.cargo/bin /Users/*/.cargo/bin; do
            if [ -x "$dir/cargo" ]; then echo "$dir" >> "$GITHUB_PATH"; exit 0; fi
          done
          echo "cargo not found; restore Rust on the runner" >&2
          exit 1
      - name: CLI tests
        run: cargo test --manifest-path cli/Cargo.toml

  cli-macos:
    name: cli (macos)
    needs: [changed, fmt]
    if: ${{ needs.changed.outputs.heavy == 'true' }}
    runs-on: [self-hosted, macOS]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || (github.event_name == 'schedule' && 'refs/heads/develop') || github.ref }}
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          package-manager-cache: false
          node-version: '22.22.0'
      - name: CLI tests
        run: cargo test --manifest-path cli/Cargo.toml

  cli-windows:
    name: cli (windows)
    needs: [changed, fmt]
    if: ${{ needs.changed.outputs.heavy == 'true' }}
    # windows-ci = ROG and BLACKSTAR native, so the Windows lib and CLI jobs run in parallel.
    runs-on: [self-hosted, windows-ci]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || (github.event_name == 'schedule' && 'refs/heads/develop') || github.ref }}
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.longpaths
          GIT_CONFIG_VALUE_0: 'true'
      - name: Ensure Rust toolchain on PATH
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Get-Command rustup -ErrorAction SilentlyContinue) { Write-Host "rustup already on PATH"; exit 0 }
          $candidates = @()
          if ($env:CARGO_HOME)  { $candidates += (Join-Path $env:CARGO_HOME 'bin') }
          if ($env:USERPROFILE) { $candidates += (Join-Path $env:USERPROFILE '.cargo\bin') }
          $candidates += (Get-ChildItem 'C:\Users' -Directory -ErrorAction SilentlyContinue |
                          ForEach-Object { Join-Path $_.FullName '.cargo\bin' })
          $hit = $candidates | Where-Object { Test-Path (Join-Path $_ 'rustup.exe') } | Select-Object -First 1
          if (-not $hit) { Write-Error "rustup.exe not found in: $($candidates -join '; '). Restore Rust on the runner."; exit 1 }
          $hit | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "Prepended Rust bin to PATH: $hit"
      - name: Ensure Windows PowerShell on PATH
        shell: pwsh
        run: |
          $psDir = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0'
          if (-not (Test-Path (Join-Path $psDir 'powershell.exe'))) { Write-Error "powershell.exe not found at $psDir"; exit 1 }
          $psDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "Prepended $psDir"
      - name: Set up fixture Node interpreter
        uses: actions/setup-node@v5
        with:
          node-version: '22.22.0'
      - name: CLI tests
        shell: pwsh
        run: cargo test --manifest-path cli/Cargo.toml

  ts-static:
    name: ts static checks
    needs: changed
    if: ${{ needs.changed.outputs.frontend == 'true' }}
    runs-on: [self-hosted, light]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || (github.event_name == 'schedule' && 'refs/heads/develop') || github.ref }}
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          package-manager-cache: false
          node-version: '22.22.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false
          dest: ${{ runner.tool_cache }}/setup-pnpm

      - name: Install dependencies
        # Runners on one host share HOME; a per-runner store keeps concurrent installs apart.
        run: pnpm install --frozen-lockfile --store-dir "$RUNNER_TOOL_CACHE/pnpm-store"
      - name: TS strict typecheck (prod build gate)
        run: pnpm exec tsc --noEmit
      - name: TypeScript unused exports
        if: ${{ !cancelled() }}
        run: pnpm check:unused-exports
      - name: Repository Knip report
        if: ${{ !cancelled() }}
        run: pnpm knip:report
      # An effect that reaches the API must key on primitives; a mux-rebuilt object
      # re-runs it at broadcast rate. Five such sites shipped before this existed.
      - name: Check API effect dependencies
        if: ${{ !cancelled() }}
        run: pnpm check:api-effects
      - name: Biome (TS lint)
        if: ${{ !cancelled() }}
        run: pnpm lint

  ts-types:
    name: ts generated types
    needs: changed
    if: ${{ needs.changed.outputs.frontend == 'true' || needs.changed.outputs.rust == 'true' }}
    runs-on: [self-hosted, light]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || (github.event_name == 'schedule' && 'refs/heads/develop') || github.ref }}
      - name: Ensure Rust toolchain on PATH
        run: |
          if command -v cargo >/dev/null 2>&1; then exit 0; fi
          for dir in "${CARGO_HOME:-}/bin" "$HOME/.cargo/bin" /home/*/.cargo/bin /Users/*/.cargo/bin; do
            if [ -x "$dir/cargo" ]; then echo "$dir" >> "$GITHUB_PATH"; exit 0; fi
          done
          echo "cargo not found; restore Rust on the runner" >&2
          exit 1
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          package-manager-cache: false
          node-version: '22.22.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false
          dest: ${{ runner.tool_cache }}/setup-pnpm

      - name: Install dependencies
        # Runners on one host share HOME; a per-runner store keeps concurrent installs apart.
        run: pnpm install --frozen-lockfile --store-dir "$RUNNER_TOOL_CACHE/pnpm-store"
      - name: Check Rust generated TypeScript types
        run: pnpm types:check

  ts-unit:
    name: ts unit
    needs: changed
    if: ${{ needs.changed.outputs.frontend == 'true' }}
    runs-on: [self-hosted, light]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || (github.event_name == 'schedule' && 'refs/heads/develop') || github.ref }}
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          package-manager-cache: false
          node-version: '22.22.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false
          dest: ${{ runner.tool_cache }}/setup-pnpm

      - name: Install dependencies
        # Runners on one host share HOME; a per-runner store keeps concurrent installs apart.
        run: pnpm install --frozen-lockfile --store-dir "$RUNNER_TOOL_CACHE/pnpm-store"
      - name: Run TS unit tests
        run: pnpm test:unit

  ts-vitest:
    name: ts vitest
    needs: changed
    if: ${{ needs.changed.outputs.frontend == 'true' }}
    runs-on: [self-hosted, light]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || (github.event_name == 'schedule' && 'refs/heads/develop') || github.ref }}
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          package-manager-cache: false
          node-version: '22.22.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false
          dest: ${{ runner.tool_cache }}/setup-pnpm

      - name: Install dependencies
        # Runners on one host share HOME; a per-runner store keeps concurrent installs apart.
        run: pnpm install --frozen-lockfile --store-dir "$RUNNER_TOOL_CACHE/pnpm-store"
      # run-ts-unit-tests.mjs deliberately skips the vitest-owned files, so this
      # job is the only thing that runs them.
      # Light runners share a 16 GiB BLACKSTAR WSL VM with a heavy runner; bound the worker fanout.
      - name: Run vitest-owned TS tests
        run: pnpm test:vitest --maxWorkers=4

  ts-plugins:
    name: plugin bundles + tests
    needs: changed
    if: ${{ needs.changed.outputs.rust == 'true' }}
    runs-on: [self-hosted, light]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || (github.event_name == 'schedule' && 'refs/heads/develop') || github.ref }}
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          package-manager-cache: false
          node-version: '22.22.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false
          dest: ${{ runner.tool_cache }}/setup-pnpm

      - name: Install dependencies
        # Runners on one host share HOME; a per-runner store keeps concurrent installs apart.
        run: pnpm install --frozen-lockfile --store-dir "$RUNNER_TOOL_CACHE/pnpm-store"
      - name: Check generated plugin bundles
        run: pnpm check:plugin-bundles
      - name: Run plugin tests
        if: ${{ !cancelled() }}
        run: pnpm test:plugins

  release-contracts:
    name: release contract tests
    needs: changed
    if: ${{ needs.changed.outputs.rust == 'true' }}
    runs-on: [self-hosted, light]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || (github.event_name == 'schedule' && 'refs/heads/develop') || github.ref }}
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          package-manager-cache: false
          node-version: '22.22.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false
          dest: ${{ runner.tool_cache }}/setup-pnpm

      - name: Install dependencies
        # Runners on one host share HOME; a per-runner store keeps concurrent installs apart.
        run: pnpm install --frozen-lockfile --store-dir "$RUNNER_TOOL_CACHE/pnpm-store"
      - name: Release test and publication gate contracts
        run: node --test scripts/tests/release-test-gate.test.mjs scripts/tests/ci-scope.test.mjs
      - name: Release metadata contract tests
        run: python3 -m unittest scripts.tests.test_release_issue_contract
      - name: Release workflow signature-gate contract tests
        if: ${{ !cancelled() }}
        run: python3 -m unittest scripts.tests.test_release_workflow_contract
      - name: Updater manifest merge + signature tests
        if: ${{ !cancelled() }}
        run: node --test scripts/tests/updater-manifest.test.mjs
      - name: Release closure authority tests
        if: ${{ !cancelled() }}
        run: node --test scripts/tests/release-closure-authority.test.mjs
      - name: Release notes synchronization tests
        if: ${{ !cancelled() }}
        run: node --test scripts/tests/release-notes-sync.test.mjs
