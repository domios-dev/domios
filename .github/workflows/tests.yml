name: CI
on:
  # CI runs only for a release PR into master; a new push to the PR cancels its previous run.
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact source commit SHA
        required: true
        type: string
      scope:
        type: choice
        default: full
        options:
          - full
          - frontend
          - fast
permissions:
  contents: read
concurrency:
  group: ${{ inputs.source_ref != '' && format('tests-dispatch-{0}', github.run_id) || format('tests-pr-{0}', github.event.pull_request.number) }}
  cancel-in-progress: true
jobs:
  admission:
    name: Select CI owner
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      run: ${{ steps.route.outputs.run }}
      release_head: ${{ steps.route.outputs.release_head }}
      source_sha: ${{ steps.route.outputs.source_sha }}
    steps:
      - id: route
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        with:
          script: |-
            // The Rust tier starts from the exact PR head, not the synthetic merge commit.
            const pr = context.payload.pull_request;
            core.setOutput('source_sha', process.env.SOURCE_REF || pr?.head.sha || context.sha);
            const release = context.eventName === 'pull_request' && /^release\/\d+\.\d+\.\d+$/.test(pr.head.ref) &&
              pr.head.repo.full_name === context.repo.owner + '/' + context.repo.repo && pr.user.login === 'rollacode' &&
              context.actor === 'rollacode' && process.env.GITHUB_TRIGGERING_ACTOR === 'rollacode';
            core.setOutput('release_head', String(release));
            if (context.eventName === 'pull_request' && !release) {
              core.notice('Only an owner release/X.Y.Z PR into master runs CI');
              core.setOutput('run', 'false');
              return;
            }
            core.setOutput('run', 'true');
  policy:
    name: Repository guards
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          package-manager-cache: false
          node-version: 22.22.0
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.source_ref || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Fetch scoped policy history
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: node scripts/ci-git-history.mjs policy
      - name: Runner preflight
        run: node scripts/ci-runner-paths.mjs bash,curl,git,node,tar
      - name: Embedded docs and generated contract preflight
        if: ${{ !cancelled() }}
        run: node scripts/check-ci-docs.mjs
      - name: Select guard change set
        id: change
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        shell: bash
        run: |-
          set -euo pipefail
          head=$(git rev-parse HEAD)
          if [ "$EVENT_NAME" = pull_request ]; then
            base=$(git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA")
          elif git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            base="$PUSH_BEFORE"
          else
            base=$(git rev-parse HEAD^)
          fi
          git diff --name-only --diff-filter=ACMR "$base" "$head" > "$RUNNER_TEMP/ci-changed.txt"
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: Run file-size discipline check
        run: bash scripts/check-file-sizes.sh --fail
        if: ${{ !cancelled() }}
      - name: Check crate layering and the thin native client
        run: bash scripts/check-crate-layering.sh
        if: ${{ !cancelled() }}
      - name: Check API docs
        run: bash scripts/check-api-docs.sh
        if: ${{ !cancelled() }}
      - name: Check prompt docs
        run: bash scripts/check-prompts-doc.sh
        if: ${{ !cancelled() }}
      - name: Scan new commits and working tree
        env:
          SCAN_BASE: ${{ steps.change.outputs.base }}
        run: bash scripts/secret-scan.sh "$SCAN_BASE"
        if: ${{ !cancelled() }}
      - name: Require a release branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          SOURCE_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$HEAD_REPO" == "$SOURCE_REPO" && "$PR_AUTHOR" == rollacode ]]
          if [[ ! "$HEAD_REF" =~ ^release/[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::master accepts only release/X.Y.Z; open this pull request against develop (head was '$HEAD_REF')"
            exit 1
          fi
          echo "release branch $HEAD_REF"
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.base_ref == 'master' }}
    needs: admission
  pr:
    name: Pull request checks
    if: ${{ false }}
    uses: ./.github/workflows/tests-pr.yml
    permissions:
      contents: read
    needs: policy
  fast:
    name: Fast checks
    uses: ./.github/workflows/tests-fast.yml
    with:
      source_ref: ${{ needs.admission.outputs.source_sha }}
      scope: ${{ inputs.scope || 'full' }}
      cancel_run: false
    permissions:
      contents: read
      actions: write
      pull-requests: write
    secrets: inherit
    if: ${{ needs.admission.outputs.run != 'false' }}
    # Starts beside the repository guards; CI result still requires them.
    needs: [admission]
  rust:
    name: Rust tests
    # Starts with the push, beside the guards and the fast tier.
    needs: [admission]
    if: ${{ !cancelled() && inputs.scope != 'fast' && github.event_name == 'pull_request' && needs.admission.outputs.run != 'false' }}
    uses: ./.github/workflows/tests-rust.yml
    with:
      source_ref: ${{ needs.admission.outputs.source_sha }}
      cancel_run: false
      resolved_scope: '{"heavy":"true"}'
      scope: full
    permissions:
      contents: read
      actions: write
      pull-requests: write
    secrets: inherit
  rust-warnings:
    permissions:
      contents: read
      actions: write
      pull-requests: write
    needs:
      - admission
      - fast
      - rust
    if: ${{ !cancelled() && inputs.scope != 'fast' && inputs.source_ref == '' && needs.fast.outputs.heavy != '' }}
    uses: ./.github/workflows/rust-warnings-summary.yml
    secrets: inherit
    with:
      source_ref: ${{ needs.fast.outputs.source_sha || github.ref }}
      report_name: rust-warnings-tests-all-report
      artifacts: ${{ needs.fast.outputs.heavy == 'true' && format('["{0}","rust-warnings-tests-platform-macOS-aarch64-apple-darwin","rust-warnings-tests-platform-Windows-x86_64-pc-windows-msvc","rust-warnings-clippy-Linux-x86_64-unknown-linux-gnu"]', needs.rust.outputs.warnings) || '[]' }}
  qualification:
    name: qualification receipt
    needs:
      - admission
      - fast
      - rust
      - rust-warnings
      - policy
    if: ${{ (github.repository_owner == 'rollacode' || github.repository_owner == 'domios-dev') && github.actor == 'rollacode' && needs.admission.outputs.release_head == 'true' && (inputs.scope != 'fast' && !cancelled() && needs.fast.result == 'success' && needs.rust.result == 'success' && needs.rust-warnings.result == 'success' && needs.policy.result == 'success' && needs.fast.outputs.heavy == 'true') }}
    runs-on: ${{ vars.CI_LINUX_LIGHT_RUNNER || fromJSON('["self-hosted","Linux","light","host-ubunta"]') }}
    timeout-minutes: 5
    env:
      AWS_ACCESS_KEY_ID: ${{ !(vars.CI_LINUX_LIGHT_RUNNER == 'ubuntu-24.04') && secrets.SCCACHE_AWS_ACCESS_KEY_ID || '' }}
      AWS_SECRET_ACCESS_KEY: ${{ !(vars.CI_LINUX_LIGHT_RUNNER == 'ubuntu-24.04') && secrets.SCCACHE_AWS_SECRET_ACCESS_KEY || '' }}
      CI_STORE_LAN_ENDPOINT: ${{ !(vars.CI_LINUX_LIGHT_RUNNER == 'ubuntu-24.04') && secrets.CI_STORE_LAN_ENDPOINT || '' }}
      CI_STORE_PUBLIC_ENDPOINT: ${{ !(vars.CI_LINUX_LIGHT_RUNNER == 'ubuntu-24.04') && secrets.CI_STORE_PUBLIC_ENDPOINT || '' }}
      CI_HOSTED: ${{ vars.CI_LINUX_LIGHT_RUNNER == 'ubuntu-24.04' }}
      CI_ARTIFACT_STORAGE: ${{ (vars.CI_LINUX_LIGHT_RUNNER == 'ubuntu-24.04') && 'github' || '' }}
    steps:
      - name: Use the runner bundled Node
        if: runner.environment == 'self-hosted'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |-
            const path = require('node:path');
            core.addPath(path.dirname(process.execPath));
            core.info('Using runner Node ' + process.version);
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          package-manager-cache: false
          node-version: 22.22.0
        if: runner.environment == 'github-hosted'
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.fast.outputs.source_sha }}
          fetch-depth: 1
      - name: Discover installed runner tools
        if: runner.environment == 'self-hosted'
        run: node scripts/ci-runner-paths.mjs --paths-only
      - name: Runner preflight
        run: node scripts/ci-runner-paths.mjs bash,curl,git,node
      - name: Fetch fallback run artifact evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ci-artifact-spool-*
          path: ${{ runner.temp }}/ci-artifact-fallback/${{ github.run_id }}
      - name: Fetch executed Rust receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-artifact.sh get-prefix "$GITHUB_RUN_ID/rust-receipt/" qualification-rust
      - name: Record green qualification for this SHA
        env:
          SOURCE_SHA: ${{ needs.fast.outputs.source_sha }}
          QUALIFICATION_RESULTS: '{"fast":"${{ needs.fast.result }}","rust":"${{ needs.rust.result }}","warnings":"${{ needs.rust-warnings.result }}"}'
        run: node scripts/ci-qualification.mjs record "$SOURCE_SHA" qualification-rust
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualification-${{ needs.fast.outputs.source_sha }}
          path: qualification.json
          if-no-files-found: error
          retention-days: 3
  release-dry-run:
    name: Release packaging
    # Packaging starts with the push, beside every check; publication still requires this run's green qualification.
    needs: [admission]
    if: ${{ !cancelled() && needs.admission.outputs.release_head == 'true' }}
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
      actions: write
      issues: write
      pull-requests: write
    with:
      tag: ${{ github.head_ref }}
      source_sha: ${{ needs.admission.outputs.source_sha }}
      dry_run: true
      mirror: false
    secrets: inherit
  result:
    name: CI result
    if: ${{ !cancelled() }}
    needs:
      - admission
      - policy
      - pr
      - fast
      - rust
      - rust-warnings
      - qualification
      - release-dry-run
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          package-manager-cache: false
          node-version: 22.22.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.fast.outputs.source_sha || github.sha }}
          fetch-depth: 1
      - name: Read named job failures and timeouts
        if: ${{ contains(toJSON(needs), 'failure') || contains(toJSON(needs), 'cancelled') }}
        continue-on-error: true
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |-
            const {pathToFileURL} = require('node:url');
            const {listFailureJobs} = await import(pathToFileURL(process.env.GITHUB_WORKSPACE + '/scripts/ci-workflow-api.mjs').href);
            await core.summary.addHeading('Job failures').addList(await listFailureJobs(github, context)).write();
      - name: Require the complete event graph
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_SCOPE: ${{ inputs.scope }}
          CI_RELEASE_HEAD: ${{ needs.admission.outputs.release_head }}
          CI_SKIP_HEAVY: ${{ needs.admission.outputs.run == 'false' }}
        run: node scripts/ci-result.mjs
