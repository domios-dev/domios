  ts-vitest:
    name: ts vitest
    needs: changed
    if: ${{ (inputs.phase == '' || inputs.phase == 'all' || inputs.phase == 'fast') && (needs.changed.outputs.frontend == 'true') }}
    runs-on: [self-hosted, light]
    permissions:
      contents: read
      actions: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_ref || (github.event_name == 'schedule' && 'refs/heads/develop') || github.ref }}
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          package-manager-cache: false
          node-version: '22.22.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.32.1
          run_install: false
          dest: ${{ runner.tool_cache }}/setup-pnpm

      - name: Install dependencies
        # Runners on one host share HOME; a per-runner store keeps concurrent installs apart.
        run: pnpm install --frozen-lockfile --store-dir "$RUNNER_TOOL_CACHE/pnpm-store"
      # run-ts-unit-tests.mjs deliberately skips the vitest-owned files, so this
      # job is the only thing that runs them.
      # Light runners share a 16 GiB BLACKSTAR WSL VM with a heavy runner; bound the worker fanout.
      - name: Run vitest-owned TS tests
        run: pnpm test:vitest --maxWorkers=4
      - *cancel-release-on-failure

  ts-plugins:
    name: plugin bundles + tests
    needs: changed
    if: ${{ (inputs.phase == '' || inputs.phase == 'all' || inputs.phase == 'fast') && (needs.changed.outputs.rust == 'true') }}
