  release-contracts:
    name: release contract tests
    needs: changed
    if: ${{ (inputs.phase == '' || inputs.phase == 'all' || inputs.phase == 'fast') && (needs.changed.outputs.rust == 'true') }}
    runs-on: [self-hosted, light]
    permissions:
      contents: read
      actions: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_ref || (github.event_name == 'schedule' && 'refs/heads/develop') || github.ref }}
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          package-manager-cache: false
          node-version: '22.22.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.32.1
          run_install: false
          dest: ${{ runner.tool_cache }}/setup-pnpm

      - name: Install dependencies
        # Runners on one host share HOME; a per-runner store keeps concurrent installs apart.
        run: pnpm install --frozen-lockfile --store-dir "$RUNNER_TOOL_CACHE/pnpm-store"
      - name: Release test and publication gate contracts
        run: node --test scripts/tests/release-test-gate.test.mjs scripts/tests/ci-scope.test.mjs scripts/tests/release-job-graph.test.mjs scripts/tests/release-bundle-smoke.test.mjs scripts/tests/release-asset-scope.test.mjs
      - name: Rust shard coverage contracts
        run: node --test scripts/tests/ci-rust-shards.test.mjs scripts/tests/ci-runner-paths.test.mjs scripts/tests/ci-rust-archives.test.mjs
      - name: Release metadata contract tests
        run: python3 -m unittest scripts.tests.test_release_issue_contract
      - name: Release workflow signature-gate contract tests
        if: ${{ !cancelled() }}
        run: python3 -m unittest scripts.tests.test_release_workflow_contract
      - name: Updater manifest merge + signature tests
        if: ${{ !cancelled() }}
        run: node --test scripts/tests/updater-manifest.test.mjs
      - name: Release closure authority tests
        if: ${{ !cancelled() }}
        run: node --test scripts/tests/release-closure-authority.test.mjs
      - name: Release notes synchronization tests
        if: ${{ !cancelled() }}
        run: node --test scripts/tests/release-notes-sync.test.mjs
      - *cancel-release-on-failure

  rust-warnings:
    permissions:
      contents: read
      actions: write
      pull-requests: write
    needs: [changed, rust-archives, clippy-linux, ts-types]
    if: always()
    uses: ./.github/workflows/rust-warnings-summary.yml
    with:
      source_ref: ${{ inputs.source_ref || (github.event_name == 'schedule' && 'refs/heads/develop') || github.ref }}
      report_name: ${{ format('rust-warnings-tests-{0}-report', inputs.phase || 'all') }}
      cancel_release_on_failure: ${{ inputs.cancel_release_on_failure }}
      artifacts: ${{ needs.changed.outputs.heavy == 'true' && (inputs.phase == 'fast' && '["rust-warnings-clippy-Linux-x86_64-unknown-linux-gnu"]' || inputs.phase == 'long' && '["rust-warnings-tests-macOS-aarch64-apple-darwin","rust-warnings-tests-Linux-x86_64-unknown-linux-gnu","rust-warnings-tests-Windows-x86_64-pc-windows-msvc"]' || '["rust-warnings-tests-macOS-aarch64-apple-darwin","rust-warnings-tests-Linux-x86_64-unknown-linux-gnu","rust-warnings-tests-Windows-x86_64-pc-windows-msvc","rust-warnings-clippy-Linux-x86_64-unknown-linux-gnu"]') || '[]' }}
