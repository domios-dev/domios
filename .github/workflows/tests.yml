name: tests

# Full test rig on the self-hosted build farm (free, warm incremental caches).
# The farm machines sit idle between releases — this puts them to work on every
# heavy run: shared Rust lib+CLI shards on macOS, native cfg tests per OS.
# The checks live in two tiers that release.yml calls directly: tests-fast.yml and tests-rust.yml.

on:
  pull_request:
  push:
    branches: [master]
    paths-ignore:
      - '.codeterm/**'
      - '.agents/skills/**'
      - 'essences/**'
      - 'evals/**'
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact source commit SHA
        required: true
        type: string
      scope:
        type: choice
        default: full
        options: [full, frontend]

# A branch is tested through its pull request, never through its own pushes:
# release/feat/lane pushes duplicated the matrix the PR already ran, and the
# single self-hosted Linux runner they contend for is the one a release needs.
# master stays because a real three-way merge produces a tree neither side tested.
#
# One group per pull request and per pushed ref: a new push to a PR, or a newer
# master commit, cancels the run it supersedes instead of queueing behind it on
# the shared runners. A manual dispatch tests one exact SHA and supersedes nothing.
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ inputs.source_ref != '' && format('tests-dispatch-{0}', github.run_id) || format('tests-{0}', github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref) }}
  cancel-in-progress: true

jobs:
  fast:
    name: Fast checks
    uses: ./.github/workflows/tests-fast.yml
    with:
      source_ref: ${{ inputs.source_ref }}
      scope: ${{ inputs.scope || 'full' }}
    permissions:
      contents: read
      actions: write
      pull-requests: write
    secrets: inherit

  # Pull requests never reach the heavy scope, and a manual dispatch checks the fast tier only.
  rust:
    name: Rust tests
    needs: fast
    if: github.event_name == 'push'
    uses: ./.github/workflows/tests-rust.yml
    with:
      source_ref: ''
      scope: full
    permissions:
      contents: read
      actions: write
      pull-requests: write
    secrets: inherit

  rust-warnings:
    permissions:
      contents: read
      actions: write
      pull-requests: write
    needs: [fast, rust]
    # A skipped scope gate has nothing to summarise; release calls summarise once in release.yml.
    if: ${{ always() && inputs.source_ref == '' && needs.fast.outputs.heavy != '' }}
    uses: ./.github/workflows/rust-warnings-summary.yml
    secrets: inherit
    with:
      source_ref: ${{ github.ref }}
      report_name: rust-warnings-tests-all-report
      artifacts: ${{ needs.fast.outputs.heavy == 'true' && format('["{0}","rust-warnings-tests-platform-macOS-aarch64-apple-darwin","rust-warnings-tests-platform-Linux-x86_64-unknown-linux-gnu","rust-warnings-tests-platform-Windows-x86_64-pc-windows-msvc","rust-warnings-clippy-Linux-x86_64-unknown-linux-gnu"]', needs.rust.outputs.warnings) || '[]' }}
