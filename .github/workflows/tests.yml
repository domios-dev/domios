name: tests

# Full test rig on the self-hosted build farm (free, warm incremental caches).
# The farm machines sit idle between releases — this puts them to work on every
# push/PR: Rust lib+CLI tests on all three platforms, TS gates on Linux.

on:
  pull_request:
  push:
    branches: [develop, master, 'feat/**']
    paths-ignore:
      - '.codeterm/**'
      - 'docs/**'
      - 'evals/**'
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-linux:
    name: rust (linux)
    runs-on: [self-hosted, linux-build]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # Runner service PATH has no node (same as release-linux.yml).
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'

      - name: Prepare compile stubs
        run: |
          mkdir -p dist src-tauri/bundled-cli
          [ -n "$(ls -A src-tauri/bundled-cli)" ] || touch src-tauri/bundled-cli/codeterm
          node scripts/prepare-embed-stub.js

      - name: fmt
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo fmt --manifest-path cli/Cargo.toml --check

      - name: File-size discipline
        run: bash scripts/check-file-sizes.sh

      - name: clippy (repo gate)
        run: bash scripts/clippy-gate.sh

      - name: Rust lib tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: CLI tests
        run: cargo test --manifest-path cli/Cargo.toml

      # The _work checkout is shared with release jobs on this runner — never
      # leave 0-byte stubs where the release resource glob would ship them.
      - name: Clean 0-byte stubs
        if: always()
        run: find src-tauri/bundled-cli src-tauri/bundled-embed -maxdepth 1 -type f -size 0 -delete 2>/dev/null || true

  rust-macos:
    name: rust (macos)
    runs-on: [self-hosted, codeterm-builder]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'

      - name: Prepare compile stubs
        run: |
          mkdir -p dist src-tauri/bundled-cli
          [ -n "$(ls -A src-tauri/bundled-cli)" ] || touch src-tauri/bundled-cli/codeterm
          node scripts/prepare-embed-stub.js

      - name: Rust lib tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: CLI tests
        run: cargo test --manifest-path cli/Cargo.toml

      - name: Clean 0-byte stubs
        if: always()
        run: find src-tauri/bundled-cli src-tauri/bundled-embed -maxdepth 1 -type f -size 0 -delete 2>/dev/null || true

  rust-windows:
    name: rust (windows)
    runs-on: [self-hosted, windows-build]
    timeout-minutes: 50
    steps:
      # Plan-sidecar filenames under .codeterm/plans/** exceed MAX_PATH; the
      # runner service account (NETWORK SERVICE) can't take a system gitconfig,
      # so inject core.longpaths per-invocation via GIT_CONFIG_* env instead.
      - uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.longpaths
          GIT_CONFIG_VALUE_0: 'true'

      # The runner service session PATH can drop ~\.cargo\bin (same self-heal
      # as release-windows.yml — rustup vanished from PATH on 2026-06-29).
      - name: Ensure Rust toolchain on PATH
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Get-Command rustup -ErrorAction SilentlyContinue) { Write-Host "rustup already on PATH"; exit 0 }
          $candidates = @()
          if ($env:CARGO_HOME)  { $candidates += (Join-Path $env:CARGO_HOME 'bin') }
          if ($env:USERPROFILE) { $candidates += (Join-Path $env:USERPROFILE '.cargo\bin') }
          $candidates += (Get-ChildItem 'C:\Users' -Directory -ErrorAction SilentlyContinue |
                          ForEach-Object { Join-Path $_.FullName '.cargo\bin' })
          $hit = $candidates | Where-Object { Test-Path (Join-Path $_ 'rustup.exe') } | Select-Object -First 1
          if (-not $hit) { Write-Error "rustup.exe not found in: $($candidates -join '; '). Restore Rust on the runner."; exit 1 }
          $hit | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "Prepended Rust bin to PATH: $hit"

      - name: Prepare compile stubs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist, src-tauri\bundled-cli | Out-Null
          if (-not (Get-ChildItem src-tauri\bundled-cli -ErrorAction SilentlyContinue)) {
            New-Item -ItemType File -Path src-tauri\bundled-cli\codeterm.exe | Out-Null
          }
          node scripts/prepare-embed-stub.js

      - name: Rust lib tests
        shell: pwsh
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: CLI tests
        shell: pwsh
        run: cargo test --manifest-path cli/Cargo.toml

      - name: Clean 0-byte stubs
        if: always()
        shell: pwsh
        run: |
          foreach ($dir in @('src-tauri\bundled-cli', 'src-tauri\bundled-embed')) {
            Get-ChildItem $dir -File -ErrorAction SilentlyContinue | Where-Object Length -eq 0 | Remove-Item -Force
          }

  ts:
    name: ts unit + plugins
    runs-on: [self-hosted, codeterm-builder]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TS strict typecheck (prod build gate)
        run: pnpm exec tsc --noEmit

      - name: Run TS unit tests
        run: pnpm test:unit

      - name: Check generated plugin bundles
        run: pnpm check:plugin-bundles

      - name: Run plugin tests
        run: pnpm test:plugins

      - name: Biome (TS lint)
        run: pnpm lint
