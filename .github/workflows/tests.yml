name: tests

# Full test rig on the self-hosted build farm (free, warm incremental caches).
# The farm machines sit idle between releases — this puts them to work on every
# heavy run: shared Rust lib+CLI shards on macOS, native cfg tests per OS.

on:
  workflow_call:
    inputs:
      source_ref:
        description: Immutable release source SHA
        required: true
        type: string
      scope:
        description: full for an app release (every platform), frontend for a frontend release
        required: false
        default: full
        type: string
      phase:
        description: all, fast (checks only), or long (Rust archives and tests)
        required: false
        default: all
        type: string
  pull_request:
  push:
    branches: [master]
    paths-ignore:
      - '.codeterm/**'
      - '.agents/skills/**'
      - 'essences/**'
      - 'evals/**'
  workflow_dispatch:
  # Release CI through workflow_call and manual dispatch run the full matrix.

# A branch is tested through its pull request, never through its own pushes:
# release/feat/lane pushes duplicated the matrix the PR already ran, and the
# single self-hosted Linux runner they contend for is the one a release needs.
# master stays because a real three-way merge produces a tree neither side tested.
#
# One group per pull request and per pushed ref: a new push to a PR, or a newer
# master commit, cancels the run it supersedes instead of queueing behind it on
# the shared runners.
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ inputs.source_ref != '' && format('release-tests-{0}-{1}-{2}', github.run_id, inputs.source_ref, inputs.phase || 'all') || format('tests-{0}', github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref) }}
  cancel-in-progress: true

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
  CODETERM_SCCACHE_CREDENTIAL_SOURCE: runner
  # Builders are shared with agents; a CI job queues for the slot instead of failing busy (75).
  CODETERM_BUILD_GATEWAY_MODE: queue
  CODETERM_SCCACHE_VERIFY_ONLY: '1'
  DOMIOS_FIREBASE_API_KEY: ${{ secrets.DOMIOS_FIREBASE_API_KEY }}
  DOMIOS_FIREBASE_PROJECT_ID: ${{ secrets.DOMIOS_FIREBASE_PROJECT_ID }}
  DOMIOS_FIREBASE_APP_ID: ${{ secrets.DOMIOS_FIREBASE_APP_ID }}
  DOMIOS_ACCOUNT_REDEEM_URL: ${{ secrets.DOMIOS_ACCOUNT_REDEEM_URL }}
  DOMIOS_BILLING_FUNCTIONS_URL: ${{ secrets.DOMIOS_BILLING_FUNCTIONS_URL }}
  DOMIOS_AMPLITUDE_API_KEY_TEST: ${{ secrets.DOMIOS_AMPLITUDE_API_KEY_TEST }}
  DOMIOS_AMPLITUDE_API_KEY_PROD: ${{ secrets.DOMIOS_AMPLITUDE_API_KEY_PROD }}

jobs:
  # A push whose tree equals a parent's tree introduces nothing that parent had
  # not already carried through its own pull request, so the matrix would retest
  # an identical tree. Concurrency cannot see that: the merge is a new commit.
  # A real three-way merge matches no parent and still runs.
  #
  # Push only. A pull_request checks out refs/pull/N/merge, whose parents are the
  # base tip and the PR head; with an unmoved base its tree equals the head tree,
  # and skipping there would skip the one run that has never happened.
  changed:
    name: tree is new
    # A release branch's push already runs these checks on the exact SHA in release.yml.
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release/') }}
    # Every job waits on this gate, so any free light runner takes it.
    runs-on: [self-hosted, light]
    permissions:
      contents: read
      actions: write
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.tree.outputs.run == 'true' && steps.scope.outputs.frontend == 'true' }}
      rust: ${{ steps.tree.outputs.run == 'true' && steps.scope.outputs.rust == 'true' }}
      heavy: ${{ steps.tree.outputs.run == 'true' && steps.scope.outputs.heavy == 'true' }}
      plugins: ${{ steps.tree.outputs.run == 'true' && steps.scope.outputs.plugins || '[]' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          fetch-depth: 2
      - id: tree
        env:
          CI_RELEASE_CALL: ${{ inputs.source_ref != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$CI_RELEASE_CALL" = true ] || [ "${{ github.event_name }}" != push ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tree=$(git rev-parse 'HEAD^{tree}')
          for parent in $(git rev-parse 'HEAD^@'); do
            if [ "$(git rev-parse "$parent^{tree}")" = "$tree" ]; then
              echo "HEAD tree $tree already carried by parent $parent"
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "run=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        if: steps.tree.outputs.run == 'true'
        with:
          package-manager-cache: false
          node-version: '22.22.0'

      - id: scope
        if: steps.tree.outputs.run == 'true'
        env:
          CI_FULL_MATRIX: ${{ (inputs.source_ref != '' && inputs.scope != 'frontend') }}
          CI_FRONTEND_ONLY: ${{ inputs.source_ref != '' && inputs.scope == 'frontend' }}
          CI_FAST_ONLY: ${{ github.event_name == 'pull_request' }}
        run: node scripts/ci-scope.mjs HEAD^ HEAD

  plugin-metadata:
    name: plugin release contracts
    needs: [changed, file-sizes]
    if: ${{ (inputs.phase == '' || inputs.phase == 'all' || inputs.phase == 'fast') && (needs.changed.result == 'success') }}
    runs-on: [self-hosted, linux-ci]
    permissions:
      contents: read
      actions: write
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          package-manager-cache: false
          node-version: '22.22.0'
      - &select-pr-catalogue
        name: Select PR catalogue
        id: catalogue
        shell: bash
        run: |
          node scripts/test-catalogue.mjs select --tier pr --format json > "$RUNNER_TEMP/pr-catalogue.json"
          node -e 'const fs = require("node:fs"); const selected = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/pr-catalogue.json", "utf8")); fs.appendFileSync(process.env.GITHUB_OUTPUT, "commands=" + JSON.stringify(Object.fromEntries(selected.runners.map(entry => [entry.id, entry.runner]))) + "\n");'
      - run: ${{ fromJSON(steps.catalogue.outputs.commands)['plugin-release-contracts'] }}
      - run: node --test scripts/tests/plugin-releases.test.mjs scripts/tests/ci-scope.test.mjs

  plugins:
    name: plugin (${{ matrix.plugin.id }})
    needs: [changed, file-sizes]
    if: ${{ (inputs.phase == '' || inputs.phase == 'all' || inputs.phase == 'fast') && (needs.changed.outputs.plugins != '[]') }}
    runs-on: [self-hosted, linux-ci]
    permissions:
      contents: read
      actions: write
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.changed.outputs.plugins) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          package-manager-cache: false
          node-version: '22.22.0'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.32.1
          run_install: false
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - run: pnpm install --frozen-lockfile --store-dir "$RUNNER_TOOL_CACHE/pnpm-store"
      - *select-pr-catalogue
      - env:
          PLUGIN_COMMAND: ${{ fromJSON(steps.catalogue.outputs.commands)['plugin-check'] }}
          PLUGIN_ID: ${{ matrix.plugin.id }}
        shell: bash
        run: ${PLUGIN_COMMAND//<plugin-id>/"$PLUGIN_ID"}

  # Formatting is platform-independent, so it does not belong inside a platform
  # lane: gating that lane off silences the check with it, which is how 22 files
  # drifted unseen. Its own job on any free light runner, seconds long.

  file-sizes:
    name: file sizes
    needs: changed
    if: ${{ inputs.phase == '' || inputs.phase == 'all' || inputs.phase == 'fast' }}
    runs-on: [self-hosted, light]
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - name: Source file size discipline
        run: bash scripts/check-file-sizes.sh --fail

  fmt:
    name: fmt
    needs: [changed, file-sizes]
    if: ${{ (inputs.phase == '' || inputs.phase == 'all' || inputs.phase == 'fast') && (needs.changed.outputs.rust == 'true') }}
    runs-on: [self-hosted, light]
    permissions:
      contents: read
      actions: write
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          package-manager-cache: false
          node-version: '22.22.0'
      - *select-pr-catalogue
      # Light services can miss the runner user's rustup on PATH.
      - name: Ensure Rust toolchain on PATH
        run: |
          if command -v cargo >/dev/null 2>&1; then exit 0; fi
          for dir in "${CARGO_HOME:-}/bin" "$HOME/.cargo/bin" /home/*/.cargo/bin /Users/*/.cargo/bin; do
            if [ -x "$dir/cargo" ]; then echo "$dir" >> "$GITHUB_PATH"; exit 0; fi
          done
          echo "cargo not found; restore Rust on the runner" >&2
          exit 1
      - name: cargo fmt --check
        run: ${{ fromJSON(steps.catalogue.outputs.commands)['rust-fmt'] }}

  # The whole suite compiles and runs once, in place, on any free runner in the
  # rust-tests pool: shipping a nextest archive between runners cost more than the tests.
  rust-tests:
    name: rust tests (full suite)
    needs: [changed, fmt]
    if: ${{ !cancelled() && inputs.phase != 'fast' && needs.changed.outputs.heavy == 'true' && (inputs.phase == 'long' || needs.fmt.result == 'success') }}
    runs-on: [self-hosted, rust-tests]
    permissions:
      contents: read
      actions: write
    timeout-minutes: 60
    strategy:
      matrix:
        suite: [full]
    env:
      # Warm per-workspace targets outside the checkout; the cleanup step sweeps them by age.
      CI_TARGET_ROOT: ${{ github.workspace }}/../ci-targets/tests
      CODETERM_ALLOW_EXTERNAL_TARGET: '1'
    steps: &rust-test-steps
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          fetch-depth: 0
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.longpaths
          GIT_CONFIG_VALUE_0: 'true'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          package-manager-cache: false
          node-version: '22.22.0'
      - name: Prepare runner tool paths
        run: node scripts/ci-runner-paths.mjs
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.95.0
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
        with:
          tool: cargo-nextest@0.9.148
      - name: Prepare compile fixtures
        run: node scripts/ci-rust-prepare.mjs
      - name: Reset compiler capture
        continue-on-error: true
        run: node -e "require('fs').writeFileSync('ci-rust-warnings.log', '')"
      - id: target
        name: Rust target of this runner
        shell: bash
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            macOS-ARM64) triple=aarch64-apple-darwin ;;
            macOS-X64) triple=x86_64-apple-darwin ;;
            Linux-ARM64) triple=aarch64-unknown-linux-gnu ;;
            Linux-X64) triple=x86_64-unknown-linux-gnu ;;
            Windows-ARM64) triple=aarch64-pc-windows-msvc ;;
            Windows-X64) triple=x86_64-pc-windows-msvc ;;
            *) echo "::error::unsupported runner $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
          esac
          echo "triple=$triple" >> "$GITHUB_OUTPUT"
          echo "warnings=rust-warnings-tests-${{ matrix.suite }}-$RUNNER_OS-$triple" >> "$GITHUB_OUTPUT"
      - name: Compile and run ${{ matrix.suite }} Rust tests (Unix)
        if: runner.os != 'Windows'
        env:
          CI_RELEASE_TESTS: ${{ inputs.source_ref != '' }}
          RUST_WARNING_LOG: ci-rust-warnings.log
        shell: bash
        run: bash build.sh ci-tests ${{ matrix.suite }}
      - name: Compile and run ${{ matrix.suite }} Rust tests (Windows)
        if: runner.os == 'Windows'
        env:
          CI_RELEASE_TESTS: ${{ inputs.source_ref != '' }}
          RUST_WARNING_LOG: ci-rust-warnings.log
        shell: pwsh
        run: |
          & .\build.ps1 ci-tests ${{ matrix.suite }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Shared compile cache statistics (Windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          & .\build.ps1 cache-stats
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Shared compile cache statistics (Unix)
        if: always() && runner.os != 'Windows'
        shell: bash
        run: bash build.sh cache-stats
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          overwrite: true
          name: rust-receipt-${{ matrix.suite }}-${{ runner.os }}
          path: |
            ci-rust-receipts/*.json
            ci-rust-receipts/*.log
          if-no-files-found: error
      - uses: ./.github/actions/rust-warnings
        if: always()
        continue-on-error: true
        with:
          complete: ${{ job.status == 'success' }}
          platform: tests-${{ matrix.suite }}-${{ runner.os }}
          target: ${{ steps.target.outputs.triple }}
      - name: Clean compile fixtures
        if: always()
        run: node scripts/ci-rust-prepare.mjs cleanup
      - &clean-job-outputs
        name: Remove job archives and sweep old Rust targets
        if: always()
        continue-on-error: true
        run: node scripts/ci-workspace-cleanup.mjs
    outputs:
      warnings: ${{ steps.target.outputs.warnings }}

  # Each OS compiles and runs only its cfg-gated tests and the native input crates.
  rust-platform:
    name: rust platform (${{ matrix.os }})
    needs: [changed, fmt]
    if: ${{ !cancelled() && inputs.phase != 'fast' && needs.changed.outputs.heavy == 'true' && (inputs.phase == 'long' || needs.fmt.result == 'success') }}
    runs-on: [self-hosted, '${{ matrix.os }}', '${{ matrix.label }}']
    permissions:
      contents: read
      actions: write
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Include-only rows: added keys on one base combination would overwrite each other, leaving one OS.
      matrix:
        include:
          - suite: platform
            os: Linux
            label: linux-ci
          - suite: platform
            os: macOS
            label: rust-shard
          - suite: platform
            os: Windows
            label: windows-ci
    env:
      # Warm per-workspace targets outside the checkout; the cleanup step sweeps them by age.
      CI_TARGET_ROOT: ${{ github.workspace }}/../ci-targets/tests
      CODETERM_ALLOW_EXTERNAL_TARGET: '1'
    steps: *rust-test-steps

  rust-embeddings:
    name: rust embeddings
    needs: [changed, fmt]
    if: ${{ !cancelled() && inputs.phase != 'fast' && needs.changed.outputs.heavy == 'true' && (inputs.phase == 'long' || needs.fmt.result == 'success') }}
    runs-on: [self-hosted, rust-tests]
    permissions:
      contents: read
      actions: write
    timeout-minutes: 45
    strategy:
      matrix:
        suite: [embeddings]
    env:
      # Warm per-workspace targets outside the checkout; the cleanup step sweeps them by age.
      CI_TARGET_ROOT: ${{ github.workspace }}/../ci-targets/tests
      CODETERM_ALLOW_EXTERNAL_TARGET: '1'
    steps: *rust-test-steps

  rust-receipts:
    name: rust test receipts
    needs: [changed, rust-tests, rust-platform, rust-embeddings]
    if: ${{ inputs.phase != 'fast' && (always() && needs.changed.outputs.heavy == 'true') }}
    runs-on: [self-hosted, light]
    permissions:
      contents: read
      actions: write
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          package-manager-cache: false
          node-version: '22.22.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: rust-receipt-*
          path: ci-rust-receipts
          merge-multiple: true
      - name: Require every Rust test job
        env:
          TESTS_RESULT: ${{ needs.rust-tests.result }}
          PLATFORM_RESULT: ${{ needs.rust-platform.result }}
          EMBEDDINGS_RESULT: ${{ needs.rust-embeddings.result }}
        run: node -e "if (process.env.TESTS_RESULT !== 'success' || process.env.PLATFORM_RESULT !== 'success' || process.env.EMBEDDINGS_RESULT !== 'success') process.exit(1)"
      - name: One passing full suite and one passing platform subset per OS
        run: node scripts/ci-rust-tests.mjs verify ci-rust-receipts

  clippy-linux:
    name: clippy (linux)
    needs: [changed, file-sizes]
    if: ${{ (inputs.phase == '' || inputs.phase == 'all' || inputs.phase == 'fast') && (needs.changed.outputs.heavy == 'true') }}
    runs-on: [self-hosted, linux-ci]
    permissions:
      contents: read
      actions: write
    timeout-minutes: 30
    env:
      # Warm per-workspace targets outside the checkout; the cleanup step sweeps them by age.
      CI_TARGET_ROOT: ${{ github.workspace }}/../ci-targets/clippy
      CODETERM_ALLOW_EXTERNAL_TARGET: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          package-manager-cache: false
          node-version: '22.22.0'
      - name: Ensure Rust toolchain on PATH
        run: |
          if command -v cargo >/dev/null 2>&1; then exit 0; fi
          for dir in "${CARGO_HOME:-}/bin" "$HOME/.cargo/bin" /home/*/.cargo/bin /Users/*/.cargo/bin; do
            if [ -x "$dir/cargo" ]; then echo "$dir" >> "$GITHUB_PATH"; exit 0; fi
          done
          echo "cargo not found; restore Rust on the runner" >&2
          exit 1
      - name: Prepare compile stubs
        run: |
          mkdir -p dist src-tauri/bundled-cli
          [ -n "$(ls -A src-tauri/bundled-cli)" ] || touch src-tauri/bundled-cli/codeterm
      - name: Reset compiler capture
        continue-on-error: true
        run: node -e "require('fs').writeFileSync('ci-rust-warnings.log', '')"
      - name: clippy (repo gate)
        run: node scripts/collect-rust-warnings.mjs run --log ci-rust-warnings.log -- bash build.sh ci-clippy
      - uses: ./.github/actions/rust-warnings
        if: always()
        continue-on-error: true
        with:
          complete: ${{ job.status == 'success' }}
          platform: clippy-Linux
          target: x86_64-unknown-linux-gnu
      - name: Clean 0-byte stubs
        if: always()
        run: find src-tauri/bundled-cli -maxdepth 1 -type f -size 0 -delete 2>/dev/null || true
      - *clean-job-outputs

  ts-static:
    name: ts static checks
    needs: [changed, file-sizes]
    if: ${{ (inputs.phase == '' || inputs.phase == 'all' || inputs.phase == 'fast') && (needs.changed.outputs.frontend == 'true') }}
    runs-on: [self-hosted, light]
    permissions:
      contents: read
      actions: write
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          package-manager-cache: false
          node-version: '22.22.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.32.1
          run_install: false
          dest: ${{ runner.tool_cache }}/setup-pnpm

      - name: Install dependencies
        # Runners on one host share HOME; a per-runner store keeps concurrent installs apart.
        run: pnpm install --frozen-lockfile --store-dir "$RUNNER_TOOL_CACHE/pnpm-store"
      - *select-pr-catalogue
      - name: TS strict typecheck (prod build gate)
        run: ${{ fromJSON(steps.catalogue.outputs.commands)['ts-typecheck'] }}
      - name: TypeScript unused exports
        if: ${{ !cancelled() }}
        run: ${{ fromJSON(steps.catalogue.outputs.commands)['ts-unused-exports'] }}
      - name: Repository Knip report
        if: ${{ !cancelled() }}
        run: ${{ fromJSON(steps.catalogue.outputs.commands)['ts-knip-report'] }}
      # An effect that reaches the API must key on primitives; a mux-rebuilt object
      # re-runs it at broadcast rate. Five such sites shipped before this existed.
      - name: Check API effect dependencies
        if: ${{ !cancelled() }}
        run: ${{ fromJSON(steps.catalogue.outputs.commands)['ts-api-effects'] }}
      - name: Biome (TS lint)
        if: ${{ !cancelled() }}
        run: ${{ fromJSON(steps.catalogue.outputs.commands)['ts-biome'] }}

  # Windows bundles build the frontend from the gateway's subst drive, where a pnpm
  # workspace symlink can give one file two identities; nothing else runs from there.
  frontend-windows:
    name: frontend (Windows, stable path)
    needs: [changed, file-sizes]
    if: ${{ (inputs.phase == '' || inputs.phase == 'all' || inputs.phase == 'fast') && (needs.changed.outputs.frontend == 'true' || needs.changed.outputs.rust == 'true') }}
    runs-on: [self-hosted, Windows, windows-light]
    permissions:
      contents: read
    timeout-minutes: 8
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          package-manager-cache: false
          node-version: '22.22.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.32.1
          run_install: false
          dest: ${{ runner.tool_cache }}/setup-pnpm

      - *select-pr-catalogue
      # frontend-build installs through the bundle's own ensure_deps, from the mapped path.
      - name: Build the release frontend from the stable build path
        run: ${{ fromJSON(steps.catalogue.outputs.commands)['frontend-windows-build'] }}

  ts-types:
    name: ts generated types
    needs: [changed, file-sizes]
    if: ${{ (inputs.phase == '' || inputs.phase == 'all' || inputs.phase == 'fast') && (needs.changed.outputs.frontend == 'true' || needs.changed.outputs.rust == 'true') }}
    runs-on: [self-hosted, light]
    permissions:
      contents: read
      actions: write
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - name: Ensure Rust toolchain on PATH
        run: |
          if command -v cargo >/dev/null 2>&1; then exit 0; fi
          for dir in "${CARGO_HOME:-}/bin" "$HOME/.cargo/bin" /home/*/.cargo/bin /Users/*/.cargo/bin; do
            if [ -x "$dir/cargo" ]; then echo "$dir" >> "$GITHUB_PATH"; exit 0; fi
          done
          echo "cargo not found; restore Rust on the runner" >&2
          exit 1
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          package-manager-cache: false
          node-version: '22.22.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.32.1
          run_install: false
          dest: ${{ runner.tool_cache }}/setup-pnpm

      - name: Install dependencies
        # Runners on one host share HOME; a per-runner store keeps concurrent installs apart.
        run: pnpm install --frozen-lockfile --store-dir "$RUNNER_TOOL_CACHE/pnpm-store"
      - *select-pr-catalogue
      - name: Reset compiler capture
        continue-on-error: true
        run: node -e "require('fs').writeFileSync('ci-rust-warnings.log', '')"
      - name: Check Rust generated TypeScript types
        run: node scripts/collect-rust-warnings.mjs run --log ci-rust-warnings.log -- bash -c '${{ fromJSON(steps.catalogue.outputs.commands)['ts-generated-types'] }}'

      - uses: ./.github/actions/rust-warnings
        if: always()
        continue-on-error: true
        with:
          complete: ${{ job.status == 'success' }}
          platform: types-${{ runner.os }}
          target: ${{ runner.os == 'macOS' && (runner.arch == 'ARM64' && 'aarch64-apple-darwin' || 'x86_64-apple-darwin') || runner.os == 'Windows' && 'x86_64-pc-windows-msvc' || 'x86_64-unknown-linux-gnu' }}
      - *clean-job-outputs

  ts-unit:
    name: ts unit
    needs: [changed, file-sizes]
    if: ${{ (inputs.phase == '' || inputs.phase == 'all' || inputs.phase == 'fast') && (needs.changed.outputs.frontend == 'true') }}
    runs-on: [self-hosted, light]
    permissions:
      contents: read
      actions: write
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          package-manager-cache: false
          node-version: '22.22.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.32.1
          run_install: false
          dest: ${{ runner.tool_cache }}/setup-pnpm

      - name: Install dependencies
        # Runners on one host share HOME; a per-runner store keeps concurrent installs apart.
        run: pnpm install --frozen-lockfile --store-dir "$RUNNER_TOOL_CACHE/pnpm-store"
      - *select-pr-catalogue
      - name: Run TS unit tests
        run: ${{ fromJSON(steps.catalogue.outputs.commands)['ts-unit'] }}
      - name: TS unit runner contracts
        if: ${{ !cancelled() }}
        run: ${{ fromJSON(steps.catalogue.outputs.commands)['ts-unit-runner-tests'] }}

  ts-vitest:
    name: ts vitest
    needs: [changed, file-sizes]
    if: ${{ (inputs.phase == '' || inputs.phase == 'all' || inputs.phase == 'fast') && (needs.changed.outputs.frontend == 'true') }}
    runs-on: [self-hosted, light]
    permissions:
      contents: read
      actions: write
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          package-manager-cache: false
          node-version: '22.22.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.32.1
          run_install: false
          dest: ${{ runner.tool_cache }}/setup-pnpm

      - name: Install dependencies
        # Runners on one host share HOME; a per-runner store keeps concurrent installs apart.
        run: pnpm install --frozen-lockfile --store-dir "$RUNNER_TOOL_CACHE/pnpm-store"
      - *select-pr-catalogue
      # run-ts-unit-tests.mjs deliberately skips the vitest-owned files, so this
      # job is the only thing that runs them.
      # Light runners share a 16 GiB BLACKSTAR WSL VM with a heavy runner; bound the worker fanout.
      - name: Run vitest-owned TS tests
        run: ${{ fromJSON(steps.catalogue.outputs.commands)['ts-vitest'] }}

  ts-plugins:
    name: plugin bundles + tests
    needs: [changed, file-sizes]
    if: ${{ (inputs.phase == '' || inputs.phase == 'all' || inputs.phase == 'fast') && (needs.changed.outputs.rust == 'true') }}
    runs-on: [self-hosted, light]
    permissions:
      contents: read
      actions: write
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          package-manager-cache: false
          node-version: '22.22.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.32.1
          run_install: false
          dest: ${{ runner.tool_cache }}/setup-pnpm

      - name: Install dependencies
        # Runners on one host share HOME; a per-runner store keeps concurrent installs apart.
        run: pnpm install --frozen-lockfile --store-dir "$RUNNER_TOOL_CACHE/pnpm-store"
      - *select-pr-catalogue
      - name: Check generated plugin bundles
        run: ${{ fromJSON(steps.catalogue.outputs.commands)['plugin-bundles'] }}
      - name: Run plugin tests
        if: ${{ !cancelled() }}
        run: ${{ fromJSON(steps.catalogue.outputs.commands)['plugin-tests'] }}

  release-contracts:
    name: release contract tests
    needs: [changed, file-sizes]
    if: ${{ (inputs.phase == '' || inputs.phase == 'all' || inputs.phase == 'fast') && (needs.changed.outputs.rust == 'true') }}
    runs-on: [self-hosted, light]
    permissions:
      contents: read
      actions: write
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          package-manager-cache: false
          node-version: '22.22.0'
      # Release shards run tests from an archive extracted on another machine.
      - name: Archive-portable Rust test paths
        run: node scripts/check-archive-portable-test-paths.mjs

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.32.1
          run_install: false
          dest: ${{ runner.tool_cache }}/setup-pnpm

      - name: Install dependencies
        # Runners on one host share HOME; a per-runner store keeps concurrent installs apart.
        run: pnpm install --frozen-lockfile --store-dir "$RUNNER_TOOL_CACHE/pnpm-store"
      - *select-pr-catalogue
      - name: Node script tests (tests/catalogue.json node-script-tests)
        run: ${{ fromJSON(steps.catalogue.outputs.commands)['node-script-tests'] }}
      - name: Python script tests (tests/catalogue.json python-script-tests)
        if: ${{ !cancelled() }}
        run: ${{ fromJSON(steps.catalogue.outputs.commands)['python-script-tests'] }}
      - name: Offline core journey contracts
        if: ${{ !cancelled() }}
        run: ${{ fromJSON(steps.catalogue.outputs.commands)['core-journeys-offline'] }}

  rust-warnings:
    permissions:
      contents: read
      actions: write
      pull-requests: write
    needs: [changed, rust-tests, rust-platform, clippy-linux, ts-types]
    # Release calls summarise once in release.yml; a skipped scope gate has nothing to summarise.
    if: ${{ always() && inputs.source_ref == '' && needs.changed.result == 'success' }}
    uses: ./.github/workflows/rust-warnings-summary.yml
    with:
      source_ref: ${{ inputs.source_ref || github.ref }}
      report_name: ${{ format('rust-warnings-tests-{0}-report', inputs.phase || 'all') }}
      artifacts: ${{ needs.changed.outputs.heavy == 'true' && (inputs.phase == 'fast' && '["rust-warnings-clippy-Linux-x86_64-unknown-linux-gnu"]' || inputs.phase == 'long' && format('["{0}","rust-warnings-tests-platform-macOS-aarch64-apple-darwin","rust-warnings-tests-platform-Linux-x86_64-unknown-linux-gnu","rust-warnings-tests-platform-Windows-x86_64-pc-windows-msvc"]', needs.rust-tests.outputs.warnings) || format('["{0}","rust-warnings-tests-platform-macOS-aarch64-apple-darwin","rust-warnings-tests-platform-Linux-x86_64-unknown-linux-gnu","rust-warnings-tests-platform-Windows-x86_64-pc-windows-msvc","rust-warnings-clippy-Linux-x86_64-unknown-linux-gnu"]', needs.rust-tests.outputs.warnings)) || '[]' }}
