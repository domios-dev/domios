name: Release Linux arm64
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      source_ref:
        required: true
        type: string
      mirror:
        required: true
        type: boolean
      dry_run:
        required: false
        default: false
        type: boolean
      frontend_sha256:
        description: Digest of the run's single frontend bundle; empty builds the frontend here
        required: false
        default: ""
        type: string
permissions:
  contents: read
  actions: read

env:
  CODETERM_SCCACHE_CREDENTIAL_SOURCE: runner

jobs:
  build:
    name: build (aarch64-unknown-linux-gnu)
    # One hosted arm64 job compiles, signs, smokes and publishes; release signing secrets live in the release environment.
    runs-on: ubuntu-24.04-arm
    if: ${{ (github.repository_owner == 'rollacode' || github.repository_owner == 'domios-dev') && github.actor == 'rollacode' && github.triggering_actor == 'rollacode' && (((startsWith(github.ref, 'refs/heads/release/') || startsWith(github.head_ref, 'release/')) && (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')) || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.path == '.github/workflows/tests.yml' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.actor.login == 'rollacode' && github.event.workflow_run.triggering_actor.login == 'rollacode' && startsWith(github.event.workflow_run.head_branch, 'release/'))) }}
    environment: release
    timeout-minutes: 120
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
      CI_STORE_LAN_ENDPOINT: ${{ secrets.CI_STORE_LAN_ENDPOINT }}
      CI_STORE_PUBLIC_ENDPOINT: ${{ secrets.CI_STORE_PUBLIC_ENDPOINT }}
      DOMIOS_FIREBASE_API_KEY: ${{ secrets.DOMIOS_FIREBASE_API_KEY }}
      DOMIOS_FIREBASE_PROJECT_ID: ${{ secrets.DOMIOS_FIREBASE_PROJECT_ID }}
      DOMIOS_FIREBASE_APP_ID: ${{ secrets.DOMIOS_FIREBASE_APP_ID }}
      DOMIOS_ACCOUNT_REDEEM_URL: ${{ secrets.DOMIOS_ACCOUNT_REDEEM_URL }}
      DOMIOS_BILLING_FUNCTIONS_URL: ${{ secrets.DOMIOS_BILLING_FUNCTIONS_URL }}
      DOMIOS_AMPLITUDE_API_KEY_TEST: ${{ secrets.DOMIOS_AMPLITUDE_API_KEY_TEST }}
      DOMIOS_AMPLITUDE_API_KEY_PROD: ${{ secrets.DOMIOS_AMPLITUDE_API_KEY_PROD }}
      CODETERM_SCCACHE_CREDENTIAL_SOURCE: runner
      GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
      CODETERM_SCCACHE_VERIFY_ONLY: "1"
      ASSET_SCOPE: linux-aarch64
      ART: ${{ github.workspace }}/release-artifacts/linux-arm64
    steps:
      - name: Use the runner bundled Node
        if: runner.environment == 'self-hosted'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |-
            const path = require('node:path');
            core.addPath(path.dirname(process.execPath));
            core.info('Using runner Node ' + process.version);
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          package-manager-cache: false
          node-version: 22.22.0
        if: runner.environment == 'github-hosted'
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
        if: runner.environment == 'github-hosted'
      - name: Parse + validate version
        id: ver
        run: |
          TAG="${{ inputs.tag }}"
          RAW="${TAG#v}"
          echo "raw=$RAW"
          if ! echo "$RAW" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag must be vX.Y.Z (got '$TAG')"; exit 1
          fi
          echo "ver=$RAW"   >> "$GITHUB_OUTPUT"
          echo "tag=v$RAW"  >> "$GITHUB_OUTPUT"
      - name: Checkout repo (full history + tags)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1
      - name: Discover installed runner tools
        if: runner.environment == 'self-hosted'
        run: node scripts/ci-runner-paths.mjs --paths-only
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.32.1
          run_install: false
          dest: ${{ runner.tool_cache }}/setup-pnpm
        if: runner.environment == 'github-hosted'
      - name: Runner preflight
        run: node scripts/ci-runner-paths.mjs finalize
      - name: Reset compiler capture
        continue-on-error: true
        run: node -e "require('fs').writeFileSync('ci-rust-warnings.log', '')"
      - name: Compile release bundles natively
        id: compile
        uses: ./.github/actions/arm64-compile
        with:
          tag: ${{ inputs.tag }}
          source_ref: ${{ inputs.source_ref }}
          target: aarch64-unknown-linux-gnu
          frontend_sha256: ${{ inputs.frontend_sha256 }}
      - name: Clear incomplete release uploads for retry
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          MIRROR_TOKEN: ${{ secrets.PACKAGE_REPOS_TOKEN }}
          PUBLISH_MIRROR: ${{ inputs.mirror }}
          TAG: ${{ inputs.tag }}
          SOURCE_REPO: ${{ github.repository }}
        run: |
          node scripts/release-clear-wedged-assets.mjs "$SOURCE_REPO" "$TAG" "$ASSET_SCOPE"
          if [ "$PUBLISH_MIRROR" = true ]; then
            GH_TOKEN="$MIRROR_TOKEN" node scripts/release-clear-wedged-assets.mjs rollacode/codeterm-releases "$TAG" "$ASSET_SCOPE"
          fi
      - name: Verify the frozen stage and smoke Linux arm64 natively
        run: |-
          set -euo pipefail
          cp "$RUNNER_TEMP/arm64-handoff.tar" arm64-handoff.tar
          node scripts/collect-rust-warnings.mjs run --log ci-rust-warnings.log -- bash -euo pipefail -c '
              node scripts/release-arm64-handoff.mjs unpack aarch64-unknown-linux-gnu "${{ inputs.tag }}" "${{ inputs.source_ref }}" arm64-handoff.tar "${{ steps.compile.outputs.sha256 }}"
              node scripts/release-bundle-smoke.mjs linux src-tauri/target/aarch64-unknown-linux-gnu/release/bundle "${{ inputs.source_ref }}" arm64
            '
          mkdir -p "$ART/out"
          cp src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/deb/*.deb "$ART/out/"
          cp src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/appimage/*.AppImage "$ART/out/"
          cp release-artifacts/domios-headless-* "$ART/out/"
      - name: Verify compiled analytics production key
        run: node scripts/check-release-analytics-key.mjs target/domios-package/domios-server/domios-server
      - name: Frozen signer dependencies
        run: pnpm install --frozen-lockfile
      - name: Import temporary release signing material
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: python3 scripts/release-signing-material.py linux
      - name: Sign Linux updater bundles
        run: |
          for bundle in "$ART"/out/*.AppImage "$ART"/out/*.deb; do
            env -u TAURI_SIGNING_PRIVATE_KEY pnpm tauri signer sign --app-version "${{ steps.ver.outputs.ver }}" "$bundle"
          done

          node scripts/release-arm64-handoff.mjs verify aarch64-unknown-linux-gnu "${{ inputs.tag }}" "${{ inputs.source_ref }}" "$ART/out"
      - name: Verify updater signatures (including dry run)
        env:
          RELEASE_VERIFY_ONLY: "true"
          SOURCE_SHA: ${{ inputs.source_ref }}
        run: node scripts/release-publish-platform.mjs "${{ inputs.tag }}" "$ASSET_SCOPE" "$ART/out"
      - name: Retain private dry-run updater evidence
        if: ${{ inputs.dry_run }}
        run: node scripts/release-dry-run-manifest.mjs capture "${{ inputs.tag }}" "${{ inputs.source_ref }}" "$GITHUB_RUN_ID" "$ASSET_SCOPE" "$ART/out" "$ART/out" "$RUNNER_TEMP/dry-run-$ASSET_SCOPE"
      - name: Verify and publish platform assets and updater fragment
        if: ${{ !inputs.dry_run }}
        env:
          SOURCE_SHA: ${{ inputs.source_ref }}
          PUBLISH_PUBLIC_MIRROR: ${{ inputs.mirror }}
          MIRROR_TOKEN: ${{ secrets.PACKAGE_REPOS_TOKEN }}
        run: node scripts/release-publish-platform.mjs "${{ inputs.tag }}" "$ASSET_SCOPE" "$ART/out"
      - name: Clean up temporary release signing material
        if: always()
        run: python3 scripts/release-signing-material.py cleanup
      - uses: ./.github/actions/rust-warnings
        if: always()
        continue-on-error: true
        with:
          complete: ${{ job.status == 'success' }}
          platform: release-Linux
          target: aarch64-unknown-linux-gnu
      - name: Upload artifacts spooled while the private store was unreachable
        if: always()
        uses: ./.github/actions/ci-artifact-spool
      - name: Retain the frozen stage proof
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-stage-aarch64-unknown-linux-gnu-${{ github.run_attempt }}
          path: |-
            release-artifacts/hosted-handoff-aarch64-unknown-linux-gnu.json
            release-artifacts/common-stage/aarch64-unknown-linux-gnu/headless-stage.json
          if-no-files-found: error
          retention-days: 7
      - name: Remove this job's Rust targets and archives
        if: always()
        continue-on-error: true
        run: node scripts/ci-workspace-cleanup.mjs
