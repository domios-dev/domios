name: Docker headless archive smoke
# Owner dispatch only: the production-profile build needs the build configuration, which no PR job may receive.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-docker-smoke
  cancel-in-progress: true
jobs:
  smoke:
    if: ${{ (github.repository_owner == 'rollacode' || github.repository_owner == 'domios-dev') && github.actor == 'rollacode' && github.triggering_actor == 'rollacode' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release/next' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            release_arch: x86_64
            target: x86_64-unknown-linux-gnu
            runner: ${{ vars.CI_LINUX_LIGHT_RUNNER || '"ubuntu-24.04"' }}
          - arch: arm64
            release_arch: aarch64
            target: aarch64-unknown-linux-gnu
            runner: ${{ vars.CI_LINUX_ARM64_RUNNER || '"ubuntu-24.04-arm"' }}
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 120
    env:
      DOMIOS_DOCKER_SMOKE: "1"
      DOMIOS_FIREBASE_API_KEY: ${{ secrets.DOMIOS_FIREBASE_API_KEY }}
      DOMIOS_FIREBASE_PROJECT_ID: ${{ secrets.DOMIOS_FIREBASE_PROJECT_ID }}
      DOMIOS_FIREBASE_APP_ID: ${{ secrets.DOMIOS_FIREBASE_APP_ID }}
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.22.0
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          version: 10.32.1
          run_install: false
      - name: Install pinned Rust and native headless dependencies
        run: |
          rustup show active-toolchain
          rustup target add "$CARGO_BUILD_TARGET"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev libdbus-1-dev minisign
      - name: Prepare runner Buildx
        run: |
          docker buildx version
          docker buildx create --use --name domios-smoke --driver docker-container
      - name: Verify the pinned public updater key
        run: |
          python3 - <<'PY'
          import base64, json, pathlib
          config = json.loads(pathlib.Path('src-tauri/tauri.conf.json').read_text())
          assert pathlib.Path('packaging/docker/release.pub').read_bytes() == base64.b64decode(config['plugins']['updater']['pubkey'])
          PY
      - name: Build production-profile headless archive from this checkout
        run: bash ./build.sh docker-smoke-inputs
      - name: Build, start, prove health and update refusal, clean up
        env:
          ARCH: ${{ matrix.arch }}
          RELEASE_ARCH: ${{ matrix.release_arch }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          archive="target/docker-smoke/archives/domios-headless-v$version-linux-$RELEASE_ARCH.tar.gz"
          read -r checksum filename < "$archive.sha256"
          bash scripts/docker/smoke.sh "$version" "$ARCH" "$archive" "$checksum"
      - name: Remove smoke builder
        if: always()
        run: docker buildx rm --force domios-smoke
