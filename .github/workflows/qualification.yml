  rust-windows-task-local:
    name: Rust Windows task boundary
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.evaluator_scope == 'rust-windows-task-local' }}
    runs-on: [self-hosted, windows-build]
    timeout-minutes: 50
    env:
      EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
      WORKFLOW_SOURCE_SHA: ${{ github.workflow_sha }}
      EVENT_SOURCE_SHA: ${{ github.sha }}
      TASK_BOUNDARY: ${{ inputs.rust_boundary }}
      CACHE_SESSION_OPT_IN: ${{ inputs.cache_session_opt_in }}
      RUST_BACKTRACE: '1'
      RUST_TEST_NOCAPTURE: '1'
      CARGO_TERM_COLOR: never
      TEST_CAP_SECS: '600'
    steps:
      - name: Set bounded task cache session deadline
        shell: pwsh
        run: |
          $deadlineTicks = [Diagnostics.Stopwatch]::GetTimestamp() + [long](2940000 * [Diagnostics.Stopwatch]::Frequency / 1000)
          "CACHE_SESSION_DEADLINE_TICKS=$deadlineTicks" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/checkout@v5
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.longpaths
          GIT_CONFIG_VALUE_0: 'true'
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Run fixed task boundary and retain raw outcomes
        id: task_boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $receiptDir = Join-Path $env:RUNNER_TEMP ('rust-windows-task-local-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          if (Test-Path -LiteralPath $receiptDir) { throw 'receipt_directory_already_exists' }
          New-Item -ItemType Directory -Path $receiptDir | Out-Null
          'fresh_receipt_directory=true' | Out-File -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $receipt = [ordered]@{
            boundary = $env:TASK_BOUNDARY; expected_sha = $env:EXPECTED_SOURCE_SHA
            workflow_sha = $env:WORKFLOW_SOURCE_SHA; event_sha = $env:EVENT_SOURCE_SHA
            checkout_sha = $null; runner = $env:RUNNER_NAME; os = $env:RUNNER_OS
            arch = $env:RUNNER_ARCH; powershell = $PSVersionTable.PSVersion.ToString()
            run_id = $env:GITHUB_RUN_ID; run_attempt = $env:GITHUB_RUN_ATTEMPT
            phase = 'preflight'; outcome = 'unqualified'; error = $null
            cases = @(); inputs = @(); conpty_identity = 'unproven; inspect complete native logs'
          }
          function Write-TaskLocalReceipt {
            $receipt | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath (Join-Path $receiptDir 'receipt.json') -Encoding utf8
          }
          function Resolve-InstalledTaskSccache {
            $resolution = [ordered]@{ candidates = @(); selected = $null; other_tools = @(); authenticity = 'unproven'; server = 'not_checked' }
            $receipt.sccache_resolution = $resolution
            $existing = Get-Command sccache -CommandType Application -ErrorAction SilentlyContinue | Select-Object -First 1
            $paths = @()
            if ($existing) {
              $paths += @{ origin = 'PATH'; path = $existing.Path }
            } else {
              foreach ($root in @(@{ origin = 'CARGO_HOME'; value = $env:CARGO_HOME; suffix = 'bin\sccache.exe' }, @{ origin = 'USERPROFILE'; value = $env:USERPROFILE; suffix = '.cargo\bin\sccache.exe' })) {
                if (-not $root.value) {
                  $resolution.candidates += @{ origin = $root.origin; path = $null; state = 'root_unset' }
                  continue
                }
                if ($root.value -notmatch '^[A-Za-z]:[\\/]' -or $root.value.Contains('..')) { throw 'sccache_candidate_root_not_absolute_local' }
                $path = [IO.Path]::GetFullPath((Join-Path $root.value $root.suffix))
                if (-not @($paths | Where-Object { $_.path -ieq $path }).Count) { $paths += @{ origin = $root.origin; path = $path } }
              }
            }
            $found = @()
            foreach ($candidate in $paths) {
              $fact = [ordered]@{ origin = $candidate.origin; path = $candidate.path; state = 'inspecting' }
              $resolution.candidates += $fact
              if (-not (Test-Path -LiteralPath $candidate.path)) { $fact.state = 'missing'; continue }
              $item = Get-Item -LiteralPath $candidate.path -Force
              if ($item.PSIsContainer) { $fact.state = 'directory'; throw 'sccache_candidate_is_directory' }
              $fact.size = $item.Length
              $fact.sha256 = (Get-FileHash -LiteralPath $candidate.path -Algorithm SHA256).Hash
              $fact.state = 'file'
              $found += $fact
            }
            if ($found.Count -ne 1) { throw 'sccache_missing_or_ambiguous_in_allowed_locations' }
            $selected = $found[0]
            foreach ($name in @('rustup', 'rustc', 'cargo', 'node')) {
              $resolution.other_tools += @{ name = $name; before = (Get-Command $name -CommandType Application -ErrorAction Stop | Select-Object -First 1).Path }
            }
            if (-not $existing) { $env:PATH += ';' + (Split-Path -Parent $selected.path) }
            $resolved = (Get-Command sccache -CommandType Application -ErrorAction Stop | Select-Object -First 1).Path
            if ($resolved -ine $selected.path) { throw 'sccache_resolution_changed' }
            foreach ($tool in $resolution.other_tools) {
              $tool.after = (Get-Command $tool.name -CommandType Application -ErrorAction Stop | Select-Object -First 1).Path
              if ($tool.before -ine $tool.after) { throw 'sccache_path_changed_other_tool' }
            }
            $resolution.selected = $selected
          }
          function Resolve-TaskLocalBoundary {
            if ($env:TASK_BOUNDARY -eq 'lookout-green') {
              return @(
                @{
                  selector = 'sentinel::probe::tests::'; mode = 'green'; owner = 'lookout'
                  log_stem = 'lookout-sentinel-probe-controls'; expected_module = 'sentinel::probe::tests::'
                  expected_suffixes = @(
                    'sentinel_probe_owner_retirement_refuses_signal'
                    'sentinel_probe_windows_assigns_before_resume'
                    'sentinel_probe_capture_failure_cannot_return_output'
                    'sentinel_probe_original_deadline_is_not_renewed'
                    'sentinel_probe_owner_capacity_refuses_before_spawn'
                    'sentinel_probe_owner_close_refuses_and_requests_cleanup'
                    'sentinel_probe_owner_drop_closes_without_retained_arc_cycle'
                    'sentinel_probe_owner_signalled_event_releases_exact_slot'
                    'sentinel_probe_owner_unresolved_slot_does_not_starve_settled_slot'
                    'sentinel_probe_owner_callback_observes_state_without_owner_lock'
                    'sentinel_probe_windows_permanent_close_uncertainty_is_retained'
                  )
                }
                @{
                  selector = 'sentinel_probe_native_'; mode = 'green'; owner = 'lookout'
                  log_stem = 'lookout-sentinel-probe-native'; expected_module = 'sentinel::probe::native_tests::'
                  expected_suffixes = @(
                    'sentinel_probe_native_success_and_nonzero'
                    'sentinel_probe_native_output_is_bounded_and_drained'
                    'sentinel_probe_native_windows_preexecution_containment'
                    'sentinel_probe_native_cancelled_capture_settles'
                  )
                }
              )
            }
            if ($env:TASK_BOUNDARY -notmatch '^(cantor|auditor|both)-(red|green)$') { throw 'invalid_task_boundary' }
            $pair = $Matches[1]
            $mode = $Matches[2]
            $cases = @()
            if ($pair -in @('cantor', 'both')) {
              $cases += @{ selector = 'rebind_establishes_a_first_binding_from_the_tabs_own_nonce'; mode = 'green'; owner = 'cantor' }
              $cases += @{ selector = 'attempt_binding_restore_existing_rebind_rpc_restores_current_attempt_for_real_skill_read'; mode = $mode; owner = 'cantor' }
            }
            if ($pair -in @('auditor', 'both')) {
              $cases += @{ selector = 'post_launch_idle_planner_answers_onboarding_and_owner_prompt_is_not_auto_answered'; mode = 'green'; owner = 'auditor' }
              $cases += @{ selector = 'supporter_first_opinion_safe_response_qualified_static_onboarding_planner_completion'; mode = $mode; owner = 'auditor' }
            }
            return $cases
          }
          function Read-TaskLocalLibtestReceipt($row, $text) {
            $summaries = [regex]::Matches($text, '(?m)^test result: (ok|FAILED)\. (\d+) passed; (\d+) failed; (\d+) ignored; (\d+) measured; (\d+) filtered out; finished in ([0-9.]+)s\r?$')
            $results = [regex]::Matches($text, '(?m)^test ([A-Za-z0-9_:]+) \.\.\. (ok|FAILED|ignored)\r?$')
            $row.passed = 0; $row.failed = 0; $row.ignored = 0; $row.filtered_out = 0
            $row.measured = 0
            $row.libtest_seconds = 0.0
            foreach ($summary in $summaries) {
              $row.passed += [int]$summary.Groups[2].Value
              $row.failed += [int]$summary.Groups[3].Value
              $row.ignored += [int]$summary.Groups[4].Value
              $row.measured += [int]$summary.Groups[5].Value
              $row.filtered_out += [int]$summary.Groups[6].Value
              $row.libtest_seconds += [double]::Parse($summary.Groups[7].Value, [Globalization.CultureInfo]::InvariantCulture)
              if ($row.measured -ne 0) { throw 'unexpected_measured_cases' }
            }
            $row.selected = $row.passed + $row.failed + $row.ignored
            $row.function_results = @($results | ForEach-Object { $_.Value })
            if ($row.owner -eq 'lookout') {
              $row.actual_tests = @($results | ForEach-Object {
                $fullName = $_.Groups[1].Value
                $suffix = $null
                if ($fullName.StartsWith($row.expected_module, [StringComparison]::Ordinal)) {
                  $suffix = $fullName.Substring($row.expected_module.Length)
                }
                [ordered]@{ full_name = $fullName; suffix = $suffix; outcome = $_.Groups[2].Value }
              })
              if ($summaries.Count -ne 1) { throw 'lookout_summary_count_mismatch' }
              if ($summaries[0].Groups[1].Value -cne 'ok' -or $row.exit_code -ne 0) { throw 'lookout_raw_process_or_summary_failure' }
              if ($row.selector -ceq 'sentinel::probe::tests::') {
                $expectedCount = 11
                $expectedModule = 'sentinel::probe::tests::'
              } elseif ($row.selector -ceq 'sentinel_probe_native_') {
                $expectedCount = 4
                $expectedModule = 'sentinel::probe::native_tests::'
              } else {
                throw 'lookout_selector_unknown'
              }
              if ($row.expected_module -cne $expectedModule -or $row.expected_suffixes.Count -ne $expectedCount -or $row.expected_full_names.Count -ne $expectedCount) { throw 'lookout_expected_receipt_invalid' }
              if (@($row.expected_suffixes | Select-Object -Unique).Count -ne $expectedCount) { throw 'lookout_duplicate_expected_suffix' }
              if ($row.selected -ne $expectedCount -or $row.passed -ne $expectedCount -or $row.failed -ne 0 -or $row.ignored -ne 0 -or $row.measured -ne 0 -or $row.actual_tests.Count -ne $expectedCount) { throw 'lookout_selection_counts_mismatch' }
              $actualFullNames = @($row.actual_tests | ForEach-Object { $_.full_name })
              if (@($actualFullNames | Select-Object -Unique).Count -ne $actualFullNames.Count) { throw 'lookout_duplicate_full_name' }
              foreach ($actual in $row.actual_tests) {
                if ($row.expected_full_names -cnotcontains $actual.full_name -or $actual.outcome -cne 'ok') { throw 'lookout_unknown_or_failed_test' }
              }
              foreach ($expectedSuffix in $row.expected_suffixes) {
                if (@($row.actual_tests | Where-Object { $_.suffix -ceq $expectedSuffix -and $_.outcome -ceq 'ok' }).Count -ne 1) { throw 'lookout_suffix_missing_duplicate_or_not_ok' }
              }
              $row.outcome = 'passed'
              return
            }
            if ($summaries.Count -ne 1 -or $results.Count -ne 1 -or $row.selected -ne 1 -or $row.ignored -ne 0) { throw 'unqualified_test_selection' }
            if ($results[0].Groups[1].Value -notmatch ('::' + [regex]::Escape($row.selector) + '$')) { throw 'unexpected_selected_function' }
            if ($row.mode -eq 'green') {
              if ($row.exit_code -ne 0 -or $row.passed -ne 1 -or $results[0].Groups[2].Value -ne 'ok') { throw 'unexpected_green_failure' }
              $row.outcome = 'passed'
            } else {
              if ($row.exit_code -ne 101 -or $row.failed -ne 1 -or $results[0].Groups[2].Value -ne 'FAILED') { throw 'unexpected_red_outcome' }
              $predicate = if ($row.owner -eq 'cantor') { 'plan skill caller does not identify exactly one current attempt' } else { 'PTY output event did not arrive before the failure deadline' }
              if (-not $text.Contains($predicate)) { throw 'unexpected_red_predicate' }
              $row.predicate = $predicate
              $row.outcome = 'red_candidate'
              $row.causal_judgment = 'pending complete log and exact source review; timeout alone is insufficient'
            }
          }
          function Invoke-TaskLocalCase($case) {
            $logName = if ($case.owner -eq 'lookout') { $case.log_stem } else { $case.selector }
            $logPath = Join-Path $receiptDir ($logName + '.log')
            $row = [ordered]@{
              selector = $case.selector; owner = $case.owner; mode = $case.mode
              command = @($pwsh, '-NoProfile', '-File', '.\build.ps1', 'test-one', 'app', $case.selector)
              phase = 'running'; outcome = 'unqualified'; exit_code = $null
              wall_seconds = $null; log = $logPath
            }
            if ($case.owner -eq 'lookout') {
              $row.expected_module = $case.expected_module
              $row.expected_suffixes = @($case.expected_suffixes)
              $row.expected_full_names = @($case.expected_suffixes | ForEach-Object { $case.expected_module + $_ })
            }
            $receipt.cases += $row
            Write-TaskLocalReceipt
            $watch = [Diagnostics.Stopwatch]::StartNew()
            try {
              & $pwsh -NoProfile -File .\build.ps1 test-one app $case.selector > $logPath 2>&1
              $row.exit_code = $LASTEXITCODE
            } finally {
              $watch.Stop()
              $row.wall_seconds = $watch.Elapsed.TotalSeconds
              $row.phase = 'returned'
              Write-TaskLocalReceipt
            }
            $text = [IO.File]::ReadAllText($logPath)
            $row.log_sha256 = (Get-FileHash -LiteralPath $logPath -Algorithm SHA256).Hash
            Write-Host $text
            Read-TaskLocalLibtestReceipt $row $text
            Write-TaskLocalReceipt
          }
          $exitCode = 1
          $cacheSession = $null
          try {
            $cases = @(Resolve-TaskLocalBoundary)
            $head = (& git rev-parse HEAD).Trim()
            if ($LASTEXITCODE -ne 0) { throw 'checkout_identity_unavailable' }
            $receipt.checkout_sha = $head
            if ($env:EXPECTED_SOURCE_SHA -cnotmatch '^[0-9a-f]{40}$' -or $head -cne $env:EXPECTED_SOURCE_SHA -or $head -cne $env:WORKFLOW_SOURCE_SHA -or $head -cne $env:EVENT_SOURCE_SHA) { throw 'source_identity_mismatch' }
            $status = @(& git status --porcelain)
            if ($LASTEXITCODE -ne 0 -or $status.Count -ne 0) { throw 'dirty_checkout' }
            if (Test-Path -LiteralPath '.env') { throw 'ambient_dotenv_refused' }
            $liveBindings = @(Get-ChildItem Env: | Where-Object { $_.Name -match '^CODETERM_' -and $_.Name -ne 'CODETERM_EMBED_CACHE_DIR' -and $_.Value })
            if ($liveBindings.Count -ne 0 -or $env:CARGO_TARGET_DIR -or $env:CARGO_TEST_CMD -or $env:CARGO_TEST_BUILD_CMD) { throw 'ambient_test_or_instance_override_refused' }
            $psDir = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0'
            if (-not (Test-Path -LiteralPath (Join-Path $psDir 'powershell.exe'))) { throw 'windows_powershell_missing' }
            $env:PATH = $psDir + ';' + $env:PATH
            if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
              $rustBins = @()
              if ($env:CARGO_HOME) { $rustBins += Join-Path $env:CARGO_HOME 'bin' }
              if ($env:USERPROFILE) { $rustBins += Join-Path $env:USERPROFILE '.cargo\bin' }
              $rustBin = $rustBins | Where-Object { Test-Path -LiteralPath (Join-Path $_ 'rustup.exe') } | Select-Object -First 1
              if (-not $rustBin) { throw 'installed_rust_path_missing' }
              $env:PATH = $rustBin + ';' + $env:PATH
            }
            foreach ($tool in @('rustc', 'cargo', 'node')) { Get-Command $tool -CommandType Application -ErrorAction Stop | Out-Null }
            if ($env:CACHE_SESSION_OPT_IN -ne 'true') { Resolve-InstalledTaskSccache }
            $bashPaths = @("$env:ProgramFiles\Git\bin\bash.exe", "$env:ProgramFiles\Git\usr\bin\bash.exe", "${env:ProgramFiles(x86)}\Git\bin\bash.exe", 'C:\msys64\usr\bin\bash.exe')
            if (-not @($bashPaths | Where-Object { Test-Path -LiteralPath $_ }).Count) { throw 'installed_bash_missing' }
            $pwsh = (Get-Process -Id $PID).Path
            if (-not $pwsh -or -not (Test-Path -LiteralPath $pwsh)) { throw 'current_powershell_path_missing' }
            $receipt.powershell_path = $pwsh
            $receipt.powershell_sha256 = (Get-FileHash -LiteralPath $pwsh -Algorithm SHA256).Hash
            $receipt.rustc = @(& rustc -vV)
            if ($LASTEXITCODE -ne 0) { throw 'rustc_identity_failed' }
            $receipt.cargo = @(& cargo --version)
            if ($LASTEXITCODE -ne 0) { throw 'cargo_identity_failed' }
            $receipt.node = @(& node --version)
            if ($LASTEXITCODE -ne 0) { throw 'node_identity_failed' }
            $paths = @('.github/workflows/tests.yml', 'build.ps1', 'build.sh', 'scripts/test-capped.sh')
            if ($cases.owner -contains 'cantor') { $paths += @('src-tauri/src/socket/server/plan_mode/attempt_binding/tests.rs', 'src-tauri/src/service/plan_authority/tests.rs') }
            if ($cases.owner -contains 'auditor') { $paths += @('src-tauri/src/service/supporter_tab_state/safe_response/qualified_tests.rs', 'src-tauri/src/service/directory_trust/tests.rs') }
            if ($cases.owner -contains 'lookout') {
              $paths += @(
                'src-tauri/Cargo.toml'
                'src-tauri/src/sentinel/probe.rs'
                'src-tauri/src/sentinel/probe/capture.rs'
                'src-tauri/src/sentinel/probe/native_tests.rs'
                'src-tauri/src/sentinel/probe/owner.rs'
                'src-tauri/src/sentinel/probe/process.rs'
                'src-tauri/src/sentinel/probe/tests.rs'
                'src-tauri/src/sentinel/probe/unix.rs'
                'src-tauri/src/sentinel/probe/windows.rs'
                'src-tauri/src/sentinel/scheduler.rs'
              )
            }
            foreach ($path in $paths) { $receipt.inputs += @{ path = $path; sha256 = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash } }
            if ($env:CACHE_SESSION_OPT_IN -eq 'true') {
              if ($env:CACHE_SESSION_DEADLINE_TICKS -notmatch '^\d+$') { throw 'cache_session_deadline_missing' }
              . .\scripts\windows-sccache-session.ps1 -Library
              $cacheSession = Start-WindowsSccacheSession -DeadlineTicks ([long]$env:CACHE_SESSION_DEADLINE_TICKS) -ArtifactFresh $true
            }
            $receipt.phase = 'tests'
            foreach ($case in $cases) { Invoke-TaskLocalCase $case }
            $receipt.phase = 'source_readback'
            & git diff --exit-code HEAD -- > (Join-Path $receiptDir 'source-after.diff')
            if ($LASTEXITCODE -ne 0) { throw 'tracked_source_changed' }
            if ((& git rev-parse HEAD).Trim() -cne $head -or $LASTEXITCODE -ne 0) { throw 'checkout_changed' }
            $receipt.outcome = if ($env:TASK_BOUNDARY.EndsWith('-red')) { 'red_candidates_require_review' } else { 'passed' }
            $receipt.phase = 'complete'
            if ($receipt.outcome -eq 'passed') { $exitCode = 0 }
          } catch {
            $receipt.error = $_.Exception.Message
            Write-Host ('Task boundary refused: ' + $receipt.error)
          } finally {
            if ($cacheSession) {
              try {
                $cleanup = Stop-WindowsSccacheSession $cacheSession $receipt.error $false
                $receipt.cache_session = @{ outcome = $cacheSession.Receipt.outcome; termination = $cleanup.TerminationKind; terminate_job_result = $cleanup.TerminateResult; receipt = $cleanup.ReceiptPath; errors = $cleanup.Errors }
                if (-not $cleanup.Success) { $receipt.outcome = 'unqualified'; $exitCode = 1 }
              } catch {
                $receipt.cache_session = @{ outcome = 'unqualified'; cleanup_error = $_.Exception.GetType().Name }
                if (-not $receipt.error) { $receipt.error = 'cache_session_cleanup_unconfirmed' }
                $receipt.outcome = 'unqualified'; $exitCode = 1
              }
            }
            $receipt.source_after = @(& git status --porcelain)
            $receipt.source_readback_exit = $LASTEXITCODE
            & git diff HEAD -- > (Join-Path $receiptDir 'source-after.diff')
            if ($LASTEXITCODE -ne 0 -or $receipt.source_readback_exit -ne 0 -or $receipt.source_after.Count -ne 0) {
              $receipt.outcome = 'unqualified'
              $receipt.source_error = 'source_readback_failed_or_checkout_changed'
              $exitCode = 1
            }
            Write-TaskLocalReceipt
          }
          exit $exitCode
      - name: Retain complete task boundary evidence
        if: ${{ always() && steps.task_boundary.outputs.fresh_receipt_directory == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: rust-windows-task-local-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/rust-windows-task-local-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error

  sentinel-command-linux:
    name: Sentinel command native qualification (Linux)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.evaluator_scope == 'sentinel-command-linux' }}
    runs-on: [self-hosted, linux-build]
    timeout-minutes: 30
    env:
      EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
      WORKFLOW_SOURCE_SHA: ${{ github.workflow_sha }}
      TEST_CAP_SECS: '600'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          package-manager-cache: false
          node-version: '22.22.0'
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify exact source and run five native controls
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SOURCE_SHA" ]]
          [[ "$GITHUB_SHA" == "$EXPECTED_SOURCE_SHA" ]]
          [[ "$WORKFLOW_SOURCE_SHA" == "$EXPECTED_SOURCE_SHA" ]]
          [[ -z "$(git status --porcelain)" ]]
          receipt_dir="$RUNNER_TEMP/sentinel-command-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -- "$receipt_dir"
          git rev-parse HEAD > "$receipt_dir/source.txt"
          date -u +%FT%TZ > "$receipt_dir/started.txt"
          set +e
          ./build.sh test-one app sentinel_command_native_ 2>&1 | tee "$receipt_dir/native.log"
          result=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$result" > "$receipt_dir/exit-code.txt"
          date -u +%FT%TZ > "$receipt_dir/finished.txt"
          git status --porcelain > "$receipt_dir/status-after.txt"
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SOURCE_SHA" ]]
          [[ "$result" == 0 ]]
          python3 - "$receipt_dir/native.log" <<'PY'
          import re
          import sys
          from pathlib import Path
          text = Path(sys.argv[1]).read_text()
          prefix = 'sentinel::command_native_tests::sentinel_command_native_'
          expected = {
              prefix + suffix for suffix in (
                  'finite_actual_zero_nonzero_stdout_stderr',
                  'precancel_refuses_before_side_effect_and_owner_admission',
                  'cancel_during_capture_settles_exact_owned_resources',
                  'cancel_after_eof_wakes_parent_wait_and_settles',
                  'owner_shutdown_wakes_active_wait',
              )
          }
          actual = re.findall(r'^test (\S+) \.\.\. ok$', text, re.M)
          if len(actual) != 5 or set(actual) != expected:
              raise SystemExit(f'Unexpected native inventory: {actual!r}')
          summaries = re.findall(r'test result: (\w+)\. (\d+) passed; (\d+) failed; (\d+) ignored;', text)
          if summaries != [('ok', '5', '0', '0')]:
              raise SystemExit(f'Unexpected native summaries: {summaries!r}')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sentinel-command-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sentinel-command-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error

  sentinel-linux-task-local:
    name: Sentinel probe fixed qualification (Linux)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.evaluator_scope == 'sentinel-linux-task-local' }}
    runs-on: [self-hosted, linux-build]
    env:
      EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
      WORKFLOW_SOURCE_SHA: ${{ github.workflow_sha }}
      EVENT_SOURCE_SHA: ${{ github.sha }}
      TEST_CAP_SECS: '600'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Create fresh qualification receipt directory
        id: task_boundary
        shell: bash
        run: |
          set -euo pipefail
          receipt_dir="${RUNNER_TEMP}/sentinel-linux-task-local-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ -e "$receipt_dir" ]]; then
            echo 'receipt_directory_already_exists' >&2
            exit 1
          fi
          mkdir -- "$receipt_dir"
          printf '%s\n' '{"schema":"sentinel-linux-fixed-v1","outcome":"unqualified","errors":["qualification_step_not_completed"]}' > "$receipt_dir/receipt.json"
          printf '%s\n' 'fresh_receipt_directory=true' >> "$GITHUB_OUTPUT"
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          package-manager-cache: false
          node-version: '22.22.0'
      - uses: dtolnay/rust-toolchain@stable
      - name: Ensure Rust toolchain on PATH
        shell: bash
        run: |
          if command -v rustc >/dev/null 2>&1; then rustc -vV; exit 0; fi
          for dir in "$CARGO_HOME/bin" "$HOME/.cargo/bin" /home/*/.cargo/bin; do
            if [ -x "$dir/rustc" ]; then
              echo "$dir" >> "$GITHUB_PATH"
              "$dir/rustc" -vV
              exit 0
            fi
          done
          echo "rustc not found; restore Rust on the runner" >&2
          exit 1
      - name: Run fixed Sentinel cases and retain raw outcomes
        shell: bash
        run: |
          set +e
          set -u -o pipefail
          receipt_dir="${RUNNER_TEMP}/sentinel-linux-task-local-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ ! -d "$receipt_dir" || ! -f "$receipt_dir/receipt.json" ]]; then
            echo 'fresh_receipt_directory_missing' >&2
            exit 1
          fi
          portable_log="$receipt_dir/portable-controls.log"
          native_log="$receipt_dir/linux-native.log"
          : > "$portable_log"
          : > "$native_log"
          preflight_ready=true
          source_before_clean=true
          preflight_errors=()
          refuse_preflight() {
            preflight_ready=false
            preflight_errors+=("$1")
          }
          checkout_sha="$(git rev-parse HEAD 2>/dev/null)"
          checkout_status=$?
          if (( checkout_status != 0 )); then refuse_preflight checkout_identity_unavailable; fi
          if [[ ! "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then refuse_preflight expected_source_sha_invalid; fi
          if [[ "$EXPECTED_SOURCE_SHA" != "$WORKFLOW_SOURCE_SHA" || "$EXPECTED_SOURCE_SHA" != "$EVENT_SOURCE_SHA" || "$EXPECTED_SOURCE_SHA" != "$checkout_sha" ]]; then
            refuse_preflight source_identity_mismatch
          fi
          source_before="$(git status --porcelain --untracked-files=all 2>&1)"
          source_before_status=$?
          printf '%s\n' "$source_before" > "$receipt_dir/source-before.status"
          if (( source_before_status != 0 )) || [[ -n "$source_before" ]]; then
            source_before_clean=false
            refuse_preflight dirty_checkout_before
          fi
          if [[ -e .env ]]; then refuse_preflight ambient_dotenv_refused; fi
          if [[ -n "${CARGO_TARGET_DIR:-}" || -n "${CARGO_TEST_CMD:-}" || -n "${CARGO_TEST_BUILD_CMD:-}" ]]; then refuse_preflight ambient_test_override_refused; fi
          while IFS= read -r name; do
            case "$name" in
              CODETERM_EMBED_CACHE_DIR) ;;
              CODETERM_*)
                if [[ -n "${!name}" ]]; then refuse_preflight ambient_codeterm_binding_refused; fi
                ;;
            esac
          done < <(compgen -e | LC_ALL=C grep '^CODETERM_')
          for tool in bash cargo node rustc sha256sum; do
            if ! command -v "$tool" >/dev/null 2>&1; then refuse_preflight "${tool}_missing"; fi
          done
          rustc_identity=''
          cargo_identity=''
          node_identity=''
          if command -v rustc >/dev/null 2>&1; then
            rustc_identity="$(rustc -vV 2>&1)"
            if (( $? != 0 )); then refuse_preflight rustc_identity_failed; fi
          fi
          if command -v cargo >/dev/null 2>&1; then
            cargo_identity="$(cargo --version 2>&1)"
            if (( $? != 0 )); then refuse_preflight cargo_identity_failed; fi
          fi
          if command -v node >/dev/null 2>&1; then
            node_identity="$(node --version 2>&1)"
            if (( $? != 0 )); then refuse_preflight node_identity_failed; fi
          fi
          input_paths=(
            '.github/workflows/tests.yml'
            'build.sh'
            'scripts/test-capped.sh'
            'src-tauri/Cargo.toml'
            'src-tauri/src/sentinel/probe.rs'
            'src-tauri/src/sentinel/probe/capture.rs'
            'src-tauri/src/sentinel/probe/native_tests.rs'
            'src-tauri/src/sentinel/probe/owner.rs'
            'src-tauri/src/sentinel/probe/process.rs'
            'src-tauri/src/sentinel/probe/tests.rs'
            'src-tauri/src/sentinel/probe/unix.rs'
            'src-tauri/src/sentinel/probe/windows.rs'
            'src-tauri/src/sentinel/scheduler.rs'
          )
          : > "$receipt_dir/source-hashes.tsv"
          for path in "${input_paths[@]}"; do
            if [[ ! -f "$path" ]]; then
              refuse_preflight source_input_missing
              continue
            fi
            hash_line="$(sha256sum -- "$path" 2>&1)"
            hash_status=$?
            if (( hash_status != 0 )); then
              refuse_preflight source_hash_failed
              continue
            fi
            printf '%s\t%s\n' "${hash_line%% *}" "$path" >> "$receipt_dir/source-hashes.tsv"
          done
          portable_exit=''
          native_exit=''
          portable_wall=''
          native_wall=''
          stub_cleanup_status=0
          if [[ "$preflight_ready" == true ]]; then
            SECONDS=0
            TEST_CAP_SECS=600 ./build.sh test-one app sentinel::probe::tests:: > "$portable_log" 2>&1
            portable_exit=$?
            portable_wall=$SECONDS
            cat "$portable_log"
            SECONDS=0
            TEST_CAP_SECS=600 ./build.sh test-one app sentinel_probe_native_ > "$native_log" 2>&1
            native_exit=$?
            native_wall=$SECONDS
            cat "$native_log"
            stub_dirs=()
            [[ -d src-tauri/bundled-cli ]] && stub_dirs+=(src-tauri/bundled-cli)
            [[ -d src-tauri/bundled-embed ]] && stub_dirs+=(src-tauri/bundled-embed)
            if (( ${#stub_dirs[@]} > 0 )); then
              find "${stub_dirs[@]}" -maxdepth 1 -type f -size 0 -delete 2> "$receipt_dir/stub-cleanup.stderr"
              stub_cleanup_status=$?
            fi
          fi
          source_after="$(git status --porcelain --untracked-files=all 2>&1)"
          source_after_status=$?
          printf '%s\n' "$source_after" > "$receipt_dir/source-after.status"
          git diff HEAD -- > "$receipt_dir/source-after.diff"
          source_diff_status=$?
          source_after_head="$(git rev-parse HEAD 2>/dev/null)"
          source_after_head_status=$?
          source_after_clean=true
          if (( source_after_status != 0 || source_diff_status != 0 || source_after_head_status != 0 )) || [[ -n "$source_after" || "$source_after_head" != "$checkout_sha" ]]; then
            source_after_clean=false
          fi
          export SENTINEL_EXPECTED_SOURCE_SHA="$EXPECTED_SOURCE_SHA"
          export SENTINEL_WORKFLOW_SOURCE_SHA="$WORKFLOW_SOURCE_SHA"
          export SENTINEL_EVENT_SOURCE_SHA="$EVENT_SOURCE_SHA"
          export SENTINEL_CHECKOUT_SHA="$checkout_sha"
          export SENTINEL_SOURCE_BEFORE_CLEAN="$source_before_clean"
          export SENTINEL_PREFLIGHT_READY="$preflight_ready"
          export SENTINEL_PREFLIGHT_ERRORS="$(IFS=,; printf '%s' "${preflight_errors[*]}")"
          export SENTINEL_SOURCE_AFTER_CLEAN="$source_after_clean"
          export SENTINEL_PORTABLE_EXIT="$portable_exit"
          export SENTINEL_PORTABLE_WALL="$portable_wall"
          export SENTINEL_NATIVE_EXIT="$native_exit"
          export SENTINEL_NATIVE_WALL="$native_wall"
          export SENTINEL_STUB_CLEANUP_STATUS="$stub_cleanup_status"
          export SENTINEL_RUSTC_IDENTITY="$rustc_identity"
          export SENTINEL_CARGO_IDENTITY="$cargo_identity"
          export SENTINEL_NODE_IDENTITY="$node_identity"
          export SENTINEL_RECEIPT_DIR="$receipt_dir"
          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');
          const readline = require('node:readline');

          const portablePrefix = 'sentinel::probe::tests::';
          const portableSuffixes = [
            'sentinel_probe_owner_retirement_refuses_signal',
            'sentinel_probe_windows_assigns_before_resume',
            'sentinel_probe_capture_failure_cannot_return_output',
            'sentinel_probe_original_deadline_is_not_renewed',
            'sentinel_probe_owner_capacity_refuses_before_spawn',
            'sentinel_probe_owner_close_refuses_and_requests_cleanup',
            'sentinel_probe_owner_drop_closes_without_retained_arc_cycle',
            'sentinel_probe_owner_signalled_event_releases_exact_slot',
            'sentinel_probe_owner_unresolved_slot_does_not_starve_settled_slot',
            'sentinel_probe_owner_callback_observes_state_without_owner_lock',
            'sentinel_probe_windows_permanent_close_uncertainty_is_retained',
          ];
          const nativePrefix = 'sentinel::probe::native_tests::';
          const nativeExpected = [
            ['sentinel_probe_native_success_and_nonzero', 'ok', null],
            ['sentinel_probe_native_output_is_bounded_and_drained', 'ok', null],
            ['sentinel_probe_native_closed_stream_live_child_is_unconfirmed', 'ok', null],
            ['sentinel_probe_native_inherited_stream_deadline', 'ok', null],
            ['sentinel_probe_native_windows_preexecution_containment', 'ignored', 'Windows Job containment oracle; not executed on this platform'],
            ['sentinel_probe_native_cancelled_capture_settles', 'ignored', 'Windows overlapped cancellation oracle; not executed on this platform'],
          ];
          const expectedHashPaths = [
            '.github/workflows/tests.yml', 'build.sh', 'scripts/test-capped.sh', 'src-tauri/Cargo.toml',
            'src-tauri/src/sentinel/probe.rs', 'src-tauri/src/sentinel/probe/capture.rs',
            'src-tauri/src/sentinel/probe/native_tests.rs', 'src-tauri/src/sentinel/probe/owner.rs',
            'src-tauri/src/sentinel/probe/process.rs', 'src-tauri/src/sentinel/probe/tests.rs',
            'src-tauri/src/sentinel/probe/unix.rs', 'src-tauri/src/sentinel/probe/windows.rs',
            'src-tauri/src/sentinel/scheduler.rs',
          ];
          const dir = process.env.SENTINEL_RECEIPT_DIR;
          const summaryPattern = /^test result: (ok|FAILED)\. (\d+) passed; (\d+) failed; (\d+) ignored; (\d+) measured; (\d+) filtered out; finished in ([0-9.]+)s$/;
          const resultPattern = /^test ([A-Za-z0-9_:]+) \.\.\. (ok|FAILED|ignored)(?:, (.+))?$/;

          async function digestFile(file) {
            const digest = crypto.createHash('sha256');
            for await (const chunk of fs.createReadStream(file)) digest.update(chunk);
            return digest.digest('hex');
          }

          async function readCase(config) {
            const fullNames = config.expected.map(([suffix]) => config.prefix + suffix);
            const expected = config.expected.map(([suffix, status, ignoreReason = null]) => ({ full_name: config.prefix + suffix, suffix, status, ignore_reason: ignoreReason }));
            const actual = [];
            const summaries = [];
            const errors = new Set();
            let resultLineCount = 0;
            let summaryCount = 0;
            const recordError = error => { if (errors.size < 32) errors.add(error); else errors.add('parser_error_overflow'); };
            const logPath = path.join(dir, config.log);
            try {
              const input = fs.createReadStream(logPath);
              const lines = readline.createInterface({ input, crlfDelay: Infinity });
              for await (const line of lines) {
                if (/^test result(?:\s|:)/.test(line)) {
                  summaryCount += 1;
                  const match = summaryPattern.exec(line);
                  if (!match) recordError('malformed_summary_line');
                  else if (summaries.length < 2) summaries.push({
                    status: match[1], passed: Number(match[2]), failed: Number(match[3]),
                    ignored: Number(match[4]), measured: Number(match[5]),
                    filtered_out: Number(match[6]), libtest_seconds: Number(match[7]),
                  });
                } else if (/^test(?:\s|$)/.test(line)) {
                  resultLineCount += 1;
                  const match = resultPattern.exec(line);
                  if (!match) recordError('malformed_test_result_line');
                  else if (actual.length < expected.length + 1) actual.push({ full_name: match[1], suffix: match[1].startsWith(config.prefix) ? match[1].slice(config.prefix.length) : null, status: match[2], ignore_reason: match[3] || null });
                }
              }
            } catch (error) {
              recordError('log_read_failed');
            }
            const expectedByName = new Map(expected.map(row => [row.full_name, row]));
            const actualCounts = new Map();
            for (const row of actual) actualCounts.set(row.full_name, (actualCounts.get(row.full_name) || 0) + 1);
            if (resultLineCount !== expected.length) recordError('test_result_count_mismatch');
            if (resultLineCount > actual.length) recordError('result_capture_overflow');
            if (new Set(actual.map(row => row.full_name)).size !== actual.length) recordError('duplicate_test_name');
            for (const row of actual) {
              if (!expectedByName.has(row.full_name)) recordError('unknown_test_name');
              else {
                const expectedRow = expectedByName.get(row.full_name);
                if (expectedRow.status !== row.status) recordError('test_status_mismatch');
                if (row.ignore_reason !== null && row.ignore_reason !== expectedRow.ignore_reason) recordError('ignore_reason_mismatch');
                if (row.status !== 'ignored' && row.ignore_reason !== null) recordError('unexpected_test_result_suffix');
              }
            }
            for (const name of fullNames) if (actualCounts.get(name) !== 1) recordError('missing_or_duplicate_expected_test');
            if (summaryCount !== 1) recordError('summary_count_mismatch');
            const summary = summaryCount === 1 && summaries.length === 1 ? summaries[0] : null;
            const rawExit = process.env[config.exitEnv] === '' ? null : Number(process.env[config.exitEnv]);
            const wall = process.env[config.wallEnv] === '' ? null : Number(process.env[config.wallEnv]);
            if (summary) {
              if (summary.status !== 'ok' || summary.passed !== config.counts.passed || summary.failed !== 0 || summary.ignored !== config.counts.ignored || summary.measured !== 0 || !Number.isFinite(summary.libtest_seconds) || summary.libtest_seconds < 0 || summary.passed + summary.failed + summary.ignored !== expected.length) recordError('summary_counts_mismatch');
            }
            if (rawExit !== 0) recordError('raw_build_exit_not_zero');
            if (!Number.isFinite(wall) || wall < 0) recordError('wall_time_invalid');
            const logHash = await digestFile(logPath).catch(() => null);
            return {
              selector: config.selector,
              command: config.command,
              expected,
              actual,
              summary,
              raw_exit: Number.isInteger(rawExit) ? rawExit : null,
              wall_seconds: Number.isFinite(wall) ? wall : null,
              log: config.log,
              log_sha256: logHash,
              outcome: errors.size === 0 ? 'passed' : 'unqualified',
              errors: [...errors],
            };
          }

          (async () => {
            const portableExpected = portableSuffixes.map(suffix => [suffix, 'ok', null]);
            const cases = [
              await readCase({
                selector: 'sentinel::probe::tests::', prefix: portablePrefix,
                command: './build.sh test-one app sentinel::probe::tests::',
                expected: portableExpected, counts: { passed: 11, ignored: 0 },
                log: 'portable-controls.log', exitEnv: 'SENTINEL_PORTABLE_EXIT', wallEnv: 'SENTINEL_PORTABLE_WALL',
              }),
              await readCase({
                selector: 'sentinel_probe_native_', prefix: nativePrefix,
                command: './build.sh test-one app sentinel_probe_native_',
                expected: nativeExpected, counts: { passed: 4, ignored: 2 },
                log: 'linux-native.log', exitEnv: 'SENTINEL_NATIVE_EXIT', wallEnv: 'SENTINEL_NATIVE_WALL',
              }),
            ];
            const hashRows = fs.readFileSync(path.join(dir, 'source-hashes.tsv'), 'utf8').split(/\r?\n/).filter(Boolean).map(line => {
              const [sha256, ...parts] = line.split('\t');
              return { path: parts.join('\t'), sha256 };
            });
            const errors = [];
            if (process.env.SENTINEL_PREFLIGHT_READY !== 'true') errors.push(...(process.env.SENTINEL_PREFLIGHT_ERRORS || '').split(',').filter(Boolean));
            if (process.env.SENTINEL_SOURCE_AFTER_CLEAN !== 'true') errors.push('source_not_clean_after');
            if (process.env.SENTINEL_STUB_CLEANUP_STATUS !== '0') errors.push('stub_cleanup_failed');
            if (hashRows.length !== expectedHashPaths.length || new Set(hashRows.map(row => row.path)).size !== expectedHashPaths.length || expectedHashPaths.some(sourcePath => !hashRows.some(row => row.path === sourcePath)) || hashRows.some(row => !/^[0-9a-f]{64}$/.test(row.sha256) || !row.path)) errors.push('source_hash_inventory_invalid');
            for (const row of cases) errors.push(...row.errors.map(error => `${row.selector}:${error}`));
            const receipt = {
              schema: 'sentinel-linux-fixed-v1',
              outcome: errors.length === 0 && cases.every(row => row.outcome === 'passed') ? 'passed' : 'unqualified',
              errors: [...new Set(errors)],
              run_id: process.env.GITHUB_RUN_ID,
              run_attempt: process.env.GITHUB_RUN_ATTEMPT,
              source: {
                expected_sha: process.env.SENTINEL_EXPECTED_SOURCE_SHA || '',
                workflow_sha: process.env.SENTINEL_WORKFLOW_SOURCE_SHA || '',
                event_sha: process.env.SENTINEL_EVENT_SOURCE_SHA || '',
                checkout_sha: process.env.SENTINEL_CHECKOUT_SHA || '',
                clean_before: process.env.SENTINEL_SOURCE_BEFORE_CLEAN === 'true',
                clean_after: process.env.SENTINEL_SOURCE_AFTER_CLEAN === 'true',
                stub_cleanup_attempted: process.env.SENTINEL_PREFLIGHT_READY === 'true',
                stub_cleanup_exit: Number(process.env.SENTINEL_STUB_CLEANUP_STATUS),
                hashes: hashRows,
              },
              runner: {
                name: process.env.RUNNER_NAME || '', os: process.env.RUNNER_OS || '', arch: process.env.RUNNER_ARCH || '',
                rustc: process.env.SENTINEL_RUSTC_IDENTITY || '',
                cargo: process.env.SENTINEL_CARGO_IDENTITY || '',
                node: process.env.SENTINEL_NODE_IDENTITY || '',
              },
              cases,
            };
            let body = JSON.stringify(receipt, null, 2) + '\n';
            const receiptOverflow = Buffer.byteLength(body, 'utf8') > 65536;
            if (receiptOverflow) {
              const fallback = {
                schema: 'sentinel-linux-fixed-v1', outcome: 'unqualified', errors: ['receipt_overflow'],
                source: { expected_sha: receipt.source.expected_sha, workflow_sha: receipt.source.workflow_sha, event_sha: receipt.source.event_sha, checkout_sha: receipt.source.checkout_sha },
                cases: cases.map(row => ({ selector: row.selector, expected: row.expected, actual: row.actual, summary: row.summary, raw_exit: row.raw_exit, wall_seconds: row.wall_seconds, log: row.log, log_sha256: row.log_sha256, errors: row.errors })),
              };
              body = JSON.stringify(fallback, null, 2) + '\n';
            }
            fs.writeFileSync(path.join(dir, 'receipt.json'), body, { flag: 'w' });
            if (receipt.outcome !== 'passed' || receiptOverflow) process.exitCode = 1;
          })().catch(() => {
            console.error('receipt_generation_failed');
            const fallback = {
              schema: 'sentinel-linux-fixed-v1', outcome: 'unqualified', errors: ['receipt_generation_failed'],
              source: {
                expected_sha: process.env.SENTINEL_EXPECTED_SOURCE_SHA || '',
                workflow_sha: process.env.SENTINEL_WORKFLOW_SOURCE_SHA || '',
                event_sha: process.env.SENTINEL_EVENT_SOURCE_SHA || '',
                checkout_sha: process.env.SENTINEL_CHECKOUT_SHA || '',
              },
              cases: [
                { selector: 'sentinel::probe::tests::', expected: portableSuffixes.map(suffix => ({ full_name: portablePrefix + suffix, suffix, status: 'ok' })), actual: [], raw_exit: process.env.SENTINEL_PORTABLE_EXIT === '' ? null : Number(process.env.SENTINEL_PORTABLE_EXIT), wall_seconds: process.env.SENTINEL_PORTABLE_WALL === '' ? null : Number(process.env.SENTINEL_PORTABLE_WALL), log: 'portable-controls.log' },
                { selector: 'sentinel_probe_native_', expected: nativeExpected.map(([suffix, status, ignoreReason]) => ({ full_name: nativePrefix + suffix, suffix, status, ignore_reason: ignoreReason })), actual: [], raw_exit: process.env.SENTINEL_NATIVE_EXIT === '' ? null : Number(process.env.SENTINEL_NATIVE_EXIT), wall_seconds: process.env.SENTINEL_NATIVE_WALL === '' ? null : Number(process.env.SENTINEL_NATIVE_WALL), log: 'linux-native.log' },
              ],
            };
            try { fs.writeFileSync(path.join(dir, 'receipt.json'), JSON.stringify(fallback, null, 2) + '\n', { flag: 'w' }); } catch (_) { console.error('fallback_receipt_write_failed'); }
            process.exitCode = 1;
          });
          NODE
          node_status=$?
          exit "$node_status"
      - name: Retain complete Linux qualification evidence
        if: ${{ always() && steps.task_boundary.outputs.fresh_receipt_directory == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-linux-task-local-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/sentinel-linux-task-local-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error

  # Linux proof of the dormant Storage foundation reviewed at dbc17edee; Sentinel scopes never count toward it.
  storage-foundation-linux:
    name: Storage foundation fixed qualification (Linux)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.evaluator_scope == 'storage-foundation-linux' }}
    runs-on: [self-hosted, linux-build]
    timeout-minutes: 30
    env:
      EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
      WORKFLOW_SOURCE_SHA: ${{ github.workflow_sha }}
      EVENT_SOURCE_SHA: ${{ github.sha }}
      REVIEWED_STORAGE_SHA: dbc17edee5c1c9032c1498caa0f04b00eb3468ad
      TEST_CAP_SECS: '600'
      CARGO_TERM_COLOR: never
      RUST_TEST_THREADS: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Create fresh qualification receipt directory
        id: task_boundary
        shell: bash
        run: |
          set -euo pipefail
          receipt_dir="${RUNNER_TEMP}/storage-foundation-linux-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ -e "$receipt_dir" ]]; then
            echo 'receipt_directory_already_exists' >&2
            exit 1
          fi
          mkdir -- "$receipt_dir"
          printf '%s\n' '{"schema":"storage-foundation-linux-v1","outcome":"unqualified","errors":["qualification_step_not_completed"]}' > "$receipt_dir/receipt.json"
          printf '%s\n' 'fresh_receipt_directory=true' >> "$GITHUB_OUTPUT"
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          package-manager-cache: false
          node-version: '22.22.0'
      - uses: dtolnay/rust-toolchain@stable
      - name: Ensure Rust toolchain on PATH
        shell: bash
        run: |
          if command -v rustc >/dev/null 2>&1; then rustc -vV; exit 0; fi
          for dir in "$CARGO_HOME/bin" "$HOME/.cargo/bin" /home/*/.cargo/bin; do
            if [ -x "$dir/rustc" ]; then
              echo "$dir" >> "$GITHUB_PATH"
              "$dir/rustc" -vV
              exit 0
            fi
          done
          echo "rustc not found; restore Rust on the runner" >&2
          exit 1
      - name: Run fixed Storage contract cases and retain raw outcome
        shell: bash
        run: |
          set +e
          set -u -o pipefail
          receipt_dir="${RUNNER_TEMP}/storage-foundation-linux-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ ! -d "$receipt_dir" || ! -f "$receipt_dir/receipt.json" ]]; then
            echo 'fresh_receipt_directory_missing' >&2
            exit 1
          fi
          contract_log="$receipt_dir/storage-contract.log"
          : > "$contract_log"
          : > "$receipt_dir/stub-cleanup.list"
          : > "$receipt_dir/stub-unknown.list"
          preflight_ready=true
          source_before_clean=true
          preflight_errors=()
          refuse_preflight() {
            preflight_ready=false
            preflight_errors+=("$1")
          }
          checkout_sha="$(git rev-parse HEAD 2>/dev/null)"
          checkout_status=$?
          if (( checkout_status != 0 )); then refuse_preflight checkout_identity_unavailable; fi
          if [[ ! "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then refuse_preflight expected_source_sha_invalid; fi
          if [[ "$EXPECTED_SOURCE_SHA" != "$WORKFLOW_SOURCE_SHA" || "$EXPECTED_SOURCE_SHA" != "$EVENT_SOURCE_SHA" || "$EXPECTED_SOURCE_SHA" != "$checkout_sha" ]]; then
            refuse_preflight source_identity_mismatch
          fi
          if [[ "${RUNNER_OS:-}" != Linux ]]; then refuse_preflight runner_platform_not_linux; fi
          source_before="$(git status --porcelain --untracked-files=all 2>&1)"
          source_before_status=$?
          printf '%s\n' "$source_before" > "$receipt_dir/source-before.status"
          if (( source_before_status != 0 )) || [[ -n "$source_before" ]]; then
            source_before_clean=false
            refuse_preflight dirty_checkout_before
          fi
          if [[ -e .env ]]; then refuse_preflight ambient_dotenv_refused; fi
          if [[ -n "${CARGO_TARGET_DIR:-}" || -n "${CARGO_TEST_CMD:-}" || -n "${CARGO_TEST_BUILD_CMD:-}" ]]; then refuse_preflight ambient_test_override_refused; fi
          while IFS= read -r name; do
            case "$name" in
              CODETERM_EMBED_CACHE_DIR) ;;
              CODETERM_*)
                if [[ -n "${!name}" ]]; then refuse_preflight ambient_codeterm_binding_refused; fi
                ;;
            esac
          done < <(compgen -e | LC_ALL=C grep '^CODETERM_')
          for tool in bash cargo git node rustc sha256sum; do
            if ! command -v "$tool" >/dev/null 2>&1; then refuse_preflight "${tool}_missing"; fi
          done
          rustc_identity=''
          cargo_identity=''
          node_identity=''
          if command -v rustc >/dev/null 2>&1; then
            rustc_identity="$(rustc -vV 2>&1)"
            if (( $? != 0 )); then refuse_preflight rustc_identity_failed; fi
          fi
          if command -v cargo >/dev/null 2>&1; then
            cargo_identity="$(cargo --version 2>&1)"
            if (( $? != 0 )); then refuse_preflight cargo_identity_failed; fi
          fi
          if command -v node >/dev/null 2>&1; then
            node_identity="$(node --version 2>&1)"
            if (( $? != 0 )); then refuse_preflight node_identity_failed; fi
          fi
          account_identity="$(id -un 2>/dev/null)"
          kernel_identity="$(uname -srm 2>/dev/null)"
          # Reviewed foundation: facade, both owning test files, the Storage crate and its
          # path-confinement dependency (codeterm-storage/Cargo.toml path = "../../../crates/codeterm-paths").
          storage_paths=('src-tauri/src/storage.rs' 'src-tauri/src/storage' 'src-tauri/crates/codeterm-storage' 'crates/codeterm-paths')
          storage_ancestor=false
          storage_inventory_equal=false
          if git cat-file -e "${REVIEWED_STORAGE_SHA}^{commit}" 2>/dev/null; then
            if git merge-base --is-ancestor "$REVIEWED_STORAGE_SHA" HEAD 2>/dev/null; then
              storage_ancestor=true
            else
              refuse_preflight reviewed_storage_not_ancestor
            fi
            git ls-tree -r "$REVIEWED_STORAGE_SHA" -- "${storage_paths[@]}" > "$receipt_dir/reviewed-storage.tree"
            reviewed_tree_status=$?
            git ls-tree -r HEAD -- "${storage_paths[@]}" > "$receipt_dir/source-storage.tree"
            source_tree_status=$?
            git diff --quiet --no-ext-diff "$REVIEWED_STORAGE_SHA" HEAD -- "${storage_paths[@]}"
            storage_diff_status=$?
            if (( reviewed_tree_status == 0 && source_tree_status == 0 && storage_diff_status == 0 )) && [[ -s "$receipt_dir/reviewed-storage.tree" ]]; then
              storage_inventory_equal=true
            else
              refuse_preflight storage_inventory_differs_from_reviewed
            fi
          else
            refuse_preflight reviewed_storage_commit_unavailable
          fi
          input_paths=(
            '.github/workflows/tests.yml'
            'build.sh'
            'scripts/test-capped.sh'
            'src-tauri/Cargo.toml'
            'src-tauri/Cargo.lock'
            'src-tauri/src/storage.rs'
            'src-tauri/src/storage/tests.rs'
            'src-tauri/src/storage/tests/assets.rs'
          )
          crate_listing="$(git ls-files -- src-tauri/crates/codeterm-storage crates/codeterm-paths 2>/dev/null)"
          crate_listing_status=$?
          if (( crate_listing_status != 0 )) || [[ -z "$crate_listing" ]]; then
            refuse_preflight storage_crate_listing_failed
          else
            while IFS= read -r path; do input_paths+=("$path"); done <<< "$crate_listing"
          fi
          : > "$receipt_dir/source-hashes.tsv"
          for path in "${input_paths[@]}"; do
            if [[ ! -f "$path" ]]; then
              refuse_preflight source_input_missing
              continue
            fi
            hash_line="$(sha256sum -- "$path" 2>&1)"
            hash_status=$?
            if (( hash_status != 0 )); then
              refuse_preflight source_hash_failed
              continue
            fi
            printf '%s\t%s\n' "${hash_line%% *}" "$path" >> "$receipt_dir/source-hashes.tsv"
          done
          # Build-owned stubs are exactly the Linux paths of scripts/prepare-cli-stub.js and prepare-embed-stub.js.
          stub_host="$(printf '%s\n' "$rustc_identity" | sed -n 's/^host: //p')"
          known_stubs=('src-tauri/bundled-cli/codeterm')
          if [[ "$stub_host" =~ ^[A-Za-z0-9_.-]+$ ]]; then
            known_stubs+=("src-tauri/bundled-embed/codeterm-embed-$stub_host")
          else
            refuse_preflight rust_host_unavailable
          fi
          list_stub_entries() {
            local dir
            for dir in src-tauri/bundled-cli src-tauri/bundled-embed; do
              if [[ -L "$dir" || ( -e "$dir" && ! -d "$dir" ) ]]; then return 1; fi
              if [[ -d "$dir" ]]; then find "$dir" -mindepth 1 -maxdepth 1 -print || return 1; fi
            done
          }
          list_stub_entries > "$receipt_dir/stub-entries-before.list"
          stub_snapshot_status=$?
          if (( stub_snapshot_status != 0 )); then refuse_preflight stub_snapshot_failed; fi
          command_exit=''
          command_wall=''
          command_started=''
          command_finished=''
          stub_cleanup_status=''
          if [[ "$preflight_ready" == true ]]; then
            command_started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            SECONDS=0
            TEST_CAP_SECS=600 RUST_TEST_THREADS=1 CARGO_TERM_COLOR=never ./build.sh test-one app storage_contract_ > "$contract_log" 2>&1
            command_exit=$?
            command_wall=$SECONDS
            command_finished="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            cat "$contract_log"
            stub_cleanup_status=0
            list_stub_entries > "$receipt_dir/stub-entries-after.list"
            if (( $? != 0 )); then stub_cleanup_status=1; fi
            while IFS= read -r entry; do
              if grep -Fxq -- "$entry" "$receipt_dir/stub-entries-before.list"; then continue; fi
              known_stub=false
              for stub in "${known_stubs[@]}"; do
                if [[ "$entry" == "$stub" ]]; then known_stub=true; fi
              done
              if [[ "$known_stub" == true && -f "$entry" && ! -L "$entry" && ! -s "$entry" ]]; then
                if rm -- "$entry" 2>> "$receipt_dir/stub-cleanup.stderr"; then
                  printf '%s\n' "$entry" >> "$receipt_dir/stub-cleanup.list"
                else
                  stub_cleanup_status=1
                fi
              else
                printf '%s\n' "$entry" >> "$receipt_dir/stub-unknown.list"
              fi
            done < "$receipt_dir/stub-entries-after.list"
          fi
          source_after="$(git status --porcelain --untracked-files=all 2>&1)"
          source_after_status=$?
          printf '%s\n' "$source_after" > "$receipt_dir/source-after.status"
          git diff HEAD -- > "$receipt_dir/source-after.diff"
          source_diff_status=$?
          source_after_head="$(git rev-parse HEAD 2>/dev/null)"
          source_after_head_status=$?
          source_after_clean=true
          if (( source_after_status != 0 || source_diff_status != 0 || source_after_head_status != 0 )) || [[ -n "$source_after" || "$source_after_head" != "$checkout_sha" || -s "$receipt_dir/stub-unknown.list" ]]; then
            source_after_clean=false
          fi
          export STORAGE_RECEIPT_DIR="$receipt_dir"
          export STORAGE_KNOWN_STUBS="$(IFS=,; printf '%s' "${known_stubs[*]}")"
          export STORAGE_CHECKOUT_SHA="$checkout_sha"
          export STORAGE_AFTER_HEAD_SHA="$source_after_head"
          export STORAGE_SOURCE_BEFORE_CLEAN="$source_before_clean"
          export STORAGE_SOURCE_AFTER_CLEAN="$source_after_clean"
          export STORAGE_PREFLIGHT_READY="$preflight_ready"
          export STORAGE_PREFLIGHT_ERRORS="$(IFS=,; printf '%s' "${preflight_errors[*]}")"
          export STORAGE_REVIEWED_ANCESTOR="$storage_ancestor"
          export STORAGE_INVENTORY_EQUAL="$storage_inventory_equal"
          export STORAGE_COMMAND_EXIT="$command_exit"
          export STORAGE_COMMAND_WALL="$command_wall"
          export STORAGE_COMMAND_STARTED="$command_started"
          export STORAGE_COMMAND_FINISHED="$command_finished"
          export STORAGE_STUB_CLEANUP_STATUS="$stub_cleanup_status"
          export STORAGE_RUSTC_IDENTITY="$rustc_identity"
          export STORAGE_CARGO_IDENTITY="$cargo_identity"
          export STORAGE_NODE_IDENTITY="$node_identity"
          export STORAGE_BASH_IDENTITY="$BASH_VERSION"
          export STORAGE_ACCOUNT_IDENTITY="$account_identity"
          export STORAGE_KERNEL_IDENTITY="$kernel_identity"
          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');
          const readline = require('node:readline');

          const schema = 'storage-foundation-linux-v1';
          const selector = 'storage_contract_';
          const command = 'TEST_CAP_SECS=600 RUST_TEST_THREADS=1 CARGO_TERM_COLOR=never ./build.sh test-one app storage_contract_';
          const expectedNames = [
            'storage::tests::storage_contract_config_bounds_are_explicit',
            'storage::tests::storage_contract_effective_pragmas_are_verified',
            'storage::tests::storage_contract_workspace_rows_are_incremental_and_ordered',
            'storage::tests::storage_contract_stale_revision_conserves_entire_prior_set',
            'storage::tests::storage_contract_foreign_key_failure_rolls_back_only_its_operation',
            'storage::tests::storage_contract_injected_commit_failure_conserves_state',
            'storage::tests::storage_contract_database_full_rolls_back_batch',
            'storage::tests::storage_contract_held_writer_serves_committed_reads_and_bounds_admission',
            'storage::tests::storage_contract_mailbox_byte_bound_refuses_without_discard',
            'storage::tests::storage_contract_owner_alias_and_instance_isolation',
            'storage::tests::storage_contract_malformed_and_incompatible_databases_are_refused',
            'storage::tests::storage_contract_backup_while_wal_active_restores_consistently',
            'storage::tests::storage_contract_shutdown_drains_accepted_and_releases_handles',
            'storage::tests::storage_contract_shutdown_admission_race_settles_every_submission',
            'storage::tests::storage_contract_owner_threads_refuse_reentrant_calls',
            'storage::tests::storage_contract_completion_resolves_on_async_runtime',
            'storage::tests::storage_contract_identifiers_are_confined',
            'storage::tests::storage_contract_linked_storage_directories_are_refused',
            'storage::tests::assets::storage_contract_asset_publication_and_rollback_orphans',
            'storage::tests::assets::storage_contract_asset_detach_cleanup_failure_is_retained',
            'storage::tests::assets::storage_contract_asset_read_survives_concurrent_detach',
            'storage::tests::assets::storage_contract_asset_publication_never_replaces_existing_blob',
            'storage::tests::assets::storage_contract_deep_root_publishes_restores_and_reopens',
          ];
          const fixedHashPaths = [
            '.github/workflows/tests.yml', 'build.sh', 'scripts/test-capped.sh',
            'src-tauri/Cargo.toml', 'src-tauri/Cargo.lock', 'src-tauri/src/storage.rs',
            'src-tauri/src/storage/tests.rs', 'src-tauri/src/storage/tests/assets.rs',
          ];
          const storageFacadePaths = ['src-tauri/src/storage.rs', 'src-tauri/src/storage/tests.rs', 'src-tauri/src/storage/tests/assets.rs'];
          const storageCratePrefix = 'src-tauri/crates/codeterm-storage/';
          const pathsCratePrefix = 'crates/codeterm-paths/';
          const dir = process.env.STORAGE_RECEIPT_DIR;
          const logName = 'storage-contract.log';
          const receiptLimit = 65536;
          const actualRowCap = 64;
          const summaryPattern = /^test result: (ok|FAILED)\. (\d+) passed; (\d+) failed; (\d+) ignored; (\d+) measured; (\d+) filtered out; finished in ([0-9.]+)s$/;
          const resultPattern = /^test ([A-Za-z0-9_:]+) \.\.\. (ok|FAILED|ignored)(?:, (.+))?$/;
          const slowPattern = /^test [A-Za-z0-9_:]+ has been running for over \d+ seconds$/;
          const runningPattern = /^running (\d+) tests?$/;
          const compileStartLine = '[test-capped] compiling test targets before the execution cap.';
          const compileFailedPattern = /^\[test-capped\] test target compilation failed with exit (\d+)\.$/;
          const shaPattern = /^[0-9a-f]{40}$/;

          const envNumber = name => (process.env[name] === undefined || process.env[name] === '' ? null : Number(process.env[name]));
          const readBytes = file => { try { return fs.readFileSync(file); } catch (_) { return null; } };
          const treePaths = bytes => (bytes ? bytes.toString('utf8').split('\n').filter(Boolean).map(line => line.split('\t').slice(1).join('\t')) : []);

          async function digestFile(file) {
            const digest = crypto.createHash('sha256');
            for await (const chunk of fs.createReadStream(file)) digest.update(chunk);
            return digest.digest('hex');
          }

          async function parseLog(record) {
            const parsed = { actual: [], summaries: [], running: [], resultLines: 0, summaryLines: 0, runningLines: 0, compileStarted: false, compileFailedExit: null };
            const lines = readline.createInterface({ input: fs.createReadStream(path.join(dir, logName)), crlfDelay: Infinity });
            for await (const line of lines) {
              if (line === compileStartLine) parsed.compileStarted = true;
              const compileFailed = compileFailedPattern.exec(line);
              if (compileFailed) parsed.compileFailedExit = Number(compileFailed[1]);
              const running = runningPattern.exec(line);
              if (running) {
                parsed.runningLines += 1;
                if (parsed.running.length < 4) parsed.running.push(Number(running[1]));
              }
              if (/^test result(?:\s|:)/.test(line)) {
                parsed.summaryLines += 1;
                const match = summaryPattern.exec(line);
                if (!match) record('malformed_summary_line');
                else if (parsed.summaries.length < 2) parsed.summaries.push({
                  status: match[1], passed: Number(match[2]), failed: Number(match[3]), ignored: Number(match[4]),
                  measured: Number(match[5]), filtered_out: Number(match[6]), libtest_seconds: Number(match[7]),
                });
              } else if (slowPattern.test(line)) {
                record('test_running_warning_line');
              } else if (/^test(?:\s|$)/.test(line)) {
                parsed.resultLines += 1;
                const match = resultPattern.exec(line);
                if (!match) record('malformed_test_result_line');
                else if (parsed.actual.length < actualRowCap) parsed.actual.push({ full_name: match[1], status: match[2], ignore_reason: match[3] || null });
                else record('result_capture_overflow');
              }
            }
            return parsed;
          }

          function commandPhase(commandRan, rawExit, parsed) {
            if (!commandRan) return 'command_not_run';
            if (parsed.compileFailedExit !== null) return 'compile_failed';
            if (parsed.runningLines === 0) {
              if (rawExit === 0) return 'no_test_execution_observed';
              return parsed.compileStarted ? 'failed_before_test_execution' : 'prerequisite_failed';
            }
            if (rawExit === 124) return 'execution_deadline';
            if (rawExit !== 0) return 'execution_failed';
            return 'executed';
          }

          (async () => {
            const errors = new Set();
            const record = error => { if (errors.size < 48) errors.add(error); else errors.add('error_overflow'); };
            if (process.env.GITHUB_EVENT_NAME !== 'workflow_dispatch') record('event_not_workflow_dispatch');
            if (process.env.STORAGE_PREFLIGHT_READY !== 'true') {
              record('preflight_refused');
              for (const error of (process.env.STORAGE_PREFLIGHT_ERRORS || '').split(',').filter(Boolean)) record(error);
            }
            const source = {
              expected_sha: process.env.EXPECTED_SOURCE_SHA || '',
              workflow_sha: process.env.WORKFLOW_SOURCE_SHA || '',
              event_sha: process.env.EVENT_SOURCE_SHA || '',
              checkout_sha: process.env.STORAGE_CHECKOUT_SHA || '',
              after_head_sha: process.env.STORAGE_AFTER_HEAD_SHA || '',
            };
            if (!shaPattern.test(source.expected_sha) || [source.workflow_sha, source.event_sha, source.checkout_sha, source.after_head_sha].some(sha => sha !== source.expected_sha)) record('source_identity_mismatch');
            if (process.env.STORAGE_SOURCE_BEFORE_CLEAN !== 'true') record('source_not_clean_before');
            if (process.env.STORAGE_SOURCE_AFTER_CLEAN !== 'true') record('source_not_clean_after');

            const reviewedTree = readBytes(path.join(dir, 'reviewed-storage.tree'));
            const sourceTree = readBytes(path.join(dir, 'source-storage.tree'));
            const reviewedPaths = treePaths(reviewedTree);
            const reviewedCratePaths = reviewedPaths.filter(entry => entry.startsWith(storageCratePrefix) || entry.startsWith(pathsCratePrefix));
            const inventoryEqual = process.env.STORAGE_INVENTORY_EQUAL === 'true' && reviewedTree !== null && sourceTree !== null && reviewedTree.length > 0 && reviewedTree.equals(sourceTree);
            if (process.env.STORAGE_REVIEWED_ANCESTOR !== 'true') record('reviewed_storage_not_ancestor');
            if (!inventoryEqual) record('storage_inventory_not_reviewed');
            if (!reviewedCratePaths.some(entry => entry.startsWith(storageCratePrefix)) || !reviewedCratePaths.some(entry => entry.startsWith(pathsCratePrefix)) || storageFacadePaths.some(entry => !reviewedPaths.includes(entry))) record('storage_inventory_incomplete');

            const hashRows = (readBytes(path.join(dir, 'source-hashes.tsv')) || Buffer.alloc(0)).toString('utf8').split('\n').filter(Boolean).map(line => {
              const [sha256, ...parts] = line.split('\t');
              return { path: parts.join('\t'), sha256 };
            });
            const expectedHashPaths = [...fixedHashPaths, ...reviewedCratePaths];
            const hashedPaths = hashRows.map(row => row.path);
            if (hashRows.length !== expectedHashPaths.length || new Set(hashedPaths).size !== hashRows.length || expectedHashPaths.some(entry => !hashedPaths.includes(entry)) || hashRows.some(row => !/^[0-9a-f]{64}$/.test(row.sha256))) record('source_hash_inventory_invalid');

            const rawExit = envNumber('STORAGE_COMMAND_EXIT');
            const wall = envNumber('STORAGE_COMMAND_WALL');
            const commandRan = rawExit !== null;
            let parsed = { actual: [], summaries: [], running: [], resultLines: 0, summaryLines: 0, runningLines: 0, compileStarted: false, compileFailedExit: null };
            try { parsed = await parseLog(record); } catch (_) { record('log_read_failed'); }
            const logSha = await digestFile(path.join(dir, logName)).catch(() => null);
            if (logSha === null) record('log_hash_failed');
            const phase = commandPhase(commandRan, rawExit, parsed);
            if (phase !== 'executed') record(phase);
            if (commandRan && rawExit !== 0) record('raw_exit_not_zero');
            if (commandRan && (!Number.isInteger(wall) || wall < 0)) record('wall_time_invalid');
            if (commandRan && (!process.env.STORAGE_COMMAND_STARTED || !process.env.STORAGE_COMMAND_FINISHED)) record('command_time_missing');
            if (commandRan && process.env.STORAGE_STUB_CLEANUP_STATUS !== '0') record('stub_cleanup_failed');

            const expectedSet = new Set(expectedNames);
            const counts = new Map();
            for (const row of parsed.actual) counts.set(row.full_name, (counts.get(row.full_name) || 0) + 1);
            if (parsed.resultLines !== expectedNames.length) record('test_result_count_mismatch');
            if ([...counts.values()].some(count => count > 1)) record('duplicate_test_name');
            for (const row of parsed.actual) {
              if (!expectedSet.has(row.full_name)) record('unknown_test_name');
              if (row.status === 'FAILED') record('test_failed');
              if (row.status === 'ignored') record('test_ignored');
              if (row.status === 'ok' && row.ignore_reason !== null) record('unexpected_test_result_suffix');
            }
            if (expectedNames.some(name => counts.get(name) !== 1)) record('missing_or_duplicate_expected_test');
            if (parsed.runningLines !== 1 || parsed.running[0] !== expectedNames.length) record('running_count_mismatch');
            if (parsed.summaryLines !== 1 || parsed.summaries.length !== 1) record('summary_count_mismatch');
            const summary = parsed.summaryLines === 1 && parsed.summaries.length === 1 ? parsed.summaries[0] : null;
            if (summary && (summary.status !== 'ok' || summary.passed !== expectedNames.length || summary.failed !== 0 || summary.ignored !== 0 || summary.measured !== 0 || !Number.isFinite(summary.libtest_seconds) || summary.libtest_seconds < 0)) record('summary_counts_mismatch');

            const readList = name => (readBytes(path.join(dir, name)) || Buffer.alloc(0)).toString('utf8').split('\n').filter(Boolean);
            const stubRemoved = readList('stub-cleanup.list');
            const stubUnknown = readList('stub-unknown.list');
            if (stubUnknown.length > 0) record('stub_unknown_artifact');
            const outcome = errors.size === 0 ? 'qualified' : 'unqualified';
            const receipt = {
              schema,
              outcome,
              errors: [...errors],
              run: {
                id: process.env.GITHUB_RUN_ID || '', attempt: process.env.GITHUB_RUN_ATTEMPT || '',
                url: `${process.env.GITHUB_SERVER_URL || ''}/${process.env.GITHUB_REPOSITORY || ''}/actions/runs/${process.env.GITHUB_RUN_ID || ''}`,
                event: process.env.GITHUB_EVENT_NAME || '', ref: process.env.GITHUB_REF || '', workflow_ref: process.env.GITHUB_WORKFLOW_REF || '',
              },
              source: {
                ...source,
                clean_before: process.env.STORAGE_SOURCE_BEFORE_CLEAN === 'true',
                clean_after: process.env.STORAGE_SOURCE_AFTER_CLEAN === 'true',
                stub_cleanup: {
                  attempted: commandRan, exit: envNumber('STORAGE_STUB_CLEANUP_STATUS'),
                  known_paths: (process.env.STORAGE_KNOWN_STUBS || '').split(',').filter(Boolean),
                  removed_count: stubRemoved.length, removed: stubRemoved.slice(0, 16),
                  unknown_count: stubUnknown.length, unknown: stubUnknown.slice(0, 16),
                },
                reviewed_storage: {
                  sha: process.env.REVIEWED_STORAGE_SHA || '', ancestor: process.env.STORAGE_REVIEWED_ANCESTOR === 'true',
                  inventory_equal: inventoryEqual, entries: reviewedPaths.length,
                  reviewed_tree_sha256: reviewedTree ? crypto.createHash('sha256').update(reviewedTree).digest('hex') : null,
                  source_tree_sha256: sourceTree ? crypto.createHash('sha256').update(sourceTree).digest('hex') : null,
                },
                hashes: hashRows,
              },
              runner: {
                name: process.env.RUNNER_NAME || '', os: process.env.RUNNER_OS || '', arch: process.env.RUNNER_ARCH || '',
                account: process.env.STORAGE_ACCOUNT_IDENTITY || '', kernel: process.env.STORAGE_KERNEL_IDENTITY || '',
                rustc: process.env.STORAGE_RUSTC_IDENTITY || '', cargo: process.env.STORAGE_CARGO_IDENTITY || '',
                node: process.env.STORAGE_NODE_IDENTITY || '', bash: process.env.STORAGE_BASH_IDENTITY || '',
              },
              command: {
                selector, command, phase, streams: 'stdout_and_stderr_merged',
                started_utc: process.env.STORAGE_COMMAND_STARTED || null, finished_utc: process.env.STORAGE_COMMAND_FINISHED || null,
                wall_seconds: Number.isInteger(wall) ? wall : null, raw_exit: Number.isInteger(rawExit) ? rawExit : null,
                compile_failed_exit: parsed.compileFailedExit, log: logName, log_sha256: logSha,
              },
              tests: {
                expected: expectedNames.map(full_name => ({ full_name, status: 'ok' })),
                actual: parsed.actual,
                result_lines: parsed.resultLines,
                running: parsed.running,
                summary,
                filtered_out_not_executed: summary ? summary.filtered_out : null,
              },
            };
            let body = JSON.stringify(receipt, null, 2) + '\n';
            const receiptOverflow = Buffer.byteLength(body, 'utf8') > receiptLimit;
            if (receiptOverflow) {
              body = JSON.stringify({
                schema, outcome: 'unqualified', errors: ['receipt_overflow', ...errors],
                run: receipt.run, source: { ...source, reviewed_storage_sha: process.env.REVIEWED_STORAGE_SHA || '' },
                command: receipt.command, tests: { result_lines: parsed.resultLines, running: parsed.running, summary },
              }, null, 2) + '\n';
            }
            fs.writeFileSync(path.join(dir, 'receipt.json'), body, { flag: 'w' });
            if (outcome !== 'qualified' || receiptOverflow) process.exitCode = 1;
          })().catch(() => {
            console.error('receipt_generation_failed');
            const fallback = {
              schema, outcome: 'unqualified', errors: ['receipt_generation_failed'],
              source: {
                expected_sha: process.env.EXPECTED_SOURCE_SHA || '', workflow_sha: process.env.WORKFLOW_SOURCE_SHA || '',
                event_sha: process.env.EVENT_SOURCE_SHA || '', checkout_sha: process.env.STORAGE_CHECKOUT_SHA || '',
                reviewed_storage_sha: process.env.REVIEWED_STORAGE_SHA || '',
              },
              command: { selector, command, raw_exit: envNumber('STORAGE_COMMAND_EXIT'), wall_seconds: envNumber('STORAGE_COMMAND_WALL'), log: logName },
              tests: { expected: expectedNames.map(full_name => ({ full_name, status: 'ok' })), actual: [] },
            };
            try { fs.writeFileSync(path.join(dir, 'receipt.json'), JSON.stringify(fallback, null, 2) + '\n', { flag: 'w' }); } catch (_) { console.error('fallback_receipt_write_failed'); }
            process.exitCode = 1;
          });
          NODE
          node_status=$?
          if [[ -n "$command_exit" && "$command_exit" != 0 ]]; then
            exit "$command_exit"
          fi
          exit "$node_status"
      - name: Retain complete Linux Storage qualification evidence
        if: ${{ always() && steps.task_boundary.outputs.fresh_receipt_directory == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: storage-foundation-linux-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/storage-foundation-linux-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error

  # Combined Cron, Sentinel and Storage qualification; source expectations are not execution proof.
  storage-domains-linux:
    name: Cron, Sentinel, and Storage fixed qualification (Linux)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.evaluator_scope == 'storage-domains-linux' }}
    runs-on: [self-hosted, linux-build]
    timeout-minutes: 75
    env:
      EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
      WORKFLOW_SOURCE_SHA: ${{ github.workflow_sha }}
      EVENT_SOURCE_SHA: ${{ github.sha }}
      DOMAIN_REVIEWED_SHA: bae48571f3ec780816aa05b0d47c2289755cc029
      DOMAIN_ORIGIN_SHA: 3972c8bd13bbf666e4470a3fcf6a51c6d67f5447
      FOUNDATION_ACCEPTED_SHA: dbc17edee5c1c9032c1498caa0f04b00eb3468ad
      TEST_CAP_SECS: '600'
      CARGO_TERM_COLOR: never
      RUST_TEST_THREADS: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Create fresh qualification receipt directory
        id: task_boundary
        shell: bash
        run: |
          set -euo pipefail
          receipt_dir="${RUNNER_TEMP}/storage-domains-linux-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ -e "$receipt_dir" ]]; then
            echo 'receipt_directory_already_exists' >&2
            exit 1
          fi
          mkdir -- "$receipt_dir"
          printf '%s\n' '{"schema":"storage-domains-linux-v1","outcome":"unqualified","errors":["qualification_step_not_completed"]}' > "$receipt_dir/receipt.json"
          printf '%s\n' 'fresh_receipt_directory=true' >> "$GITHUB_OUTPUT"
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          package-manager-cache: false
          node-version: '22.22.0'
      - uses: dtolnay/rust-toolchain@stable
      - name: Ensure Rust toolchain on PATH
        shell: bash
        run: |
          if command -v rustc >/dev/null 2>&1; then rustc -vV; exit 0; fi
          for dir in "$CARGO_HOME/bin" "$HOME/.cargo/bin" /home/*/.cargo/bin; do
            if [ -x "$dir/rustc" ]; then
              echo "$dir" >> "$GITHUB_PATH"
              "$dir/rustc" -vV
              exit 0
            fi
          done
          echo 'rustc not found; restore Rust on the runner' >&2
          exit 1
      - name: Run fixed Cron, Sentinel, and Storage cases
        shell: bash
        run: |
          set +e
          set -u -o pipefail
          receipt_dir="${RUNNER_TEMP}/storage-domains-linux-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ ! -d "$receipt_dir" || ! -f "$receipt_dir/receipt.json" ]]; then
            echo 'fresh_receipt_directory_missing' >&2
            exit 1
          fi
          preflight_ready=true
          source_before_clean=true
          preflight_errors=()
          refuse_preflight() {
            preflight_ready=false
            preflight_errors+=("$1")
          }
          for capture_file in preflight-errors.list stub-cleanup.list stub-unknown.list stub-cleanup.stderr; do
            if ! : > "$receipt_dir/$capture_file"; then refuse_preflight "receipt_file_unavailable:$capture_file"; fi
          done
          checkout_sha="$(git rev-parse HEAD 2>/dev/null)"
          checkout_status=$?
          if (( checkout_status != 0 )); then refuse_preflight checkout_identity_unavailable; fi
          if [[ ! "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then refuse_preflight expected_source_sha_invalid; fi
          if [[ "$EXPECTED_SOURCE_SHA" != "$WORKFLOW_SOURCE_SHA" || "$EXPECTED_SOURCE_SHA" != "$EVENT_SOURCE_SHA" || "$EXPECTED_SOURCE_SHA" != "$checkout_sha" ]]; then
            refuse_preflight source_identity_mismatch
          fi
          if [[ "${RUNNER_OS:-}" != Linux ]]; then refuse_preflight runner_platform_not_linux; fi
          source_before="$(git status --porcelain --untracked-files=all 2>&1)"
          source_before_status=$?
          printf '%s\n' "$source_before" > "$receipt_dir/source-before.status"
          if (( source_before_status != 0 )) || [[ -n "$source_before" ]]; then
            source_before_clean=false
            refuse_preflight dirty_checkout_before
          fi
          if [[ -e .env ]]; then refuse_preflight ambient_dotenv_refused; fi
          if [[ -n "${CARGO_TARGET_DIR:-}" || -n "${CARGO_TEST_CMD:-}" || -n "${CARGO_TEST_BUILD_CMD:-}" ]]; then refuse_preflight ambient_test_override_refused; fi
          while IFS= read -r name; do
            case "$name" in
              CODETERM_EMBED_CACHE_DIR) ;;
              CODETERM_*)
                if [[ -n "${!name}" ]]; then refuse_preflight ambient_codeterm_binding_refused; fi
                ;;
            esac
          done < <(compgen -e | LC_ALL=C grep '^CODETERM_')
          for tool in bash cargo cat cmp date find git grep id node rm rustc sed sha256sum uname; do
            if ! command -v "$tool" >/dev/null 2>&1; then refuse_preflight "${tool}_missing"; fi
          done
          if [[ -z "${RUNNER_NAME:-}" || -z "${RUNNER_ARCH:-}" || -z "${GITHUB_RUN_ID:-}" || -z "${GITHUB_RUN_ATTEMPT:-}" ]]; then
            refuse_preflight runner_or_run_identity_missing
          fi
          rustc_identity=''
          cargo_identity=''
          node_identity=''
          if command -v rustc >/dev/null 2>&1; then
            rustc_identity="$(rustc -vV 2>&1)"
            if (( $? != 0 )); then refuse_preflight rustc_identity_failed; fi
          fi
          if command -v cargo >/dev/null 2>&1; then
            cargo_identity="$(cargo --version 2>&1)"
            if (( $? != 0 )); then refuse_preflight cargo_identity_failed; fi
          fi
          if command -v node >/dev/null 2>&1; then
            node_identity="$(node --version 2>&1)"
            if (( $? != 0 )); then refuse_preflight node_identity_failed; fi
          fi
          account_identity="$(id -un 2>/dev/null)"
          kernel_identity="$(uname -srm 2>/dev/null)"
          if [[ -z "$account_identity" || -z "$kernel_identity" || -z "$rustc_identity" || -z "$cargo_identity" || -z "$node_identity" || -z "$BASH_VERSION" ]]; then
            refuse_preflight tool_or_runner_identity_missing
          fi
          time_probe_utc="$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ 2>/dev/null)"
          time_probe_ms="$(date +%s%3N 2>/dev/null)"
          if [[ ! "$time_probe_utc" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z$ || ! "$time_probe_ms" =~ ^[0-9]+$ ]]; then
            refuse_preflight utc_clock_unavailable
          fi
          domain_roots=(
            src-tauri/crates/codeterm-storage crates/codeterm-paths
            src-tauri/src/storage.rs src-tauri/src/storage
            src-tauri/src/cron/clock.rs src-tauri/src/cron/mod.rs src-tauri/src/cron/scheduler.rs src-tauri/src/cron/store
            src-tauri/src/sentinel/command.rs src-tauri/src/sentinel/graph.rs src-tauri/src/sentinel/handlers.rs
            src-tauri/src/sentinel/machine.rs src-tauri/src/sentinel/mod.rs src-tauri/src/sentinel/probe.rs
            src-tauri/src/sentinel/probe src-tauri/src/sentinel/provenance.rs src-tauri/src/sentinel/store.rs
            src-tauri/src/sentinel/storage.rs src-tauri/src/sentinel/storage
            src-tauri/src/service/cron.rs src-tauri/src/service/sentinel.rs src-tauri/src/service/sentinel/graph.rs
            src-tauri/src/agent/run_watcher.rs src-tauri/src/agent/run_watcher/cron_end.rs
            src-tauri/src/agent/run_watcher/cron_end/tests.rs
          )
          domain_ancestor=false
          domain_inventory_equal=false
