name: release-linux

# Builds the x86_64 Linux bundle (.deb + .AppImage) NATIVELY on the ubunta
# self-hosted runner (label `linux-build`), uploads it to the GitHub release,
# publishes the linux-x86_64 updater fragment (AppImage), folds the merged
# channel manifest (monotonic — see scripts/merge-latest-json.js), and mirrors
# the .deb + .AppImage + latest.json to the public release repo.
#
# The Mac (release.yml / build-all.sh) builds macOS + arm64 Linux; the ROG
# (release-windows.yml) builds Windows; this workflow owns x86_64 Linux. The
# same release-* tag fires all three. Each platform mirrors its large assets
# before its final fragment merge, so the last manifest writer sees all peers.
#
# glibc requirement: Ubuntu 24.04 (glibc 2.39). The pyke/ort prebuilt
# onnxruntime static lib references symbols (e.g. __isoc23_strtoll) that only
# exist in glibc >= 2.38; Ubuntu 22.04 (glibc 2.35) fails the link step.
#
# Triggers:
#   - push of a `release-*` tag (mapped to the vX.Y.Z release, matches release.yml)
#   - workflow_dispatch with explicit `tag` input (manual re-run / verification)
#
# Runner provisioning (one-time, on ubunta): register a self-hosted runner with
# label `linux-build`; install rustup on the repo-pinned channel (1.95.0),
# node 22 / pnpm 10.32.1, gh, and the GTK/webkit/appindicator/rsvg/patchelf/
# libfuse2/xdg-utils deps (pre-provisioned — the runner user has no passwordless
# sudo, so there is no per-build apt step).
#
# Disable: set repo Variable RELEASE_LINUX_ENABLED=false in
# Settings -> Secrets and variables -> Actions -> Variables.
#
# Required secrets: TAURI_SIGNING_PRIVATE_KEY, PACKAGE_REPOS_TOKEN.
# PACKAGE_REPOS_TOKEN must have contents:write for rollacode/codeterm-releases.
# Optional secret:  TAURI_KEY_PASSWORD (only if the signing key is
# encrypted — it evaluates to empty when unset).

"on":
  push:
    tags:
      - 'release-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.1.0). Required for manual runs.'
        required: true
        type: string
      mirror:
        description: 'Publish to the public mirror. Turn off only for a dry run — a manual run that does not mirror leaves the release incomplete.'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: build (x86_64-unknown-linux-gnu)
    if: ${{ vars.RELEASE_LINUX_ENABLED != 'false' }}
    runs-on: [self-hosted, linux-build]
    env:
      TARGET: x86_64-unknown-linux-gnu
      # linuxdeploy is itself an AppImage; if FUSE is unavailable in the runner's
      # service context, extract-and-run avoids the FUSE mount.
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            # push of release-X.Y.Z -> publish under the vX.Y.Z release (matches release.yml).
            echo "name=v${GITHUB_REF_NAME#release-}" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect channel and prerelease flag
        id: channel
        shell: bash
        run: |
          tag="${{ steps.tag.outputs.name }}"
          if [[ "$tag" == *-rc* ]]; then
            echo "manifest=latest-rc.json" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          elif [[ "$tag" == *-nightly* ]]; then
            echo "manifest=latest-nightly.json" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "manifest=latest.json" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # System deps (webkit2gtk-4.1, gtk-3, rsvg, appindicator, patchelf, libfuse2,
      # xdg-utils, …) are pre-provisioned on the self-hosted linux-build runner
      # (ubunta). No apt-install step — the runner user has no passwordless sudo,
      # and re-installing per build is wrong for a self-hosted machine.

      # Repo-pinned toolchain (rust-toolchain.toml = 1.95.0) drives rustc; do NOT
      # use dtolnay@stable, which would float off the pin. x86_64-unknown-linux-gnu
      # is the host target on the x86_64 runner, so no cross target is needed.
      - name: Show pinned Rust toolchain
        shell: bash
        run: |
          rustup show
          rustc -vV
          rustup target list --installed | grep -E 'x86_64-unknown-linux-gnu' || rustup target add "$TARGET"

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            cli
          key: ${{ env.TARGET }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false

      - name: Install npm dependencies
        run: pnpm install --frozen-lockfile

      - name: Build release bundle inputs
        shell: bash
        run: ./build.sh release-inputs

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # If the signing key is encrypted, add TAURI_KEY_PASSWORD to
          # repo secrets — this evaluates to an empty string otherwise.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.tag.outputs.name }}
          releaseName: 'CodeTerm ${{ steps.tag.outputs.name }}'
          releaseBody: 'See the assets to download this version and install. Auto-update users will be offered this build via the configured channel.'
          releaseDraft: true
          prerelease: ${{ steps.channel.outputs.prerelease }}
          # tauri-action's own updater-JSON path silently skips when its
          # internal sig matcher cannot pair an artifact with a signature.
          # We build the fragment ourselves below.
          includeUpdaterJson: false
          args: --target ${{ env.TARGET }} --bundles deb,appimage

      # Publish the linux-x86_64 updater fragment from the AppImage. The .sig is
      # read for its signature string but NOT uploaded (the updater reads the
      # signature from latest.json, never the .sig asset).
      - name: Publish AppImage updater fragment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
          SOURCE_REPO: ${{ github.repository }}
          MANIFEST_REPO: rollacode/codeterm-releases
          PLATFORM_KEY: linux-x86_64
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_ROOT="src-tauri/target/${TARGET}/release/bundle"
          echo "::group::bundle directory listing"
          find "$BUNDLE_ROOT" -maxdepth 3 -type f | sort || true
          echo "::endgroup::"
          # Prefer the v1-compatible .AppImage.tar.gz updater bundle if Tauri
          # produced one; otherwise the direct .AppImage that Tauri 2 uses.
          UPDATER_SIG=$(find "$BUNDLE_ROOT/appimage" -name '*.AppImage.tar.gz.sig' 2>/dev/null | head -n1 || true)
          if [ -z "$UPDATER_SIG" ]; then
            UPDATER_SIG=$(find "$BUNDLE_ROOT/appimage" -name '*.AppImage.sig' 2>/dev/null | head -n1 || true)
          fi
          [ -n "$UPDATER_SIG" ] || { echo "::error::No AppImage signature under $BUNDLE_ROOT/appimage"; exit 1; }
          UPDATER_BUNDLE="${UPDATER_SIG%.sig}"
          [ -f "$UPDATER_BUNDLE" ] || { echo "::error::Bundle missing next to $UPDATER_SIG"; exit 1; }

          # Upload the updater bundle (the file the updater downloads); not the .sig.
          gh release upload "$TAG" "$UPDATER_BUNDLE" --clobber --repo "$SOURCE_REPO"

          OUT="updater-${TARGET}.json"
          REPO="$MANIFEST_REPO" \
          UPDATER_BUNDLE="$UPDATER_BUNDLE" \
          UPDATER_SIG="$UPDATER_SIG" \
          OUT="$OUT" \
            python3 .github/workflows/build-updater-fragment.py
          gh release upload "$TAG" "$OUT" --clobber --repo "$SOURCE_REPO"

      # Deb-installed Linux builds use Tauri's deb installer, which validates
      # the downloaded bytes as a .deb before invoking dpkg. Keep this in a
      # separate manifest because linux-x86_64 can only map to one artifact per
      # Tauri manifest.
      - name: Publish Debian updater fragment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
          SOURCE_REPO: ${{ github.repository }}
          MANIFEST_REPO: rollacode/codeterm-releases
          PLATFORM_KEY: linux-x86_64
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_ROOT="src-tauri/target/${TARGET}/release/bundle"
          DEB_SIG=$(find "$BUNDLE_ROOT/deb" -name '*.deb.sig' 2>/dev/null | head -n1 || true)
          [ -n "$DEB_SIG" ] || { echo "::error::No deb signature under $BUNDLE_ROOT/deb"; exit 1; }
          DEB_BUNDLE="${DEB_SIG%.sig}"
          [ -f "$DEB_BUNDLE" ] || { echo "::error::Deb bundle missing next to $DEB_SIG"; exit 1; }

          OUT="updater-${TARGET}-deb.json"
          REPO="$MANIFEST_REPO" \
          UPDATER_BUNDLE="$DEB_BUNDLE" \
          UPDATER_SIG="$DEB_SIG" \
          OUT="$OUT" \
            python3 .github/workflows/build-updater-fragment.py
          gh release upload "$TAG" "$OUT" --clobber --repo "$SOURCE_REPO"

      # Rebuild latest.json from ALL fragments present + the existing manifest
      # (monotonic --base): a workflow finishing after us cannot drop the
      # platform we just published, and we cannot drop theirs.
      - name: Refresh merged channel manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
          SOURCE_REPO: ${{ github.repository }}
          MANIFEST: ${{ steps.channel.outputs.manifest }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _merge && mkdir -p _merge
          gh release download "$TAG" --pattern 'updater-*.json' --dir _raw --repo "$SOURCE_REPO" || true
          i=0
          for f in _raw/updater-*.json; do
            [ -f "$f" ] || continue
            case "$(basename "$f")" in
              *-deb.json) continue ;;
            esac
            d="_merge/frag-$i"; mkdir -p "$d"; cp "$f" "$d/latest.json"; i=$((i+1))
          done
          BASE_ARG=()
          if gh release download "$TAG" --pattern 'latest.json' --dir _base --repo "$SOURCE_REPO" 2>/dev/null; then
            [ -f _base/latest.json ] && BASE_ARG=(--base _base/latest.json)
          fi
          # _merge came back through the release assets, where a re-run can read a
          # cached copy of the asset it just replaced. Our own fragment overlays last.
          rm -rf _overlay && mkdir -p _overlay
          cp "updater-${TARGET}.json" _overlay/
          node scripts/merge-latest-json.js --in _merge --out "$MANIFEST" "${BASE_ARG[@]}" --overlay _overlay
          gh release upload "$TAG" "$MANIFEST" --clobber --repo "$SOURCE_REPO"

      - name: Refresh Debian updater manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
          SOURCE_REPO: ${{ github.repository }}
          CHANNEL_MANIFEST: ${{ steps.channel.outputs.manifest }}
        shell: bash
        run: |
          set -euo pipefail
          case "$CHANNEL_MANIFEST" in
            latest.json) DEB_MANIFEST="latest-deb.json" ;;
            latest-rc.json) DEB_MANIFEST="latest-rc-deb.json" ;;
            latest-nightly.json) DEB_MANIFEST="latest-nightly-deb.json" ;;
            *) echo "::error::Unknown channel manifest $CHANNEL_MANIFEST"; exit 1 ;;
          esac

          rm -rf _merge_deb _raw_deb && mkdir -p _merge_deb
          gh release download "$TAG" --pattern 'updater-*-deb.json' --dir _raw_deb --repo "$SOURCE_REPO" || true
          i=0
          for f in _raw_deb/updater-*-deb.json; do
            [ -f "$f" ] || continue
            d="_merge_deb/frag-$i"; mkdir -p "$d"; cp "$f" "$d/latest.json"; i=$((i+1))
          done
          rm -rf _overlay_deb && mkdir -p _overlay_deb
          cp "updater-${TARGET}-deb.json" _overlay_deb/
          node scripts/merge-latest-json.js --in _merge_deb --out "$DEB_MANIFEST" --overlay _overlay_deb
          gh release upload "$TAG" "$DEB_MANIFEST" --clobber --repo "$SOURCE_REPO"

      # Mirror the .deb + .AppImage (user downloads) + updater bundle + merged
      # manifest to the public release repo so the auto-updater + anonymous
      # downloads work. A tag push always mirrors; a manual run mirrors unless it
      # was explicitly asked not to, because a manual run that silently skips this
      # produces a green workflow and a release users cannot download.
      - name: Mirror to public release repo
        if: github.event_name == 'push' || inputs.mirror
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_REPOS_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
          MANIFEST: ${{ steps.channel.outputs.manifest }}
          PRERELEASE: ${{ steps.channel.outputs.prerelease }}
          MIRROR_REPO: rollacode/codeterm-releases
        shell: bash
        run: |
          set -euo pipefail
          case "$MANIFEST" in
            latest.json) DEB_MANIFEST="latest-deb.json" ;;
            latest-rc.json) DEB_MANIFEST="latest-rc-deb.json" ;;
            latest-nightly.json) DEB_MANIFEST="latest-nightly-deb.json" ;;
            *) echo "::error::Unknown channel manifest $MANIFEST"; exit 1 ;;
          esac

          BUNDLE_ROOT="src-tauri/target/${TARGET}/release/bundle"
          DEB=$(find "$BUNDLE_ROOT/deb" -name '*.deb' 2>/dev/null | head -n1)
          APPIMAGE=$(find "$BUNDLE_ROOT/appimage" -name '*.AppImage' 2>/dev/null | head -n1)
          UPDATER_BUNDLE=$(find "$BUNDLE_ROOT/appimage" -name '*.AppImage.tar.gz' 2>/dev/null | head -n1 || true)
          [ -n "$DEB" ] || { echo "::error::No .deb under $BUNDLE_ROOT/deb"; exit 1; }
          [ -n "$APPIMAGE" ] || { echo "::error::No .AppImage under $BUNDLE_ROOT/appimage"; exit 1; }

          # Idempotent: create the mirror release only if missing. Each platform
          # workflow may run in any order; first one wins, rest add assets.
          if ! gh release view "$TAG" --repo "$MIRROR_REPO" >/dev/null 2>&1; then
            if [ "$PRERELEASE" = "true" ]; then
              gh release create "$TAG" --repo "$MIRROR_REPO" --title "CodeTerm $TAG" \
                --notes "Auto-mirrored from rollacode/codeterm. See the source repo for full release notes." --prerelease
            else
              gh release create "$TAG" --repo "$MIRROR_REPO" --title "CodeTerm $TAG" \
                --notes "Auto-mirrored from rollacode/codeterm. See the source repo for full release notes."
            fi
          fi

          ASSETS=("$DEB" "$APPIMAGE")
          [ -n "$UPDATER_BUNDLE" ] && ASSETS+=("$UPDATER_BUNDLE")
          gh release upload "$TAG" "${ASSETS[@]}" --clobber --repo "$MIRROR_REPO"

      # Publish manifests only after the large asset mirror. The last platform
      # writer then rebuilds from every fragment already eligible to publish.
      - name: Reconcile published manifests after asset mirror
        if: github.event_name == 'push' || inputs.mirror
        env:
          SOURCE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIRROR_TOKEN: ${{ secrets.PACKAGE_REPOS_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
          SOURCE_REPO: ${{ github.repository }}
          MIRROR_REPO: rollacode/codeterm-releases
          MANIFEST: ${{ steps.channel.outputs.manifest }}
        shell: bash
        run: |
          set -euo pipefail
          case "$MANIFEST" in
            latest.json) DEB_MANIFEST="latest-deb.json" ;;
            latest-rc.json) DEB_MANIFEST="latest-rc-deb.json" ;;
            latest-nightly.json) DEB_MANIFEST="latest-nightly-deb.json" ;;
            *) echo "::error::Unknown channel manifest $MANIFEST"; exit 1 ;;
          esac

          rm -rf _final_raw _final_merge _final_base _final_overlay _final_deb
          mkdir -p _final_raw _final_merge _final_overlay _final_deb
          export GH_TOKEN="$SOURCE_TOKEN"
          gh release download "$TAG" --pattern 'updater-*.json' --dir _final_raw --repo "$SOURCE_REPO"
          i=0
          for f in _final_raw/updater-*.json; do
            [ -f "$f" ] || continue
            case "$(basename "$f")" in
              *-deb.json) continue ;;
            esac
            d="_final_merge/frag-$i"; mkdir -p "$d"; cp "$f" "$d/latest.json"; i=$((i+1))
          done
          BASE_ARG=()
          if gh release download "$TAG" --pattern "$MANIFEST" --dir _final_base --repo "$SOURCE_REPO" 2>/dev/null; then
            [ -f "_final_base/$MANIFEST" ] && BASE_ARG=(--base "_final_base/$MANIFEST")
          fi
          cp "updater-${TARGET}.json" _final_overlay/
          node scripts/merge-latest-json.js --in _final_merge --out "$MANIFEST" "${BASE_ARG[@]}" --overlay _final_overlay
          gh release upload "$TAG" "$MANIFEST" --clobber --repo "$SOURCE_REPO"
          gh release download "$TAG" --pattern "$DEB_MANIFEST" --dir _final_deb --repo "$SOURCE_REPO"

          export GH_TOKEN="$MIRROR_TOKEN"
          gh release upload "$TAG" "$MANIFEST" "_final_deb/$DEB_MANIFEST" --clobber --repo "$MIRROR_REPO"

  completion:
    name: publish Linux completion signal
    if: ${{ always() }}
    needs: build
    runs-on: [self-hosted, linux-build]
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish completion signal
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REPO: ${{ github.repository }}
          RELEASE_REF: ${{ github.ref_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ github.sha }}
          BUILD_RESULT: ${{ needs.build.result }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          ref="$RELEASE_REF"
          [ "$EVENT_NAME" = workflow_dispatch ] && ref="$DISPATCH_TAG"
          case "$ref" in
            release-*) tag="v${ref#release-}" ;;
            v*) tag="$ref" ;;
            *) echo "::error::cannot derive release tag from '$ref'"; exit 1 ;;
          esac
          status=success
          reason="Linux x86_64 publication completed"
          if [ "$BUILD_RESULT" != success ]; then
            status=failure
            reason="release-linux build concluded $BUILD_RESULT before publication completed"
          elif [ "$EVENT_NAME" != push ]; then
            status=failure
            reason="manual Linux run did not publish the canonical public mirror"
          fi
          mkdir -p "$RUNNER_TEMP/release-completion"
          jq -n \
            --arg schema release-completion-v1 \
            --arg release_tag "$tag" \
            --arg workflow release-linux \
            --arg status "$status" \
            --arg reason "$reason" \
            --arg source_sha "$SOURCE_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --argjson platforms '["linux-x86_64"]' \
            '{schema: $schema, release_tag: $release_tag, workflow: $workflow,
              status: $status, reason: $reason, source_sha: $source_sha,
              run_id: $run_id, platforms: $platforms}' \
            > "$RUNNER_TEMP/release-completion/release-completion-release-linux.json"
          if ! gh release view "$tag" --repo "$SOURCE_REPO" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$SOURCE_REPO" --target "$SOURCE_SHA" --draft \
              --title "CodeTerm $tag" --notes "Release completion signal."
          fi
          gh release upload "$tag" \
            "$RUNNER_TEMP/release-completion/release-completion-release-linux.json" \
            --repo "$SOURCE_REPO" --clobber

      - name: Assert the release validator is armed
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          LEG: ${{ github.workflow }}
        shell: bash
        run: |
          set -euo pipefail
          validator=release-manifest-validate
          file=".github/workflows/$validator.yml"
          api="repos/$SOURCE_REPO"
          raw="Accept: application/vnd.github.raw"
          state=$(gh api "$api/actions/workflows/$validator.yml" --jq .state 2>/dev/null || true)
          source=$(gh api "$api/contents/$file?ref=$DEFAULT_BRANCH" -H "$raw" 2>/dev/null || true)
          fixture="$RUNNER_TEMP/validator-armed.json"
          jq -n --arg validator "$validator" --arg leg "$LEG" --arg branch "$DEFAULT_BRANCH" --arg state "$state" --arg source "$source" '{validator: $validator, leg: $leg, default_branch: $branch, state: (if $state == "" then null else $state end), default_branch_source: (if $source == "" then null else $source end)}' > "$fixture"
          set +e
          output=$(python3 scripts/release_validator_armed.py "$fixture" 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          [ "$status" -eq 0 ] || { echo "::error::$output"; exit "$status"; }
