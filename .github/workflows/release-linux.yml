name: release-linux

# Builds the Linux bundles (AppImage + .deb) on ubuntu-24.04, uploads to
# the GitHub release, then refreshes the channel updater manifest.
#
# Runner choice: ubuntu-24.04 ships glibc 2.39, which is required by the
# pyke/ort prebuilt onnxruntime static library — it references symbols
# such as __isoc23_strtoll that only exist in glibc >= 2.38. Building on
# ubuntu-22.04 (glibc 2.35) fails the link step.
#
# Triggers:
#   - push of a tag matching v*  (fires alongside Windows / macOS workflows)
#   - workflow_dispatch with explicit `tag` input (manual re-run)
#
# Disable: set repo Variable RELEASE_LINUX_ENABLED=false in
# Settings -> Secrets and variables -> Actions -> Variables.
#
# Required secrets: TAURI_SIGNING_PRIVATE_KEY, PACKAGE_REPOS_TOKEN.
# PACKAGE_REPOS_TOKEN must have contents:write for rollacode/codeterm-releases.
# Optional secret:  TAURI_KEY_PASSWORD (only if the signing key is
# encrypted — it evaluates to empty when unset).

"on":
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.1.0). Required for manual runs.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: build (x86_64-unknown-linux-gnu)
    if: ${{ vars.RELEASE_LINUX_ENABLED != 'false' }}
    runs-on: ubuntu-24.04
    env:
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect channel and prerelease flag
        id: channel
        shell: bash
        run: |
          tag="${{ steps.tag.outputs.name }}"
          if [[ "$tag" == *-rc* ]]; then
            echo "manifest=latest-rc.json" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          elif [[ "$tag" == *-nightly* ]]; then
            echo "manifest=latest-nightly.json" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "manifest=latest.json" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            cli
          key: ${{ env.TARGET }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false

      - name: Install npm dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # If the signing key is encrypted, add TAURI_KEY_PASSWORD to
          # repo secrets — this evaluates to an empty string otherwise.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.tag.outputs.name }}
          releaseName: 'CodeTerm ${{ steps.tag.outputs.name }}'
          releaseBody: 'See the assets to download this version and install. Auto-update users will be offered this build via the configured channel.'
          releaseDraft: true
          prerelease: ${{ steps.channel.outputs.prerelease }}
          # tauri-action's own updater-JSON path silently skips when its
          # internal sig matcher cannot pair an artifact with a signature.
          # We build the fragment ourselves below.
          includeUpdaterJson: false
          args: --target ${{ env.TARGET }} --bundles appimage,deb

      - name: Publish per-platform updater fragment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
          REPO: ${{ github.repository }}
          PLATFORM_KEY: linux-x86_64
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_ROOT="src-tauri/target/${TARGET}/release/bundle"
          echo "::group::bundle directory listing"
          find "$BUNDLE_ROOT" -maxdepth 3 -type f | sort || true
          echo "::endgroup::"
          # Prefer the v1-compatible .AppImage.tar.gz updater bundle if Tauri
          # produced one; otherwise fall back to the direct .AppImage that
          # Tauri 2 uses by default.
          UPDATER_SIG=$(find "$BUNDLE_ROOT/appimage" -name '*.AppImage.tar.gz.sig' 2>/dev/null | head -n1)
          if [ -z "$UPDATER_SIG" ]; then
            UPDATER_SIG=$(find "$BUNDLE_ROOT/appimage" -name '*.AppImage.sig' 2>/dev/null | head -n1)
          fi
          [ -n "$UPDATER_SIG" ] || { echo "::error::No AppImage signature under $BUNDLE_ROOT/appimage"; exit 1; }
          UPDATER_BUNDLE="${UPDATER_SIG%.sig}"
          [ -f "$UPDATER_BUNDLE" ] || { echo "::error::Bundle missing next to $UPDATER_SIG"; exit 1; }

          gh release upload "$TAG" "$UPDATER_BUNDLE" "$UPDATER_SIG" --clobber --repo "$REPO"

          OUT="updater-${TARGET}.json"
          UPDATER_BUNDLE="$UPDATER_BUNDLE" \
          UPDATER_SIG="$UPDATER_SIG" \
          OUT="$OUT" \
            python3 .github/workflows/build-updater-fragment.py
          gh release upload "$TAG" "$OUT" --clobber --repo "$REPO"

      - name: Refresh merged channel manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          mkdir -p _frags manifest-fragments
          gh release download "${{ steps.tag.outputs.name }}" \
            --pattern 'updater-*.json' \
            --dir _frags \
            --repo "${{ github.repository }}"
          for f in _frags/updater-*.json; do
            base=$(basename "$f" .json)
            mkdir -p "manifest-fragments/$base"
            cp "$f" "manifest-fragments/$base/latest.json"
          done
          node scripts/merge-latest-json.js \
            --in manifest-fragments \
            --out "${{ steps.channel.outputs.manifest }}"
          gh release upload "${{ steps.tag.outputs.name }}" \
            "${{ steps.channel.outputs.manifest }}" \
            --clobber --repo "${{ github.repository }}"

      # Mirror updater bundle, signature, and merged manifest to the public
      # release repo so the auto-updater endpoint
      # (rollacode/codeterm-releases/releases/latest/download/latest.json) can
      # serve them anonymously. Skip on workflow_dispatch — only mirror on the
      # actual tag push that produces the canonical release.
      - name: Mirror to public release repo
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_REPOS_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
          MANIFEST: ${{ steps.channel.outputs.manifest }}
          PRERELEASE: ${{ steps.channel.outputs.prerelease }}
          MIRROR_REPO: rollacode/codeterm-releases
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_ROOT="src-tauri/target/${TARGET}/release/bundle"
          UPDATER_SIG=$(find "$BUNDLE_ROOT/appimage" -name '*.AppImage.tar.gz.sig' 2>/dev/null | head -n1)
          if [ -z "$UPDATER_SIG" ]; then
            UPDATER_SIG=$(find "$BUNDLE_ROOT/appimage" -name '*.AppImage.sig' 2>/dev/null | head -n1)
          fi
          [ -n "$UPDATER_SIG" ] || { echo "::error::No AppImage signature under $BUNDLE_ROOT/appimage"; exit 1; }
          UPDATER_BUNDLE="${UPDATER_SIG%.sig}"
          [ -f "$UPDATER_BUNDLE" ] || { echo "::error::Bundle missing next to $UPDATER_SIG"; exit 1; }

          # Idempotent: create the release in the mirror only if missing.
          # Each platform workflow may run this step in any order; first one
          # wins, the rest just upload assets to the existing release.
          if ! gh release view "$TAG" --repo "$MIRROR_REPO" >/dev/null 2>&1; then
            if [ "$PRERELEASE" = "true" ]; then
              gh release create "$TAG" \
                --repo "$MIRROR_REPO" \
                --title "CodeTerm $TAG" \
                --notes "Auto-mirrored from rollacode/codeterm. See the source repo for full release notes." \
                --prerelease
            else
              gh release create "$TAG" \
                --repo "$MIRROR_REPO" \
                --title "CodeTerm $TAG" \
                --notes "Auto-mirrored from rollacode/codeterm. See the source repo for full release notes."
            fi
          fi

          gh release upload "$TAG" "$UPDATER_BUNDLE" "$UPDATER_SIG" "$MANIFEST" \
            --clobber --repo "$MIRROR_REPO"
