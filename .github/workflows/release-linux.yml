name: Release Linux x86_64 platform

# Builds the x86_64 Linux bundle (.deb + .AppImage) NATIVELY on the ubunta
# self-hosted runner (label `linux-build`). It uploads build assets and updater
# fragments; the caller's final job assembles and verifies the channel manifests.
#
# The caller creates the private and public draft releases before platform jobs start.
# Runner provisioning (one-time, on ubunta): register a self-hosted runner with
# label `linux-build`; install rustup on the repo-pinned channel (1.99.1),
# node 22 / pnpm 10.32.1, gh, and the GTK/webkit/appindicator/rsvg/patchelf/
# libfuse2/xdg-utils deps (pre-provisioned — the runner user has no passwordless
# sudo, so there is no per-build apt step).
#
# Disable: set repo Variable RELEASE_LINUX_ENABLED=false in
# Settings -> Secrets and variables -> Actions -> Variables.
#
# Required secrets: TAURI_SIGNING_PRIVATE_KEY, PACKAGE_REPOS_TOKEN.
# PACKAGE_REPOS_TOKEN must have contents:write for rollacode/codeterm-releases.
# Optional secret:  TAURI_KEY_PASSWORD (only if the signing key is
# encrypted — it evaluates to empty when unset).

"on":
  workflow_dispatch:
    inputs:
      tag:
        description: Package version (vX.Y.Z)
        required: true
        type: string
      source_ref:
        description: Exact source commit SHA
        required: true
        type: string
      dry_run:
        description: Direct dispatch never publishes
        type: boolean
        default: true
      mirror:
        type: boolean
        default: false
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      source_ref:
        required: true
        type: string
      mirror:
        required: true
        type: boolean
      dry_run:
        required: false
        default: false
        type: boolean
      frontend_sha256:
        description: Digest of the run's single frontend bundle; empty builds the frontend here
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: read

env:
  CODETERM_SCCACHE_CREDENTIAL_SOURCE: runner
  # Builders are shared with agents; a CI job queues for the slot instead of failing busy (75).
  CODETERM_BUILD_GATEWAY_MODE: queue

jobs:
  build:
    name: build (x86_64-unknown-linux-gnu)
    if: ${{ (github.repository_owner == 'rollacode' || github.repository_owner == 'domios-dev') && github.actor == 'rollacode' && github.triggering_actor == 'rollacode' && ((startsWith(github.ref, 'refs/heads/release/') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.path == '.github/workflows/tests.yml' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.actor.login == 'rollacode' && github.event.workflow_run.triggering_actor.login == 'rollacode' && startsWith(github.event.workflow_run.head_branch, 'release/'))) }}
    environment: release
    runs-on: [self-hosted, "${{ vars.RELEASE_LINUX_X64_LABEL || 'linux-build' }}"]
    timeout-minutes: 120
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
      DOMIOS_FIREBASE_API_KEY: ${{ secrets.DOMIOS_FIREBASE_API_KEY }}
      DOMIOS_FIREBASE_PROJECT_ID: ${{ secrets.DOMIOS_FIREBASE_PROJECT_ID }}
      DOMIOS_FIREBASE_APP_ID: ${{ secrets.DOMIOS_FIREBASE_APP_ID }}
      DOMIOS_ACCOUNT_REDEEM_URL: ${{ secrets.DOMIOS_ACCOUNT_REDEEM_URL }}
      DOMIOS_BILLING_FUNCTIONS_URL: ${{ secrets.DOMIOS_BILLING_FUNCTIONS_URL }}
      DOMIOS_AMPLITUDE_API_KEY_TEST: ${{ secrets.DOMIOS_AMPLITUDE_API_KEY_TEST }}
      DOMIOS_AMPLITUDE_API_KEY_PROD: ${{ secrets.DOMIOS_AMPLITUDE_API_KEY_PROD }}
      CODETERM_SCCACHE_VERIFY_ONLY: '1'
      RUSTUP_TOOLCHAIN: 1.99.1
      RUSTC_WRAPPER: sccache
      TARGET: x86_64-unknown-linux-gnu
      CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
      # Absolute: the prebuild step runs from the repo root and tauri-action runs
      # cargo from src-tauri, so a relative path lands in src-tauri/src-tauri/target.
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
      CODETERM_RELEASE_COMMON_STAGE: '1'
      CARGO_INCREMENTAL: '0'
      # linuxdeploy is itself an AppImage; if FUSE is unavailable in the runner's
      # service context, extract-and-run avoids the FUSE mount.
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:

      - name: Use the runner bundled Node
        if: runner.environment == 'self-hosted'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |-
            const path = require('node:path');
            core.addPath(path.dirname(process.execPath));
            core.info('Using runner Node ' + process.version);
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          package-manager-cache: false
          node-version: 22.22.0
        if: runner.environment == 'github-hosted'
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
        if: runner.environment == 'github-hosted'
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1
      - name: Discover installed runner tools
        if: runner.environment == 'self-hosted'
        run: node scripts/ci-runner-paths.mjs --paths-only

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.32.1
          run_install: false
          dest: ${{ runner.tool_cache }}/setup-pnpm
        if: runner.environment == 'github-hosted'

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Detect channel and prerelease flag
        id: channel
        shell: bash
        run: |
          tag="${{ steps.tag.outputs.name }}"
          if [[ "$tag" == *-rc* ]]; then
            echo "manifest=domios-latest-rc.json" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          elif [[ "$tag" == *-nightly* ]]; then
            echo "manifest=domios-latest-nightly.json" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "manifest=domios-latest.json" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # System deps (webkit2gtk-4.1, gtk-3, rsvg, appindicator, patchelf, libfuse2,
      # xdg-utils, …) are pre-provisioned on the self-hosted linux-build runner
      # (ubunta). No apt-install step — the runner user has no passwordless sudo,
      # and re-installing per build is wrong for a self-hosted machine.

      # Repo-pinned toolchain (rust-toolchain.toml = 1.99.1) drives rustc; do NOT
      # use dtolnay@stable, which would float off the pin. x86_64-unknown-linux-gnu
      # is the host target on the x86_64 runner, so no cross target is needed.
      - name: Show pinned Rust toolchain
        shell: bash
        run: |
          rustup show
          rustc -vV
          rustup target list --installed | grep -E 'x86_64-unknown-linux-gnu' || rustup target add "$TARGET"
      - name: Runner preflight
        run: node scripts/ci-runner-paths.mjs packaging

      - name: Reset compiler capture
        continue-on-error: true
        run: node -e "require('fs').writeFileSync('ci-rust-warnings.log', '')"

      - name: Install npm dependencies
        run: pnpm install --frozen-lockfile

      - name: Clear incomplete release uploads for retry
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.workflow == 'Release Linux x86_64 platform') && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          MIRROR_TOKEN: ${{ secrets.PACKAGE_REPOS_TOKEN }}
          PUBLISH_MIRROR: ${{ inputs.mirror }}
          TAG: ${{ inputs.tag }}
          SOURCE_REPO: ${{ github.repository }}
        shell: bash
        run: |
          node scripts/release-clear-wedged-assets.mjs "$SOURCE_REPO" "$TAG" linux-x86_64
          if [ "$PUBLISH_MIRROR" = true ]; then
            GH_TOKEN="$MIRROR_TOKEN" node scripts/release-clear-wedged-assets.mjs rollacode/codeterm-releases "$TAG" linux-x86_64
          fi

      - name: Verify shared compile cache
        run: bash build.sh cache-verify

      - name: Download digest-pinned frontend bundle
        if: ${{ inputs.frontend_sha256 != '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: frontend-dist-${{ inputs.frontend_sha256 }}
          path: ${{ runner.temp }}
      - name: Fetch the run's frontend bundle
        if: ${{ inputs.frontend_sha256 != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-frontend-dist.mjs fetch-run-artifact "$GITHUB_RUN_ID" "${{ inputs.frontend_sha256 }}" "$RUNNER_TEMP/frontend-dist.tar"

      - name: Build release bundle inputs
        id: compile
        shell: bash
        run: node scripts/collect-rust-warnings.mjs run --log ci-rust-warnings.log -- bash build.sh release-inputs --for-bundle

      # Build and sign only. tauri-action's uploader reports a bare "Error saving
      # asset" with no status, body or asset name, which cost 1.11.3 four runs.
      - name: Build and sign release bundles
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # If the signing key is encrypted, add TAURI_KEY_PASSWORD to
          # repo secrets — this evaluates to an empty string otherwise.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Cargo's raw domios-server file occupies the resource directory name during compilation.
        run: >-
          node scripts/collect-rust-warnings.mjs run --log ci-rust-warnings.log -- pnpm tauri build --no-bundle --target "$TARGET" --config '{"bundle":{"resources":[],"externalBin":[]}}'

      - name: Stage final pair resources and bundle without compilation
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_ref }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          node scripts/release-stage.mjs stage-full --target "$TARGET" --source-sha "$SOURCE_SHA" \
            --cargo-log "release-artifacts/build-logs/$TARGET/server.jsonl" \
            --tree-log "release-artifacts/build-logs/$TARGET/closure.txt" \
            --client-file "src-tauri/target/$TARGET/release/domios-app"
          pnpm tauri bundle --no-binary-patching --target "$TARGET" --bundles deb,appimage

      - name: Produce shared headless stage and package
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          mapfile -t debs < <(find "src-tauri/target/${TARGET}/release/bundle/deb" -maxdepth 1 -type f -name '*.deb')
          [ "${#debs[@]}" -eq 1 ] || { echo "::error::Expected one full Debian package"; exit 1; }
          node scripts/release-stage.mjs finalize --target "$TARGET" --tag "$TAG" \
            --version "${TAG#v}" --source-sha "$SOURCE_SHA" \
            --cargo-log "release-artifacts/build-logs/$TARGET/server.jsonl" \
            --tree-log "release-artifacts/build-logs/$TARGET/closure.txt" \
            --bundle "${debs[0]}" --output-dir release-artifacts

      - name: Verify independent headless assets and checksum
        run: node scripts/release-headless-assets.mjs verify "${{ inputs.tag }}" linux-x86_64 release-artifacts "${{ inputs.source_ref }}"

      - name: Smoke built release bundle
        run: node scripts/release-bundle-smoke.mjs linux "src-tauri/target/${TARGET}/release/bundle" "${{ inputs.source_ref }}" x64

      - name: Verify local updater signatures before uploads
        env:
          TAG: ${{ inputs.tag }}
          REPO: rollacode/codeterm-releases
          PLATFORM_KEY: linux-x86_64
        run: |
          set -euo pipefail
          for type in appimage deb; do
            root="src-tauri/target/${TARGET}/release/bundle/$type"
            sig=$(find "$root" -name '*.sig' | head -n1)
            test -n "$sig"
            UPDATER_SIG="$sig" UPDATER_BUNDLE="${sig%.sig}" OUT="$RUNNER_TEMP/verify-$type.json" python3 .github/workflows/build-updater-fragment.py
            node scripts/verify-updater-manifest.mjs --manifest "$RUNNER_TEMP/verify-$type.json" --local "$root" --require-version "${TAG#v}" --require-platform linux-x86_64
          done

      - name: Retain private dry-run updater evidence
        if: ${{ inputs.dry_run }}
        run: >-
          node scripts/release-dry-run-manifest.mjs capture "${{ inputs.tag }}" "${{ inputs.source_ref }}" "$GITHUB_RUN_ID" linux-x86_64 "src-tauri/target/$TARGET/release/bundle" release-artifacts "$RUNNER_TEMP/dry-run-linux-x86_64"

      - name: Publish the Linux bundles
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.workflow == 'Release Linux x86_64 platform') && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
          PRERELEASE: ${{ steps.channel.outputs.prerelease }}
          SOURCE_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_ROOT="src-tauri/target/${TARGET}/release/bundle"
          DEB=$(find "$BUNDLE_ROOT/deb" -name '*.deb' 2>/dev/null | head -n1)
          APPIMAGE=$(find "$BUNDLE_ROOT/appimage" -name '*.AppImage' 2>/dev/null | head -n1)
          [ -n "$DEB" ] || { echo "::error::No .deb under $BUNDLE_ROOT/deb"; exit 1; }
          [ -n "$APPIMAGE" ] || { echo "::error::No .AppImage under $BUNDLE_ROOT/appimage"; exit 1; }

          if ! gh release view "$TAG" --repo "$SOURCE_REPO" >/dev/null 2>&1; then
            extra=""
            [ "$PRERELEASE" = "true" ] && extra="--prerelease"
            gh release create "$TAG" --repo "$SOURCE_REPO" --draft $extra               --title "Domios $TAG"               --notes "See the assets to download this version and install. Auto-update users will be offered this build via the configured channel."
          fi

          node scripts/release-upload-assets.mjs "$SOURCE_REPO" "$TAG" "$DEB" "$APPIMAGE"

      # Publish the linux-x86_64 updater fragment from the AppImage. The .sig is
      # read for its signature string but NOT uploaded (the updater reads the
      # signature from domios-latest.json, never the .sig asset).
      - name: Publish AppImage updater fragment
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.workflow == 'Release Linux x86_64 platform') && !inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
          SOURCE_REPO: ${{ github.repository }}
          MANIFEST_REPO: rollacode/codeterm-releases
          PLATFORM_KEY: linux-x86_64
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_ROOT="src-tauri/target/${TARGET}/release/bundle"
          echo "::group::bundle directory listing"
          find "$BUNDLE_ROOT" -maxdepth 3 -type f | sort || true
          echo "::endgroup::"
          # Prefer the v1-compatible .AppImage.tar.gz updater bundle if Tauri
          # produced one; otherwise the direct .AppImage that Tauri 2 uses.
          UPDATER_SIG=$(find "$BUNDLE_ROOT/appimage" -name '*.AppImage.tar.gz.sig' 2>/dev/null | head -n1 || true)
          if [ -z "$UPDATER_SIG" ]; then
            UPDATER_SIG=$(find "$BUNDLE_ROOT/appimage" -name '*.AppImage.sig' 2>/dev/null | head -n1 || true)
          fi
          [ -n "$UPDATER_SIG" ] || { echo "::error::No AppImage signature under $BUNDLE_ROOT/appimage"; exit 1; }
          UPDATER_BUNDLE="${UPDATER_SIG%.sig}"
          [ -f "$UPDATER_BUNDLE" ] || { echo "::error::Bundle missing next to $UPDATER_SIG"; exit 1; }

          # Upload the updater bundle (the file the updater downloads); not the .sig.
          gh release upload "$TAG" "$UPDATER_BUNDLE" --clobber --repo "$SOURCE_REPO"

          OUT="updater-${TARGET}.json"
          REPO="$MANIFEST_REPO" \
          UPDATER_BUNDLE="$UPDATER_BUNDLE" \
          UPDATER_SIG="$UPDATER_SIG" \
          OUT="$OUT" \
            python3 .github/workflows/build-updater-fragment.py
          gh release upload "$TAG" "$OUT" --clobber --repo "$SOURCE_REPO"

      # Deb-installed Linux builds use Tauri's deb installer, which validates
      # the downloaded bytes as a .deb before invoking dpkg. Keep this in a
      # separate manifest because linux-x86_64 can only map to one artifact per
      # Tauri manifest.
      - name: Publish Debian updater fragment
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.workflow == 'Release Linux x86_64 platform') && !inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
          SOURCE_REPO: ${{ github.repository }}
          MANIFEST_REPO: rollacode/codeterm-releases
          PLATFORM_KEY: linux-x86_64
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_ROOT="src-tauri/target/${TARGET}/release/bundle"
          DEB_SIG=$(find "$BUNDLE_ROOT/deb" -name '*.deb.sig' 2>/dev/null | head -n1 || true)
          [ -n "$DEB_SIG" ] || { echo "::error::No deb signature under $BUNDLE_ROOT/deb"; exit 1; }
          DEB_BUNDLE="${DEB_SIG%.sig}"
          [ -f "$DEB_BUNDLE" ] || { echo "::error::Deb bundle missing next to $DEB_SIG"; exit 1; }

          OUT="updater-${TARGET}-deb.json"
          REPO="$MANIFEST_REPO" \
          UPDATER_BUNDLE="$DEB_BUNDLE" \
          UPDATER_SIG="$DEB_SIG" \
          OUT="$OUT" \
            python3 .github/workflows/build-updater-fragment.py
          gh release upload "$TAG" "$OUT" --clobber --repo "$SOURCE_REPO"

      - name: Mirror to public release repo
        if: ${{ inputs.mirror && !(github.event_name == 'workflow_dispatch' && github.workflow == 'Release Linux x86_64 platform') && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_REPOS_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
          MIRROR_REPO: rollacode/codeterm-releases
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_ROOT="src-tauri/target/${TARGET}/release/bundle"
          DEB=$(find "$BUNDLE_ROOT/deb" -name '*.deb' 2>/dev/null | head -n1)
          APPIMAGE=$(find "$BUNDLE_ROOT/appimage" -name '*.AppImage' 2>/dev/null | head -n1)
          UPDATER_BUNDLE=$(find "$BUNDLE_ROOT/appimage" -name '*.AppImage.tar.gz' 2>/dev/null | head -n1 || true)
          [ -n "$DEB" ] || { echo "::error::No .deb under $BUNDLE_ROOT/deb"; exit 1; }
          [ -n "$APPIMAGE" ] || { echo "::error::No .AppImage under $BUNDLE_ROOT/appimage"; exit 1; }

          gh release view "$TAG" --repo "$MIRROR_REPO" >/dev/null

          ASSETS=("$DEB" "$APPIMAGE")
          [ -n "$UPDATER_BUNDLE" ] && ASSETS+=("$UPDATER_BUNDLE")
          gh release upload "$TAG" "${ASSETS[@]}" --clobber --repo "$MIRROR_REPO"

      - name: Publish and read back headless source assets
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.workflow == 'Release Linux x86_64 platform') && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-headless-assets.mjs publish "${{ inputs.tag }}" linux-x86_64 release-artifacts "${{ inputs.source_ref }}" "${{ github.repository }}"

      - name: Publish and read back headless mirror assets
        if: ${{ inputs.mirror && !(github.event_name == 'workflow_dispatch' && github.workflow == 'Release Linux x86_64 platform') && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_REPOS_TOKEN }}
        run: node scripts/release-headless-assets.mjs publish "${{ inputs.tag }}" linux-x86_64 release-artifacts "${{ inputs.source_ref }}" rollacode/codeterm-releases

      - uses: ./.github/actions/rust-warnings
        if: always()
        continue-on-error: true
        with:
          complete: ${{ job.status == 'success' }}
          platform: release-Linux
          target: x86_64-unknown-linux-gnu
      - name: Upload artifacts spooled while the private store was unreachable
        if: always()
        uses: ./.github/actions/ci-artifact-spool

      # Without a compile step no sccache server ever started, so there is nothing to report.
      - name: Shared compile cache statistics
        if: ${{ always() && steps.compile.outcome != 'skipped' }}
        run: bash build.sh cache-stats
      - name: Stop this job's local compile cache
        if: always()
        run: bash build.sh cache-release
      - name: Remove this job's Rust targets and archives
        if: always()
        continue-on-error: true
        run: node scripts/ci-workspace-cleanup.mjs
