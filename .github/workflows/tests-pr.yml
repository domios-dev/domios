name: Pull request checks
on:
  workflow_call: null
permissions:
  contents: read
env:
  CI_SOURCE_SHA: ${{ github.sha }}
  CODETERM_USE_SCCACHE: "0"
jobs:
  changed:
    name: tree is new
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      frontend: ${{ steps.tree.outputs.run == 'true' && steps.scope.outputs.frontend == 'true' }}
      rust: ${{ steps.tree.outputs.run == 'true' && steps.scope.outputs.rust == 'true' }}
      heavy: ${{ steps.tree.outputs.run == 'true' && steps.scope.outputs.heavy == 'true' }}
      plugins: ${{ steps.tree.outputs.run == 'true' && steps.scope.outputs.plugins || '[]' }}
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        id: ci-4
        with:
          package-manager-cache: false
          node-version: 22.22.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        id: ci-1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Runner preflight
        run: node scripts/ci-runner-paths.mjs bash,git,node
      - id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: tree
        env:
          CI_RELEASE_CALL: ${{ false }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$CI_RELEASE_CALL" = true ] || [ "${{ github.event_name }}" != push ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tree=$(git rev-parse 'HEAD^{tree}')
          for parent in $(git rev-parse 'HEAD^@'); do
            if [ "$(git rev-parse "$parent^{tree}")" = "$tree" ]; then
              echo "HEAD tree $tree already carried by parent $parent"
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "run=true" >> "$GITHUB_OUTPUT"
      - id: scope
        if: steps.tree.outputs.run == 'true'
        env:
          CI_FULL_MATRIX: ${{ false }}
          CI_FRONTEND_ONLY: ${{ false }}
          CI_FAST_ONLY: ${{ true }}
        run: node scripts/ci-scope.mjs HEAD^ HEAD
  guards:
    name: guards
    needs: changed
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        id: ci-2
        with:
          package-manager-cache: false
          node-version: 22.22.0
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        id: ci-1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Setup pnpm
        id: ci-12
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.32.1
          run_install: false
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - name: Install pinned nextest prerequisite
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91
        with:
          tool: cargo-nextest@0.9.148
      - name: Install pinned Python test dependencies
        run: node scripts/ci-python-env.mjs
      - name: Provision the pinned hosted Rust toolchain
        if: runner.environment == 'github-hosted'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.1
          components: clippy,rustfmt
      - name: Runner preflight
        run: node scripts/ci-runner-paths.mjs bash,cargo,git,nextest,node,pnpm,python,python:yaml
      - &a1
        name: Select PR catalogue
        id: catalogue
        shell: bash
        run: |
          node scripts/test-catalogue.mjs select --tier pr --format json > "$RUNNER_TEMP/pr-catalogue.json"
          node -e 'const fs = require("node:fs"); const selected = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/pr-catalogue.json", "utf8")); fs.appendFileSync(process.env.GITHUB_OUTPUT, "commands=" + JSON.stringify(Object.fromEntries(selected.runners.map(entry => [entry.id, entry.runner]))) + "\n");'
        if: "!cancelled()"
      - name: Installed application identity
        id: ci-5
        if: ${{ !cancelled() }}
        run: node scripts/check-installed-identity.mjs
      - name: Plugin release contracts
        id: ci-6
        if: ${{ !cancelled() }}
        run: node scripts/ci-step.mjs plugin-release-contracts --ci
      - name: cargo fmt --check
        id: ci-10
        if: ${{ !cancelled() && needs.changed.outputs.rust == 'true' }}
        run: node scripts/ci-step.mjs rust-fmt --ci
      - name: Archive-portable Rust test paths
        id: ci-11
        if: ${{ !cancelled() && needs.changed.outputs.rust == 'true' }}
        run: node scripts/check-archive-portable-test-paths.mjs
      - name: Install dependencies
        id: ci-13
        if: ${{ !cancelled() && needs.changed.outputs.rust == 'true' }}
        run: pnpm install --frozen-lockfile --store-dir "$RUNNER_TOOL_CACHE/pnpm-store"
      - name: Offline core journey contracts
        id: ci-16
        if: ${{ !cancelled() && needs.changed.outputs.rust == 'true' }}
        run: node scripts/ci-step.mjs core-journeys-offline --ci
  plugins:
    name: plugin (${{ matrix.plugin.id }})
    needs: changed
    if: ${{ needs.changed.outputs.plugins != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.changed.outputs.plugins) }}
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        id: ci-2
        with:
          package-manager-cache: false
          node-version: 22.22.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        id: ci-1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        id: ci-3
        with:
          version: 10.32.1
          run_install: false
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - name: Runner preflight
        run: node scripts/ci-runner-paths.mjs bash,git,node,pnpm
      - run: pnpm install --frozen-lockfile --store-dir "$RUNNER_TOOL_CACHE/pnpm-store"
        id: ci-4
      - *a1
      - id: ci-6
        env:
          PLUGIN_ID: ${{ matrix.plugin.id }}
        shell: bash
        run: node scripts/ci-step.mjs plugin-check --ci --plugin-id "$PLUGIN_ID"
  ts-static:
    name: ts static checks
    needs: changed
    if: ${{ needs.changed.outputs.frontend == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Setup Node.js
        id: ci-2
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          package-manager-cache: false
          node-version: 22.22.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        id: ci-1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Setup pnpm
        id: ci-3
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.32.1
          run_install: false
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - name: Runner preflight
        run: node scripts/ci-runner-paths.mjs bash,git,node,pnpm
      - name: Install dependencies
        id: ci-4
        run: pnpm install --frozen-lockfile --store-dir "$RUNNER_TOOL_CACHE/pnpm-store"
      - *a1
      - name: TypeScript unused exports
        id: ci-6
        if: ${{ !cancelled() }}
        run: node scripts/ci-step.mjs ts-unused-exports --ci
      - name: Repository Knip report
        id: ci-7
        if: ${{ !cancelled() }}
        run: node scripts/ci-step.mjs ts-knip-report --ci
      - name: Check API effect dependencies
        id: ci-8
        if: ${{ !cancelled() }}
        run: node scripts/ci-step.mjs ts-api-effects --ci
      - name: Biome (TS lint)
        id: ci-9
        if: ${{ !cancelled() }}
        run: node scripts/ci-step.mjs ts-biome --ci
  frontend-dist:
    name: frontend producer
    needs: changed
    if: ${{ needs.changed.outputs.frontend == 'true' || needs.changed.outputs.rust == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        id: ci-2
        with:
          package-manager-cache: false
          node-version: 22.22.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        id: ci-1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        id: ci-3
        with:
          version: 10.32.1
          run_install: false
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - name: Runner preflight
        run: node scripts/ci-runner-paths.mjs bash,git,node,pnpm
      - name: Install dependencies
        id: ci-4
        run: pnpm install --frozen-lockfile --store-dir "$RUNNER_TOOL_CACHE/pnpm-store"
      - *a1
      - name: Build and typecheck frontend
        id: ci-6
        run: node scripts/ci-step.mjs ts-typecheck --ci
  ts-types:
    name: ts generated types
    needs: changed
    if: ${{ needs.changed.outputs.frontend == 'true' || needs.changed.outputs.rust == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Setup Node.js
        id: ci-3
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          package-manager-cache: false
          node-version: 22.22.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        id: ci-1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Setup pnpm
        id: ci-4
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.32.1
          run_install: false
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - name: Provision the pinned hosted Rust toolchain
        if: runner.environment == 'github-hosted'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.1
          components: clippy,rustfmt
      - name: Runner preflight
        run: node scripts/ci-runner-paths.mjs bash,cargo,git,node,pnpm
      - name: Install dependencies
        id: ci-5
        run: pnpm install --frozen-lockfile --store-dir "$RUNNER_TOOL_CACHE/pnpm-store"
      - *a1
      - name: Reset compiler capture
        id: ci-7
        continue-on-error: true
        run: node -e "require('fs').writeFileSync('ci-rust-warnings.log', '')"
      - name: Check Rust generated TypeScript types
        id: ci-8
        run: node scripts/collect-rust-warnings.mjs run --log ci-rust-warnings.log -- node scripts/ci-step.mjs ts-generated-types --ci
      - name: Stop this job's local compile cache
        if: always()
        shell: bash
        run: bash build.sh cache-release
      - name: Remove job archives and sweep old Rust targets
        if: always()
        continue-on-error: true
        run: node scripts/ci-workspace-cleanup.mjs
  ts-unit:
    name: ts unit
    needs: changed
    if: ${{ needs.changed.outputs.frontend == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Setup Node.js
        id: ci-2
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          package-manager-cache: false
          node-version: 22.22.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        id: ci-1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Setup pnpm
        id: ci-3
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.32.1
          run_install: false
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - name: Runner preflight
        run: node scripts/ci-runner-paths.mjs bash,git,node,pnpm
      - name: Install dependencies
        id: ci-4
        run: pnpm install --frozen-lockfile --store-dir "$RUNNER_TOOL_CACHE/pnpm-store"
      - *a1
      - name: Run TS unit tests
        id: ci-6
        run: node scripts/ci-step.mjs ts-unit --ci
  ts-vitest:
    name: ts vitest
    needs: changed
    if: ${{ needs.changed.outputs.frontend == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Setup Node.js
        id: ci-2
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          package-manager-cache: false
          node-version: 22.22.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        id: ci-1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Setup pnpm
        id: ci-3
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.32.1
          run_install: false
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - name: Runner preflight
        run: node scripts/ci-runner-paths.mjs bash,git,node,pnpm
      - name: Install dependencies
        id: ci-4
        run: pnpm install --frozen-lockfile --store-dir "$RUNNER_TOOL_CACHE/pnpm-store"
      - *a1
      - name: Run vitest-owned TS tests
        id: ci-6
        run: node scripts/ci-step.mjs ts-vitest --ci
  ts-plugins:
    name: plugin bundles + tests
    needs: changed
    if: ${{ needs.changed.outputs.rust == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Setup Node.js
        id: ci-2
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          package-manager-cache: false
          node-version: 22.22.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        id: ci-1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Setup pnpm
        id: ci-3
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.32.1
          run_install: false
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - name: Runner preflight
        run: node scripts/ci-runner-paths.mjs bash,git,node,pnpm
      - name: Install dependencies
        id: ci-4
        run: pnpm install --frozen-lockfile --store-dir "$RUNNER_TOOL_CACHE/pnpm-store"
      - *a1
      - name: Check generated plugin bundles
        id: ci-6
        run: node scripts/ci-step.mjs plugin-bundles --ci
      - name: Run plugin tests
        id: ci-7
        if: ${{ !cancelled() }}
        run: node scripts/ci-step.mjs plugin-tests --ci
  cli-tests:
    name: cli contracts
    needs: changed
    if: ${{ needs.changed.outputs.rust == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          package-manager-cache: false
          node-version: 22.22.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Provision the pinned hosted Rust toolchain
        if: runner.environment == 'github-hosted'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.1
          components: clippy,rustfmt
      - name: Runner preflight
        run: node scripts/ci-runner-paths.mjs bash,cargo,git,node
      - name: CLI manifest and plugin parsing contracts
        working-directory: cli
        run: |-
          cargo test --locked -p codeterm-cli cmd::manifest
          cargo test --locked -p codeterm-cli plugin_subcommands_parse
