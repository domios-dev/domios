name: Bake Linux build images
on:
  workflow_dispatch:

jobs:
  bake:
    if: ${{ (github.repository_owner == 'rollacode' || github.repository_owner == 'domios-dev') && github.actor == 'rollacode' && github.event_name != 'pull_request' && github.event_name != 'pull_request_target' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ${{ vars.CI_LINUX_ARM64_RUNNER || '"ubuntu-24.04-arm"' }}
          - arch: x64
            runner: ${{ vars.CI_LINUX_LIGHT_RUNNER || '"ubuntu-24.04"' }}
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 120
    steps:
      - name: Use the runner bundled Node
        if: runner.environment == 'self-hosted'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |-
            const path = require('node:path');
            core.addPath(path.dirname(process.execPath));
            core.info('Using runner Node ' + process.version);
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          package-manager-cache: false
          node-version: 22.22.0
        if: runner.environment == 'github-hosted'
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
      - name: Discover installed runner tools
        if: runner.environment == 'self-hosted'
        run: node scripts/ci-runner-paths.mjs --paths-only

      - name: Ensure Docker is running
        run: |
          docker info >/dev/null

      - name: Bake and verify native image
        working-directory: .codeterm/build-machine/docker
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          docker build -t "codeterm-build-linux-$ARCH" -f "Dockerfile.linux-$ARCH" .
          docker image inspect "codeterm-build-linux-$ARCH" >/dev/null
