name: Bake Linux build images (self-hosted)

# One-shot: bake the codeterm-build-linux-{arm64,x64} Docker images ON the
# self-hosted build machine. The release pipeline needs them present; they are
# not in the Actions cache and must live on the runner. Run via the Actions
# "Run workflow" button or `gh workflow run`.
on:
  workflow_dispatch:

jobs:
  bake:
    if: ${{ (github.repository_owner == 'rollacode' || github.repository_owner == 'domios-dev') && github.actor == 'rollacode' && github.event_name != 'pull_request' && github.event_name != 'pull_request_target' }}
    runs-on: [self-hosted, codeterm-builder]
    timeout-minutes: 120
    steps:
      - name: Use the runner bundled Node
        if: runner.environment == 'self-hosted'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |-
            const path = require('node:path');
            core.addPath(path.dirname(process.execPath));
            core.info('Using runner Node ' + process.version);
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          package-manager-cache: false
          node-version: 22.22.0
        if: runner.environment == 'github-hosted'
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
      - name: Discover installed runner tools
        if: runner.environment == 'self-hosted'
        run: node scripts/ci-runner-paths.mjs --paths-only

      - name: Ensure Docker is running
        run: |
          docker info >/dev/null

      - name: Bake codeterm-build-linux-arm64
        working-directory: .codeterm/build-machine/docker
        run: docker build -t codeterm-build-linux-arm64 -f Dockerfile.linux-arm64 .

      - name: Bake codeterm-build-linux-x64
        working-directory: .codeterm/build-machine/docker
        run: docker build -t codeterm-build-linux-x64 -f Dockerfile.linux-x64 .

      - name: Verify
        run: |
          docker image inspect codeterm-build-linux-arm64 >/dev/null && echo "✅ arm64 image present"
          docker image inspect codeterm-build-linux-x64   >/dev/null && echo "✅ x64 image present"
