name: script-catalog

# Every scripts/ entry carries a caller header, has a caller, and README.md is current.

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'build.sh'
      - '.github/workflows/**'
      - 'package.json'
      - '.agents/skills/**'
  push:
    branches: [master]
    paths-ignore:
      - '.codeterm/build-machine/**'

concurrency:
  group: script-catalog-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: [self-hosted, linux-ci]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Script catalogue and fixture guards
        env:
          VISUAL_GOLDEN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash build.sh script-guards
