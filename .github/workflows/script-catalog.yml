name: script-catalog

# Fixture guards for build, gateway, dev and QA scripts, and the test catalogue.

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'build.sh'
      - '.github/workflows/**'
      - 'package.json'
      - '.agents/skills/**'
  push:
    branches: [master]
    paths-ignore:
      - '.codeterm/build-machine/**'

concurrency:
  group: script-catalog-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: [self-hosted, Linux, light]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare runner tool paths
        run: node scripts/ci-runner-paths.mjs
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
        with:
          tool: cargo-nextest@0.9.148
      - name: Script fixture guards and test catalogue
        env:
          VISUAL_GOLDEN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash build.sh script-guards
