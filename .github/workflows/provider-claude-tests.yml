name: provider-claude-tests

on:
  pull_request:
    paths:
      - 'plugins/provider-claude/**'
      - 'scripts/plugin-tests.sh'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/provider-claude-tests.yml'
  push:
    branches: [develop, master]

jobs:
  filtered-provider-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run provider-claude filtered test command
        run: pnpm --filter @codeterm/provider-claude test
