name: Fork PR guard
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]
permissions:
  pull-requests: write
jobs:
  close:
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |-
            const pr = context.payload.pull_request;
            if (!pr.head.ref.startsWith('release/') && pr.base.ref !== 'master' && !pr.base.ref.startsWith('release/')) return;
            await github.rest.pulls.update({...context.repo, pull_number: pr.number, state: 'closed'});
            await github.rest.issues.createComment({...context.repo, issue_number: pr.number,
              body: "Release and master changes come only from the owner's own branches."});
