name: Release manifest publisher and verifier

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      source_ref:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      promote_run_id:
        required: false
        default: ''
        type: string
      test_waiver:
        required: false
        default: ''
        type: string
      mirror:
        required: true
        type: boolean

permissions:
  contents: write
  issues: write
  actions: read

jobs:
  validate:
    name: publish and verify all platform manifests
    if: ${{ (github.repository_owner == 'rollacode' || github.repository_owner == 'domios-dev') && github.actor == 'rollacode' && github.triggering_actor == 'rollacode' && ((github.event_name == 'push' && github.ref == 'refs/heads/master') || (github.ref == 'refs/heads/release/next' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.path == '.github/workflows/tests.yml' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.actor.login == 'rollacode' && github.event.workflow_run.triggering_actor.login == 'rollacode' && github.event.workflow_run.head_branch == 'release/next')) }}
    environment: release
    concurrency:
      group: codeterm-core-channel-publication
      cancel-in-progress: false
    # Publication only talks to the GitHub API, so it runs where no machine of ours can stall it.
    runs-on: ${{ fromJSON(github.ref == 'refs/heads/master' && '"ubuntu-24.04"' || vars.CI_LINUX_LIGHT_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 30
    env:
      RELEASE_TEST_WAIVER: ${{ inputs.test_waiver }}
      GH_TOKEN: ${{ github.token }}
      SOURCE_REPO: ${{ github.repository }}
      # 1.19 transition mirror: every MIRROR_REPO step serves 1.18.x fallback clients; delete after 1.19 ships.
      MIRROR_REPO: rollacode/codeterm-releases
    steps:

      - name: Use the runner bundled Node
        if: runner.environment == 'self-hosted'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |-
            const path = require('node:path');
            core.addPath(path.dirname(process.execPath));
            core.info('Using runner Node ' + process.version);
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 22.22.0
        if: runner.environment == 'github-hosted'
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
        if: runner.environment == 'github-hosted'
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1
      - name: Discover installed runner tools
        if: runner.environment == 'self-hosted'
        run: node scripts/ci-runner-paths.mjs --paths-only
      - name: Fetch scoped publication history
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-git-history.mjs publication

      - name: Resolve release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          case "$INPUT_TAG" in
            release-*) tag="v${INPUT_TAG#release-}" ;;
            v*) tag="$INPUT_TAG" ;;
            *) echo "::error::cannot derive release tag from '$INPUT_TAG'"; exit 1 ;;
          esac
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::invalid release tag '$tag'"; exit 1; }
          version="${tag#v}"
          source_sha=$(git rev-parse "$INPUT_SOURCE_SHA^{commit}")
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "source_sha=$source_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Recheck exact-SHA dev qualification before publication
        env:
          QUALIFICATION_SHA: ${{ inputs.source_sha }}
          PROMOTE_RUN_ID: ${{ inputs.promote_run_id }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |-
            const {pathToFileURL} = require('node:url');
            const {requireQualificationWithGithub} = await import(pathToFileURL(process.env.GITHUB_WORKSPACE + '/scripts/ci-workflow-api.mjs').href);
            const sha = process.env.QUALIFICATION_SHA || require('node:child_process').execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
            const evidence = await requireQualificationWithGithub(github, context, sha, {runId: process.env.PROMOTE_RUN_ID || undefined});
            require('node:fs').writeFileSync(process.env.RUNNER_TEMP + '/release-admission.json', JSON.stringify(evidence, null, 2));

      - name: Fetch qualified manifest and digest metadata
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
          CI_STORE_LAN_ENDPOINT: ${{ secrets.CI_STORE_LAN_ENDPOINT }}
          CI_STORE_PUBLIC_ENDPOINT: ${{ secrets.CI_STORE_PUBLIC_ENDPOINT }}
          PROMOTE_RUN_ID: ${{ inputs.promote_run_id }}
        run: bash scripts/ci-artifact.sh get "$PROMOTE_RUN_ID/manifest-dry-run/manifest-local-verification.json" "$RUNNER_TEMP/qualified-release.json"

      - name: Stamp the source release tag after all gates succeed
        env:
          TAG: ${{ steps.release.outputs.tag }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          draft=$(gh release view "$TAG" --repo "$SOURCE_REPO" --json isDraft --jq .isDraft)
          if [ "$draft" = false ]; then
            test "$(git rev-parse "$TAG^{commit}")" = "$SOURCE_SHA"
          else
            git tag -fa "$TAG" "$SOURCE_SHA" -m "$TAG"
            git push --force origin "refs/tags/$TAG"
          fi

      - name: Detect channel
        id: channel
        env:
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$TAG" == *-rc* ]]; then
            echo "manifest=domios-latest-rc.json" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == *-nightly* ]]; then
            echo "manifest=domios-latest-nightly.json" >> "$GITHUB_OUTPUT"
          else
            echo "manifest=domios-latest.json" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload qualified channel manifests
        env:
          TAG: ${{ steps.release.outputs.tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          PROMOTE_RUN_ID: ${{ inputs.promote_run_id }}
          PUBLISH_MIRROR: ${{ inputs.mirror }}
          MIRROR_TOKEN: ${{ secrets.PACKAGE_REPOS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release-served-metadata.mjs prepare "$RUNNER_TEMP/qualified-release.json" "$TAG" "$SOURCE_SHA" "$PROMOTE_RUN_ID" "$SOURCE_REPO" .
          gh release upload "$TAG" "$RUNNER_TEMP/release-admission.json" --repo "$SOURCE_REPO" --clobber
          node scripts/legacy-updater-refusal.mjs .
          gh release upload "$TAG" domios-latest.json domios-latest-deb.json latest.json latest-deb.json latest-rpm.json --repo "$SOURCE_REPO" --clobber
          if [ "$PUBLISH_MIRROR" = true ]; then
            GH_TOKEN="$MIRROR_TOKEN" gh release upload "$TAG" domios-latest.json domios-latest-deb.json latest.json latest-deb.json latest-rpm.json --repo "$MIRROR_REPO" --clobber
          fi

      - name: Sync full release notes to the source release
        env:
          TAG: ${{ steps.release.outputs.tag }}
          # 1.19 transition mirror: also sync the mirror notes; delete after 1.19 ships.
          MIRROR_TOKEN: ${{ secrets.PACKAGE_REPOS_TOKEN }}
          PUBLISH_MIRROR: ${{ inputs.mirror }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--tag "$TAG")
          [ "$PUBLISH_MIRROR" != true ] || args+=(--mirror-repo "$MIRROR_REPO")
          node scripts/sync-release-notes.mjs "${args[@]}"

      - name: Mark the source release published
        env:
          TAG: ${{ steps.release.outputs.tag }}
          MANIFEST: ${{ steps.channel.outputs.manifest }}
        shell: bash
        run: |
          set -euo pipefail
          # Clients read releases/latest; only a stable release may become latest.
          latest=--latest=false
          [ "$MANIFEST" != domios-latest.json ] || latest=--latest
          gh release edit "$TAG" --repo "$SOURCE_REPO" --draft=false "$latest"

      - name: Mark the 1.19 transition mirror release published
        if: inputs.mirror
        env:
          TAG: ${{ steps.release.outputs.tag }}
          MANIFEST: ${{ steps.channel.outputs.manifest }}
          GH_TOKEN: ${{ secrets.PACKAGE_REPOS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          latest=--latest=false
          [ "$MANIFEST" != domios-latest.json ] || latest=--latest
          gh release edit "$TAG" --repo "$MIRROR_REPO" --draft=false "$latest"

      - name: Verify the published source release
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VER: ${{ steps.release.outputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          PROMOTE_RUN_ID: ${{ inputs.promote_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/legacy-updater-refusal.mjs verify "https://github.com/$SOURCE_REPO/releases/download/$TAG/latest.json" "$VER"
          node scripts/release-served-metadata.mjs verify "$RUNNER_TEMP/qualified-release.json" "$TAG" "$SOURCE_SHA" "$PROMOTE_RUN_ID" "$SOURCE_REPO" "$RUNNER_TEMP"
          gh release upload "$TAG" "$RUNNER_TEMP/manifest-verification.json" "$RUNNER_TEMP/deb-manifest-verification.json" --repo "$SOURCE_REPO" --clobber

      - name: Verify published Debian manifest
        env:
          VER: ${{ steps.release.outputs.version }}
        run: node scripts/check-release-closure.mjs --evidence "$RUNNER_TEMP/manifest-verification.json" --deb-evidence "$RUNNER_TEMP/deb-manifest-verification.json" --version "$VER"

      - name: Verify the published 1.19 transition mirror
        if: inputs.mirror
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VER: ${{ steps.release.outputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          PROMOTE_RUN_ID: ${{ inputs.promote_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/legacy-updater-refusal.mjs verify "https://github.com/$MIRROR_REPO/releases/download/$TAG/latest.json" "$VER"
          mkdir -p "$RUNNER_TEMP/mirror-verification"
          node scripts/release-served-metadata.mjs verify "$RUNNER_TEMP/qualified-release.json" "$TAG" "$SOURCE_SHA" "$PROMOTE_RUN_ID" "$MIRROR_REPO" "$RUNNER_TEMP/mirror-verification"

      - name: Publish the verified core channel to the source repository
        env:
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
        run: node scripts/publish-core-channel.mjs publish "$SOURCE_SHA" "$SOURCE_REPO"

      # 1.19 transition mirror: 1.18.x clients read the core channel here; delete after 1.19 ships.
      - name: Publish the verified core channel to the 1.19 transition mirror
        if: inputs.mirror
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_REPOS_TOKEN }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
        run: node scripts/publish-core-channel.mjs publish "$SOURCE_SHA" "$MIRROR_REPO"

      - name: Mint issue closure boundary
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VER: ${{ steps.release.outputs.version }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg version "$VER" --arg sha "$SOURCE_SHA" \
            --arg run_id "$GITHUB_RUN_ID" --arg repo "$GITHUB_REPOSITORY" \
            --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --slurpfile verification "$RUNNER_TEMP/manifest-verification.json" \
            --slurpfile deb_verification "$RUNNER_TEMP/deb-manifest-verification.json" \
            '{version: $version, source_sha: $sha, public_mirror_verified: true,
              validator_run_id: ($run_id | tonumber), validator_repository: $repo,
              validator_run_url: $run_url, test_waiver: ($verification[0].qualification.test_waiver // null),
              manifest_verification: $verification[0], deb_manifest_verification: $deb_verification[0]}' \
            > "$RUNNER_TEMP/issue-closure-boundary.json"
          gh release upload "$TAG" "$RUNNER_TEMP/issue-closure-boundary.json" \
            --repo "$SOURCE_REPO" --clobber

      - name: Resolve included private source public issues
        env:
          VER: ${{ steps.release.outputs.version }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release_issue_contract.py included \
            --version "$VER" --source-sha "$SOURCE_SHA" --output-dir "$RUNNER_TEMP"
          jq -r '.issues[].reference' "$RUNNER_TEMP/resolved-public-issues.json" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # Public issues live in rollacode/codeterm-releases, so closing them needs its Issues write token.
      - name: Close shipped public issues
        if: vars.RELEASE_CLOSE_PUBLIC_ISSUES != 'false'
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_REPOS_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          VER: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-release-closure.mjs \
            --evidence "$RUNNER_TEMP/manifest-verification.json" \
            --deb-evidence "$RUNNER_TEMP/deb-manifest-verification.json" \
            --version "$VER"
          python3 scripts/release_issue_contract.py plan-close \
            --resolved-file "$RUNNER_TEMP/resolved-public-issues.json" \
            --states-file "$RUNNER_TEMP/public-issue-states.json" \
            --version "$VER" \
            > "$RUNNER_TEMP/public-issue-close-plan.json"
          node scripts/check-release-closure.mjs \
            --evidence "$RUNNER_TEMP/manifest-verification.json" \
            --deb-evidence "$RUNNER_TEMP/deb-manifest-verification.json" \
            --version "$VER" --plan "$RUNNER_TEMP/public-issue-close-plan.json"
