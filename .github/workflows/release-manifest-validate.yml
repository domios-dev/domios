name: release-manifest-validate

# Asserts that the public auto-update manifest is complete and installable
# before it is trusted: every platform this release ships must actually carry
# a verified entry, or the release is not "done" no matter how many of its
# platform legs went green on their own. codeterm#383: release.yml,
# release-windows.yml and release-linux.yml each verify only what THEY
# published; nothing verified the release as a whole was complete. This
# workflow is that coordinating gate, and it fails the run (non-zero exit)
# rather than warn — a gate that only warns is not a gate.
#
# Trigger:
#   - workflow_run, once each publishing leg (release.yml, release-windows,
#     release-linux) completes for a release-* tag push. All three legs are
#     independent, uncoordinated tag-triggered workflows, so they fire this
#     workflow separately and out of order. An early leg's run can observe a
#     genuinely incomplete matrix and fail — that failure is expected and
#     self-clears once the last leg's completion re-triggers a run that sees
#     the full matrix. A leg that never completes (a real build failure)
#     leaves this workflow red for good, which is the point: an incomplete
#     artifact matrix must fail loudly in CI, not silently ship, and must not
#     depend on a human running a checklist.
#   - workflow_dispatch for manual re-checks.
on:
  workflow_run:
    workflows:
      - "Release (self-hosted build machine)"
      - "release-windows"
      - "release-linux"
    types:
      - completed
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'

      # Reuses the same verifier release.yml's own publish-time gate uses:
      # --require-platform fails the run the moment any listed platform is
      # missing from the manifest, and every present entry's signature is
      # checked against the bytes actually served (a 200 proves nothing on
      # its own — see scripts/verify-updater-manifest.mjs).
      - name: Validate latest.json covers every shipped platform
        run: |
          node scripts/verify-updater-manifest.mjs \
            --manifest "https://github.com/rollacode/codeterm-releases/releases/latest/download/latest.json?cb=$(date +%s)" \
            --require-platform darwin-aarch64 \
            --require-platform darwin-x86_64 \
            --require-platform windows-x86_64 \
            --require-platform linux-x86_64

      - name: Validate latest-deb.json covers its platform
        run: |
          node scripts/verify-updater-manifest.mjs \
            --manifest "https://github.com/rollacode/codeterm-releases/releases/latest/download/latest-deb.json?cb=$(date +%s)" \
            --require-platform linux-x86_64
