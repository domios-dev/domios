name: release-manifest-validate

# Asserts that the public auto-update manifest (latest.json hosted on the
# rollacode/codeterm-releases mirror) declares the right artifact extensions
# per platform. Tauri's updater silently fails if it gets a .dmg / .msi where
# it expects an updater bundle (.app.tar.gz / .exe / .AppImage for our
# current Tauri v2 `createUpdaterArtifacts=true` configuration),
# so this guard catches a broken manifest before users try to update.
#
# Trigger:
#   - workflow_dispatch for manual re-checks. The self-hosted release workflow
#     already verifies updater URLs during publish, so this workflow is fallback-only.

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch latest.json from public mirror and validate per-platform URLs
        shell: bash
        run: |
          set -euo pipefail
          URL="https://github.com/rollacode/codeterm-releases/releases/latest/download/latest.json"
          JSON=$(curl -sfL "$URL")
          echo "$JSON" | jq .

          darwin_arm=$(echo "$JSON" | jq -r '.platforms["darwin-aarch64"].url // empty')
          darwin_x64=$(echo "$JSON" | jq -r '.platforms["darwin-x86_64"].url // empty')
          windows=$(echo "$JSON" | jq -r '.platforms["windows-x86_64"].url // empty')
          linux=$(echo "$JSON" | jq -r '.platforms["linux-x86_64"].url // .platforms["linux-aarch64"].url // empty')

          fail=0
          if [ -z "$darwin_arm" ]; then
            echo "::error::manifest missing darwin-aarch64 entry"
            fail=1
          else
            echo "$darwin_arm" | grep -qE '/CodeTerm_aarch64\.app\.tar\.gz(\?|$)' || { echo "::error::darwin-aarch64 points to the wrong artifact: $darwin_arm"; fail=1; }
          fi
          if [ -z "$darwin_x64" ]; then
            echo "::error::manifest missing darwin-x86_64 entry"
            fail=1
          else
            echo "$darwin_x64" | grep -qE '/CodeTerm_x64\.app\.tar\.gz(\?|$)' || { echo "::error::darwin-x86_64 points to the wrong artifact: $darwin_x64"; fail=1; }
          fi
          if [ -z "$windows" ]; then
            echo "::error::manifest missing windows-x86_64 entry"
            fail=1
          else
            echo "$windows" | grep -qE '\.exe(\?|$)' || { echo "::error::windows url missing .exe: $windows"; fail=1; }
          fi
          if [ -z "$linux" ]; then
            echo "::error::manifest missing linux updater entry"
            fail=1
          else
            echo "$linux" | grep -qE '\.AppImage(\?|$)' || { echo "::error::linux url missing .AppImage: $linux"; fail=1; }
          fi

          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "OK — manifest looks correct"

      - name: Fetch latest-deb.json and validate Debian updater URL
        shell: bash
        run: |
          set -euo pipefail
          URL="https://github.com/rollacode/codeterm-releases/releases/latest/download/latest-deb.json"
          JSON=$(curl -sfL "$URL")
          echo "$JSON" | jq .

          linux=$(echo "$JSON" | jq -r '.platforms["linux-x86_64"].url // empty')
          if [ -z "$linux" ]; then
            echo "::error::latest-deb.json missing linux-x86_64 entry"
            exit 1
          fi
          echo "$linux" | grep -qE '\.deb(\?|$)' || {
            echo "::error::debian manifest linux url missing .deb: $linux"
            exit 1
          }
          echo "OK — Debian manifest looks correct"
