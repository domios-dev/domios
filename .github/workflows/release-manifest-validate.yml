name: Release manifest publisher and verifier

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      source_ref:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      mirror:
        required: true
        type: boolean

permissions:
  contents: write
  issues: write
  actions: read

jobs:
  validate:
    name: publish and verify all platform manifests
    if: ${{ (github.repository_owner == 'rollacode' || github.repository_owner == 'domios-dev') && github.actor == 'rollacode' && github.triggering_actor == 'rollacode' && ((github.event_name == 'push' && github.ref == 'refs/heads/master') || ((startsWith(github.ref, 'refs/heads/release/') || startsWith(github.head_ref, 'release/')) && (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')) || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.path == '.github/workflows/tests.yml' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.actor.login == 'rollacode' && github.event.workflow_run.triggering_actor.login == 'rollacode' && startsWith(github.event.workflow_run.head_branch, 'release/'))) }}
    environment: release
    # Publication only talks to the GitHub API, so it runs where no machine of ours can stall it.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
      SOURCE_REPO: ${{ github.repository }}
      MIRROR_REPO: rollacode/codeterm-releases
    steps:

      - name: Use the runner bundled Node
        if: runner.environment == 'self-hosted'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |-
            const path = require('node:path');
            core.addPath(path.dirname(process.execPath));
            core.info('Using runner Node ' + process.version);
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          package-manager-cache: false
          node-version: 22.22.0
        if: runner.environment == 'github-hosted'
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
        if: runner.environment == 'github-hosted'
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1
      - name: Discover installed runner tools
        if: runner.environment == 'self-hosted'
        run: node scripts/ci-runner-paths.mjs --paths-only
      - name: Fetch scoped publication history
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-git-history.mjs publication

      - name: Resolve release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          case "$INPUT_TAG" in
            release-*) tag="v${INPUT_TAG#release-}" ;;
            v*) tag="$INPUT_TAG" ;;
            *) echo "::error::cannot derive release tag from '$INPUT_TAG'"; exit 1 ;;
          esac
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::invalid release tag '$tag'"; exit 1; }
          version="${tag#v}"
          source_sha=$(git rev-parse "$INPUT_SOURCE_SHA^{commit}")
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "source_sha=$source_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Recheck exact-SHA dev qualification before publication
        env:
          QUALIFICATION_SHA: ${{ inputs.source_sha }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |-
            const {pathToFileURL} = require('node:url');
            const {requireQualificationWithGithub} = await import(pathToFileURL(process.env.GITHUB_WORKSPACE + '/scripts/ci-workflow-api.mjs').href);
            const sha = process.env.QUALIFICATION_SHA || require('node:child_process').execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
            await requireQualificationWithGithub(github, context, sha);

      - name: Stamp the source release tag after all gates succeed
        env:
          TAG: ${{ steps.release.outputs.tag }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          draft=$(gh release view "$TAG" --repo "$SOURCE_REPO" --json isDraft --jq .isDraft)
          if [ "$draft" = false ]; then
            test "$(git rev-parse "$TAG^{commit}")" = "$SOURCE_SHA"
          else
            git tag -fa "$TAG" "$SOURCE_SHA" -m "$TAG"
            git push --force origin "refs/tags/$TAG"
          fi

      - name: Detect channel
        id: channel
        env:
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$TAG" == *-rc* ]]; then
            echo "manifest=domios-latest-rc.json" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == *-nightly* ]]; then
            echo "manifest=domios-latest-nightly.json" >> "$GITHUB_OUTPUT"
          else
            echo "manifest=domios-latest.json" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge and upload final channel manifests
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VER: ${{ steps.release.outputs.version }}
          MANIFEST: ${{ steps.channel.outputs.manifest }}
          PUBLISH_MIRROR: ${{ inputs.mirror }}
          MIRROR_TOKEN: ${{ secrets.PACKAGE_REPOS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          case "$MANIFEST" in
            domios-latest.json) DEB_MANIFEST=domios-latest-deb.json ;;
            domios-latest-rc.json) DEB_MANIFEST=domios-latest-rc-deb.json ;;
            domios-latest-nightly.json) DEB_MANIFEST=domios-latest-nightly-deb.json ;;
            *) echo "::error::unknown channel manifest $MANIFEST"; exit 1 ;;
          esac
          rm -rf "$RUNNER_TEMP/release-fragments" "$RUNNER_TEMP/release-base"
          mkdir -p "$RUNNER_TEMP/release-fragments/raw" \
            "$RUNNER_TEMP/release-fragments/main" "$RUNNER_TEMP/release-fragments/deb" \
            "$RUNNER_TEMP/release-base"
          gh release download "$TAG" --repo "$SOURCE_REPO" \
            --pattern 'updater-*.json' --dir "$RUNNER_TEMP/release-fragments/raw"
          main_count=0
          deb_count=0
          for fragment in "$RUNNER_TEMP"/release-fragments/raw/updater-*.json; do
            [ -f "$fragment" ] || continue
            name=$(basename "$fragment" .json)
            if [[ "$name" == *-deb ]]; then
              destination="$RUNNER_TEMP/release-fragments/deb/$name"
              deb_count=$((deb_count + 1))
            else
              destination="$RUNNER_TEMP/release-fragments/main/$name"
              main_count=$((main_count + 1))
            fi
            mkdir -p "$destination"
            cp "$fragment" "$destination/domios-latest.json"
          done
          [ "$main_count" -gt 0 ] || { echo "::error::no platform updater fragments were published"; exit 1; }
          [ "$deb_count" -gt 0 ] || { echo "::error::no Debian updater fragment was published"; exit 1; }

          base_args=()
          if gh release download "$TAG" --repo "$SOURCE_REPO" \
              --pattern "$MANIFEST" --dir "$RUNNER_TEMP/release-base" 2>/dev/null; then
            base_args=(--base "$RUNNER_TEMP/release-base/$MANIFEST")
          fi
          node scripts/merge-latest-json.js \
            --in "$RUNNER_TEMP/release-fragments/main" --out "$MANIFEST" "${base_args[@]}"
          node scripts/merge-latest-json.js \
            --in "$RUNNER_TEMP/release-fragments/deb" --out "$DEB_MANIFEST"
          jq -e --arg ver "$VER" '.version == $ver' "$MANIFEST" >/dev/null
          for platform in darwin-aarch64 darwin-x86_64 windows-x86_64 windows-aarch64 linux-x86_64 linux-aarch64; do
            jq -e --arg platform "$platform" \
              '.platforms[$platform].signature | type == "string" and length > 0' \
              "$MANIFEST" >/dev/null
          done
          jq -e --arg ver "$VER" \
            '(.version == $ver) and (.platforms["linux-x86_64"].signature | type == "string" and length > 0)' \
            "$DEB_MANIFEST" >/dev/null
          node scripts/legacy-updater-refusal.mjs . "$MANIFEST"
          LEGACY="${MANIFEST#domios-}"
          gh release upload "$TAG" "$MANIFEST" "$DEB_MANIFEST" "$LEGACY" "${LEGACY%.json}-deb.json" "${LEGACY%.json}-rpm.json" \
            --repo "$SOURCE_REPO" --clobber

          if [ "$PUBLISH_MIRROR" = true ]; then
            export GH_TOKEN="$MIRROR_TOKEN"
            gh release upload "$TAG" "$MANIFEST" "$DEB_MANIFEST" "$LEGACY" "${LEGACY%.json}-deb.json" "${LEGACY%.json}-rpm.json" \
              --repo "$MIRROR_REPO" --clobber
          fi

      - name: Verify draft artifact signatures before publication
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VER: ${{ steps.release.outputs.version }}
          MANIFEST: ${{ steps.channel.outputs.manifest }}
          MIRROR_TOKEN: ${{ secrets.PACKAGE_REPOS_TOKEN }}
          PUBLISH_MIRROR: ${{ inputs.mirror }}
        shell: bash
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/draft-integrity"
          rm -rf "$directory"
          mkdir -p "$directory"
          repo="$SOURCE_REPO"
          if [ "$PUBLISH_MIRROR" = true ]; then repo="$MIRROR_REPO"; export GH_TOKEN="$MIRROR_TOKEN"; fi
          for manifest in "$MANIFEST" domios-latest-deb.json; do
            jq -r '.platforms[].url | split("/")[-1]' "$manifest" | while IFS= read -r asset; do
              gh release download "$TAG" --repo "$repo" --pattern "$asset" --dir "$directory" --clobber
            done
            node scripts/verify-updater-manifest.mjs --manifest "$manifest" --local "$directory" --require-version "$VER"
          done

      - name: Sync full release notes to source and public mirror
        if: inputs.mirror
        env:
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: node scripts/sync-release-notes.mjs --tag "$TAG"

      - name: Mark source and public releases published
        if: inputs.mirror
        env:
          TAG: ${{ steps.release.outputs.tag }}
          MANIFEST: ${{ steps.channel.outputs.manifest }}
          MIRROR_TOKEN: ${{ secrets.PACKAGE_REPOS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # Clients read releases/latest in both repositories; only a stable release may become latest.
          latest=--latest=false
          [ "$MANIFEST" != domios-latest.json ] || latest=--latest
          gh release edit "$TAG" --repo "$SOURCE_REPO" --draft=false "$latest"
          export GH_TOKEN="$MIRROR_TOKEN"
          gh release edit "$TAG" --repo "$MIRROR_REPO" --draft=false "$latest"

      - name: Verify published public mirror
        if: inputs.mirror
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VER: ${{ steps.release.outputs.version }}
          MANIFEST: ${{ steps.channel.outputs.manifest }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/legacy-updater-refusal.mjs verify "https://github.com/$MIRROR_REPO/releases/download/$TAG/${MANIFEST#domios-}" "$VER"
          mkdir -p "$RUNNER_TEMP/public-mirror"
          source_release=$(gh release view "$TAG" --repo "$SOURCE_REPO" \
            --json isDraft,publishedAt)
          test "$(printf '%s' "$source_release" | jq -r .isDraft)" = false
          test "$(printf '%s' "$source_release" | jq -r .publishedAt)" != null
          release=$(gh release view "$TAG" --repo "$MIRROR_REPO" \
            --json isDraft,publishedAt,assets)
          test "$(printf '%s' "$release" | jq -r .isDraft)" = false
          test "$(printf '%s' "$release" | jq -r .publishedAt)" != null
          printf '%s' "$release" | jq -e --arg manifest "$MANIFEST" \
            '.assets | any(.name == $manifest)' >/dev/null
          gh release download "$TAG" --repo "$MIRROR_REPO" \
            --pattern "$MANIFEST" --dir "$RUNNER_TEMP/public-mirror" --clobber
          jq -e --arg ver "$VER" '
            (.version == $ver)
            and (.platforms["darwin-aarch64"].signature | type == "string" and length > 0)
            and (.platforms["darwin-aarch64"].url | endswith("/Domios_aarch64.app.tar.gz"))
            and (.platforms["darwin-x86_64"].signature | type == "string" and length > 0)
            and (.platforms["darwin-x86_64"].url | endswith("/Domios_x64.app.tar.gz"))
            and (.platforms | has("windows-x86_64") and has("windows-aarch64"))
            and (.platforms | has("linux-x86_64") and has("linux-aarch64"))
          ' "$RUNNER_TEMP/public-mirror/$MANIFEST" >/dev/null
          jq -r '.platforms[].url' "$RUNNER_TEMP/public-mirror/$MANIFEST" \
            | while IFS= read -r url; do
                case "$url" in
                  https://github.com/rollacode/codeterm-releases/releases/download/"$TAG"/*) ;;
                  *) echo "::error::non-versioned or non-public updater URL: $url"; exit 1 ;;
                esac
                curl --fail --silent --show-error --location --head "$url" >/dev/null
              done
          verification=0
          node scripts/verify-updater-manifest.mjs \
            --manifest "https://github.com/rollacode/codeterm-releases/releases/download/$TAG/$MANIFEST?cb=$(date +%s)" \
            --require-version "$VER" \
            --require-platform darwin-aarch64 \
            --require-platform darwin-x86_64 \
            --require-platform windows-x86_64 \
            --require-platform windows-aarch64 \
            --require-platform linux-x86_64 \
            --require-platform linux-aarch64 \
            --evidence "$RUNNER_TEMP/manifest-verification.json" || verification=$?
          gh release upload "$TAG" "$RUNNER_TEMP/manifest-verification.json" \
            --repo "$MIRROR_REPO" --clobber || true
          if [ "$verification" -ne 0 ]; then
            echo "::error::published manifest is not installable"; exit 1
          fi

      - name: Verify published Debian manifest
        if: inputs.mirror
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VER: ${{ steps.release.outputs.version }}
          MANIFEST: ${{ steps.channel.outputs.manifest }}
        shell: bash
        run: |
          set -euo pipefail
          case "$MANIFEST" in
            domios-latest.json) deb_manifest=domios-latest-deb.json ;;
            domios-latest-rc.json) deb_manifest=domios-latest-rc-deb.json ;;
            domios-latest-nightly.json) deb_manifest=domios-latest-nightly-deb.json ;;
            *) echo "::error::unknown channel manifest $MANIFEST"; exit 1 ;;
          esac
          node scripts/verify-updater-manifest.mjs \
            --manifest "https://github.com/rollacode/codeterm-releases/releases/download/$TAG/$deb_manifest?cb=$(date +%s)" \
            --require-version "$VER" \
            --require-platform linux-x86_64 \
            --require-platform linux-aarch64 \
            --evidence "$RUNNER_TEMP/deb-manifest-verification.json"

      - name: Mint issue closure boundary
        if: inputs.mirror
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VER: ${{ steps.release.outputs.version }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg version "$VER" --arg sha "$SOURCE_SHA" \
            --arg run_id "$GITHUB_RUN_ID" --arg repo "$GITHUB_REPOSITORY" \
            --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --slurpfile verification "$RUNNER_TEMP/manifest-verification.json" \
            --slurpfile deb_verification "$RUNNER_TEMP/deb-manifest-verification.json" \
            '{version: $version, source_sha: $sha, public_mirror_verified: true,
              validator_run_id: ($run_id | tonumber), validator_repository: $repo,
              validator_run_url: $run_url,
              manifest_verification: $verification[0], deb_manifest_verification: $deb_verification[0]}' \
            > "$RUNNER_TEMP/issue-closure-boundary.json"
          gh release upload "$TAG" "$RUNNER_TEMP/issue-closure-boundary.json" \
            --repo "$SOURCE_REPO" --clobber
          gh release upload "$TAG" "$RUNNER_TEMP/issue-closure-boundary.json" \
            --repo "$MIRROR_REPO" --clobber

      - name: Resolve included private source public issues
        if: inputs.mirror
        env:
          VER: ${{ steps.release.outputs.version }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release_issue_contract.py included \
            --version "$VER" --source-sha "$SOURCE_SHA" --output-dir "$RUNNER_TEMP"
          jq -r '.issues[].reference' "$RUNNER_TEMP/resolved-public-issues.json" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Close shipped public issues
        if: inputs.mirror && vars.RELEASE_CLOSE_PUBLIC_ISSUES != 'false'
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VER: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-release-closure.mjs \
            --evidence "$RUNNER_TEMP/manifest-verification.json" \
            --deb-evidence "$RUNNER_TEMP/deb-manifest-verification.json" \
            --version "$VER"
          python3 scripts/release_issue_contract.py plan-close \
            --resolved-file "$RUNNER_TEMP/resolved-public-issues.json" \
            --states-file "$RUNNER_TEMP/public-issue-states.json" \
            --version "$VER" \
            > "$RUNNER_TEMP/public-issue-close-plan.json"
          node scripts/check-release-closure.mjs \
            --evidence "$RUNNER_TEMP/manifest-verification.json" \
            --deb-evidence "$RUNNER_TEMP/deb-manifest-verification.json" \
            --version "$VER" --plan "$RUNNER_TEMP/public-issue-close-plan.json"
