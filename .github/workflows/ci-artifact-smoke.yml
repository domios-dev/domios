name: ci-artifact smoke

# Proves CI artifacts round-trip through the shared MinIO bucket on every runner OS.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  roundtrip:
    name: roundtrip (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            label: light
          - os: macOS
            label: light
          - os: Windows
            label: windows-light
    if: ${{ (github.repository_owner == 'rollacode' || github.repository_owner == 'domios-dev') && github.actor == 'rollacode' && github.event_name != 'pull_request' && github.event_name != 'pull_request_target' }}
    environment: ci
    runs-on: [self-hosted, '${{ matrix.os }}', '${{ matrix.label }}']
    timeout-minutes: 5
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
      CI_STORE_TAILNET_ENDPOINT: ${{ secrets.CI_STORE_TAILNET_ENDPOINT }}
      CI_STORE_PUBLIC_ENDPOINT: ${{ secrets.CI_STORE_PUBLIC_ENDPOINT }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Use the runner bundled Node
        if: runner.environment == 'self-hosted'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |-
            const path = require('node:path');
            core.addPath(path.dirname(process.execPath));
            core.info('Using runner Node ' + process.version);
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          package-manager-cache: false
          node-version: 22.22.0
        if: runner.environment == 'github-hosted'
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
      - name: Discover installed runner tools
        if: runner.environment == 'self-hosted'
        run: node scripts/ci-runner-paths.mjs --paths-only
      - name: Put, get and remove one object
        env:
          KEY: smoke/${{ github.run_id }}/${{ matrix.os }}.bin
        run: |
          set -euo pipefail
          head -c 1048576 /dev/urandom > "$RUNNER_TEMP/up.bin"
          bash scripts/ci-artifact.sh put "$KEY" "$RUNNER_TEMP/up.bin"
          bash scripts/ci-artifact.sh get "$KEY" "$RUNNER_TEMP/down.bin"
          cmp "$RUNNER_TEMP/up.bin" "$RUNNER_TEMP/down.bin"
          bash scripts/ci-artifact.sh rm "$KEY"
          if bash scripts/ci-artifact.sh get "$KEY" "$RUNNER_TEMP/gone.bin" 2>/dev/null; then
            echo "removed object is still readable" >&2
            exit 1
          fi
