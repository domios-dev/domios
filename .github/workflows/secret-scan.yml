name: secret-scan

# gitleaks over the pushed range and the working tree; fails on any finding not triaged in
# .gitleaks.toml / .gitleaksignore. Findings are redacted, secret values never reach the log.

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: [self-hosted, Linux, light]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan new commits and working tree
        env:
          SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/secret-scan.sh "$SCAN_BASE"
