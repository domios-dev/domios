name: wiki-sync

# Only tests.yml and release.yml own master pushes, so the wiki follows each master Release run.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [master]
  workflow_dispatch:

concurrency:
  group: wiki-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: publish essences to the wiki
    if: ${{ github.repository_owner == 'domios-dev' && (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' || github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'master') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          package-manager-cache: false
          node-version: 22.22.0
      - name: Render essences into the wiki checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki
          node scripts/wiki-sync.mjs wiki
      - name: Push changed pages
        working-directory: wiki
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already matches essences"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Sync essences from ${GITHUB_SHA::12}"
          git push origin HEAD
