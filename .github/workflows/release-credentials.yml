name: Release credentials

# Checks every credential the release run needs, on the runner that uses it, in
# about a minute and without building anything. Run it before the version bump;
# the weekly schedule catches an expired Apple agreement or token between releases.
"on":
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: release-credentials
  cancel-in-progress: true

jobs:
  macos:
    name: macOS signing and notarization
    runs-on: [self-hosted, "${{ matrix.runner_label }}"]
    strategy:
      fail-fast: false
      matrix:
        runner_label:
          - ${{ vars.RELEASE_MACOS_ARM64_LABEL || 'codeterm-builder' }}
          - ${{ vars.RELEASE_MACOS_X64_LABEL || 'codeterm-builder' }}
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Import temporary release signing material
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: python3 scripts/release-signing-material.py macos
      - name: Developer ID, minisign key, gh, Apple notary
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: bash scripts/check-release-credentials-mac.sh
      - name: Clean up temporary release signing material
        if: always()
        run: python3 scripts/release-signing-material.py cleanup

  linux:
    name: Linux updater key and release tokens
    runs-on: [self-hosted, "${{ vars.RELEASE_LINUX_X64_LABEL || 'linux-build' }}"]
    timeout-minutes: 5
    steps:
      - name: Updater signing key and repository write access
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          PACKAGE_REPOS_TOKEN: ${{ secrets.PACKAGE_REPOS_TOKEN }}
        shell: bash
        run: |
          rc=0
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && printf %s "$TAURI_SIGNING_PRIVATE_KEY" | base64 -d 2>/dev/null | grep -q "untrusted comment"; then
            echo "✅ TAURI_SIGNING_PRIVATE_KEY decodes as a minisign key"
          else
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is missing or not a minisign key"; rc=1
          fi
          check_push() {
            local token="$1" repo="$2" name="$3" push
            push=$(GH_TOKEN="$token" gh api "repos/$repo" -q .permissions.push 2>/dev/null)
            if [ "$push" = true ]; then echo "✅ $name can write $repo"; else echo "::error::$name cannot write $repo (expired or missing scope)"; rc=1; fi
          }
          check_push "$GH_RELEASE_TOKEN" rollacode/codeterm GH_RELEASE_TOKEN
          check_push "$GH_RELEASE_TOKEN" rollacode/codeterm-releases GH_RELEASE_TOKEN
          check_push "$PACKAGE_REPOS_TOKEN" rollacode/codeterm-releases PACKAGE_REPOS_TOKEN
          exit "$rc"

  windows:
    name: Windows updater key
    runs-on: [self-hosted, "${{ matrix.runner_label }}"]
    strategy:
      fail-fast: false
      matrix:
        runner_label:
          - ${{ vars.RELEASE_WINDOWS_X64_LABEL || 'windows-x64-build' }}
          - ${{ vars.RELEASE_WINDOWS_ARM64_LABEL || 'windows-build' }}
    timeout-minutes: 5
    steps:
      - name: Updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: pwsh
        run: |
          $key = $env:TAURI_SIGNING_PRIVATE_KEY
          if (-not $key) { Write-Host "::error::TAURI_SIGNING_PRIVATE_KEY is missing"; exit 1 }
          $text = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($key))
          if ($text -notmatch 'untrusted comment') { Write-Host "::error::TAURI_SIGNING_PRIVATE_KEY is not a minisign key"; exit 1 }
          Write-Host "✅ TAURI_SIGNING_PRIVATE_KEY decodes as a minisign key"
