name: Release preflight

# Checks every runner, shared cache, builder image and credential the release run
# needs, on the runner that uses it, in minutes and without building anything. Run it
# from a reviewed release branch before publication.
"on":
  workflow_dispatch:
    inputs:
      macos_label:
        description: Check only this macOS runner label (empty checks the release labels and every other runner)
        type: string
        default: ''
      notary_probe:
        description: Also notarize a trivial signed app on that runner
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-credentials
  cancel-in-progress: true

env:
  CODETERM_SCCACHE_CREDENTIAL_SOURCE: runner

jobs:
  macos:
    name: macOS signing and notarization
    if: ${{ (github.repository_owner == 'rollacode' || github.repository_owner == 'domios-dev') && github.actor == 'rollacode' && github.triggering_actor == 'rollacode' && (startsWith(github.ref, 'refs/heads/release/') || startsWith(github.head_ref, 'release/')) && (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') }}
    environment: release
    runs-on: [self-hosted, "${{ matrix.runner_label }}"]
    strategy:
      fail-fast: false
      matrix:
        runner_label: ${{ fromJSON(inputs.macos_label != '' && format('["{0}"]', inputs.macos_label) || format('["{0}","{1}"]', vars.RELEASE_MACOS_ARM64_LABEL || 'codeterm-builder', vars.RELEASE_MACOS_X64_LABEL || 'codeterm-builder')) }}
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
      CI_STORE_TAILNET_ENDPOINT: ${{ secrets.CI_STORE_TAILNET_ENDPOINT }}
      CI_STORE_PUBLIC_ENDPOINT: ${{ secrets.CI_STORE_PUBLIC_ENDPOINT }}
      GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Use the runner bundled Node
        if: runner.environment == 'self-hosted'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |-
            const path = require('node:path');
            core.addPath(path.dirname(process.execPath));
            core.info('Using runner Node ' + process.version);
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          package-manager-cache: false
          node-version: 22.22.0
        if: runner.environment == 'github-hosted'
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
        if: runner.environment == 'github-hosted'
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
      - name: Discover installed runner tools
        if: runner.environment == 'self-hosted'
        run: node scripts/ci-runner-paths.mjs --paths-only
      - name: Import temporary release signing material
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: python3 scripts/release-signing-material.py macos
      - name: Developer ID, minisign key, gh, Apple notary
        run: bash scripts/check-release-credentials-mac.sh
      - name: Notarize a trivial signed app
        if: ${{ inputs.notary_probe }}
        run: bash scripts/release-notary-probe.sh
      - name: Clean up temporary release signing material
        if: always()
        run: python3 scripts/release-signing-material.py cleanup

  linux:
    name: Linux updater key and release tokens
    if: ${{ (github.repository_owner == 'rollacode' || github.repository_owner == 'domios-dev') && github.actor == 'rollacode' && github.triggering_actor == 'rollacode' && (startsWith(github.ref, 'refs/heads/release/') || startsWith(github.head_ref, 'release/')) && (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && (inputs.macos_label == '') }}
    environment: release
    runs-on: [self-hosted, "${{ vars.RELEASE_LINUX_X64_LABEL || 'linux-build' }}"]
    timeout-minutes: 5
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
      CI_STORE_TAILNET_ENDPOINT: ${{ secrets.CI_STORE_TAILNET_ENDPOINT }}
      CI_STORE_PUBLIC_ENDPOINT: ${{ secrets.CI_STORE_PUBLIC_ENDPOINT }}
    steps:
      - name: Use the runner bundled Node
        if: runner.environment == 'self-hosted'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |-
            const path = require('node:path');
            core.addPath(path.dirname(process.execPath));
            core.info('Using runner Node ' + process.version);
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          package-manager-cache: false
          node-version: 22.22.0
        if: runner.environment == 'github-hosted'
      - name: Updater signing key and repository write access
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          github-token: ${{ secrets.GH_RELEASE_TOKEN }}
          script: |-
            if (!Buffer.from(process.env.TAURI_SIGNING_PRIVATE_KEY || '', 'base64').toString().includes('untrusted comment')) throw new Error('Updater signing key missing or invalid');
            for (const repository of [process.env.GITHUB_REPOSITORY,'rollacode/codeterm-releases']) {
              const [owner,repo] = repository.split('/');
              const result = await github.rest.repos.get({owner,repo});
              if (!result.data.permissions?.push) throw new Error('GH_RELEASE_TOKEN cannot write ' + repository);
              core.info('GH_RELEASE_TOKEN can write ' + repository);
            }
      - name: Mirror publication token write access
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          github-token: ${{ secrets.PACKAGE_REPOS_TOKEN }}
          script: |-
            const result = await github.rest.repos.get({owner:'rollacode',repo:'codeterm-releases'});
            if (!result.data.permissions?.push) throw new Error('PACKAGE_REPOS_TOKEN cannot write release mirror');

  windows:
    name: Windows updater key
    if: ${{ (github.repository_owner == 'rollacode' || github.repository_owner == 'domios-dev') && github.actor == 'rollacode' && github.triggering_actor == 'rollacode' && (startsWith(github.ref, 'refs/heads/release/') || startsWith(github.head_ref, 'release/')) && (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && (inputs.macos_label == '') }}
    environment: release
    runs-on: [self-hosted, "${{ matrix.runner_label }}"]
    strategy:
      fail-fast: false
      matrix:
        runner_label:
          - ${{ vars.RELEASE_WINDOWS_X64_LABEL || 'windows-x64-build' }}
          - ${{ vars.RELEASE_WINDOWS_ARM64_LABEL || 'windows-build' }}
    timeout-minutes: 5
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
      CI_STORE_TAILNET_ENDPOINT: ${{ secrets.CI_STORE_TAILNET_ENDPOINT }}
      CI_STORE_PUBLIC_ENDPOINT: ${{ secrets.CI_STORE_PUBLIC_ENDPOINT }}
    steps:
      - name: Use the runner bundled Node
        if: runner.environment == 'self-hosted'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |-
            const path = require('node:path');
            core.addPath(path.dirname(process.execPath));
            core.info('Using runner Node ' + process.version);
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          package-manager-cache: false
          node-version: 22.22.0
        if: runner.environment == 'github-hosted'
      - name: Updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: pwsh
        run: |
          $key = $env:TAURI_SIGNING_PRIVATE_KEY
          if (-not $key) { Write-Host "::error::TAURI_SIGNING_PRIVATE_KEY is missing"; exit 1 }
          $text = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($key))
          if ($text -notmatch 'untrusted comment') { Write-Host "::error::TAURI_SIGNING_PRIVATE_KEY is not a minisign key"; exit 1 }
          Write-Host "✅ TAURI_SIGNING_PRIVATE_KEY decodes as a minisign key"

  hosted-signing:
    name: hosted signing (${{ matrix.runner }})
    # GitHub-hosted runners sign arm64 releases and can stand in for our machines; each proves it with real keys.
    if: ${{ (github.repository_owner == 'rollacode' || github.repository_owner == 'domios-dev') && github.actor == 'rollacode' && github.triggering_actor == 'rollacode' && (startsWith(github.ref, 'refs/heads/release/') || startsWith(github.head_ref, 'release/')) && (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && (inputs.macos_label == '') }}
    environment: release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04-arm, windows-11-arm]
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          package-manager-cache: false
          node-version: 22.22.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Import temporary release signing material
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: python3 scripts/release-signing-material.py macos
      - name: Developer ID, minisign key, gh, Apple notary
        if: runner.os == 'macOS'
        run: bash scripts/check-release-credentials-mac.sh
      - name: Notarize a trivial signed app
        if: runner.os == 'macOS'
        run: bash scripts/release-notary-probe.sh
      - name: Clean up temporary release signing material
        if: always() && runner.os == 'macOS'
        run: python3 scripts/release-signing-material.py cleanup
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.32.1
          run_install: false
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - name: Install frozen dependencies
        if: runner.os != 'macOS'
        run: pnpm install --frozen-lockfile
      - name: Sign and verify a probe with the updater key
        if: runner.os != 'macOS'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: node scripts/release-signing-probe.mjs

  runners:
    name: release and test runners online
    if: ${{ (github.repository_owner == 'rollacode' || github.repository_owner == 'domios-dev') && github.actor == 'rollacode' && github.triggering_actor == 'rollacode' && (startsWith(github.ref, 'refs/heads/release/') || startsWith(github.head_ref, 'release/')) && (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && (inputs.macos_label == '') }}
    environment: release
    runs-on: [self-hosted, Linux, light, host-ubunta]
    timeout-minutes: 5
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
      CI_STORE_TAILNET_ENDPOINT: ${{ secrets.CI_STORE_TAILNET_ENDPOINT }}
      CI_STORE_PUBLIC_ENDPOINT: ${{ secrets.CI_STORE_PUBLIC_ENDPOINT }}
    steps:
      - name: Use the runner bundled Node
        if: runner.environment == 'self-hosted'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |-
            const path = require('node:path');
            core.addPath(path.dirname(process.execPath));
            core.info('Using runner Node ' + process.version);
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          package-manager-cache: false
          node-version: 22.22.0
        if: runner.environment == 'github-hosted'
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
      - name: Discover installed runner tools
        if: runner.environment == 'self-hosted'
        run: node scripts/ci-runner-paths.mjs --paths-only
      # Listing runners needs repository Administration read on the token.
      - name: Every required runner label has an online runner
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          RELEASE_REPO: ${{ github.repository }}
        run: bash scripts/check-release-runners.sh

  shared-cache:
    name: shared sccache (${{ matrix.runner_label }})
    if: ${{ (github.repository_owner == 'rollacode' || github.repository_owner == 'domios-dev') && github.actor == 'rollacode' && github.triggering_actor == 'rollacode' && (startsWith(github.ref, 'refs/heads/release/') || startsWith(github.head_ref, 'release/')) && (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && (inputs.macos_label == '') }}
    environment: release
    runs-on: [self-hosted, "${{ matrix.runner_label }}"]
    strategy:
      fail-fast: false
      matrix:
        runner_label:
          - ${{ vars.RELEASE_MACOS_ARM64_LABEL || 'codeterm-builder' }}
          - ${{ vars.RELEASE_MACOS_X64_LABEL || 'codeterm-builder' }}
          - ${{ vars.RELEASE_LINUX_X64_LABEL || 'linux-build' }}
          - ${{ vars.RELEASE_WINDOWS_X64_LABEL || 'windows-x64-build' }}
          - ${{ vars.RELEASE_WINDOWS_ARM64_LABEL || 'windows-build' }}
    timeout-minutes: 10
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
      CI_STORE_TAILNET_ENDPOINT: ${{ secrets.CI_STORE_TAILNET_ENDPOINT }}
      CI_STORE_PUBLIC_ENDPOINT: ${{ secrets.CI_STORE_PUBLIC_ENDPOINT }}
      CODETERM_SCCACHE_VERIFY_ONLY: '1'
    steps:
      - name: Use the runner bundled Node
        if: runner.environment == 'self-hosted'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |-
            const path = require('node:path');
            core.addPath(path.dirname(process.execPath));
            core.info('Using runner Node ' + process.version);
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          package-manager-cache: false
          node-version: 22.22.0
        if: runner.environment == 'github-hosted'
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
        if: runner.environment == 'github-hosted'
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.longpaths
          GIT_CONFIG_VALUE_0: 'true'
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
      - name: Discover installed runner tools
        if: runner.environment == 'self-hosted'
        run: node scripts/ci-runner-paths.mjs --paths-only
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.32.1
          run_install: false
          dest: ${{ runner.tool_cache }}/setup-pnpm
        if: runner.environment == 'github-hosted'
      - name: Prepare runner tool paths
        run: node scripts/ci-runner-paths.mjs
      - name: Verify shared compile cache (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: bash build.sh cache-verify
      - name: Verify shared compile cache (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & .\build.ps1 cache-verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

