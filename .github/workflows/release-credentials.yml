name: Release preflight

# Checks every runner, shared cache, builder image and credential the release run
# needs, on the runner that uses it, in minutes and without building anything. Run it
# from a reviewed release branch before publication.
"on":
  workflow_dispatch:
    inputs:
      macos_label:
        description: Check only this macOS runner label (empty checks the release labels and every other runner)
        type: string
        default: ''
      notary_probe:
        description: Also notarize a trivial signed app on that runner
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-credentials
  cancel-in-progress: true

env:
  CODETERM_SCCACHE_CREDENTIAL_SOURCE: runner

jobs:
  macos:
    name: macOS signing and notarization
    if: ${{ (github.repository_owner == 'rollacode' || github.repository_owner == 'domios-dev') && github.actor == 'rollacode' && github.triggering_actor == 'rollacode' && startsWith(github.ref, 'refs/heads/release/') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    environment: release
    runs-on: [self-hosted, "${{ matrix.runner_label }}"]
    strategy:
      fail-fast: false
      matrix:
        runner_label: ${{ fromJSON(inputs.macos_label != '' && format('["{0}"]', inputs.macos_label) || format('["{0}","{1}"]', vars.RELEASE_MACOS_ARM64_LABEL || 'codeterm-builder', vars.RELEASE_MACOS_X64_LABEL || 'codeterm-builder')) }}
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
      GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          package-manager-cache: false
          node-version: 22.22.0
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
      - name: Import temporary release signing material
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: python3 scripts/release-signing-material.py macos
      - name: Developer ID, minisign key, gh, Apple notary
        run: bash scripts/check-release-credentials-mac.sh
      - name: Notarize a trivial signed app
        if: ${{ inputs.notary_probe }}
        run: bash scripts/release-notary-probe.sh
      - name: Clean up temporary release signing material
        if: always()
        run: python3 scripts/release-signing-material.py cleanup

  linux:
    name: Linux updater key and release tokens
    if: ${{ (github.repository_owner == 'rollacode' || github.repository_owner == 'domios-dev') && github.actor == 'rollacode' && github.triggering_actor == 'rollacode' && startsWith(github.ref, 'refs/heads/release/') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (inputs.macos_label == '') }}
    environment: release
    runs-on: [self-hosted, "${{ vars.RELEASE_LINUX_X64_LABEL || 'linux-build' }}"]
    timeout-minutes: 5
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          package-manager-cache: false
          node-version: 22.22.0
      - name: Updater signing key and repository write access
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          PACKAGE_REPOS_TOKEN: ${{ secrets.PACKAGE_REPOS_TOKEN }}
        shell: bash
        run: |
          rc=0
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && printf %s "$TAURI_SIGNING_PRIVATE_KEY" | base64 -d 2>/dev/null | grep -q "untrusted comment"; then
            echo "✅ TAURI_SIGNING_PRIVATE_KEY decodes as a minisign key"
          else
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is missing or not a minisign key"; rc=1
          fi
          check_push() {
            local token="$1" repo="$2" name="$3" push
            push=$(GH_TOKEN="$token" gh api "repos/$repo" -q .permissions.push 2>/dev/null)
            if [ "$push" = true ]; then echo "✅ $name can write $repo"; else echo "::error::$name cannot write $repo (expired or missing scope)"; rc=1; fi
          }
          check_push "$GH_RELEASE_TOKEN" "$GITHUB_REPOSITORY" GH_RELEASE_TOKEN
          check_push "$GH_RELEASE_TOKEN" rollacode/codeterm-releases GH_RELEASE_TOKEN
          check_push "$PACKAGE_REPOS_TOKEN" rollacode/codeterm-releases PACKAGE_REPOS_TOKEN
          exit "$rc"

  windows:
    name: Windows updater key
    if: ${{ (github.repository_owner == 'rollacode' || github.repository_owner == 'domios-dev') && github.actor == 'rollacode' && github.triggering_actor == 'rollacode' && startsWith(github.ref, 'refs/heads/release/') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (inputs.macos_label == '') }}
    environment: release
    runs-on: [self-hosted, "${{ matrix.runner_label }}"]
    strategy:
      fail-fast: false
      matrix:
        runner_label:
          - ${{ vars.RELEASE_WINDOWS_X64_LABEL || 'windows-x64-build' }}
          - ${{ vars.RELEASE_WINDOWS_ARM64_LABEL || 'windows-build' }}
    timeout-minutes: 5
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          package-manager-cache: false
          node-version: 22.22.0
      - name: Updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: pwsh
        run: |
          $key = $env:TAURI_SIGNING_PRIVATE_KEY
          if (-not $key) { Write-Host "::error::TAURI_SIGNING_PRIVATE_KEY is missing"; exit 1 }
          $text = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($key))
          if ($text -notmatch 'untrusted comment') { Write-Host "::error::TAURI_SIGNING_PRIVATE_KEY is not a minisign key"; exit 1 }
          Write-Host "✅ TAURI_SIGNING_PRIVATE_KEY decodes as a minisign key"

  runners:
    name: release and test runners online
    if: ${{ (github.repository_owner == 'rollacode' || github.repository_owner == 'domios-dev') && github.actor == 'rollacode' && github.triggering_actor == 'rollacode' && startsWith(github.ref, 'refs/heads/release/') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (inputs.macos_label == '') }}
    environment: release
    runs-on: [self-hosted, Linux, light, host-ubunta]
    timeout-minutes: 5
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          package-manager-cache: false
          node-version: 22.22.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
      # Listing runners needs repository Administration read on the token.
      - name: Every required runner label has an online runner
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          RELEASE_REPO: ${{ github.repository }}
        run: bash scripts/check-release-runners.sh

  shared-cache:
    name: shared sccache (${{ matrix.runner_label }})
    if: ${{ (github.repository_owner == 'rollacode' || github.repository_owner == 'domios-dev') && github.actor == 'rollacode' && github.triggering_actor == 'rollacode' && startsWith(github.ref, 'refs/heads/release/') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (inputs.macos_label == '') }}
    environment: release
    runs-on: [self-hosted, "${{ matrix.runner_label }}"]
    strategy:
      fail-fast: false
      matrix:
        runner_label:
          - ${{ vars.RELEASE_MACOS_ARM64_LABEL || 'codeterm-builder' }}
          - ${{ vars.RELEASE_MACOS_X64_LABEL || 'codeterm-builder' }}
          - ${{ vars.RELEASE_LINUX_X64_LABEL || 'linux-build' }}
          - ${{ vars.RELEASE_WINDOWS_X64_LABEL || 'windows-x64-build' }}
          - ${{ vars.RELEASE_WINDOWS_ARM64_LABEL || 'windows-build' }}
          - windows-ci
    timeout-minutes: 10
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
      CODETERM_SCCACHE_VERIFY_ONLY: '1'
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          package-manager-cache: false
          node-version: 22.22.0
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.longpaths
          GIT_CONFIG_VALUE_0: 'true'
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.32.1
          run_install: false
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - name: Prepare runner tool paths
        run: node scripts/ci-runner-paths.mjs
      - name: Verify shared compile cache (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: bash build.sh cache-verify
      - name: Verify shared compile cache (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & .\build.ps1 cache-verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  linux-arm64-image:
    name: Linux arm64 builder image
    if: ${{ (github.repository_owner == 'rollacode' || github.repository_owner == 'domios-dev') && github.actor == 'rollacode' && github.triggering_actor == 'rollacode' && startsWith(github.ref, 'refs/heads/release/') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (inputs.macos_label == '') }}
    environment: release
    runs-on: [self-hosted, "${{ vars.RELEASE_LINUX_ARM64_LABEL || 'codeterm-builder' }}"]
    timeout-minutes: 5
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          package-manager-cache: false
          node-version: 22.22.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
      - name: Native arm64 image carries sccache
        run: bash scripts/check-linux-arm64-builder.sh
