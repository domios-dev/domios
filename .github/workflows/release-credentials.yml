name: Release preflight

# Checks every runner, shared cache, builder image and credential the release run
# needs, on the runner that uses it, in minutes and without building anything. Run it
# from a reviewed release branch before publication.
"on":
  workflow_dispatch:
    inputs:
      macos_label:
        description: Check only this macOS image or self-hosted label (empty checks all configured release runners)
        type: string
        default: ''
      notary_probe:
        description: Also notarize a trivial signed app on that runner
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-credentials
  cancel-in-progress: true

env:
  CODETERM_SCCACHE_CREDENTIAL_SOURCE: runner

jobs:
  macos:
    name: macOS signing and notarization
    if: ${{ (github.repository_owner == 'rollacode' || github.repository_owner == 'domios-dev') && github.actor == 'rollacode' && github.triggering_actor == 'rollacode' && (startsWith(github.ref, 'refs/heads/release/') || startsWith(github.head_ref, 'release/')) && (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') }}
    environment: release
    runs-on: ${{ fromJSON(matrix.runner_label) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner_label: ${{ inputs.macos_label != '' && (startsWith(inputs.macos_label, 'macos-') && format('"{0}"', inputs.macos_label) || format('["self-hosted","macOS","{0}"]', inputs.macos_label)) || vars.RELEASE_MACOS_ARM64_RUNNER || '"macos-15"' }}
          - runner_label: ${{ inputs.macos_label != '' && (startsWith(inputs.macos_label, 'macos-') && format('"{0}"', inputs.macos_label) || format('["self-hosted","macOS","{0}"]', inputs.macos_label)) || vars.RELEASE_MACOS_X64_RUNNER || '"macos-15-intel"' }}
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
      CI_STORE_LAN_ENDPOINT: ${{ secrets.CI_STORE_LAN_ENDPOINT }}
      CI_STORE_PUBLIC_ENDPOINT: ${{ secrets.CI_STORE_PUBLIC_ENDPOINT }}
      GH_TOKEN: ${{ github.token }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Use the runner bundled Node
        if: runner.environment == 'self-hosted'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |-
            const path = require('node:path');
            core.addPath(path.dirname(process.execPath));
            core.info('Using runner Node ' + process.version);
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          package-manager-cache: false
          node-version: 22.22.0
        if: runner.environment == 'github-hosted'
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
        if: runner.environment == 'github-hosted'
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
      - name: Discover installed runner tools
        if: runner.environment == 'self-hosted'
        run: node scripts/ci-runner-paths.mjs --paths-only
      - name: Import temporary release signing material
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: python3 scripts/release-signing-material.py macos
      - name: Developer ID, minisign key, gh, Apple notary
        run: bash scripts/check-release-credentials-mac.sh
      - name: Notarize a trivial signed app
        if: ${{ inputs.notary_probe }}
        run: bash scripts/release-notary-probe.sh
      - name: Clean up temporary release signing material
        if: always()
        run: python3 scripts/release-signing-material.py cleanup

  linux:
    name: Linux updater key and release tokens
    if: ${{ (github.repository_owner == 'rollacode' || github.repository_owner == 'domios-dev') && github.actor == 'rollacode' && github.triggering_actor == 'rollacode' && (startsWith(github.ref, 'refs/heads/release/') || startsWith(github.head_ref, 'release/')) && (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && (inputs.macos_label == '') }}
    environment: release
    runs-on: ${{ fromJSON(vars.RELEASE_LINUX_X64_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 5
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
      CI_STORE_LAN_ENDPOINT: ${{ secrets.CI_STORE_LAN_ENDPOINT }}
      CI_STORE_PUBLIC_ENDPOINT: ${{ secrets.CI_STORE_PUBLIC_ENDPOINT }}
    steps:
      - name: Use the runner bundled Node
        if: runner.environment == 'self-hosted'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |-
            const path = require('node:path');
            core.addPath(path.dirname(process.execPath));
            core.info('Using runner Node ' + process.version);
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          package-manager-cache: false
          node-version: 22.22.0
        if: runner.environment == 'github-hosted'
      # Source writes use GITHUB_TOKEN with the release jobs' contents:write; no token to probe.
      - name: Updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |-
            if (!Buffer.from(process.env.TAURI_SIGNING_PRIVATE_KEY || '', 'base64').toString().includes('untrusted comment')) throw new Error('Updater signing key missing or invalid');
      # 1.19 transition mirror: delete after 1.19 ships.
      - name: Mirror publication token write access
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          github-token: ${{ secrets.PACKAGE_REPOS_TOKEN }}
          script: |-
            const result = await github.rest.repos.get({owner:'rollacode',repo:'codeterm-releases'});
            if (!result.data.permissions?.push) throw new Error('PACKAGE_REPOS_TOKEN cannot write release mirror');

  windows:
    name: Windows updater key
    if: ${{ (github.repository_owner == 'rollacode' || github.repository_owner == 'domios-dev') && github.actor == 'rollacode' && github.triggering_actor == 'rollacode' && (startsWith(github.ref, 'refs/heads/release/') || startsWith(github.head_ref, 'release/')) && (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && (inputs.macos_label == '') }}
    environment: release
    runs-on: ${{ fromJSON(matrix.runner_label) }}
    strategy:
      fail-fast: false
      matrix:
        runner_label:
          - ${{ vars.RELEASE_WINDOWS_X64_RUNNER || '"windows-2025"' }}
          - ${{ vars.RELEASE_WINDOWS_ARM64_COMPILE_RUNNER || '"windows-2025"' }}
    timeout-minutes: 5
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
      CI_STORE_LAN_ENDPOINT: ${{ secrets.CI_STORE_LAN_ENDPOINT }}
      CI_STORE_PUBLIC_ENDPOINT: ${{ secrets.CI_STORE_PUBLIC_ENDPOINT }}
    steps:
      - name: Use the runner bundled Node
        if: runner.environment == 'self-hosted'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |-
            const path = require('node:path');
            core.addPath(path.dirname(process.execPath));
            core.info('Using runner Node ' + process.version);
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          package-manager-cache: false
          node-version: 22.22.0
        if: runner.environment == 'github-hosted'
      - name: Updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: pwsh
        run: |
          $key = $env:TAURI_SIGNING_PRIVATE_KEY
          if (-not $key) { Write-Host "::error::TAURI_SIGNING_PRIVATE_KEY is missing"; exit 1 }
          $text = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($key))
          if ($text -notmatch 'untrusted comment') { Write-Host "::error::TAURI_SIGNING_PRIVATE_KEY is not a minisign key"; exit 1 }
          Write-Host "✅ TAURI_SIGNING_PRIVATE_KEY decodes as a minisign key"

  hosted-signing:
    name: hosted signing (${{ matrix.runner }})
    # GitHub-hosted runners sign arm64 releases and can stand in for our machines; each proves it with real keys.
    if: ${{ (github.repository_owner == 'rollacode' || github.repository_owner == 'domios-dev') && github.actor == 'rollacode' && github.triggering_actor == 'rollacode' && (startsWith(github.ref, 'refs/heads/release/') || startsWith(github.head_ref, 'release/')) && (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && (inputs.macos_label == '') }}
    environment: release
    runs-on: ${{ fromJSON(matrix.runner) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ${{ vars.RELEASE_MACOS_ARM64_RUNNER || '"macos-15"' }}
          - runner: ${{ vars.RELEASE_MACOS_X64_RUNNER || '"macos-15-intel"' }}
          - runner: ${{ vars.CI_LINUX_ARM64_RUNNER || '"ubuntu-24.04-arm"' }}
          - runner: ${{ vars.CI_WINDOWS_ARM64_RUNNER || '"windows-11-arm"' }}
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          package-manager-cache: false
          node-version: 22.22.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Import temporary release signing material
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: python3 scripts/release-signing-material.py macos
      - name: Developer ID, minisign key, gh, Apple notary
        if: runner.os == 'macOS'
        run: bash scripts/check-release-credentials-mac.sh
      - name: Notarize a trivial signed app
        if: runner.os == 'macOS'
        run: bash scripts/release-notary-probe.sh
      - name: Clean up temporary release signing material
        if: always() && runner.os == 'macOS'
        run: python3 scripts/release-signing-material.py cleanup
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.32.1
          run_install: false
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - name: Install frozen dependencies
        if: runner.os != 'macOS'
        run: pnpm install --frozen-lockfile
      - name: Sign and verify a probe with the updater key
        if: runner.os != 'macOS'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: node scripts/release-signing-probe.mjs

  shared-cache:
    name: shared sccache (${{ matrix.runner_label }})
    if: ${{ (github.repository_owner == 'rollacode' || github.repository_owner == 'domios-dev') && github.actor == 'rollacode' && github.triggering_actor == 'rollacode' && (startsWith(github.ref, 'refs/heads/release/') || startsWith(github.head_ref, 'release/')) && (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && (inputs.macos_label == '') }}
    environment: release
    runs-on: ${{ fromJSON(matrix.runner_label) }}
    strategy:
      fail-fast: false
      matrix:
        runner_label:
          - ${{ vars.RELEASE_MACOS_ARM64_RUNNER || '"macos-15"' }}
          - ${{ vars.RELEASE_MACOS_X64_RUNNER || '"macos-15-intel"' }}
          - ${{ vars.RELEASE_LINUX_X64_RUNNER || '"ubuntu-24.04"' }}
          - ${{ vars.RELEASE_WINDOWS_X64_RUNNER || '"windows-2025"' }}
          - ${{ vars.RELEASE_WINDOWS_ARM64_COMPILE_RUNNER || '"windows-2025"' }}
    timeout-minutes: 10
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
      CI_STORE_LAN_ENDPOINT: ${{ secrets.CI_STORE_LAN_ENDPOINT }}
      CI_STORE_PUBLIC_ENDPOINT: ${{ secrets.CI_STORE_PUBLIC_ENDPOINT }}
      CODETERM_SCCACHE_VERIFY_ONLY: '1'
    steps:
      - name: Hosted pinned Rust toolchain
        if: runner.environment == 'github-hosted'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.1
          components: clippy,rustfmt
      - name: Hosted sccache
        if: runner.environment == 'github-hosted'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
      - name: Select hosted cache policy
        if: runner.environment == 'github-hosted'
        shell: bash
        run: |
          sccache --stop-server >/dev/null 2>&1 || true
          echo CI_HOSTED=true >> "$GITHUB_ENV"
          echo SCCACHE_GHA_ENABLED=true >> "$GITHUB_ENV"
          echo CODETERM_SCCACHE_VERIFY_ONLY=0 >> "$GITHUB_ENV"
      - name: Use the runner bundled Node
        if: runner.environment == 'self-hosted'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |-
            const path = require('node:path');
            core.addPath(path.dirname(process.execPath));
            core.info('Using runner Node ' + process.version);
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 22.22.0
        if: runner.environment == 'github-hosted'
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
        if: runner.environment == 'github-hosted'
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.longpaths
          GIT_CONFIG_VALUE_0: 'true'
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
      - name: Discover installed runner tools
        if: runner.environment == 'self-hosted'
        run: node scripts/ci-runner-paths.mjs --paths-only
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.32.1
          run_install: false
          dest: ${{ runner.tool_cache }}/setup-pnpm
        if: runner.environment == 'github-hosted'
      - name: Prepare runner tool paths
        run: node scripts/ci-runner-paths.mjs
      - name: Verify shared compile cache (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: bash build.sh cache-verify
      - name: Verify shared compile cache (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & .\build.ps1 cache-verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

