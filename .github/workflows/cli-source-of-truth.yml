name: cli-source-of-truth

on:
  pull_request:
    paths:
      - 'cli/**'
      - 'generated/cli/cli-manifest.json'
      - 'generated/cli/cli.md'
      - 'src-tauri/prompts/codeterm_cli.md'
      - 'packages/chat-ui/src/codeterm/**'
      - '.github/workflows/cli-source-of-truth.yml'
  push:
    branches: [master]
    paths-ignore:
      - '.codeterm/build-machine/**'
      - '.github/workflows/release*.yml'

jobs:
  cli-doctor:
    runs-on: [self-hosted, linux-build]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable

      # The Linux runner service PATH can miss rustc even when rustup is
      # installed for the runner user (same guard as tests.yml).
      - name: Ensure Rust toolchain on PATH
        run: |
          if command -v rustc >/dev/null 2>&1; then rustc -vV; exit 0; fi
          for dir in "$CARGO_HOME/bin" "$HOME/.cargo/bin" /home/*/.cargo/bin; do
            if [ -x "$dir/rustc" ]; then
              echo "$dir" >> "$GITHUB_PATH"
              "$dir/rustc" -vV
              exit 0
            fi
          done
          echo "rustc not found; restore Rust on the runner" >&2
          exit 1

      - name: cli manifest + doctor tests
        working-directory: cli
        run: cargo test -p codeterm-cli cmd::manifest
      - name: plugin clap contract test
        working-directory: cli
        run: cargo test -p codeterm-cli plugin_subcommands_parse

  chat-card-tests:
    runs-on: [self-hosted, linux-build]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22', package-manager-cache: false }
      - uses: pnpm/action-setup@v4
        with: { version: 10.32.1, run_install: false }
      - run: pnpm install --frozen-lockfile
      - run: npx tsx packages/chat-ui/src/codeterm/recognize.test.ts
