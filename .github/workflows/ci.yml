name: CI

on:
  pull_request:
    branches: [master]
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust-target: 'aarch64-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            cli

      - name: Install frontend dependencies
        run: pnpm install

      - name: TypeScript check + Vite build
        run: pnpm build

      - name: Build CLI (needed for bundled-cli resource)
        run: |
          cargo build --manifest-path cli/Cargo.toml
          mkdir -p src-tauri/bundled-cli
          cp cli/target/debug/codeterm src-tauri/bundled-cli/

      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: CLI check
        run: cargo check --manifest-path cli/Cargo.toml
