name: dep-audit

on:
  schedule:
    - cron: '0 3 * * 1' # weekly Monday 3am UTC
  workflow_dispatch: {}

jobs:
  cargo-audit:
    if: ${{ (github.repository_owner == 'rollacode' || github.repository_owner == 'domios-dev') && github.actor == 'rollacode' && github.event_name != 'pull_request' && github.event_name != 'pull_request_target' }}
    runs-on: [self-hosted, Linux, linux-build, host-ubunta]
    strategy:
      matrix:
        directory: [src-tauri, cli, crates/mem-store]
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          package-manager-cache: false
          node-version: 22.22.0
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Run cargo audit in ${{ matrix.directory }}
        working-directory: ${{ matrix.directory }}
        run: cargo audit
        continue-on-error: true

  pnpm-audit:
    if: ${{ (github.repository_owner == 'rollacode' || github.repository_owner == 'domios-dev') && github.actor == 'rollacode' && github.event_name != 'pull_request' && github.event_name != 'pull_request_target' }}
    runs-on: [self-hosted, Linux, light, host-ubunta]
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          package-manager-cache: false
          node-version: 22.22.0
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.32.1
          run_install: false
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - run: pnpm install --frozen-lockfile --store-dir "$RUNNER_TOOL_CACHE/pnpm-store"
      - name: Run pnpm audit
        run: pnpm audit --prod
        continue-on-error: true
