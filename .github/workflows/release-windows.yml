name: release-windows

# Builds and signs the Windows installers (NSIS) for BOTH arches — x86_64 and
# aarch64 — on the ROG self-hosted runner (label `windows-build`), uploads the
# bundles to the GitHub release, then refreshes the channel updater manifest.
#
# Triggers:
#   - push of a `release-*` tag (the same tag that drives release.yml on the Mac;
#     mapped to the `vX.Y.Z` release so Windows lands beside mac+linux)
#   - workflow_dispatch with an explicit `tag` input (manual re-run / verification)
#
# Runs on the always-on ROG (self-hosted runner, labels include
# [self-hosted, Windows, X64, windows-build]). The ROG already has node 22 /
# pnpm 10.32.1 / Rust 1.95.0 (rust-toolchain.toml-pinned, both windows-msvc
# targets installed) / VS2022 (x64 + ARM64) / LLVM. The setup-node/pnpm/
# rust-cache actions still run on self-hosted runners; node/pnpm versions are
# pinned to what the ROG has so they no-op instead of conflicting, and the Rust
# toolchain is left to rust-toolchain.toml (NOT dtolnay@stable, which would
# mismatch the targets installed on 1.95.0).
#
# Disable: set repo Variable RELEASE_WINDOWS_ENABLED=false in
# Settings -> Secrets and variables -> Actions -> Variables.
#
# Required secrets: TAURI_SIGNING_PRIVATE_KEY, PACKAGE_REPOS_TOKEN.
# PACKAGE_REPOS_TOKEN must have contents:write for rollacode/codeterm-releases.
# Optional secret:  TAURI_KEY_PASSWORD (only if the signing key is
# encrypted — it evaluates to empty when unset).

"on":
  push:
    tags:
      - 'release-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.1.0). Required for manual runs.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    if: ${{ vars.RELEASE_WINDOWS_ENABLED != 'false' }}
    runs-on: [self-hosted, windows-build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            platform_key: windows-x86_64
            vsarch: x64
            label: x64
          - target: aarch64-pc-windows-msvc
            platform_key: windows-aarch64
            vsarch: x64_arm64
            label: arm64
    env:
      TARGET: ${{ matrix.target }}
      # Drive every cargo invocation in tauri's beforeBuildCommand at the matrix
      # target so the bundled CLI/embed sidecars match the installer arch (this is
      # what makes the aarch64 cross-build on the x64 ROG produce arm64 sidecars).
      CARGO_BUILD_TARGET: ${{ matrix.target }}
      # Some repo paths exceed Windows' 260-char limit (.codeterm/plans/**). git's
      # core.longpaths must be on for checkout to write them. Set it via GIT_CONFIG_*
      # env (not --global) because actions/checkout swaps HOME and ignores ~/.gitconfig.
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            # push of release-X.Y.Z -> publish under the vX.Y.Z release (matches release.yml).
            echo "name=v${GITHUB_REF_NAME#release-}" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect channel and prerelease flag
        id: channel
        shell: bash
        run: |
          tag="${{ steps.tag.outputs.name }}"
          if [[ "$tag" == *-rc* ]]; then
            echo "manifest=latest-rc.json" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          elif [[ "$tag" == *-nightly* ]]; then
            echo "manifest=latest-nightly.json" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "manifest=latest.json" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # Repo-pinned toolchain (rust-toolchain.toml = 1.95.0) drives rustc; the
      # ROG already has both windows-msvc targets installed on 1.95.0. We do NOT
      # install dtolnay@stable — that would float off the pin and miss the targets.
      - name: Show pinned Rust toolchain
        shell: bash
        run: |
          rustup show
          rustc -vV
          rustup target list --installed | grep -E 'pc-windows-msvc' || true

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            cli
          key: ${{ env.TARGET }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false

      - name: Install npm dependencies
        run: pnpm install --frozen-lockfile

      # Load the MSVC + Windows SDK dev environment (INCLUDE/LIB/PATH) for the
      # matrix arch into $GITHUB_ENV so the tauri build below inherits it. ring's
      # clang (compiled for aarch64) needs the ARM64 CRT/SDK headers — without the
      # x64_arm64 dev env the cross build fails. x64 needs the x64 dev env.
      - name: Load MSVC dev environment (${{ matrix.vsarch }})
        shell: pwsh
        run: |
          $vswhere = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
          $vcvars = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -find "VC\Auxiliary\Build\vcvarsall.bat" | Select-Object -First 1
          if (-not $vcvars) { Write-Error "vcvarsall.bat not found via vswhere"; exit 1 }
          Write-Host "Using $vcvars ${{ matrix.vsarch }}"
          $before = @{}
          foreach ($l in (Get-ChildItem Env:)) { $before[$l.Name] = $l.Value }
          cmd /c "`"$vcvars`" ${{ matrix.vsarch }} && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              $name = $matches[1]; $value = $matches[2]
              if (-not $before.ContainsKey($name) -or $before[$name] -ne $value) {
                "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              }
            }
          }

      # Pre-create the target-triple sidecar stubs so tauri_build's externalBin/
      # resource glob validation passes on the FIRST cargo build of a cross target
      # (prepare-embed-stub.js only stubs the HOST triple). bundle-cli.js /
      # bundle-embed.js overwrite these with the real arm64/x64 binaries during
      # beforeBuildCommand, so the shipped installer carries the correct sidecars.
      - name: Pre-create cross-build sidecar stubs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri\bundled-embed | Out-Null
          New-Item -ItemType Directory -Force src-tauri\bundled-cli | Out-Null
          New-Item -ItemType File -Force "src-tauri\bundled-embed\codeterm-embed-${{ matrix.target }}.exe" | Out-Null
          New-Item -ItemType File -Force "src-tauri\bundled-cli\codeterm.exe" | Out-Null

      - name: Build, sign, and upload release assets
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # If the signing key is encrypted, add TAURI_KEY_PASSWORD to
          # repo secrets — this evaluates to an empty string otherwise.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.tag.outputs.name }}
          releaseName: 'CodeTerm ${{ steps.tag.outputs.name }}'
          releaseBody: 'See the assets to download this version and install. Auto-update users will be offered this build via the configured channel.'
          releaseDraft: true
          prerelease: ${{ steps.channel.outputs.prerelease }}
          # tauri-action's own updater-JSON path silently skips when its
          # internal sig matcher cannot pair an artifact with a signature.
          # We build the fragment ourselves below.
          includeUpdaterJson: false
          updaterJsonPreferNsis: true
          args: --target ${{ env.TARGET }}

      - name: Publish per-platform updater fragment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
          SOURCE_REPO: ${{ github.repository }}
          MANIFEST_REPO: rollacode/codeterm-releases
          PLATFORM_KEY: ${{ matrix.platform_key }}
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_ROOT="src-tauri/target/${TARGET}/release/bundle"
          echo "::group::bundle directory listing"
          find "$BUNDLE_ROOT" -maxdepth 3 -type f | sort || true
          echo "::endgroup::"
          UPDATER_SIG=$(find "$BUNDLE_ROOT/nsis" -name '*.nsis.zip.sig' 2>/dev/null | head -n1)
          if [ -z "$UPDATER_SIG" ]; then
            UPDATER_SIG=$(find "$BUNDLE_ROOT/nsis" -name '*-setup.exe.sig' 2>/dev/null | head -n1)
          fi
          [ -n "$UPDATER_SIG" ] || { echo "::error::No NSIS updater signature under $BUNDLE_ROOT/nsis"; exit 1; }
          UPDATER_BUNDLE="${UPDATER_SIG%.sig}"
          [ -f "$UPDATER_BUNDLE" ] || { echo "::error::Bundle missing next to $UPDATER_SIG"; exit 1; }

          # With createUpdaterArtifacts=true, Tauri v2 reuses the NSIS .exe
          # as the updater bundle; v1Compatible builds emit .nsis.zip.
          gh release upload "$TAG" "$UPDATER_BUNDLE" "$UPDATER_SIG" --clobber --repo "$SOURCE_REPO"

          OUT="updater-${TARGET}.json"
          REPO="$MANIFEST_REPO" \
          UPDATER_BUNDLE="$UPDATER_BUNDLE" \
          UPDATER_SIG="$UPDATER_SIG" \
          OUT="$OUT" \
            python3 .github/workflows/build-updater-fragment.py
          gh release upload "$TAG" "$OUT" --clobber --repo "$SOURCE_REPO"

      - name: Refresh merged channel manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          mkdir -p _frags manifest-fragments
          gh release download "${{ steps.tag.outputs.name }}" \
            --pattern 'updater-*.json' \
            --dir _frags \
            --repo "${{ github.repository }}"
          for f in _frags/updater-*.json; do
            base=$(basename "$f" .json)
            mkdir -p "manifest-fragments/$base"
            cp "$f" "manifest-fragments/$base/latest.json"
          done
          node scripts/merge-latest-json.js \
            --in manifest-fragments \
            --out "${{ steps.channel.outputs.manifest }}"
          gh release upload "${{ steps.tag.outputs.name }}" \
            "${{ steps.channel.outputs.manifest }}" \
            --clobber --repo "${{ github.repository }}"

      # Mirror updater bundle, signature, and merged manifest to the public
      # release repo so the auto-updater endpoint
      # (rollacode/codeterm-releases/releases/latest/download/latest.json) can
      # serve them anonymously. Skip on workflow_dispatch — only mirror on the
      # actual tag push that produces the canonical release.
      - name: Mirror to public release repo
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_REPOS_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
          MANIFEST: ${{ steps.channel.outputs.manifest }}
          PRERELEASE: ${{ steps.channel.outputs.prerelease }}
          MIRROR_REPO: rollacode/codeterm-releases
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_ROOT="src-tauri/target/${TARGET}/release/bundle"
          UPDATER_SIG=$(find "$BUNDLE_ROOT/nsis" -name '*.nsis.zip.sig' 2>/dev/null | head -n1)
          if [ -z "$UPDATER_SIG" ]; then
            UPDATER_SIG=$(find "$BUNDLE_ROOT/nsis" -name '*-setup.exe.sig' 2>/dev/null | head -n1)
          fi
          [ -n "$UPDATER_SIG" ] || { echo "::error::No NSIS updater signature under $BUNDLE_ROOT/nsis"; exit 1; }
          UPDATER_BUNDLE="${UPDATER_SIG%.sig}"
          [ -f "$UPDATER_BUNDLE" ] || { echo "::error::Bundle missing next to $UPDATER_SIG"; exit 1; }

          # Idempotent: create the release in the mirror only if missing.
          # Each platform workflow may run this step in any order; first one
          # wins, the rest just upload assets to the existing release.
          if ! gh release view "$TAG" --repo "$MIRROR_REPO" >/dev/null 2>&1; then
            if [ "$PRERELEASE" = "true" ]; then
              gh release create "$TAG" \
                --repo "$MIRROR_REPO" \
                --title "CodeTerm $TAG" \
                --notes "Auto-mirrored from rollacode/codeterm. See the source repo for full release notes." \
                --prerelease
            else
              gh release create "$TAG" \
                --repo "$MIRROR_REPO" \
                --title "CodeTerm $TAG" \
                --notes "Auto-mirrored from rollacode/codeterm. See the source repo for full release notes."
            fi
          fi

          gh release upload "$TAG" "$UPDATER_BUNDLE" "$UPDATER_SIG" "$MANIFEST" \
            --clobber --repo "$MIRROR_REPO"
