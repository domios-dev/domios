name: Release Windows platforms

# Builds and signs the Windows installers (NSIS) for BOTH arches — x86_64 and
# aarch64 — on the ROG self-hosted runner (label `windows-build`), uploads the
# bundles and updater fragments to the releases. The caller's final job assembles
# and verifies the channel manifests after both architecture builds succeed.
#
# Runs on the always-on ROG (self-hosted runner, labels include
# [self-hosted, Windows, X64, windows-build]). The ROG already has node 22 /
# pnpm 10.32.1 / Rust 1.95.0 (rust-toolchain.toml-pinned, both windows-msvc
# targets installed) / VS2022 (x64 + ARM64) / LLVM. The setup-node/pnpm actions
# still run on the self-hosted runner; node/pnpm versions are pinned to what
# the ROG has so they no-op instead of conflicting, and the Rust
# toolchain is left to rust-toolchain.toml (NOT dtolnay@stable, which would
# mismatch the targets installed on 1.95.0).
#
# Disable: set repo Variable RELEASE_WINDOWS_ENABLED=false in
# Settings -> Secrets and variables -> Actions -> Variables.
# The caller prepares draft releases before this matrix starts.
#
# Required secrets: TAURI_SIGNING_PRIVATE_KEY, PACKAGE_REPOS_TOKEN.
# PACKAGE_REPOS_TOKEN must have contents:write for rollacode/codeterm-releases.
# Optional secret:  TAURI_KEY_PASSWORD (only if the signing key is
# encrypted — it evaluates to empty when unset).

"on":
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      source_ref:
        required: true
        type: string
      mirror:
        required: true
        type: boolean
      dry_run:
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    if: ${{ vars.RELEASE_WINDOWS_ENABLED != 'false' }}
    runs-on: [self-hosted, windows-build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            platform_key: windows-x86_64
            vsarch: x64
            sdkarch: x64
            label: x64
          - target: aarch64-pc-windows-msvc
            platform_key: windows-aarch64
            vsarch: x64_arm64
            sdkarch: arm64
            label: arm64
    env:
      TARGET: ${{ matrix.target }}
      # Drive every cargo invocation in tauri's beforeBuildCommand at the matrix
      # target so the bundled CLI/embed sidecars match the installer arch (this is
      # what makes the aarch64 cross-build on the x64 ROG produce arm64 sidecars).
      CARGO_BUILD_TARGET: ${{ matrix.target }}
      # Absolute: the prebuild step runs from the repo root and tauri-action runs
      # cargo from src-tauri, so a relative path lands in src-tauri/src-tauri/target.
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
      CODETERM_RELEASE_FEATURES: embeddings
      CARGO_INCREMENTAL: '0'
      # Some repo paths exceed Windows' 260-char limit (.codeterm/plans/**). git's
      # core.longpaths must be on for checkout to write them. Set it via GIT_CONFIG_*
      # env (not --global) because actions/checkout swaps HOME and ignores ~/.gitconfig.
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      # All scripted steps use pwsh, not bash: this self-hosted ROG runner has no
      # bash on PATH (unlike GitHub-hosted windows-latest), so `shell: bash` fails
      # with "bash: command not found". pwsh + node + gh are present.
      - name: Resolve tag
        id: tag
        shell: pwsh
        run: |
          $name = "${{ inputs.tag }}"
          "name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Detect channel and prerelease flag
        id: channel
        shell: pwsh
        run: |
          $tag = "${{ steps.tag.outputs.name }}"
          if ($tag -like '*-rc*') { $manifest = 'latest-rc.json'; $prerelease = 'true' }
          elseif ($tag -like '*-nightly*') { $manifest = 'latest-nightly.json'; $prerelease = 'true' }
          else { $manifest = 'latest.json'; $prerelease = 'false' }
          "manifest=$manifest"     | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "prerelease=$prerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # The runner service session PATH can drop ~\.cargo\bin (observed 2026-06-29:
      # `rustup` not recognized, failing every build before MSVC env). Self-heal by
      # locating rustup across CARGO_HOME / user profiles and prepending its dir.
      - name: Ensure Rust toolchain on PATH
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Get-Command rustup -ErrorAction SilentlyContinue) { Write-Host "rustup already on PATH"; exit 0 }
          $candidates = @()
          if ($env:CARGO_HOME)  { $candidates += (Join-Path $env:CARGO_HOME 'bin') }
          if ($env:USERPROFILE) { $candidates += (Join-Path $env:USERPROFILE '.cargo\bin') }
          $candidates += (Get-ChildItem 'C:\Users' -Directory -ErrorAction SilentlyContinue |
                          ForEach-Object { Join-Path $_.FullName '.cargo\bin' })
          $hit = $candidates | Where-Object { Test-Path (Join-Path $_ 'rustup.exe') } | Select-Object -First 1
          if (-not $hit) { Write-Error "rustup.exe not found in: $($candidates -join '; '). Restore Rust on the runner."; exit 1 }
          $hit | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "Prepended Rust bin to PATH: $hit"

      # Repo-pinned toolchain (rust-toolchain.toml = 1.95.0) drives rustc; the
      # ROG already has both windows-msvc targets installed on 1.95.0. We do NOT
      # install dtolnay@stable — that would float off the pin and miss the targets.
      - name: Show pinned Rust toolchain
        shell: pwsh
        run: |
          rustup show
          rustc -vV
          rustup target list --installed | Select-String 'pc-windows-msvc'

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          package-manager-cache: false
          node-version: '22.22.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false

      - name: Install npm dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Clear incomplete release uploads for retry
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          MIRROR_TOKEN: ${{ secrets.PACKAGE_REPOS_TOKEN }}
          PUBLISH_MIRROR: ${{ inputs.mirror }}
          TAG: ${{ inputs.tag }}
          SOURCE_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          node scripts/release-clear-wedged-assets.mjs "$env:SOURCE_REPO" "$env:TAG"
          if ($env:PUBLISH_MIRROR -eq 'true') {
            $env:GH_TOKEN = $env:MIRROR_TOKEN
            node scripts/release-clear-wedged-assets.mjs rollacode/codeterm-releases "$env:TAG"
          }

      # Load the MSVC + Windows SDK dev environment for the matrix arch. INCLUDE/
      # LIB go to $GITHUB_ENV; new PATH dirs go to $GITHUB_PATH (PREPEND, so the
      # runner's existing PATH — gh, git, node — is preserved). ring's aarch64
      # build needs a clang the runner account can execute (see clang note below).
      - name: Load MSVC dev environment (${{ matrix.vsarch }})
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
          $vcvars = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -find "VC\Auxiliary\Build\vcvarsall.bat" | Select-Object -First 1
          if (-not $vcvars) { Write-Error "vcvarsall.bat not found via vswhere"; exit 1 }
          Write-Host "Using $vcvars ${{ matrix.vsarch }}"
          # cmd is not on PATH in the runner's scoop pwsh session — call it by absolute path.
          $cmdExe = if ($env:ComSpec) { $env:ComSpec } else { "$env:SystemRoot\System32\cmd.exe" }
          $vc = @{}
          & $cmdExe /c "`"$vcvars`" ${{ matrix.vsarch }} && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { $vc[$matches[1]] = $matches[2] }
          }
          $newPathDirs = New-Object System.Collections.Generic.List[string]
          $orig = @($env:PATH -split ';' | Where-Object { $_ })
          # vcvars-added PATH dirs (MSVC bin etc.), minus the literal %PATH% token.
          foreach ($d in (($vc['Path'] -replace ';?%PATH%;?', ';') -split ';')) {
            if ($d -and ($orig -notcontains $d) -and ($newPathDirs -notcontains $d)) { $newPathDirs.Add($d) }
          }
          # vcvarsall under the runner service account does NOT auto-detect the Windows
          # SDK, so INCLUDE lacks the UCRT headers (stdio.h/assert.h -> C1083). Inject
          # the SDK include/lib/bin for the matrix arch explicitly.
          $kits = "C:\Program Files (x86)\Windows Kits\10"
          $sdk = (Get-ChildItem "$kits\Include" -Directory -ErrorAction SilentlyContinue |
                  Where-Object { $_.Name -match '^10\.' } |
                  Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1).Name
          $arch = "${{ matrix.sdkarch }}"
          if (-not $sdk) {
            Write-Error "Windows SDK not found under $kits — runner is missing the SDK component"; exit 1
          }
          if ($vc['INCLUDE'] -notmatch 'Windows Kits') {
            $vc['INCLUDE'] = "$($vc['INCLUDE'].TrimEnd(';'));$kits\Include\$sdk\ucrt;$kits\Include\$sdk\shared;$kits\Include\$sdk\um;$kits\Include\$sdk\winrt;$kits\Include\$sdk\cppwinrt"
            $vc['LIB']     = "$($vc['LIB'].TrimEnd(';'));$kits\Lib\$sdk\ucrt\$arch;$kits\Lib\$sdk\um\$arch"
            $vc['WindowsSdkDir'] = "$kits\"
            $vc['WindowsSDKVersion'] = "$sdk\"
            $newPathDirs.Add("$kits\bin\$sdk\x64"); $newPathDirs.Add("$kits\bin\$sdk\x64\ucrt")
            Write-Host "Injected Windows SDK $sdk (lib arch $arch)"
          }
          # ring's aarch64 build invokes bare `clang`. The scoop clang lives under a
          # per-user profile that the runner service account can't execute ('permission
          # denied'). Prefer a machine-wide clang (VS-bundled LLVM / Program Files LLVM).
          $clang = @(
            (Join-Path $vc['VCINSTALLDIR'] 'Tools\Llvm\x64\bin\clang.exe'),
            (Join-Path $vc['VCINSTALLDIR'] 'Tools\Llvm\bin\clang.exe'),
            'C:\Program Files\LLVM\bin\clang.exe'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($clang) {
            $clangDir = Split-Path $clang -Parent
            $newPathDirs.Insert(0, $clangDir)
            "LIBCLANG_PATH=$clangDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host "Using machine-wide clang: $clang"
          } else {
            Write-Host "::warning::No machine-wide clang found (checked VS LLVM + C:\Program Files\LLVM). The aarch64 ring build will fail with 'permission denied' on the per-user scoop clang — install LLVM to Program Files or run the runner as the toolchain-owning user."
          }
          # Cross-compile (vsarch like x64_arm64): force the cc crate to use the
          # arm64-targeting cl.exe. Without this its windows_registry detection
          # returns the host x64 cl, so bundled sqlite3.c compiles to x64 objects
          # and the arm64 link drops them (LNK4272 -> LNK2019 sqlite3_* / LNK1120).
          if ("${{ matrix.vsarch }}" -match '_') {
            $ccKey = "${{ matrix.target }}".Replace('-', '_')
            $crossBin = Join-Path $vc['VCToolsInstallDir'] "bin\Hostx64\${{ matrix.sdkarch }}"
            $crossCl  = Join-Path $crossBin 'cl.exe'
            $crossLib = Join-Path $crossBin 'lib.exe'
            if (-not (Test-Path $crossCl)) { Write-Error "cross cl.exe not found at $crossCl (VC.Tools.ARM64 missing?)"; exit 1 }
            "CC_$ccKey=$crossCl"  | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "CXX_$ccKey=$crossCl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "AR_$ccKey=$crossLib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            $vc['LIB'] = @(
              (Join-Path $vc['VCToolsInstallDir'] "lib\${{ matrix.sdkarch }}"),
              "$kits\Lib\$sdk\ucrt\${{ matrix.sdkarch }}",
              "$kits\Lib\$sdk\um\${{ matrix.sdkarch }}"
            ) -join ';'
            $wrongLib = @($vc['LIB'] -split ';' | Where-Object { $_ -match '\\(x64|x86)(\\|$)' })
            if ($wrongLib.Count -gt 0) {
              Write-Error "Cross-target LIB contains host-architecture paths: $($wrongLib -join '; ')"; exit 1
            }
            Write-Host "Forcing cc cross compiler: CC_$ccKey=$crossCl"
            Write-Host "Cross-target LIB: $($vc['LIB'])"
          }
          # INCLUDE/LIB/etc -> GITHUB_ENV (skip Path; that goes to GITHUB_PATH).
          $before = @{}
          foreach ($l in (Get-ChildItem Env:)) { $before[$l.Name] = $l.Value }
          foreach ($k in $vc.Keys) {
            if ($k -ieq 'Path') { continue }
            if (-not $before.ContainsKey($k) -or $before[$k] -ne $vc[$k]) {
              "$k=$($vc[$k])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }
          # Prepend new dirs to PATH for later steps (preserves gh/git/node).
          foreach ($d in $newPathDirs) { $d | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }

      # Pre-create the target-triple sidecar stubs so tauri_build's externalBin/
      # resource glob validation passes on the FIRST cargo build of a cross target
      # (prepare-embed-stub.js only stubs the HOST triple). bundle-cli.js /
      # bundle-embed.js overwrite these with the real arm64/x64 binaries during
      # beforeBuildCommand, so the shipped installer carries the correct sidecars.
      - name: Pre-create cross-build sidecar stubs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri\bundled-embed | Out-Null
          New-Item -ItemType Directory -Force src-tauri\bundled-cli | Out-Null
          New-Item -ItemType File -Force "src-tauri\bundled-embed\codeterm-embed-${{ matrix.target }}.exe" | Out-Null
          New-Item -ItemType File -Force "src-tauri\bundled-cli\codeterm-${{ matrix.target }}.exe" | Out-Null

      - name: Build release bundle inputs
        shell: pwsh
        run: .\build.ps1 release-inputs

      # A dropped upload leaves a starter asset that holds the name and makes every
      # later upload of it fail opaquely, including tauri-action's own.
      - name: Build, sign, and upload release assets
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # If the signing key is encrypted, add TAURI_KEY_PASSWORD to
          # repo secrets — this evaluates to an empty string otherwise.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Without a tag name tauri-action only builds and signs, which is the dry run.
          tagName: ${{ !inputs.dry_run && steps.tag.outputs.name || '' }}
          releaseName: 'CodeTerm ${{ steps.tag.outputs.name }}'
          releaseBody: 'See the assets to download this version and install. Auto-update users will be offered this build via the configured channel.'
          releaseDraft: true
          prerelease: ${{ steps.channel.outputs.prerelease }}
          # tauri-action's own updater-JSON path silently skips when its
          # internal sig matcher cannot pair an artifact with a signature.
          # We build the fragment ourselves below.
          includeUpdaterJson: false
          updaterJsonPreferNsis: true
          args: --target ${{ env.TARGET }} --features ${{ env.CODETERM_RELEASE_FEATURES }}

      - name: Publish per-platform updater fragment
        if: ${{ !inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
          SOURCE_REPO: ${{ github.repository }}
          MANIFEST_REPO: rollacode/codeterm-releases
          PLATFORM_KEY: ${{ matrix.platform_key }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundleRoot = "src-tauri/target/$env:TARGET/release/bundle"
          Write-Host "::group::bundle directory listing"
          Get-ChildItem -Recurse -File $bundleRoot | ForEach-Object { $_.FullName } | Sort-Object | Write-Host
          Write-Host "::endgroup::"
          $sig = Get-ChildItem -Recurse -File "$bundleRoot/nsis" -Filter '*.nsis.zip.sig' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $sig) { $sig = Get-ChildItem -Recurse -File "$bundleRoot/nsis" -Filter '*-setup.exe.sig' -ErrorAction SilentlyContinue | Select-Object -First 1 }
          if (-not $sig) { Write-Error "No NSIS updater signature under $bundleRoot/nsis"; exit 1 }
          $bundle = $sig.FullName -replace '\.sig$', ''
          if (-not (Test-Path $bundle)) { Write-Error "Bundle missing next to $($sig.FullName)"; exit 1 }

          # With createUpdaterArtifacts=true, Tauri v2 reuses the NSIS .exe
          # as the updater bundle; v1Compatible builds emit .nsis.zip. The .sig
          # is NOT uploaded — the updater reads its signature from latest.json.
          gh release upload "$env:TAG" "$bundle" --clobber --repo "$env:SOURCE_REPO"

          # Fragment URL points at the public MIRROR repo (where the asset is mirrored
          # to and the updater fetches from), not the private source release.
          $ver = "$env:TAG" -replace '^v', ''
          $bname = Split-Path $bundle -Leaf
          $url = "https://github.com/$env:MANIFEST_REPO/releases/download/$env:TAG/$bname"
          $sigText = (Get-Content -Raw $sig.FullName).Trim()
          $pub = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $platforms = [ordered]@{}
          $platforms["$env:PLATFORM_KEY"] = [ordered]@{ url = $url; signature = $sigText }
          $fragment = [ordered]@{
            version   = $ver
            notes     = "See the assets to download this version and install."
            pub_date  = $pub
            platforms = $platforms
          }
          $out = "updater-$env:TARGET.json"
          $fragment | ConvertTo-Json -Depth 6 | Set-Content -Path $out -Encoding utf8
          Write-Host "Wrote $out for $env:PLATFORM_KEY -> $bname"
          gh release upload "$env:TAG" "$out" --clobber --repo "$env:SOURCE_REPO"

      # Mirror the updater bundle so the caller can publish the manifest after all builds pass.
      - name: Mirror to public release repo
        if: ${{ inputs.mirror && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_REPOS_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
          MIRROR_REPO: rollacode/codeterm-releases
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundleRoot = "src-tauri/target/$env:TARGET/release/bundle"
          $sig = Get-ChildItem -Recurse -File "$bundleRoot/nsis" -Filter '*.nsis.zip.sig' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $sig) { $sig = Get-ChildItem -Recurse -File "$bundleRoot/nsis" -Filter '*-setup.exe.sig' -ErrorAction SilentlyContinue | Select-Object -First 1 }
          if (-not $sig) { Write-Error "No NSIS updater signature under $bundleRoot/nsis"; exit 1 }
          $bundle = $sig.FullName -replace '\.sig$', ''
          if (-not (Test-Path $bundle)) { Write-Error "Bundle missing next to $($sig.FullName)"; exit 1 }

          gh release view "$env:TAG" --repo "$env:MIRROR_REPO" | Out-Null

          gh release upload "$env:TAG" "$bundle" --clobber --repo "$env:MIRROR_REPO"
