name: Hosted unsigned arm64 compilation
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      source_ref:
        required: true
        type: string
      target:
        required: true
        type: string
      frontend_sha256:
        required: false
        type: string
        default: ""
    secrets:
      DOMIOS_FIREBASE_API_KEY:
        required: true
      DOMIOS_FIREBASE_PROJECT_ID:
        required: true
      DOMIOS_FIREBASE_APP_ID:
        required: true
      DOMIOS_ACCOUNT_REDEEM_URL:
        required: true
      DOMIOS_BILLING_FUNCTIONS_URL:
        required: true
      DOMIOS_AMPLITUDE_API_KEY_PROD:
        required: true
    outputs:
      sha256:
        value: ${{ jobs.compile.outputs.sha256 }}
permissions:
  contents: read
  actions: read
jobs:
  compile:
    name: compile unsigned
    runs-on: ${{ inputs.target == 'aarch64-pc-windows-msvc' && 'windows-11-arm' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 120
    env:
      CODETERM_USE_SCCACHE: "0"
      RUSTC_WRAPPER: ""
      CODETERM_RELEASE_COMMON_STAGE: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      RUSTUP_TOOLCHAIN: 1.99.1-${{ inputs.target }}
      CARGO_BUILD_TARGET: ${{ inputs.target }}
      TARGET: ${{ inputs.target }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
      APPIMAGE_EXTRACT_AND_RUN: "1"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: "true"
      DOMIOS_FIREBASE_API_KEY: ${{ secrets.DOMIOS_FIREBASE_API_KEY }}
      DOMIOS_FIREBASE_PROJECT_ID: ${{ secrets.DOMIOS_FIREBASE_PROJECT_ID }}
      DOMIOS_FIREBASE_APP_ID: ${{ secrets.DOMIOS_FIREBASE_APP_ID }}
      DOMIOS_ACCOUNT_REDEEM_URL: ${{ secrets.DOMIOS_ACCOUNT_REDEEM_URL }}
      DOMIOS_BILLING_FUNCTIONS_URL: ${{ secrets.DOMIOS_BILLING_FUNCTIONS_URL }}
      DOMIOS_AMPLITUDE_API_KEY_PROD: ${{ secrets.DOMIOS_AMPLITUDE_API_KEY_PROD }}
    outputs:
      sha256: ${{ steps.handoff.outputs.sha256 }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          package-manager-cache: false
          node-version: 22.22.0
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Checkout pinned source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.32.1
          run_install: false
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - name: Prepare pinned toolchain
        shell: bash
        run: |-
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy,rustfmt
          rustup target add --toolchain "$RUSTUP_TOOLCHAIN" "$TARGET"
          rustc -vV
      - name: Runner preflight
        run: node scripts/ci-runner-paths.mjs node,git,bash,python,cargo,pnpm
      - name: Validate source, platform and public build configuration
        shell: bash
        run: |-
          set -euo pipefail
          [[ "$TARGET" = aarch64-unknown-linux-gnu || "$TARGET" = aarch64-pc-windows-msvc ]]
          [[ "${{ inputs.source_ref }}" =~ ^[a-f0-9]{40}$ ]]
          [ "$(git rev-parse HEAD)" = "${{ inputs.source_ref }}" ]
          for name in DOMIOS_FIREBASE_API_KEY DOMIOS_FIREBASE_PROJECT_ID DOMIOS_FIREBASE_APP_ID DOMIOS_ACCOUNT_REDEEM_URL DOMIOS_BILLING_FUNCTIONS_URL DOMIOS_AMPLITUDE_API_KEY_PROD; do
            test -n "${!name}" || { echo "::error::Missing public client configuration $name"; exit 1; }
          done
      - name: Install Linux bundle dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |-
          sudo apt-get update -qq
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev pkg-config xdg-utils patchelf libfuse2t64
      - name: Install frozen dependencies
        shell: bash
        run: pnpm install --frozen-lockfile
      - name: Download digest-pinned frontend bundle
        if: ${{ inputs.frontend_sha256 != '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: frontend-dist-${{ inputs.frontend_sha256 }}
          path: ${{ runner.temp }}
      - name: Fetch the run's frontend bundle
        if: ${{ inputs.frontend_sha256 != '' }}
        shell: bash
        run: node scripts/release-frontend-dist.mjs fetch-run-artifact "$GITHUB_RUN_ID" "${{ inputs.frontend_sha256 }}" "$RUNNER_TEMP/frontend-dist.tar"
      - name: Compile unsigned release bundles and freeze digest handoff
        id: handoff
        shell: bash
        run: node scripts/release-arm64-compile.mjs "$TARGET" "${{ inputs.source_ref }}" "${{ inputs.tag }}" "$RUNNER_TEMP/arm64-handoff.tar"
      - name: Upload immutable unsigned handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unsigned-${{ inputs.target }}-${{ steps.handoff.outputs.sha256 }}
          path: ${{ runner.temp }}/arm64-handoff.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true
      - uses: ./.github/actions/rust-warnings
        if: always()
        continue-on-error: true
        with:
          complete: ${{ job.status == 'success' }}
          platform: hosted-arm64
          target: ${{ inputs.target }}
      - name: Upload spooled warning evidence
        if: always()
        uses: ./.github/actions/ci-artifact-spool
