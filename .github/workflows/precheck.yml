name: Cross-platform compile precheck
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version X.Y.Z to precheck (a vX.Y.Z tag must exist)
        required: true
permissions:
  contents: read
concurrency:
  group: precheck-${{ github.ref }}
  cancel-in-progress: false
jobs:
  precheck:
    if: ${{ (github.repository_owner == 'rollacode' || github.repository_owner == 'domios-dev') && github.actor == 'rollacode' && github.event_name != 'pull_request' && github.event_name != 'pull_request_target' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            runner: ${{ vars.CI_LINUX_ARM64_RUNNER || '"ubuntu-24.04-arm"' }}
          - target: x86_64-unknown-linux-gnu
            runner: ${{ vars.CI_LINUX_LIGHT_RUNNER || '"ubuntu-24.04"' }}
          - target: aarch64-apple-darwin
            runner: ${{ vars.RELEASE_MACOS_ARM64_RUNNER || '"macos-15"' }}
          - target: x86_64-apple-darwin
            runner: ${{ vars.RELEASE_MACOS_X64_RUNNER || '"macos-15-intel"' }}
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 30
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - name: Select runner environment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          CI_HOSTED: ${{ runner.environment == 'github-hosted' }}
          SCCACHE_GHA_ENABLED: ${{ runner.environment == 'github-hosted' && 'true' || 'false' }}
          CODETERM_SCCACHE_VERIFY_ONLY: ${{ runner.environment == 'github-hosted' && '0' || '1' }}
        with:
          script: |
            // Runner context is available after allocation, not in job-level env.
            for (const key of ["CI_HOSTED", "SCCACHE_GHA_ENABLED", "CODETERM_SCCACHE_VERIFY_ONLY"]) {
              core.exportVariable(key, process.env[key]);
            }
      - name: Validate version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: '[[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: v${{ inputs.version }}
          fetch-depth: 1
      - name: Hosted Node
        if: runner.environment == 'github-hosted'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.22.0
          package-manager-cache: false
      - name: Hosted pnpm
        if: runner.environment == 'github-hosted'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          version: 10.32.1
          run_install: false
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - name: Hosted pinned Rust toolchain
        if: runner.environment == 'github-hosted'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.1
          components: clippy,rustfmt
          targets: ${{ matrix.target }}
      - name: Hosted sccache
        if: runner.environment == 'github-hosted'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
      - name: Select hosted cache policy
        if: runner.environment == 'github-hosted'
        shell: bash
        run: |
          echo CI_HOSTED=true >> "$GITHUB_ENV"
          echo SCCACHE_GHA_ENABLED=true >> "$GITHUB_ENV"
          echo CODETERM_SCCACHE_VERIFY_ONLY=0 >> "$GITHUB_ENV"
      - name: Hosted Linux native dependencies
        if: runner.environment == 'github-hosted' && runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get -o Acquire::Retries=3 install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev pkg-config xdg-utils patchelf libfuse2t64
      - name: Prepare compile fixtures
        run: node scripts/ci-rust-prepare.mjs
      - name: Check native target
        shell: bash
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked --target "$CARGO_BUILD_TARGET"
