name: Cross-platform compile precheck (self-hosted)

# Fast `cargo check` for linux (arm64+x86_64) and macOS (arm64+x86_64) on the
# build machine. Used to validate the precheck script before it gates releases,
# and runnable on demand. Windows is build-time only (VM-boot-bound).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "version X.Y.Z to precheck (a vX.Y.Z tag must exist)"
        required: true
        default: "1.5.2"

permissions:
  contents: read

concurrency:
  group: precheck-${{ github.ref }}
  cancel-in-progress: false

env:
  CODETERM_SCCACHE_VERIFY_ONLY: '1'

jobs:
  precheck:
    if: ${{ (github.repository_owner == 'rollacode' || github.repository_owner == 'domios-dev') && github.actor == 'rollacode' && github.event_name != 'pull_request' && github.event_name != 'pull_request_target' }}
    runs-on: [self-hosted, codeterm-builder]
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          package-manager-cache: false
          node-version: 22.22.0
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}

      - name: Ensure Docker is running
        run: |
          docker info >/dev/null
          docker image inspect codeterm-build-linux-arm64 >/dev/null

      - name: Cross-platform compile precheck
        env:
          VERSION: ${{ inputs.version }}
        run: |
          TAG="v$VERSION"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch --no-tags --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG"
          .codeterm/build-machine/scripts/precheck.sh "$TAG"
