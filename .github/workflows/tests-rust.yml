        shell: bash
        run: bash build.sh ci-tests ${{ matrix.suite }} compile
      - name: Run ${{ matrix.suite }} Rust tests (Unix)
        id: ci-10
        if: runner.os != 'Windows'
        env:
          CI_RELEASE_TESTS: ${{ inputs.source_ref != '' }}
          RUST_WARNING_LOG: ci-rust-warnings.log
        shell: bash
        run: bash build.sh ci-tests ${{ matrix.suite }}
      - name: Compile ${{ matrix.suite }} Rust tests (Windows)
        if: runner.os == 'Windows'
        env:
          CI_RELEASE_TESTS: ${{ inputs.source_ref != '' }}
          RUST_WARNING_LOG: ci-rust-warnings.log
        shell: pwsh
        run: |
          & .\build.ps1 ci-tests ${{ matrix.suite }} compile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run ${{ matrix.suite }} Rust tests (Windows)
        id: ci-11
        if: runner.os == 'Windows'
        env:
          CI_RELEASE_TESTS: ${{ inputs.source_ref != '' }}
          RUST_WARNING_LOG: ci-rust-warnings.log
        shell: pwsh
        run: |
          & .\build.ps1 ci-tests ${{ matrix.suite }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify NSIS hooks in Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: pwsh
        run: node --test scripts/tests/installer-preflight.test.mjs
      - name: Shared compile cache statistics (Windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          & .\build.ps1 cache-stats
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Shared compile cache statistics (Unix)
        if: always() && runner.os != 'Windows'
        shell: bash
        run: bash build.sh cache-stats
      - name: Stop this job's local compile cache
        if: always()
        shell: bash
        run: bash build.sh cache-release
      - name: Store Rust test receipts
        if: always()
        continue-on-error: ${{ inputs.artifacts_optional }}
        shell: bash
        run: |
          node scripts/ci-rust-receipt-artifact.mjs
      - uses: ./.github/actions/rust-warnings
        if: always()
        continue-on-error: true
        with:
          complete: ${{ job.status == 'success' }}
          platform: tests-${{ matrix.suite }}-${{ runner.os }}
          target: ${{ steps.target.outputs.triple }}
      - name: Upload artifacts spooled while the private store was unreachable
        if: always()
        uses: ./.github/actions/ci-artifact-spool
      - name: Clean compile fixtures
        if: always()
        run: node scripts/ci-rust-prepare.mjs cleanup
      - name: Remove job archives and sweep old Rust targets
        if: always()
        continue-on-error: true
        run: node scripts/ci-workspace-cleanup.mjs

  rust-embeddings:
    name: rust embeddings
    needs: rust-platform
    if: ${{ (github.repository_owner == 'rollacode' || github.repository_owner == 'domios-dev') && github.actor == 'rollacode' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release/')) && (!cancelled() && fromJSON(inputs.resolved_scope).heavy == 'true') }}
    runs-on: ${{ vars.CI_MACOS_EMBEDDINGS_RUNNER || 'macos-15' }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
    timeout-minutes: 45
    strategy:
      matrix:
        suite: [embeddings]
    env:
      DOMIOS_CI_WEBHOOK_URL: ${{ !((vars.CI_MACOS_EMBEDDINGS_RUNNER || 'macos-15') == 'macos-15') && secrets.DOMIOS_CI_WEBHOOK_URL || '' }}
      DOMIOS_CI_WEBHOOK_TOKEN: ${{ !((vars.CI_MACOS_EMBEDDINGS_RUNNER || 'macos-15') == 'macos-15') && secrets.DOMIOS_CI_WEBHOOK_TOKEN || '' }}
      # GitHub withholds secrets from fork pull requests; our hosted jobs use the private store over its public edge.
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
      CI_STORE_LAN_ENDPOINT: ${{ secrets.CI_STORE_LAN_ENDPOINT }}
      CI_STORE_PUBLIC_ENDPOINT: ${{ secrets.CI_STORE_PUBLIC_ENDPOINT }}
      DOMIOS_FIREBASE_API_KEY: ${{ !((vars.CI_MACOS_EMBEDDINGS_RUNNER || 'macos-15') == 'macos-15') && secrets.DOMIOS_FIREBASE_API_KEY || '' }}
      DOMIOS_FIREBASE_PROJECT_ID: ${{ !((vars.CI_MACOS_EMBEDDINGS_RUNNER || 'macos-15') == 'macos-15') && secrets.DOMIOS_FIREBASE_PROJECT_ID || '' }}
      DOMIOS_FIREBASE_APP_ID: ${{ !((vars.CI_MACOS_EMBEDDINGS_RUNNER || 'macos-15') == 'macos-15') && secrets.DOMIOS_FIREBASE_APP_ID || '' }}
      DOMIOS_ACCOUNT_REDEEM_URL: ${{ !((vars.CI_MACOS_EMBEDDINGS_RUNNER || 'macos-15') == 'macos-15') && secrets.DOMIOS_ACCOUNT_REDEEM_URL || '' }}
      DOMIOS_BILLING_FUNCTIONS_URL: ${{ !((vars.CI_MACOS_EMBEDDINGS_RUNNER || 'macos-15') == 'macos-15') && secrets.DOMIOS_BILLING_FUNCTIONS_URL || '' }}
      # Warm per-workspace targets outside the checkout; the cleanup step sweeps them by age.
      CI_TARGET_ROOT: ${{ github.workspace }}/../ci-targets/tests
      CODETERM_ALLOW_EXTERNAL_TARGET: '1'
      CI_HOSTED: ${{ (vars.CI_MACOS_EMBEDDINGS_RUNNER || 'macos-15') == 'macos-15' }}
      SCCACHE_GHA_ENABLED: ${{ ((vars.CI_MACOS_EMBEDDINGS_RUNNER || 'macos-15') == 'macos-15') && 'true' || 'false' }}
      CODETERM_SCCACHE_VERIFY_ONLY: ${{ ((vars.CI_MACOS_EMBEDDINGS_RUNNER || 'macos-15') == 'macos-15') && '0' || '1' }}
      CODETERM_SCCACHE_CREDENTIAL_SOURCE: runner
      CI_ARTIFACT_STORAGE: ${{ ((vars.CI_MACOS_EMBEDDINGS_RUNNER || 'macos-15') == 'macos-15') && 'github' || '' }}
    steps:
      - name: Use the runner bundled Node
        if: runner.environment == 'self-hosted'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |-
            const path = require('node:path');
            core.addPath(path.dirname(process.execPath));
            core.info('Using runner Node ' + process.version);
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        id: ci-2
        with:
          package-manager-cache: false
          node-version: 22.22.0
        if: runner.environment == 'github-hosted'
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
        if: runner.environment == 'github-hosted'
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        id: ci-1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 1
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.longpaths
          GIT_CONFIG_VALUE_0: "true"
      - name: Discover installed runner tools
        if: runner.environment == 'self-hosted'
        run: node scripts/ci-runner-paths.mjs --paths-only
      - name: Fetch scoped baseline history
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-git-history.mjs baseline
      - name: Test builds link the system OpenSSL
        # Release builds keep the vendored OpenSSL; tests skip compiling it from source.
        if: runner.environment == 'github-hosted' && runner.os == 'Linux'
        shell: bash
        run: echo OPENSSL_NO_VENDOR=1 >> "$GITHUB_ENV"
      - name: Fast APT mirror
        # Pinned commit of release 1.4.5; apt still verifies every package signature. country skips its geo lookup.
        if: runner.environment == 'github-hosted' && runner.os == 'Linux'
        uses: vegardit/fast-apt-mirror.sh@806c59276adfff2df420124ad5e4587f018c358a # 1.4.5
        with:
          country: US
      - name: Hosted Linux build prerequisites
        if: runner.environment == 'github-hosted' && runner.os == 'Linux'
        shell: bash
        run: |-
          # The workspace test build needs more disk than a hosted image leaves free.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get -o Acquire::Retries=3 install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev pkg-config xdg-utils patchelf
      - name: Hosted Rust dependency cache
        if: ${{ (vars.CI_MACOS_EMBEDDINGS_RUNNER || 'macos-15') == 'macos-15' }}
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |-
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ format('cargo-{0}-{1}-{2}', runner.os, runner.arch, hashFiles('**/Cargo.lock')) }}
          restore-keys: ${{ format('cargo-{0}-{1}-', runner.os, runner.arch) }}
      - name: Hosted sccache
        if: runner.environment == 'github-hosted' && ((vars.CI_MACOS_EMBEDDINGS_RUNNER || 'macos-15') == 'macos-15')
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        env:
          SCCACHE_GHA_ENABLED: "true"
      - name: Prepare compile fixtures
        id: ci-7
        run: node scripts/ci-rust-prepare.mjs
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        id: ci-4
        with:
          toolchain: 1.99.1
          components: clippy,rustfmt
        if: runner.environment == 'github-hosted'
      - name: Install pinned nextest prerequisite
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91
        with:
          tool: cargo-nextest@0.9.148
        if: runner.environment == 'github-hosted'
      - name: Runner preflight
        run: node scripts/ci-runner-paths.mjs bash,cargo,curl,git,nextest,node,python
      - name: Reset compiler capture
        id: ci-8
        continue-on-error: true
        run: node -e "require('fs').writeFileSync('ci-rust-warnings.log', '')"
      - id: target
        name: Rust target of this runner
        shell: bash
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            macOS-ARM64) triple=aarch64-apple-darwin ;;
            macOS-X64) triple=x86_64-apple-darwin ;;
            Linux-ARM64) triple=aarch64-unknown-linux-gnu ;;
            Linux-X64) triple=x86_64-unknown-linux-gnu ;;
            Windows-ARM64) triple=aarch64-pc-windows-msvc ;;
            Windows-X64) triple=x86_64-pc-windows-msvc ;;
            *) echo "::error::unsupported runner $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
          esac
          echo "triple=$triple" >> "$GITHUB_OUTPUT"
          echo "warnings=rust-warnings-tests-${{ matrix.suite }}-$RUNNER_OS-$triple" >> "$GITHUB_OUTPUT"
      - name: Link macOS test binaries without compact unwind
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # The large native test binaries exceed Mach-O compact-unwind offsets; release binaries keep compact unwind.
          # Both the compile and the run step read these flags from GITHUB_ENV, so the run never recompiles.
          {
            echo "CARGO_TARGET_AARCH64_APPLE_DARWIN_RUSTFLAGS=${CARGO_TARGET_AARCH64_APPLE_DARWIN_RUSTFLAGS:+$CARGO_TARGET_AARCH64_APPLE_DARWIN_RUSTFLAGS }-C link-arg=-Wl,-no_compact_unwind"
            echo "CARGO_TARGET_X86_64_APPLE_DARWIN_RUSTFLAGS=${CARGO_TARGET_X86_64_APPLE_DARWIN_RUSTFLAGS:+$CARGO_TARGET_X86_64_APPLE_DARWIN_RUSTFLAGS }-C link-arg=-Wl,-no_compact_unwind"
          } >> "$GITHUB_ENV"
      - name: Compile ${{ matrix.suite }} Rust tests (Unix)
        if: runner.os != 'Windows'
        env:
          CI_RELEASE_TESTS: ${{ inputs.source_ref != '' }}
          RUST_WARNING_LOG: ci-rust-warnings.log
        shell: bash
        run: bash build.sh ci-tests ${{ matrix.suite }} compile
      - name: Run ${{ matrix.suite }} Rust tests (Unix)
        id: ci-10
        if: runner.os != 'Windows'
        env:
          CI_RELEASE_TESTS: ${{ inputs.source_ref != '' }}
          RUST_WARNING_LOG: ci-rust-warnings.log
        shell: bash
        run: bash build.sh ci-tests ${{ matrix.suite }}
      - name: Compile ${{ matrix.suite }} Rust tests (Windows)
        if: runner.os == 'Windows'
        env:
          CI_RELEASE_TESTS: ${{ inputs.source_ref != '' }}
          RUST_WARNING_LOG: ci-rust-warnings.log
        shell: pwsh
        run: |
          & .\build.ps1 ci-tests ${{ matrix.suite }} compile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run ${{ matrix.suite }} Rust tests (Windows)
        id: ci-11
        if: runner.os == 'Windows'
        env:
          CI_RELEASE_TESTS: ${{ inputs.source_ref != '' }}
          RUST_WARNING_LOG: ci-rust-warnings.log
        shell: pwsh
        run: |
          & .\build.ps1 ci-tests ${{ matrix.suite }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Shared compile cache statistics (Windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          & .\build.ps1 cache-stats
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Shared compile cache statistics (Unix)
        if: always() && runner.os != 'Windows'
        shell: bash
        run: bash build.sh cache-stats
      - name: Stop this job's local compile cache
        if: always()
        shell: bash
        run: bash build.sh cache-release
      - name: Store Rust test receipts
        if: always()
        continue-on-error: ${{ inputs.artifacts_optional }}
        shell: bash
        run: |
          node scripts/ci-rust-receipt-artifact.mjs
      - uses: ./.github/actions/rust-warnings
        if: always()
        continue-on-error: true
        with:
          complete: ${{ job.status == 'success' }}
          platform: tests-${{ matrix.suite }}-${{ runner.os }}
          target: ${{ steps.target.outputs.triple }}
      - name: Upload artifacts spooled while the private store was unreachable
        if: always()
        uses: ./.github/actions/ci-artifact-spool
      - name: Clean compile fixtures
        if: always()
        run: node scripts/ci-rust-prepare.mjs cleanup
      - name: Remove job archives and sweep old Rust targets
        if: always()
        continue-on-error: true
        run: node scripts/ci-workspace-cleanup.mjs

  # CLI contracts (transport rows, help text, generated manifest, essence map) fail in minutes here, not in the Rust tier.
  rust-receipts:
    name: rust test receipts
    needs: [rust-tests, rust-platform, rust-embeddings]
    if: ${{ (github.repository_owner == 'rollacode' || github.repository_owner == 'domios-dev') && github.actor == 'rollacode' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release/')) && (!cancelled() && fromJSON(inputs.resolved_scope).heavy == 'true') }}
    runs-on: ${{ vars.CI_LINUX_LIGHT_RUNNER || 'ubuntu-24.04' }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
    timeout-minutes: 5
    env:
      DOMIOS_CI_WEBHOOK_URL: ${{ !((vars.CI_LINUX_LIGHT_RUNNER || 'ubuntu-24.04') == 'ubuntu-24.04') && secrets.DOMIOS_CI_WEBHOOK_URL || '' }}
      DOMIOS_CI_WEBHOOK_TOKEN: ${{ !((vars.CI_LINUX_LIGHT_RUNNER || 'ubuntu-24.04') == 'ubuntu-24.04') && secrets.DOMIOS_CI_WEBHOOK_TOKEN || '' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
      CI_STORE_LAN_ENDPOINT: ${{ secrets.CI_STORE_LAN_ENDPOINT }}
      CI_STORE_PUBLIC_ENDPOINT: ${{ secrets.CI_STORE_PUBLIC_ENDPOINT }}
      DOMIOS_FIREBASE_API_KEY: ${{ !((vars.CI_LINUX_LIGHT_RUNNER || 'ubuntu-24.04') == 'ubuntu-24.04') && secrets.DOMIOS_FIREBASE_API_KEY || '' }}
      DOMIOS_FIREBASE_PROJECT_ID: ${{ !((vars.CI_LINUX_LIGHT_RUNNER || 'ubuntu-24.04') == 'ubuntu-24.04') && secrets.DOMIOS_FIREBASE_PROJECT_ID || '' }}
      DOMIOS_FIREBASE_APP_ID: ${{ !((vars.CI_LINUX_LIGHT_RUNNER || 'ubuntu-24.04') == 'ubuntu-24.04') && secrets.DOMIOS_FIREBASE_APP_ID || '' }}
      DOMIOS_ACCOUNT_REDEEM_URL: ${{ !((vars.CI_LINUX_LIGHT_RUNNER || 'ubuntu-24.04') == 'ubuntu-24.04') && secrets.DOMIOS_ACCOUNT_REDEEM_URL || '' }}
      DOMIOS_BILLING_FUNCTIONS_URL: ${{ !((vars.CI_LINUX_LIGHT_RUNNER || 'ubuntu-24.04') == 'ubuntu-24.04') && secrets.DOMIOS_BILLING_FUNCTIONS_URL || '' }}
      CI_HOSTED: ${{ (vars.CI_LINUX_LIGHT_RUNNER || 'ubuntu-24.04') == 'ubuntu-24.04' }}
      CI_ARTIFACT_STORAGE: ''
    steps:
      - name: Use the runner bundled Node
        if: runner.environment == 'self-hosted'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |-
            const path = require('node:path');
            core.addPath(path.dirname(process.execPath));
            core.info('Using runner Node ' + process.version);
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        id: ci-2
        with:
          package-manager-cache: false
          node-version: 22.22.0
        if: runner.environment == 'github-hosted'
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        id: ci-1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 1
      - name: Discover installed runner tools
        if: runner.environment == 'self-hosted'
        run: node scripts/ci-runner-paths.mjs --paths-only
      - name: Runner preflight
        run: node scripts/ci-runner-paths.mjs bash,curl,git,node
      - name: Fetch fallback run artifact evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: ci-artifact-spool-*
          path: ${{ runner.temp }}/ci-artifact-fallback/${{ github.run_id }}
      - name: Fetch Rust test receipts
        id: ci-3
        continue-on-error: ${{ inputs.artifacts_optional }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-artifact.sh get-prefix "$GITHUB_RUN_ID/rust-receipt/" ci-rust-receipts
      - name: Require every Rust test job
        id: ci-4
        env:
          TESTS_RESULT: ${{ needs.rust-tests.result }}
          PLATFORM_RESULT: ${{ needs.rust-platform.result }}
          EMBEDDINGS_RESULT: ${{ needs.rust-embeddings.result }}
        run: node -e "if (process.env.TESTS_RESULT !== 'success' || process.env.PLATFORM_RESULT !== 'success' || process.env.EMBEDDINGS_RESULT !== 'success') process.exit(1)"
      - name: One passing Linux full suite, native subsets and embeddings
        id: ci-5
        continue-on-error: ${{ inputs.artifacts_optional }}
        run: node scripts/ci-rust-tests.mjs verify ci-rust-receipts
