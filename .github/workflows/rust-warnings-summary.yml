name: Rust warning summary
on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
      report_name:
        required: true
        type: string
      artifacts:
        required: true
        type: string
      comment:
        required: false
        default: false
        type: boolean
permissions:
  contents: read
  actions: read
  pull-requests: write
jobs:
  report:
    permissions:
      contents: read
      actions: write
      pull-requests: write
    if: ${{ (github.repository_owner == 'rollacode' || github.repository_owner == 'domios-dev') && github.actor == 'rollacode' && github.event_name != 'pull_request' && github.event_name != 'pull_request_target' }}
    environment: ${{ (startsWith(github.ref, 'refs/heads/release/') || (github.event_name == 'workflow_run' && startsWith(github.event.workflow_run.head_branch, 'release/'))) && 'release' || 'ci' }}
    runs-on: [self-hosted, Linux, light, host-ubunta]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          package-manager-cache: false
          node-version: '22.22.0'
      - name: Fetch warning collections
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-artifact.sh get-prefix "$GITHUB_RUN_ID/rust-warnings/" ci-rust-warnings
      - name: Merge warnings and enforce ratchet
        env:
          WARNING_ARTIFACTS: ${{ inputs.artifacts }}
          WARNING_SEED: ${{ inputs.comment }}
        run: node scripts/rust-warnings-report.mjs ci-rust-warnings
      - name: Store warning report
        if: always()
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
          WARNING_REPORT_NAME: ${{ inputs.report_name }}
        run: |
          for file in rust-warnings-report/*; do
            [ -f "$file" ] || continue
            bash scripts/ci-artifact.sh put "$GITHUB_RUN_ID/$WARNING_REPORT_NAME/${file##*/}" "$file"
          done
      - name: Upload artifacts spooled while the private store was unreachable
        if: always()
        uses: ./.github/actions/ci-artifact-spool
      - name: Comment on associated release PR
        if: ${{ always() && inputs.comment }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          WARNING_SOURCE_SHA: ${{ inputs.source_ref }}
        run: node scripts/rust-warnings-comment.mjs rust-warnings-report/rust-warnings-report.md
