name: Rust warning summary
on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
      report_name:
        required: true
        type: string
      artifacts:
        required: true
        type: string
      comment:
        required: false
        default: false
        type: boolean
permissions:
  contents: read
  actions: read
  pull-requests: write
jobs:
  report:
    permissions:
      contents: read
      actions: read
      pull-requests: read
    if: ${{ (github.repository_owner == 'rollacode' || github.repository_owner == 'domios-dev') && github.actor == 'rollacode' && github.event_name != 'pull_request' && github.event_name != 'pull_request_target' }}
    environment: ${{ !(github.workflow == 'CI' && vars.CI_LINUX_LIGHT_RUNNER == 'ubuntu-24.04') && ((startsWith(github.ref, 'refs/heads/release/') || (github.event_name == 'workflow_run' && startsWith(github.event.workflow_run.head_branch, 'release/'))) && 'release' || 'ci') || '' }}
    runs-on: ${{ github.workflow == 'CI' && vars.CI_LINUX_LIGHT_RUNNER || fromJSON('["self-hosted","Linux","light","host-ubunta"]') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          package-manager-cache: false
          node-version: '22.22.0'
      - name: Runner preflight
        run: node scripts/ci-runner-paths.mjs receipt
      - name: Fetch warning collections
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ !(github.workflow == 'CI' && vars.CI_LINUX_LIGHT_RUNNER == 'ubuntu-24.04') && secrets.SCCACHE_AWS_ACCESS_KEY_ID || '' }}
          AWS_SECRET_ACCESS_KEY: ${{ !(github.workflow == 'CI' && vars.CI_LINUX_LIGHT_RUNNER == 'ubuntu-24.04') && secrets.SCCACHE_AWS_SECRET_ACCESS_KEY || '' }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-artifact.sh get-prefix "$GITHUB_RUN_ID/rust-warnings/" ci-rust-warnings
      - name: Fetch hosted warning evidence
        if: ${{ github.workflow == 'CI' && inputs.artifacts != '[]' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: hosted-rust-warnings-*
          merge-multiple: true
          path: ci-rust-warnings
      - name: Merge warnings and enforce ratchet
        env:
          WARNING_ARTIFACTS: ${{ inputs.artifacts }}
          WARNING_SEED: ${{ inputs.comment }}
        run: node scripts/rust-warnings-report.mjs ci-rust-warnings
      - name: Store warning report
        if: always()
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ !(github.workflow == 'CI' && vars.CI_LINUX_LIGHT_RUNNER == 'ubuntu-24.04') && secrets.SCCACHE_AWS_ACCESS_KEY_ID || '' }}
          AWS_SECRET_ACCESS_KEY: ${{ !(github.workflow == 'CI' && vars.CI_LINUX_LIGHT_RUNNER == 'ubuntu-24.04') && secrets.SCCACHE_AWS_SECRET_ACCESS_KEY || '' }}
          WARNING_REPORT_NAME: ${{ inputs.report_name }}
        run: |
          for file in rust-warnings-report/*; do
            [ -f "$file" ] || continue
            bash scripts/ci-artifact.sh put "$GITHUB_RUN_ID/$WARNING_REPORT_NAME/${file##*/}" "$file"
          done
      - name: Upload artifacts spooled while the private store was unreachable
        if: always()
        uses: ./.github/actions/ci-artifact-spool
      - name: Comment on associated release PR
        if: ${{ always() && inputs.comment }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          WARNING_SOURCE_SHA: ${{ inputs.source_ref }}
        run: node scripts/rust-warnings-comment.mjs rust-warnings-report/rust-warnings-report.md
    env:
      CI_HOSTED: ${{ github.workflow == 'CI' && vars.CI_LINUX_LIGHT_RUNNER == 'ubuntu-24.04' }}
      CI_ARTIFACT_STORAGE: ${{ (github.workflow == 'CI' && vars.CI_LINUX_LIGHT_RUNNER == 'ubuntu-24.04') && 'github' || '' }}
