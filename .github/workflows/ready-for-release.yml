name: Mark develop issues ready-for-release

# Anything that lands on develop is "ready for release". Tag the referenced
# issues with `ready-for-release` (kept open); the release workflow closes them
# on publish. Runs on the self-hosted runner (same as the rest of our CI).
on:
  push:
    branches: [develop]

jobs:
  label:
    runs-on: [self-hosted, codeterm-builder]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Label referenced issues
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
        run: |
          RANGE="${{ github.event.before }}..${{ github.event.after }}"
          # New branch / unknown base → just scan the tip commit.
          git rev-parse "${{ github.event.before }}^{commit}" >/dev/null 2>&1 \
            || RANGE="${{ github.event.after }}~1..${{ github.event.after }}"
          nums=$(git log "$RANGE" --pretty=%B 2>/dev/null | grep -oE '#[0-9]+' | tr -d '#' | sort -u)
          for n in $nums; do
            state=$(gh issue view "$n" -R "$GITHUB_REPOSITORY" --json state -q .state 2>/dev/null || echo MISSING)
            if [ "$state" = "OPEN" ]; then
              gh issue edit "$n" -R "$GITHUB_REPOSITORY" --add-label ready-for-release && echo "labeled #$n"
            else
              echo "skip #$n ($state)"
            fi
          done
          [ -n "$nums" ] || echo "no issue refs in $RANGE"
