name: Validate public issue metadata

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: [self-hosted, codeterm-builder]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse and verify public issues
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          python scripts/release_issue_contract.py parse \
            --body-file "$RUNNER_TEMP/pr-body.md" > "$RUNNER_TEMP/public-issues.txt"

          {
            echo "## Public issue contract"
            if [ -s "$RUNNER_TEMP/public-issues.txt" ]; then
              while IFS= read -r reference; do
                number="${reference##*#}"
                gh issue view "$number" \
                  --repo rollacode/codeterm-releases \
                  --json number,state,title >/dev/null
                echo "- $reference"
              done < "$RUNNER_TEMP/public-issues.txt"
            else
              echo "No public issues declared."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
