name: Release macOS

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      source_ref:
        required: true
        type: string
      mirror:
        required: true
        type: boolean
      dry_run:
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  DOMIOS_FIREBASE_API_KEY: ${{ secrets.DOMIOS_FIREBASE_API_KEY }}
  DOMIOS_FIREBASE_PROJECT_ID: ${{ secrets.DOMIOS_FIREBASE_PROJECT_ID }}
  DOMIOS_FIREBASE_APP_ID: ${{ secrets.DOMIOS_FIREBASE_APP_ID }}
  DOMIOS_ACCOUNT_REDEEM_URL: ${{ secrets.DOMIOS_ACCOUNT_REDEEM_URL }}
  DOMIOS_BILLING_FUNCTIONS_URL: ${{ secrets.DOMIOS_BILLING_FUNCTIONS_URL }}
  DOMIOS_AMPLITUDE_API_KEY_TEST: ${{ secrets.DOMIOS_AMPLITUDE_API_KEY_TEST }}
  DOMIOS_AMPLITUDE_API_KEY_PROD: ${{ secrets.DOMIOS_AMPLITUDE_API_KEY_PROD }}

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: [self-hosted, "${{ matrix.runner_label }}"]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            artifact_arch: aarch64
            runner_label: ${{ vars.RELEASE_MACOS_ARM64_LABEL || 'codeterm-builder' }}
          - arch: x86_64
            artifact_arch: x64
            runner_label: ${{ vars.RELEASE_MACOS_X64_LABEL || 'codeterm-builder' }}
    env:
      GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
      CODETERM_SCCACHE_VERIFY_ONLY: '1'
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
      CODETERM_RELEASE_FEATURES: embeddings
      CARGO_INCREMENTAL: '0'
      ART: ${{ github.workspace }}/release-artifacts/macos-${{ matrix.arch }}
      ASSET_SCOPE: ${{ matrix.artifact_arch == 'aarch64' && 'darwin-aarch64' || 'darwin-x86_64' }}
    steps:
      - name: Parse + validate version
        id: ver
        run: |
          TAG="${{ inputs.tag }}"
          RAW="${TAG#v}"
          echo "raw=$RAW"
          if ! echo "$RAW" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag must be vX.Y.Z (got '$TAG')"; exit 1
          fi
          echo "ver=$RAW"   >> "$GITHUB_OUTPUT"
          echo "tag=v$RAW"  >> "$GITHUB_OUTPUT"

      - name: Checkout repo (full history + tags)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          package-manager-cache: false
          node-version: '22.22.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.32.1
          run_install: false

      - name: Clear incomplete release uploads for retry
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          MIRROR_TOKEN: ${{ secrets.PACKAGE_REPOS_TOKEN }}
          PUBLISH_MIRROR: ${{ inputs.mirror }}
          TAG: ${{ inputs.tag }}
          SOURCE_REPO: ${{ github.repository }}
        run: |
          node scripts/release-clear-wedged-assets.mjs "$SOURCE_REPO" "$TAG" "$ASSET_SCOPE"
          if [ "$PUBLISH_MIRROR" = true ]; then
            GH_TOKEN="$MIRROR_TOKEN" node scripts/release-clear-wedged-assets.mjs rollacode/codeterm-releases "$TAG" "$ASSET_SCOPE"
          fi

      - name: Import temporary release signing material
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: python3 scripts/release-signing-material.py macos

      - name: Preflight macOS signing and notarization
        run: bash scripts/check-release-credentials-mac.sh

      - name: Frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Build signed and notarized macOS bundle
        run: |
          rm -rf "$ART"
          mkdir -p "$ART"
          .agents/skills/github-release/scripts/mac-bundle.sh "${{ steps.ver.outputs.ver }}" "${{ matrix.arch }}" "$ART"
          if [ "${{ matrix.arch }}" = arm64 ]; then root=src-tauri/target/release; else root=src-tauri/target/x86_64-apple-darwin/release; fi
          cp "$root/bundle/dmg/CodeTerm_${{ steps.ver.outputs.ver }}_${{ matrix.artifact_arch }}.dmg" "$ART/"

      - name: Smoke built release bundle
        run: node scripts/release-bundle-smoke.mjs macos "$ART" "${{ inputs.source_ref }}"

      - name: Verify updater signatures (including dry run)
        env:
          RELEASE_VERIFY_ONLY: 'true'
        run: node scripts/release-publish-platform.mjs "${{ inputs.tag }}" "$ASSET_SCOPE" "$ART"

      - name: Verify and publish platform assets and updater fragment
        if: ${{ !inputs.dry_run }}
        env:
          PUBLISH_PUBLIC_MIRROR: ${{ inputs.mirror }}
          MIRROR_TOKEN: ${{ secrets.PACKAGE_REPOS_TOKEN }}
        run: node scripts/release-publish-platform.mjs "${{ inputs.tag }}" "$ASSET_SCOPE" "$ART"

      - name: Clean up temporary release signing material
        if: always()
        run: python3 scripts/release-signing-material.py cleanup

