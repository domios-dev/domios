name: plugin-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing plugin tag on the reviewed master merge commit
        type: string
        required: true

concurrency:
  group: plugin-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: validate and publish plugin
    if: ${{ (github.repository_owner == 'rollacode' || github.repository_owner == 'domios-dev') && github.actor == 'rollacode' && github.triggering_actor == 'rollacode' && github.ref == 'refs/heads/master' && github.event_name == 'workflow_dispatch' }}
    environment: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          package-manager-cache: false
          node-version: 22.22.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
      - name: Fetch master and develop for ancestry verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-git-history.mjs promote
      - name: Require the exact tagged master SHA integrated into develop
        env:
          PLUGIN_TAG: ${{ inputs.tag }}
        run: |
          [[ "$PLUGIN_TAG" =~ ^plugin-[a-z0-9-]+-v[0-9] ]]
          git fetch --no-tags origin "refs/tags/$PLUGIN_TAG:refs/tags/$PLUGIN_TAG"
          test "$(git rev-parse "$PLUGIN_TAG^{commit}")" = "$GITHUB_SHA"
          test "$(git rev-parse origin/master)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/develop
      - name: Validate release metadata
        env:
          PLUGIN_TAG: ${{ inputs.tag }}
        run: |
          node scripts/release-plugin.mjs check "$PLUGIN_TAG" > plugin-release.json
      - name: Archive plugin
        env:
          PLUGIN_TAG: ${{ inputs.tag }}
        run: |
          node scripts/release-plugin.mjs archive "$PLUGIN_TAG" "$GITHUB_SHA" "$PLUGIN_TAG.tar.gz"
          shasum -a 256 "$PLUGIN_TAG.tar.gz" > "$PLUGIN_TAG.tar.gz.sha256"
      - name: Publish plugin release
        env:
          GH_TOKEN: ${{ github.token }}
          PLUGIN_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$PLUGIN_TAG" "$PLUGIN_TAG.tar.gz" "$PLUGIN_TAG.tar.gz.sha256" \
            --verify-tag --latest=false --title "$PLUGIN_TAG" \
            --notes-file plugin-release.json
  # Every install reads codeterm-core from these public assets.
  publish_core_channel:
    name: publish public codeterm-core channel
    needs: publish
    if: ${{ (github.repository_owner == 'rollacode' || github.repository_owner == 'domios-dev') && github.actor == 'rollacode' && github.triggering_actor == 'rollacode' && github.ref == 'refs/heads/master' && github.event_name == 'workflow_dispatch' }}
    environment: release
    runs-on: ubuntu-24.04
    concurrency:
      group: codeterm-core-channel-publication
      cancel-in-progress: false
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          package-manager-cache: false
          node-version: 22.22.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
      - name: Fetch scoped ancestry history
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-git-history.mjs ancestry
      - name: Publish the core channel archive to the source repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-core-channel.mjs publish "$GITHUB_SHA" "$GITHUB_REPOSITORY"
      # 1.19 transition mirror: 1.18.x clients read the core channel here; delete after 1.19 ships.
      - name: Publish the core channel archive to the 1.19 transition mirror
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_REPOS_TOKEN }}
        run: node scripts/publish-core-channel.mjs publish "$GITHUB_SHA" rollacode/codeterm-releases
