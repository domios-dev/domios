name: Release
run-name: Release ${{ inputs.tag || github.ref_name }}

# Fast checks gate builds; Rust archives queue first and cancel the run on test failure.
# Publication waits for both test stages and every platform. Only owner pushes start releases.
on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release branch release/X.Y.Z (or vX.Y.Z) to build; with dry_run, any branch'
        required: true
        type: string
      dry_run_tests:
        description: Run the full test matrix during a dry run
        required: false
        default: true
        type: boolean
      mirror:
        description: 'Publish to the public mirror'
        required: false
        default: true
        type: boolean
      dry_run:
        description: 'Build and sign every platform from the ref without drafts, uploads, tags, or a manifest'
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ${{ inputs.dry_run == true && format('release-dry-run-{0}', inputs.tag || github.ref_name) || 'release-publication' }}
  cancel-in-progress: ${{ inputs.dry_run == true }}

jobs:
  prepare:
    name: prepare release
    if: github.event_name != 'push' || github.actor == 'rollacode'
    runs-on: [self-hosted, linux-build]
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      source_ref: ${{ steps.release.outputs.source_ref }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      mirror: ${{ steps.release.outputs.mirror }}
      dry_run: ${{ steps.release.outputs.dry_run }}
      published: ${{ steps.release.outputs.published }}
      branch: ${{ steps.release.outputs.branch }}
      kind: ${{ steps.release.outputs.kind }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event_name == 'push' && github.sha || inputs.tag || github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          package-manager-cache: false
          node-version: '22.22.0'

      - name: Resolve release version
        id: release
        env:
          REQUESTED_REF: ${{ inputs.tag || github.ref_name }}
          MIRROR_INPUT: ${{ inputs.mirror }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          SOURCE_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # Builders check out this exact SHA, so a newer push can never leak into this run.
          sha=$(git rev-parse HEAD)
          {
            echo "source_sha=$sha"
            echo "source_ref=$sha"
            echo "published=false"
          } >> "$GITHUB_OUTPUT"
          if [ "$DRY_RUN" = true ]; then
            version=$(node -p "require('./package.json').version")
            node scripts/check-release-locks.mjs
            node scripts/sync-plugin-versions.mjs --check
            {
              echo "tag=v$version"
              echo "branch="
              echo "kind=app"
              echo "mirror=false"
              echo "dry_run=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$REQUESTED_REF" in
            release/*) version="${REQUESTED_REF#release/}" ;;
            v*) version="${REQUESTED_REF#v}" ;;
            *) echo "::error::expected release/X.Y.Z or vX.Y.Z (got '$REQUESTED_REF')"; exit 1 ;;
          esac
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::the release branch must be release/X.Y.Z (got '$REQUESTED_REF')"
            exit 1
          fi
          # The diff since the last app release decides: any Rust is an app release, else a frontend release.
          previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' "$sha" 2>/dev/null || true)
          kind=$(node scripts/ci-scope.mjs --release-kind "$previous" "$sha")
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          if [ "$kind" = app ]; then
            node scripts/check-release-locks.mjs
            node scripts/sync-plugin-versions.mjs --check
            committed=$(node -p "require('./package.json').version")
            tag="v$version"; published_repo="$SOURCE_REPO"
          else
            committed=$(node -p "require('./frontend-release-contract.json').version")
            tag="frontend-v$version"; published_repo=rollacode/codeterm-releases
          fi
          echo "::notice::release/$version is a $kind release (changes since ${previous:-the start})"
          if [ "$committed" != "$version" ]; then
            echo "::error::release/$version is a $kind release but carries version $committed; set $version on the branch"
            exit 1
          fi
          if [ "$(gh release view "$tag" --repo "$published_repo" --json isDraft --jq .isDraft 2>/dev/null)" = false ]; then
            if [ "$kind" = app ]; then
              boundary_dir="$RUNNER_TEMP/publication-boundary"
              mkdir -p "$boundary_dir"
              gh release download "$tag" --repo "$SOURCE_REPO" --pattern issue-closure-boundary.json --dir "$boundary_dir" --clobber \
                || { echo "::error::Publication is incomplete; rerun the failed manifest job in its original run"; exit 1; }
              jq -e '.public_mirror_verified == true' "$boundary_dir/issue-closure-boundary.json" >/dev/null
            fi
            echo "::notice::$tag is already published; a further change needs release/X.Y.(Z+1)"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
          mirror=true
          if [ "$EVENT_NAME" = workflow_dispatch ]; then mirror="$MIRROR_INPUT"; fi
          {
            echo "tag=$tag"
            echo "branch=release/$version"
            echo "mirror=$mirror"
            echo "dry_run=false"
          } >> "$GITHUB_OUTPUT"

      - name: Create draft releases before parallel uploads
        if: steps.release.outputs.dry_run != 'true' && steps.release.outputs.published != 'true' && steps.release.outputs.kind == 'app'
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          MIRROR_TOKEN: ${{ secrets.PACKAGE_REPOS_TOKEN }}
          SOURCE_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
          PUBLISH_MIRROR: ${{ steps.release.outputs.mirror }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$SOURCE_REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$SOURCE_REPO" --target "$SOURCE_SHA" --draft \
              --title "CodeTerm $TAG" --notes "See the assets to download this version and install."
          fi
          node scripts/release-clear-wedged-assets.mjs "$SOURCE_REPO" "$TAG"

          if [ "$PUBLISH_MIRROR" = true ]; then
            export GH_TOKEN="$MIRROR_TOKEN"
            if ! gh release view "$TAG" --repo rollacode/codeterm-releases >/dev/null 2>&1; then
              gh release create "$TAG" --repo rollacode/codeterm-releases \
                --draft --title "CodeTerm $TAG" \
                --notes "Auto-mirrored from rollacode/codeterm. See the source repo for full release notes."
            fi
            node scripts/release-clear-wedged-assets.mjs rollacode/codeterm-releases "$TAG"
          fi

  quick-checks:
    name: quick release checks
    needs: prepare
    if: (needs.prepare.outputs.dry_run != 'true' || inputs.dry_run_tests) && needs.prepare.outputs.published != 'true'
    uses: ./.github/workflows/tests.yml
    with:
      source_ref: ${{ needs.prepare.outputs.source_sha }}
      scope: ${{ needs.prepare.outputs.kind == 'app' && 'full' || 'frontend' }}
      phase: fast
      cancel_release_on_failure: true
    permissions:
      contents: read
      actions: write
    secrets: inherit

  tests:
    name: long release Rust tests
    needs: prepare
    if: (needs.prepare.outputs.dry_run != 'true' || inputs.dry_run_tests) && needs.prepare.outputs.published != 'true'
    uses: ./.github/workflows/tests.yml
    with:
      source_ref: ${{ needs.prepare.outputs.source_sha }}
      scope: ${{ needs.prepare.outputs.kind == 'app' && 'full' || 'frontend' }}
      phase: long
      cancel_release_on_failure: true
    permissions:
      contents: read
      actions: write
    secrets: inherit

  macos:
    name: macOS
    needs: [prepare, quick-checks]
    if: >-
      !cancelled() && needs.prepare.result == 'success'
      && (needs.quick-checks.result == 'success'
      || (needs.prepare.outputs.dry_run == 'true' && !inputs.dry_run_tests))
      && needs.prepare.outputs.published != 'true' && needs.prepare.outputs.kind == 'app'
    uses: ./.github/workflows/release-macos-build.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      source_ref: ${{ needs.prepare.outputs.source_ref }}
      mirror: ${{ needs.prepare.outputs.mirror == 'true' }}
      dry_run: ${{ needs.prepare.outputs.dry_run == 'true' }}
    secrets: inherit

  linux-arm64:
    name: Linux arm64
    needs: [prepare, quick-checks]
    if: >-
      !cancelled() && needs.prepare.result == 'success'
      && (needs.quick-checks.result == 'success'
      || (needs.prepare.outputs.dry_run == 'true' && !inputs.dry_run_tests))
      && needs.prepare.outputs.published != 'true' && needs.prepare.outputs.kind == 'app'
    uses: ./.github/workflows/release-linux-arm64.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      source_ref: ${{ needs.prepare.outputs.source_ref }}
      mirror: ${{ needs.prepare.outputs.mirror == 'true' }}
      dry_run: ${{ needs.prepare.outputs.dry_run == 'true' }}
    secrets: inherit

  linux-x86_64:
    name: Linux x86_64
    needs: [prepare, quick-checks]
    if: >-
      !cancelled() && needs.prepare.result == 'success'
      && (needs.quick-checks.result == 'success'
      || (needs.prepare.outputs.dry_run == 'true' && !inputs.dry_run_tests))
      && needs.prepare.outputs.published != 'true' && needs.prepare.outputs.kind == 'app'
    uses: ./.github/workflows/release-linux.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      source_ref: ${{ needs.prepare.outputs.source_ref }}
      mirror: ${{ needs.prepare.outputs.mirror == 'true' }}
      dry_run: ${{ needs.prepare.outputs.dry_run == 'true' }}
    secrets: inherit

  windows:
    name: Windows x64 + arm64
    needs: [prepare, quick-checks]
    if: >-
      !cancelled() && needs.prepare.result == 'success'
      && (needs.quick-checks.result == 'success'
      || (needs.prepare.outputs.dry_run == 'true' && !inputs.dry_run_tests))
      && needs.prepare.outputs.published != 'true' && needs.prepare.outputs.kind == 'app'
    uses: ./.github/workflows/release-windows.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      source_ref: ${{ needs.prepare.outputs.source_ref }}
      mirror: ${{ needs.prepare.outputs.mirror == 'true' }}
      dry_run: ${{ needs.prepare.outputs.dry_run == 'true' }}
    secrets: inherit

  release-manifest:
    name: release manifest, mirror, and verification
    needs: [prepare, macos, linux-arm64, linux-x86_64, windows, quick-checks, tests]
    if: needs.prepare.outputs.dry_run != 'true' && needs.prepare.outputs.published != 'true' && needs.prepare.outputs.kind == 'app'
    uses: ./.github/workflows/release-manifest-validate.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      source_ref: ${{ needs.prepare.outputs.source_ref }}
      source_sha: ${{ needs.prepare.outputs.source_sha }}
      mirror: ${{ needs.prepare.outputs.mirror == 'true' }}
    secrets: inherit

  frontend:
    name: frontend release
    needs: [prepare, quick-checks, tests]
    if: needs.prepare.outputs.kind == 'frontend' && needs.prepare.outputs.published != 'true' && needs.prepare.outputs.dry_run != 'true'
    uses: ./.github/workflows/frontend-release.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      source_sha: ${{ needs.prepare.outputs.source_sha }}
    secrets: inherit

  promote:
    name: merge the release into master and develop
    needs: [prepare, release-manifest, frontend]
    if: >-
      always() && needs.prepare.outputs.branch != '' && needs.prepare.outputs.published != 'true'
      && (needs.release-manifest.result == 'success' || needs.frontend.result == 'success')
    runs-on: [self-hosted, Linux, light]
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
      REPO: ${{ github.repository }}
      BRANCH: ${{ needs.prepare.outputs.branch }}
      TAG: ${{ needs.prepare.outputs.tag }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0
          token: ${{ secrets.GH_RELEASE_TOKEN }}
      - name: Merge the release PR into master
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          if ! git merge-base --is-ancestor "$SOURCE_SHA" origin/master; then
            pr=$(gh pr list --repo "$REPO" --head "$BRANCH" --base master --state open --json number --jq '.[0].number // empty')
            if [ -z "$pr" ]; then
              pr=$(gh pr create --repo "$REPO" --base master --head "$BRANCH" --title "release: ${TAG#v}" \
                --body "Release $TAG, published by the release run." | grep -oE '[0-9]+$')
            fi
            head=$(gh pr view "$pr" --repo "$REPO" --json headRefOid --jq .headRefOid)
            test "$head" = "$SOURCE_SHA"
            gh pr merge "$pr" --repo "$REPO" --merge --match-head-commit "$SOURCE_SHA"
          fi
          git fetch origin master
          git merge-base --is-ancestor "$SOURCE_SHA" origin/master
          # An app release already carries vX.Y.Z from the manifest job; a frontend release is tagged here.
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            git tag "$TAG" "$SOURCE_SHA"
            git push origin "refs/tags/$TAG"
          fi
      - name: Merge master back into develop
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          if git ls-remote --exit-code --heads origin develop >/dev/null; then
            git fetch origin develop
            git checkout -B develop origin/develop
            git merge --no-ff origin/master -m "Merge master after $TAG into develop"
          else
            git checkout -B develop origin/master
          fi
          git push origin develop
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then git push origin --delete "$BRANCH"; fi
