name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            target: 'aarch64-apple-darwin'
            cli-binary: codeterm
            cli-asset: codeterm-cli-macos-aarch64
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            target: 'x86_64-apple-darwin'
            cli-binary: codeterm
            cli-asset: codeterm-cli-macos-x86_64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            cli

      - name: Install frontend dependencies
        run: pnpm install

      # macOS: import certificate from GitHub Secrets into a temporary keychain
      - name: Import Apple certificate
        if: startsWith(matrix.platform, 'macos')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 12)

          # Decode certificate
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Add to keychain search list
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          # Verify identity is available
          security find-identity -v "$KEYCHAIN_PATH"

          # Clean up certificate file
          rm -f "$CERTIFICATE_PATH"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Read-only PAT for private repo release downloads (baked into binary)
          UPDATER_TOKEN: ${{ secrets.UPDATER_TOKEN }}
          # Fix "invalid Darwin version number: macosx14" — needs minor version
          MACOSX_DEPLOYMENT_TARGET: ${{ startsWith(matrix.platform, 'macos') && '10.15' || '' }}
          # Updater signing
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Signing (macOS only — tauri-action reads these)
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.platform, 'macos') && secrets.APPLE_SIGNING_IDENTITY || '' }}
          # Notarization (macOS only — tauri-action reads these)
          APPLE_ID: ${{ startsWith(matrix.platform, 'macos') && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ startsWith(matrix.platform, 'macos') && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ startsWith(matrix.platform, 'macos') && secrets.APPLE_TEAM_ID || '' }}
        with:
          tagName: v__VERSION__
          releaseName: 'CodeTerm v__VERSION__'
          updaterJsonPreferNsis: true
          releaseBody: |
            ## Download

            | Platform | File |
            |----------|------|
            | macOS (Apple Silicon) | `.dmg` (aarch64) |
            | macOS (Intel) | `.dmg` (x86_64) |

            See [CHANGELOG](https://github.com/rollacode/codeterm/blob/master/CHANGELOG.md) for details.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Notarize and staple the DMG manually if tauri-action didn't handle it
      # (belt-and-suspenders — tauri-action v0 with Tauri v2 should do this via env vars above,
      #  but if it doesn't, this step catches it)
      - name: Notarize DMG
        if: startsWith(matrix.platform, 'macos') && success()
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Find the DMG built by tauri
          DMG=$(find src-tauri/target -name "*.dmg" -type f 2>/dev/null | head -1)
          if [ -z "$DMG" ]; then
            echo "No DMG found, skipping notarization"
            exit 0
          fi

          echo "Found DMG: $DMG"

          # Check if already notarized (staple will succeed if so)
          if xcrun stapler validate "$DMG" 2>/dev/null; then
            echo "DMG is already notarized and stapled"
            exit 0
          fi

          # Submit for notarization
          echo "Submitting for notarization..."
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 600

          # Staple the notarization ticket
          echo "Stapling..."
          xcrun stapler staple "$DMG"

          echo "Notarization complete"

      # Build CLI tool
      - name: Build CLI
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --release --manifest-path cli/Cargo.toml --target ${{ matrix.target }}
          else
            cargo build --release --manifest-path cli/Cargo.toml
          fi
        shell: bash

      # Upload CLI binary to the release
      - name: Upload CLI to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          if [ -n "${{ matrix.target }}" ]; then
            CLI_PATH="cli/target/${{ matrix.target }}/release/${{ matrix.cli-binary }}"
          else
            CLI_PATH="cli/target/release/${{ matrix.cli-binary }}"
          fi

          if [ -f "$CLI_PATH" ]; then
            cp "$CLI_PATH" "${{ matrix.cli-asset }}"
            gh release upload "$TAG" "${{ matrix.cli-asset }}" --clobber
          else
            echo "CLI binary not found at $CLI_PATH"
            ls -la cli/target/*/release/ 2>/dev/null || ls -la cli/target/release/ 2>/dev/null || true
          fi
        shell: bash

      # Clean up macOS keychain
      - name: Cleanup keychain
        if: startsWith(matrix.platform, 'macos') && always()
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF#refs/tags/}" --repo "$GITHUB_REPOSITORY" --draft=false

  update-homebrew:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download and hash DMGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.version.outputs.version }}
          curl -sL -H "Authorization: token ${GITHUB_TOKEN}" -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/rollacode/codeterm/releases/assets/$(curl -sL -H "Authorization: token ${GITHUB_TOKEN}" https://api.github.com/repos/rollacode/codeterm/releases/tags/v${VERSION} | jq -r '.assets[] | select(.name | endswith("_aarch64.dmg")) | .id')" \
            -o aarch64.dmg
          curl -sL -H "Authorization: token ${GITHUB_TOKEN}" -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/rollacode/codeterm/releases/assets/$(curl -sL -H "Authorization: token ${GITHUB_TOKEN}" https://api.github.com/repos/rollacode/codeterm/releases/tags/v${VERSION} | jq -r '.assets[] | select(.name | endswith("_x64.dmg")) | .id')" \
            -o x64.dmg
          echo "SHA_ARM=$(sha256sum aarch64.dmg | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "SHA_INTEL=$(sha256sum x64.dmg | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Checkout tap
        uses: actions/checkout@v4
        with:
          repository: rollacode/homebrew-codeterm
          token: ${{ secrets.PACKAGE_REPOS_TOKEN }}

      - name: Update cask
        run: |
          VERSION=${{ steps.version.outputs.version }}
          sed -i "s/version \".*\"/version \"${VERSION}\"/" Casks/codeterm.rb
          sed -i "s/arm:   \"[0-9a-f]\{64\}\"/arm:   \"${SHA_ARM}\"/" Casks/codeterm.rb
          sed -i "s/intel: \"[0-9a-f]\{64\}\"/intel: \"${SHA_INTEL}\"/" Casks/codeterm.rb

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/codeterm.rb
          git diff --cached --quiet && exit 0
          git commit -m "codeterm ${{ steps.version.outputs.version }}"
          git push

  # update-scoop: disabled — Windows builds from source for now
