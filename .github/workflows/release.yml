name: Release (self-hosted build machine)

# Tag-driven release. Push a tag like `release-1.4.5` on master and the self-hosted
# build machine (this Mac, label `codeterm-builder`) builds macOS + Linux and publishes.
# Windows is built on the ROG self-hosted runner via release-windows.yml (same tag trigger).
# Self-hosted runner minutes are free (does NOT consume the Actions quota) — this is the
# whole point: releases without burning GitHub-hosted minutes.
on:
  push:
    tags:
      - 'release-*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: [self-hosted, codeterm-builder]
    timeout-minutes: 180
    # gh in the runner's launchd service session can't reach the keychain-stored login, and a
    # release touches TWO repos (codeterm + codeterm-releases), so the default GITHUB_TOKEN
    # (single-repo) isn't enough — use a PAT (repo scope on both) provided as GH_RELEASE_TOKEN.
    env:
      GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
    steps:
      - name: Parse + validate version
        id: ver
        run: |
          RAW="${GITHUB_REF_NAME#release-}"
          echo "raw=$RAW"
          if ! echo "$RAW" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag must be release-X.Y.Z (got '$GITHUB_REF_NAME')"; exit 1
          fi
          echo "ver=$RAW"   >> "$GITHUB_OUTPUT"
          echo "tag=v$RAW"  >> "$GITHUB_OUTPUT"

      - name: Checkout repo (full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preflight (toolchain + signing + engines reachable)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: |
          # Collect every result before exiting, so one bad credential reports the
          # whole picture instead of hiding the checks behind it.
          rc=0
          echo "host: $(uname -msr)"
          security find-identity -v -p codesigning | grep -q ANDREY && echo "✅ Developer ID present" || { echo "::error::no Developer ID"; rc=1; }
          test -f "$HOME/.tauri/codeterm.key" && echo "✅ minisign key" || { echo "::error::missing minisign key"; rc=1; }
          gh auth status 2>&1 | grep -q "Logged in" && echo "✅ gh auth" || { echo "::error::gh not authed"; rc=1; }
          docker image inspect codeterm-build-linux-arm64 >/dev/null 2>&1 && echo "✅ docker arm64 image" || echo "::warning::bake codeterm-build-linux-arm64"
          docker image inspect codeterm-build-linux-x64   >/dev/null 2>&1 && echo "✅ docker x64 image"   || echo "::warning::bake codeterm-build-linux-x64"

          # Authenticate with the credentials the build will actually use. The
          # keychain profile is deliberately not consulted: it cannot be
          # provisioned non-interactively, so it rots silently (cost v1.7.5 a run).
          if [ -z "${APPLE_ID:-}" ] && [ -f "$HOME/.claude/.secrets/apple-notary.env" ]; then
            set -a; . "$HOME/.claude/.secrets/apple-notary.env"; set +a
          fi
          NOTARY_PASSWORD="${APPLE_APP_SPECIFIC_PASSWORD:-${APPLE_PASSWORD:-}}"
          if [ -z "${APPLE_ID:-}" ] || [ -z "${APPLE_TEAM_ID:-}" ] || [ -z "$NOTARY_PASSWORD" ]; then
            echo "::error::notary credentials missing — set the APPLE_ID / APPLE_TEAM_ID / APPLE_PASSWORD repo secrets"; rc=1
          elif xcrun notarytool history --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
                 --password "$NOTARY_PASSWORD" >/tmp/codeterm-notary-preflight.log 2>&1; then
            echo "✅ Apple notary credentials accepted"
          else
            tail -20 /tmp/codeterm-notary-preflight.log
            echo "::error::Apple notary rejected these credentials — rotate the APPLE_PASSWORD app-specific password, or check the team's Developer agreements"; rc=1
          fi
          exit "$rc"

      - name: Stamp the v${{ steps.ver.outputs.ver }} build tag at the release commit
        run: |
          # Single trigger tag: push release-X.Y.Z. build-all.sh bundles a stable
          # vX.Y.Z ref from THIS checkout, so the tag only needs to exist locally;
          # the origin push is best-effort bookkeeping, never a build gate.
          TAG="${{ steps.ver.outputs.tag }}"
          git fetch origin "refs/tags/$TAG:refs/tags/$TAG" 2>/dev/null || true
          if ! git rev-parse "$TAG^{commit}" >/dev/null 2>&1; then
            git tag -a "$TAG" "$GITHUB_SHA" -m "$TAG"
            git push origin "$TAG" 2>/dev/null \
              || echo "::warning::could not push $TAG to origin — building from the local tag"
          fi
          echo "✅ $TAG -> $(git rev-parse --short "$TAG^{commit}")"

      - name: Ensure Docker is running (Linux engines)
        run: |
          if ! docker info >/dev/null 2>&1; then
            echo "Docker daemon down — starting Docker Desktop..."
            open -a Docker || true
            for i in $(seq 1 60); do docker info >/dev/null 2>&1 && break; sleep 5; done
          fi
          docker info >/dev/null 2>&1 && echo "✅ docker up" || { echo "::error::Docker not available after wait"; exit 1; }

      - name: Build macOS + Linux (2 engines × 2 waves)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: |
          # Windows is built separately on the ROG self-hosted runner via
          # release-windows.yml (tag-triggered); this Mac builds mac+linux only.
          .codeterm/build-machine/scripts/build-all.sh "${{ steps.ver.outputs.tag }}"

      - name: Publish (private archive + public mirror + signed latest.json)
        run: |
          .codeterm/build-machine/scripts/publish-release.sh "${{ steps.ver.outputs.ver }}"

      - name: Verify published public mirror
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          VER="${{ steps.ver.outputs.ver }}"
          source_release=$(gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft,publishedAt)
          test "$(printf '%s' "$source_release" | jq -r .isDraft)" = false
          test "$(printf '%s' "$source_release" | jq -r .publishedAt)" != null
          release=$(gh release view "$TAG" \
            --repo rollacode/codeterm-releases \
            --json isDraft,publishedAt,assets)
          test "$(printf '%s' "$release" | jq -r .isDraft)" = false
          test "$(printf '%s' "$release" | jq -r .publishedAt)" != null
          printf '%s' "$release" | jq -e '.assets | any(.name == "latest.json")' >/dev/null
          gh release download "$TAG" \
            --repo rollacode/codeterm-releases \
            --pattern latest.json \
            --dir "$RUNNER_TEMP/public-mirror"
          jq -e --arg ver "$VER" '
            (.version == $ver)
            and (.platforms["darwin-aarch64"].signature | type == "string" and length > 0)
            and (.platforms["darwin-aarch64"].url | endswith("/CodeTerm_aarch64.app.tar.gz"))
            and (.platforms["darwin-x86_64"].signature | type == "string" and length > 0)
            and (.platforms["darwin-x86_64"].url | endswith("/CodeTerm_x64.app.tar.gz"))
          ' \
            "$RUNNER_TEMP/public-mirror/latest.json" >/dev/null
          jq -r '.platforms[].url' "$RUNNER_TEMP/public-mirror/latest.json" | while IFS= read -r url; do
            case "$url" in
              https://github.com/rollacode/codeterm-releases/releases/download/"$TAG"/*) ;;
              *) echo "::error::non-versioned or non-public updater URL: $url"; exit 1 ;;
            esac
            curl --fail --silent --show-error --location --head "$url" >/dev/null
          done
          # Structure and a 200 are the state codeterm-releases#58 shipped in; the
          # closure boundary is minted only once the signatures verify.
          verification=0
          node scripts/verify-updater-manifest.mjs \
            --manifest "https://github.com/rollacode/codeterm-releases/releases/download/$TAG/latest.json?cb=$(date +%s)" \
            --require-version "$VER" \
            --require-platform darwin-aarch64 \
            --require-platform darwin-x86_64 \
            --require-platform windows-x86_64 \
            --require-platform linux-x86_64 \
            --evidence "$RUNNER_TEMP/manifest-verification.json" || verification=$?
          # A failed verification is uploaded too: a release that could not be
          # verified must leave a record saying so, not silence.
          gh release upload "$TAG" "$RUNNER_TEMP/manifest-verification.json" \
            --repo rollacode/codeterm-releases --clobber || true
          if [ "$verification" -ne 0 ]; then
            echo "::error::published manifest is not installable"; exit 1
          fi
          jq -n --arg version "$VER" --arg sha "$GITHUB_SHA" \
            --slurpfile verification "$RUNNER_TEMP/manifest-verification.json" \
            '{version: $version, source_sha: $sha, public_mirror_verified: true, manifest_verification: $verification[0]}' \
            > "$RUNNER_TEMP/issue-closure-boundary.json"
          gh release upload "$TAG" "$RUNNER_TEMP/issue-closure-boundary.json" \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload "$TAG" "$RUNNER_TEMP/issue-closure-boundary.json" \
            --repo rollacode/codeterm-releases --clobber

      - name: Resolve included private source public issues
        run: |
          CURRENT="release-${{ steps.ver.outputs.ver }}"
          printf '[]' > "$RUNNER_TEMP/release-history.json"
          for trigger in $(git tag --merged "$GITHUB_SHA" --list 'release-*' --sort=-version:refname \
            | grep -v -x "$CURRENT"); do
            version="${trigger#release-}"
            tag="v$version"
            sha=$(git rev-parse "$trigger^{commit}")
            private_published=false
            public_published=false
            mirror_verified=false
            private=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
              --json isDraft,publishedAt,assets 2>/dev/null || true)
            private_marker=false
            if [ -n "$private" ] \
              && [ "$(printf '%s' "$private" | jq -r .isDraft)" = false ] \
              && [ "$(printf '%s' "$private" | jq -r .publishedAt)" != null ]; then
              private_published=true
              if printf '%s' "$private" \
                | jq -e '.assets | any(.name == "issue-closure-boundary.json")' >/dev/null; then
                private_marker=true
              fi
            fi
            public=$(gh release view "$tag" --repo rollacode/codeterm-releases \
              --json isDraft,publishedAt,assets 2>/dev/null || true)
            if [ -n "$public" ] \
              && [ "$(printf '%s' "$public" | jq -r .isDraft)" = false ] \
              && [ "$(printf '%s' "$public" | jq -r .publishedAt)" != null ]; then
              public_published=true
              if [ "$private_marker" = true ] \
                && printf '%s' "$public" \
                  | jq -e '.assets
                    | (any(.name == "latest.json")
                       and any(.name == "issue-closure-boundary.json"))' >/dev/null; then
                mirror_verified=true
              fi
            fi
            jq --arg version "$version" --arg sha "$sha" \
              --argjson private "$private_published" \
              --argjson public "$public_published" \
              --argjson mirror "$mirror_verified" \
              '. + [{version: $version, sha: $sha, private_published: $private,
                      public_published: $public, mirror_verified: $mirror}]' \
              "$RUNNER_TEMP/release-history.json" > "$RUNNER_TEMP/release-history.next.json"
            mv "$RUNNER_TEMP/release-history.next.json" "$RUNNER_TEMP/release-history.json"
          done
          START=$(python3 scripts/release_issue_contract.py range-start \
            --releases-file "$RUNNER_TEMP/release-history.json")
          if [ -n "$START" ]; then
            RANGE="$START..$GITHUB_SHA"
          else
            RANGE="$GITHUB_SHA"
          fi
          printf '[]' > "$RUNNER_TEMP/release-commits.json"
          printf '[]' > "$RUNNER_TEMP/release-prs.json"
          for sha in $(git rev-list "$RANGE"); do
            git show -s --format=%B "$sha" > "$RUNNER_TEMP/commit-body.txt"
            jq --arg sha "$sha" \
              --arg url "https://github.com/${GITHUB_REPOSITORY}/commit/$sha" \
              --rawfile body "$RUNNER_TEMP/commit-body.txt" \
              '. + [{sha: $sha, url: $url, body: $body}]' \
              "$RUNNER_TEMP/release-commits.json" > "$RUNNER_TEMP/release-commits.next.json"
            mv "$RUNNER_TEMP/release-commits.next.json" "$RUNNER_TEMP/release-commits.json"
            gh api "repos/${GITHUB_REPOSITORY}/commits/$sha/pulls" \
              --jq '[.[] | select(.merged_at != null) | {number, url: .html_url, body, base_ref: .base.ref}]' \
              > "$RUNNER_TEMP/commit-prs.json"
            jq -s 'add | unique_by(.number)' \
              "$RUNNER_TEMP/release-prs.json" "$RUNNER_TEMP/commit-prs.json" \
              > "$RUNNER_TEMP/release-prs.next.json"
            mv "$RUNNER_TEMP/release-prs.next.json" "$RUNNER_TEMP/release-prs.json"
          done
          python3 scripts/release_issue_contract.py resolve \
            --commits-file "$RUNNER_TEMP/release-commits.json" \
            --prs-file "$RUNNER_TEMP/release-prs.json" \
            > "$RUNNER_TEMP/resolved-public-issues.json"
          jq -r '.issues[].reference' "$RUNNER_TEMP/resolved-public-issues.json" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Close shipped public issues
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
        run: |
          # Being the release owner is not evidence. The close is authorised by
          # the verification record for THIS release or it does not happen.
          node scripts/check-release-closure.mjs \
            --evidence "$RUNNER_TEMP/manifest-verification.json" \
            --version "${{ steps.ver.outputs.ver }}"
          jq -r '.issues[].reference' "$RUNNER_TEMP/resolved-public-issues.json" | while IFS= read -r reference; do
            number="${reference##*#}"
            state=$(gh issue view "$number" --repo rollacode/codeterm-releases --json state --jq .state)
            printf '%s\t%s\n' "$reference" "$state"
          done | jq -Rn '[inputs | split("\t") | {(.[0]): .[1]}] | add // {}' \
            > "$RUNNER_TEMP/public-issue-states.json"
          python3 scripts/release_issue_contract.py plan-close \
            --resolved-file "$RUNNER_TEMP/resolved-public-issues.json" \
            --states-file "$RUNNER_TEMP/public-issue-states.json" \
            --version "${{ steps.ver.outputs.ver }}" \
            > "$RUNNER_TEMP/public-issue-close-plan.json"
          jq -r '.[] | @base64' "$RUNNER_TEMP/public-issue-close-plan.json" | while IFS= read -r row; do
            action=$(printf '%s' "$row" | base64 --decode)
            number=$(printf '%s' "$action" | jq -r .number)
            comment=$(printf '%s' "$action" | jq -r .comment)
            gh issue close "$number" \
              --repo rollacode/codeterm-releases \
              --comment "$comment"
          done
