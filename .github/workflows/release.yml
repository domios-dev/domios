name: Release
run-name: ${{ inputs.tag && format('Release {0}', inputs.tag) || 'Domios release' }}

# Exact-SHA dev qualification precedes packaging; publication verifies the same receipts again.
on:
  push:
    branches: [master]
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      dry_run:
        required: true
        type: boolean
      mirror:
        required: true
        type: boolean
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional app tag vX.Y.Z. Must match the version at the release/next head.'
        required: false
        type: string
      mirror:
        description: 'Ignored by dry runs; publication mirrors from the master merge push'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Required true: build and sign every platform without tags or public releases; dispatches do not upload drafts'
        required: false
        default: true
        type: boolean

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

# Release-push cancellation is owned by CI; publication serializes without cancelling.
concurrency:
  group: ${{ inputs.dry_run == true && (github.event_name == 'workflow_dispatch' && format('release-dry-run-{0}', github.run_id) || 'release-dry-run-push') || 'release-publication' }}
  cancel-in-progress: ${{ inputs.dry_run == true }}

jobs:
  qualified-source:
    name: admit release head
    if: ${{ !cancelled() && (github.repository_owner == 'rollacode' || github.repository_owner == 'domios-dev') && github.actor == 'rollacode' && github.triggering_actor == 'rollacode' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release/next')) }}
    runs-on: ${{ fromJSON(github.ref == 'refs/heads/master' && '"ubuntu-24.04"' || vars.CI_LINUX_LIGHT_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      promote_run_id: ${{ steps.source.outputs.promote_run_id }}
      branch: ${{ steps.source.outputs.branch }}
      test_waiver: ${{ steps.source.outputs.test_waiver }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: source
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        with:
          script: |-
            if (context.eventName === 'workflow_dispatch') {
              // A dispatch only rebuilds the dispatching release head; publication is the master merge push alone.
              if (process.env.DRY_RUN !== 'true') throw new Error('Publication runs only from the master merge push of the release PR; dispatch with dry_run=true');
              if (context.ref !== 'refs/heads/release/next') throw new Error('Dispatch the dry run from release/next');
              core.setOutput('source_sha', context.sha);
              return;
            }
            if (process.env.DRY_RUN === 'true') {
              if (context.eventName !== 'push' || context.ref !== 'refs/heads/release/next' || process.env.SOURCE_SHA !== context.sha)
                throw new Error('Foreign release push head');
              core.setOutput('source_sha', context.sha);
              return;
            }
            if (context.ref !== 'refs/heads/master') throw new Error('Publication requires master merge push');
            // The commit-to-PR association index can stay empty after a merge; the PR's own merge_commit_sha is authoritative.
            const prs = (await github.rest.pulls.list({...context.repo,state:'closed',base:'master',sort:'updated',direction:'desc',per_page:100})).data;
            const pr = prs.find(pr => pr.merged_at && pr.merge_commit_sha === context.sha && pr.base.ref === 'master' && pr.user.login === 'rollacode' &&
              pr.head.repo.full_name === context.repo.owner + '/' + context.repo.repo && pr.head.ref === 'release/next');
            if (!pr) {core.notice('No merged release PR for this master push');return;}
            const sha = pr.head.sha;
            // Master must carry exactly the files of the admitted release head.
            const tree = async ref => (await github.rest.repos.getCommit({...context.repo, ref})).data.commit.tree.sha;
            if (await tree(context.sha) !== await tree(sha)) throw new Error('Release requires master to carry exactly the qualified head tree');
            const {pathToFileURL} = require('node:url');
            const load = name => import(pathToFileURL(process.env.GITHUB_WORKSPACE + '/scripts/' + name).href);
            const {parseTestWaiver} = await load('release-test-waiver.mjs');
            const {selectReleasePushRun} = await load('ci-qualification.mjs');
            const {requireQualificationWithGithub} = await load('ci-workflow-api.mjs');
            const waiver = parseTestWaiver(pr.body ?? '');
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {...context.repo,
              workflow_id: 'tests.yml', event: 'push', head_sha: sha, per_page: 100});
            const run = selectReleasePushRun(runs, sha, pr.head.ref, context.repo.owner + '/' + context.repo.repo, waiver);
            if (waiver) await requireQualificationWithGithub(github, context, sha, {runId: run.id, waiver});
            core.setOutput('test_waiver', waiver ? JSON.stringify(waiver) : '');
            core.setOutput('promote_run_id', String(run.id));
            core.setOutput('branch', pr.head.ref);
            core.setOutput('source_sha', sha);

  prepare:
    name: prepare release
    needs: qualified-source
    if: ${{ always() && (github.repository_owner == 'rollacode' || github.repository_owner == 'domios-dev') && github.actor == 'rollacode' && github.triggering_actor == 'rollacode' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release/next')) && needs.qualified-source.result == 'success' && needs.qualified-source.outputs.source_sha != '' }}
    environment: release
    # GitHub's runner: ubunta's single runner is often busy with the Rust suite, and every build waits on this job.
    runs-on: ${{ fromJSON(github.ref == 'refs/heads/master' && '"ubuntu-24.04"' || vars.CI_LINUX_LIGHT_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      source_ref: ${{ steps.release.outputs.source_ref }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      mirror: ${{ steps.release.outputs.mirror }}
      dry_run: ${{ steps.release.outputs.dry_run }}
      promote_run_id: ${{ steps.release.outputs.promote_run_id }}
      published: ${{ steps.release.outputs.published }}
      branch: ${{ steps.release.outputs.branch }}
      kind: ${{ steps.release.outputs.kind }}
      test_waiver: ${{ needs.qualified-source.outputs.test_waiver }}
    steps:

      - name: Use the runner bundled Node
        if: runner.environment == 'self-hosted'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |-
            const path = require('node:path');
            core.addPath(path.dirname(process.execPath));
            core.info('Using runner Node ' + process.version);
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 22.22.0
        if: runner.environment == 'github-hosted'
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
        if: runner.environment == 'github-hosted'
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.qualified-source.outputs.source_sha }}
          fetch-depth: 1
          # History without blobs: unshallowing a workspace a shallow job left behind took minutes.
          filter: blob:none
      - name: Discover installed runner tools
        if: runner.environment == 'self-hosted'
        run: node scripts/ci-runner-paths.mjs --paths-only
      - name: Fetch scoped release history
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-git-history.mjs release
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          version: 10.32.1
          run_install: false
          dest: ${{ runner.tool_cache }}/setup-pnpm
        if: runner.environment == 'github-hosted'
      - name: Runner preflight
        run: node scripts/ci-runner-paths.mjs packaging

      - name: Require green push qualification for the exact release SHA
        if: ${{ !inputs.dry_run || github.event_name == 'workflow_dispatch' }}
        env:
          PROMOTE_RUN_ID: ${{ needs.qualified-source.outputs.promote_run_id }}
          RELEASE_TEST_WAIVER: ${{ needs.qualified-source.outputs.test_waiver }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |-
            const {pathToFileURL} = require('node:url');
            const {requireQualificationWithGithub} = await import(pathToFileURL(process.env.GITHUB_WORKSPACE + '/scripts/ci-workflow-api.mjs').href);
            const sha = process.env.QUALIFICATION_SHA || require('node:child_process').execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
            await requireQualificationWithGithub(github, context, sha, {runId: process.env.PROMOTE_RUN_ID || undefined});

      - name: Resolve release version
        id: release
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          QUALIFIED_BRANCH: ${{ needs.qualified-source.outputs.branch }}
          MIRROR_INPUT: ${{ inputs.mirror }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          PROMOTE_RUN_ID: ${{ needs.qualified-source.outputs.promote_run_id }}
          RELEASE_TEST_WAIVER: ${{ needs.qualified-source.outputs.test_waiver }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # Builders check out this exact SHA, so a newer push can never leak into this run.
          sha=$(git rev-parse HEAD)
          # A promotion publishes a qualified dry run's retained bytes; its own run builds and tests nothing.
          if [ -n "${PROMOTE_RUN_ID:-}" ]; then
            [ "$DRY_RUN" != true ] || { echo "::error::promote_run_id publishes; it cannot be a dry run"; exit 1; }
          fi
          {
            echo "source_sha=$sha"
            echo "source_ref=$sha"
            echo "published=false"
            echo "promote_run_id=${PROMOTE_RUN_ID:-}"
          } >> "$GITHUB_OUTPUT"
          tag=$(node scripts/release-version.mjs "$REQUESTED_TAG")
          version="${tag#v}"
          if [ "$DRY_RUN" = true ]; then
            node scripts/check-release-locks.mjs
            node scripts/sync-plugin-versions.mjs --check
            {
              echo "tag=$tag"
              echo "branch=release/next"
              echo "kind=app"
              echo "mirror=false"
              echo "dry_run=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The diff since the last app release decides: any Rust is an app release, else a frontend release.
          previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' "$sha^" 2>/dev/null || true)
          kind=$(node scripts/ci-scope.mjs --release-kind "$previous" "$sha")
          if [ -n "${PROMOTE_RUN_ID:-}" ]; then kind=app; fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          published_repo="$SOURCE_REPO"
          if [ "$kind" = app ]; then
            node scripts/check-release-locks.mjs
            node scripts/sync-plugin-versions.mjs --check
          else
            frontend_version=$(node -p "require('./frontend-release-contract.json').version")
            [ "$frontend_version" = "$version" ] || { echo "::error::frontend version must match $version"; exit 1; }
            tag="frontend-v$version"
          fi
          echo "::notice::$tag is a $kind release (changes since ${previous:-the start})"
          if [ -n "${PROMOTE_RUN_ID:-}" ]; then
            node scripts/release-promote.mjs check "$PROMOTE_RUN_ID" "$sha" "$QUALIFIED_BRANCH"
          fi
          if [ "$(gh release view "$tag" --repo "$published_repo" --json isDraft --jq .isDraft 2>/dev/null)" = false ]; then
            if [ "$kind" = app ]; then
              boundary_dir="$RUNNER_TEMP/publication-boundary"
              mkdir -p "$boundary_dir"
              gh release download "$tag" --repo "$SOURCE_REPO" --pattern issue-closure-boundary.json --dir "$boundary_dir" --clobber \
                || { echo "::error::Publication is incomplete; rerun the failed manifest job in its original run"; exit 1; }
              jq -e '.public_mirror_verified == true' "$boundary_dir/issue-closure-boundary.json" >/dev/null
            fi
            echo "::notice::$tag is already published; a further change needs a new package version"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
          mirror=true
          if [ "$EVENT_NAME" = workflow_dispatch ]; then mirror="$MIRROR_INPUT"; fi
          {
            echo "tag=$tag"
            echo "branch=$QUALIFIED_BRANCH"
            echo "mirror=$mirror"
            echo "dry_run=false"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare hidden qualification drafts
        if: inputs.dry_run && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          MIRROR_TOKEN: ${{ secrets.PACKAGE_REPOS_TOKEN }}
        run: node scripts/release-qualification-draft.mjs prepare "${{ steps.release.outputs.tag }}" "${{ steps.release.outputs.source_sha }}" "$GITHUB_RUN_ID"

  # The platform-independent frontend is built once; every platform job installs these bytes by digest.
  frontend-dist:
    name: frontend bundle
    needs: prepare
    if: ${{ !cancelled() && (github.repository_owner == 'rollacode' || github.repository_owner == 'domios-dev') && github.actor == 'rollacode' && github.triggering_actor == 'rollacode' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release/next')) && needs.prepare.result == 'success' && needs.prepare.outputs.published != 'true' && needs.prepare.outputs.kind == 'app' && needs.prepare.outputs.promote_run_id == '' }}
    environment: release
    # GitHub's runner: ubunta's single runner is often busy with the Rust suite, and every build waits on this job.
    runs-on: ${{ fromJSON(github.ref == 'refs/heads/master' && '"ubuntu-24.04"' || vars.CI_LINUX_LIGHT_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 20
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
      CI_STORE_LAN_ENDPOINT: ${{ secrets.CI_STORE_LAN_ENDPOINT }}
      CI_STORE_PUBLIC_ENDPOINT: ${{ secrets.CI_STORE_PUBLIC_ENDPOINT }}
    outputs:
      sha256: ${{ steps.bundle.outputs.sha256 }}
    steps:
      - name: Use the runner bundled Node
        if: runner.environment == 'self-hosted'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |-
            const path = require('node:path');
            core.addPath(path.dirname(process.execPath));
            core.info('Using runner Node ' + process.version);
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 22.22.0
        if: runner.environment == 'github-hosted'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 1
      - name: Discover installed runner tools
        if: runner.environment == 'self-hosted'
        run: node scripts/ci-runner-paths.mjs --paths-only
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.32.1
          run_install: false
          dest: ${{ runner.tool_cache }}/setup-pnpm
        if: runner.environment == 'github-hosted'
      - name: Runner preflight
        run: node scripts/ci-runner-paths.mjs receipt
      - name: Frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Build, store and digest the frontend bundle
        id: bundle
        run: |
          set -euo pipefail
          pnpm build
          digest=$(node scripts/release-frontend-dist.mjs publish dist "$RUNNER_TEMP/frontend-dist.tar" "$GITHUB_RUN_ID" | tail -n 1)
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
          echo "Frontend bundle sha256 $digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain frontend bytes for hosted arm64 compilation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          overwrite: true
          name: frontend-dist-${{ steps.bundle.outputs.sha256 }}
          path: ${{ runner.temp }}/frontend-dist.tar
          if-no-files-found: error
          retention-days: 1
      - name: Upload artifacts spooled while the private store was unreachable
        if: always()
        uses: ./.github/actions/ci-artifact-spool

  macos-arm64:
    name: macOS arm64
    needs: [prepare, frontend-dist]
    if: >-
      !cancelled() && needs.prepare.result == 'success' && needs.frontend-dist.result == 'success' && needs.prepare.outputs.published != 'true' && needs.prepare.outputs.kind == 'app' && needs.prepare.outputs.promote_run_id == ''
    uses: ./.github/workflows/release-macos-build.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      source_ref: ${{ needs.prepare.outputs.source_ref }}
      mirror: ${{ needs.prepare.outputs.mirror == 'true' }}
      dry_run: ${{ needs.prepare.outputs.dry_run == 'true' }}
      frontend_sha256: ${{ needs.frontend-dist.outputs.sha256 }}
      arch: arm64
    secrets: inherit

  macos-x64:
    name: macOS x64
    needs: [prepare, frontend-dist]
    if: >-
      !cancelled() && needs.prepare.result == 'success' && needs.frontend-dist.result == 'success' && needs.prepare.outputs.published != 'true' && needs.prepare.outputs.kind == 'app' && needs.prepare.outputs.promote_run_id == ''
    uses: ./.github/workflows/release-macos-build.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      source_ref: ${{ needs.prepare.outputs.source_ref }}
      mirror: ${{ needs.prepare.outputs.mirror == 'true' }}
      dry_run: ${{ needs.prepare.outputs.dry_run == 'true' }}
      frontend_sha256: ${{ needs.frontend-dist.outputs.sha256 }}
      arch: x86_64
    secrets: inherit

  linux-arm64:
    name: Linux arm64
    needs: [prepare, frontend-dist]
    if: >-
      !cancelled() && needs.prepare.result == 'success' && needs.frontend-dist.result == 'success' && needs.prepare.outputs.published != 'true' && needs.prepare.outputs.kind == 'app' && needs.prepare.outputs.promote_run_id == ''
    uses: ./.github/workflows/release-linux-arm64.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      source_ref: ${{ needs.prepare.outputs.source_ref }}
      mirror: ${{ needs.prepare.outputs.mirror == 'true' }}
      dry_run: ${{ needs.prepare.outputs.dry_run == 'true' }}
      frontend_sha256: ${{ needs.frontend-dist.outputs.sha256 }}
    secrets: inherit

  linux-x86_64:
    name: Linux x64
    needs: [prepare, frontend-dist]
    if: >-
      !cancelled() && needs.prepare.result == 'success' && needs.frontend-dist.result == 'success' && needs.prepare.outputs.published != 'true' && needs.prepare.outputs.kind == 'app' && needs.prepare.outputs.promote_run_id == ''
    uses: ./.github/workflows/release-linux.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      source_ref: ${{ needs.prepare.outputs.source_ref }}
      mirror: ${{ needs.prepare.outputs.mirror == 'true' }}
      dry_run: ${{ needs.prepare.outputs.dry_run == 'true' }}
      frontend_sha256: ${{ needs.frontend-dist.outputs.sha256 }}
    secrets: inherit

  windows-x64:
    name: Windows x64
    needs: [prepare, frontend-dist]
    if: >-
      !cancelled() && needs.prepare.result == 'success' && needs.frontend-dist.result == 'success' && needs.prepare.outputs.published != 'true' && needs.prepare.outputs.kind == 'app' && needs.prepare.outputs.promote_run_id == ''
    uses: ./.github/workflows/release-windows.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      source_ref: ${{ needs.prepare.outputs.source_ref }}
      mirror: ${{ needs.prepare.outputs.mirror == 'true' }}
      dry_run: ${{ needs.prepare.outputs.dry_run == 'true' }}
      frontend_sha256: ${{ needs.frontend-dist.outputs.sha256 }}
      arch: x64
    secrets: inherit

  windows-arm64:
    name: Windows arm64
    needs: [prepare, frontend-dist]
    if: >-
      !cancelled() && needs.prepare.result == 'success' && needs.frontend-dist.result == 'success' && needs.prepare.outputs.published != 'true' && needs.prepare.outputs.kind == 'app' && needs.prepare.outputs.promote_run_id == ''
    uses: ./.github/workflows/release-windows-arm64.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      source_ref: ${{ needs.prepare.outputs.source_ref }}
      mirror: ${{ needs.prepare.outputs.mirror == 'true' }}
      dry_run: ${{ needs.prepare.outputs.dry_run == 'true' }}
      frontend_sha256: ${{ needs.frontend-dist.outputs.sha256 }}
    secrets: inherit

  dry-run-manifest:
    name: local dry-run manifest verification
    needs: [prepare, macos-arm64, macos-x64, linux-arm64, linux-x86_64, windows-x64, windows-arm64]
    if: ${{ needs.prepare.outputs.dry_run == 'true' }}
    uses: ./.github/workflows/release-manifest-dry-run.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      source_ref: ${{ needs.prepare.outputs.source_sha }}
      artifact_run_id: ${{ format('{0}', github.run_id) }}
    secrets: inherit

  # The retained bytes of the qualified dry run become the platform assets; nothing is rebuilt or re-signed.
  promote-evidence:
    name: promote qualified dry-run evidence
    needs: prepare
    if: ${{ !cancelled() && (github.repository_owner == 'rollacode' || github.repository_owner == 'domios-dev') && github.actor == 'rollacode' && github.triggering_actor == 'rollacode' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release/next')) && needs.prepare.result == 'success' && needs.prepare.outputs.promote_run_id != '' && vars.RELEASE_PUBLISH_ENABLED == 'true' && needs.prepare.outputs.dry_run != 'true' && needs.prepare.outputs.published != 'true' && needs.prepare.outputs.kind == 'app' }}
    environment: release
    # The LAN store makes our Linux runner fastest; CI_RELEASE_EVIDENCE_RUNNER=hosted moves it to the public edge.
    runs-on: ${{ fromJSON(github.ref == 'refs/heads/master' && '"ubuntu-24.04"' || vars.CI_RELEASE_EVIDENCE_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 120
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
      CI_STORE_LAN_ENDPOINT: ${{ secrets.CI_STORE_LAN_ENDPOINT }}
      CI_STORE_PUBLIC_ENDPOINT: ${{ secrets.CI_STORE_PUBLIC_ENDPOINT }}
    steps:
      - name: Use the runner bundled Node
        if: runner.environment == 'self-hosted'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |-
            const path = require('node:path');
            core.addPath(path.dirname(process.execPath));
            core.info('Using runner Node ' + process.version);
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 22.22.0
        if: runner.environment == 'github-hosted'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 1
      - name: Discover installed runner tools
        if: runner.environment == 'self-hosted'
        run: node scripts/ci-runner-paths.mjs --paths-only
      - name: Runner preflight
        run: node scripts/ci-runner-paths.mjs receipt
      - name: Admit qualification drafts or restore missing drafts
        env:
          GH_TOKEN: ${{ github.token }}
          # 1.19 transition mirror: rollacode/codeterm-releases write; delete after 1.19 ships.
          MIRROR_TOKEN: ${{ secrets.PACKAGE_REPOS_TOKEN }}
          PUBLISH_MIRROR: ${{ needs.prepare.outputs.mirror }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          PROMOTE_RUN_ID: ${{ needs.prepare.outputs.promote_run_id }}
          RELEASE_TEST_WAIVER: ${{ needs.prepare.outputs.test_waiver }}
        run: |
          set -euo pipefail
          work=$(mktemp -d "$RUNNER_TEMP/promote.XXXXXX")
          trap 'rm -rf "$work"' EXIT
          node scripts/release-promote.mjs publish "$TAG" "$SOURCE_SHA" "$PROMOTE_RUN_ID" "$work"
          echo "Promoted the retained bytes of run $PROMOTE_RUN_ID for $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"

  release-manifest:
    name: release manifest, mirror, and verification
    needs: [prepare, macos-arm64, macos-x64, linux-arm64, linux-x86_64, windows-x64, windows-arm64, promote-evidence]
    if: >-
      !cancelled() && (needs.promote-evidence.result == 'success' || (needs.macos-arm64.result == 'success' && needs.macos-x64.result == 'success' && needs.linux-arm64.result == 'success' && needs.linux-x86_64.result == 'success' && needs.windows-x64.result == 'success' && needs.windows-arm64.result == 'success')) && vars.RELEASE_PUBLISH_ENABLED == 'true' && needs.prepare.outputs.dry_run != 'true' && needs.prepare.outputs.published != 'true' && needs.prepare.outputs.kind == 'app'
    uses: ./.github/workflows/release-manifest-validate.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      source_ref: ${{ needs.prepare.outputs.source_ref }}
      source_sha: ${{ needs.prepare.outputs.source_sha }}
      promote_run_id: ${{ needs.prepare.outputs.promote_run_id }}
      test_waiver: ${{ needs.prepare.outputs.test_waiver }}
      mirror: ${{ needs.prepare.outputs.mirror == 'true' }}
    secrets: inherit

  frontend:
    name: frontend release
    needs: [prepare]
    if: >-
      !cancelled() && needs.prepare.result == 'success' && vars.RELEASE_PUBLISH_ENABLED == 'true' && needs.prepare.outputs.kind == 'frontend' && needs.prepare.outputs.published != 'true' && needs.prepare.outputs.dry_run != 'true'
    uses: ./.github/workflows/frontend-release.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      source_sha: ${{ needs.prepare.outputs.source_sha }}
    secrets: inherit

  rust-warnings:
    permissions:
      contents: read
      actions: write
      pull-requests: write
    needs: [prepare, macos-arm64, macos-x64, linux-arm64, linux-x86_64, windows-x64, windows-arm64]
    if: always() && github.workflow != 'CI' && needs.prepare.result == 'success' && needs.prepare.outputs.promote_run_id == ''
    uses: ./.github/workflows/rust-warnings-summary.yml
    secrets: inherit
    with:
      source_ref: ${{ needs.prepare.outputs.source_sha || github.sha }}
      report_name: rust-warnings-release-report
      comment: true
      artifacts: '["rust-warnings-release-macOS-aarch64-apple-darwin","rust-warnings-release-macOS-x86_64-apple-darwin","rust-warnings-release-Linux-aarch64-unknown-linux-gnu","rust-warnings-release-Linux-x86_64-unknown-linux-gnu","rust-warnings-release-Windows-x86_64-pc-windows-msvc","rust-warnings-release-Windows-aarch64-pc-windows-msvc"]'
