name: Release
run-name: Release ${{ inputs.tag || github.ref_name }}

# Every push to release/X.Y.Z is the release: the full test matrix and every platform build run in
# parallel, and publication waits for all of them. Only the owner account's pushes start it.
on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release branch release/X.Y.Z (or vX.Y.Z) to build; with dry_run, any branch'
        required: true
        type: string
      mirror:
        description: 'Publish to the public mirror'
        required: false
        default: true
        type: boolean
      dry_run:
        description: 'Build and sign every platform from the ref without drafts, uploads, tags, or a manifest'
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ inputs.dry_run && 'dry-run-' || '' }}${{ inputs.tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  prepare:
    name: prepare release
    if: github.event_name != 'push' || github.actor == 'rollacode'
    runs-on: [self-hosted, linux-build]
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      source_ref: ${{ steps.release.outputs.source_ref }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      mirror: ${{ steps.release.outputs.mirror }}
      dry_run: ${{ steps.release.outputs.dry_run }}
      published: ${{ steps.release.outputs.published }}
      branch: ${{ steps.release.outputs.branch }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          package-manager-cache: false
          node-version: '22.22.0'

      - name: Resolve release version
        id: release
        env:
          REQUESTED_REF: ${{ inputs.tag || github.ref_name }}
          MIRROR_INPUT: ${{ inputs.mirror }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          SOURCE_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # Builders check out this exact SHA, so a newer push can never leak into this run.
          sha=$(git rev-parse HEAD)
          echo "source_sha=$sha" >> "$GITHUB_OUTPUT"
          echo "source_ref=$sha" >> "$GITHUB_OUTPUT"
          echo "published=false" >> "$GITHUB_OUTPUT"
          if [ "$DRY_RUN" = true ]; then
            version=$(node -p "require('./package.json').version")
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
            echo "branch=" >> "$GITHUB_OUTPUT"
            echo "mirror=false" >> "$GITHUB_OUTPUT"
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$REQUESTED_REF" in
            release/*) version="${REQUESTED_REF#release/}" ;;
            v*) version="${REQUESTED_REF#v}" ;;
            *) echo "::error::expected release/X.Y.Z or vX.Y.Z (got '$REQUESTED_REF')"; exit 1 ;;
          esac
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::the release branch must be release/X.Y.Z (got '$REQUESTED_REF')"
            exit 1
          fi
          committed=$(node -p "require('./package.json').version")
          if [ "$committed" != "$version" ]; then
            echo "::error::release/$version carries version $committed; run npm run sync:versions for $version on the branch"
            exit 1
          fi
          if [ "$(gh release view "v$version" --repo "$SOURCE_REPO" --json isDraft --jq .isDraft 2>/dev/null)" = false ]; then
            echo "::notice::v$version is already published; a further change needs release/X.Y.(Z+1)"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
          mirror=true
          if [ "$EVENT_NAME" = workflow_dispatch ]; then mirror="$MIRROR_INPUT"; fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "branch=release/$version" >> "$GITHUB_OUTPUT"
          echo "mirror=$mirror" >> "$GITHUB_OUTPUT"
          echo "dry_run=false" >> "$GITHUB_OUTPUT"

      - name: Create draft releases before parallel uploads
        if: steps.release.outputs.dry_run != 'true' && steps.release.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          MIRROR_TOKEN: ${{ secrets.PACKAGE_REPOS_TOKEN }}
          SOURCE_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
          PUBLISH_MIRROR: ${{ steps.release.outputs.mirror }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$SOURCE_REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$SOURCE_REPO" --target "$SOURCE_SHA" --draft \
              --title "CodeTerm $TAG" --notes "See the assets to download this version and install."
          fi
          node scripts/release-clear-wedged-assets.mjs "$SOURCE_REPO" "$TAG"

          if [ "$PUBLISH_MIRROR" = true ]; then
            export GH_TOKEN="$MIRROR_TOKEN"
            if ! gh release view "$TAG" --repo rollacode/codeterm-releases >/dev/null 2>&1; then
              gh release create "$TAG" --repo rollacode/codeterm-releases \
                --draft --title "CodeTerm $TAG" \
                --notes "Auto-mirrored from rollacode/codeterm. See the source repo for full release notes."
            fi
            node scripts/release-clear-wedged-assets.mjs rollacode/codeterm-releases "$TAG"
          fi

  tests:
    name: full release test matrix
    needs: prepare
    if: needs.prepare.outputs.dry_run != 'true' && needs.prepare.outputs.published != 'true'
    uses: ./.github/workflows/tests.yml
    with:
      source_ref: ${{ needs.prepare.outputs.source_sha }}

  macos-linux-arm64:
    name: macOS + Linux arm64
    needs: prepare
    if: needs.prepare.outputs.published != 'true'
    uses: ./.github/workflows/release-builder.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      source_ref: ${{ needs.prepare.outputs.source_ref }}
      mirror: ${{ needs.prepare.outputs.mirror == 'true' }}
      dry_run: ${{ needs.prepare.outputs.dry_run == 'true' }}
    secrets: inherit

  linux-x86_64:
    name: Linux x86_64
    needs: prepare
    if: needs.prepare.outputs.published != 'true'
    uses: ./.github/workflows/release-linux.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      source_ref: ${{ needs.prepare.outputs.source_ref }}
      mirror: ${{ needs.prepare.outputs.mirror == 'true' }}
      dry_run: ${{ needs.prepare.outputs.dry_run == 'true' }}
    secrets: inherit

  windows:
    name: Windows x64 + arm64
    needs: prepare
    if: needs.prepare.outputs.published != 'true'
    uses: ./.github/workflows/release-windows.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      source_ref: ${{ needs.prepare.outputs.source_ref }}
      mirror: ${{ needs.prepare.outputs.mirror == 'true' }}
      dry_run: ${{ needs.prepare.outputs.dry_run == 'true' }}
    secrets: inherit

  release-manifest:
    name: release manifest, mirror, and verification
    needs: [prepare, macos-linux-arm64, linux-x86_64, windows, tests]
    if: needs.prepare.outputs.dry_run != 'true' && needs.prepare.outputs.published != 'true'
    uses: ./.github/workflows/release-manifest-validate.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      source_ref: ${{ needs.prepare.outputs.source_ref }}
      source_sha: ${{ needs.prepare.outputs.source_sha }}
      mirror: ${{ needs.prepare.outputs.mirror == 'true' }}
    secrets: inherit

  promote:
    name: merge the release into master and develop
    needs: [prepare, release-manifest]
    if: needs.prepare.outputs.branch != '' && needs.prepare.outputs.published != 'true'
    runs-on: [self-hosted, Linux, light]
    env:
      GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
      REPO: ${{ github.repository }}
      BRANCH: ${{ needs.prepare.outputs.branch }}
      TAG: ${{ needs.prepare.outputs.tag }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0
          token: ${{ secrets.GH_RELEASE_TOKEN }}
      - name: Merge the release PR into master
        shell: bash
        run: |
          set -euo pipefail
          pr=$(gh pr list --repo "$REPO" --head "$BRANCH" --base master --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            pr=$(gh pr create --repo "$REPO" --base master --head "$BRANCH" --title "release: ${TAG#v}" \
              --body "Release $TAG, published by the release run." | grep -oE '[0-9]+$')
          fi
          gh pr merge "$pr" --repo "$REPO" --merge
          git fetch origin master
          git merge-base --is-ancestor "$SOURCE_SHA" origin/master
      - name: Merge master back into develop
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          if git ls-remote --exit-code --heads origin develop >/dev/null; then
            git fetch origin develop
            git checkout -B develop origin/develop
            git merge --no-ff origin/master -m "Merge master after $TAG into develop"
          else
            git checkout -B develop origin/master
          fi
          git push origin develop
          git push origin --delete "$BRANCH"
