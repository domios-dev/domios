name: Docs source of truth

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "essences/**"
      - ".agents/skills/**"
      - "prod-docs/**"
      - "src-tauri/prompts/**"
      - "src-tauri/src/prompts.rs"
      - "CLAUDE.md"
      - "AGENTS.md"
      - "scripts/check-*.sh"
      - "evals/**"
      - ".github/workflows/docs-source-of-truth.yml"
  push:
    branches:
      - 'release/**'
      - master
    paths-ignore:
      - '.codeterm/build-machine/**'
      - '.github/workflows/release*.yml'

jobs:
  source-of-truth:
    runs-on: [self-hosted, linux-build]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check API docs
        run: bash scripts/check-api-docs.sh

      - name: Check prompt docs
        run: bash scripts/check-prompts-doc.sh

      - name: Check eval list
        run: bash scripts/check-evals-list.sh

      - name: Warn on docs changes without revision bump
        if: github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          changed="$(git diff --name-only "$base"...HEAD -- 'essences/*.md' 'prod-docs/*.md' || true)"
          [ -n "$changed" ] || exit 0
          missing=0
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            if ! git diff "$base"...HEAD -- "$file" | grep -Eq '<!-- revision: [0-9]+ -->'; then
              echo "::warning file=$file::docs file changed without a revision-tag bump"
              missing=1
            fi
          done <<< "$changed"
          exit "$missing"
