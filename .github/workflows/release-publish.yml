name: Release publication

# Rehearses publication of a green dry run's retained bytes; nothing is rebuilt, re-signed or published.
# Publication itself is the master merge push of the release PR (release.yml). Dispatch from release/next.
"on":
  workflow_dispatch:
    inputs:
      run_id:
        description: Green release.yml dry run whose bytes to publish
        required: true
        type: string
      tag:
        description: Release tag vX.Y.Z (the run's branch must be release/next)
        required: true
        type: string
      rehearsal:
        description: Must stay true; this workflow checks and stages without publishing
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  publish:
    name: publish ${{ inputs.tag }}
    if: ${{ (github.repository_owner == 'rollacode' || github.repository_owner == 'domios-dev') && github.actor == 'rollacode' && github.triggering_actor == 'rollacode' && github.ref == 'refs/heads/release/next' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    environment: release
    runs-on: ${{ fromJSON(vars.CI_LINUX_LIGHT_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 60
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
      CI_STORE_LAN_ENDPOINT: ${{ secrets.CI_STORE_LAN_ENDPOINT }}
      CI_STORE_PUBLIC_ENDPOINT: ${{ secrets.CI_STORE_PUBLIC_ENDPOINT }}
      GH_TOKEN: ${{ github.token }}
      # 1.19 transition mirror: rollacode/codeterm-releases write; delete after 1.19 ships.
      MIRROR_TOKEN: ${{ secrets.PACKAGE_REPOS_TOKEN }}
    steps:
      - name: Use the runner bundled Node
        if: runner.environment == 'self-hosted'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |-
            const path = require('node:path');
            core.addPath(path.dirname(process.execPath));
            core.info('Using runner Node ' + process.version);
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 22.22.0
        if: runner.environment == 'github-hosted'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
      - name: Discover installed runner tools
        if: runner.environment == 'self-hosted'
        run: node scripts/ci-runner-paths.mjs --paths-only
      - name: Resolve the run, tag and mode
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          INPUT_RUN: ${{ inputs.run_id }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_REHEARSAL: ${{ inputs.rehearsal }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = refs/heads/release/next ] || { echo "::error::dispatch from release/next"; exit 1; }
          # One publication path: the master merge push of the release PR. This workflow only rehearses.
          [ "$INPUT_REHEARSAL" = true ] || { echo "::error::publication runs only from the master merge push of the release PR; dispatch with rehearsal=true"; exit 1; }
          run="$INPUT_RUN"; tag="$INPUT_TAG"; mode=rehearsal
          printf 'run=%s\ntag=%s\nmode=%s\n' "$run" "$tag" "$mode" >> "$GITHUB_OUTPUT"
      - name: Publish the retained bytes
        if: steps.plan.outputs.mode != 'skip'
        run: bash scripts/release-publish.sh "${{ steps.plan.outputs.run }}" "${{ steps.plan.outputs.tag }}" "${{ steps.plan.outputs.mode }}"
