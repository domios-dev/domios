name: Release publication

# Publishes the retained bytes of a green release.yml dry run; nothing is rebuilt or re-signed.
# Dispatch from the reviewed release branch; rehearsal changes nothing.
"on":
  workflow_dispatch:
    inputs:
      run_id:
        description: Green release.yml dry run whose bytes to publish
        required: true
        type: string
      tag:
        description: Release tag vX.Y.Z (the run's branch must be release/X.Y.Z)
        required: true
        type: string
      rehearsal:
        description: Check and stage everything without publishing
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  publish:
    name: publish ${{ inputs.tag }}
    if: ${{ (github.repository_owner == 'rollacode' || github.repository_owner == 'domios-dev') && github.actor == 'rollacode' && github.triggering_actor == 'rollacode' && startsWith(github.ref, 'refs/heads/release/') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    environment: release
    runs-on: [self-hosted, linux-build]
    timeout-minutes: 60
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
      GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
      MIRROR_TOKEN: ${{ secrets.PACKAGE_REPOS_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          token: ${{ secrets.GH_RELEASE_TOKEN }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          package-manager-cache: false
          node-version: '22.22.0'
      - name: Resolve the run, tag and mode
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          INPUT_RUN: ${{ inputs.run_id }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_REHEARSAL: ${{ inputs.rehearsal }}
        run: |
          set -euo pipefail
          run="$INPUT_RUN"; tag="$INPUT_TAG"; mode=$([ "$INPUT_REHEARSAL" = true ] && echo rehearsal || echo publish)
          printf 'run=%s\ntag=%s\nmode=%s\n' "$run" "$tag" "$mode" >> "$GITHUB_OUTPUT"
      - name: Publish the retained bytes
        if: steps.plan.outputs.mode != 'skip'
        run: bash scripts/release-publish.sh "${{ steps.plan.outputs.run }}" "${{ steps.plan.outputs.tag }}" "${{ steps.plan.outputs.mode }}"
