name: Release Windows arm64 platform
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Package version (vX.Y.Z)
        required: true
        type: string
      source_ref:
        description: Exact source commit SHA
        required: true
        type: string
      dry_run:
        description: Direct dispatch never publishes
        type: boolean
        default: true
      mirror:
        type: boolean
        default: false
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      source_ref:
        required: true
        type: string
      mirror:
        required: true
        type: boolean
      dry_run:
        required: false
        default: false
        type: boolean
      frontend_sha256:
        description: Digest of the run's single frontend bundle; empty builds the frontend here
        required: false
        default: ""
        type: string
permissions:
  contents: write
  actions: read
jobs:
  compile:
    uses: ./.github/workflows/release-arm64-compile.yml
    secrets:
      DOMIOS_FIREBASE_API_KEY: ${{ secrets.DOMIOS_FIREBASE_API_KEY }}
      DOMIOS_FIREBASE_PROJECT_ID: ${{ secrets.DOMIOS_FIREBASE_PROJECT_ID }}
      DOMIOS_FIREBASE_APP_ID: ${{ secrets.DOMIOS_FIREBASE_APP_ID }}
      DOMIOS_ACCOUNT_REDEEM_URL: ${{ secrets.DOMIOS_ACCOUNT_REDEEM_URL }}
      DOMIOS_BILLING_FUNCTIONS_URL: ${{ secrets.DOMIOS_BILLING_FUNCTIONS_URL }}
      DOMIOS_AMPLITUDE_API_KEY_PROD: ${{ secrets.DOMIOS_AMPLITUDE_API_KEY_PROD }}
    with:
      tag: ${{ inputs.tag }}
      source_ref: ${{ inputs.source_ref }}
      target: aarch64-pc-windows-msvc
      frontend_sha256: ${{ inputs.frontend_sha256 }}
  build:
    name: finalize
    if: ${{ (github.repository_owner == 'rollacode' || github.repository_owner == 'domios-dev') && github.actor == 'rollacode' && github.triggering_actor == 'rollacode' && ((startsWith(github.ref, 'refs/heads/release/') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.path == '.github/workflows/tests.yml' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.actor.login == 'rollacode' && github.event.workflow_run.triggering_actor.login == 'rollacode' && startsWith(github.event.workflow_run.head_branch, 'release/'))) }}
    environment: release
    runs-on:
      - self-hosted
      - ${{ vars.RELEASE_WINDOWS_ARM64_LABEL || 'windows-build' }}
    timeout-minutes: 120
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
      CODETERM_SCCACHE_CREDENTIAL_SOURCE: runner
      CODETERM_SCCACHE_VERIFY_ONLY: "1"
      TARGET: aarch64-pc-windows-msvc
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
      - name: Resolve tag
        id: tag
        shell: pwsh
        run: |
          $name = "${{ inputs.tag }}"
          "name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Detect channel and prerelease flag
        id: channel
        shell: pwsh
        run: |
          $tag = "${{ steps.tag.outputs.name }}"
          if ($tag -like '*-rc*') { $manifest = 'domios-latest-rc.json'; $prerelease = 'true' }
          elseif ($tag -like '*-nightly*') { $manifest = 'domios-latest-nightly.json'; $prerelease = 'true' }
          else { $manifest = 'domios-latest.json'; $prerelease = 'false' }
          "manifest=$manifest"     | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "prerelease=$prerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          package-manager-cache: false
          node-version: 22.22.0
      - name: Runner preflight
        run: node scripts/ci-runner-paths.mjs packaging
      - name: Reset compiler capture
        continue-on-error: true
        run: node -e "require('fs').writeFileSync('ci-rust-warnings.log', '')"
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.32.1
          run_install: false
      - name: Install npm dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile
      - name: Download and verify unsigned arm64 handoff
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |-
          gh run download "$env:GITHUB_RUN_ID" --repo "$env:GITHUB_REPOSITORY" --name "unsigned-aarch64-pc-windows-msvc-$env:GITHUB_RUN_ATTEMPT" --dir "$env:RUNNER_TEMP/hosted-arm64"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/release-arm64-handoff.mjs unpack "$env:TARGET" "${{ inputs.tag }}" "${{ inputs.source_ref }}" "$env:RUNNER_TEMP/hosted-arm64/arm64-handoff.tar" "${{ needs.compile.outputs.sha256 }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Sign transferred updater bundle
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: |-
          Get-ChildItem -File "src-tauri/target/$env:TARGET/release/bundle/nsis" -Filter '*-setup.exe' | ForEach-Object {
            pnpm tauri signer sign --app-version ("${{ inputs.tag }}".Substring(1)) $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          node scripts/release-arm64-handoff.mjs verify "$env:TARGET" "${{ inputs.tag }}" "${{ inputs.source_ref }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Clear incomplete release uploads for retry
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.workflow == 'Release Windows arm64 platform') && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          MIRROR_TOKEN: ${{ secrets.PACKAGE_REPOS_TOKEN }}
          PUBLISH_MIRROR: ${{ inputs.mirror }}
          TAG: ${{ inputs.tag }}
          SOURCE_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          node scripts/release-clear-wedged-assets.mjs "$env:SOURCE_REPO" "$env:TAG" "windows-aarch64"
          if ($env:PUBLISH_MIRROR -eq 'true') {
            $env:GH_TOKEN = $env:MIRROR_TOKEN
            node scripts/release-clear-wedged-assets.mjs rollacode/codeterm-releases "$env:TAG" "windows-aarch64"
          }
      - name: Verify independent headless assets and checksum
        shell: pwsh
        run: |
          node scripts/release-headless-assets.mjs verify "${{ inputs.tag }}" "windows-aarch64" release-artifacts "${{ inputs.source_ref }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke built release bundle
        shell: pwsh
        run: |
          $env:RELEASE_PWSH = (Get-Process -Id $PID).Path
          node scripts/release-bundle-smoke.mjs windows "src-tauri/target/$env:TARGET/release/bundle/nsis" "${{ inputs.source_ref }}" "arm64"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify local updater signature (including dry run)
        env:
          TAG: ${{ inputs.tag }}
          PLATFORM_KEY: windows-aarch64
        shell: pwsh
        run: |
          node scripts/release-verify-windows.mjs "src-tauri/target/$env:TARGET/release/bundle/nsis" "$env:TAG" "$env:PLATFORM_KEY"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain private dry-run updater evidence
        if: ${{ inputs.dry_run }}
        shell: pwsh
        run: |
          node scripts/release-dry-run-manifest.mjs capture "${{ inputs.tag }}" "${{ inputs.source_ref }}" "$env:GITHUB_RUN_ID" `
            "windows-aarch64" "src-tauri/target/$env:TARGET/release/bundle" release-artifacts "$env:RUNNER_TEMP/dry-run-windows-aarch64"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish per-platform updater fragment
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.workflow == 'Release Windows arm64 platform') && !inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
          SOURCE_REPO: ${{ github.repository }}
          MANIFEST_REPO: rollacode/codeterm-releases
          PLATFORM_KEY: windows-aarch64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundleRoot = "src-tauri/target/$env:TARGET/release/bundle"
          Write-Host "::group::bundle directory listing"
          Get-ChildItem -Recurse -File $bundleRoot | ForEach-Object { $_.FullName } | Sort-Object | Write-Host
          Write-Host "::endgroup::"
          $sig = Get-ChildItem -Recurse -File "$bundleRoot/nsis" -Filter '*.nsis.zip.sig' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $sig) { $sig = Get-ChildItem -Recurse -File "$bundleRoot/nsis" -Filter '*-setup.exe.sig' -ErrorAction SilentlyContinue | Select-Object -First 1 }
          if (-not $sig) { Write-Error "No NSIS updater signature under $bundleRoot/nsis"; exit 1 }
          $bundle = $sig.FullName -replace '\.sig$', ''
          if (-not (Test-Path $bundle)) { Write-Error "Bundle missing next to $($sig.FullName)"; exit 1 }

          # With createUpdaterArtifacts=true, Tauri v2 reuses the NSIS .exe
          # as the updater bundle; v1Compatible builds emit .nsis.zip. The .sig
          # is NOT uploaded — the updater reads its signature from domios-latest.json.

          # Fragment URL points at the public MIRROR repo (where the asset is mirrored
          # to and the updater fetches from), not the private source release.
          $ver = "$env:TAG" -replace '^v', ''
          $bname = Split-Path $bundle -Leaf
          $url = "https://github.com/$env:MANIFEST_REPO/releases/download/$env:TAG/$bname"
          $sigText = (Get-Content -Raw $sig.FullName).Trim()
          $pub = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $platforms = [ordered]@{}
          $platforms["$env:PLATFORM_KEY"] = [ordered]@{ url = $url; signature = $sigText }
          $fragment = [ordered]@{
            version   = $ver
            notes     = "See the assets to download this version and install."
            pub_date  = $pub
            platforms = $platforms
          }
          $out = "updater-$env:TARGET.json"
          $fragment | ConvertTo-Json -Depth 6 | Set-Content -Path $out -Encoding utf8
          Write-Host "Wrote $out for $env:PLATFORM_KEY -> $bname"
          node scripts/verify-updater-manifest.mjs --manifest "$out" --local (Split-Path $bundle -Parent) --require-version "$ver" --require-platform "$env:PLATFORM_KEY"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release upload "$env:TAG" "$bundle" "$out" --clobber --repo "$env:SOURCE_REPO"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Mirror to public release repo
        if: ${{ inputs.mirror && !(github.event_name == 'workflow_dispatch' && github.workflow == 'Release Windows arm64 platform') && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_REPOS_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
          MIRROR_REPO: rollacode/codeterm-releases
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundleRoot = "src-tauri/target/$env:TARGET/release/bundle"
          $sig = Get-ChildItem -Recurse -File "$bundleRoot/nsis" -Filter '*.nsis.zip.sig' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $sig) { $sig = Get-ChildItem -Recurse -File "$bundleRoot/nsis" -Filter '*-setup.exe.sig' -ErrorAction SilentlyContinue | Select-Object -First 1 }
          if (-not $sig) { Write-Error "No NSIS updater signature under $bundleRoot/nsis"; exit 1 }
          $bundle = $sig.FullName -replace '\.sig$', ''
          if (-not (Test-Path $bundle)) { Write-Error "Bundle missing next to $($sig.FullName)"; exit 1 }

          gh release view "$env:TAG" --repo "$env:MIRROR_REPO" | Out-Null

          gh release upload "$env:TAG" "$bundle" --clobber --repo "$env:MIRROR_REPO"
      - name: Publish and read back headless source assets
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.workflow == 'Release Windows arm64 platform') && !inputs.dry_run }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/release-headless-assets.mjs publish "${{ inputs.tag }}" "windows-aarch64" release-artifacts "${{ inputs.source_ref }}" "${{ github.repository }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish and read back headless mirror assets
        if: ${{ inputs.mirror && !(github.event_name == 'workflow_dispatch' && github.workflow == 'Release Windows arm64 platform') && !inputs.dry_run }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_REPOS_TOKEN }}
        run: |
          node scripts/release-headless-assets.mjs publish "${{ inputs.tag }}" "windows-aarch64" release-artifacts "${{ inputs.source_ref }}" rollacode/codeterm-releases
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: ./.github/actions/rust-warnings
        if: always()
        continue-on-error: true
        with:
          complete: ${{ job.status == 'success' }}
          platform: release-Windows
          target: aarch64-pc-windows-msvc
      - name: Upload artifacts spooled while the private store was unreachable
        if: always()
        uses: ./.github/actions/ci-artifact-spool
      - name: Retain hosted handoff and final stage proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: finalized-handoff-aarch64-pc-windows-msvc-${{ github.run_attempt }}
          path: |-
            release-artifacts/hosted-handoff-aarch64-pc-windows-msvc.json
            release-artifacts/common-stage/aarch64-pc-windows-msvc/headless-stage.json
          if-no-files-found: error
          retention-days: 7
      - name: Remove this job's Rust targets and archives
        if: always()
        continue-on-error: true
        run: node scripts/ci-workspace-cleanup.mjs
    needs: compile
