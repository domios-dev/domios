name: tests-fast

# Normal CI finishes sibling tests; cancellation is an explicit diagnostic option.

on:
  workflow_call:
    inputs:
      source_ref:
        description: Exact source SHA; empty tests the triggering ref
        required: false
        default: ''
        type: string
      scope:
        description: full for qualification, frontend for frontend checks, fast for diagnostic contracts
        required: false
        default: full
        type: string
      cancel_run:
        description: Explicit fail-fast diagnostics; normal CI finishes every test job
        required: false
        default: false
        type: boolean
      artifacts_optional:
        description: Dry runs keep going when artifact storage refuses an upload
        required: false
        default: false
        type: boolean
    outputs:
      source_sha:
        description: Exact tested source
        value: ${{ jobs.changed.outputs.source_sha }}
      resolved_scope:
        description: Shared scope decision for the Rust tier
        value: ${{ toJSON(jobs.changed.outputs) }}
      heavy:
        description: The Rust build scope ran; empty when the scope gate skipped
        value: ${{ jobs.changed.outputs.heavy }}

permissions:
  contents: read
  pull-requests: write

env:
  CI_CANCEL_RUN: ${{ inputs.cancel_run }}
  CI_SOURCE_SHA: ${{ inputs.source_ref || github.sha }}
  GH_TOKEN: ${{ github.token }}
  CODETERM_SCCACHE_CREDENTIAL_SOURCE: runner
  # Builders are shared with agents; a CI job queues for the slot instead of failing busy (75).
  CODETERM_BUILD_GATEWAY_MODE: queue
  CODETERM_SCCACHE_VERIFY_ONLY: '1'

jobs:
  # A push whose tree equals a parent's tree introduces nothing that parent had
  # not already carried through its own pull request, so the matrix would retest
  # an identical tree. Concurrency cannot see that: the merge is a new commit.
  # A real three-way merge matches no parent and still runs.
  #
  # Push only. A pull_request checks out refs/pull/N/merge, whose parents are the
  # base tip and the PR head; with an unmoved base its tree equals the head tree,
  # and skipping there would skip the one run that has never happened.
  changed:
    name: tree is new
    # A release branch's push already runs these checks on the exact SHA in release.yml.
    if: ${{ (github.repository_owner == 'rollacode' || github.repository_owner == 'domios-dev') && github.actor == 'rollacode' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release/')) }}
    # Every job waits on this gate, so any free light runner takes it.
    runs-on: ${{ vars.CI_LINUX_LIGHT_RUNNER || 'ubuntu-24.04' }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      frontend: ${{ steps.tree.outputs.run == 'true' && steps.scope.outputs.frontend == 'true' }}
      rust: ${{ steps.tree.outputs.run == 'true' && steps.scope.outputs.rust == 'true' }}
      heavy: ${{ steps.tree.outputs.run == 'true' && steps.scope.outputs.heavy == 'true' }}
      plugins: ${{ steps.tree.outputs.run == 'true' && steps.scope.outputs.plugins || '[]' }}
    env:
      DOMIOS_CI_WEBHOOK_URL: ${{ !((vars.CI_LINUX_LIGHT_RUNNER || 'ubuntu-24.04') == 'ubuntu-24.04') && secrets.DOMIOS_CI_WEBHOOK_URL || '' }}
      DOMIOS_CI_WEBHOOK_TOKEN: ${{ !((vars.CI_LINUX_LIGHT_RUNNER || 'ubuntu-24.04') == 'ubuntu-24.04') && secrets.DOMIOS_CI_WEBHOOK_TOKEN || '' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
      CI_STORE_LAN_ENDPOINT: ${{ secrets.CI_STORE_LAN_ENDPOINT }}
      CI_STORE_PUBLIC_ENDPOINT: ${{ secrets.CI_STORE_PUBLIC_ENDPOINT }}
      DOMIOS_FIREBASE_API_KEY: ${{ !((vars.CI_LINUX_LIGHT_RUNNER || 'ubuntu-24.04') == 'ubuntu-24.04') && secrets.DOMIOS_FIREBASE_API_KEY || '' }}
      DOMIOS_FIREBASE_PROJECT_ID: ${{ !((vars.CI_LINUX_LIGHT_RUNNER || 'ubuntu-24.04') == 'ubuntu-24.04') && secrets.DOMIOS_FIREBASE_PROJECT_ID || '' }}
      DOMIOS_FIREBASE_APP_ID: ${{ !((vars.CI_LINUX_LIGHT_RUNNER || 'ubuntu-24.04') == 'ubuntu-24.04') && secrets.DOMIOS_FIREBASE_APP_ID || '' }}
      DOMIOS_ACCOUNT_REDEEM_URL: ${{ !((vars.CI_LINUX_LIGHT_RUNNER || 'ubuntu-24.04') == 'ubuntu-24.04') && secrets.DOMIOS_ACCOUNT_REDEEM_URL || '' }}
      DOMIOS_BILLING_FUNCTIONS_URL: ${{ !((vars.CI_LINUX_LIGHT_RUNNER || 'ubuntu-24.04') == 'ubuntu-24.04') && secrets.DOMIOS_BILLING_FUNCTIONS_URL || '' }}
      CI_HOSTED: ${{ (vars.CI_LINUX_LIGHT_RUNNER || 'ubuntu-24.04') == 'ubuntu-24.04' }}
      CI_ARTIFACT_STORAGE: ''
    steps:
      - name: Use the runner bundled Node
        if: runner.environment == 'self-hosted'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |-
            const path = require('node:path');
            core.addPath(path.dirname(process.execPath));
            core.info('Using runner Node ' + process.version);
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        id: ci-4
        with:
          package-manager-cache: false
          node-version: 22.22.0
        if: runner.environment == 'github-hosted'
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        id: ci-1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 2
      - name: Discover installed runner tools
        if: runner.environment == 'self-hosted'
        run: node scripts/ci-runner-paths.mjs --paths-only
      - name: Runner preflight
        run: node scripts/ci-runner-paths.mjs bash,git,node
      - &cancel-run-on-failure
        name: Notify and cancel on first failure
        if: failure() && inputs.cancel_run
        continue-on-error: true
        env:
          CI_FAILURE_STEPS: ${{ toJSON(steps) }}
          CI_SOURCE_SHA: ${{ env.CI_SOURCE_SHA }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |-
            try {
              const {pathToFileURL} = require('node:url');
              const api = await import(pathToFileURL(process.env.GITHUB_WORKSPACE + '/scripts/ci-workflow-api.mjs').href);
              const {firstFailure} = await import(pathToFileURL(process.env.GITHUB_WORKSPACE + '/scripts/ci-first-failure.mjs').href);
              const steps = JSON.parse(process.env.CI_FAILURE_STEPS || '{}');
              const step = Object.entries(steps).find(([,value]) => value.outcome === 'failure')?.[0];
              await firstFailure(step ? {step} : {}, {cancel: () => api.cancelWorkflow(github, context)});
            } catch (error) {
              core.warning('Failure details unavailable: ' + error.message);
              await github.rest.actions.cancelWorkflowRun({...context.repo,run_id:context.runId});
            }
      - id: source
        shell: bash
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "CI_SOURCE_SHA=$sha" >> "$GITHUB_ENV"
      - *cancel-run-on-failure
      - id: tree
        env:
          CI_RELEASE_CALL: true
        shell: bash
        run: |
          set -euo pipefail
          if [ "$CI_RELEASE_CALL" = true ] || [ "${{ github.event_name }}" != push ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tree=$(git rev-parse 'HEAD^{tree}')
          for parent in $(git rev-parse 'HEAD^@'); do
            if [ "$(git rev-parse "$parent^{tree}")" = "$tree" ]; then
              echo "HEAD tree $tree already carried by parent $parent"
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "run=true" >> "$GITHUB_OUTPUT"

      - *cancel-run-on-failure
      - id: scope
        if: steps.tree.outputs.run == 'true'
        env:
          CI_FULL_MATRIX: ${{ inputs.scope != 'frontend' }}
          CI_FRONTEND_ONLY: ${{ inputs.source_ref != '' && inputs.scope == 'frontend' }}
          CI_FAST_ONLY: false
          CI_FAST_DISPATCH: ${{ github.event_name == 'workflow_dispatch' && inputs.scope == 'fast' }}
        run: node scripts/ci-scope.mjs HEAD^ HEAD

      # Guards remain required by the reusable tier while sibling checks run in parallel.
      - *cancel-run-on-failure
  guards:
    name: script tests and rustfmt
    needs: changed
    # The Node and Python release contracts assume Linux paths (macOS /var is a symlink).
    if: ${{ (github.repository_owner == 'rollacode' || github.repository_owner == 'domios-dev') && github.actor == 'rollacode' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release/')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
    timeout-minutes: 20
    env:
      CI_SOURCE_SHA: ${{ needs.changed.outputs.source_sha || github.sha }}
      CI_HOSTED: "true"
      CODETERM_USE_SCCACHE: "0"
      CODETERM_SCCACHE_VERIFY_ONLY: "0"
      CI_ARTIFACT_STORAGE: github
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        id: ci-2
        with:
          package-manager-cache: false
          node-version: 22.22.0
        if: runner.environment == 'github-hosted'
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
        if: runner.environment == 'github-hosted'
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        id: ci-1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 1
      - name: Hosted pnpm prerequisite
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.32.1
          run_install: false
          dest: ${{ runner.tool_cache }}/setup-pnpm
        if: runner.environment == 'github-hosted'
      - name: Install pinned nextest prerequisite
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8
        with:
          tool: cargo-nextest@0.9.148
        if: runner.environment == 'github-hosted'
      - name: Install pinned Python test dependencies
        run: node scripts/ci-python-env.mjs
      - name: Provision the pinned hosted Rust toolchain
        if: runner.environment == 'github-hosted'
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: 1.99.1
          components: clippy,rustfmt
      - name: Runner preflight
        run: node scripts/ci-runner-paths.mjs bash,cargo,git,nextest,node,pnpm,python,python:yaml
      - *cancel-run-on-failure
      - &select-pr-catalogue
        name: Select PR catalogue
        id: catalogue
        shell: bash
        run: |
          node scripts/test-catalogue.mjs select --tier pr --format json > "$RUNNER_TEMP/pr-catalogue.json"
          node -e 'const fs = require("node:fs"); const selected = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/pr-catalogue.json", "utf8")); fs.appendFileSync(process.env.GITHUB_OUTPUT, "commands=" + JSON.stringify(Object.fromEntries(selected.runners.map(entry => [entry.id, entry.runner]))) + "\n");'
        if: "!cancelled()"
      - *cancel-run-on-failure
      - *cancel-run-on-failure
      - name: Plugin release contracts
        id: ci-6
        if: ${{ !cancelled() }}
        run: node scripts/ci-step.mjs plugin-release-contracts --ci
      - *cancel-run-on-failure
      - *cancel-run-on-failure
      # Gateway race and serial suites run locally through build.sh script-guards; policy covers release signing.
      - *cancel-run-on-failure
      - name: Build gateway and release signing policy
        id: ci-9
        if: ${{ !cancelled() }}
        run: |
          bash scripts/check-build-gateway-policy.sh
      - *cancel-run-on-failure
      - name: cargo fmt --check
        id: ci-10
        if: ${{ !cancelled() && needs.changed.outputs.rust == 'true' }}
        run: node scripts/ci-step.mjs rust-fmt --ci
      # Release shards run tests from an archive extracted on another machine.
      - *cancel-run-on-failure
      - *cancel-run-on-failure
      - name: Install dependencies
        id: ci-13
        if: ${{ !cancelled() && needs.changed.outputs.rust == 'true' }}
        # Runners on one host share HOME; a per-runner store keeps concurrent installs apart.
        run: pnpm install --frozen-lockfile --store-dir "$RUNNER_TOOL_CACHE/pnpm-store"
      - *cancel-run-on-failure
      - name: Node script tests (tests/catalogue.json node-script-tests)
        id: ci-14
        if: ${{ !cancelled() && needs.changed.outputs.rust == 'true' }}
        run: node scripts/ci-step.mjs node-script-tests --ci
      - *cancel-run-on-failure
      - name: Python script tests (tests/catalogue.json python-script-tests)
        id: ci-15
        if: ${{ !cancelled() && needs.changed.outputs.rust == 'true' }}
        run: node scripts/ci-step.mjs python-script-tests --ci
      - *cancel-run-on-failure
      - name: Offline core journey contracts
        id: ci-16
        if: ${{ !cancelled() && needs.changed.outputs.rust == 'true' }}
        run: node scripts/ci-step.mjs core-journeys-offline --ci

      - *cancel-run-on-failure
  plugins:
    name: plugin (${{ matrix.plugin.id }})
    needs: changed
    if: ${{ (github.repository_owner == 'rollacode' || github.repository_owner == 'domios-dev') && github.actor == 'rollacode' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release/')) && (needs.changed.outputs.plugins != '[]') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.changed.outputs.plugins) }}
    env:
      CI_SOURCE_SHA: ${{ needs.changed.outputs.source_sha || github.sha }}
      CODETERM_USE_SCCACHE: "0"
      RUSTC_WRAPPER: ""
      CI_CANCEL_RUN: "false"
      CODETERM_SCCACHE_VERIFY_ONLY: "0"
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        id: ci-2
        with:
          package-manager-cache: false
          node-version: 22.22.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        id: ci-1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        id: ci-3
        with:
          version: 10.32.1
          run_install: false
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - name: Runner preflight
        run: node scripts/ci-runner-paths.mjs bash,git,node,pnpm
      - run: pnpm install --frozen-lockfile --store-dir "$RUNNER_TOOL_CACHE/pnpm-store"
        id: ci-4
      - *select-pr-catalogue
      - id: ci-6
        env:
          PLUGIN_ID: ${{ matrix.plugin.id }}
        shell: bash
        run: node scripts/ci-step.mjs plugin-check --ci --plugin-id "$PLUGIN_ID"
  ts-static:
    name: ts static checks
    needs: changed
    if: ${{ (github.repository_owner == 'rollacode' || github.repository_owner == 'domios-dev') && github.actor == 'rollacode' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release/')) && (needs.changed.outputs.frontend == 'true') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 15
    env:
      CI_SOURCE_SHA: ${{ needs.changed.outputs.source_sha || github.sha }}
      CODETERM_USE_SCCACHE: "0"
      RUSTC_WRAPPER: ""
      CI_CANCEL_RUN: "false"
      CODETERM_SCCACHE_VERIFY_ONLY: "0"
    steps:
      - name: Setup Node.js
        id: ci-2
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          package-manager-cache: false
          node-version: 22.22.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        id: ci-1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 1
      - name: Setup pnpm
        id: ci-3
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.32.1
          run_install: false
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - name: Runner preflight
        run: node scripts/ci-runner-paths.mjs bash,git,node,pnpm
      - name: Install dependencies
        id: ci-4
        # Runners on one host share HOME; a per-runner store keeps concurrent installs apart.
        run: pnpm install --frozen-lockfile --store-dir "$RUNNER_TOOL_CACHE/pnpm-store"
      - *select-pr-catalogue
      - name: TypeScript unused exports
        id: ci-6
        if: ${{ !cancelled() }}
        run: node scripts/ci-step.mjs ts-unused-exports --ci
      - name: Repository Knip report
        id: ci-7
        if: ${{ !cancelled() }}
        run: node scripts/ci-step.mjs ts-knip-report --ci
      - name: Check API effect dependencies
        id: ci-8
        if: ${{ !cancelled() }}
        run: node scripts/ci-step.mjs ts-api-effects --ci
      - name: Biome (TS lint)
        id: ci-9
        if: ${{ !cancelled() }}
        run: node scripts/ci-step.mjs ts-biome --ci
  frontend-dist:
    name: frontend producer
    needs: changed
    if: ${{ (github.repository_owner == 'rollacode' || github.repository_owner == 'domios-dev') && github.actor == 'rollacode' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release/')) && (needs.changed.outputs.frontend == 'true' || needs.changed.outputs.rust == 'true') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 15
    env:
      CI_SOURCE_SHA: ${{ needs.changed.outputs.source_sha || github.sha }}
      CODETERM_USE_SCCACHE: "0"
      RUSTC_WRAPPER: ""
      CI_CANCEL_RUN: "false"
      CODETERM_SCCACHE_VERIFY_ONLY: "0"
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        id: ci-2
        with:
          package-manager-cache: false
          node-version: 22.22.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        id: ci-1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        id: ci-3
        with:
          version: 10.32.1
          run_install: false
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - name: Runner preflight
        run: node scripts/ci-runner-paths.mjs bash,git,node,pnpm
      - name: Install dependencies
        id: ci-4
        run: pnpm install --frozen-lockfile --store-dir "$RUNNER_TOOL_CACHE/pnpm-store"
      - *select-pr-catalogue
      - name: Build and typecheck frontend
        id: ci-6
        run: node scripts/ci-step.mjs ts-typecheck --ci

  ts-types:
    name: ts generated types
    needs: changed
    if: ${{ (github.repository_owner == 'rollacode' || github.repository_owner == 'domios-dev') && github.actor == 'rollacode' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release/')) && (needs.changed.outputs.frontend == 'true' || needs.changed.outputs.rust == 'true') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 20
    env:
      CI_SOURCE_SHA: ${{ needs.changed.outputs.source_sha || github.sha }}
      CODETERM_USE_SCCACHE: "0"
      RUSTC_WRAPPER: ""
      CI_CANCEL_RUN: "false"
      CODETERM_SCCACHE_VERIFY_ONLY: "0"
    steps:
      - name: Setup Node.js
        id: ci-3
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          package-manager-cache: false
          node-version: 22.22.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        id: ci-1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 1
      - name: Setup pnpm
        id: ci-4
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.32.1
          run_install: false
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - name: Provision the pinned hosted Rust toolchain
        if: runner.environment == 'github-hosted'
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: 1.99.1
          components: clippy,rustfmt
      - name: Runner preflight
        run: node scripts/ci-runner-paths.mjs bash,cargo,git,node,pnpm
      - name: Install dependencies
        id: ci-5
        # Runners on one host share HOME; a per-runner store keeps concurrent installs apart.
        run: pnpm install --frozen-lockfile --store-dir "$RUNNER_TOOL_CACHE/pnpm-store"
      - *select-pr-catalogue
      - name: Reset compiler capture
        id: ci-7
        continue-on-error: true
        run: node -e "require('fs').writeFileSync('ci-rust-warnings.log', '')"
      - name: Check Rust generated TypeScript types
        id: ci-8
        run: node scripts/collect-rust-warnings.mjs run --log ci-rust-warnings.log -- node scripts/ci-step.mjs ts-generated-types --ci
      - name: Collect hosted compiler warnings
        if: always()
        continue-on-error: true
        run: node scripts/ci-rust-warning-artifact.mjs collect
        env:
          WARNING_PLATFORM: types-${{ runner.os }}
          WARNING_TARGET: ${{ runner.os == 'macOS' && (runner.arch == 'ARM64' && 'aarch64-apple-darwin' || 'x86_64-apple-darwin') || runner.os == 'Windows' && 'x86_64-pc-windows-msvc' || 'x86_64-unknown-linux-gnu' }}
          WARNING_COMPLETE: ${{ job.status == 'success' }}
          WARNING_INPUT: ci-rust-warnings.log
      - &release-job-cache
        name: Stop this job's local compile cache
        if: always()
        shell: bash
        run: bash build.sh cache-release
      - &clean-job-outputs
        name: Remove job archives and sweep old Rust targets
        if: always()
        continue-on-error: true
        run: node scripts/ci-workspace-cleanup.mjs
      - name: Retain hosted warning evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hosted-rust-warnings-ts-types
          path: ci-rust-warnings/*.json
          if-no-files-found: error
          retention-days: 3

  ts-unit:
    name: ts unit (${{ matrix.shard }}/4)
    needs: changed
    # Every file boots its own Node, tsx and jsdom, about 3 s each; four runners split the suite.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    if: ${{ (github.repository_owner == 'rollacode' || github.repository_owner == 'domios-dev') && github.actor == 'rollacode' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release/')) && (needs.changed.outputs.frontend == 'true') }}
