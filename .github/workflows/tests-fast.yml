name: tests-fast

# Fast tier: guards, clippy and the TypeScript checks; the first failure can cancel the calling run.

on:
  workflow_call:
    inputs:
      source_ref:
        description: Exact source SHA; empty tests the triggering ref
        required: false
        default: ''
        type: string
      scope:
        description: full for an app release (every platform), frontend for a frontend release
        required: false
        default: full
        type: string
      cancel_run:
        description: A failed fast check cancels the calling run at once
        required: false
        default: false
        type: boolean
      artifacts_optional:
        description: Dry runs keep going when artifact storage refuses an upload
        required: false
        default: false
        type: boolean
    outputs:
      source_sha:
        description: Exact tested source
        value: ${{ jobs.changed.outputs.source_sha }}
      resolved_scope:
        description: Shared scope decision for the Rust tier
        value: ${{ toJSON(jobs.changed.outputs) }}
      heavy:
        description: The Rust build scope ran; empty when the scope gate skipped
        value: ${{ jobs.changed.outputs.heavy }}

permissions:
  contents: read
  pull-requests: write

env:
  CI_CANCEL_RUN: ${{ inputs.cancel_run }}
  CI_SOURCE_SHA: ${{ inputs.source_ref || github.sha }}
  GH_TOKEN: ${{ github.token }}
  CODETERM_SCCACHE_CREDENTIAL_SOURCE: runner
  # Builders are shared with agents; a CI job queues for the slot instead of failing busy (75).
  CODETERM_BUILD_GATEWAY_MODE: queue
  CODETERM_SCCACHE_VERIFY_ONLY: '1'

jobs:
  # A push whose tree equals a parent's tree introduces nothing that parent had
  # not already carried through its own pull request, so the matrix would retest
  # an identical tree. Concurrency cannot see that: the merge is a new commit.
  # A real three-way merge matches no parent and still runs.
  #
  # Push only. A pull_request checks out refs/pull/N/merge, whose parents are the
  # base tip and the PR head; with an unmoved base its tree equals the head tree,
  # and skipping there would skip the one run that has never happened.
  changed:
    name: tree is new
    # A release branch's push already runs these checks on the exact SHA in release.yml.
    if: ${{ github.repository == 'rollacode/codeterm' && github.actor == 'rollacode' && github.event_name != 'pull_request' && github.event_name != 'pull_request_target' }}
    # Every job waits on this gate, so any free light runner takes it.
    environment: ci
    runs-on: [self-hosted, Linux, light, host-ubunta]
    permissions:
      contents: read
      actions: write
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      frontend: ${{ steps.tree.outputs.run == 'true' && steps.scope.outputs.frontend == 'true' }}
      rust: ${{ steps.tree.outputs.run == 'true' && steps.scope.outputs.rust == 'true' }}
      heavy: ${{ steps.tree.outputs.run == 'true' && steps.scope.outputs.heavy == 'true' }}
      plugins: ${{ steps.tree.outputs.run == 'true' && steps.scope.outputs.plugins || '[]' }}
    env:
      DOMIOS_CI_WEBHOOK_URL: ${{ secrets.DOMIOS_CI_WEBHOOK_URL }}
      DOMIOS_CI_WEBHOOK_TOKEN: ${{ secrets.DOMIOS_CI_WEBHOOK_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
      DOMIOS_FIREBASE_API_KEY: ${{ secrets.DOMIOS_FIREBASE_API_KEY }}
      DOMIOS_FIREBASE_PROJECT_ID: ${{ secrets.DOMIOS_FIREBASE_PROJECT_ID }}
      DOMIOS_FIREBASE_APP_ID: ${{ secrets.DOMIOS_FIREBASE_APP_ID }}
      DOMIOS_ACCOUNT_REDEEM_URL: ${{ secrets.DOMIOS_ACCOUNT_REDEEM_URL }}
      DOMIOS_BILLING_FUNCTIONS_URL: ${{ secrets.DOMIOS_BILLING_FUNCTIONS_URL }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        id: ci-1
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          fetch-depth: 2
      - &cancel-run-on-failure
        name: Notify and cancel on first failure
        if: failure() && inputs.cancel_run
        continue-on-error: true
        shell: bash
        env:
          CI_FAILURE_STEPS: ${{ toJSON(steps) }}
          CI_SOURCE_SHA: ${{ needs.changed.outputs.source_sha || steps.source.outputs.sha || github.sha }}
        run: |
          node "$GITHUB_WORKSPACE/scripts/ci-first-failure.mjs" || gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" || true
      - id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - *cancel-run-on-failure
      - id: tree
        env:
          CI_RELEASE_CALL: ${{ inputs.source_ref != '' || github.event_name == 'push' && (github.ref_name == 'develop' || github.ref_name == 'rename/domios') || github.event_name == 'schedule' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$CI_RELEASE_CALL" = true ] || [ "${{ github.event_name }}" != push ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tree=$(git rev-parse 'HEAD^{tree}')
          for parent in $(git rev-parse 'HEAD^@'); do
            if [ "$(git rev-parse "$parent^{tree}")" = "$tree" ]; then
              echo "HEAD tree $tree already carried by parent $parent"
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "run=true" >> "$GITHUB_OUTPUT"

      - *cancel-run-on-failure
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        id: ci-4
        if: steps.tree.outputs.run == 'true'
        with:
          package-manager-cache: false
          node-version: '22.22.0'

      - *cancel-run-on-failure
      - id: scope
        if: steps.tree.outputs.run == 'true'
        env:
          CI_FULL_MATRIX: ${{ inputs.scope != 'frontend' && (inputs.source_ref != '' || github.event_name == 'push' || github.event_name == 'schedule') }}
          CI_FRONTEND_ONLY: ${{ inputs.source_ref != '' && inputs.scope == 'frontend' }}
          CI_FAST_ONLY: ${{ github.event_name == 'pull_request' }}
        run: node scripts/ci-scope.mjs HEAD^ HEAD

  # Guards remain required by the reusable tier while sibling checks run in parallel.
      - *cancel-run-on-failure
  guards:
    name: guards
    needs: changed
    # The Node and Python release contracts assume Linux paths (macOS /var is a symlink).
    if: ${{ github.repository == 'rollacode/codeterm' && github.actor == 'rollacode' && github.event_name != 'pull_request' && github.event_name != 'pull_request_target' }}
    environment: ci
    # BLACKSTAR WSL is idle until the Rust tier starts; the Ubuntu host compiles during the fast tier.
    runs-on: [self-hosted, Linux, light, host-blackstar]
    permissions:
      contents: read
      actions: write
    timeout-minutes: 8
    env:
      DOMIOS_CI_WEBHOOK_URL: ${{ secrets.DOMIOS_CI_WEBHOOK_URL }}
      DOMIOS_CI_WEBHOOK_TOKEN: ${{ secrets.DOMIOS_CI_WEBHOOK_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
      DOMIOS_FIREBASE_API_KEY: ${{ secrets.DOMIOS_FIREBASE_API_KEY }}
      DOMIOS_FIREBASE_PROJECT_ID: ${{ secrets.DOMIOS_FIREBASE_PROJECT_ID }}
      DOMIOS_FIREBASE_APP_ID: ${{ secrets.DOMIOS_FIREBASE_APP_ID }}
      DOMIOS_ACCOUNT_REDEEM_URL: ${{ secrets.DOMIOS_ACCOUNT_REDEEM_URL }}
      DOMIOS_BILLING_FUNCTIONS_URL: ${{ secrets.DOMIOS_BILLING_FUNCTIONS_URL }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        id: ci-1
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - *cancel-run-on-failure
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        id: ci-2
        with:
          package-manager-cache: false
          node-version: '22.22.0'
      - *cancel-run-on-failure
      - &select-pr-catalogue
        name: Select PR catalogue
        id: catalogue
        shell: bash
        run: |
          node scripts/test-catalogue.mjs select --tier pr --format json > "$RUNNER_TEMP/pr-catalogue.json"
          node -e 'const fs = require("node:fs"); const selected = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/pr-catalogue.json", "utf8")); fs.appendFileSync(process.env.GITHUB_OUTPUT, "commands=" + JSON.stringify(Object.fromEntries(selected.runners.map(entry => [entry.id, entry.runner]))) + "\n");'
      - *cancel-run-on-failure
      - name: Source file size discipline
        id: ci-4
        run: bash scripts/check-file-sizes.sh --fail
      - *cancel-run-on-failure
      - name: Installed application identity
        id: ci-5
        if: ${{ !cancelled() }}
        run: node scripts/check-installed-identity.mjs
      - *cancel-run-on-failure
      - name: Plugin release contracts
        id: ci-6
        if: ${{ !cancelled() }}
        run: ${{ fromJSON(steps.catalogue.outputs.commands)['plugin-release-contracts'] }}
      - *cancel-run-on-failure
      - name: Plugin release and scope script tests
        id: ci-7
        if: ${{ !cancelled() }}
        run: node --test scripts/tests/plugin-releases.test.mjs scripts/tests/ci-scope.test.mjs
      # Light services can miss the runner user's rustup on PATH.
      - *cancel-run-on-failure
      - name: Ensure Rust toolchain on PATH
        id: ci-8
        if: ${{ !cancelled() }}
        run: |
          if command -v cargo >/dev/null 2>&1; then exit 0; fi
          for dir in "${CARGO_HOME:-}/bin" "$HOME/.cargo/bin" /home/*/.cargo/bin /Users/*/.cargo/bin; do
            if [ -x "$dir/cargo" ]; then echo "$dir" >> "$GITHUB_PATH"; exit 0; fi
          done
          echo "cargo not found; restore Rust on the runner" >&2
          exit 1
      # POSIX-only fixtures that a Windows release-preflight cannot run; policy also covers release signing.
      - *cancel-run-on-failure
      - name: Build gateway guards and serial gateway script tests
        id: ci-9
        if: ${{ !cancelled() }}
        run: |
          bash scripts/check-build-gateway-serialization.sh
          bash scripts/check-build-gateway-policy.sh
          bash scripts/check-build-gateway-mutex-cleanup.sh
          node scripts/test-catalogue.mjs run --entry node-script-tests-serial
      - *cancel-run-on-failure
      - name: cargo fmt --check
        id: ci-10
        if: ${{ !cancelled() && needs.changed.outputs.rust == 'true' }}
        run: ${{ fromJSON(steps.catalogue.outputs.commands)['rust-fmt'] }}
      # Release shards run tests from an archive extracted on another machine.
      - *cancel-run-on-failure
      - name: Archive-portable Rust test paths
        id: ci-11
        if: ${{ !cancelled() && needs.changed.outputs.rust == 'true' }}
        run: node scripts/check-archive-portable-test-paths.mjs
      - *cancel-run-on-failure
      - name: Setup pnpm
        id: ci-12
        if: ${{ !cancelled() && needs.changed.outputs.rust == 'true' }}
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.32.1
          run_install: false
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - *cancel-run-on-failure
      - name: Install dependencies
        id: ci-13
        if: ${{ !cancelled() && needs.changed.outputs.rust == 'true' }}
        # Runners on one host share HOME; a per-runner store keeps concurrent installs apart.
        run: pnpm install --frozen-lockfile --store-dir "$RUNNER_TOOL_CACHE/pnpm-store"
      - *cancel-run-on-failure
      - name: Node script tests (tests/catalogue.json node-script-tests)
        id: ci-14
        if: ${{ !cancelled() && needs.changed.outputs.rust == 'true' }}
        run: ${{ fromJSON(steps.catalogue.outputs.commands)['node-script-tests'] }}
      - *cancel-run-on-failure
      - name: Python script tests (tests/catalogue.json python-script-tests)
        id: ci-15
        if: ${{ !cancelled() && needs.changed.outputs.rust == 'true' }}
        run: ${{ fromJSON(steps.catalogue.outputs.commands)['python-script-tests'] }}
      - *cancel-run-on-failure
      - name: Offline core journey contracts
        id: ci-16
        if: ${{ !cancelled() && needs.changed.outputs.rust == 'true' }}
        run: ${{ fromJSON(steps.catalogue.outputs.commands)['core-journeys-offline'] }}

      - *cancel-run-on-failure
  plugins:
    name: plugin (${{ matrix.plugin.id }})
    needs: changed
    if: ${{ github.repository == 'rollacode/codeterm' && github.actor == 'rollacode' && github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (needs.changed.outputs.plugins != '[]') }}
    environment: ci
    runs-on: [self-hosted, Linux, linux-build, host-ubunta]
    permissions:
      contents: read
      actions: write
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.changed.outputs.plugins) }}
    env:
      DOMIOS_CI_WEBHOOK_URL: ${{ secrets.DOMIOS_CI_WEBHOOK_URL }}
      DOMIOS_CI_WEBHOOK_TOKEN: ${{ secrets.DOMIOS_CI_WEBHOOK_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
      DOMIOS_FIREBASE_API_KEY: ${{ secrets.DOMIOS_FIREBASE_API_KEY }}
      DOMIOS_FIREBASE_PROJECT_ID: ${{ secrets.DOMIOS_FIREBASE_PROJECT_ID }}
      DOMIOS_FIREBASE_APP_ID: ${{ secrets.DOMIOS_FIREBASE_APP_ID }}
      DOMIOS_ACCOUNT_REDEEM_URL: ${{ secrets.DOMIOS_ACCOUNT_REDEEM_URL }}
      DOMIOS_BILLING_FUNCTIONS_URL: ${{ secrets.DOMIOS_BILLING_FUNCTIONS_URL }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        id: ci-1
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - *cancel-run-on-failure
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        id: ci-2
        with:
          package-manager-cache: false
          node-version: '22.22.0'
      - *cancel-run-on-failure
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        id: ci-3
        with:
          version: 10.32.1
          run_install: false
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - *cancel-run-on-failure
      - run: pnpm install --frozen-lockfile --store-dir "$RUNNER_TOOL_CACHE/pnpm-store"
        id: ci-4
      - *cancel-run-on-failure
      - *select-pr-catalogue
      - *cancel-run-on-failure
      - id: ci-6
        env:
          PLUGIN_COMMAND: ${{ fromJSON(steps.catalogue.outputs.commands)['plugin-check'] }}
          PLUGIN_ID: ${{ matrix.plugin.id }}
        shell: bash
        run: ${PLUGIN_COMMAND//<plugin-id>/"$PLUGIN_ID"}


      - *cancel-run-on-failure
  clippy-linux:
    name: clippy (linux)
    needs: changed
    if: ${{ github.repository == 'rollacode/codeterm' && github.actor == 'rollacode' && github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (needs.changed.outputs.heavy == 'true') }}
    environment: ci
    runs-on: [self-hosted, Linux, linux-build, host-ubunta]
    permissions:
      contents: read
      actions: write
    timeout-minutes: 30
    env:
      DOMIOS_CI_WEBHOOK_URL: ${{ secrets.DOMIOS_CI_WEBHOOK_URL }}
      DOMIOS_CI_WEBHOOK_TOKEN: ${{ secrets.DOMIOS_CI_WEBHOOK_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
      DOMIOS_FIREBASE_API_KEY: ${{ secrets.DOMIOS_FIREBASE_API_KEY }}
      DOMIOS_FIREBASE_PROJECT_ID: ${{ secrets.DOMIOS_FIREBASE_PROJECT_ID }}
      DOMIOS_FIREBASE_APP_ID: ${{ secrets.DOMIOS_FIREBASE_APP_ID }}
      DOMIOS_ACCOUNT_REDEEM_URL: ${{ secrets.DOMIOS_ACCOUNT_REDEEM_URL }}
      DOMIOS_BILLING_FUNCTIONS_URL: ${{ secrets.DOMIOS_BILLING_FUNCTIONS_URL }}
      # Warm per-workspace targets outside the checkout; the cleanup step sweeps them by age.
      CI_TARGET_ROOT: ${{ github.workspace }}/../ci-targets/clippy
      CODETERM_ALLOW_EXTERNAL_TARGET: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        id: ci-1
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - *cancel-run-on-failure
      - name: Setup Node.js
        id: ci-2
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          package-manager-cache: false
          node-version: '22.22.0'
      - *cancel-run-on-failure
      - name: Ensure Rust toolchain on PATH
        id: ci-3
        run: |
          if command -v cargo >/dev/null 2>&1; then exit 0; fi
          for dir in "${CARGO_HOME:-}/bin" "$HOME/.cargo/bin" /home/*/.cargo/bin /Users/*/.cargo/bin; do
            if [ -x "$dir/cargo" ]; then echo "$dir" >> "$GITHUB_PATH"; exit 0; fi
          done
          echo "cargo not found; restore Rust on the runner" >&2
          exit 1
      - *cancel-run-on-failure
      - name: Prepare compile stubs
        id: ci-4
        run: |
          mkdir -p dist src-tauri/bundled-cli
          [ -n "$(ls -A src-tauri/bundled-cli)" ] || touch src-tauri/bundled-cli/codeterm
      - *cancel-run-on-failure
      - name: Reset compiler capture
        id: ci-5
        continue-on-error: true
        run: node -e "require('fs').writeFileSync('ci-rust-warnings.log', '')"
      - *cancel-run-on-failure
      - name: clippy (repo gate)
        id: ci-6
        run: node scripts/collect-rust-warnings.mjs run --log ci-rust-warnings.log -- bash build.sh ci-clippy
      - *cancel-run-on-failure
      - uses: ./.github/actions/rust-warnings
        if: always()
        continue-on-error: true
        with:
          complete: ${{ job.status == 'success' }}
          platform: clippy-Linux
          target: x86_64-unknown-linux-gnu
      - name: Upload artifacts spooled while the private store was unreachable
        if: always()
        uses: ./.github/actions/ci-artifact-spool
      - name: Clean 0-byte stubs
        if: always()
        run: find src-tauri/bundled-cli -maxdepth 1 -type f -size 0 -delete 2>/dev/null || true
      - &release-job-cache
        name: Stop this job's local compile cache
        if: always()
        shell: bash
        run: bash build.sh cache-release
      - &clean-job-outputs
        name: Remove job archives and sweep old Rust targets
        if: always()
        continue-on-error: true
        run: node scripts/ci-workspace-cleanup.mjs

  # CLI contracts (transport rows, help text, generated manifest, essence map) fail in minutes here, not in the Rust tier.
  cli-tests:
    name: cli tests
    needs: changed
    if: ${{ github.repository == 'rollacode/codeterm' && github.actor == 'rollacode' && github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (needs.changed.outputs.heavy == 'true') }}
    environment: ci
    runs-on: [self-hosted, Linux, linux-build, host-ubunta]
    permissions:
      contents: read
      actions: write
    timeout-minutes: 30
    env:
      DOMIOS_CI_WEBHOOK_URL: ${{ secrets.DOMIOS_CI_WEBHOOK_URL }}
      DOMIOS_CI_WEBHOOK_TOKEN: ${{ secrets.DOMIOS_CI_WEBHOOK_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
      DOMIOS_FIREBASE_API_KEY: ${{ secrets.DOMIOS_FIREBASE_API_KEY }}
      DOMIOS_FIREBASE_PROJECT_ID: ${{ secrets.DOMIOS_FIREBASE_PROJECT_ID }}
      DOMIOS_FIREBASE_APP_ID: ${{ secrets.DOMIOS_FIREBASE_APP_ID }}
      DOMIOS_ACCOUNT_REDEEM_URL: ${{ secrets.DOMIOS_ACCOUNT_REDEEM_URL }}
      DOMIOS_BILLING_FUNCTIONS_URL: ${{ secrets.DOMIOS_BILLING_FUNCTIONS_URL }}
      CI_TARGET_ROOT: ${{ github.workspace }}/../ci-targets/cli-tests
      CODETERM_ALLOW_EXTERNAL_TARGET: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        id: ci-1
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - *cancel-run-on-failure
      - name: Setup Node.js
        id: ci-2
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          package-manager-cache: false
          node-version: '22.22.0'
      - *cancel-run-on-failure
      - name: Ensure Rust toolchain on PATH
        id: ci-3
        run: |
          if command -v cargo >/dev/null 2>&1; then exit 0; fi
          for dir in "${CARGO_HOME:-}/bin" "$HOME/.cargo/bin" /home/*/.cargo/bin /Users/*/.cargo/bin; do
            if [ -x "$dir/cargo" ]; then echo "$dir" >> "$GITHUB_PATH"; exit 0; fi
          done
          echo "cargo not found; restore Rust on the runner" >&2
          exit 1
      - *cancel-run-on-failure
      - name: CLI tests
        id: ci-4
        run: bash build.sh ci-cli-tests
      - *cancel-run-on-failure
      - name: Upload artifacts spooled while the private store was unreachable
        if: always()
        uses: ./.github/actions/ci-artifact-spool
      - name: Clean 0-byte stubs
        if: always()
        run: find src-tauri/bundled-cli -maxdepth 1 -type f -size 0 -delete 2>/dev/null || true
      - *release-job-cache
      - *clean-job-outputs

  ts-static:
    name: ts static checks
    needs: changed
    if: ${{ github.repository == 'rollacode/codeterm' && github.actor == 'rollacode' && github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (needs.changed.outputs.frontend == 'true') }}
    environment: ci
    runs-on: [self-hosted, Linux, light, host-ubunta]
    permissions:
      contents: read
      actions: write
    timeout-minutes: 8
    env:
      DOMIOS_CI_WEBHOOK_URL: ${{ secrets.DOMIOS_CI_WEBHOOK_URL }}
      DOMIOS_CI_WEBHOOK_TOKEN: ${{ secrets.DOMIOS_CI_WEBHOOK_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
      DOMIOS_FIREBASE_API_KEY: ${{ secrets.DOMIOS_FIREBASE_API_KEY }}
      DOMIOS_FIREBASE_PROJECT_ID: ${{ secrets.DOMIOS_FIREBASE_PROJECT_ID }}
      DOMIOS_FIREBASE_APP_ID: ${{ secrets.DOMIOS_FIREBASE_APP_ID }}
      DOMIOS_ACCOUNT_REDEEM_URL: ${{ secrets.DOMIOS_ACCOUNT_REDEEM_URL }}
      DOMIOS_BILLING_FUNCTIONS_URL: ${{ secrets.DOMIOS_BILLING_FUNCTIONS_URL }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        id: ci-1
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - *cancel-run-on-failure
      - name: Setup Node.js
        id: ci-2
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          package-manager-cache: false
          node-version: '22.22.0'

      - *cancel-run-on-failure
      - name: Setup pnpm
        id: ci-3
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.32.1
          run_install: false
          dest: ${{ runner.tool_cache }}/setup-pnpm

      - *cancel-run-on-failure
      - name: Install dependencies
