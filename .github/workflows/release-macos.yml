name: release-macos

# Builds, signs, and notarizes the macOS bundles (.app + .dmg) for both
# Apple Silicon and Intel, uploads to the GitHub release, then refreshes
# the channel updater manifest.
#
# Triggers:
#   - workflow_dispatch with explicit `tag` input (manual fallback re-run)
#
# Normal releases use release.yml on the self-hosted codeterm-builder runner.
# Do not trigger this hosted workflow from v* tags; GitHub-hosted runners burn billing minutes.
#
# Disable: set repo Variable RELEASE_MACOS_ENABLED=false in
# Settings -> Secrets and variables -> Actions -> Variables.
#
# Required secrets:
#   TAURI_SIGNING_PRIVATE_KEY, APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
#   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID, PACKAGE_REPOS_TOKEN.
# PACKAGE_REPOS_TOKEN must have contents:write for rollacode/codeterm-releases.
# Optional secret: TAURI_KEY_PASSWORD (only if the signing key is encrypted).

"on":
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.1.0). Required for manual runs.'
        required: true
        type: string
      mirror:
        description: 'Publish to the public mirror. Turn off only for a dry run - a manual run that does not mirror leaves the release incomplete.'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    if: ${{ vars.RELEASE_MACOS_ENABLED != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect channel and prerelease flag
        id: channel
        shell: bash
        run: |
          tag="${{ steps.tag.outputs.name }}"
          if [[ "$tag" == *-rc* ]]; then
            echo "manifest=latest-rc.json" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          elif [[ "$tag" == *-nightly* ]]; then
            echo "manifest=latest-nightly.json" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "manifest=latest.json" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            cli
          key: ${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false

      - name: Install npm dependencies
        run: pnpm install --frozen-lockfile

      # macOS x86_64 needs the onnxruntime dynamic library bundled next to
      # the app binary because pyke does not ship an ort prebuilt for this
      # target. arm64 keeps static linking via fastembed's default path.
      - name: Stage onnxruntime dylib (macOS x86_64 only)
        if: matrix.target == 'x86_64-apple-darwin'
        shell: bash
        run: |
          ONNX_VER="1.23.2"
          ONNX_DIR="/tmp/onnxruntime-osx-x86_64-${ONNX_VER}"
          ONNX_TGZ="${ONNX_DIR}.tgz"
          curl -sL -o "$ONNX_TGZ" \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ONNX_VER}/onnxruntime-osx-x86_64-${ONNX_VER}.tgz"
          tar -xzf "$ONNX_TGZ" -C /tmp/
          mkdir -p src-tauri/bundled-embed-libs
          cp "${ONNX_DIR}/lib/libonnxruntime.${ONNX_VER}.dylib" \
            src-tauri/bundled-embed-libs/libonnxruntime.dylib

      - name: Import Apple signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Resolve Apple signing identity
        shell: bash
        run: |
          set -euo pipefail
          security find-identity -v -p codesigning
          identity="$(security find-identity -v -p codesigning | awk -F'"' '/Developer ID Application/ { print $2; exit }')"
          if [ -z "$identity" ]; then
            echo "::error::No Developer ID Application identity found after certificate import"
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build, sign, and upload release assets
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # If the signing key is encrypted, add TAURI_KEY_PASSWORD to
          # repo secrets — this evaluates to an empty string otherwise.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.tag.outputs.name }}
          releaseName: 'CodeTerm ${{ steps.tag.outputs.name }}'
          releaseBody: 'See the assets to download this version and install. Auto-update users will be offered this build via the configured channel.'
          releaseDraft: true
          prerelease: ${{ steps.channel.outputs.prerelease }}
          # tauri-action's own updater-JSON path silently skips when its
          # internal sig matcher cannot pair an artifact with a signature.
          # We build the fragment ourselves below.
          includeUpdaterJson: false
          args: --target ${{ matrix.target }}

      - name: Publish per-platform updater fragment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
          SOURCE_REPO: ${{ github.repository }}
          MANIFEST_REPO: rollacode/codeterm-releases
          PLATFORM_KEY: ${{ matrix.target == 'aarch64-apple-darwin' && 'darwin-aarch64' || 'darwin-x86_64' }}
          MAC_ARCH_SUFFIX: ${{ matrix.target == 'aarch64-apple-darwin' && 'aarch64' || 'x64' }}
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_ROOT="src-tauri/target/${{ matrix.target }}/release/bundle"
          echo "::group::bundle directory listing"
          find "$BUNDLE_ROOT" -maxdepth 3 -type f | sort || true
          echo "::endgroup::"
          UPDATER_SIG=$(find "$BUNDLE_ROOT/macos" -name '*.app.tar.gz.sig' 2>/dev/null | head -n1)
          [ -n "$UPDATER_SIG" ] || { echo "::error::No .app.tar.gz signature under $BUNDLE_ROOT/macos"; exit 1; }
          UPDATER_BUNDLE="${UPDATER_SIG%.sig}"
          [ -f "$UPDATER_BUNDLE" ] || { echo "::error::Bundle missing next to $UPDATER_SIG"; exit 1; }
          RELEASE_BUNDLE="$BUNDLE_ROOT/macos/CodeTerm_${MAC_ARCH_SUFFIX}.app.tar.gz"
          RELEASE_SIG="$RELEASE_BUNDLE.sig"
          cp "$UPDATER_BUNDLE" "$RELEASE_BUNDLE"
          cp "$UPDATER_SIG" "$RELEASE_SIG"

          gh release upload "$TAG" "$RELEASE_BUNDLE" "$RELEASE_SIG" --clobber --repo "$SOURCE_REPO"

          OUT="updater-${{ matrix.target }}.json"
          REPO="$MANIFEST_REPO" \
          UPDATER_BUNDLE="$RELEASE_BUNDLE" \
          UPDATER_SIG="$RELEASE_SIG" \
          OUT="$OUT" \
            python3 .github/workflows/build-updater-fragment.py
          gh release upload "$TAG" "$OUT" --clobber --repo "$SOURCE_REPO"

      - name: Refresh merged channel manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          mkdir -p _frags manifest-fragments
          gh release download "${{ steps.tag.outputs.name }}" \
            --pattern 'updater-*.json' \
            --dir _frags \
            --repo "${{ github.repository }}"
          for f in _frags/updater-*.json; do
            # The -deb fragment claims the same linux-x86_64 key as the AppImage
            # one but belongs to latest-deb.json; merged here it would win.
            case "$(basename "$f")" in *-deb.json) continue ;; esac
            base=$(basename "$f" .json)
            mkdir -p "manifest-fragments/$base"
            cp "$f" "manifest-fragments/$base/latest.json"
          done
          node scripts/merge-latest-json.js \
            --in manifest-fragments \
            --out "${{ steps.channel.outputs.manifest }}"
          gh release upload "${{ steps.tag.outputs.name }}" \
            "${{ steps.channel.outputs.manifest }}" \
            --clobber --repo "${{ github.repository }}"

      # Mirror the bundle, signature, and merged manifest to the public release
      # repo so the anonymous auto-updater endpoint can serve them.
      - name: Mirror to public release repo
        if: inputs.mirror
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_REPOS_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
          MANIFEST: ${{ steps.channel.outputs.manifest }}
          PRERELEASE: ${{ steps.channel.outputs.prerelease }}
          MIRROR_REPO: rollacode/codeterm-releases
          MAC_ARCH_SUFFIX: ${{ matrix.target == 'aarch64-apple-darwin' && 'aarch64' || 'x64' }}
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_ROOT="src-tauri/target/${{ matrix.target }}/release/bundle"
          UPDATER_SIG=$(find "$BUNDLE_ROOT/macos" -name '*.app.tar.gz.sig' 2>/dev/null | head -n1)
          [ -n "$UPDATER_SIG" ] || { echo "::error::No .app.tar.gz signature under $BUNDLE_ROOT/macos"; exit 1; }
          UPDATER_BUNDLE="${UPDATER_SIG%.sig}"
          [ -f "$UPDATER_BUNDLE" ] || { echo "::error::Bundle missing next to $UPDATER_SIG"; exit 1; }
          RELEASE_BUNDLE="$BUNDLE_ROOT/macos/CodeTerm_${MAC_ARCH_SUFFIX}.app.tar.gz"
          RELEASE_SIG="$RELEASE_BUNDLE.sig"
          cp "$UPDATER_BUNDLE" "$RELEASE_BUNDLE"
          cp "$UPDATER_SIG" "$RELEASE_SIG"

          # Idempotent: create the release in the mirror only if missing.
          # Each platform workflow may run this step in any order; first one
          # wins, the rest just upload assets to the existing release.
          if ! gh release view "$TAG" --repo "$MIRROR_REPO" >/dev/null 2>&1; then
            if [ "$PRERELEASE" = "true" ]; then
              gh release create "$TAG" \
                --repo "$MIRROR_REPO" \
                --title "CodeTerm $TAG" \
                --notes "Auto-mirrored from rollacode/codeterm. See the source repo for full release notes." \
                --prerelease
            else
              gh release create "$TAG" \
                --repo "$MIRROR_REPO" \
                --title "CodeTerm $TAG" \
                --notes "Auto-mirrored from rollacode/codeterm. See the source repo for full release notes."
            fi
          fi

          gh release upload "$TAG" "$RELEASE_BUNDLE" "$RELEASE_SIG" "$MANIFEST" \
            --clobber --repo "$MIRROR_REPO"

  completion:
    name: publish macOS completion signal
    if: ${{ always() }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish completion signal
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REPO: ${{ github.repository }}
          DISPATCH_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ github.sha }}
          BUILD_RESULT: ${{ needs.build.result }}
          MIRROR_REQUESTED: ${{ inputs.mirror }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$DISPATCH_TAG"
          case "$tag" in
            release-*) tag="v${tag#release-}" ;;
            v*) ;;
            *) echo "::error::cannot derive release tag from '$tag'"; exit 1 ;;
          esac
          status=success
          reason="macOS matrix publication completed"
          if [ "$BUILD_RESULT" != success ]; then
            status=failure
            reason="release-macos matrix concluded $BUILD_RESULT before publication completed"
          elif [ "$MIRROR_REQUESTED" != true ]; then
            status=failure
            reason="manual macOS run did not publish the canonical public mirror"
          fi
          mkdir -p "$RUNNER_TEMP/release-completion"
          jq -n \
            --arg schema release-completion-v1 \
            --arg release_tag "$tag" \
            --arg workflow release-macos \
            --arg status "$status" \
            --arg reason "$reason" \
            --arg source_sha "$SOURCE_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --argjson platforms '["darwin-aarch64", "darwin-x86_64"]' \
            '{schema: $schema, release_tag: $release_tag, workflow: $workflow,
              status: $status, reason: $reason, source_sha: $source_sha,
              run_id: $run_id, platforms: $platforms}' \
            > "$RUNNER_TEMP/release-completion/release-completion-release-macos.json"
          if ! gh release view "$tag" --repo "$SOURCE_REPO" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$SOURCE_REPO" --target "$SOURCE_SHA" --draft \
              --title "CodeTerm $tag" --notes "Release completion signal."
          fi
          gh release upload "$tag" \
            "$RUNNER_TEMP/release-completion/release-completion-release-macos.json" \
            --repo "$SOURCE_REPO" --clobber

      - name: Assert the release validator is armed
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          LEG: ${{ github.workflow }}
        shell: bash
        run: |
          set -euo pipefail
          validator=release-manifest-validate
          file=".github/workflows/$validator.yml"
          api="repos/$SOURCE_REPO"
          raw="Accept: application/vnd.github.raw"
          state=$(gh api "$api/actions/workflows/$validator.yml" --jq .state 2>/dev/null || true)
          source=$(gh api "$api/contents/$file?ref=$DEFAULT_BRANCH" -H "$raw" 2>/dev/null || true)
          fixture="$RUNNER_TEMP/validator-armed.json"
          jq -n --arg validator "$validator" --arg leg "$LEG" --arg branch "$DEFAULT_BRANCH" --arg state "$state" --arg source "$source" '{validator: $validator, leg: $leg, default_branch: $branch, state: (if $state == "" then null else $state end), default_branch_source: (if $source == "" then null else $source end)}' > "$fixture"
          set +e
          output=$(python3 scripts/release_validator_armed.py "$fixture" 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          [ "$status" -eq 0 ] || { echo "::error::$output"; exit "$status"; }
