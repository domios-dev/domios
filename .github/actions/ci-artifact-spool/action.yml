name: Upload spooled CI artifacts
description: Uploads what scripts/ci-artifact.sh spooled while the private store was unreachable.
runs:
  using: composite
  steps:
    - id: spool
      # Windows runners have no bash on PATH; node reads the spool on every runner.
      shell: ${{ runner.os == 'Windows' && 'pwsh' || 'bash' }}
      run: node scripts/ci-artifact-spool.mjs
    - if: steps.spool.outputs.name != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.spool.outputs.name }}
        path: ${{ steps.spool.outputs.path }}
        if-no-files-found: error
        retention-days: 3
