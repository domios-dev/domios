name: Rust warning artifact
description: Normalize captured compiler output without changing the build result
inputs:
  platform:
    required: true
    description: Build lane platform
  target:
    required: true
    description: Rust target triple
  complete:
    required: false
    default: 'false'
    description: Whether the owning build job succeeded
  input:
    required: false
    default: ci-rust-warnings.log
    description: Captured build output
runs:
  using: composite
  steps:
    - shell: ${{ runner.os == 'Windows' && '"C:\Program Files\Git\bin\bash.exe" --noprofile --norc -e -o pipefail {0}' || 'bash' }}
      continue-on-error: true
      run: node scripts/collect-rust-warnings.mjs collect --input "$WARNING_INPUT" --platform "$WARNING_PLATFORM" --target "$WARNING_TARGET" --complete "$WARNING_COMPLETE" --output "ci-rust-warnings/rust-warnings-$WARNING_PLATFORM-$WARNING_TARGET.json"
      env:
        WARNING_COMPLETE: ${{ inputs.complete }}
        WARNING_INPUT: ${{ inputs.input }}
        WARNING_PLATFORM: ${{ inputs.platform }}
        WARNING_TARGET: ${{ inputs.target }}
    - shell: ${{ runner.os == 'Windows' && '"C:\Program Files\Git\bin\bash.exe" --noprofile --norc -e -o pipefail {0}' || 'bash' }}
      continue-on-error: true
      run: bash scripts/ci-artifact.sh put "$GITHUB_RUN_ID/rust-warnings/$WARNING_FILE" "ci-rust-warnings/$WARNING_FILE"
      env:
        WARNING_FILE: rust-warnings-${{ inputs.platform }}-${{ inputs.target }}.json
