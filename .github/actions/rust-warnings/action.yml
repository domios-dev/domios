name: Rust warning artifact
description: Normalize captured compiler output without changing the build result
inputs:
  platform:
    required: true
    description: Build lane platform
  target:
    required: true
    description: Rust target triple
  complete:
    required: false
    default: 'false'
    description: Whether the owning build job succeeded
  input:
    required: false
    default: ci-rust-warnings.log
    description: Captured build output
runs:
  using: composite
  steps:
    - shell: ${{ runner.os == 'Windows' && 'pwsh' || 'bash' }}
      continue-on-error: true
      run: node scripts/ci-rust-warning-artifact.mjs collect
      env:
        WARNING_COMPLETE: ${{ inputs.complete }}
        WARNING_INPUT: ${{ inputs.input }}
        WARNING_PLATFORM: ${{ inputs.platform }}
        WARNING_TARGET: ${{ inputs.target }}
    - shell: ${{ runner.os == 'Windows' && 'pwsh' || 'bash' }}
      continue-on-error: true
      run: node scripts/ci-rust-warning-artifact.mjs store
      env:
        WARNING_FILE: rust-warnings-${{ inputs.platform }}-${{ inputs.target }}.json
