version: 2
updates:
  # Cargo updates (src-tauri)
  - package-ecosystem: cargo
    directory: /src-tauri
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      minor-patch:
        dependency-type: minor-or-patch

  # Cargo updates (cli)
  - package-ecosystem: cargo
    directory: /cli
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      minor-patch:
        dependency-type: minor-or-patch

  # Cargo updates (crates/mem-store)
  - package-ecosystem: cargo
    directory: /crates/mem-store
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      minor-patch:
        dependency-type: minor-or-patch

  # npm/pnpm updates (workspace root)
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      minor-patch:
        dependency-type: minor-or-patch

  # GitHub Actions updates
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      minor-patch:
        dependency-type: minor-or-patch
