acceptance_criteria:
- Wake-up fixtures prove global memories remain available while workspace-scoped memories are boosted only in their owning workspace.
- Cross-workspace memories do not displace more relevant local context under a constrained L1 budget.
- The wake-up explanation names scope and score contributions without exposing unrelated workspace content.
test_plan: Add deterministic memories for two workspaces plus global context, query both workspace wake-ups with a small budget and explain mode, and compare ranked ids and scores.
correctness: Keep the existing provider-neutral memory API; workspace is caller context, explicit override remains available, and absence of workspace preserves global wake-up.
