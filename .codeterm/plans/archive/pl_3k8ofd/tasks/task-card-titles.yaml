body: |
  Andrey: task card titles render as single-letter truncations ('t.', 'ta.', 'h.', 'l.') — useless. Titles must be LEGIBLE: show enough of the name to identify the task at the band where the card is readable; ellipsize gracefully only when truly out of room, never to 1-2 chars. acceptance_criteria: at W2/W3 a task card shows a human-readable title (>= ~10 chars or the full short name); test_plan: @canvas-worlds-v3 asserts canvas-task-name text length > N at readable band.
