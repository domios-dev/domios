id: task_k7cqx2
name: Read-only hierarchical List view
type: implement
model: cursor:auto
model_rationale: The canvas is not always the best way to inspect current Spec, Plan, tasks, and subtasks. A classic list gives a stable non-spatial view of the same work.
acceptance_criteria:
- List view shows Spec and Plan as separate top-level entities when spec data exists, then sections/tasks/subtasks in stable order.
- Task rows show status and assigned/working agent presence without stale done/cancelled presence.
- Subtasks are nested under parent tasks.
test_plan: Unit tests for hierarchy projection using existing plan fixtures; Playwright smoke verifies list rows for spec/plan/task/subtask and active agent marker.
correctness: List view is stable, scannable, and faithful to current plan state.
