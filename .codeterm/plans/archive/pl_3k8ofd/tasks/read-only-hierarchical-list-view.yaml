body: |
  Implement List view for the active plan set/current plan. Show Spec entity, Plan entity, plan sections, tasks, and subtasks as a clean hierarchy. Surface agent presence/current worker status on task rows, plus task status, section, and latest milestone/stride summary. Read-only only: clicking may focus/open the same plan/task on Canvas, but no inline editing or drag/drop.
