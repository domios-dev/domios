body: |
  Keep one Plan button/entry point. Do not add a separate Task/Tasks button. When opened from a task context, the same Plan action initializes or flies the canvas camera to the task node the user/agent is working on; when opened normally, it shows the full plan canvas without a task target. This should use the existing canvas focus path where possible.
