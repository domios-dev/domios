id: task_7jlt0s
name: Plan reminder and nudge E2E harness
type: implement
model: codex:gpt-5.5
model_rationale: Plan reminders exist in code and unit tests, but the dogfood smoke only verified heartbeat state and reports; it did not wait for automatic nudge delivery. We need a dev/prod-safe harness proving reminders arrive with heartbeat and useful commands.
acceptance_criteria:
- Owner pane with active plan and open/in_review tasks receives orchestrator nudge after threshold even without assigned_pane_id/task binding.
- Nudge includes heartbeat block and exact recovery commands including codeterm doc orchestration or codeterm docs ORCHESTRATION.
- Worker assigned to active task still receives worker-specific report nudge; terminal/done/cancelled bindings do not nudge.
test_plan: Focused Rust/service tests for reminders/hierarchy delivery with low threshold plus a deterministic dev/API smoke if practical; verify delayed-send heartbeat prepend remains covered.
correctness: Plan-owned heartbeat/nudge behavior can recover a fresh or compacted orchestrator without manual delayed self-messages.
