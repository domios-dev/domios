- id: sec_131f07
  title: Short ids for existing entities
  handle: short-ids-for-existing-entities
  tags: []
  body: 'One-off python script (like migrate_specs.py): walk all plan dirs + orphan specs, mint short ids (base36, 6 chars, collision-checked per project), rewrite every reference: section_ids, spec_links (all 3 fields), primary_spec_id, parent_task_id, lineage.to, canvas layout keys, task handles stay. Strides history: DECISION NEEDED (leave verbatim vs rewrite). Deep-compare structure after (ids remapped, everything else identical). Backup + daemon restart after. Dirs renamed to new ids.'
  subsections: []
  canvas:
    x: null
    y: null
    collapsed: false
  attachments: []
- id: sec_jx8r2j
  title: Recreate plans as load test
  handle: recreate-plans-as-load-test
  tags: []
  body: 'Copy-based: for each real plan, read via plan get --json, recreate through plan.batch (spec first if owned, then plan create --from-spec, then tasks in batches of 50). Semantic diff: same section tree, task count, statuses, criteria; ids differ by design. Measure wall time + file churn (git status must show ONLY the copy dir). Delete copies. Run against pl_c8a72a9a (248 tasks) minimum.'
  subsections: []
  canvas:
    x: null
    y: null
    collapsed: false
  attachments: []
- id: sec_c3x74x
  title: UI verification via Playwright
  handle: ui-verification-via-playwright
  tags: []
  body: 'Web-mode Playwright against dev 7686. New spec tests/playwright/specs/plan-bodies.spec.ts: open plan view, assert a known markdown body renders as HTML (strong/li tags, not literal **), open task detail, assert criteria list present. Follow the discipline: verify the new spec ALONE (--timeout=30000) before adding to golden.'
  subsections: []
