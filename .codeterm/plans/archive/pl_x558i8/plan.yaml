- id: sec_nq8447
  title: Wave 23 — Canvas mission control rebuild
  handle: wave-23-canvas-mission-control-rebuild
  tags: []
  body: |
    Round-8: Canvas is unusable as a section graph — rebuild as a live mission control room: agents as moving presences across operational zones (dispatch frontier, work floor, QA bay, gate desk, done shelf), live event stream, plan health HUD. Design-gated: user approves the concept screenshots before the full build. Supersedes the section-graph as the canvas primary content; keeps v2/v3 perf lessons (zoom clamps, LOD, reduced motion).
