- id: sec_84ydfg
  title: 'Wave 10 — List v2: task-first (round 2)'
  handle: w10-list-v2
  tags: []
  body: |
    Wave 10 (round-2): List v2 — task-first stream.

    Scope (spec: List round-2 block):
    - Remove inline spec-root/spec-section rows from the stream; spec reachable via header chip -> spec detail overlay.
    - Rows are tasks grouped by plan section (wave): slim collapsible group headers (title + done/total), active groups first, done-only groups collapsed at bottom; groups auto-hide when filters empty them.
    - Task row: status glyph+pill, name, executor, max one quiet metadata line; click -> detail overlay.
    - Shared PlanSwitcher from Wave 9 in the header; same default-active-plan rule.
    File ownership: planView/PlanListView.tsx, buildPlanListTree.ts (task-first forest rebuild), listViewState, PlanSwitcher reuse, PlanContextHeader.
    Verification: npm run test:unit; updated Playwright list specs; screenshots for round-2 visual acceptance.
  subsections: []
  canvas:
    x: null
    y: null
    collapsed: false
  attachments: []
- id: sec_uqp9vt
  title: Wave 11 — Canvas zoom + density (round 2)
  handle: w11-canvas-v2
  tags: []
  body: |
    Wave 11 (round-2): Canvas zoom range + density.

    Scope (spec: Canvas round-2 block):
    - Zoom clamps: max 400%, min 10% (5% only if bounds math keeps the constellation readable), useCanvasViewport.ts.
    - Bounds/packing recompute: tighter per-section task packing (measured bounds, grid/cloud packing), done-stacks retained — zoomed-out plan reads as a compact constellation, not sparse dots; canvasRender layout + canvasSpatialIndex.
    - Re-tune LOD thresholds to the new range (cards -> cluster chips -> section summary); no dot-cloud at any zoom; minimap consistent.
    - Frame budget re-verified on the 200-task fixture (p95 ~16ms), numbers in report.
    File ownership: useCanvasViewport.ts (+test), canvasRender/drawScene.ts, drawCard.ts, layout/packing module, canvasSpatialIndex.ts, CanvasMinimap.tsx, perfFixture.
    Verification: npm run test:unit; manual pan/zoom sweep 10%-400% with frame probe; screenshots at 10/50/100/400%.
  subsections: []
  canvas:
    x: null
    y: null
    collapsed: false
  attachments: []
- id: sec_vkwyqt
  title: Wave 12 — Loop repair + competitive execution
  handle: w12-exec-mechanics
  tags: []
  body: |
    Wave 12 (execution-mechanics deepening; rust lanes, independent of round-2 UX waves 9-11):

    A. Loop mechanics repair (spec: loop-mechanics): verify-then-fix in ONE task — trace who calls loop_engine::record_iteration in the live workflow (suspicion: nobody), then wire iteration recording (CLI plan loop record + optional automatic trigger on planner replan strides), surface running loops in the heartbeat envelope, doctor warnings for stalled/exhausted loops, stages field: real CLI or removal (document decision). Areas: src-tauri/src/plan/loop_engine.rs, service/plan/loop_mutations.rs, heartbeat.rs, doctor plumbing, cli plan loop args, ORCHESTRATION doc.

    B. Competitive execution (spec: competitive-execution): extend task_attempts.rs from sequential-respawn to concurrent-competition — competition meta on task (mode + competitor count), N concurrent attempts each with mandatory isolated worktree lane + per-attempt model/executor_role overrides, per-attempt zero-flag report resolution (pane -> attempt), judging verdict command (winner/rejected + reason), loser lanes flow into cleanup debt, grouped competition rendering in heartbeat/nudges + plan state. Areas: service/plan/task_attempts.rs + mod.rs task model, lane_metadata.rs, heartbeat.rs, cli plan task args (compete/judge), agent report resolution (composes with p1c), docs (ORCHESTRATION + agents.md judge guidance).

    Sequencing: A before B in the same lane is acceptable (B touches heartbeat/doctor surfaces A also touches); B depends conceptually on cleanup-hygiene (t0e) landing for loser-lane debt, but only for the debt hookup — core competition model can proceed.
    Verification: narrowed cargo tests per area; ./build.sh check; live dogfood: create a scratch competitive task with 2 competitors on dev, both report, judge, verify winner integration + loser debt + history.
  subsections: []
  canvas:
    x: null
    y: null
    collapsed: false
  attachments: []
- id: sec_kd7f66
  title: Wave 13 — Active-work surfacing everywhere
  handle: w13-active-work
  tags: []
  body: |
    Wave 13 (frontend, after round-2 waves 9-10 land — the strip/badges attach to PlanSwitcher and the v2 list): ambient active-work visibility.

    Areas: new shared selector (planView/activeWork.ts) over PlansProvider; PlanSwitcher badges (t9's component); PlanListView pinned strip; CanvasPresenceLayer glow + fly-to-active control (useCanvasFlyTo exists); Sidebar/WorkspacePlanEntry badge+tooltip; Terminal/ComposerPlanActivityStrip current-task line. Status colors from settings TASK_STATUS_COLORS everywhere; stale threshold shared with plan-state drift semantics.
    Verification: npm run test:unit (selector + per-surface rendering); Playwright: strip/badges/fly-to specs; screenshots of all six surfaces with live workers for visual acceptance.
  subsections: []
  canvas:
    x: null
    y: null
    collapsed: false
  attachments: []
- id: sec_amg0bs
  title: 'Wave 14 — Round-4 UI: flat list, slide-over, plan document'
  handle: w14-round4-ui
  tags: []
  body: |
    Wave 14 (round-4 UI, loop iteration 3/3 of the visual loop): flat status list, task slide-over, plan-first header, plan document.

    Areas: PlanListView + buildPlanListTree (flat status groups + belonging chips — grouping model replaced again, alignment grid stays); new PlanTaskSlideOver (right panel ~40-45%, replaces fullscreen overlay for TASK kind only; PlanDetailOverlay keeps plan/spec document style); PlanContextHeader (plan-first + plan-title -> plan document); new PlanDocumentView (goal + sections as document, per-section relation chips to spec sections and tasks); spec-doc coverage header bug fix (uses plan-state coverage source).
    Verification: npm run test:unit; Playwright: flat-list order, chip navigation, slide-over open/close with left surface live, plan document relation chips; fixture screenshots for user acceptance.
  subsections: []
  canvas:
    x: null
    y: null
    collapsed: false
  attachments: []
- id: sec_rffh1a
  title: Wave 15 — Task lifecycle + relentless heartbeat
  handle: w15-lifecycle
  tags: []
  body: |
    Wave 15 (rust, task lifecycle + heartbeat): PARKED status with mandatory reason (working-point stride), unpark transition; replan-handoff exit documented in nudge text; heartbeat continues while ANY task is pending/in_progress/in_review/blocked and says so explicitly; age-threshold escalation (stale open tasks named in the nudge with the five allowed exits: dispatch/park/judge/replan/escalate-model); drift extension beyond stale_in_review; doctor: error on parked-without-reason, warning on aged unstaffed open tasks.
    Areas: service/plan status model + transitions (mod.rs/mutations.rs), heartbeat.rs nudge text + escalation, state.rs drift, doctor rules, CLI status arg + park command surface, ORCHESTRATION doc.
    Verification: narrowed cargo tests (transitions, nudge text, escalation, doctor); live scratch-plan smoke: open task ages past threshold -> escalated nudge names it; park without reason rejected.
  subsections: []
  canvas:
    x: null
    y: null
    collapsed: false
  attachments: []
- id: sec_wike6f
  title: Wave 16 — Prompt diet (progressive disclosure)
  handle: w16-prompt-diet
  tags: []
  body: |
    Wave 16 — prompt diet (two sequenced tasks; behavioral change => eval-gated per repo rules).

    A. Help/docs parity first (t20): move prompt-only knowledge into tier-1 homes — clap long_help for send --actions keys, pane backing types, spawn shapes; routing marker table into a docs topic; verify every removal candidate in codeterm_cli.md has a tier-1 answer. Areas: cli/src/args/* (long_help), docs/ topics + docs registry, src-tauri/prompts (no removals yet), cli manifest test.
    B. Prompt rewrite + eval gate (t21): rewrite codeterm_cli.md to invariants + capability map (<=1,200 words); dedupe routing to the codeterm_rule.md canonical copy; bullet-tighten planner_suffix; one-line pointers replace mechanically-enforced rules. Gates: evals/cli-agent baseline BEFORE the rewrite, rerun AFTER (no discovery/success regression); prompt-evaluator regression; word-count budget assertions; prompt_cli_commands_exist green.
    Sequencing: A strictly before B (nothing leaves the prompt without a tier-1 home). Single rust-capable worker may take both in one lane.
  subsections: []
  canvas:
    x: null
    y: null
    collapsed: false
  attachments: []
