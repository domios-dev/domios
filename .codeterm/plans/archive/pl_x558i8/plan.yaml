- id: sec_qrrbcr
  title: Wave 21 — Planner/Orchestrator peer model
  handle: wave-21-planner-orchestrator-peer-model
  tags: []
  body: |
    Round-7: Planner and Orchestrator are peers with different jobs, initialized as a linked pair (user flow from New session; mandatory planner pairing when an agent becomes orchestrator); planning progress is plan STATE, not a task assigned to the planner.
