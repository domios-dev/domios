- id: sec_yw70io
  title: Wave 24 — New-session UX, first-run onboarding, peer-pair visuals (FINAL)
  handle: wave-24-new-session-ux-first-run-onboarding-peer-pair-visuals-final
  tags: []
  body: |
    Closing wave (user round-11): New session creates an empty tab with an in-tab spawn picker (single agent or Orchestrator+Planner pair preset, defaults claude opus + claude fable, last choice persisted); first-run with no main tab gets a General-agent selection screen with installed-provider detection; Orchestrator and Planner render as a visually LINKED PAIR at the SAME level in every surface (mandatory); completed plans stop nudging their orchestrator. Tested live on dev. This wave closes the plan.
  subsections: []
  canvas:
    x: null
    y: null
    collapsed: false
  attachments: []
- id: sec_tnxp31
  title: 'Wave 25 — Plan skills: self-improving know-how inside the plan'
  handle: wave-25-plan-skills-self-improving-know-how-inside-the-plan
  tags: []
  body: |
    From Karpathy's autoresearch (references/autoresearch, cloned + studied): plans gain their own mutable skills — instructions/scripts agents create and refine DURING execution, with an append-only keep/discard ledger, a one-line registry pointer in heartbeats/charters (never full content), mem-indexed so one search returns tasks+skills+facts together, visible in the plan UI, and a completion retrospective stride that distills what the plan learned. Principles: separate fixed harness from mutable target; measurable checks over vibes; simplicity criterion (deletion-wins); never silently discard — log why.
  subsections: []
  canvas:
    x: null
    y: null
    collapsed: false
  attachments: []
- id: sec_sj7fou
  title: 'Wave 26 — Perceived responsiveness: busy states + lock hygiene'
  handle: wave-26-perceived-responsiveness-busy-states-lock-hygiene
  tags: []
  body: |
    Round-20: every wait in the product shows a live busy state (the chat typing-dots grammar, one shared system — no dead/blank/static surfaces ever); the daemon emits truthful boot-stage events instead of the UI guessing; Rust lock hygiene becomes mechanical (clippy await_holding_lock enabled and enforced, hold-time instrumentation in dev); web UI and native UI behave identically. DRY, no per-surface bespoke spinners, no legacy shims — pre-prod freedom, redesign over patch.
  subsections: []
  canvas:
    x: null
    y: null
    collapsed: false
  attachments: []
- id: sec_tohz64
  title: Wave 27 — Design system enforcement (components, no breakage)
  handle: wave-27-design-system-enforcement-components-no-breakage
