vector: Make the CodeTerm planning workspace visually pleasant, understandable, and efficient, with Board as the primary view, List second, Canvas third; every view must make plan/spec/tasks inspectable without awkward scrolling or hidden context.
vision: |
  A user opens a plan and immediately understands the goal, plan/spec context, task flow, active workers, and task details. Board/List/Canvas are calm, fast, and inspectable. Done-heavy plans with hundreds of completed tasks remain readable, not an infinite wall.
constraints:
- Board is the default/primary planning view; List is second; Canvas is third.
- Task details, plan context, and spec context must be openable from Board and List.
- Done tasks must not create unbounded vertical scroll or visually dominate active work.
- Canvas must avoid laggy tiny unreadable overviews and should degrade gracefully for large plans.
postulates:
- This is a UX/UI redesign planning effort first; implementation tasks must be generated by the Planner after studying current UI and screenshots.
- The Orchestrator executes the plan and returns to Planner for replanning when implementation evidence or user feedback shows the plan is weak.
