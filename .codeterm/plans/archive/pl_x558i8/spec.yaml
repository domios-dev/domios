- id: sec_67urbb
  title: Planning-kind tasks in planning mode
  handle: planning-kind
  tags: []
  body: |
    Product/CLI requirement (from the user, mid-effort): planner bootstrap work must be modelable as a task WITHOUT fighting the planning-mode gate.

    Requirements:
    - Task kind "planning" (task.kind, already a free string set via --type) becomes a recognized kind with special gating: `codeterm plan task add --type planning` is allowed while the plan is in mode=planning, WITHOUT --force. Planning tasks exist only to improve GOAL/Spec/Plan/task-graph structure (e.g. a Planner-profile worker lane like this one).
    - Execution/review/build tasks (any other kind, including default) remain blocked in planning mode: TaskCreationRequiresApproval stays for them; --force keeps its current deliberate-draft escape hatch.
    - `codeterm plan doctor --kind quality`: planning-kind tasks do NOT trigger the tasks_before_approval error; they still get task-quality checks (body etc.). Execution tasks created in planning mode keep erroring.
    - Docs update: docs/ORCHESTRATION.md + src-tauri/prompts/orchestration_toolset.md (Planner Profile + planning-method sections) describe the planning kind and the updated authoring order (a planning task may precede approval).
    - Rationale: the Orchestrator dispatches a Planner as a task-tracked lane; today that task is either a --force draft (doctor error) or untracked. Planning work deserves first-class task state without weakening the approval gate for execution.
  subsections: []
  canvas:
    x: null
    y: null
    collapsed: false
  attachments: []
- id: sec_k9ia59
  title: Task executor-role field
  handle: role-field
  tags: []
  body: |
    Product/CLI requirement (from the user, mid-effort): tasks need a structured executor-role field so the Orchestrator can route the right agent personality per task, not just free prose.

    Current state (confirmed gap): task carries role_guidance (prose onboarding text), model (LLM routing), type (task kind), and runtime taken_by_role (who actually took it) — but NO declarative field saying which worker profile SHOULD execute it (e.g. rust-backend, frontend-ux, qa-playwright, code-reviewer, planner).

    Requirements:
    - New task field executor_role (string, conventional vocabulary not a hard enum): set via `plan task add/update --role <value>`; stored, shown in `task show`, `plan get`, and `plan state` open-lanes output so dispatch decisions read off the plan.
    - Vocabulary is project-convention (documented in docs/contributing/agents.md role list: backend-dev, frontend-dev, code-reviewer, docs-sync, release, planner, qa) — validated loosely (non-empty slug), NOT a third structural AgentRole; structural hierarchy stays Orchestrator/Worker(+Planner profile).
    - Spawn flow: when the Orchestrator dispatches a task, executor_role selects the personality stance and role_guidance remains the prepended onboarding prose; the two compose (role = who, guidance = how).
    - Doctor quality check may warn (not error) when an execution task lacks executor_role.
    - Backfill: tasks in this plan get executor_role set once the field ships (t0b includes a backfill pass on this plan as its live verification).
  subsections: []
