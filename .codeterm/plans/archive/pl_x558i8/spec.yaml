    collapsed: false
  attachments: []
- id: sec_et66kt
  title: Canvas — tertiary role and performance constraints
  handle: canvas-req
  tags: []
  body: |
    Canvas is the tertiary, spatial/presence view. Evidence (086555a7, 522f9cc6) shows its failure mode: zoomed out it becomes a laggy cloud of tiny unreadable dots with decorative labels, which is confusing and worse than useless for orientation.

    Requirements:
    - Canvas keeps its role: spatial layout, live worker presence, fly-to focus, stride/milestone theater. It is NOT required for task inspection basics — Board/List cover that.
    - Readability floor: at any zoom level, rendered nodes must either be readable cards or explicit aggregate markers (cluster chips with counts), never a dot-cloud. Below the readability threshold the renderer switches to cluster/summary LOD instead of drawing hundreds of tiny cards.
    - Performance budget: pan/zoom on a plan with 200+ tasks sustains interactive frame rate (no visible stutter; frame probe p95 under ~16ms on dev hardware) — instrument via existing useCanvasFrameProbe.
    - Minimum-zoom clamp: the camera must not reach zoom levels where the whole world is sub-legible; zoom-out beyond the threshold triggers the overview LOD, not smaller pixels.
    - Done-heavy plans must not dominate the world: done tasks compress into per-section done-stacks/clusters rather than individual full cards.
    - No new features on Canvas in this effort beyond LOD/perf/legibility; feature growth is a non-goal.
  subsections: []
  canvas:
    x: null
    y: null
    collapsed: false
  attachments: []
- id: sec_zlaiig
  title: Task detail inspectability — shared detail surface
  handle: detail-req
  tags: []
  body: |
    One shared detail surface for task/plan/spec inspection, reused by Board, List, and Canvas.

    Today CanvasDetailOverlay + canvasRender/DetailContent.tsx implement a good fullscreen READ surface, but the API is canvas-coupled: it needs LaidOutNode, nodeById map, and resolveModel. Board and List have nothing.

    Requirements:
    - Extract a view-agnostic detail overlay (working name PlanDetailOverlay) whose props are model-level: {kind: task|plan|spec, task?, plan?, spec?, panes, onOpenPane, onClose}. Canvas keeps its wrapper that adapts LaidOutNode to this API; Board and List call it directly.
    - Task detail shows: name, handle, status + status history freshness, body, acceptance criteria, test plan, correctness, section links, lane (branch/worktree/workspace), executor presence + history, milestones/strides timeline, and an "open pane" action when an executor pane exists.
    - Plan detail shows goal (vector/vision/constraints/postulates), heartbeat focus, progress; spec detail shows section tree.
    - Overlay behavior: fullscreen over the view, Esc closes, focus-trapped, scrollable, closing restores the underlying view untouched (no camera moves, no scroll loss).
    - One source of truth: no duplicated task-rendering logic between views; DetailContent stays the single body renderer.
  subsections: []
  canvas:
    x: null
    y: null
    collapsed: false
  attachments: []
- id: sec_osagm8
  title: Done-heavy plan behavior
  handle: done-req
  tags: []
  body: |
    Done-heavy behavior is a first-class requirement across ALL views, not a Board footnote. A mature plan can have 200+ done tasks and ~10 active ones; the active ones must dominate every surface.

    Requirements:
    - Board: Done column bounded (recent N + count + in-column scroll after "show all").
    - List: done rows quiet; fully-done sections collapsed to rollups by default.
    - Canvas: done tasks aggregate into per-section done-stacks at normal zoom.
    - Everywhere: total/done progress remains visible as numbers (header, column count, rollups) so completion still reads as progress, not hidden history.
    - No view may produce unbounded page growth proportional to done-task count.
  subsections: []
