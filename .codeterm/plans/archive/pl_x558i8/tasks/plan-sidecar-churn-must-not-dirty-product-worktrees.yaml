body: |
  FROM THE SHARED-CHECKOUT INCIDENT: the daemon continuously writes plan sidecars (.codeterm/plans/**: INDEX.md, plan.json, tasks/*.md, strides.jsonl) INTO the tracked repo — so every checkout where a plan lives is permanently dirty with runtime churn. Consequences observed live: 'dirty worktree' signals became meaningless (workers learned to ignore/acknowledge them — alarm fatigue that directly enabled the unrelated-dirty-files violations), lane diffs polluted, gates unreliable. TWO-PHASE FIX: PHASE 1 (this task, BEFORE RELEASE, mechanical): stop the bleeding — teach every dirty-check to EXCLUDE .codeterm/plans/** explicitly: the readiness-report refusal (and its unrelated-dirty extension in task_5a6d58c5 — coordinate), the pre-push guards, build.sh checks, and any 'git status --short' agents are told to run (add ':!.codeterm' pathspec guidance to the relevant prompt/docs line). Sidecar churn stops counting as dirt ANYWHERE a gate reads. PHASE 2 (DECISION GATE for Andrey, recorded here, execution possibly post-release): whether plans should live in git AT ALL. Options with tradeoffs for the gate: (a) untrack + gitignore .codeterm/plans — plans become daemon-owned runtime state; history preserved by the daemon (strides ARE the history), git history of plans frozen at untrack point; cleanest worktrees; (b) keep tracked, daemon writes move to ~/.codeterm state dir with materialization into the repo only on explicit 'plan export' — durable snapshots in git on demand, no churn; (c) status quo + Phase 1 exclusions only. Planner recommendation for the gate: (b) — plan history in git has proven valuable (restored plans after corruption came from git), but continuous runtime writes belong outside the worktree; export-on-demand keeps both. DO NOT execute Phase 2 without the gate decision.
role_guidance: Rust/shell worker; enumerate every git-status consumer first (report refusal, hooks, build.sh, prompts) — the list is the audit.
