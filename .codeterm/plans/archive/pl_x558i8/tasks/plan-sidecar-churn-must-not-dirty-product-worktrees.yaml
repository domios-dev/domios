  text: |
    IN_REVIEW: STATUS: in_review (STANDALONE PRE-FIX from the task's design requirements — Andrey ordered it into feat/canvas-updates NOW)
    BRANCH: lane/4fc2ae89-write-if-changed @ 5fc5bd24 (base b3fa71e7)
    WORKTREE: /Users/rollacode/Developer/codeterm-lanes/4fc2ae89-write-if-changed
    CHANGES: write-if-changed in the sidecar writer — src-tauri/src/service/plan/body_files.rs write_markdown_atomic now normalizes, reads the existing file, and SKIPS the write when content is identical. One function, +6 lines. EFFECT: whole-plan saves (which fan out to every goal/section/task file on every stride/heartbeat/status write — root cause recorded on this task) stop rewriting untouched files: kills the 135-file git walls recurring after any serializer change AND the ~250-renames-per-heartbeat IO storm from the round-85 CPU profile (rename/open/stat cluster). Semantics unchanged: changed content writes exactly as before, EOF normalization preserved.
    TESTS WRITTEN (not run, code-only): 3 in body_files.rs write_if_changed_tests — (1) identical content provably never touches the filesystem (read-only parent dir trick: any attempted write would error, Ok() proves the skip); (2) changed content still writes + normalizes EOF; (3) normalized-equivalent input (trailing whitespace/newlines) counts as identical (mtime unchanged).
    GATES REQUESTED: cargo check + clippy both crates; cargo test body_files (3 new + existing body_file_tests suite); ONE live drill that IS the user-visible proof: on a dev at this sha, append one stride to the 248-task Canvas-v2 plan and confirm git status shows ONLY that task's files changed (was: every file). NOTE: the per-entity persistence + explicit-migrations requirements remain with the Option-B relocation lane — this is deliberately only the safe standalone slice.
    FOLLOWUP: none — merge on green; every subsequent save on old plans becomes a near-no-op.
