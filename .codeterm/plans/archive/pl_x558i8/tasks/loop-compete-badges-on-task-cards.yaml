model_rationale: Looped tasks are invisible as such; users need to see iteration pressure (xN of budget) at a glance across board/list/detail
acceptance_criteria:
- Badge (loop glyph + xN) renders on board cards, list rows, and detail header when an active loop targets the task and count >= 2
- Warning tint when count >= budget or loop stagnating; tooltip shows iteration/budget/status/stop_when
- loopForTask(plan, taskId) pure helper unit-tested incl. multiple-loops-per-task case; single shared badge component (no per-surface forks)
- No badge for count < 2 or terminal loops; component tests cover thresholds
- Competitive-marked tasks show a distinct compete chip (xN) on the same surfaces, driven by competition meta via a pure helper; live-competition tooltip shows attempt state; loop-only fallback recorded if competition model unlanded
test_plan: 'Unit: loopForTask edge cases. Component: badge thresholds + tint + tooltip. Playwright golden with seeded looped task'
correctness: Badge must key off plan.loops target resolution, never infer looping from milestone text; aggregation across multiple active loops must not double-count
