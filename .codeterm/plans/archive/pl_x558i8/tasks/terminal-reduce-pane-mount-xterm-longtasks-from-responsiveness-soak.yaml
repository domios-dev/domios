- Under the soak harness, pane-mount/xterm-init no longer produces >250ms frame gaps in the first 76s, or the remaining gap is isolated with trace evidence and a smaller follow-up. No SLOW-IPC/LOCK-HOLD regressions. No visual regression in terminal/chat pane mount.
