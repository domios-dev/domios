body: |
  FROM THE STATE-DRIFT RETRO (round-61; full analysis stride on task_1d0572d0). The plan store is a RECORDING system (append what agents claim) with no supervised state machine — every drift class followed from that. THIS TASK adds the write-time layer (the watchdog task_1d0572d0 adds the observation layer; dispatch task_310d7e6b adds atomic composition — three layers, do not blur them). SCOPE: (1) TRANSITION INVARIANTS enforced at the daemon write path (service/plan mutations), feature-flagged [orchestration.state_invariants] default ON: pending->in_progress REQUIRES a pane id in the same mutation (or existing assigned_pane_id) — else reject with the exact fix command; ->in_review REQUIRES a report/status_update stride in the same write or existing on the task; ->done from in_review only (or --force with a recorded override stride); blocked REQUIRES status_label or gate ref (the 'claim not a parking spot' rule, mechanically). Rejections are CLI-friendly errors, never silent. (2) FILL-VS-OVERWRITE SEMANTICS, defined and tested (the #209 stale-pane case): EXPLICIT flags (update --pane X) always OVERWRITE and the CLI output echoes old->new; AUTO-fill (from report/env capture, task_03bf8da6) fills ONLY empty fields; matrix test covers explicit-over-existing, auto-over-existing (no-op), auto-over-empty, explicit-then-auto. (3) READBACK VERIFICATION root-cause: reproduce the #209 case — update --pane accepted but the task kept the old pane (suspects: mirror lag masking the write path per task_7089039c, short-id resolution writing to a different task, or fill-if-empty logic wrongly applied to an explicit flag); cite the actual cause in the report, add the regression test. (4) REPORT/STATUS CONTRACT TESTS end-to-end: agent report --status in_review from a worker pane -> task transitions + lane fields persisted (pane from caller env, branch/sha parsed from report body) -> plan get readback matches — one test per report path (local CLI, mesh relay, zero-flag pane-identity resolution). (5) TRANSITION-GRAPH UNIT SUITE: every legal edge accepted, every illegal edge rejected with the right error, force-override recorded — table-driven so new states extend the table, not the code. COORDINATION: task_7089039c (mirror) is IN PROGRESS on pane b2a1caf8 — its concurrency load test becomes a PERMANENT suite member here, not a one-off (stride recorded there); the enforcement flag ships default-ON but the release-gate wiring is the P2 task.
role_guidance: Rust worker in service/plan mutations; read task_7089039c's findings first (same code region, coordinate branches); the invariant table in this body is the spec — implement it as data.
