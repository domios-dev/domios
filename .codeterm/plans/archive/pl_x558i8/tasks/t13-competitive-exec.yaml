name: 'Competitive execution: concurrent attempts + judging'
type: implement
model: opus
model_rationale: Task-model extension (concurrency + judging) across attempts/lanes/reports/nudges; correctness-sensitive — opus; sequence after t12 in the same lane.
acceptance_criteria:
- plan task compete creates N concurrent attempts with per-attempt lanes and optional model/role overrides; per-attempt reports resolve by pane.
- Judging verdicts recordable per attempt; winner integrates via normal gate; losers become cleanup debt and stay in executor history.
- Competition renders as one grouped lane in heartbeat/nudges and plan state; task status semantics (in_progress -> judging) visible.
- Tasks can be marked competitive at planning time (plan task add/update --competitive N with optional model split and judge hint); compete with no flags consumes the recorded meta.
- 'Dispatch guidance is explicit: next-actions and reminder nudges announce the competitive requirement with the exact compete command BEFORE dispatch; task show renders the marking; doctor warns on single-attempt dispatch of a marked task.'
- Nudge/prompt wording defined once as a shared constant; tests assert via the constant, no re-typed prose literals.
- Live 2-competitor dogfood smoke passes end-to-end on dev.
test_plan: narrowed cargo tests (lifecycle, judge, resolution, rendering); ./build.sh check; ./build.sh cli; live smoke on dev 7686
correctness: Sequential-respawn behavior unchanged for normal tasks; no orphan attempts (every attempt reaches a verdict or explicit abandonment); opt-in boundary enforced in prompts/docs.
