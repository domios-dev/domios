body: |
  FOUND during a live task-quality audit (round-63): 'codeterm plan task update <plan> <task> --executor-role qa' prints OK but persists NOTHING — the field is absent from the task sidecar frontmatter (verified: final-acceptance task .md has no executor_role after an OK write), absent from plan get --json task objects, and absent from codeterm task show output. TRACE SO FAR: the field EXISTS in the model (src-tauri/src/service/plan/types.rs:234 pub executor_role: Option<String>) and src-tauri/src/service/plan/batch.rs:406 constructs with executor_role: None; consumers exist (cleanup_debt.rs, gates.rs, resolve.rs) and CLI tests exist (cli/src/plan_task_role_guidance_tests.rs). HISTORY: this exact surface shipped in task_d52b73ff ('Task executor-role field: model + CLI + doctor warning', done) and ALREADY regressed once (task_287dcb44 'Regression: restore executor-role CLI flags', done) — this is the SECOND regression, so the fix must include the missing lock: (1) root-cause where the update mutation drops the flag (CLI arg -> RPC param -> mutation -> serializer; one of those links discards it — batch.rs:406 hardcoding None is the first suspect); (2) fix write AND readback: persist to frontmatter, serialize in plan get --json, display in task show; (3) END-TO-END regression test that survives refactors: CLI update --executor-role X -> readback via BOTH plan get --json and task show asserts X (the two prior tasks tested layers in isolation, which is how it silently broke twice); (4) verify the doctor warning for missing executor_role actually fires (it should have flagged 28/28 empty tasks on the live plan and did not surface); (5) AFTER the fix: backfill the 28 open tasks — the Planner's role map is recorded as a stride on this task (planner/orchestrator/qa x2/release x2/backend-dev x7/frontend-dev x4/fullstack-dev x3/prompt-engineer x2/code-reviewer x1 + remaining per the map).
role_guidance: Rust worker; start at batch.rs:406 and the update mutation param plumbing.
