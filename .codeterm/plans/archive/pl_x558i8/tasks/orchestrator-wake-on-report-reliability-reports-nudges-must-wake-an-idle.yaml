- 'After fix: an idle orchestrator (codex and claude) begins processing an injected report within 15s without any manual ping'
- Same guarantee for reconciliation nudges and decision-gate notifications
- Wake logic keys on provider capabilities (stop/submit keystrokes, idle detection), never on provider-id literals
