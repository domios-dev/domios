  text: |
    CRITICAL EVALUATION of the reflection + mechanics (round-40b, Planner, feeds this task's design). REFLECTION VERDICT: good role-discipline, three flaws. (1) NO NUMBERS — it is honest vibes; the autoresearch standard is keep/discard by metric (how many bounces, which accepted lanes leaked to the user). This task's window-counts design is the fix — keep it non-negotiable. (2) SYMPTOM NOT TRIGGER on the implementer-mode slips — the trigger per ledger is urgency + being IN the integration checkout; add a mechanical TRIPWIRE line (pinned): 'You are editing a non-scratch file in the integration checkout while orchestrating — STOP: dispatch it, or move to a scratch worktree.' (3) BLIND SPOT — the reflection covers his behavior but not systemic product classes from the bounce ledger (migration-lies-about-legacy-data x3, unverified-tests-batch-run, evidence-filed-instead-of-bug-filed); the reflection block must ask 'what CLASS do this window's bounces share?' not only 'how did I behave'. WHAT DOES NOT GENERALIZE (do not encode as rules): 'paste task bodies to eight' is a workaround for the mesh read gap — infra fix owns it, a habit rule would fossilize the workaround; 'too much in one integration window' is cadence judgment — reflection material, not a rule. SKILLS MECHANICS AUDIT: plan skill new scaffolds SKILL.md + scripts/ (verified — the helper-scripts use-case is real), ledger + mem indexing live, BUT zero skills recorded on our own 40-round plan: the mechanism is live and UNUSED — adoption is the real gap. ADD to the reflection block: a skills-adoption counter ('friction events observed vs plan skills recorded this window: N vs 0'). PROMOTION GAP: the retrospective constant targets only machine mem; the user's vision — plan scripts graduating into REPO tools — is unencoded. PINNED AMENDMENT to PLAN_RETROSPECTIVE_NUDGE (append): 'Skills and scripts that proved generally useful graduate UP: machine-wide -> codeterm mem skill; project-wide -> commit into .agents/skills/ or scripts/ via a reviewed lane — a finished plan should leave the repo better tooled than it found it.'
