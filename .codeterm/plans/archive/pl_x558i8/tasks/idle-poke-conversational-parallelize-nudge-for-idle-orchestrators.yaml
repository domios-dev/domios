- 'Zero new polling: consumes existing PaneStatusTracker + plan store state'
- 'Unit tests: trigger gating (each condition), backoff/reset, budget sharing, day cap; tests reference wording constants, no re-typed prose'
test_plan: 'Rust unit tests on the trigger state machine with mocked clock; dev smoke: idle orchestrator with pending frontier receives poke after threshold, none while Waiting, backoff verified in log'
