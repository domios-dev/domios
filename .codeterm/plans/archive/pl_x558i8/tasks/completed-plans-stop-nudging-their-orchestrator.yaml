id: task_lfe5dd
name: Completed plans stop nudging their orchestrator
type: fix
model: claude/sonnet
model_rationale: Phantom nudges train orchestrators to ignore nudges — same failure class as red test baselines; and completed plans must reach quiet rest
acceptance_criteria:
- Single unit-tested is_plan_complete predicate; fully-complete plans (incl. Dali's repro state) produce zero nudges
- Every nudge names the blocking category (open tasks / loops / gates / cleanup debt / mode); no unexplained nudges
- When complete-predicate holds, orchestrator gets ONE final suggestion to mark complete/archive, then silence
- Dali confirms nudges stopped on his plan after fix (cross-machine verification)
test_plan: Unit tests per blocking category + the complete state; seed Dali's repro state as a fixture; live verification on eight via mesh
correctness: Do not silence legitimate nudges (in_review awaiting gate IS unfinished); the predicate must match plan state semantics used by doctor/state, one source of truth
