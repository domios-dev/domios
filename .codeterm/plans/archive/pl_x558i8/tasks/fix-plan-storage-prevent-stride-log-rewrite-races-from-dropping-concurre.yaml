id: task_7z897d
name: 'fix(plan-storage): prevent stride log rewrite races from dropping concurrent appends'
type: implement
model: gpt-5.5
model_rationale: 'HIGH review finding from R1 plan service/storage: ordinary saves can replace strides.jsonl with a snapshot that predates a concurrent append.'
acceptance_criteria:
- A save/rewrite path cannot discard a stride appended by another process/daemon between the log read and final write.
- Task report/readback behavior continues to persist the newly recorded milestone and preserve sidecar-only milestones.
- Malformed JSONL lines remain non-fatal and surviving stride records still hydrate.
test_plan: Add a Rust unit test under src-tauri/src/service/plan/body_file_tests.rs or stride_log.rs that simulates an external append racing with persist_stride_log/save and asserts both the save's milestone and external append survive; run scripts/test-capped.sh with that exact test filter.
correctness: No data loss from concurrent stride log mutations; corrupt individual JSONL records are isolated to that record.
