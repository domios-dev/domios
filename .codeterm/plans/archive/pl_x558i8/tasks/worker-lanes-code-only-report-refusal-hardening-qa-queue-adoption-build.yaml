body: |
  THIRD gate-discipline regression (workers building/testing from shared+dirty worktrees, report filed from the WRONG branch — cli-output-contract reported from lane/web-auth-consistent-source with unrelated dirty files; Mac-Air bogging under per-lane cargo). TWO ROOT CAUSES FOUND BY CODE INSPECTION, both cited: (A) THE REPORT TEMPLATE DEMANDS TEST RESULTS — src-tauri/prompts/worker_suffix.md:11 'BUILD/TYPECHECK/TESTS: commands run and result' — workers run builds because the report format asks for them; the honest 'not run' option loses to the implied expectation. (B) THE QA QUEUE ALREADY EXISTS AND IS UNUSED — 'codeterm plan qa' with enqueue (cli/src/args/plan.rs:278-783, PlanQaAction, --task) shipped in task_49f03e58; this is the THIRD shipped-but-unadopted occurrence (plan skills, In-QA-gating, now the qa command). Adoption fails because prompts never point at it and the old path has no friction. FOUR FIXES, one lane: (1) REPORT TEMPLATE REWRITE (worker_suffix.md + the prompts.rs:297 wiring test): replace BUILD/TYPECHECK/TESTS with two lines — 'TESTS RUN: only the narrow tests your task names, or none' and 'GATES REQUESTED: the suites/checks the orchestrator's QA queue must run before merge' — plus one charter line: 'Your lane is CODE-ONLY by default: write code and the narrow tests your task names; broad builds, clippy, and suites belong to the QA queue — request them in GATES REQUESTED, do not run them.' (2) READINESS REFUSAL HARDENING (the existing dirty-worktree refusal has two gaps, extend it): refuse when the current branch does not match the task's recorded lane branch (or lane/<slug> containing the task ref) — the wrong-branch report case; refuse when dirty files fall OUTSIDE the lane's own diff (unrelated dirty files) — list them in the refusal; escape hatch: --acknowledge-dirty <file>... records an override stride, never silent. (3) DAEMON BUILD-DETECTION (extend the runaway_sweeper ps-scan, src-tauri/src/runaway_sweeper.rs already parses process trees): a cargo/rustc/clippy/tsc/playwright process whose CWD maps to a WORKER-role pane's lane (and the pane is not QA-flagged) -> ONE nudge into that pane quoting the charter line + report to the orchestrator; config [orchestration.code_only] enabled/hard_stop (hard_stop kills the process — default OFF, nudge-only); never touch QA panes, orchestrator panes, or human shells. (4) QA-QUEUE ADOPTION MADE STRUCTURAL: 'GATES REQUESTED' lines in reports become actionable — the orchestrator gating flow (and the In-QA-default prompt line already owned by task_3165f160) references 'codeterm plan qa --task <id>' as THE gate path; verify the qa command actually runs the task's declared test plan in the warm checkout and attaches results as strides (if it does not, wire that — the command must be the EASIEST path or adoption fails a fourth time).
role_guidance: Rust worker across prompts+cli+daemon; read the existing refusal implementation and runaway_sweeper.rs first; coordinate with task_3165f160 (owns the orchestrator-side In-QA prompt line) and task_dc526c35 (do not collide on prompt files).
