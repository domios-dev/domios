body: |
  USER DIRECTIVE (round-56): read everything that ships in orchestration/planning/other prompts in the current version, verify how content is organized across files, and optimize. SCOPE = the full prompt corpus and its three tiers: TIER 1 role suffixes and templates (src-tauri/prompts/*.md, 1421 lines total: dreaming_rem 779, mem_extraction 164, codeterm_rule 96, general_agent 72, bootstrap_instructions 72, codeterm_cli 69, planner_suffix 34, orchestrator_suffix 31, bridge_mem 27, worker_suffix 14, worker_task_preamble 10, mem_rerank 8, testing_discipline 6, plugin_agent_task_preamble 5, cron_* 5, qa_pipeline_discipline 1 — plus orchestration_toolset 17 + dogfood_protocol 11 which are DEAD, see task_52539b4e); TIER 2 inline Rust constants (src-tauri/src/prompts.rs, 500 lines, 41 consts — PEER_* pairing/greeting blocks, PLAN_SKILLS_*, MILESTONE_GATE_*, REFLECTION_*, WORKER_LOOP/COMPETITIVE blocks, PLANNER_TESTING_*); TIER 3 embedded docs served via codeterm docs (docs/ORCHESTRATION.md 763, docs/GENERAL_AGENT.md 130, docs/PROMPTS.md 168 meta-doc). DELIVERABLES, all recorded as strides + follow-up fix tasks written for cheap models (exact file:line, current text, proposed text): (1) INVENTORY TABLE: every prompt asset -> loader const -> consumer call-site (which role/flow receives it) -> tier — the map docs/PROMPTS.md claims to be; update docs/PROMPTS.md to match reality (bump revision). (2) CONTRADICTION SWEEP, the core deliverable: orchestrator_suffix + planner_suffix + worker_suffix + PEER_* constants + onboarding inline text in src-tauri/src/service/orchestrator_onboard.rs + docs/ORCHESTRATION.md (763 lines — HIGH DRIFT RISK: the suffixes were edited ~10 times this effort — wait-for-goal gate, bounce-dont-rewrite, subordination, planning_state, blocked-task triage incoming — while ORCHESTRATION.md likely still describes older semantics; also the two recent behavior changes in flight: cross-machine etiquette task_dc526c35 and blocked-triage TEXT C). Flag every place where two shipped texts disagree on: who owns plan structure, planner subordination vs peer-equality remnants, planning_state vs open-planning-task keying, heartbeat rules, no-poll coverage, wait-for-goal. (3) PROSE PLACEMENT RULE: propose (do not execute) the migration list for inline Rust prose blocks >4 lines that belong in .md files (candidates: PEER_PAIRING_MANDATE_BLOCK, PLAN_SKILLS_PRINCIPLES, MILESTONE_GATE_LADDER, REFLECTION_BLOCK) — .rs keeps only substitution glue; migration itself is a POST-RELEASE follow-up task (P2) unless a contradiction forces an edit anyway. (4) SIZE/TIER DISCIPLINE: for each tier-1 file over 70 lines (general_agent, bootstrap_instructions, codeterm_cli, codeterm_rule), verify every paragraph earns tier-1 (always-shipped) status vs pointing to a tier-3 doc; propose demotions with exact paragraphs. (5) DREAMING_REM (779 lines): out of role-prompt scope — verify only that it contains no stale cross-references to renamed commands/files; note anything else for the mem team, do not restructure. HARD CONSTRAINTS: read-only lane — you file tasks and strides, you do not edit prompts; every claim cites file:line; contradiction findings ranked by behavioral blast radius (an agent acting on the wrong rule TODAY beats a stylistic mismatch).
role_guidance: 'Strong reader, read-only. Start: src-tauri/src/prompts.rs top-to-bottom, then each suffix, then orchestrator_onboard.rs, then docs/ORCHESTRATION.md with the suffixes side by side. Budget most attention on tier-1/tier-3 contradictions — that is where agents get misled today.'
