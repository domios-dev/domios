name: 'Worker charter: loop + competitive context rules'
type: feature
model: claude/sonnet
model_rationale: Workers on looped or competitive tasks get zero contextual rules today — loop iteration pressure and attempt-isolation rules exist only in the orchestrator's head; charter injection is the proven delivery channel (role_guidance already flows through it)
acceptance_criteria:
- Worker charter for a loop-targeted task includes loop id, iteration count/budget, stop condition, and the iteration-evidence instruction
- Worker charter for a task with >1 live execution attempts includes the attempt-isolation rules (own lane only, no peeking, orchestrator judges)
- Orchestrator heartbeat renders live competitive attempts alongside Running loops
- All new prompt wording defined once as shared constants; tests assert via the constant reference, zero re-typed prose literals; no contains-asserts on unrelated prompt files
- Charter stays a no-op for panes without assignment and for non-loop non-competitive tasks (existing tests keep passing)
test_plan: Rust unit tests on render_worker_charter/prepend path with loop-targeted and multi-attempt fixtures (task_attempt_tests.rs patterns); heartbeat render test for the attempts line; manual dev check with a seeded loop
correctness: Loop resolution must match by task id via plan.loops target (no text inference); attempt count must count only live attempts; charter must never leak other attempts' pane ids to a competitor
