body: |
  EVIDENCE (Planner, round-58): task schema ALREADY carries the lane fields — assigned_pane_id, peer (mesh), model, lane (branch/worktree), status_changed_at, execution_attempts — but 11 of 13 current in_progress/in_review tasks have NO pane recorded: the root cause is population discipline at dispatch/report time, display is the second gap. FOUR PARTS, one lane: (1) WORKING-ON ROW on Board and List cards for in_progress/in_review tasks, built from EXISTING fields only: provider-glyph + model (from task.model), pane title or short-id (assigned_pane_id, resolved via pane list when local), mesh peer chip (task.peer: local/ROG/ubunta/eight), branch (from lane), and activity age (now - status_changed_at, or last stride ts when cheaper to thread). HONEST FALLBACKS, never blank noise: missing branch -> amber 'branch missing' warn chip; missing pane -> amber 'no pane recorded'; pane recorded but not found locally and no peer -> 'pane gone' (matches reconciler verdicts). (2) LABELED FIELDS: replace the ambiguous '#...' fragment on cards with labeled elements (branch icon + name; status_label as its own chip) — component leads: PlanBoardView card + PlanListView row + shared bits in planView/. (3) RECORDING DISCIPLINE (the actual fix): (a) daemon-side auto-fill — agent report and plan task update --status in_progress/in_review capture pane id from the caller's CODETERM_PANE_ID, peer from the mesh origin, and branch from the report's declared branch/sha (report templates already carry BRANCH/SHA lines — parse and persist into lane instead of leaving prose-only); (b) worker prompt line (rides the prompt-surgery lane, coordinate with task_dc526c35): report contract requires branch+pane, and the WORKER_TASK_PREAMBLE/report templates already ask for sha — verify + enforce at report-refusal level like the existing dirty-worktree refusal; (4) WATCHER HYGIENE: the TEXT D completion-contract pattern gains a self-cleanup tail — watcher command ends with '; codeterm pane close 636d967b' (or exit for shell-owned panes); while alive, watcher panes are visually distinct: title prefix 'watch:' set at launch (pattern amendment recorded with TEXT D) and the sidebar dims them like done-state; daemon auto-clean OPTIONAL follow-up — do not build a registry in this lane, the title convention is enough for P1. Current live watchers 5fc7aa2d/535cce6b on ubunta: close after their gates fire (orchestrator action, noted for Puccini).
role_guidance: Full-stack worker; coordinate with prompt-surgery (task_dc526c35) for the report-contract line and with Puccini for closing the two live ubunta watchers.
