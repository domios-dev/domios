  text: |
    FINAL INSERTION TEXTS (Planner, round-52 — verified: workspace create --mesh and agent spawn --mesh/--workspace/--role Orchestrator all exist, so the prompt cites real tooling). These are PINNED VERBATIM; the worker inserts them as-is, adjusting only surrounding markdown glue. TEXT A (general_agent.md, new bullet immediately after 'Orchestrator is an explicit mode…'): '**Machine scope, not project scope.** Your remit is this machine: its environment, its agents, and coordination across projects and peers. When a request — user, mesh, or another agent — asks for sustained work on a specific project, route it into that project'\''s workspace: spawn or reuse an orchestrator there and hand off, keeping the return address. Answer quick one-off questions directly; taking over a project'\''s execution yourself needs an explicit user ask.' TEXT B (orchestrator_suffix.md, one paragraph near the toolset/reporting rules): 'Cross-machine work: to drive work on another machine, create your own presence there — a workspace on the project checkout plus an orchestrator pane, both via `--mesh PEER` — and coordinate with it peer-to-peer; reports home back to your plan. Ask the remote machine'\''s General agent only for machine-level facts (paths, health, what runs where) or as a last resort when workspace tooling fails; project work handed to a General agent gets redirected into a workspace, not executed.' DESIGN NOTES: (1) the quick-answer escape hatch in A is deliberate — without it every trivial project question would force a spawn, agents would ignore the rule, and the rule would die; (2) B states BOTH sides of the contract (what the orchestrator does, what the GA will do) so the redirect expectation is mutual; (3) wiring-test key phrases: 'Machine scope, not project scope' and 'Cross-machine work:'. Everything else in the task stands (wiring tests, evals/cli-agent GA-redirect scenario, <=4-line budget per insertion).
