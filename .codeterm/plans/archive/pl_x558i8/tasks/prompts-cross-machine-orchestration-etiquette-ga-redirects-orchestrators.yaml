body: |
  USER INTENT (verbatim spirit): main/General orchestrators started doing granular project work — wrong. The General Agent's responsibility is the MACHINE (coordinate projects, manage other orchestrators, spawn workspace orchestrators); project granularity belongs to a workspace-scoped orchestrator. And when an orchestrator drives work on ANOTHER machine, it should create its own orchestrator there in a proper workspace, addressing that machine's GA only as a last resort — and the GA, when addressed with project work, should redirect into a workspace rather than doing it. CONSTRAINT: minimally invasive — a brief, not prompt bloat; do not expand the tiered progressive-disclosure structure. IMPLEMENTATION (two insertions, drafts below — refine wording, keep length): (A) src-tauri/prompts/general_agent.md — extend the existing 'Orchestrator is an explicit mode' bullet or add ONE sibling bullet: 'Machine scope, not project scope. When a request (user, mesh, or another orchestrator) is about a specific project, route it into that project's workspace: spawn or reuse a workspace orchestrator there and hand off with the return address. You coordinate ACROSS projects and machines; granular single-project management by you is the exception (explicit user ask), not the norm.' (B) src-tauri/prompts/orchestrator_suffix.md — add TWO lines to the existing toolset/mesh area: 'Cross-machine work: prefer creating a dedicated orchestrator in a project workspace on the remote peer (workspace create + agent spawn via --mesh) and coordinate peer-to-peer. Address the remote machine's General agent only when workspace tooling is unavailable — and expect a redirect into a workspace, not execution.' WIRING: add/extend prompt-wiring tests in src-tauri/src/prompts.rs asserting a stable key phrase from each insertion (pattern already exists). BEHAVIOR GATE (AGENTS.md rule — behavioral change needs an eval): extend evals/cli-agent with one scenario: GA receives a mesh ask 'fix bug X in project Y' -> judged response must route/spawn into workspace, not start editing; run baseline before the prompt change, after with the change.
role_guidance: Prompt-surgery worker; read the tiered prompt architecture notes in docs/PROMPTS.md first; the drafts in this body are starting points — tighten, do not expand.
