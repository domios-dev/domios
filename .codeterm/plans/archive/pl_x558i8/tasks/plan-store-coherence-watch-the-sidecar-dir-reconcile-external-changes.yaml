acceptance_criteria:
- External plan deletion/creation visible in the other daemon's API within 2s without restart (live two-daemon test transcript)
- Git-style burst coalesces to one reconcile (debounce log proof); self-writes never loop (suppression unit test)
- plans-changed event emitted on reconcile; frontend picks it up via the existing bcf638f8 refetch path (no new frontend wiring)
- Reuses the Librarian FS-watch machinery — no second watcher implementation (DRY)
