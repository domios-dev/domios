body: |
  THE LAST EXECUTABLE TASK of the plan (user directive, round-90): sequenced strictly AFTER the develop PR merges and release prep stages — this sets Andrey's final test table. GATED ON: every other release-gating lane closed, task_b3789e40 merged, task_cbfaa040 in_review. STEPS: (1) PIN THE SHA: one final sha (the release-prep branch head) — everything below runs at exactly it, recorded in the report; (2) FULL REGRESSION AT THAT SHA on all three machines, each through its own single QA gate, parallel across machines: Mac-Air (local: cargo suite via capped runner + ts-unit + Playwright golden web-mode), ROG via mesh (Windows: build.ps1 suites + Playwright full over CDP against the real desktop app), ubunta via mesh (Linux: capped cargo + Playwright web-mode) — failures at this stage are release blockers: fix via QA-fixer/worker-on-machine rules, re-run the failed suite, do NOT proceed with red; (3) START DEV CONSOLES on all three and LEAVE THEM RUNNING: Air — ./build.sh dev in a visible CodeTerm pane (per AGENTS.md: visible pane so the process keeps an owning PTY, NOT --wait background); ROG + ubunta — real worker panes via mesh starting their dev instances the same visible-pane way; verify each /api/health build sha == the pinned sha (a mismatched sha on any machine = the console is stale, rebuild); (4) KEEP-ALIVE: codeterm keepawake start on each machine for the test window (12h, --display where a UI matters) so nothing sleeps out from under the walkthrough; (5) HANDOFF REPORT to Andrey (via the walkthrough task flip): a three-row table — machine | dev URL/port | build sha | regression verdict (suite counts) | console pane id — plus anything he must know (known accepted exceptions, post-release deferrals list). THEN flip task_30b13c9b (FINAL walkthrough) to pending — its recorded unblock trigger. The consoles stay up until Andrey finishes; teardown is HIS call, not part of this task.
role_guidance: Orchestrator executes personally or via one trusted coordinator lane; uses the mesh worker-pane rules (real panes, no ad-hoc chat) and each machine's single QA gate.
