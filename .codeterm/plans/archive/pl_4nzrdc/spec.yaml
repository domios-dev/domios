sections:
- id: sec_iuo2mk
  title: 'Problem: dollars instead of progress'
  handle: problem-dollars-instead-of-progress
  tags: []
  body: 'The Cursor provider''s usage snapshot fills only spend_* fields (dollars) and leaves session_pct/weekly_pct null. Consequences across the stack: UsageBubble renders a neutral $ pill (isSpend wins at src/components/Usage/UsageBubble.tsx:65) with no classify() thresholds, and the burn-rate engine (src-tauri/src/usage/projection.rs) keys ONLY off pct fields so Cursor never gets a projection. The user-visible symptom: ''some dollars'' where every other provider shows remaining-limit progress. The spend-based assumption is outdated — Cursor plans are rate-limit/progress based.'
  subsections: []
  canvas:
    x: null
    y: null
    collapsed: false
  attachments: []
- id: sec_kys80t
  title: 'Evidence: live GetCurrentPeriodUsage probe'
  handle: evidence-live-getcurrentperiodusage-probe
  tags: []
  body: 'Live probe 2026-07-07 with the keychain token (fixture attached to the execution task). The API returns READY percentages and cycle bounds: planUsage { totalSpend: 18856, includedSpend: 2000, bonusSpend: 16856, limit: 2000, remainingBonus: false, autoPercentUsed: 100, apiPercentUsed: 84.84, totalPercentUsed: 96.70 }, billingCycleStart/End (ms strings), displayMessage ''You have hit your usage limit''. Three confirmed bugs in plugins/provider-cursor/src/plugin.ts: (1) parseUsage ignores the pct fields entirely; (2) fetchUsage reads planUsage.remaining which DOES NOT EXIST in the real response (only remainingBonus: bool) so remainingCents is always null; (3) units bug — planUsage values are CENTS (limit 2000 = $20 Pro allowance) but cursorDollarsToCents() multiplies by 100 again, inflating spend 100x. Also: fetchUsage makes 3 RPC calls; GetCurrentPeriodUsage alone carries everything.'
  subsections: []
  canvas:
    x: null
    y: null
    collapsed: false
  attachments: []
- id: sec_1omjzv
  title: Requirements and acceptance
  handle: requirements-and-acceptance
  tags: []
  body: 'R1: Cursor usage snapshot must expose plan progress via the existing pct fields — weekly_pct = totalPercentUsed (billing-cycle plan progress), session_pct = apiPercentUsed (named-model bucket), both resets = billingCycleEnd. R2: spend values stored verbatim as cents (totalSpend/limit), the x100 conversion deleted; no invented ''remaining'' semantics. R3: UsageBubble prefers pct over spend when pct present (single-line predicate change) — dollars stay visible in UsageDetail as secondary. R4: plugin tests rewritten against the REAL captured fixture, not synthetic values. R5: no provider-id branching anywhere in core — the preference is data-shaped (capability discipline). R6: system-plugin lockstep intact — npm run sync:versions && check:versions green after plugin.js rebuild. Acceptance: with the fixture values, bubble shows session 85% (warn) / weekly 97% (danger) matching Cursor''s own ''hit your usage limit'' state, and projection returns rows for provider=cursor.'
  subsections: []
  canvas:
    x: null
    y: null
    collapsed: false
  attachments: []
- id: sec_fzlu35
  title: Non-goals
  handle: non-goals
  tags: []
  body: No Rust schema changes (UsageSnapshot fields suffice). No new API surface or polling cadence changes. No handling of the autoBucketModels list beyond choosing which pct maps where. No attempt to parse the cursor-agent TUI /usage screen — the dashboard RPC is the source of truth (parseUsage TUI-path stays null-returning for screen text).
