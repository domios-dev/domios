- id: sec_wcir26
  title: 'Phase 1 — plugin: pct mapping + units fix'
  handle: phase-1-plugin-pct-mapping-units-fix
  tags: []
  body: 'plugins/provider-cursor/src/plugin.ts. fetchUsage collapses to a single GetCurrentPeriodUsage RPC (drop GetMonthlyInvoice + GetAggregatedUsageEvents — billingCycleStart/End come in the same response). Payload carries totalPct/apiPct/autoPct + spend cents verbatim. parseUsage maps: weekly_pct=totalPercentUsed, session_pct=apiPercentUsed, both resets=billingCycleEnd; spend_cents=totalSpend, spend_limit_cents=limit (CENTS — delete cursorDollarsToCents x100); drop the dead planUsage.remaining read. Rewrite tests/plugin.test.ts fetchUsage/parseUsage block (~600-634) against the attached real fixture. Rebuild plugin.js, npm run sync:versions && check:versions. Links: spec Evidence + Requirements sections.'
  subsections: []
  canvas:
    x: null
    y: null
    collapsed: false
  attachments: []
- id: sec_g7cf2a
  title: Phase 2 — UI preference + live verify
  handle: phase-2-ui-preference-live-verify
  tags: []
  body: 'src/components/Usage/UsageBubble.tsx:65 — single-line predicate: isSpend = spend_cents != null && session_pct == null && weekly_pct == null (pct wins when present; dollars remain in UsageDetail as secondary). Then live gate on dev 7686: ./build.sh kill && dev restart, open a cursor pane, bubble shows two pct glyphs (85% warn / 97% danger per fixture), aria-label ''usage session 85% weekly 97%'', UsageDetail shows sane $188.56/$20.00, projection endpoint returns rows for provider=cursor. Playwright web-mode spot-check optional if the bubble has a testid. Links: spec Requirements + Non-goals.'
  subsections: []
