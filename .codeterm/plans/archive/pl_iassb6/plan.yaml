- id: sec_hxtrit
  title: Phase 1 — Land & verify in-flight PTY delivery fix
  handle: phase-1-land-verify-in-flight-pty-delivery-fix
  tags: []
  body: |-
    The canonical checkout (this worktree) is currently dirty (uncommitted diff to submit_transaction.rs, plus unrelated in-flight files per git status). Do NOT edit or commit directly here.
    Required flow: (1) create an isolated scratch lane at `../codeterm-worktrees/<branch-slug>` (a fresh git worktree off the integration target, e.g. `git worktree add ../codeterm-worktrees/land-pty-echo-activity -b fix/pty-echo-activity-wait <integration-target>`); (2) reproduce the intended diff there — either `git -C <canonical> diff -- src-tauri/src/service/pty_io/submit_transaction.rs | git apply` into the lane, or hand-port the same change (wait_for_paste_activity, the run() no-verify-echo branch fix, the 2 new tests) — never edit the dirty canonical checkout itself; (3) run the targeted Rust test modules inside the lane; (4) commit in the lane with a message describing the behavior; (5) integrate with a REAL merge commit into the integration target (never cherry-pick/squash/patch-copy — see AGENTS.md "Lane integration preserves ancestry") and verify `git merge-base --is-ancestor <lane-tip> <target-tip>` before the lane branch/worktree is removed.
  subsections: []
