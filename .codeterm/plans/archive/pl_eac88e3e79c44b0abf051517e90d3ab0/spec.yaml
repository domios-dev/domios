- id: sec_gudqzk
  title: Token-efficient reads and edits
  handle: token-efficient-reads-and-edits
  tags: []
  body: |-
    Agents burn tokens on reads and whole-body rewrites, not on writes.
    Requirements:
    - Partial reads: plan get --section <id|handle> renders one section subtree; task reads can exclude/limit bodies.
    - Direct-edit workflow is EXPLICIT: bodies are markdown, stored as yaml block scalars; agents may edit yaml files directly with their standard Edit tools; the watcher reconciles.
    - A locate command returns file:line ranges for a task/section body so an agent can jump straight to the edit site.
    - Bulk mutations: one CLI call carrying N batch ops (plan.batch RPC already exists).
    - Mutation output stays terse; hints suppressed in json/bulk mode.
  subsections: []
  canvas:
    x: null
    y: null
    collapsed: false
  attachments: []
- id: sec_lhcvx0
  title: Markdown bodies rendered in UI
  handle: markdown-bodies-rendered-in-ui
  tags: []
  body: |-
    All bodies (task, plan section, spec section) are markdown by convention.
    The UI must render them as markdown wherever bodies are shown (canvas nodes, board/list, task panels), reusing the existing chat markdown renderer components rather than introducing a new one.
