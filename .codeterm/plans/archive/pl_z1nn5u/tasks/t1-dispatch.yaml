body: |
  Add `PlanTaskAction::Dispatch` (cli/src/args/plan.rs) + a `plan.task.dispatch` RPC (socket/server/plan_task_rpc.rs) that composes, in one call: spawn worker pane (role=Worker, parent=orchestrator) -> `assign_task_with_profile` (pane->task, exports CODETERM_PLAN_ID/CODETERM_TASK_ID) -> `pane.send_text` with the assembled brief. Brief = task body + acceptance + section links + report command + strides (T4 enriches later). Flags mirror existing spawn/assign (--model, --parent override, --workspace, --cwd). SOFT dependency on T4 only — ship the RPC composition without waiting on strides enrichment.
role_guidance: |
  You are a Rust backend engineer working in src-tauri/ (and cli/ where noted). Code-only worker: implement the change, add focused unit tests that match the task body, and report with branch, SHA, worktree, tests run, and gates requested — do NOT run broad builds/suites/UI sweeps (request QA instead). Respect the lock ordering (mux > output_buf > screen_state > agent_tracker > pty); never hold a guard across .await. No source file over 1000 lines — split by responsibility. English only.
