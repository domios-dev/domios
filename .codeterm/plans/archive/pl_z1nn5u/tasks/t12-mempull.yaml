body: |
  At orchestrator AND planner start, automatically pull machine-specific mem orchestration preferences (kind=preference, area=orchestration) and inject them into the pane, layered as deltas over the embedded ORCHESTRATION doc. Replace the current manual "run mem search" recommendation with an automatic pull.

  ORCHESTRATOR PATH (exists): hook the existing onboarding — orchestrator_onboard.rs (make_orchestrator / deliver_orchestrator_onboarding, ~38/73). Inject the pulled prefs alongside/after the onboarding body.

  PLANNER PATH (MISSING — must be added): there is NO planner onboarding today (no make_planner / deliver_planner_onboarding). Add a planner-start injection point — hook the spawn path where role=Planner is assigned, or add a deliver_planner_onboarding sibling — otherwise "inject at planner start" silently no-ops.

  MEM QUERY:
  - Use the IN-PROCESS mem search API (mem/manager_search.rs:101 `fn search` / `search_with_rerank`) via the mem store on ServiceState. Do NOT shell out to the codeterm mem CLI (the daemon must never fork its own CLI).
  - Query kind=preference, area=orchestration. Run it OFF the hot path (spawn_blocking / async) so onboarding delivery is not stalled by mem/embedding work.
  - Empty result -> clean no-op (inject nothing, no noise). Bound the injected size (cap count/length). English only.
role_guidance: |
  You are a Rust backend engineer working in src-tauri/ (and cli/ where noted). Code-only worker: implement the change, add focused unit tests that match the task body, and report with branch, SHA, worktree, tests run, and gates requested — do NOT run broad builds/suites/UI sweeps (request QA instead). Respect the lock ordering (mux > output_buf > screen_state > agent_tracker > pty); never hold a guard across .await. No source file over 1000 lines — split by responsibility. English only.
