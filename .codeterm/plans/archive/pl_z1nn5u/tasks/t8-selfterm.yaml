body: |
  Add a self-termination guard so a coordinator cannot decapitate itself with one command (incident: a coordinator killed itself with a single wrong `pane close`).

  IDENTIFICATION MODEL — there is NO `AgentRole::Planner`; the enum is `{Orchestrator, Worker}` (multiplexer/types.rs:112). Resolve coordinator identity as:
  - Orchestrator = pane with `AgentRole::Orchestrator`, OR the pane is `plan.owner` of some active plan.
  - Planner = `resolve_planner_ref` / `PeerResolution::Planner` (plan/peer.rs) against the plan(s) this pane owns or serves (the plan's `planner` field). Do NOT invent an `AgentRole::Planner`.
  - Worker = `AgentRole::Worker` (self-close via report+exit stays allowed).

  CALLER-ID PLUMBING (explicit scope — caller identity is NOT available at the guard today). `close_pane(&self, pane_id)` (service/pane.rs:33) and `close_workspace` (service/workspace.rs:92) take no caller id. Thread the caller pane id end-to-end using the EXISTING `caller_pane_id` param convention already used by plan RPCs (see socket/server/plan_refs.rs, plan_goal.rs:67, plan.rs:310):
  - CLI reads `$CODETERM_PANE_ID` and passes `caller_pane_id` in the `pane.close` / `workspace.close` RPC params.
  - The RPC handler reads `caller_pane_id` and passes it into `close_pane` / `close_workspace`.

  GUARD LOGIC:
  - Refuse when `caller_pane_id == target pane` AND the target is a coordinator (Orchestrator or Planner per the model above).
  - Refuse when a Planner/Orchestrator closes its OWN workspace (the workspace containing its own pane).
  - Return an actionable error, e.g. "refusing to close your own pane/workspace: a coordinator cannot self-terminate — have your parent or another pane close it, or move first."
  - Fail-safe on missing/absent `caller_pane_id`: if identity cannot be established for a coordinator target, refuse with guidance rather than silently allowing — but MUST NOT break worker self-close or ordinary non-coordinator pane/workspace closes.

  Respect lock ordering (mux > output_buf > screen_state > agent_tracker > pty); do not add a nested pane lock.
role_guidance: |
  You are a Rust backend engineer working in src-tauri/ (and cli/ where noted). Code-only worker: implement the change, add focused unit tests that match the task body, and report with branch, SHA, worktree, tests run, and gates requested — do NOT run broad builds/suites/UI sweeps (request QA instead). Respect the lock ordering (mux > output_buf > screen_state > agent_tracker > pty); never hold a guard across .await. No source file over 1000 lines — split by responsibility. English only.
