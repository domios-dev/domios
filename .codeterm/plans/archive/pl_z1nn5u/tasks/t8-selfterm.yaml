  text: 'DECISION (Orchestrator+Planner): accept fail-safe as-is (option a). The real footgun — an agent CLI-closing its own pane — always carries the caller header, so the self-kill guard fires; the web case is a human/external actor with no ''self'' to protect. Defense-in-depth: no headerless path can close a coordinator. Cost is a bounded UX papercut (human can''t close a coordinator FROM WEB; escape hatches: desktop Tauri, other-pane CLI). BACKLOG (do NOT build now): origin-aware refinement — distinguish web-human origin (HTTP session, no pane) from agent-headerless origin (socket/API), allow the former, still refuse the latter. Revisit only if humans hit it in practice.'
