    title: lane t13-clihang
  kind: status_update
  text: |-
    STATUS: done
    CHANGES: cli/Cargo.toml (+5): [profile.dev.package.codeterm-cli] opt-level=1. branch lane/t13-clihang @6faa6a6e, worktree ct-lanes/t13-clihang.
    ROOT CAUSE (corrects the brief): NOT a lingering tokio runtime/thread/global. The hang is Cli::try_parse_from never finishing — building the full clap command tree (Cli::command) is ~10^4x slower UNOPTIMIZED than release. Proof: single pure-parse test hangs in debug but passes in 0.00s AND the process exits cleanly in --release (no post-pass hang => no detached runtime); execution-only repro (ran pre-built test binary directly, still hangs => not cold-compile-cap). Only tests that call Cli::try_parse_from hung; data_root_*/local-derive-parser tests passed instantly. Fix makes the build fast (not masking): affects cargo-test/dev only; build.sh (release CLI) and cargo check are untouched.
    FIXES RULED OUT (each rebuilt+retested): clap 4.6.0->4.5.48 (not a clap regression); optimizing/ disabling debug-assertions on the clap_builder RLIB (no effect — the hot code is clap generics + clap_derive augment monomorphized INTO codeterm-cli at dev opt-level=0). Optimizing our crate is what fixes it.
    TESTS RUN (scripts/test-capped.sh, 90s cap UNCHANGED): subcommand_contract_tests => 37 passed, finished 0.01s, process EXITS (no cap banner). single delayed_create_parses => ok+exits. full 'cargo test --bin codeterm' => runs to completion and EXITS in ~1s (was: hang@cap).
    PRE-EXISTING FAILURES surfaced now that the suite completes (10, UNRELATED to this change — opt-level cannot alter logic; they were never reached before because the suite hung): cmd::manifest::tests::{cli_manifest_is_fresh,docs_cli_md_is_fresh} (stale — run 'codeterm cli-manifest --write'), cmd::plan_doctor::tests::* (4), cmd::plan_prune::tests::{dry_run_does_not_delete,apply_deletes_smoke_plan}, cmd::plan_skill::store::tests::resolve_explicit_plan_id, cmd::plan::tests::all_backend_plan_error_types_have_cli_renderers. Not in my scope (Phase 5 = CLI test hang); flagging for triage.
    GATES REQUESTED: integration QA to run the full gate (fmt/clippy/check both crates) in a warm checkout; and triage the 10 pre-existing cmd::* failures (start with manifest freshness regen).
    FOLLOWUP: deeper cause is a specific arg pattern in MemGraphAction's augment that clap+unoptimized-codegen handles pathologically (one fixed arg() call site never returns in debug; sampler/lldb couldn't see past trivial arg_internal). opt-level=1 sidesteps it cleanly; could be narrowed later for zero compile cost.
