body: |
  FIRST verify current repro on macOS via scripts/test-capped.sh — a manifest-walk recursion hang already landed (57eb3ac1). The reported symptom "hangs AFTER passed" points to a lingering tokio runtime / background thread / global (daemon-connect, singleton) rather than recursion-during-test. If a hang remains, identify the resource keeping the process alive and ensure clean shutdown so the test exits promptly. If none remains, close as already-fixed with evidence. Do not mask by raising the cap.
role_guidance: |
  You are an infra/test engineer in cli/. FIRST reproduce the macOS test-hang via scripts/test-capped.sh (never a bare cargo test); if it still hangs, find the lingering resource (tokio runtime/thread/daemon-connect/global) and ensure clean process shutdown — do NOT mask it by raising the cap. If already resolved, close with exit evidence. Report branch/SHA/tests + termination proof. English only.
