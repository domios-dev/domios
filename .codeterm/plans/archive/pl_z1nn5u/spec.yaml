  - id: sec_xvsg7c
    title: CLI args-parse test hang on macOS
    handle: c-clihang
    tags: []
    body: |
      **WHAT:** CLI args-parse tests on macOS: assertions pass but the test process does not exit (hangs after 'passed'). Find and kill the cause.
      **WHY:** A hanging test process blocks local/CI runs.
      **Current state:** a manifest-walk recursion hang was fixed (57eb3ac1, manifest.rs hidden-cmd filter) — but 'hangs AFTER passed' points to a lingering runtime/thread/global keeping the process alive, possibly a DIFFERENT cause. VERIFY FIRST.
      **Verification/test hint:** run the CLI args-parse tests on macOS via scripts/test-capped.sh; confirm the process exits within cap. If still hanging, identify the lingering resource (tokio runtime/thread/daemon-connect/global) and ensure clean shutdown; assert prompt exit.
    subsections: []
