      x: null
      y: null
      collapsed: false
    attachments: []
  - id: sec_n7xj4k
    title: Lane panel in task detail (P2)
    handle: a-lanepanel
    tags: []
    body: |
      **WHAT (P2):** Task detail shows a lane panel — pane (clickable to focus), branch, worktree, workspace, with mesh focus/resume actions.
      **WHY:** Lane observability inside the task, not just a table.
      **Current state:** lane data in Task model reaches the detail payload; DetailContent.tsx has no lane panel. `onOpenPane` hook exists.
      **Verification/test hint:** web-mode: a task with lane metadata shows the panel; clicking the pane invokes focus.
