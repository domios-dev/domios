sections:
- id: sec_nnfgik
  title: Overview & scope
  handle: ov
  tags: []
  body: |
    ## Purpose
    Finish the orchestration-ergonomics tail from archived pl_x558i8: let an Orchestrator dispatch, track, and clean up worker lanes with one-command flows and no stranded / self-terminating footguns.

    ## In scope
    Three requirement clusters — A) dispatch ergonomics, B) reliability guards, C) infra (CLI test hang). Fresh structure; do NOT port pl_x558i8 tasks.

    ## Excluded / open
    Sidecar churn (solved by storage v2) and stable pane/tab ids (solved) — see `obsolete`. Remote QA builders is an open question, not build work — see `dg-remoteqa`.

    ## Success signal
    Dispatch a worker in one command; a live lane table; lanes self-clean on close; strides reach executors; task-detail shows role + lane; guards prevent self-kill / stranded in_progress / blind polling.

    **Verification:** end-to-end orchestration dry-run on a scratch plan (dispatch -> lanes -> close-cleanup) plus per-cluster tests below.
  subsections: []
  canvas:
    x: null
    y: null
    collapsed: false
  attachments: []
- id: sec_sz7mcm
  title: Cluster A — Dispatch ergonomics
  handle: A
  tags: []
  body: |
    Dispatch ergonomics: make the common orchestration loop — launch a worker, watch its lane, clean it up — low-ceremony and one-command. Covers dispatch, lane hygiene table, auto-cleanup, strides-to-executor, and task-detail role/lane surfacing.
  subsections:
  - id: sec_kzx9hr
    title: One-command task dispatch
    handle: a-dispatch
    tags: []
    body: |
      **WHAT:** `codeterm plan task dispatch <task>` launches a worker in ONE command — composes spawn(worker, --role, --parent) + assign(pane->task) + send(brief).
      **WHY:** Today an orchestrator runs ~4 manual commands per lane; error-prone boilerplate.
      **Current state:** primitives exist — `plan.task.assign` RPC, `plan.task.respawn`, `pane.send_text`, `assign_task_with_profile` (plan_task_rpc.rs, plan_role_helpers.rs). No composing command (args/plan.rs PlanTaskAction has no Dispatch).
      **Brief must carry:** task body, acceptance, section links, report command, and strides (see `a-strides`).
      **Verification/test hint:** unit-test the dispatch RPC composes the three ops and returns the pane id; CLI smoke on a scratch plan: pane spawned + task in_progress + brief delivered.
    subsections: []
    canvas:
      x: null
      y: null
      collapsed: false
    attachments: []
  - id: sec_j2gmnu
    title: Lane hygiene table
    handle: a-lanes
    tags: []
    body: |
      **WHAT:** `codeterm plan lanes <plan> [--stale]` prints one row per lane — task, status, pane (alive/dead), branch, worktree, cleanup status. `--stale` narrows to problem lanes.
      **WHY:** Orchestrators hand-assemble this from `plan state` + `pane list` + `git worktree list`.
      **Current state:** data exists — TaskLaneMetadata (types.rs:129), lane_liveness::derive_lane_liveness, cleanup_debt detection. No `lanes` subcommand; `plan state` shows only partial lane info.
      **Verification/test hint:** unit-test the row builder joins task+lane+liveness; CLI smoke: columns render, `--stale` filters dead/uncleaned lanes.
    subsections: []
    canvas:
      x: null
      y: null
      collapsed: false
    attachments: []
  - id: sec_rnomw6
    title: Lane auto-cleanup on task close
    handle: a-cleanup
    tags: []
    body: |
      **WHAT:** On task close (done/cancelled) the daemon cleans the lane's MERGED branch + worktree per LANES lifecycle rule #7 and records cleanup_status.
      **WHY:** Cleanup is manual today; stale branches/worktrees accumulate.
      **Current state:** `plan.task.close` (plan_lifecycle.rs:44) only DETECTS debt and returns hints (cleanup_debt.rs). No execution.
      **Safety:** only remove branches already merged into the integration target; never force-delete unmerged work — leave a hint instead. Deletion-only pushes skip build gates.
      **Verification/test hint:** unit-test the executor removes merged branch + worktree and sets cleanup_status=done, and REFUSES on an unmerged branch (hint only). Integration: close a scratch lane -> worktree gone + branch deleted.
    subsections: []
    canvas:
      x: null
      y: null
      collapsed: false
    attachments: []
  - id: sec_hzm6ym
    title: Strides reach executors
    handle: a-strides
    tags: []
    body: |
      **WHAT:** Task strides (pinned decisions, bounce findings, planner notes) reach whoever takes the task — surfaced in `task show`, in the dispatch brief, and in worker prompt prep.
      **WHY:** Strides are invisible to executors today; decisions get lost.
      **Current state:** role_guidance already reaches workers (worker_charter.rs:166, task_attempts.rs:199); strides do NOT. `task show` CLI (cli/src/cmd/task.rs) does not render milestones (React UI does via TaskActivityTimeline).
      **Verification/test hint:** unit-test worker prompt builder includes recent strides; assert `task show` CLI prints a strides section; smoke: a dispatched worker's prompt contains a pinned-decision stride.
    subsections: []
    canvas:
      x: null
      y: null
      collapsed: false
    attachments: []
  - id: sec_vrjvju
    title: Task-detail surfaces role & guidance
    handle: a-roleui
    tags: []
    body: |
      **WHAT:** Task-detail UI shows `executor_role` and `role_guidance` (planner writes them per task; UI hides them today).
      **WHY:** Executors/reviewers cannot see the role contract the planner authored.
      **Current state:** fields exist in model (types.rs:473/475) + CLI flags; DetailContent.tsx does not render them.
      **Verification/test hint:** Playwright web-mode (macOS-gateable): open a task with executor_role + role_guidance set, assert both render in the detail overlay.
    subsections: []
