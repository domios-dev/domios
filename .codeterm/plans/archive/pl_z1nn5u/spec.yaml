- id: sec_vqxn6f
  title: Cluster B — Reliability guards
  handle: B
  tags: []
  body: |
    Reliability & safety guards for orchestration: prevent self-destruction and stranded state, nudge blind polling, and keep hierarchy + preferences correct across handoffs and restarts.
  subsections:
  - id: sec_6gr10i
    title: Self-termination guard
    handle: b-selfterm
    tags: []
    body: |
      **WHAT:** An orchestrator cannot close its OWN pane; a planner cannot close its own pane or its own workspace. (Incident: a coordinator killed itself with one wrong command.)
      **WHY:** One mistaken `pane close` / workspace-close must not decapitate the coordinator.
      **Current state:** ABSENT — close_pane (service/pane.rs:33), close_workspace (service/workspace.rs:92), cmd_pane_close (dispatch/mod.rs:324) have no self/role guard. Role in multiplexer/types.rs:238 (AgentRole).
      **Verification/test hint:** unit-test close_pane refuses when caller pane == target and role is Orchestrator/Planner, and workspace-close refuses the caller's own workspace; returns an actionable error.
    subsections: []
    canvas:
      x: null
      y: null
      collapsed: false
    attachments: []
  - id: sec_ft9qx4
    title: Task-lane watchdog
    handle: b-watchdog
    tags: []
    body: |
      **WHAT:** in_progress must map to a LIVE pane/mesh state — a task with a dead pane and no report is auto-demoted/unassigned, not left lying in_progress (Board currently lies).
      **WHY:** Board shows phantom active work; the orchestrator trusts stale state.
      **Current state:** PARTIAL — detect_plan_drift (reconcile.rs:107, InProgressPaneGone) + pane_probe exist, but reconcile runs only on pane-close / manual. No periodic watchdog; no auto-demote.
      **Verification/test hint:** unit-test the watchdog demotes/unassigns in_progress with a dead pane + overdue report; assert the plan snapshot/Board reflects the demotion. Scheduler tick tested with a fake clock.
    subsections: []
    canvas:
      x: null
      y: null
      collapsed: false
    attachments: []
  - id: sec_2hudui
    title: Polling-smell nudge
    handle: b-polling
    tags: []
    body: |
      **WHAT:** A mechanical nudge to an orchestrator stuck polling `pane get-text`/`get-output`/`chat` (>=3 consecutive) instead of waiting for auto-injected reports.
      **WHY:** Orchestrators burn turns polling; reports auto-inject already.
      **Current state:** PARTIAL — nudge/reminder system exists (plan_reminder_nudge.rs); no tracking of repeated get-output calls (pane.rs GetText/Chat).
      **Verification/test hint:** unit-test a counter that trips after 3 consecutive get-output from the same pane with no intervening report, emits ONE nudge, and resets on report arrival.
    subsections: []
    canvas:
      x: null
      y: null
      collapsed: false
    attachments: []
  - id: sec_wh0twr
    title: Hierarchy relink on plan transfer
    handle: b-relink
    tags: []
    body: |
      **WHAT:** On `plan transfer`, the parent-edge of the planner and of live workers is re-pointed to the NEW owner at runtime.
      **WHY:** After transfer the hierarchy still points at the old owner; reports/nudges misroute.
      **Current state:** ABSENT — transfer (plan_ops.rs:552) only sets p.owner. parent_pane_id in multiplexer/types.rs:244.
      **Verification/test hint:** unit-test transfer relinks the planner + live worker parent edges to the new owner pane; stale edges cleared.
    subsections: []
    canvas:
      x: null
      y: null
      collapsed: false
    attachments: []
  - id: sec_php0ck
    title: Mem-preference auto-pull at start
    handle: b-mempull
    tags: []
    body: |
      **WHAT:** At orchestrator/planner start, machine-specific mem orchestration preferences (kind=preference, area=orchestration) are pulled AUTOMATICALLY and layered over embedded docs.
      **WHY:** Onboarding only RECOMMENDS a manual `mem search` today; machine deltas do not arrive.
      **Current state:** ABSENT — orchestrator_onboard.rs:38 recommends a manual search; no auto-pull/inject.
      **Verification/test hint:** integration: on orchestrator onboarding, area=orchestration preferences are queried and injected into the pane; an empty result is a clean no-op.
    subsections: []
