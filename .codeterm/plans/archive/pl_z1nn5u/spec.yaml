- id: sec_lmipxt
  title: 'DECISION GATE — Remote QA builders (RESOLVED: No)'
  handle: decision-gate-remote-qa-builders-resolved-no
  tags: []
  body: |
    **RESOLVED (Andrey, decision gate): NO — QA stays LOCAL.** QA remains serialized-per-machine on the integration host under the current LANES model. No remote-QA cluster, no build-farm fan-out. This open question is CLOSED and must not resurface at P6.

    **Original question (for the record):** should lane acceptance fan QA gates out to remote build machines (release farm: Mac, ROG, WSL) via mesh? Answer: no.
