body: |
  Agents executing tasks appear as LABELED CIRCLES next to the task they are on; they 'fly' between tasks as they pick up / finish work (animated, easy to notice). A cluster of agent circles also sits in the canvas TOP-RIGHT corner (they live on the canvas); clicking one flies the camera to that agent / its current task to see what it's doing. Full emergence/liveness. Needs agent->task presence data (taskPresence/lane/session); use synthetic presence to develop the UX, flag real-data wiring as a dependency.
