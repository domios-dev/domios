sections:
- attachments: []
  body: |
    The planning system does not guide spec-first authoring. The model (Spec entity with sections, Plan with sections, SpecLink spec_section↔plan_section M:N, primary_spec_id) and CLI verbs (spec create / spec section add / spec link add) all exist, but nothing STEERS the workflow: plan create has a --spec trap that dumps prose into a PLAN section, there is no plan create --from-spec, spec create emits no hint, and docs/CLI.md+ORCHESTRATION.md never describe spec-first / plan-from-spec / M:N. Result: an agent dogfooding sits down and crams WHAT+HOW into plan.sections (observed firsthand).
  canvas:
    collapsed: false
    x: null
    y: null
  handle: problem
  id: sec_79musl
  subsections: []
  tags: []
  title: Problem
- attachments: []
  body: |
    Spec (WHAT/WHY) and Plan (HOW) are TWO distinct entities, each with its own sections. The Plan is built FROM the Spec. A spec section may belong to MANY plan sections (M:N via spec_links). Spec is stable under tactic changes; Plan/Tasks change.
  canvas:
    collapsed: false
    x: null
    y: null
  handle: invariant
  id: sec_o6r7b2
  subsections: []
  tags: []
  title: Invariant
- attachments: []
  body: |
    1) CLI guides spec-first: plan create --from-spec <id> (scaffold a plan bound to a spec via primary_spec_id); spec create hints 'now build a plan from this spec'; plan create WITHOUT a spec warns/hints; the --spec text shortcut is removed or creates a real Spec, not a plan section. 2) Hints after each step nudge the next (spec→plan→link sections). 3) Docs (CLI.md/ORCHESTRATION.md) get a 'Planning workflow: spec-first' section describing the model + command sequence + M:N. 4) Canvas renders the real linked Spec ⊥ Plan (not faked from plan.sections).
  canvas:
    collapsed: false
    x: null
    y: null
  handle: requirements
  id: sec_nrk3ec
  subsections: []
  tags: []
  title: Requirements
- attachments: []
  body: |
    An agent following only CLI hints + the docs authors a correct Spec+Plan (distinct entities, sections linked M:N) WITHOUT using the shortcut, and the canvas shows spec ⊥ plan correctly. The existing dogfood plan + the substrate epic are re-authored into this form.
  canvas:
    collapsed: false
    x: null
    y: null
  handle: acceptance
  id: sec_qosqod
  subsections: []
  tags: []
  title: Acceptance
- attachments: []
  body: |
    Every EFFORT begins with a GOAL (north-star vector), defined FIRST — above Spec. Hierarchy: GOAL → Spec(WHAT) → Plan(HOW) → Tasks → Strides/working-points. The GOAL is MUTABLE and its corrections are RECORDED (working-points on the goal), not silently overwritten. Current model: Goal{vector,vision,constraints,postulates} is current-state ONLY — there is NO change history. Gap: add a recorded goal-change log + a CLI to amend the goal with a reason.
  canvas:
    collapsed: false
    x: null
    y: null
  handle: goal-first-goal-history
  id: sec_0boy3b
  subsections: []
  tags: []
  title: GOAL-first & goal history
- attachments: []
  body: |
    When the orchestrator senses it is ready to compact, it authors its OWN handoff (codeterm orchestrator/plan handoff) INSTEAD of the provider default /compact, continues work EXACTLY from that handoff after compaction, and PAIRS it with a quiet/delayed self-message. The mechanism exists (handoff --mode new|compact, reseed) but the DISCIPLINE is undocumented operationally (ORCHESTRATION.md only hints; the skill even says 'no need to compact between phases'). Must be a crisp documented discipline (docs + orchestrator skill).
  canvas:
    collapsed: false
    x: null
    y: null
  handle: handoff-before-compaction-discipline
  id: sec_00alrl
  subsections: []
  tags: []
  title: Handoff-before-compaction discipline
