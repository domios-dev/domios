  body: |
    Survey & decide: (C) canvas2D/WebGL renderer with camera matrix (Figma's actual approach) — naturally crisp, object size is just the matrix, but lose DOM (markdown/mermaid/inputs/a11y) and reimplement text layout/hit-testing/scroll. (D) SVG vector text — crisp under one transform, no reflow, but rich content (markdown/mermaid) + perf on hundreds of nodes is hard; foreignObject reintroduces DOM blur. Reference projects to study/borrow: tldraw, Excalidraw, Konva/react-konva, PixiJS/pixi-react, Motion Canvas, react-three-fiber, Figma engineering write-ups, rive. Output: a scored recommendation for OUR content profile.
