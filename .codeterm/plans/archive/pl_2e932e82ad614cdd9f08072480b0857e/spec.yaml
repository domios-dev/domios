    The hard part: our cards render markdown + mermaid + counters + stride snakes + inputs. In a canvas/WebGL world we must solve text layout & wrapping, markdown→canvas, mermaid (SVG/canvas), hit-testing, per-node scroll, selection/clipboard, accessibility, and the composer overlay. Decide per-element: GPU-drawn vs DOM-overlay-at-1× (hybrid: world on canvas, a thin DOM layer for the FOCUSED/read node only). Enumerate exactly what we lose vs DOM and the mitigation.
