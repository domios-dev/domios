  body: |
    Base layer is already correct: one world div with a single transform translate+scale (camera), nodes absolutely-positioned at FIXED world-px footprints → screen size = footprint×cam, nothing per-node changes. The violation is the crisp-text band-aid (TaskCard.tsx:296: zoom:crispScale + transform scale(1/crispScale), quantized 0.25 in worlds.ts). CSS transform rasterizes once at 1× then GPU-upscales → blur; the per-card zoom hack re-rasterizes but reflows → measured W1→W2 snap 296→153px and ~5px slot wobble between quantization steps. Crisp-at-any-zoom + no-reflow is unsatisfiable in DOM+CSS; needs a different substrate.
