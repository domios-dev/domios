body: |
  Extract `codeterm-mem` — domain crate 2 of 6.

  ## Scope (move + rewire only)
  Move `mem/**` into `src-tauri/crates/codeterm-mem`. Crate DEPENDS on existing repo-root `crates/mem-store` (`codeterm-mem-store`, already used by mem/dreaming and cli) — whitelist it; NO store consolidation (that would be a logic change violating move+rewire).

  ## Ports (traits DEFINED in codeterm-mem, IMPLEMENTED in app)
  - `MemEventSink` — replaces 1 ref `mem/workers -> api::events::emit_everywhere`
  - `MemHostContext` — replaces 5 `service::ServiceContext` refs (auto_extract, workers)
  - `MemSchedulerPort` — replaces 12 refs `mem/dreaming/schedule -> cron::store::CronStore`; dreaming schedule CRUD goes through the port, CronStore stays app-side. Behavior identical: same rows produced.

  ## Config
  7 `config::memory_config` refs — pass `MemConfig` values in via constructor/port (schema types already live in codeterm-types). No config file loading inside the crate.

  ## Prompts
  Move mem-owned prompt constants (`MEM_EXTRACTION` etc., 6 refs) into the crate; app `prompts.rs` re-exports.

  ## Pre-move
  `pty::ansi::clean_terminal_output_sized` (1 ref from mem/workers) -> `codeterm-util`, with a pty-side re-export shim. Tiny, first commit.

  ## Already dissolved (import rewrites only)
  `agent::models::canonicalize_short` (7 refs) -> codeterm-types shim; `process_util` (5) -> codeterm-util; `paths` (1) -> codeterm-paths.

  ## Lane discipline
  Two commits: commit 1 = port inversion + util pre-move in place, green; commit 2 = pure move + shims + Cargo wiring.
