  text: |-
    STATUS: done — lane/util-crate @135391ed, codeterm-util extracted (leaf crate #2)

    MOVED MODULES (move+rewire only, no logic/signature changes):
    - lock_hold -> codeterm-util (parking_lot+log). Both cfg paths verified: debug [LOCK-HOLD] logging path via test build, release zero-overhead transparent wrappers via 'cargo check --release -p codeterm-util' (Finished, exit 0).
    - process_util -> no_window_std + disclaimed_capture moved (std+libc). no_window_tokio KEPT in app crate (util must not pull tokio runtime per contract). spawn_audit_tests KEPT in app (scans crate src via CARGO_MANIFEST_DIR — moving it would silently gut its coverage).
    - atomic_write (service/plan/atomic_write.rs body) -> codeterm-util (std only, tempfile dev-dep).
    Old paths re-export via 'pub use codeterm_util::...::*;' — all callers + 'super::atomic_write::write_atomic' unchanged.

    DEP JUSTIFICATION: codeterm-util depends on NO in-repo crate (not even codeterm-types — none of the moved modules need DTOs). Deps: parking_lot 0.12 (lock_hold guards), log 0.4 (lock_hold warn), libc 0.2 cfg(unix) (disclaimed_capture posix_spawn), tempfile 3 dev-only (atomic_write tests). ZERO tauri/tokio/domain deps — contract honored.

    SCOPE NOTES: 'secrets is not util' — left untouched. paths already extracted to crates/codeterm-paths (pre-existing) — not touched. slug/time helpers NOT moved: they are scattered across domain modules (crash/liveness/mem/service-plan), not a coherent extractable leaf; consolidating them would be a logic change violating move+rewire-only.

    TEST PARITY: 8 moved-module tests preserved. 7 now run green in codeterm-util (lock_hold 2, process_util 2 macOS, atomic_write 3) — 'cargo test -p codeterm-util' 7 passed/0 failed. The 1 Windows spawn-audit test stays in the app crate.

    TESTS RUN (lane-local, capped):
    - ./build.sh check (full workspace incl. codeterm-util) — Finished, exit 0, only 1 pre-existing unrelated dead_code warning (RefreshPhase).
    - scripts/test-capped.sh cargo test -p codeterm-util — 7 passed, 0 failed.
    - cargo check --release -p codeterm-util — exit 0 (release lock_hold path).
    - cargo fmt --all --check (both crates) — clean.
    - scripts/check-file-sizes.sh — exit 0; new files well under 1000 (lock_hold 209, atomic_write 75, util process_util ~105, app process_util ~150).

    GATES REQUESTED (broad, run in warm QA checkout — not run from this fresh lane):
    - ./build.sh test (full suite; confirms app-side spawn_audit_tests + all downstream still green)
    - bash scripts/clippy-gate.sh (full workspace clippy incl. await_holding_lock DENY across the relocated TimedMutex/TimedRwLock)

    FOLLOWUP: Windows/Linux cfg paths of process_util (no_window_std, no_window_tokio) compiled only on macOS here — cross-platform gate should confirm. Pushed lane/util-crate; ready for integration.
