body: |
  Extract `codeterm-plugin` — domain crate 6 of 6, LAST (most boundary-sensitive cut; provider DTOs and app host traits are stable by now).

  ## Scope (move + rewire only)
  Move `plugin/**` + `chatpreprocessor/**` + `view.rs` + `view_host/**` + `glance/**` + `bubble/**` + `agent_commands/**` into `src-tauri/crates/codeterm-plugin`.

  ## Load-bearing decision (orchestrator-confirmed)
  `AgentProvider` trait + `CapabilityRegistry` + the capability descriptor move INTO codeterm-plugin — app->plugin is the legal dependency direction; the app agent runtime (watchers, live_state, registries) implements against it. This dissolves the `plugin -> agent` 115-ref wall (remaining agent refs are codeterm-types shims). Same treatment for `ChatBackendProvider`, `ChatPreprocessorProvider`, `AgentCommandProvider`, and the Bubble/Glance/View provider traits — trait ownership moves in, registries STAY app. T5's `ChatPreprocessorPort` app impl re-points to the moved module.

  ## Host traits (DEFINED in codeterm-plugin, IMPLEMENTED in app)
  - `PluginEventSink` (replaces 8 `api` refs)
  - `PluginServiceHost` (11 `service` refs)
  - `SocketPathHost` (1 `socket` ref)
  - `MemComputeHost` (4 `mem` refs)
  - `SecretsHost` (5 `secrets` refs)
  Every host fn is a confinement hole — audit each against the FS/sqlite/env sandbox (plugin boundary discipline #4) and include the audit table in the report.

  ## Tests
  - `parity_test.rs` moves WITH the crate — fixtures and assertions byte-identical (the native-vs-JS agreement oracle, boundary discipline #2).
  - Cross-domain plugin tests (`hot_reload` tests calling chatpipeline/transcribe/view_host, 12 refs) move to the app crate's SINGLE tests/main.rs integration binary. codeterm-plugin gets NO dependency on codeterm-bridge.

  ## Lane discipline
  Two commits: commit 1 = trait/host inversion in place, green; commit 2 = pure move + shims + Cargo wiring. Provider detection stays capability-based — introducing any provider-id string match during rewire is a review-reject.
