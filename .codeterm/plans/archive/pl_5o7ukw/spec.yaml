- id: sec_a2r32w
  title: Build/CI/tooling parity
  handle: build-ci-tooling-parity
  tags: []
  body: 'build.sh, scripts/test-capped.sh, clippy-gate.sh, check-file-sizes.sh, pre-push hook, tests.yml CI, sccache, cargo profiles (split-debuginfo, line-tables-only), embed/cli sidecar stubs — all must keep working at every phase. Workspace-level Cargo.toml gets the shared [profile] tables (workspace profiles override member ones — verify the tuned profiles survive). CI clippy gate runs on the workspace (--workspace already used). Version lockstep: workspace.package version inherited by members; npm run sync:versions must keep working.'
