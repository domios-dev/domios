sections:
- id: sec_o12yvg
  title: 'Why: compile/link wall dominates iteration'
  handle: why-compile-link-wall-dominates-iteration
  tags: []
  body: 'src-tauri is ONE crate (codeterm_lib, ~2900 lib tests). Any source edit recompiles the whole crate and relinks one giant test binary; measured: a 2-line edit costs ~2min compile+link while the tests themselves run in ~0-3s. The split''s purpose is to make cost proportional to the touched crate, not the whole app. Success metric: editing one domain (e.g. plan store) rebuilds+relinks only that crate''s test binary in seconds; cold CI wall-clock drops via crate-level parallelism.'
  subsections: []
