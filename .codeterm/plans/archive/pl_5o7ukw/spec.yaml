- id: sec_1skgoy
  title: Hard rules during the split
  handle: hard-rules-during-the-split
  tags: []
  body: '(a) tauri (and tauri-*) dependencies allowed ONLY in the app crate; a domain crate importing tauri is a review-reject. (b) No behavior changes: every extraction commit is move+rewire only — same tests pass before and after (test count parity per moved module). (c) Unit tests move WITH their module into the owning crate; cross-domain integration tests live in the app crate as ONE tests/main.rs (one extra binary max, never one binary per file). (d) File-size discipline and lock-ordering rules apply unchanged. (e) Each phase keeps the workspace green on all 3 CI platforms before the next starts. (f) parking_lot/lock wrappers (lock_hold) move to codeterm-util or types-adjacent crate so domain crates keep the timed-lock instrumentation.'
  subsections: []
