- id: sec_lgztym
  title: Target crate graph (dependency direction)
  handle: target-crate-graph-dependency-direction
  tags: []
  body: |-
    Workspace members under src-tauri/crates/ (bin crate stays src-tauri). Dependencies point strictly one way (leaf -> app); no cycles, enforced by cargo once split. Phase-0 audit artifact: docs/spikes/workspace-split-dep-graph.md.

    Amended target graph: (1) codeterm-types: shared plain data only - selected agent/chat/config/mesh/plan DTOs, enums, serde/schemars derives; zero IO, zero tokio, zero tauri. Do not move provider registries/watchers here. (2) codeterm-util: lock_hold, process_util, generic path/atomic-write/slug/time helpers; no domain logic. (3) Domain crates usable headless: codeterm-plan (plan/** plus service/plan/** and plan reminder/nudge logic, behind app-supplied event/search/skill ports), codeterm-mem (mem/** behind app-supplied event/scheduler ports), codeterm-mesh (mesh/** behind app-supplied event/last-activity ports), codeterm-bridge (bridge/** + transcribe/** + chatpipeline/** behind app-supplied pane/service ports), codeterm-pty (pty/** + multiplexer/** + session/** + dispatch/** once command execution adapters are lifted to app). (4) codeterm-plugin: plugin/** + chatpreprocessor/** + view/view_host/glance/bubble/agent_commands, behind explicit app host traits. (5) app crate src-tauri: tauri commands, REST/socket routes, startup, non-plan service orchestration, cron/logs/notification/update/liveness/keepawake/crash, and all runtime wiring; this is the ONLY crate depending on tauri. cli remains its own crate and may depend on types/util only.

    Real graph corrections: service is not an extractable domain as a whole; only service/plan/** belongs in codeterm-plan. agent is not a pure type crate as a whole; only DTO/status/model/chat types move to codeterm-types. secrets is not util; keep it app/plugin-host-side unless a later codeterm-secrets crate is justified.

    Blocking cycles to break before extraction: app<->types (split pure DTOs from agent runtime), app<->plan (PlanEventSink, PlanSearchPort, PlanSkillPort, PlanClock), app<->mem (MemEventSink and app-owned scheduling), app<->mesh (MeshEventSink and last-activity provider), app<->bridge (BridgePanePort), app<->pty (typed PTY/mux events; app owns service command execution), app<->plugin (plugin host traits for events/service/socket/mem/secrets), plugin<->types (capability registration adapters), pty<->types (move pane/session/status DTOs), bridge<->plugin (capability registration outside bridge), types<->util (keep secrets out of util).

    Phase-2 extraction order: types, util, plan, mem, mesh, pty, bridge, plugin. This is justified by coupling counts: app imports types 368 refs, plan 294, pty 230, util 173, mesh 135, mem 71, plugin 46, bridge 32; plugin is last because it has the most boundary-sensitive host API and parity-test surface.
