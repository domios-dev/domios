  text: |-
    OUTCOME: src-tauri monolith split into 8 domain crates (types, util, mesh, mem, plan, bridge, pty, plugin). tauri confined to app crate. Zero behavior change (verified live: daemon boots, plan/mem/mesh/pty/workspace work). 3373 tests green on all 3 platforms. 12/12 tasks.

    WHAT WORKED:
    - Parallel lane extraction via git worktrees (mesh/mem/pty/plan concurrently on claude+cursor). Cut wall-clock hard.
    - FARM-GATING was the single biggest quality lever. The 3-platform self-hosted farm caught 6+ CI-only bugs the local macOS gate could not see: unstaged AgentRole dedup, cfg(test) search-port cross-crate trap, parity-test plugins-root path, host_exec Windows pipe-drain, file-size allowlist stale path, Windows-only app-only test step. Every one would have shipped to master off a green local run.
    - Two-commit discipline per crate (port inversion in place -> pure move) kept each step green.
    - App-side adapters for foreign-trait impls (LaneStatePort wraps MultiplexerState; bridge_host) to satisfy Rust orphan rule WITHOUT dragging sibling crates into deps. cargo-metadata dep-whitelist proof per crate enforced clean boundaries.

    WHAT FAILED / LESSONS (the useful part):
    1. Local macOS merge-gate was repeatedly INCOMPLETE. Missed, in order across the effort: cargo fmt --check; full cargo test --lib (ran per-crate only, missed app guard tests); check-file-sizes (Linux-only CI step); CI=1 env (parity tests SKIP locally, PANIC on CI). Each gap = one red farm gate + fix cycle. FINAL gate checklist that actually matches CI: cargo check --workspace + cargo fmt --check + CI=1 cargo test --workspace --lib + clippy-gate + check-file-sizes --fail + cargo metadata dep-proof.
    2. Workers (esp. cursor) report done off NARROW checks (crate tests only), skipping fmt/full-suite/guard-tests. Merge-gate caught it but cost cycles. Cheap to catch worker-side; didnt.
    3. Merge-conflict resolution: edited a NON-conflict file (AgentRole dedup) but never git add-ed it -> merge commit shipped without the fix -> red CI. RULE: git status before every merge commit.
    4. cfg(test) test-utilities are invisible cross-crate. new_for_test/TestSearchPort behind #[cfg(test)] worked when the crate was tested standalone but vanished when the APP (a consumer) ran its tests -> 12 panics. FIX PATTERN: a `test-support` cargo feature + app dev-dependency enabling it.
    5. Type duplication vs re-export: pty lane created a 2nd AgentRole in codeterm_types::pty while agent::AgentRole existed -> E0308 collision. RULE: re-export existing types, never redefine.
    6. Moved files break relative paths in FOUR distinct ways this effort: parity plugins-root (CARGO_MANIFEST_DIR/..), resolve_pty_id guard allowlist, file-size allowlist path, include_str! fixture. Every crate move must re-audit path/manifest/allowlist references.
    7. Big-crate workers stall on context exhaustion (Dijkstra wedged at 170k tokens, 95% done, uncommitted). Recovery: assess WIP on disk, hand to a FRESH worker with precise diagnosis rather than restart (same context = same wall).
    8. Cold-worktree build.rs needs dist/ + bundled-cli/ + bundled-embed/ stubs or it fails on `resource path doesnt exist` — an env trap that masked real code state and wedged a worker.

    DISCOVERED (non-split, fixed opportunistically):
    - CI COVERAGE HOLE: cargo test --manifest-path src-tauri --lib tested ONLY the app crate; the extracted crates tests never ran in CI (Windows was app-only entirely). Split made this visible. Fixed to --workspace.
    - Pathological 70s test: usage::store trim did 10k individual sqlite commits, single-handedly set the app-suite floor at 66s. Parameterized the cap -> 8.5s, full coverage.

    SKILLS TO PROMOTE TO MACHINE MEM:
    - The CI-parity merge-gate checklist (above) — the recurring failure was trusting a partial local gate.
    - Cold-worktree build-stub recipe.
    - Crate-extraction pattern: two-commit, app-side adapters for orphan rule, test-support feature, re-export-not-duplicate, re-audit all path/allowlist refs after a move.
    - Farm-gating as default for any multi-platform refactor: local green is necessary not sufficient; the farm is the oracle.
