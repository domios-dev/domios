- id: sec_2jgobq
  title: Phase 1 — workspace scaffold + leaf crates
  handle: phase-1-workspace-scaffold-leaf-crates
  tags: []
  body: 'Convert src-tauri to a cargo workspace (members under src-tauri/crates/), keeping codeterm_lib as the single member first (pure plumbing: profiles inherited, build.sh/test-capped/clippy-gate/CI/file-size all green). Then extract the leaf crates from the phase-0 map (types, util) with tests moving along. Each extraction = one lane, move+rewire only.'
  subsections: []
