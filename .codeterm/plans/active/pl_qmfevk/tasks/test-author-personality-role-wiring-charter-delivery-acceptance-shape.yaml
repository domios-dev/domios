body: 'The charter doc ALREADY EXISTS — docs/contributing/test-authoring.md (written by the Planner round-105, riding the release integration branch; the drill incident of that day is its case study: an opus worker shipped a drill with a CLI-signature error and a spawn-readiness race, never having run it). THIS TASK wires the ROLE around the doc so it activates automatically: (1) PLANNER-SIDE ASSIGNMENT RULE: planner_suffix task-creation contract gains one line — ''a task whose primary deliverable is tests (specs, drills, eval harnesses, baselines) gets executor_role=test-author and role_guidance naming docs/contributing/test-authoring.md as the charter''; wiring test. (2) CANONICAL role_guidance TEMPLATE (constant in prompts.rs, e.g. TEST_AUTHOR_GUIDANCE): ''You are a test-author. docs/contributing/test-authoring.md is your operating charter — read it fully before writing the first test. Non-negotiables: oracle-first, red-green demo in your report, condition-waits never sleeps, agent-readiness gates, bounded everything, smoke-run every harness script against the real CLI.'' — the planner references the constant instead of retyping. (3) DELIVERY GUARANTEE (''предустановлена сразу''): the dispatch composition (plan task dispatch, task_310d7e6b in the parent plan) prepends role_guidance already — verify test-author tasks compose the charter reference into the worker brief; until dispatch ships, the planner pastes the template into spawn briefs (interim rule, one line in the doc). (4) GATE SHAPE: doctor quality (or the review charter) flags a test-author task whose report lacks a red-green demo — mechanical enforcement of the doc''s acceptance shape. (5) The embedded-docs question: decide whether the charter also ships as ''codeterm docs TEST-AUTHORING'' (tier-3, product-general — it is deliberately generalized) or stays a repo doc; record the decision with rationale (lean: embed it — agents on any project benefit, and the stranger''s-repo check passes since the doc names no repo specifics).'
role_guidance: Prompt/Rust worker; read docs/contributing/test-authoring.md first — its final section specifies exactly this wiring.
