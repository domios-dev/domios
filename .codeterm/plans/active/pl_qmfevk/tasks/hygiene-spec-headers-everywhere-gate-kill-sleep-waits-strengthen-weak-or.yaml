body: 'Executes Gaps G1-G3 per the spec. (1) HEADER CONTRACT: every spec gets a 3-8 line header (WHAT / WHY / ORACLE — mirror the 13-canvas house style); the ~10 headerless files listed in Gaps G1 first; codename taxonomies (RAIL-4, GRP-4) defined in the header that uses them. ENFORCE: spec-header gate script (same family as the comment gate) — headerless spec fails CI. (2) SLEEP-WAITS: sweep 70 waitForTimeout to condition waits (expect.poll/waitForSelector); justified residue only with inline reason. (3) WEAK ORACLES: disposition every spec where toBeVisible/toBeTruthy is the sole final assertion — strengthen to behavioral or justify. Zero test semantics changed without recorded reason; golden suite green after.'
