  learnings:
  - id: learn_97i28l
    text: 'Lane cargo tests on this host: a 90s-cap ''hang'' is usually a COLD dep recompile (esp. after a disk-reclaim wipes .rlibs), not a code hang. Precompile with ''cargo test --lib --no-run'' (sccache-served) then run execution-only under the cap. Bare ''cargo test'' (no --lib) builds integration+doctests and blows the cold cap — always narrow with --lib.'
    ts: 1783378294263
    tag: null
  - id: learn_kp3vfr
    text: 'No-report != alive/progressing. A lane can silently STALL (ENOSPC from N parallel cold lane-targets) while its pane stays alive-but-stuck; even its BLOCKED report can fail on write, so NO report arrives at all. Do not infer progress from silence. Mitigations: (1) between dispatch waves, watch ''df'' — N cold worktree targets each ~2-4GB + staged embed/cli stubs exhaust disk fast; reclaim finished-lane targets immediately (rm -rf ct-lanes/<slug>/src-tauri/target, branch persists). (2) On a suspiciously quiet in_progress lane, do a ONE-TIME ''codeterm pane status --pane <id>'' liveness check (not polling) — Working vs gone vs stalled. Note: t9-watchdog catches pane-GONE, not alive-but-stalled, so disk-stall is a separate failure mode from what the watchdog automates.'
    ts: 1783399895830
    tag: null
