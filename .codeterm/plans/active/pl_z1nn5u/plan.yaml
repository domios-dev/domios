- id: sec_87pkuw
  title: Phase 1 — Dispatch & lane CLI
  handle: p1-dispatch
  tags: []
  body: |
    **HOW — Dispatch & lane CLI (backend Rust src-tauri + CLI).**
    1. `plan task dispatch` — new PlanTaskAction::Dispatch (cli/src/args/plan.rs) + `plan.task.dispatch` RPC composing spawn+assign+send (plan_task_rpc.rs, plan_role_helpers.rs, pane.rs).
    2. `plan lanes <plan> [--stale]` — new CLI cmd + row builder joining TaskLaneMetadata + derive_lane_liveness + cleanup_status.
    3. Lane auto-cleanup on close — extend plan.task.close (plan_lifecycle.rs) to execute guarded merged-branch + worktree cleanup and set cleanup_status.
    **Area:** backend + CLI. Files: args/plan.rs, socket/server/plan_task_rpc.rs, plan_lifecycle.rs, service/plan/cleanup_debt.rs, new cli/src/cmd/plan_lanes.rs.
    **Dependencies:** dispatch brief consumes strides from Phase 3 (soft — dispatch lands first, strides enrich it).
