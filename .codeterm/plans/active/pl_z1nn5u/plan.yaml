- id: sec_v2zytc
  title: Phase 2 — Reliability guards
  handle: p2-guards
  tags: []
  body: |
    **HOW — Reliability guards (backend Rust src-tauri).** Five mostly-independent guards, parallelizable across lanes.
    1. Self-term guard — refuse self / own-workspace close for orchestrator/planner (service/pane.rs, service/workspace.rs, dispatch/mod.rs).
    2. Task-lane watchdog — periodic reconcile auto-demoting/unassigning in_progress with a dead pane (plan_reconcile.rs + scheduler; build on detect_plan_drift).
    3. Polling-smell nudge — track >=3 consecutive get-output from the same pane, emit one nudge (pane.rs + plan_reminder_nudge.rs).
    4. Transfer relink — relink planner + live worker parent edges on plan transfer (plan_ops.rs transfer).
    5. Mem-pref auto-pull — query area=orchestration prefs and inject at orchestrator/planner start (orchestrator_onboard.rs + mem query).
    **Area:** all backend.
    **Dependencies:** none hard; watchdog reuses reconcile.
    **Verification:** `./build.sh test` per-guard unit tests (fake clock for watchdog/nudge); manual: transfer a scratch plan, confirm relink + reroute.
