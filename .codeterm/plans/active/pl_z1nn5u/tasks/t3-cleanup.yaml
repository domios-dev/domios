    TESTS RUN: scripts/test-capped.sh -- service::plan::lane_cleanup -> 9 passed, 0 failed (6 pure decision + 3 scratch-git integration: merged/unmerged ancestry, clean worktree remove+branch delete, dirty-worktree refusal).
    CHANGE: plan.task.close now removes worktree+deletes branch and sets cleanup_status=done ONLY when branch is merged into the lane's actual integration target (destination->base->sibling-lane fallback, never assumed master); live pane / unmerged / no-target / dirty worktree -> left intact with hint, never --force. Irreversible branch delete gated behind git merge-base --is-ancestor.
    GATES REQUESTED: full gate in warm QA checkout: cargo check + clippy (both crates) + fmt --check. NOTE: cold lane worktree needed 'node scripts/prepare-embed-stub.js' + stub dist/ and src-tauri/bundled-cli/ to satisfy tauri externalBin/resource validation before the crate compiles; also hit ENOSPC on root volume mid-build (now 86% used).
    FOLLOWUP: integration_target has no plan-level field in the model; I fall back to the first sibling task lane's destination/base. If a true plan-wide integration branch is desired, add a field to Plan and thread it in.
