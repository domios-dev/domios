body: |
  Extend `plan.task.close` (socket/server/plan_lifecycle.rs:44) so on done/cancelled the daemon executes lane cleanup per LANES rule #7: remove the worktree and delete the branch ONLY IF the branch is already merged into the lane's integration target (base/destination); set cleanup_status=done. If unmerged or the pane is live -> leave a hint (current behavior), never force. Reuse cleanup_debt detection; add the executor path. Deletion-only branch ops skip build gates.
role_guidance: |
  You are a Rust backend engineer working in src-tauri/ (and cli/ where noted). Code-only worker: implement the change, add focused unit tests that match the task body, and report with branch, SHA, worktree, tests run, and gates requested — do NOT run broad builds/suites/UI sweeps (request QA instead). Respect the lock ordering (mux > output_buf > screen_state > agent_tracker > pty); never hold a guard across .await. No source file over 1000 lines — split by responsibility. English only.
