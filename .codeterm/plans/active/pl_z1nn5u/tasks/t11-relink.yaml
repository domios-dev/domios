body: |
  On `plan transfer`, relink the parent-edge of the plan's planner and of its live workers to the NEW owner pane at runtime, so reports/nudges route correctly post-transfer.

  WHERE (structural — the load-bearing constraint):
  - Do the relink at the RPC/service layer: the `plan.transfer` handler in socket/server/plan.rs (~line 229), AFTER `store.transfer(...)` returns — that is where BOTH the plan store AND the multiplexer/pane layer are reachable.
  - Do NOT relink inside `plan_ops.transfer`'s `with_plan` closure (plan_ops.rs:552): that closure runs with the plan lock held and has no mux access; mutating pane parent edges there would violate lock ordering (mux is acquired first, never under the plan lock).

  WHAT TO RELINK:
  - Old owner pane: capture from `owner_history.from` (transfer records `p.owner` there before the overwrite), or read the current owner before calling transfer.
  - Workers: enumerate via the plan's tasks' `assigned_pane_id` for in_progress lanes — repoint each such pane's `parent_pane_id` (multiplexer/types.rs:244) to the new owner pane. Do NOT scan all panes for parent == old-owner.
  - Planner: resolve via `plan.planner` / `resolve_planner_ref` (plan/peer.rs, PeerResolution::Planner) and repoint its parent to the new owner.
  - Only touch panes bound to THIS plan/owner; leave unrelated panes alone. A new/old owner with no pane, or no live workers/planner, is a clean no-op.

  Respect lock ordering (mux > output_buf > screen_state > agent_tracker > pty); acquire mux after the plan mutation returns, never nested under the plan lock.
