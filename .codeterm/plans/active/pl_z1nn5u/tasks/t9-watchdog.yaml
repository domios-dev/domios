acceptance_criteria:
- Demote ONLY on LaneLiveness::PaneGone past grace threshold; NEVER demote a ReportOverdue lane (long honest work, no report yet)
- Do NOT demote tasks owned by another orchestrator (respect not_mine / assigned_to_other_orchestrator)
- Recycled pane id hosting a DIFFERENT agent counts as gone (liveness by task's own assigned-pane session)
- Demote = status->pending + clear assigned_pane_id + ONE stride; idempotent (no duplicate strides/re-demote per tick); reuse start_plan_reminder_scheduler cadence
test_plan: 'Unit-test the reconcile action with a fake clock + pane_probe stub: dead+overdue->demoted; alive->untouched; dead-but-recent->grace. ./build.sh test'
correctness: Gate on plan/lane_liveness.rs derive_lane_liveness (PaneGone vs ReportOverdue + thresholds), never raw instantaneous InProgressPaneGone; demoting a ReportOverdue lane kills active work — forbidden; idempotent; respect other-orchestrator ownership; liveness keyed to the task's own session
