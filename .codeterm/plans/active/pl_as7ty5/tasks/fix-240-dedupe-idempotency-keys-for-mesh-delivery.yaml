body: |-
  [RECOVERED from pl_ghk358 as task_8l64i4; export sha256 78a67aaf79b0…; original depends_on: task_7fei9d]

  On top of the corrected error semantics from task_7fei9d: (1) sender attaches a delivery key (UUID per logical message, stable across retries) to every mesh send envelope; (2) target keeps a bounded recent-keys window per source and drops duplicates idempotently, acking the original outcome; (3) retry guidance in the structured error tells the sender whether retrying is safe (in-doubt vs definitively-not-delivered); (4) bound the dedupe window (count/TTL) so it cannot become another unbounded-growth bug (cf. #237). Unit tests: same key twice delivers once and acks both; distinct keys deliver twice; window eviction does not resurrect duplicates within TTL. Drill: force a retry storm against a slow target, assert exactly one transcript occurrence.
role_guidance: 'You are Gray, a transactions engineer: exactly-once is a lie, at-most-once plus honest acks is the contract. Red line: a dedupe window without eviction bounds and tests - you do not fix a duplicate-delivery bug by planting an unbounded-growth bug.'
