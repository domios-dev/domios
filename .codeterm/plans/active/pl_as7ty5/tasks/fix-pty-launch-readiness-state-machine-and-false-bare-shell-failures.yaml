body: 'Repair the backend launch state machine behind user-visible false `spawn_failed` cards. Current `orchestrator/launch.rs` links/reuses a PTY, then waits only for `await_bare_shell_prompt` and writes `SpawnFailed: bare shell prompt did not become ready` after its deadline. Reader setup/runtime failure, PTY EOF, a reused provider TUI, nonstandard shell prompt, concurrent wait signal replacement, and provider unload collapse into that false cause while `pty_id`, session, and Chat remain alive. Implement a per-pane, per-PTY launch generation with explicit reader-ready, shell-ready, launch-written/verified, provider-ready, and terminal failure transitions. Failure causes must be typed; a reused live provider TUI must be Busy/Reused, not a failed spawn. Preserve bounded deadlines only around event waits. Backend reader remains headless; Chat/Terminal mount must not affect launch readiness. Do not use sleeps/polls or provider-id branching.'
