id: task_80xiix
name: Fix PTY launch readiness state machine and false bare-shell failures
type: bug
model: codex/gpt-5.6-terra
model_rationale: New Codex tabs can retain live PTY/session while being mislabeled spawn_failed
personality: null
personality_provenance: null
acceptance_criteria:
- Live/reused provider PTYs never become SpawnFailed solely because a bare-shell prompt was absent; launch state has explicit reader/provider events and typed terminal causes
test_plan: |-
  1. Add focused Rust reducer/driver tests through `scripts/test-capped.sh` covering: `PtySpawned -> ReaderReady -> ShellReady -> launch -> ProviderReady -> AgentReady`; an already-live provider TUI is `Busy/Reused`, never `SpawnFailed`; reader setup failure and PTY EOF become typed failures; concurrent waits cannot overwrite another pane generation signal.
  2. Run the exact focused test alone with `TEST_CAP_SECS=90 scripts/test-capped.sh --manifest-path src-tauri/Cargo.toml --lib <exact filter>`; capture RED against the former bare-shell-only path and GREEN after the repair.
  3. In canonical dev, health-check `http://127.0.0.1:7686/api/health`, spawn a real Codex PTY pane without opening Terminal first, and assert its backend state reaches ready or emits a typed causal failure. No fixed sleeps, polling, or UI-mount dependency.
  4. Run `cargo fmt --check`, `scripts/check-file-sizes.sh --fail`, and the affected provider parity tests. Keep desktop/Linux/macOS contracts provider-capability based, never provider-id branches.
correctness: No UI mount, timer, polling, provider identity branch, or screen substring is treated as launch readiness
