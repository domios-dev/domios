body: |-
  [RECOVERED from pl_ghk358 as task_rxvck2; export sha256 78a67aaf79b0…]

  Per issue #238: decode escaped newline sequences (\n, and decide on \t) in bridge send message text before delivery to messenger services - the user/agent expectation is that \n in a CLI message argument becomes a line break. Guard against double-processing genuinely intended literal backslash-n (rare; decision: decode by default, document; if a raw mode is warranted add --raw). Add a test asserting the delivered payload contains real newlines for the issue's exact repro shape. Update bridge docs/examples. Phase 3 protocol applies.
role_guidance: 'You are Kernighan: text processing correctness is judged at the receiving display, not at the API response. Red line: closing without a real Telegram delivery transcript showing rendered line breaks.'
