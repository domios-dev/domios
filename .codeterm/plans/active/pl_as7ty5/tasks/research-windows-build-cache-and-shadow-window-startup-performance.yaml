body: Implement one machine-scoped build gateway; do not make per-worktree dev isolation the default. build.ps1/build.sh are the sole machine entry points for build/check/dev orchestration. Add a machine-scoped lock and queue with observable owner, job, state, start/end time, queue position, and log path. The warm release-integration checkout owns mutable incremental target artifacts. Ordinary workers stop at source inspection and focused non-heavy checks. An exceptional worktree compile must be explicitly requested, serialized through the gateway, use an isolated target, use a correctly prestarted shared sccache only for immutable compiler outputs, and set CARGO_INCREMENTAL=0. Release builds use a fresh target plus complete source/provenance verification. Preserve health build_sha/instance validation and safe kill ownership only where evidence confirms them sound. The confirmed cross-branch artifact contamination is addressed by eliminating uncontrolled concurrent heavy builds, not by encouraging all worktrees to build. Do not include first-paint/shadow-window instrumentation in this blocking diff; capture it as separate follow-up evidence only after the gateway is stable. Own build.ps1/build.sh, gateway state/lock/queue implementation, focused tests, and directly related health/kill validation surfaces discovered by trace. Branch/worktree remains research/build-performance-1.7.2 at D:/Developer/codeterm-worktrees/build-performance-research from origin/develop. This is the prerequisite for the next warm integration QA run and blocks unsafe heavy worker verification.
role_guidance: 'You are a build gateway engineer. Centralize heavy build ownership through build.ps1/build.sh, make queue state observable, and ensure only the warm integration checkout owns mutable incremental artifacts. Red line: no uncontrolled concurrent full builds, no silent target sharing, no stale provenance accepted as fresh, and no first-paint instrumentation scope added to this blocking change.'
