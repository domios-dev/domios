id: task_odejzc
name: Research Windows build cache and shadow-window startup performance
type: planning
model: gpt-5.6-sol
model_rationale: Release-blocking cross-worktree artifact contamination affects PTY, crash recovery, persona runtime, and Playwright verification; gpt-5.5 is required for the build/runtime architecture and cross-platform gates.
personality: Dijkstra
personality_provenance: null
acceptance_criteria:
- build.ps1/build.sh are the sole supported machine entry points for heavy build/check/dev orchestration, backed by a machine-scoped observable lock/queue.
- Fake overlapping jobs prove one running owner and serialized queue behavior, with owner/job/state/queue position/log/status visible through completion, failure, cancellation, and release.
- The warm release-integration checkout alone owns mutable incremental target artifacts; ordinary worker lanes do not run uncontrolled heavy builds.
- Explicit exceptional worktree compilation is serialized, uses isolated target, verifies prestarted shared sccache configuration, and sets CARGO_INCREMENTAL=0.
- Release mode uses a fresh target and rejects stale/mismatched source and build provenance; health build_sha/instance validation and safe kill ownership remain correct.
- First-paint/shadow-window instrumentation is excluded from this blocking diff; all tests use focused/fake jobs or remote/isolated QA, never concurrent full local builds.
test_plan: 'Oracle: fake-job gateway serialization plus focused build/provenance verification, not two concurrent full builds. 1. Add/run deterministic fake build jobs through build.ps1/build.sh gateway with overlapping requests from distinct worktree identities; pass: exactly one job enters running, remaining jobs queue with observable owner/job/state/position/log, and execution order is serialized. 2. Cancel/fail/complete fake jobs; pass: lock ownership is released, next job advances, failure/status/log remain observable, and no stale owner blocks the queue. 3. Exercise ordinary worker request; pass: it stops at source/focused non-heavy checks and cannot claim the warm mutable target. 4. Exercise explicit exceptional worktree compile request; pass: it is serialized, uses isolated target, CARGO_INCREMENTAL=0, and prestarted shared sccache configuration is validated/logged before compile. 5. Exercise release mode; pass: fresh target is used and source SHA/profile/target/toolchain/flags/features/generated-resource provenance is verified. 6. Verify health build_sha/instance identity and safe kill ownership using focused fixture or isolated process; pass: mismatch is surfaced and kill only targets the owned instance. 7. Run exact focused unit/script tests, git diff --check, and scripts/check-file-sizes.sh; pass: all exit 0. Do not run a local heavy/release build or a concurrent two-full-build test.'
correctness: One machine-wide heavy-build authority; deterministic serialization; observable queue/lifecycle; no uncontrolled mutable target sharing; isolated exceptional compile; verified immutable cache boundary; non-incremental exceptional builds; fresh release provenance; preserved health/kill ownership; no three-build amplification; first-paint instrumentation deferred.
