body: |-
  Prod evidence (pane e3fa0754): the Codex hook changed the pane's agent_session_id TWICE while no JSONL/rollout store existed for either id — unmaterialized claims are being accepted as authoritative, which churned the client (Phase 1 removes the client sensitivity; this fixes the source).
  FIX + INVESTIGATION: (a) gate session binding as provisional-until-store-exists: the last claim wins among provisional ids, and a provisional claim must NEVER evict a materialized binding. (b) investigate WHY the hook claimed two ids with no store (pull the exact prod log window for pane e3fa0754 / session 7eda77da; check hook ordering vs Codex rollout-file creation). Matches the architecture rule: detection keys off the pane's OWN session; unknown -> null (honest) over a guess.
  Destination: canonical feat/1.7.2-stability via lane; worker lane runs NO dev/broad builds — focused Rust tests via scripts/test-capped.sh; prod-log forensics are read-only.
