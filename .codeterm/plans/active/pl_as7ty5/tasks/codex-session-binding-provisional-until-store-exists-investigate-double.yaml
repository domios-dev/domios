  kind: status_update
  text: |-
    STATUS: done
    ROOT CAUSE (proven): bind_reported_session (src-tauri/src/api/hook_routes.rs) gated a SessionStart claim only on exists=nonce_verified||session_exists(new_sid), then overwrote agent_session_id whenever prev!=sid, with NO check on the current binding's materialization. So a provisional (nonce-verified, no rollout store) claim could rotate freely AND evict a materialized pane-owned binding. Matches prod pane e3fa0754: generic source=startup codex reports carried the launch nonce with random UUID sids (7eda77da -> db32d2c8, no ~/.codex/sessions file) and overwrote the materialized 019f4c73 binding. Fileless random-UUID claim = wrong provisional claim, not delayed materialization.

    FIX (Phase 3, narrowest boundary): in bind_reported_session, when the incoming sid is NOT store-backed (!new_materialized) and the pane's current binding IS store-backed, reject with 409 CONFLICT. Provisional cannot evict materialized; materialized claim always wins; last provisional wins when nothing materialized exists. Uses only existing session_exists capability (no trait/capability-API change -> no parity surface touched). Reads only THIS pane's own prev sid, never newest-global (red line honored).

    CHANGES:
    - src-tauri/src/api/hook_routes.rs: eviction guard in bind_reported_session + T11 test provisional_claim_cannot_evict_materialized_binding + regression last_provisional_claim_wins_when_none_materialized
    - src-tauri/src/service/orchestration_pair.rs: rustfmt-only line wrap (pre-existing drift from de18492dd that failed the lane pre-push fmt gate; no logic)

    TESTS RUN: none executed here (cold worker lane; cargo build/test forbidden by lane red lines). cargo fmt --check clean on changed file. Logic hand-verified against all 4 materialization quadrants + existing hook_routes tests (rebind-for-new-conversation, fresh-launch-nonce, cross-pane-duplicate all preserved).

    GATES REQUESTED (warm QA checkout, canonical feat/1.7.2-stability):
      cd src-tauri && TEST_CAP_SECS=90 ../scripts/test-capped.sh -- --lib api::hook_routes::tests
      (expect green incl. provisional_claim_cannot_evict_materialized_binding + last_provisional_claim_wins_when_none_materialized). Plus standard release-head cargo check + clippy on src-tauri.

    FOLLOWUP: No capability API changed, so no provider parity_test additions were required. SHA 8a90caf0121524647dd18a8c3ab82cacfad4c239 on lane/task_j5oud0-codex-binding, pushed. Note the orchestration_pair.rs fmt commit is unrelated baseline drift I had to normalize purely to pass the lane fmt gate.
