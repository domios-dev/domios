body: 'Implement gate_bxfzf4 frontend UX after backend task_x7jps4 defines the reconciliation snapshot. Own src/components/MeshPanel/MeshPanel.tsx; src/components/MeshPanel/MeshCanvas.tsx only to remove the tiny canvas-only WEB UI label; verified Mesh header component under src/components/Titlebar; contextual peer action in MeshPanel/ServiceRow.tsx or PeerTerminal.tsx; src/components/MeshPanel/NetworkTab.tsx configuration boundary; tests/styles. Add global Mesh header control beside peer/service counts: Globe icon + Web UI + compact Ready, Setup required, Conflict, Unhealthy state; primary Open only when healthy; adjacent Setup/Repair/Copy URL/Disable menu and inline progress/errors. Add peer Open Web UI only for verified URL. Use data-testid=mesh-web-ui-action, data-web-ui-state, mesh-web-ui-menu, peer-web-ui-open; no overlap narrow widths, no marketing card or toast-only loading. Keep Settings > Network detailed. Dependency: task_x7jps4 backend snapshot contract; task_zl68wp evidence accepted. Branch/worktree lane/mesh-web-ui-header at D:/Developer/codeterm-worktrees/mesh-web-ui-header from origin/develop. Report STATUS in_review with selectors, responsive screenshots, backend fixtures, and Playwright output.'
role_guidance: 'You are Hopper, a responsive operational UI engineer. Render the backend web-access snapshot without inferring state from peer cards or hiding controls in the canvas. Red line: overlap, toast-only progress, a marketing card, or a control that contradicts backend truth fails.'
