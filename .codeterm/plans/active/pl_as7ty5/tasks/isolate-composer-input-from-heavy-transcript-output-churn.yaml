id: task_dv3o8b
name: Isolate composer input from heavy transcript output churn
type: implement
model: gpt-5.5
model_rationale: 'Routing rationale: high-risk input-critical performance architecture across React state, output batching, IPC, rendering, and cross-platform trace gates requires gpt-5.5.'
personality: Dijkstra
acceptance_criteria:
- A deterministic fixture keeps 25 tabs/panes open while concurrent build-like output and real agent/task stream events produce sustained transcript churn.
- Baseline and after artifacts include keydown-to-paint p50/p95/max, composer render count, main-thread long tasks, IPC/output event rate, transcript size, CPU, and backend lock/queue wait evidence.
- Windows WebView2 and web-mode before/after traces show p95 keydown-to-paint at most 32ms and maximum at most 100ms under the 25-tab fixture.
- Normal typing, IME composition, paste, attachments, and history preserve every input character in order with no dropped or reordered input.
- Transcript, agent/task stream, and tool/output event counts and ordering have no correctness regression; live output remains bounded and visible.
- Heavy QA is executed remotely or in an isolated warm checkout, and diff/file-size gates pass without running a local heavy build.
test_plan: 'Oracle: deterministic 25-tab fixture plus before/after traces on Windows WebView2 and web-mode. 1. Start the fixture with 25 open tabs/panes, concurrent build-like output, and real agent/task stream events; record baseline artifacts for keydown-to-paint p50/p95/max, composer render count, main-thread long tasks, IPC/output event rate, transcript size, CPU, and backend lock/queue wait. Pass: all named metrics and fixture parameters are present. 2. Type normal text, IME composition, paste, attachments, and history actions during sustained output; pass: every input sequence is preserved in order with no dropped/reordered characters and visible controlled-input update on the next frame. 3. Run the identical fixture after the change in Windows WebView2 and web-mode Playwright, capturing equivalent traces; pass: p95 keydown-to-paint <=32ms and max <=100ms in both modes, with no input-critical long-task regression. 4. Compare transcript and tool/agent event counts and ordering before/after; pass: no output or transcript correctness regression and live output remains bounded/visible. 5. Run the exact focused performance harness and Playwright trace command in the remote QA environment; pass: threshold gate exits 0. 6. Run git diff --check and scripts/check-file-sizes.sh; pass: both exit 0.'
correctness: Input responsiveness under sustained 25-tab stream pressure; measured next-frame paint; no controlled-input deferral; no dropped/reordered IME or paste data; transcript and event ordering parity; bounded output; backend lock/queue evidence; Windows WebView2 and web-mode parity; reproducible before/after artifacts; no local heavy-build dependency.
