body: 'Eliminate composer lag under a realistic 25-open-tab build/output workload. Instrument before and after: keydown-to-paint p50/p95/max, controlled composer render count, main-thread long tasks, IPC/output event rate, transcript size, CPU, and backend lock/queue wait evidence. Fixture: 25 open tabs/panes with concurrent build-like output and real agent/task stream events, including enough transcript churn to reproduce the reported lag. Isolate composer state via narrow selectors/memo boundaries; batch/throttle output and expensive parsing off the input-critical path; transitions/deferred work apply only to transcript, never the controlled input value; no synchronous storage/markdown/layout work on keystroke. Own only src/components/Terminal/ChatComposer.tsx; src/components/ChatView/ChatView.tsx; src/store/multiplexer/index.tsx; src/store/multiplexer/context.tsx; src/lib/outputStream.ts; relevant terminal hooks and the focused performance harness. Do not edit output-card rendering owned by task_6761hn or lifecycle parser/reducer owned by task_j97631. Keep the existing lane/composer-output-performance worktree and origin/develop base. Heavy QA runs remotely or in an isolated warm checkout; no local heavy build.'
role_guidance: 'You are Dijkstra, a frontend performance architect. Instrument before optimizing and protect controlled input from transcript, tool-card, store, parsing, and layout churn. Red line: a benchmark without next-frame input proof, lost IME text, or an optimization that delays the controlled value fails.'
