acceptance_criteria:
- A synthetic local-socket client can disconnect before reading a response without killing the daemon; cron complete still passes; no regression to normal CLI RPC responses; evidence includes a focused Rust/unit or integration repro that fails before the hardening and passes after.
test_plan: 1) Add a bounded repro for local socket client disconnect before response read. 2) Implement hardening at the socket response boundary or dependency layer. 3) Run the focused socket repro, cron_complete/restart-project focused test on Windows, and a normal CLI RPC smoke. 4) Record whether interprocess was patched, upgraded, or bypassed.
correctness: Broken-pipe from one local client is isolated to that connection; daemon never aborts; no swallowed errors for successful clients.
