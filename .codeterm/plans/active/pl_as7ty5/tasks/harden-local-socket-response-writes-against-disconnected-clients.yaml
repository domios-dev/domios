id: task_9sqqjo
name: Harden local-socket response writes against disconnected clients
type: implementation
model: opus
model_rationale: Root cause from task_oya3rr exposed a daemon-wide local-socket broken-pipe abort class beyond cron; keep as separate hardening after release-blocking cron fix.
personality: null
personality_provenance: null
acceptance_criteria:
- A synthetic local-socket client can disconnect before reading a response without killing the daemon; cron complete still passes; no regression to normal CLI RPC responses; evidence includes a focused Rust/unit or integration repro that fails before the hardening and passes after.
test_plan: '1) Add a focused Rust repro around the local socket server response path: a client sends a valid JSON-RPC request then disconnects before reading the response; assert the daemon/server task returns a per-client error or continues accepting a second normal request. 2) Implement the response-write hardening at src-tauri/src/socket/server only; broken pipe/connection reset is isolated to the client, other write errors still surface. 3) Run only focused capped commands: TEST_CAP_SECS=90 bash scripts/test-capped.sh --manifest-path src-tauri/Cargo.toml socket::server -- --nocapture; then a normal CLI RPC smoke against dev from integration QA. 4) Do not run bare cargo test or broad Playwright in the worker lane; report exact command/output and cleanup state.'
correctness: Broken-pipe from one local client is isolated to that connection; daemon never aborts; no swallowed errors for successful clients.
