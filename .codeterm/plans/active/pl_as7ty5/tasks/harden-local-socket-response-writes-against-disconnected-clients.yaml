body: 'Generalize the task_oya3rr finding: interprocess 2.4.0 can abort the daemon when a JSON-RPC local-socket response write hits a client that disconnected first. Audit src-tauri/src/socket/server handle_connection and either patch/upgrade interprocess usage or wrap response writes so broken-pipe/connection-reset is a normal per-client error, never process abort. Keep the cron-specific deferral fix intact.'
role_guidance: 'You are a Rust backend engineer. Treat this as process-survival hardening, not a cron feature. Red line: no solution is acceptable unless a disconnected-client repro proves the daemon survives.'
