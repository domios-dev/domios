body: |-
  [RECOVERED from pl_ghk358 as task_4lpla2; export sha256 78a67aaf79b0…; original depends_on: task_2si5jz]

  Implements defect B from the accepted task_2si5jz research report (verify its file:line claims against current HEAD first). In src-tauri/src/crash/lifecycle.rs: (1) classification must not use restart downtime as a crash/ambiguity signal - derive ambiguous-work classification from ACTUAL binding state (which panes/sessions were bound and in what state at shutdown vs what restored), not elapsed time; (2) once the current epoch is proven healthy (bindings restored, agents ready), CLEAR or transition the current-epoch crash state so a UI refresh can never resurface a stale session warning - the warning's lifecycle ends at proven health, not at user dismissal; (3) update docs/crash-recovery-supervisor.md to match the new classification and state lifecycle, bumping its revision tag per repo docs rule. Tests: classification fixture with long downtime + fully-restored bindings asserts healthy (not ambiguous); a healed epoch followed by a state re-read (the refresh path) asserts no warning re-emitted.

  WORKER STATE: BindingEvidence bound_at_shutdown vs restored; shortfall is only ambiguity; heal_current_epoch at real BootStage AgentReady, durable healed_at; crash_presentation reads no clock; audit intact in last_crash.json/crash_history.json; docs at revision 2. Worker also logged 4 TOOLING BUGS: stale CODETERM_TASK_ID after pane rebind; report echo fails on long text; charter reminder omits --status; report without --status leaves task pending silently.
role_guidance: 'You are Lamport: elapsed time is not evidence of failure - state is. Red line: any classification branch that still reads downtime, or a warning that survives a proven-healthy epoch in any code path including refresh.'
