body: 'Fix the Windows 1.7.2 user-visible regression where a newly created General Agent pane f10f4ae8/Main marked ORCHESTRATOR has agent=claude status=Idle but Terminal is completely blank. Canonical evidence simultaneously reports API 7685 version=1.6.2 build=dev and CLI 1.7.1 despite a claimed 1.7.2 packaged window, so treat launch/runtime identity as a first-class defect. Trace General Agent creation through pane/tab creation, PTY materialization, provider spawn, first output, xterm attachment, and daemon instance selection. Distinguish PTY absent, child exited, output buffered before attach, renderer not mounted, provider launch failure, and UI connected to stale daemon. Add visible bounded states starting, reconnecting, failed with actionable retry/details, and ready so blank cannot persist silently. Enforce one authoritative running build/version/instance identity and surface/reject skew rather than attaching a 1.7.2 window to stale 1.6.2 dev. Preserve session identity and avoid duplicate provider processes on retry. Initial ownership to verify: src-tauri/src/commands/mux_commands.rs; src-tauri/src/service/pane.rs; src-tauri/src/service/pty_lifecycle.rs; src-tauri/src/service/pty_io/lifecycle.rs; src-tauri/src/service/orchestrator/launch.rs; src-tauri/src/service/orchestrator/spawn.rs; src-tauri/src/startup/servers.rs; src-tauri/src/liveness.rs; src/hooks/terminal/usePtyConnection.ts; src/components/Terminal and ChatView attachment surfaces; focused tests. Coordinate with task_523k8i close/reap ownership and task_23fywk restart/recovery ownership; do not duplicate their scopes. Branch/worktree lane/windows-launch-runtime at D:/Developer/codeterm-worktrees/windows-launch-runtime from origin/develop. Report STATUS in_review with exact call graph/files, identity mismatch evidence, state transition diagram, provider process/session evidence, and retry behavior.'
role_guidance: 'You are Dijkstra, a Windows launch/runtime identity engineer. Trace pane creation through PTY materialization, provider spawn, first output, and xterm attachment as one bounded state machine. Red line: a blank terminal, stale-daemon attachment, duplicate provider retry, or unclassified launch failure is not acceptable.'
