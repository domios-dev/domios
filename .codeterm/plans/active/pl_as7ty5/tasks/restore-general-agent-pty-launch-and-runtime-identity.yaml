  text: |-
    IN_REVIEW: STATUS: in_review
    CHANGES: Preserved the dirty PTY lane and closed the remaining GA retry ownership gap. Each Windows ConPTY shell is now created suspended, assigned to a pane-scoped Job Object with JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE, then resumed; provider descendants inherit the job. Termination uses TerminateJobObject, closes writer/reader/channel/HPCON ownership, and exposes a PtyReaper. GA retry waits at most 5s for both job-empty and backend-reader EOF; timeout/error emits SpawnFailed with details, clears agent_booting, and does not spawn a replacement. Retry claim remains single-owner/idempotent. Spawn logs now join pty_id to child_pid. STARTF_USESTDHANDLES + STARTF_USESHOWWINDOW + SW_HIDE remain; CREATE_NO_WINDOW is absent.
    CALL GRAPH: POST /api/agents/general/{pane_id}/restart -> claim_general_agent_pane_retry -> restart_general_agent -> PtyManager::begin_kill -> WinChild::kill/TerminateJobObject -> drop PTY pair/ClosePseudoConsole -> PtyReaper::wait_bounded(job empty + BackendReaderLease EOF) -> start_general_agent -> build_session -> PsuedoCon::spawn_command(CREATE_SUSPENDED -> AssignProcessToJobObject -> ResumeThread) -> register_session(child_pid log) -> link_pty -> backend reader -> shell/provider launch -> AgentReady.
    STATE MACHINE: failed|idle -> claim -> PtyStarting; duplicate retry while agent_booting/launch stage -> no-op; teardown success -> PtySpawned -> ShellReady -> AgentLaunching -> AgentReady; teardown error or 5s timeout -> SpawnFailed(reason), agent_booting=false, no new provider.
    IDENTITY EVIDENCE: supplied incident is 1.7.2 window vs API 7685 version=1.6.2 build=dev; this pane's codeterm identify returned CLI 1.7.1. No live identity probe was rerun under the source-only restriction. Existing stale-runtime guard changes were preserved.
    CENTRAL WINDOWS QA ORACLE (run only against the packaged candidate, never prod 7685; launch candidate manually, no wt/Start-Process): set $Port to candidate port; $Health=Invoke-RestMethod http://127.0.0.1:$Port/api/health; $Daemon=(Get-NetTCPConnection -State Listen -LocalPort $Port).OwningProcess; load candidate token and set $H=@{Authorization="Bearer $Token"}; $Ga=(Invoke-RestMethod -Headers $H http://127.0.0.1:$Port/api/panes | Where-Object protected | Select-Object -First 1); capture $Before=Get-CimInstance Win32_Process | Select ProcessId,ParentProcessId,Name,CommandLine. From log record '[general-agent] PTY <pty> linked to pane <pane>' plus 'Spawned PTY <pty> ... child_pid=Some(<root>)'. Recursively walk Win32_Process ParentProcessId from <root>; require one shell root, one provider descendant, matching pane/session binding log, and exactly one OpenConsole.exe with ParentProcessId=$Daemon. POST Invoke-RestMethod -Method Post -Headers $H http://127.0.0.1:$Port/api/agents/general/$($Ga.id)/restart twice concurrently. Poll process census and logs for <=5s: first response restarted=true, second restarted=false; every old root descendant and old OpenConsole PID absent before the new child_pid appears; exactly one new OpenConsole and one provider descendant; no conhost.exe child with CommandLine '*conhost.exe 0x4*'; MainWindowHandle=0 for all new helper/provider processes. On timeout require pane boot_stage=spawn_failed with boot_failure_reason and no new root PID.
    FILES: src-tauri/pty-fork/Cargo.toml(.orig), src-tauri/pty-fork/src/win/{mod.rs,psuedocon.rs}, src-tauri/crates/codeterm-pty/src/pty/manager.rs, src-tauri/src/service/pty_lifecycle.rs, src-tauri/src/service/general_agent/lifecycle.rs. Earlier dirty lane files for env scrub, prompt bytes, retry route, and UI state were preserved.
    TESTS RUN: rustfmt direct --check on focused Rust sources; git diff --check; bash scripts/check-file-sizes.sh --fail; PowerShell static invariant scan for SW_HIDE/STARTF_USESTDHANDLES/CREATE_SUSPENDED/job assignment-before-resume/TerminateJobObject/bounded wait/no CREATE_NO_WINDOW. All pass.
