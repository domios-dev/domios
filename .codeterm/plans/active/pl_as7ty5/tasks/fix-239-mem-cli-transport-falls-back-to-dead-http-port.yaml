body: |-
  [RECOVERED from pl_ghk358 as task_s5ja8t; export sha256 78a67aaf79b0…]

  Per issue #239: (1) route codeterm mem CLI calls through the same transport selection as the working commands (CODETERM_SOCKET_PATH socket first, HTTP fallback only when a listener is actually configured); (2) when mem is disabled/unavailable, return a clear capability error naming the cause instead of a connection error to a dead port; (3) investigate why the daemon exposed no mem.* capabilities in that state (feature gating, init failure, headless mode) and surface that state in codeterm capabilities output. Add a test covering CLI transport selection when HTTP is down but the socket is alive. Phase 3 protocol (sec_l7vkwa) applies.

  BLOCK REASON: lane/fix-mem-cli-transport improved HTTP-down diagnostics (criterion 2 done) but socket exposes NO mem.* methods — mem is HTTP-only by design; criterion 1 needs a separate daemon-side mem-over-socket capability design. Decision pending: re-scope vs design task.
role_guidance: |-
  You are Thompson, a transport engineer: one resolution order for all commands, no special-case ports. Red line: fixing the mem port without unifying it with the transport selection the working commands already use.
  BLOCK REASON (Orchestrator decision 2026-07-17): lane/fix-mem-cli-transport improved HTTP-down diagnostics (criterion 2 done) but socket exposes NO mem.* methods — mem is HTTP-only by design; criterion 1 needs a separate daemon-side mem-over-socket capability design. Decision pending: re-scope vs design task.
