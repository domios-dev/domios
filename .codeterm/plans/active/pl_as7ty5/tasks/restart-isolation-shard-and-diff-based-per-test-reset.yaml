  text: |-
    IN_REVIEW: task_cgoixr landed at d189ea250 on feat/1.7.2-stability (local commit, on top of f9fca3c05).

    DONE:
    1. RESTART ISOLATION: @restart tag on all daemon-killing tests (multiplexer kill/restart, whole 07-cron file — beforeEach restarts into mock clock, whole 15-extensions file — wipeDevState per test). smoke/golden/full now grepInvert @restart; new serial restart project (10 tests in 3 files) runs them alone. Ordinary shards can no longer lose their daemon mid-run — precondition for task_kb1ncv parallelism.
    2. DIFF-BASED RESET: api fixture snapshots workspace/pane ids before each test and closes ONLY what appeared after; blanket apiReset now runs once per spec file (stray safety net) instead of after every one of 183 tests.

    EVIDENCE: mem+api golden shard 15 passed 6.1s, twice; restart probe passed with daemon healthy on the new sha after the kill/restart cycle; golden --list 177 / restart 10 / smoke 27; tsc unchanged vs HEAD.

    BONUS FINDING (pre-existing): 07-cron leaves the dev daemon with a mocked clock for every subsequent suite in a shared run — now contained by isolation but worth a daemon-side reset eventually.

    NEXT: task_dycecc (runtime stub provider, Rust) — the big one.
