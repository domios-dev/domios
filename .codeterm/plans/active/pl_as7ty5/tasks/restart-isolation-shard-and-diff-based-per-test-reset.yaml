id: task_cgoixr
name: Restart-isolation shard and diff-based per-test reset
type: qa
model: opus
model_rationale: Daemon kill/restart tests (02-multiplexer, 15-extensions, 18-reorder, 10-restore) cost 30-60s+ each and poison future parallelism; apiReset sweeps every workspace+pane over REST after EVERY of the 183 tests even when the test created nothing.
personality: null
personality_provenance: null
acceptance_criteria:
- All daemon-restart tests carry a dedicated tag (e.g. @restart) and a config project runs them as one serial shard; no other golden shard contains a daemon restart
- Per-test teardown closes only tracked resources the test created (panes AND workspaces); blanket apiReset runs only at file boundaries
- Golden project minus @restart passes with the new reset on at least one platform, and measured suite time drops vs the shard-table baseline
test_plan: '1) Tag restart tests; add a restart project to playwright.config.ts mirroring golden grep + @restart. 2) Extend helpers/fixtures.ts: workspace tracking analogous to paneCleanup; api fixture teardown closes tracked-only; move blanket apiReset to a per-file afterAll. 3) Run a deterministic shard (06-mem + 11-api + 02-multiplexer minus restart) before/after: npx playwright test --project=golden <selector> --global-timeout=1800000 -> green + timing delta recorded. 4) Run the @restart shard alone -> green.'
correctness: 'No cross-test leakage: a test that creates nothing must not be able to see a prior test''s workspaces; restart tests still fully covered, just isolated.'
