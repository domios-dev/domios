  text: |-
    IN_REVIEW: BOUNCE RESPONSE task_cgoixr — diagnosed with full evidence chain, harness corrected, runtime defect isolated into task_oya3rr.

    ROOT CAUSE (the daemon disappearance ROG saw): a REAL Windows runtime defect, NOT harness. The dev daemon intermittently dies INSTANTLY right after a oneshot cron run completes. Local repro on this Windows box: 2 deaths / 4 oneshot completions across 3 full restart-project runs + 1 standalone. Exact signature (matches ROG codeterm.log): 'Cron run completed' -> 'Killed PTY <agent> process tree; ConPTY handles closed' -> 'Oneshot cron auto-deleting' -> instant silent death within ~300ms: no panic, no WER dump, no wry teardown lines = TerminateProcess-class. Next start classifies AbnormalExit (ROG 17:59:22Z observation ✓; the nearby WebView2 0x8007139F lines belong to normal killDevConsole teardowns, not the defect).

    HARNESS EXONERATED with accounting: build-gateway job logs show exactly 7 dev-start jobs = 1 multiplexer + 6 extensions; cron beforeEach never killed (every daemon start has the mock-clock line); no harness kill coincides with the death timestamps. Correlation of failing runs: fresh daemon + hidden general-agent ConPTY spawn ~2s before the fatal ConPTY teardown; standalone cron on a warm daemon survives.

    CORRECTIONS LANDED (3b04458a8, on top of d189ea250):
    1. api fixture self-heals a dead daemon at setup (ensureDevConsole when 7686 down) with a fixture-scoped 660s timeout so revival does not eat the per-test budget — one daemon crash now fails exactly ONE test; the ROG failure #2 cascade class (fetch failed during fixture reset) is eliminated.
    2. diff-reset teardown tolerates a dead daemon.
    PROOF: run3 cron 3/3 green including oneshot (daemon survived) and recurring (16ms). Runs 1-2 prove the repro; run3 proves the cascade fix.

    NEW BOUNDED DEFECT: task_oya3rr (rust-backend-dev, p1) — Windows daemon termination at oneshot completion; carries the full evidence, exact bounded repro command, instrumentation plan (Security-4689/ETW terminator capture), suspect surface (codeterm-pty ConPTY teardown racing concurrent ConPTY spawn), and 5-consecutive-clean-runs acceptance.

    REMAINING KNOWN FLAKE (pre-existing infra, not this task): extensions wipe-per-test occasionally hits the dev--wait leftovers race; the retry succeeds but blows their own 180s setTimeout (seen in run3: 2 fails). Fix option if desired: raise extensions per-test caps inside the restart project only.

    ASK: ROG platform owner re-runs the exact gate command at 3b04458a8+ and reports sha/health/pass-fail/artifacts per the bounce checklist. Expected outcome there: 10/10 when the runtime race does not fire, or exactly ONE honest oneshot failure when it does (no cascade) — either is consistent until task_oya3rr lands. Release-blocking classification of task_oya3rr is your call; my recommendation: yes for 1.7.2 (user-facing crash class), scheduled as its own lane.
