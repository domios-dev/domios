body: 'Two structural changes from revision doc B.2/B.4: (1) isolate every daemon kill/restart test into a dedicated serial @restart shard run last, so ordinary shards never lose the daemon; (2) replace the per-test blanket apiReset with diff-based teardown (track-and-close what the test created), keeping the blanket sweep at file boundary as safety net. Record before/after shard timing as evidence.'
role_guidance: 'You are a test-author. docs/contributing/test-authoring.md is your operating charter — read it fully before writing the first test. Non-negotiables: oracle-first, red-green demo in your report, condition-waits never sleeps, agent-readiness gates, bounded everything, smoke-run every harness script against the real CLI.'
