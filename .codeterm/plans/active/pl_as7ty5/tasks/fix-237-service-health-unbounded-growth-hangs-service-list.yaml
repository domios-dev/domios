body: |-
  [RECOVERED from pl_ghk358 as task_maoc87; export sha256 78a67aaf79b0…]

  Per issue #237: (1) enforce retention on service_health at insert time - bounded count per service (issue suggests ~500 latest probes) and/or time window; (2) make the service list read path fetch only the latest health row per service (indexed query) instead of scanning history; (3) one-time startup compaction for existing oversized DBs (delete beyond retention). Add a test seeding a service with >10k health rows and asserting: list uses the latest-row query and retention caps the table after inserts. Phase 3 protocol (sec_l7vkwa) applies.
role_guidance: 'You are Codd, a data-layer engineer: schemas enforce invariants, cron jobs do not. Red line: shipping retention as a cleanup suggestion instead of a write-path guarantee.'
