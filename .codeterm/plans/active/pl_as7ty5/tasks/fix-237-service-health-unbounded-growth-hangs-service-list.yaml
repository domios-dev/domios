- 'Retention enforced: after N inserts, per-service service_health row count never exceeds the configured cap - proven by test'
- 'service list latency independent of history size: test with 10k+ seeded rows completes via latest-row query, no history scan'
- Existing oversized DB is compacted on startup without data loss for services/activity tables
test_plan: Locate the module via rg service_health src-tauri/src, then cd src-tauri && TEST_CAP_SECS=90 bash ../scripts/test-capped.sh -- <located_module> ; new retention + latest-row tests green, 0 failed; before/after timing of the seeded-10k-row codeterm service list call captured in the task report
correctness: The health-history table is structurally incapable of growing until reads time out - bounded by retention at write time, not by operator cleanup
