body: |-
  [RECOVERED from pl_ghk358 as task_8e3uyw; export sha256 78a67aaf79b0…]

  STEP 1 - REPRODUCE + CONFIRM MECHANISM: on dev, drive Chat UI-equivalent sends (chat_send_text path) and cross-pane sends into a live Codex pane; establish the deterministic repro (long paste, timing vs ingestion) and confirm or refute the disarmed-retry hypothesis by diffing 9dbcda652's effect on the MAX_ENTER_ATTEMPTS retry loop in submit_transaction::run() - specifically whether a swallowed first Enter still triggers a second Enter under optimistic opts, or the loop now exits on the softened path. Record the verdict with the exact code path. STEP 2 - DETERMINISTIC RETRY, NOT VETO REVERT: restore a bounded Enter-retry protocol that operates WITHOUT re-introducing the send veto: after Enter, wait the bounded evidence window; if the strategy reports not-drained (text still in composer), re-send Enter up to MAX_ENTER_ATTEMPTS (idempotent - the composer still holds the text, a second Enter cannot double-send an accepted message); exhausted retries surface submit_observed=false AND a visible pane/message failure state (never silent). Transport ack stays optimistic; the retry engine keys on evidence, not on erroring the caller. STEP 3: regression tests in the harness (swallowed-first-Enter frame sequence must produce a second enter: write under optimistic opts) + live Codex drill 3x long paste, zero parked composers. Coordinate scope with task_4bfewm (actions) and the acceptance-seam task - this task is the minimal deterministic fix, not the full seam.
role_guidance: 'You are Dijkstra. The retry loop was a load-bearing mechanism disguised as verification - prove what 9dbcda652 actually disarmed before re-arming it. Red line: re-introducing the send veto, or a retry whose idempotence you assert but do not test against an already-accepted message.'
