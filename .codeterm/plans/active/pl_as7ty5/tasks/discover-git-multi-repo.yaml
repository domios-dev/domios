  kind: status_update
  text: |-
    IN_REVIEW: STATUS: in_review
    CHANGES: none (read-only validation). Confirmed plugins/git/src/plugin.ts:494-507 is the entire ownership surface for repo discovery today, and the early return at lines 495-499 prevents any child scan whenever cwd is inside a repo. Confirmed plugin test harness pattern is per-plugin npx tsx tests loaded via VM, but scripts/plugin-tests.sh:9-53 does not currently register a git plugin suite, so the minimal implementation surface for follow-up is plugins/git/src/plugin.ts + plugins/git/tests/plugin.test.ts + scripts/plugin-tests.sh.
    BUILD/TYPECHECK/TESTS: Read-only focused checks only. Ran: rg -n "gitRepos|show-toplevel|rev-parse|\.git" plugins/git/src/plugin.ts plugins/git -g '!dist'; Get-Content plugins/git/src/plugin.ts / scripts/plugin-tests.sh / neighboring plugin tests; git show origin/develop:plugins/git/src/plugin.ts. Findings: current contract is incorrect for multi-repo discovery because an enclosing repo returns only its top-level root; current child scan only checks immediate children and only host.fileExists('<child>/.git'), which conflates .git directories/files and does not define dedup/containment behavior. Recommended bounded contract for implementation/tests: 1) If cwd is inside a repo, include that containing repo root in results but continue bounded downward scan strictly within that root only; never ascend above the resolved root. 2) If cwd is not inside a repo, scan strictly within cwd only; never inspect parent/sibling paths outside cwd. 3) Discover repos by checking immediate children plus nested descendants within the bounded root, recognizing both .git directories and .git files/worktrees as repo markers. 4) Deduplicate deterministically by normalized repo path; if cwd resolves to the same repo as a discovered descendant/worktree alias, emit one entry only. 5) Preserve deterministic ordering: containing/root repo first when present, then remaining discovered repos in stable lexical path order. 6) Enforce explicit traversal caps in the contract: maximum discovery depth and maximum entries returned; stop descending once caps are met. 7) Skip unsafe/non-project directories during descent (.git internals, node_modules, dist, build/target-style artifact trees, hidden system dirs/symlink escapes if host API exposes them). 8) Non-repo parent behavior: when cwd itself is not a repo parent, return [] unless bounded descendants contain repos. Required fixture design: one root fixture with three bounded repos visible from the scan root (root repo itself plus two nested/sibling repos, with at least one using a .git file/worktree marker), and one non-repo-parent fixture where cwd is outside any repo and should not escape upward. Expected assertions: inside nested working tree => root repo included and child repos still discovered; parent non-repo dir => only bounded descendants returned; worktree-style .git file recognized; duplicate logical repo paths collapsed; traversal never returns repos above the bounded root.
    FOLLOWUP: Implementation should add a dedicated plugins/git/tests/plugin.test.ts using the existing assert/eq + VM-loaded plugin.js pattern from provider plugins, with a stub host that controls exec/fileExists/listing behavior for the bounded fixtures. Register that suite in scripts/plugin-tests.sh under both all and a new git case. Focused command for QA/test-runner lane after implementation: npx tsx plugins/git/tests/plugin.test.ts
