  4. Run git -C D:/Developer/codeterm-worktrees/release-1.7.2-integration status --short; pass: read-only task leaves it clean.
correctness: The contract is correct only if it keeps the enclosing root, discovers valid child repositories, is bounded and contained, and has an executable fixture oracle.
