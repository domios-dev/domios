  kind: status_update
  text: |-
    IN_REVIEW: STATUS: in_review
    CHANGES: none. Read-only audit. plugin_manager_snapshot Tauri command goes src-tauri/src/commands/plugins.rs -> src-tauri/src/commands/plugins/action.rs cached_plugin_snapshot() -> src-tauri/src/commands/plugins/snapshot.rs build_snapshot(). Cache owner is Rust Tauri command only: SNAPSHOT_CACHE + SNAPSHOT_FLIGHT + SNAPSHOT_EPOCH with 15s TTL; invalidation owner is invalidate_plugin_snapshot(), called after plugin_manager_action and in action.rs cache tests. Web mirror /api/plugins/snapshot in src-tauri/src/api/web_routes.rs bypasses that cache and calls commands::plugins::snapshot() directly in spawn_blocking. Frontend Plugins settings state is owned by src/components/Extensions/ExtensionsView.tsx: snapshot/config/query/filter/error/busy/selectedId/selectedChannel/addChannelOpen/lastChannelRefreshAt. Channel refresh TTL is frontend-only 60s via lastChannelRefreshAt; it is not a snapshot cache. Error/empty UX: EMPTY_SNAPSHOT seeds empty arrays; normalizeSnapshot coerces missing fields to []; failures surface only as inline [data-testid=extensions-error][role=alert], not toast. Toast emissions for plugin UX come from src/lib/usePluginActivity.ts, which listens to plugin-activity, emits sticky in-app toasts via upsertToast/dismissToast keyed plugin-activity:<pluginId>, and hydrates display metadata from plugin_manager_snapshot. Detail pane inline progress is src/components/Extensions/PluginActivityInline.tsx. Snapshot mutation invalidation sources are real plugin actions only: install/update/remove/add-channel/remove-channel/refresh-channel via plugin_manager_action_impl -> run_action -> invalidate_plugin_snapshot(); refresh-channel also forces refresh_channel_diff_now() so diff is recomputed synchronously. Passive GET snapshot path does not invalidate. Source/bundle/live Codex model parity: source discovery in plugins/provider-codex/src/models.ts reads ~/.codex/models_cache.json, filters visibility=hide and non-chat ids, sorts ascending priority, and falls back to manifest models when cache absent/invalid. Bundled plugin.json exposes exactly gpt-5.5 default, gpt-5.4, gpt-5.4-mini, gpt-5.3-codex, gpt-5.2. Live command codeterm agent models codex returned the same 5 ids with gpt-5.5 default. No live or bundled evidence for gpt-5.4-nano in this checkout, so it must not be added. Native/JS parity: JS provider available_models() resolves through model_catalog, not raw manifest; discover_models_native_js_parity and available_models_reads_catalog_snapshot_not_static_manifest cover this. Session constraint: provider structured prompt contract in codeterm-plugin/src/provider.rs explicitly says cwd/session_id must identify the pane's OWN session, never latest global; output.rs maybe_detect_agent_session also excludes other panes' claimed session ids before detect_session_id. Frontend provider descriptor cache currently refreshes on contributions-changed via src/hooks/useAgentProviders.ts; startup background model refresh emits models-updated from src-tauri/src/lib.rs, but no frontend listener for models-updated exists, so live-discovered models do not automatically repopulate ExtensionsView/useAgentDescriptor until provider list is refetched by some other path. Existing focused tests found: src/components/Extensions/ExtensionsView.test.tsx covers channel rows, channel detail preview, add form, add-channel API call, and frontend 60s TTL guard; src-tauri/src/commands/plugins/action.rs tests cover cold concurrent single-flight, cache hit, and invalidation rebuild; plugins/provider-codex/tests/plugin.test.ts covers discoverModels cache fallback/filter/sort; js_runtime parity/provider tests cover model catalog parity.
    BUILD/TYPECHECK/TESTS: passed: codeterm agent models codex; passed: npx tsx plugins/provider-codex/tests/plugin.test.ts. Read-only source inspection only otherwise. Honest failed-command evidence: Get-Content src-tauri/src/commands/plugin_commands.rs failed because file does not exist; Get-Content src/lib/useAgentProviders.ts failed because correct path is src/hooks/useAgentProviders.ts.
    FOLLOWUP: Main product conclusion is stale provider-model UX, not missing model data. If the orchestrator wants a fix, the safe owner is provider descriptor refresh on models-updated (or another explicit invalidation path with owner), not extending the plugin snapshot cache and not inventing gpt-5.4-nano.
