body: Read-only planning task. Trace plugin_manager_snapshot from Rust command through web mirror and Plugins settings state. Identify toast emissions, panel state ownership, snapshot cache candidates, real mutation invalidation sources, error and empty behavior, and existing tests. Independently compare source/bundle/live Codex model discovery. Live evidence currently supports gpt-5.5 default, gpt-5.4, gpt-5.4-mini, gpt-5.3-codex, and gpt-5.2; gpt-5.4-nano is official but not live-discovered and must not be invented. Map native/JS parity and per-pane session constraints.
role_guidance: 'You are Turing, a provider and UI state researcher. Compare source, bundled configuration, and live provider output before proposing edits. Red line: adding a model not exposed by provider evidence or caching without an invalidation owner fails the task.'
