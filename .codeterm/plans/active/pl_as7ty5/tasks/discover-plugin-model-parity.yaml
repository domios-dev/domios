name: Audit plugin snapshot UX and OpenAI model parity
type: planning
model: gpt-5.4
model_rationale: Codex gpt-5.4 efficiently traces bounded frontend/provider state while live discovery supplies the source of truth.
personality: Turing
personality_provenance: null
acceptance_criteria:
- Names exact plugin snapshot command, UI components/hooks, mutation paths, tests, and the recommended cache owner/invalidation events.
- Defines loading, error, empty, cached reopen, and stale-after-mutation UI acceptance states with concrete selectors.
- Produces a source/bundle/live discovery table for Codex models and marks gpt-5.4-nano unsupported until provider evidence appears.
- Reports required native/JS parity and per-pane-session tests or explicitly proves no surface change is needed.
test_plan: |-
  Oracle: source, bundle, and live discovery agree on every supported model and the panel state transition is testable.
  1. Run codeterm agent models codex; pass: report records exact live model IDs and timestamp.
  2. Run rg -n "plugin_manager_snapshot|plugin_manager_action|toast|PluginsTab|models" src src-tauri plugins; pass: every cited source surface exists.
  3. Run the existing focused TypeScript test command discovered from package.json and test files, or record the exact missing test; pass: current snapshot behavior is observed.
  4. Inspect provider native and JS parity tests; pass: report names exact parity fixture/test path and session-ownership observation.
correctness: Correctness requires provider-discovered availability, cache invalidation only on real mutations, and a UI oracle for every panel state.
