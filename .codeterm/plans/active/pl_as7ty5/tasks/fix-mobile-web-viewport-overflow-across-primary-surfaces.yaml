test_plan: '1. In isolated lane run: npx playwright test tests/playwright/suites/12-web/mobile-overflow.spec.ts -g "@golden mobile web primary surfaces stay inside the viewport" --config=tests/playwright/playwright.config.ts --project=golden --timeout=30000 --global-timeout=600000 --reporter=line --trace=on. Assert document.documentElement.scrollWidth === clientWidth and every visible button/input/dialog/menu/sidebar/header boundingBox satisfies x>=0 and x+width<=viewport for 320x568, 390x844, 430x932; save one screenshot per viewport. 2. After exact green run adjacent mobile surfaces: npx playwright test tests/playwright/suites/12-web/web.spec.ts tests/playwright/suites/15-plan-header-mobile/plan-header-mobile.spec.ts --config=tests/playwright/playwright.config.ts --project=golden --timeout=30000 --global-timeout=600000 --reporter=line --trace=on. 3. Record /api/health full build_sha before bodies and artifact paths.'
correctness: Overflow ownership is local and intentional; desktop remains unchanged; no blanket clipping hides inaccessible controls
