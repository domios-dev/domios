  kind: planner-review
  text: 'Read-only architecture review (no edits/builds). OWNERSHIP MAP: root goes mobile at <=640px; sidebar becomes a fixed overlay drawer (App.tsx:514-521, ct-sidebar-drawer max-sm:fixed, safe-area padded); overlays are portal+fixed with viewport clamping already built into the primitives (DropdownMenu clamps left to max(4,min(rect.left, innerWidth-w-8)); FloatingTooltip clamps width to min(420,innerWidth-24) and left to 12..innerWidth-w-12); terminal owns internal scroll via overflow-hidden container + grid minmax(0,1fr) + min-w-0 (TerminalPane:480,523); sanctioned horizontal-scroll idiom is .ct-hscroll (globals.css:63-66) and the intentional overflow-x:auto owners at globals 2933/3687. SUSPECT LIVE BUG to check FIRST: Sidebar.tsx:327 visibleSidebarWidth = touchMode ? round(sidebarWidth*1.3) : sidebarWidth with persisted sidebarWidth up to 400 -> 520px drawer on a 320px phone; drawer needs a max-width cap (e.g. min(85vw, scaled)). SYSTEMIC MISTAKES TO AVOID: (1) no root/body overflow-x:hidden — the scrollWidth oracle passes under clipping while controls become unreachable; containment must be local (the boundingBox oracle alone cannot distinguish clipping, so reviewers must also diff for new root-level clipping). (2) fixed pixel widths in flex rows without min-w-0+truncate; any w-[>=300px] is suspect at 320 — e.g. NewSessionPicker Claude modal w-[320px] exactly fills a 320 viewport, prefer w-[min(320px,calc(100vw-24px))]. (3) never hand-roll popup positioning from trigger rects — route through DropdownMenu/FloatingTooltip which already clamp. (4) keep horizontal scroll INSIDE .ct-hscroll/xterm owners; do not remove their overflow-x:auto, and ensure the parent chain carries min-w-0 so the scroller cannot push the page. (5) new fixed headers/toolbars must consume --ct-safe-top/bottom like the drawer does (430x932 has insets). (6) oracle hygiene: boundingBox is null for hidden elements — assert visible elements AND document scrollWidth===clientWidth so invisible overflow still counts; measure after layout settles (rAF/fonts), not immediately after resize, or the 3-viewport matrix flakes.'
