body: Audit and fix mobile web responsive overflow on canonical feat/1.7.2-stability. Reproduce at 320x568, 390x844, and 430x932 in /web across fresh-session picker, sidebar/workspace tree, chat view/composer, terminal mode, plan header/detail, settings, mesh, and modal/menu overlays. No content, controls, fixed headers, toolbars, dialogs, or scroll containers may extend beyond the visual viewport; document-level horizontal scrollWidth must equal clientWidth. Preserve desktop layout and intentional internal horizontal scrolling (terminal/code only). Use existing responsive primitives, min-w-0/overflow ownership, safe-area insets, and dynamic labels; do not blanket overflow-x:hidden over broken layout. Add focused Playwright regression asserting viewport bounds for visible interactive elements and screenshots on all three viewports. Work in an isolated lane from origin/feat/1.7.2-stability; push SHA and report exact commands/artifacts. Build and browser QA only on mesh.
