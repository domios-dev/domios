body: |-
  [RECOVERED from pl_ghk358 as task_4bfewm; export sha256 78a67aaf79b0…]

  Per issue #240 expected-behavior 4 and spec sec_sve813: trace the --actions transport across the mesh envelope - the action list is evidently lost or serialized as an empty text message at some boundary (CLI -> relay -> target dispatch). Fix so actions survive the relay and dispatch as real key input at the target (through the existing action-execution path used by local sends, api/pane_routes/send.rs execute_ordered_actions). Cover BOTH transports: local send with --actions enter against an agent pane, and cross-mesh relay of the same. An empty-action or unknown-action envelope must produce a structured error, not a stamped empty message. Add parity tests asserting local and mesh action dispatch produce identical target-side effects.
role_guidance: 'You are Thompson: a keypress and a message are different types and must never coerce into each other silently. Red line: fixing the mesh path without the local-send parity test - the evidence says both transports exhibit it.'
