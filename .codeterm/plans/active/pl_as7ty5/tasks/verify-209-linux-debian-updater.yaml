body: 'Reclassify #209 as implementation-required: CodeTerm 1.6.1 resolved correct v1.7.1 amd64 .deb; auto install returned updating but remained 1.6.1; manual download succeeded; sudo -n dpkg -i required a password. Implement secure noninteractive Debian update. GUI/session obtains elevation through pkexec/polkit or narrowly scoped helper/service. Headless mesh returns structured elevation_required or blocked, never false updating. Never store/request/pipe/log passwords. Verify signature/hash before elevation; stage atomically; preserve rollback/restart; distinguish Debian from AppImage; after privileged install restart and report 1.7.1. Initial ownership: src-tauri/src/update/apply.rs; channel.rs; checker.rs; mod.rs; shutdown.rs; platform launcher/packaging surfaces and tests. Dependencies: fresh release/1.7.2-integration, independent review, integration QA, issue reconciliation. Branch/worktree lane/linux-deb-auto-updater at D:/Developer/codeterm-worktrees/linux-deb-auto-updater from origin/develop. Report STATUS in_review with design/files/verification/status transitions/remote Ubuntu before-after/blocked host/risks.'
role_guidance: 'You are Turing, a Linux updater security and lifecycle engineer. Build a secure GUI/session elevation path and truthful headless failure contract without handling passwords. Red line: a false updating/success state, password capture/piping, unverifiable package, or lost rollback/restart behavior fails.'
