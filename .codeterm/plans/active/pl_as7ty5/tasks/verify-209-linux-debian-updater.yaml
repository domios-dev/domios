  kind: status_update
  text: |-
    STATUS: in_review
    CHANGES: Closed the confirmed BOUNCE. The remaining source defect was the elevation preflight (which lookups + 'sudo -n true' process spawn) running SYNCHRONOUSLY on the main Tauri async runtime inside install_update (updater_routes.rs:157) and check_and_apply_deb (apply.rs:169). Replaced sync gate_staged_deb with async gate_staged_deb_async(plan, preflight) which offloads the preflight closure to tokio::task::spawn_blocking. Now ALL filesystem/process/dpkg work (stage_deb_atomically_async, install_verified_deb_with_async, AND preflight) is off the async runtime. Wired both call sites to await the async gate; route surfaces a structured status=blocked on preflight worker failure.

    DESIGN (bounce audit, all three proven):
    1. Update existence/verification precedes elevation preflight: check_stage_deb_update confirms an update exists, downloads+verifies via Tauri updater signature, and stages the .deb atomically BEFORE gate_staged_deb_async runs any preflight. NoUpdate short-circuits and never spawns an elevation probe (no false elevation_required).
    2. All fs/process/dpkg work off the async runtime: staging, install, and now preflight all via spawn_blocking.
    3. Install failure = truthful bounded repair, no restart: install_verified_deb_with returns repair_required/blocked/elevation_cancelled; the route's install thread sets error without restart; app.restart() only runs after install succeeds. Unchanged, still correct.
    Passwords never requested/piped/logged: only pkexec (GUI session) or sudo -n (passwordless) are used.

    FILES: src-tauri/src/update/apply.rs (sync gate_staged_deb -> async gate_staged_deb_async via spawn_blocking; 3 async-boundary tests), src-tauri/src/api/updater_routes.rs (await async gate, structured blocked on worker error).

    TESTS RUN (Windows lane, MSVC env, capped runner):
    - cargo test --lib debian_tests: 17 passed (incl. no_update_does_not_run_elevation_preflight, staged_runs_preflight_through_async_boundary, staged_not_ready_surfaces_structured_status, installer_runs_through_async_boundary, staging_runs_through_async_boundary).
    - cargo test --lib update::: 41 passed, 0 failed.
    - build.ps1 check: passed (only 3 pre-existing keepawake dead-code warnings).
    - cargo fmt --check: clean. git diff --check: clean. check-file-sizes.sh --fail on touched paths: pass (apply.rs 945 lines).
    Note: cold worktree needed a stub dist/index.html (gitignored) and an uncapped test --no-run warm-up; the 90s cap is runtime-only, all test EXECUTION finished in 0.01s.

    STATUS TRANSITIONS: bounced (async-runtime preflight) -> fixed -> focused tests green -> committed f28d3e210 on lane/linux-deb-auto-updater -> in_review.

    REMOTE UBUNTU BEFORE-AFTER: NOT executed. Blocked host: live old-to-target GUI/session update, headless mesh elevation_required, and invalid-artifact rejection oracle require v1.7.2 publish assets + latest-deb.json to exist (parked decision). Ubuntu self-hosted runner checkout /home/dev/actions-runner/_work/codeterm/codeterm is the intended clean environment for that oracle.

    RISKS: Linux pkexec policy behavior and dpkg restart semantics still need the remote Ubuntu QA pass. Invalid signature/hash rejection is covered by the Tauri updater download-verify path but needs a live/fixture manifest-rejection run on Linux. No clippy at lane gate (tiered policy) — await_holding_lock verified by inspection: async gate holds no lock across .await.
