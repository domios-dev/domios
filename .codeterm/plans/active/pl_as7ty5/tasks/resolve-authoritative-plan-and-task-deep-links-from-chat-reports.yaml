body: 'Implement authoritative deep links for structured plan/task identifiers in chat and report messages. Own the PlanIndex/global lookup and route surfaces under src-tauri/src/api/plan_routes/plans.rs and src-tauri/src/service/plan/ (verify exact index/navigation modules before editing), frontend plan navigation under src/components/Canvas/planView/ and the narrow structured-reference/link resolver surface discovered by trace. Do not own tool-card truncation/expansion or composer performance files from task_6761hn/task_dv3o8b; expose a narrow renderer link contract if needed. Resolve pl_as7ty5/task_a9tuei through authoritative global PlanIndex, derive owning project/workspace from indexed file_path, switch/reveal owner workspace, open plan-view-shell, and focus task. Display human plan/task titles with compact raw-ID fallback; preserve full ID for copy, tooltip, accessibility, context menu. Batch/cache lookups and subscribe to plan-changed/plans-loaded; no N+1 transcript requests or composer lag. Apply to structured report metadata and safe prose references, never code blocks, commands, URLs, or raw tool output. States: loading, archived/unowned, stale/missing, permission/unreachable; no false deleted toast. Keyboard activation and mobile/desktop layout required. Dependencies: task_23fywk project/root recovery contract and task_zl68wp planning context; independent review and integration QA. Branch/worktree lane/plan-deep-links at D:/Developer/codeterm-worktrees/plan-deep-links from origin/develop. Report STATUS in_review with exact resolver/index files, cache/event design, selector list, and test output.'
role_guidance: 'You are Lamport, a cross-project identifier and navigation correctness engineer. Resolve plan/task references through authoritative indexed state and preserve safe prose/code boundaries. Red line: a valid ID cannot produce a false deleted toast, wrong-project navigation, N+1 lookup storm, or accidental code-block link.'
