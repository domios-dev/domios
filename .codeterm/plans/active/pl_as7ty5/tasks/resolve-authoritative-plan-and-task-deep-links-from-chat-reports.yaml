  text: |-
    IN_REVIEW: STATUS: in_review
    CHANGES: Authoritative batched resolver route is src-tauri/src/api/plan_routes/plans.rs (registered via src-tauri/src/api/plan_routes/mod.rs and src-tauri/src/api/routes.rs); it reads the global PlanIndex once per batch, derives the owner project root only from indexed sidecar file_path, hydrates that project, and returns resolved/archived/unowned/stale/missing/permission/unreachable state. Frontend cache/event resolver is src/components/Terminal/usePlanRefResolver.ts, using one deduplicated POST for visible safe-prose refs, a keyed cache, and complete invalidation on plan-changed and plans-loaded. Navigation is src/components/Terminal/PaneSessionChat.tsx plus src/components/Canvas/workspacePlanEntry.ts: indexed file_path selects the owner workspace, switches it, opens plan-view-shell through canvasFocusStore, and retains task node focus. Safe renderer contract is packages/chat-ui/src/codeterm/{planRefs.ts,LinkedText.tsx}; raw tool results, commands, URLs, inline/fenced code (including unterminated fences), and excluded message types stay inert. Added cross-workspace focus assertions in src/components/Canvas/workspacePlanEntry.test.ts.
    SELECTORS: data-testid=chat-plan-link, chat-task-link, plan-view-shell; state is exposed as data-ref-state; full raw IDs are retained in title, aria-label, and context-menu copy.
    TESTS RUN: git diff --check (pass); npx tsx packages/chat-ui/src/codeterm/planRefs.test.ts (pass, 26/26). npx tsx src/components/Terminal/usePlanRefResolver.test.tsx blocked: react/jsx-runtime is absent from this worktree.
    CENTRALIZED QA REQUIRED: install frontend dependencies, run usePlanRefResolver and workspacePlanEntry focused tests; then run the specified cross-workspace Playwright golden grep on desktop and mobile, validate Enter/Space, tooltip/context-menu copy, no missing/deleted toast, plan-view-shell task visibility, and trace one batched resolve-refs request per unique visible ref set with cache/invalidation behavior. Per instruction, Cargo/build/dev/Playwright were not run; no commit.
