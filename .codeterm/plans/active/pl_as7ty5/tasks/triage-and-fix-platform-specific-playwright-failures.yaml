id: task_cfkgta
name: Triage and fix platform-specific Playwright failures
type: implementation
model: opus
model_rationale: Once the three shards produce classified failures, each platform owner must fix what it can reproduce and land stabilized specs/code, with shared-UI failures triaged as real regressions vs flake.
personality: null
personality_provenance: null
acceptance_criteria:
- Each classified failure is either fixed with green evidence or recorded as a bounded blocker with exact repro command
- Fixes land on feat/1.7.2-stability; each fixed test passes twice in isolation on the reproducing platform
- Shared-UI failures reproduced on 2+ platforms are treated as real regressions, not silenced as flake; single-platform failures fixed by that owner
test_plan: 'Per failure: 1) Reproduce on the owning machine with the exact shard command from the run task. 2) Fix root cause (selector/wait/agent-readiness for flake; product code for real regression). 3) Re-run just that test twice: npx playwright test <file> -g "<title>" --timeout=30000 --global-timeout=600000 --reporter=line -> green both times. 4) Commit to feat/1.7.2-stability. Pass = zero unexplained failures; every remaining failure has a documented bounded-blocker entry with repro.'
correctness: Fixes are verified on the reproducing platform by passing twice; cross-platform failures are not masked; no unrelated behavior regressed.
