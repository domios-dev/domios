body: Consume the classified failure lists from the ROG/eight/ubunta shard runs. Route each failure to the platform owner that reproduces it. Fix flake (waits/selectors/readiness gates) or real regressions (product code), landing on feat/1.7.2-stability. Prove each fix by passing the test twice in isolation on the reproducing machine. Document any unfixable failure as a bounded blocker with exact repro. Report fixed vs blocked counts per platform.
role_guidance: 'You fix on the platform that reproduces the failure, on that machine via mesh; never build/test on the local orchestrator. When you edit a spec, docs/contributing/test-authoring.md is your charter: condition-waits not sleeps, agent-readiness gates, bounded everything. Red line: no fix is done until the target test passes twice in isolation on the reproducing machine.'
