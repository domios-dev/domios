    CRITERIA CLOSED THIS SLICE:
    1. PARITY: node --test harness asserts the stub boot output embeds the recorded real-session transcript BYTE-FOR-BYTE per provider (claude/codex/opencode) — everything downstream of the PTY pipeline (fingerprint detection, status classification, xterm/DOM) receives identical input by construction. Live confirmation: detection accepts the panes as real provider sessions.
    2. CODEX/OPENCODE SID: closed via the daemon's own trusted-binding path — the replayer reports through the nonce-verified session_start hook, which hook_routes documents as authoritative-before-session-file (the same path real CLIs race through). @stub matrix asserts agent_type identity + non-empty bound sid for all three providers. Deliberate deviation: NO synthetic writes into real provider stores (opencode is sqlite-backed — fake rows in the live user DB = contamination for zero fidelity gain); if you want file-backed sid proof later, it belongs in an isolated-HOME environment, noted in the task.

    FULL GATE SET on 0775ab616: unit (stub_launch incl. PowerShell-compound wrap) + byte-parity 3/3 + @stub 6/6 twice on a gated dev + tsc clean. Dev restored to ungated mode, checkout clean (no dirty files).

