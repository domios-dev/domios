id: task_dycecc
name: Land runtime stub agent provider for Playwright
type: implementation
model: opus
model_rationale: 25+ golden tests spawn REAL Claude agents (180-420s each) because the live daemon has no stub provider (MockProvider is cfg(test)-only); this is 60-80% of golden wall-clock. A dev-build scripted stub converts minutes to seconds per test — the single biggest speedup.
personality: null
personality_provenance: null
acceptance_criteria:
- Stub is per-provider parameterized (stub emulations for claude, codex, opencode) and each emits that provider structural fingerprint so detection, parser, and status tracking take the SAME code path as a real session
- 'Fidelity is proven by fixture parity: recorded real transcripts per provider vs stub replay produce identical ChatView parser output and identical provider detection (model, session id, status), asserted in a test'
- A stub provider is spawnable via POST /agents/spawn in a dev build with the env gate set, and absent (400) without it or in prod builds
- 'Stub supports scripted deterministic replies: instant readiness, scripted assistant text, a scripted tool round-trip, and marker emission into the PTY/chat surface'
- Existing provider capability tests still green; no provider-id branching leaked into core
test_plan: '1) cargo test agent:: (narrow, capped 90s via scripts/test-capped.sh) for registry/dispatch with the stub registered. 2) Fixture capture: record one real transcript per provider (claude, codex, opencode) as raw PTY byte fixtures under tests/playwright/fixtures/provider-transcripts/. 3) Parity test (Rust or TS): feed recorded-real vs stub-replayed bytes through detection + parser; assert identical model/session-id/status detection and identical parsed message blocks, for ALL three providers. 4) On a gated dev daemon: curl POST /api/agents/spawn for each of stub:claude/stub:codex/stub:opencode -> pane appears, scripted reply lands in pane output within 5s, pane agent_type reports the emulated provider. 5) Without gate: spawn returns 4xx. 6) One Playwright smoke microtest per provider spawning the stub and asserting the marker in DOM plus the correct provider badge, run in isolation with --timeout=30000.'
correctness: Stub is unreachable outside gated dev builds; replayed output is byte-faithful to recorded real sessions so detection/parser/status run real code paths; parity holds for all three providers; capability seam stays clean per AGENTS.md plugin discipline.
