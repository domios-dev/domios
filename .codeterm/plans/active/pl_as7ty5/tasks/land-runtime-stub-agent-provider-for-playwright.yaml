id: task_dycecc
name: Land runtime stub agent provider for Playwright
type: implementation
model: opus
model_rationale: 25+ golden tests spawn REAL Claude agents (180-420s each) because the live daemon has no stub provider (MockProvider is cfg(test)-only); this is 60-80% of golden wall-clock. A dev-build scripted stub converts minutes to seconds per test — the single biggest speedup.
personality: null
personality_provenance: null
acceptance_criteria:
- A stub provider is spawnable via POST /agents/spawn in a dev build with the env gate set, and absent (400) without it or in prod builds
- 'Stub supports scripted deterministic replies: instant readiness, echo/scripted assistant text, a scripted tool round-trip, and marker emission into the PTY/chat surface'
- Existing provider capability tests still green; no provider-id branching leaked into core
test_plan: '1) cargo test agent:: (narrow, capped 90s via scripts/test-capped.sh) for registry/dispatch with the stub registered. 2) On a dev daemon with the gate: curl POST /api/agents/spawn {agent:"stub", script:...} -> pane appears, scripted reply lands in pane output within 5s (poll /panes/:id/output). 3) Without gate: same spawn returns 4xx. 4) One Playwright smoke microtest spawning the stub and asserting the marker in DOM, run in isolation with --timeout=30000.'
correctness: Stub is unreachable outside gated dev builds; scripted output is deterministic; capability seam stays clean per AGENTS.md plugin discipline.
