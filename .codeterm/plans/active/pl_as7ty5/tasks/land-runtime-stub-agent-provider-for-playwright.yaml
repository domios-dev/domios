body: 'Implement a runtime stub agent provider so Playwright can exercise agent UI/plumbing without real LLM calls. Model on src-tauri/src/agent/test_provider.rs::MockProvider but as a live registered provider (dev-build + env-gated). Must support: instant readiness, scripted assistant replies, scripted tool-call round-trip, marker emission readable in PTY buffer and ChatView. Downstream task converts golden tests to it. See attached revision doc section B.1.'
role_guidance: 'You are a Rust backend engineer in src-tauri/. Follow the plugin/capability discipline: the stub is a real AgentProvider registered only in dev builds behind an env gate (e.g. CODETERM_ENABLE_STUB_AGENT=1), never reachable in prod. Red line: core must keep asking capabilities, never match a stub id in core code; parity_test.rs gains a case if any trait surface grows.'
