body: 'Implement a runtime stub agent provider so Playwright can exercise agent UI/plumbing without real LLM calls — but ONE-TO-ONE faithful to real providers, not a generic echo bot. Design: a transcript REPLAYER. Capture fixture transcripts from real claude/codex/opencode sessions (raw PTY byte stream incl. ANSI/OSC); the stub replays them (plus parameterized scripted turns) through the normal PTY/chat pipeline so structural-fingerprint detection, ChatView parser.ts, session-id materialization, and status tracking all run their REAL code paths identically to a live session. Per-provider emulation: stub:claude / stub:codex / stub:opencode each reproducing that provider fingerprints. Fidelity gate: parity test asserting recorded-real vs stub-replayed transcripts yield identical parser output and detection results. Dev-build + env-gated only (never prod). Model the registration on src-tauri/src/agent/test_provider.rs::MockProvider but as a live registered provider. Downstream task_k16xu0 converts golden tests and runs the provider matrix. See attached revision doc section B.1.'
role_guidance: 'You are a Rust backend engineer in src-tauri/. Follow the plugin/capability discipline: the stub is a real AgentProvider registered only in dev builds behind an env gate (e.g. CODETERM_ENABLE_STUB_AGENT=1), never reachable in prod. Red line: core must keep asking capabilities, never match a stub id in core code; parity_test.rs gains a case if any trait surface grows.'
