  text: |-
    PARTIAL: task_dycecc CORE LANDED at 473652df8 — reporting partial: transport + live gates done, parity harness remains.

    DESIGN (deviation from original task letter, satisfies criteria better): NO new provider id. A dev-only env gate (CODETERM_STUB_AGENT_CMD, debug builds) substitutes the FINAL statement of every provider launch command with a transcript replayer, forwarding original argv after '--'. Provider id, model args, resume flags, detection, ChatView parsing, and status tracking are byte-for-byte the REAL code paths — core never sees a stub identity (capability seam untouched; criterion 5 by construction).

    MECHANISM:
    - src-tauri/src/agent/stub_launch.rs + wraps at all 7 launch sites (spawn, hidden spawn, orchestrator launch, general agent, transport, pty fresh-launch, agent restart incl. resume).
    - tests/playwright/fixtures/stub-agent/replay.mjs: boots by replaying RECORDED REAL casts (testbench/replays per provider) so structural-fingerprint detection accepts the pane; scripted STUB_ECHO/STUB_TOOL turns; /exit; sid via nonce-verified session_start hook (binding_nonce from pane env — daemon ownership validation passes without touching real provider stores).
    - suites/03-agents/stub-replay.spec.ts (@stub): probes gate, runs 3-provider matrix + sid test.

    EVIDENCE: 4/4 passed twice on a gated local dev; daemon log shows substitution + accepted hook binding; without the gate spawns are untouched (verified during debugging when a probe launched real claude); release builds compile the gate off.

    FOUND ON THE WAY (fixed): Windows launch commands are PowerShell compounds — naive prefixing executed the real CLI anyway; wrap now applies to the last statement only, unit-tested.

    REMAINING before task close: (1) parity harness — recorded-real vs stub-replayed bytes through the ChatView parser must assert identical message structure per provider; (2) codex/opencode sid materialization (session-store writes, restore-matrix-style); both are the next slice of this task, staying with me. task_k16xu0 (golden conversion) can START on claude-path tests already if you want overlap — the transport it needs is live.
