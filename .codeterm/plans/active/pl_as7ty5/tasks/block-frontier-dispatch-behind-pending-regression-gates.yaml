body: Implement the missing product enforcement for existing QA policy; do not rewrite qa_pipeline_discipline.md, orchestrator_suffix.md, heartbeat.rs, docs/PLANNER.md, docs/ORCHESTRATION.md, or docs/LANES.md. When a plan has pending_regression_gates, milestone/group transition or plan task dispatch must visibly block before spawning a non-blocker worker and name the blocking gate(s) in plan/orchestrator status and command output. Provide an explicit, auditable override only for an authorized Orchestrator decision, recording actor, reason, gate list, and timestamp; no implicit bypass. Preserve dispatch for work that itself clears the named gate or is explicitly classified release-blocking by the existing policy. This plan currently requires task_odejzc to reach accepted implementation evidence, then one serialized warm integration QA run to satisfy Discovery, persona-allocator-review, review-gate, and web-ui-serve-discovery with per-group evidence before further non-blocker dispatch. Own dispatch/gate-state/status/CLI tests discovered by trace; do not alter QA prose or broad scheduler/reminder behavior. Work from origin/develop in D:/Developer/codeterm-worktrees/regression-gate-enforcement on branch lane/regression-gate-enforcement.
role_guidance: 'You are an orchestration policy enforcement engineer. Make existing pending regression gates operational at dispatch and status boundaries, with a narrow auditable override. Red line: never silently dispatch a non-blocker past pending gates or obscure which gate blocks the frontier; do not duplicate policy prose.'
