id: task_v01lg4
name: Block frontier dispatch behind pending regression gates
type: implement
model: gpt-5.4
model_rationale: This is a bounded orchestration-enforcement and status-surface change with focused CLI/state tests; gpt-5.4 is sufficient after the existing QA policy has already been accepted.
personality: Lamport
personality_provenance: null
acceptance_criteria:
- A non-blocker plan task cannot dispatch while pending_regression_gates is nonempty; no worker/pane is created and the response names the blocking gate(s).
- Plan/orchestrator status visibly reports pending gates and the current dispatch block reason, preserving per-group evidence as groups clear.
- Only an explicit, authorized, reasoned override can bypass a gate; it records actor, timestamp, reason, and gate list and remains visible in status/history.
- Gate-clearing or explicitly release-blocking work follows a narrow visible exception policy; no implicit bypass exists.
- When no pending gates exist, ordinary dispatch semantics remain unchanged.
- Focused tests, diff check, and file-size check pass without rewriting the existing authoritative QA prose or performing local heavy/release builds.
test_plan: 'Oracle: seeded plan fixtures plus CLI/status integration tests. 1. Seed a plan with each of Discovery, persona-allocator-review, review-gate, and web-ui-serve-discovery pending; attempt non-blocker dispatch. Pass: no worker/pane is created, command exits with a structured block reason naming every relevant gate, and plan/orchestrator status shows the same gates. 2. Clear one group at a time through the existing QA completion path. Pass: status retains remaining gates and dispatch stays blocked until the final relevant gate is green. 3. Exercise a gate-clearing/release-blocking task. Pass: it remains dispatchable only under the explicitly defined policy and its exception is visible/audited. 4. Exercise explicit authorized override. Pass: command requires an explicit reason, records actor/time/gates/reason, and status shows the override; ordinary callers cannot bypass. 5. Exercise no-pending-gate control fixture. Pass: dispatch behavior is unchanged. 6. Run exact focused cargo/CLI tests discovered from dispatch/gate modules, git diff --check, and scripts/check-file-sizes.sh; pass: all exit 0. No local heavy/release build.'
correctness: QA policy enforcement at actual dispatch boundary; no accidental worker spawn under pending gates; truthful status; audited exceptional override; per-group evidence preservation; compatibility for green plans; no policy-document duplication.
