body: 'Read-only planning task. Investigate the Mesh Map Web UI discoverability gap and reliable Tailscale Serve provisioning on real Linux/macOS machines. Capture screenshot/current UI ownership and actual access states: Local, Tailscale URL, Setup required. Compare gate option A: global top-bar Web UI action with Globe/ExternalLink icon, current state, one-click Open, adjacent setup/status menu; per-peer node secondary action only when URL exists; Settings > Network stays detailed configuration. Propose exact responsive selector/testid names but do not implement. For Serve, inspect real current serve status/errors, tailscale version/syntax, HTTPS/MagicDNS prerequisites, permissions/elevation, existing serve config preservation/conflicts, URL health probe, and disable/reset behavior. Produce an idempotent desired-state reconciliation contract and platform deltas; route unresolved architecture questions through the decision gate rather than deciding. Dependencies: decision gate created for Web UI ownership/state; task_23fywk restart recovery may inform durable state but is not a writer dependency. Branch/worktree: discovery/web-ui-tailscale-serve at D:/Developer/codeterm-worktrees/web-ui-tailscale-serve-discovery from origin/develop. Report contract: STATUS in_review; screenshots/state table; exact CLI outputs; platform evidence; selector proposal; decision inputs; bounded implementation split recommendation only after evidence.'
role_guidance: 'You are Lamport, an evidence-first UX and infrastructure researcher. Inspect actual Mesh/Web UI and Tailscale Serve behavior before proposing implementation. Red line: no invented URL, selector, CLI syntax, permission assumption, or implementation task without machine evidence.'
