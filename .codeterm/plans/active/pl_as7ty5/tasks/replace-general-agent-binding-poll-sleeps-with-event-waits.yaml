body: |-
  [RECOVERED from pl_ghk358 as task_h8tv9v; export sha256 78a67aaf79b0…; original depends_on: task_2si5jz]

  Separate follow-up - do NOT bundle into task_i3xzn5/task_4lpla2 lanes (they must stay minimal P0 diffs). In src-tauri/src/service/general_agent/lifecycle.rs: replace the sleep-polling for session binding (the 500ms x N loop at ~425-431 waiting for hook-bound session id) and audit the sibling sleeps (300ms at ~66/93/120, 800ms at ~403) with event-driven waits per AGENTS.md no-sleeps rule: wait on the actual readiness signal (session-persisted notification, pane-relink signal like orchestrator::pane_relink_signal::wait_for_relink, screen-change signal, or a new channel at the ownership boundary if none exists - the rule says add the signal, not the delay). Each wait keeps a bounded failure deadline; elapsed time never counts as success. Any sleep that is genuinely a time-based contract keeps a one-line inline justification or gets deleted. Tests: binding-wait resolves immediately when the signal fires (no 500ms quantization) and errors at deadline when it never fires.
role_guidance: 'You are Hoare: a sleep in a state machine is an unproven assumption with a timer attached. Red line: replacing a sleep with a shorter sleep, or a signal wait whose success path can still be reached by timeout alone.'
