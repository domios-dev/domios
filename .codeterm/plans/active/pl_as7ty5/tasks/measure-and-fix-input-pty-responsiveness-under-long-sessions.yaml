id: task_w6t5pq
name: Measure and fix input/PTY responsiveness under long sessions
type: implementation
model: opus
model_rationale: User reports composer input stalls every few seconds and PTY output scroll/replay stays slow under long Codex sessions; this needs a reproducible latency oracle and targeted hotspot fixes, not broad rebuilds.
personality: null
personality_provenance: null
acceptance_criteria:
- 'A reproducible oracle exists: keystroke-to-render latency and PTY write/replay latency measured under a long transcript/session'
- Before/after numbers show input stall removed and PTY replay frame-bounded; focused TS unit/perf checks added and green
- No regression to terminal control-reply filtering; long history opens at bottom without burst scrolling
test_plan: Focused remote-only verification on eight. 1) Run npx tsx tests/perf/transcript-churn.bench.ts and record transcript p50/p95/max; pass means 10k-message churn stays under a 16.7ms frame budget. 2) Run npx tsx tests/perf/pty-write-slicing.bench.ts; pass means 4MB cheap-parse replay improves from 64 frames/1067ms to <=8 frames/<=150ms while >=8ms per-slice parse remains no worse than old 64 frames. 3) Run npx tsx src/components/Terminal/PaneSessionChat.planref-stability.test.tsx; pass means unchanged MessageBubble rows render <=2 times across 12 streamed tail chunks and the test fails when visiblePlanRefs stabilization is reverted. 4) Run npx tsx src/hooks/terminal/terminalWriteFrames.test.ts and npx tsx src/hooks/terminal/terminalReplyFilter.test.ts. 5) Run per-file biome check on touched files. No broad Playwright or cargo in this lane.
correctness: Input stays responsive while no heavy work runs; long history opens at bottom without burst scrolling; PTY output is frame-bounded; control-reply filtering unchanged.
