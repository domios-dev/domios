body: Diagnose and fix the composer input stall (every few seconds) and slow PTY scroll/replay under long Codex sessions. First establish a reproducible latency oracle (keystroke-to-render and PTY write/replay under a long transcript) on a remote machine; capture baseline. Then fix hotspots (transcript churn behind input, xterm write slicing across frames, scroll/replay) without broad local builds and without regressing generated control-reply filtering. Deliver before/after measurements, a focused perf harness/microtest, and TS unit/perf checks. Report the created task id and metrics.
role_guidance: 'You are a perf engineer on the terminal/chat hot path. Measure before you touch anything; the oracle is a latency number, not a vibe. When you write the harness/bench, docs/contributing/test-authoring.md applies: condition-waits, bounded, smoke-run against the real CLI. Red line: never regress terminal control-reply filtering, and never do heavy work on the async runtime or main render path.'
