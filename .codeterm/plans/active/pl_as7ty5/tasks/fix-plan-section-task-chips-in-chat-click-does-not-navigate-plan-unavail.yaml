  text: |-
    IN_REVIEW: task_yqr4yf: chip navigation/resolve DISPROVEN as a 1.7.2 code bug (acceptance clause 3 — no code change warranted). Ready for review.

    WHAT I VERIFIED (all correct):
    - Recognizer: packages/chat-ui/src/codeterm/planRefs.ts linkifies pl_as7ty5 (and task_/sec_ with a plan id on the same line) into clickable chips.
    - Backend resolve: POST /api/plans/resolve-refs for pl_as7ty5 -> state=resolved, correct title 'CodeTerm 1.7.2 issue cleanup and planning UX', file_path D:\Developer\codeterm\.codeterm\plans\active\pl_as7ty5\plan.yaml, ONCE its project is loaded. Returns 'missing' only when that project is not in the daemon index.
    - Navigation deep-link: src/components/Canvas/workspacePlanEntry.ts (openPlanDeepLink/findPlanOwnerWorkspace). Focused test src/components/Canvas/workspacePlanEntry.test.ts = 27/27 PASS, incl. deep-link happy path. 'missing -> inert' is a deliberate, tested design.

    ROOT CAUSE (environmental, this box only):
    - Open dev workspaces: C:\Users\dev\.codeterm-dev\general, C:\Developer\codeterm, one cwd=None. None is D:\Developer\codeterm (real checkout with the complete plan).
    - The open C:\Developer\codeterm workspace has a structurally INCOMPLETE pl_as7ty5 (only sections/*.md; no plan.yaml/goal.yaml/tasks) -> daemon cannot load -> 'missing' -> chip shows unavailable.
    - After force-loading the complete D: project, pl_as7ty5 resolves, but findPlanOwnerWorkspace still returns null because the D: file path is under no OPEN workspace cwd -> click inert / 'Workspace unavailable'.
    - In a normal setup (plan's checkout IS the open workspace: prod v1.6.2 / healthy 1.7.2), startup scans that cwd, the plan enters the index, and the chip resolves AND navigates.

    CHANGED FILES: none. SHA: 33c284096 (unchanged).
    COMMANDS RUN (dev 7686 only): curl /api/health, GET /api/plans, GET /api/plans?project=..., POST /api/plans/resolve-refs; npx tsx src/components/Canvas/workspacePlanEntry.test.ts (27/27 pass). No broad build/Playwright/dev restart.
    BUG STATUS: not reproducible as code on 1.7.2; environment/data artifact (split C:/D: checkouts + orphaned partial plan dir).

    GATES REQUESTED: none (no code changed). If the orchestrator wants a live UI confirmation, it must run in a daemon whose OPEN workspace cwd is the checkout that actually contains pl_as7ty5 (i.e. D:\Developer\codeterm), not the C: copy.

    OPTIONAL (non-blocking, intentionally NOT done): PaneSessionChat passes onMissing:undefined to openPlanDeepLink, so a chip whose owning checkout is not an open workspace is silently inert; a toast/fallback there would improve UX but is not the reported defect.
