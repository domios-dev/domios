test_plan: 'On ROG in C:/Users/amigo/Developer/codeterm-worktrees/pw-172-stability: 1) git fetch origin feat/1.7.2-stability && git pull --ff-only origin feat/1.7.2-stability; verify HEAD==origin and git status clean except intentional instrumentation. 2) .\\build.ps1 kill; .\\build.ps1 dev --wait; curl.exe -s http://127.0.0.1:7686/api/health must report build_sha==HEAD and cdp_port 9223; prod 7685 must remain untouched. 3) Run the existing driver once: node tests/playwright/artifacts/responsiveness-pass/responsiveness-native-pass.cjs (or the same command ROG used for results-resp-20260711123429.json) with RESP_ECHO_SAMPLES=8, 20 PTY tabs, 220 lines/tab. 4) If instrumenting, capture timestamps for write_pty_string request start/end, ConPTY/pty manager write, first PTY output chunk, output buffer append, /api output availability, and final paint-stable marker. 5) Pass if terminal_command_api_output_ms p95 materially improves from 2979ms or the report names the exact slow segment and artifact path; composer p95 must stay <100ms and no longtasks/>100ms rAF gaps.'
correctness: Latency attribution must be based on timestamps around PTY write, ConPTY read/output-buffer append, API output availability, and frontend paint; do not infer backend delay from Playwright wall time alone.
