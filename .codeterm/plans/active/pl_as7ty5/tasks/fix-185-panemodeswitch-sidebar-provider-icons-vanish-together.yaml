body: |-
  [RECOVERED from pl_ghk358 as task_ovt964; export sha256 78a67aaf79b0…]

  Per issue #185: investigate the shared-state hypothesis FIRST - find what both PaneModeSwitch (src/components/Terminal/PaneTopBar.tsx) and the sidebar HierarchyTree provider-icon rendering read (provider registry, capability snapshot, mux state), and identify the window where it can be transiently empty during a refresh. Fix at that source: keep last-known-good provider/capability data during refresh (stale-while-revalidate) or gate the refresh so consumers never observe an empty registry when providers exist. Only then, if a residual per-component fallback is needed, add it. Add a Playwright regression: force/simulate the registry refresh window and assert the switch and icons never unmount. Both components blanking together must be reproduced (or the empty-window proven impossible) before the fix is accepted.
role_guidance: 'You are Victor, a frontend-state detective: intermittent co-occurring symptoms mean one upstream cause - find it before touching either component. Red line: shipping fallback rendering for the two symptoms without identifying the shared empty-state window.'
