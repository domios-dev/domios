body: 'Design a first-class plan-scoped autoresearch and bounce-unwinding protocol as an in-scope 1.7.2 planning gate. Current evidence: loop_6c2hy7 is 0/3 and the plan has zero skills; do not call the existing loop autoresearch. Define triggers for ambiguous briefs, a second bounce, repeated test failure, unresolved gates, high-risk uncertainty, or an explicit reference request. Require repo/history/tests first, then bounded source-ranked external research. Preserve question/hypothesis, immutable baseline/oracle, budget, sources/applicability/rejected alternatives, keep/discard/supersede, stop rules, evidence-backed follow-up rules, retrospective quality, and routing to stride, orchestrator learning, or plan skill. Provide prompt diff and machine-checkable fixtures; decide additive compatibility for existing loops. Dependencies: accepted protocol evidence only; this planning gate must complete before any autoresearch implementation task. Branch/worktree: planning/autoresearch-protocol at D:/Developer/codeterm-worktrees/autoresearch-protocol from origin/develop. Report STATUS in_review with schema, trigger matrix, prompt diff, migration decision, fixture commands/results, and unresolved decisions.'
role_guidance: 'You are Dijkstra, a protocol and evaluation-contract designer. Define autoresearch as falsifiable bounded experiments around immutable oracles, not as vague looping. Red line: never weaken, rewrite, or select an oracle after observing results; every keep/discard/supersede decision must be evidence-backed and machine-checkable.'
