  kind: dry_run
  text: ' research question = can Karpathy-style fixed-surface/fixed-oracle experimentation be adapted to bounce unwinding without turning the planner into unbounded autonomous research? hypothesis = yes, if the surface is the protocol/prompt contract, the oracle is an immutable completeness checklist, the evidence budget is bounded, and external research is repo-first/source-ranked. baseline = pre-audit planner loop behavior: budget/stagnation/reflection/retrospective existed, but no bounce-triggered research schema or source/applicability record. immutable oracle = checklist requiring (1) trigger matrix, (2) falsifiable hypothesis, (3) baseline+immutable oracle, (4) bounded query/experiment budget, (5) evidence with source/applicability/rejected alternatives, (6) keep/discard/supersede, (7) stop rules, (8) follow-up rule, (9) stride/learning/skill/retro routing, (10) LoopSpec migration. experiment budget = one external primary-reference pass plus one protocol revision; no code/build/implementation mutation. evidence = official karpathy/autoresearch README/program.md: one editable train.py, fixed five-minute run, val_bpb metric, results log; secondary generalized patterns: fixed eval harness, budget, confidence/noise, after-run evidence hooks. applicability = keep fixed oracle/budget/log/source ranking; reject direct ML assumptions, infinite loop, and auto-revert as mandatory planner behavior. decision = KEEP the bounded contract additions in task_v4djn7; DISCARD treating current loop_6c2hy7 as autoresearch; no oracle mutation. stop = stop after one protocol revision because all checklist items are present; further iterations require a new evidence gap. routing = this evidence remains a task stride; reusable recipe belongs in a plan skill only after executable check; durable cross-plan orchestration lesson goes to orchestrator learning; quality synthesis belongs in retrospective. compatibility = additive metadata for existing loops; no reinterpretation of old iterations. This is a protocol dry-run, not a claim that the runtime loop executed autoresearch.'
