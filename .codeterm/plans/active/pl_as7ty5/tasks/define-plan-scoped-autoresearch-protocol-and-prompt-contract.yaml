  kind: fixture_plan
  text: ' machine-checkable fixtures must use immutable evaluator inputs and exact expected outputs. F1 progress/reset: record_iteration(true) resets stagnation/deviation; expected 0/None. F2 two-stagnation: two false iterations produce deviation at threshold 2; expected count/stagnation exact and goal/target preserved. F3 honest bounce: only explicit bounce milestones/strides count; missing bounce records are not fabricated. F4 reflection clearing: pending reflection appears after group close/cadence and disappears only after a recorded heartbeat learning; expected trigger/window exact. F5 retrospective completeness: latest retrospective ignores supersede marker and requires required sections: outcome, evidence, bounces, oracle/test quality, skills/lessons, follow-up. F6 skill promotion: reusable recipe promotes only after check command passes and ledger verdict keep; failed/no-check recipe is not promoted. F7 research trigger: ambiguous brief/second bounce/repeated failure/open gate each yields one bounded research record; repeated trigger cannot exceed budget or create duplicate follow-up. F8 oracle integrity: mutating evaluator/expected value is rejected or flagged; keep/discard cannot be obtained by changing the oracle. F9 routing: stride, orchestrator learning, plan skill, and retrospective each receive only their matching input. F10 legacy loop: LoopSpec without research metadata serializes/deserializes unchanged.'
