  text: ' planner ergonomics and harness friction are in scope for the bounce-unwinding/autoresearch protocol. During each research pass, record any planner CLI/state/canvas/QA-harness friction that impedes evidence collection, task routing, source capture, oracle execution, or retrospective/skill promotion. Classify severity and blast radius; create a bounded 1.7.2 follow-up only when it affects correctness, clarity, reliability, release confidence, or research continuity. Prefer simplifying existing planner primitives and harness selectors over adding new stores or task types. Route reusable procedures to plan skill only after an executable check; route cross-plan orchestration lessons to durable orchestrator learning; route prompt/process defects to Planner prompt changes. Never let convenience alter an immutable oracle or silently mutate task evidence.'
