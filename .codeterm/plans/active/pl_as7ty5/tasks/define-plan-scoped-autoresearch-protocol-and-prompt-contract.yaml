  kind: protocol_artifact
  text: ' BOUNCE-UNWIND AUTORESEARCH v1. Research trigger = ambiguous/underspecified brief, second bounce on one task, repeated focused-test failure, unresolved decision gate, high-risk uncertainty, or explicit request for references. Phase 1 question = write one falsifiable question and hypothesis. Phase 2 baseline = capture current source/task/oracle state; freeze the oracle command, expected observation, scope, and metric before edits or external search. Phase 3 research = repo/source/history/tests first, then bounded external primary sources (official docs, upstream repositories, issues/commits), then maintainer discussions, Stack Overflow, Reddit only if needed. Budget = max 5 external queries, max 5 retained sources, max 10 minutes, max 2 candidate approaches, one local experiment; no unbounded browsing. Evidence record fields = question, hypothesis, baseline, immutable_oracle, query/source, source_tier, applicability, differences, rejected_alternative, experiment, observed_result, risk/blast_radius, decision, follow_up, stop_reason. Decision = keep, discard, or supersede; every keep must name the oracle result, every discard must name evidence, every supersede must link the replacement. Stop = success when acceptance oracle passes; stagnation after two no-progress attempts; risk when scope/security/release risk rises; budget when query/source/time/experiment cap is reached. Follow-up = cut a bounded task only if evidence affects correctness, clarity, reliability, release confidence, or research continuity; otherwise record stride. Routing = local evidence/experiment -> task stride; reusable checked recipe -> plan skill; cross-plan process lesson -> orchestrator learning; prompt/process defect -> Planner prompt proposal; group quality synthesis -> retrospective. Planner ergonomics/harness friction is recorded and classified by the same rule, but convenience never changes the oracle.'
