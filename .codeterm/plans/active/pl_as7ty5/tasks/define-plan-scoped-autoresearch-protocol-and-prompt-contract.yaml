test_plan: 'Oracle: protocol fixtures and focused planner tests prove the research path without changing the oracle. 1. Inspect src-tauri/crates/codeterm-plan/src/plan/loop_engine.rs, service_plan/loop_mutations.rs, service_plan/reflection.rs, service_plan/retrospective.rs, planner/orchestrator prompt sources, and CLI plan loop/skill/retrospective commands; pass: each claimed hook exists. 2. Run focused codeterm-plan loop/reflection/retrospective tests with a 90s cap; pass: progress reset, two-stagnation deviation/stop, honest bounce milestone, reflection clearing, latest retrospective, and skill timeline cases pass. 3. Add fixture specifications for ambiguous brief, second bounce, unresolved gate, and repeated test failure; pass: each triggers at most the bounded research budget and records question/hypothesis/sources/applicability/oracle/decision/follow-up. 4. Include source-ranking fixtures: repo/primary docs/issues before secondary discussions; pass: citations and rejected alternatives are retained. 5. Render proposed planner_suffix.md/orchestrator_suffix.md diff; pass: exact commands/routing destinations are named. 6. Verify immutable oracle fixture cannot be improved by editing the evaluator; pass: mutation is rejected or flagged. 7. Run codeterm plan state pl_as7ty5 --json; pass: loop_6c2hy7 remains 0/3, no autoresearch claim is fabricated, and no plan skill is invented.'
correctness: 'Correctness requires bounded evidence-led bounce unwinding, not autonomous thrashing: repo-first/source-ranked research, immutable oracle, fixed query/experiment budget, applicability analysis, explicit decision and stop rules, safe follow-up creation, and durable routing of evidence to stride/learning/skill/retrospective without weakening existing loop semantics.'
