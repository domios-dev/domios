body: Investigate and repair plan-store migration/data integrity. Planner evidence reports active plan `pl_ghk358` disappeared from active and archive storage after the current layout migration/restart, while its task ledger and git lanes remain. Search found no local backup. Plan migration must preserve active plans, task briefs, sections, milestones, attachments, and handoffs atomically; recovery must be possible after interrupted migration. First recover the lost plan from the planner session export into a durable artifact, then implement the store repair with fixture-level migration/restart proof. Never treat a missing plan as implicit archive or completion.
