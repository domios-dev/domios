acceptance_criteria:
- Migration/restart preserves every active plan and its complete task graph or leaves an atomic recoverable backup; no active plan silently disappears
test_plan: |-
  1. Create an active plan fixture with sections, tasks, milestones, attachments, and handoffs; run the actual plan-store migration/restart path; assert the same plan id remains discoverable in active storage or is atomically archived with a recovery pointer.
  2. Simulate interrupted migration and validate no active plan/task payload is deleted or orphaned. Run the focused store test with the repository capped test runner.
  3. Verify the production data directory before and after an app update/restart with `codeterm plan list --all`; capture plan ids and task counts. No destructive migration test against production data.
correctness: Recovery and migration are atomic, durable, and never delete or reinterpret active plan state without an explicit archive record
