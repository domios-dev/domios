id: task_msqsmt
name: Require every plan to belong to a team
type: implement
model: opus
model_rationale: This spans plan creation, CLI adoption, and workspace UI invariants.
personality: null
personality_provenance: null
acceptance_criteria:
- A plan cannot be created, adopted, or shown as active without exactly one valid team binding; stale or missing bindings produce an actionable error.
- Remove the workspace-level plan creation/control that permits an unowned plan; creation starts from a team context.
- team adopt-plan completes atomically, updates the visible team binding, and has a bounded regression reproducing the prior timeout/hang.
test_plan: Focused Rust/API tests for creation/adoption invariants and one accessibility-first Playwright test proving the team-scoped plan control; no fixed waits.
correctness: Team ownership is a durable invariant at storage, API, CLI, and UI boundaries; no silent fallback to workspace ownership.
