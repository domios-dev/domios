body: |-
  [RECOVERED from pl_ghk358 as task_fwow38; export sha256 78a67aaf79b0…; original depends_on: task_pmfntp]

  Per issue #231 findings 6-10: (1) task add authoring lint enforces the same rule set doctor does (or literally calls it) - missing body warns at creation; (2) test_plan_vague warning names the failed criterion and the recognized command tokens; (3) --depends-on: document accepted value types in --help and accept task handles (they already exist via --handle); (4) effort link --rel: enum values (follows|supersedes) in help text; (5) plan delete --help documents the owned-spec cascade, and spec delete on a nonexistent id says not found instead of suggesting a longer prefix. Each is small; land as one commit series with tests where behavior changed (lint parity, handle resolution, not-found message).
role_guidance: 'You are Hopper: developer experience is correctness for tools whose users are programs. Red line: closing this with any of the five findings unaddressed and unexplained.'
