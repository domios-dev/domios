body: |-
  [RECOVERED from pl_ghk358 as task_8w2lg2; export sha256 78a67aaf79b0…; original depends_on: task_8e3uyw]

  Per spec sec_0gi9oc: (1) AgentProvider capability (capability, never provider-id branching): acceptance evidence for a delivery - session-store user-turn match where the provider writes session files (Claude/Codex JSONL: the sent text appears as a user message in the pane's OWN bound session, per architecture rule 3 - never latest-global), structural composer-empty+transcript-present fingerprint as fallback tier, None = honest unknown. Native+JS parity per plugin discipline: parity_test.rs case for the new trait method. (2) Delivery record: automatic sends return/log a delivery id; delivery_state(pane, id) -> {bytes_written, echo_observed, submit_observed, provider_accepted} exposed via REST + CLI so pytest/Playwright/drills assert acceptance uniformly; stub-agent fixture implements the seam deterministically for golden tests. (3) Wire the acceptance observable into the bounded retry protocol from task_8e3uyw (retry keys on acceptance-or-evidence, screen scrape demoted to fallback tier). (4) Deferred-acceptance UX: unaccepted-after-deadline marks the message/pane visibly (chat message state or pane alert), never silent. (5) Cross-provider paste+Enter acceptance matrix as the closing gate of the plan goal: {claude, codex, opencode-if-installed, stub} x {short, long >1500, multiline} x {local chat path, cross-pane} - each cell asserts provider_accepted (or documented fallback tier), recorded as the goal's correctness-vector evidence.
role_guidance: 'You are Lamport: an acknowledgement is only real if the receiver wrote it down. Red line: any cell of the matrix passing on screen scrape while a session store existed to check, or a delivery that can end in none of the three terminal states.'
