body: 'Implement a crash-aware process recovery supervisor separate from task_523k8i close/report race repair and task_23fywk restart indexing/binding preservation. Distinguish clean shutdown/update/restart/user exit from abnormal crash/fast-fail/power-loss using durable startup/shutdown markers plus process identity/epoch. On abnormal crash, persist/report crash metadata and last-healthy timestamp, then let an external launcher/supervisor restart CodeTerm; the crashed process must never restart itself. Add bounded backoff and loop protection. Restore workspaces, panes, plans, owner/planner, task attempts, and report routes using task_23fywk invariants; resume only safe idempotent work and mark ambiguous executions needs-review/reassign. Add a durable non-toast recovery UI state. Initial ownership to verify: src-tauri/src/crash/mod.rs; src-tauri/src/crash/shutdown.rs; src-tauri/src/crash/report.rs; src-tauri/src/crash/panic.rs; src-tauri/src/crash/native.rs; src-tauri/src/startup/mod.rs; src-tauri/src/startup/states.rs; src-tauri/src/update/shutdown.rs; src-tauri/src/lib.rs; src/components/CrashReportToast.tsx; startup launcher/install surfaces and platform-specific scripts. Dependencies: task_23fywk restart recovery contract and task_523k8i crash-race findings; group crash-recovery. Architectural decisions requiring user direction must be recorded and routed to Orchestrator before implementation: external supervisor packaging/ownership per OS, durable marker location/retention, ambiguous-work idempotency policy, and recovery UI placement. Branch/worktree: lane/crash-recovery-supervisor at D:/Developer/codeterm-worktrees/crash-recovery-supervisor from origin/develop. Report contract: STATUS in_review; design decisions/questions; exact platform ownership; crash classification records; restart/backoff evidence; restored state/report-route evidence; duplicate-worker/report checks.'
role_guidance: 'You are Dijkstra, a cross-platform crash-recovery architect. Design recovery outside the crashed daemon, preserve only safe idempotent work, and surface durable recovery truth. Red line: auto-restarting after explicit user exit, restart loops, duplicate workers/reports, or ambiguous execution marked safe fails.'
