id: task_1ies9h
name: Add crash-aware external process recovery supervisor
type: implement
model: gpt-5.5
model_rationale: 'Routing rationale: release-critical cross-platform process supervision, lifecycle classification, durable recovery state, and restoration semantics require gpt-5.5.'
personality: Dijkstra
personality_provenance: null
acceptance_criteria:
- Explicit user exit never auto-restarts; forced abnormal termination persists exact crash classification/epoch/last-healthy metadata, invokes external bounded supervisor recovery, restores state without duplicate panes/workers/reports, marks ambiguous execution needs-review/reassign, and exposes durable non-toast recovery state; repeated crashes trip loop protection across Windows/macOS/Linux design.
test_plan: 'Oracle: isolated Windows remote dev instance force-kill recovery plus platform design/test coverage. 1. Start an isolated remote Windows dev instance with known workspace/panes/plans/worker attempts and record PID, epoch, health, report routes. 2. Force-kill the daemon process without clean shutdown. Pass: external supervisor/launcher restarts it, health returns within configured bounded backoff, and persisted metadata says abnormal crash with old/new identity/epoch and last-healthy timestamp. 3. Verify restored workspace/panes/plans/owner-planner/task attempts/report routes. Pass: no duplicate workers or reports; ambiguous active execution is needs-review/reassign; safe idempotent work only resumes. 4. Trigger explicit user exit. Pass: no automatic restart. 5. Repeat forced crashes until threshold. Pass: loop breaker stops restart and durable recovery UI reports state without toast. 6. Run focused crash/startup/recovery tests on Windows remote with 90s caps; pass: exit 0. Document macOS/Linux launcher/supervisor implementation and equivalent test oracle before acceptance.'
correctness: Correctness requires external, epoch-aware, durable crash recovery that distinguishes intentional shutdown, prevents loops and duplication, preserves restart state under task_23fywk invariants, never resumes ambiguous work automatically, and behaves consistently across platform launcher designs.
