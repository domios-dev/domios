    message: |-
      STATUS: in_review
      CHANGES: Added an external CLI-owned crash supervisor with durable PID/epoch/current/clean/pending-crash/history/disabled records. The supervisor adopts a live daemon instead of duplicating it, durably classifies abnormal_exit, fast_fail, or power_loss_or_kill before backoff, honors persisted 1s/2s/4s bounded exponential backoff (30s max), trips loop protection at 3 crashes/5 minutes, follows clean restart/update replacement epochs without launching them, and stops after user_exit/signal or explicit autostart disable. The daemon consumes pending_crash.json into last_crash.json with the real new epoch, keeps the first clean-shutdown reason authoritative, fsyncs recovery truth, and heartbeats off the async runtime. Settings now installs/checks/removes native OS wrappers in-process instead of shelling into the CLI. Recovery UI is a durable full-width non-dismissible, current-epoch banner.
      DESIGN/PLATFORM OWNERSHIP: Windows CodeTerm-Autostart scheduled task owns one CLI supervisor, starts it immediately and ONLOGON, and uses /End+/Delete on disable. macOS LaunchAgent owns one supervisor with RunAtLoad=true and KeepAlive=false; XML paths are escaped. Linux user systemd codeterm.service owns one supervisor with Restart=no; ExecStart paths are quoted. supervisor.lock plus live PID/epoch adoption prevents duplicate supervisors/apps. supervisor.disabled prevents an already-running supervisor from recovering after the user disables autostart.
      RESTORE/ROUTE CONTRACT: The supervisor only restarts/adopts the app and never spawns workers. Session restore remains under task_23fywk invariants. Persisted work policy is needs-review/reassign for ambiguous execution, restore-bindings-before-spawn for duplicate-worker prevention, and restored owner/planner routing for duplicate-report prevention. No absence-of-evidence path marks work safe.
      TESTS RUN: rustfmt --edition 2021 --check on all touched Rust sources PASS; git diff --check PASS; scripts/check-file-sizes.sh --fail PASS (no source over 1200 lines); docs/cli-manifest.json JSON parse PASS; focused source assertions for pending crash, disable intent, loop breaker, Windows/macOS/Linux wrapper semantics, epoch-scoped banner, and ambiguous-work rendering PASS. No cargo/build/dev/Playwright was run per source-only continuation.
