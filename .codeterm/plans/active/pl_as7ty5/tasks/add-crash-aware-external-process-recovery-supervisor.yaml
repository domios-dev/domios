  text: |-
    STATUS: partial
    CHANGES: Implemented the actual external crash-aware supervisor path. Added hidden CLI command 'codeterm system supervise' that runs outside the daemon, takes a supervisor lock, launches CodeTerm, waits for process exit, reads state/recovery/current.json + last_clean.json + last_crash.json, applies persisted backoff_ms, stops on loop_protected, and stops on clean user/update/restart shutdown. Updated 'codeterm system enable-autostart' to install OS wrappers that launch the CLI supervisor instead of the app directly. Windows: CodeTerm-Autostart scheduled task runs the supervisor. macOS: LaunchAgent ProgramArguments run supervisor with KeepAlive=false. Linux: user systemd unit runs supervisor with Restart=no so supervisor markers own restart decisions. Desktop Settings autostart now delegates to the same CLI system command instead of direct HKCU/desktop/plist entries. Added 'system' to GUI CLI forwarding. Kept daemon lifecycle records/banner from prior pass and extended lifecycle tests. Updated docs/CLI.md, docs/cli-manifest.json, and docs/crash-recovery-supervisor.md.
    TESTS RUN: cargo fmt --manifest-path cli/Cargo.toml; cargo fmt --manifest-path src-tauri/Cargo.toml; cargo run --manifest-path cli/Cargo.toml -- cli-manifest --write PASS; TEST_CAP_SECS=90 CARGO_TEST_CMD='cargo test --manifest-path cli/Cargo.toml' scripts/test-capped.sh -- cmd::system PASS; TEST_CAP_SECS=90 CARGO_TEST_CMD='cargo test --manifest-path src-tauri/Cargo.toml --lib' scripts/test-capped.sh -- crash::lifecycle PASS; CODETERM_API_PORT=7686 ./build.ps1 check PASS with only pre-existing keepawake dead_code warnings; ./scripts/check-file-sizes.sh --fail PASS.
