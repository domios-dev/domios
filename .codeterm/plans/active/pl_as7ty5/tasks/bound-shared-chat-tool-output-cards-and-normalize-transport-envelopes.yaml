id: task_6761hn
name: Bound shared chat tool-output cards and normalize transport envelopes
type: implement
model: gpt-5.6-terra
model_rationale: GPT-5.6 Terra is the verified default for shared Chat/Terminal renderer parity and responsive accessibility work; inherit task model without dispatch override.
personality: Hopper
acceptance_criteria:
- At exact 959x279, long unbroken JSON is rendered in a deliberate collapsed representation of at most two visual lines with ellipsis/chevron and an accessible Expand control; it is never silently hard-clipped.
- At a narrower mobile viewport, min-width:0 and overflow rules prevent horizontal overflow, overlap, and layout shift while preserving the same compact affordance.
- Keyboard and pointer expansion expose the complete original payload in a bounded internally scrollable region; collapse restores the compact representation.
- Copy full output returns the exact complete stored payload, while accessibility text, error detection, and structured exit/status metadata remain intact.
- The shared renderer behavior is covered for exec/wait, SSH, mesh, and plugin cards, with lifecycle semantics delegated to task_j97631 and no ownership overlap.
- Focused Playwright, diff, and file-size checks pass in remote/isolated QA.
test_plan: 'Oracle: focused Playwright UI spec and screenshot/golden at exact 959x279 Mac-Air shell dimensions plus a narrower mobile viewport. 1. Render a one-line result and a long unbroken JSON tool-call payload in the shared card; pass: one-line output remains unchanged, long collapsed content is exactly at most two visual lines with ellipsis/chevron and a visible Expand control, no hard clip or overflow. 2. Set viewport to 959x279 and then the specified mobile width; pass: min-width:0, white-space/overflow/text-overflow behavior prevents horizontal overflow, overlap, or layout shift. 3. Activate Expand with mouse and keyboard; pass: control has accessible name/state, focus is visible, expanded payload contains the complete original JSON in a bounded internal-scroll region, and collapse restores compact state. 4. Activate Copy full output; pass: clipboard payload exactly equals the stored untruncated result. 5. Cover success, failure, timeout, and tool-call cards for exec/wait, SSH, mesh, and plugin variants; pass: structured exit/status metadata remains outside the collapsed body and error detection is unchanged. 6. Run the focused Playwright command: npx playwright test tests/playwright/suites/16-chat-view/tool-output-cards.spec.ts --config=tests/playwright/playwright.config.ts --project=golden; pass: all selectors and layout assertions pass at desktop and mobile widths. 7. Run git diff --check and scripts/check-file-sizes.sh; pass: both exit 0. Heavy UI QA remains remote/isolated and no local release build is run.'
correctness: No payload truncation in storage/accessibility/error detection/copy; collapsed visual bound <=2 lines; complete expanded payload; keyboard accessibility; no overflow/layout shift at 959px and mobile; stable lifecycle/status metadata; shared renderer parity across tool surfaces; renderer-only ownership.
