body: Own only shared tool-output card rendering and its focused UI tests/styles. Preserve the existing dependency on task_j97631 for terminal lifecycle semantics. For collapsed shell tool-call rows, render a deliberate compact representation of at most two visual text lines with a visible ellipsis/chevron and an explicit accessible Expand control; never hard-clip long JSON without affordance. Expanded state must expose the complete stored payload in a height-bounded internally scrollable region with Copy full output, without truncating or mutating the payload used for accessibility, error detection, or copying. Cover exec/wait, SSH, mesh, and plugin tool cards through the shared renderer. Own only src/components/AgentRun/EventRenderer.tsx, the shared output-card component/styles, and focused tests; do not edit streamParser/useAgentRunStream, outputStream, ChatComposer, or multiplexer stores.
role_guidance: 'You are Hopper, a dense operational chat UI engineer. Bound rendered output without losing data, metadata, accessibility, error detection, or copy payload across every tool transport. Red line: truncating stored output, hiding failures, or implementing a one-off card path fails.'
