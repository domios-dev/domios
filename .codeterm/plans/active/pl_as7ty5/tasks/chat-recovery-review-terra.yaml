  text: |-
    IN_REVIEW: STATUS: done
    CHANGES: none (read-only review of feat/1.7.2-stability at f0d1e07b7)
    FINDINGS:
    P1 src-tauri/src/service/pane_chat/store_watch.rs:32-54; src-tauri/src/commands/pane.rs:406-420; src-tauri/src/service/pane_chat/registry.rs:112-120. spawn_store_watch starts its thread before chat_start_core inserts its handle. If the JSONL appears after the initial None probe but before insert, the watcher promotes, replace_if_current finds no entry and shuts the new tailer down, then the caller inserts the now-dead watcher. The frontend deliberately does not poll pending chat_start, so this pane remains Recovering until manual reconnect. The existing test only makes the store available after insertion; add a deterministic pre-registration-promotion interleaving test and make registration precede promotion authority.
    P1 src-tauri/src/api/hook_routes.rs:304-312,481-483,521-529; plugins/provider-codex/src/plugin.ts:128-142. The new provisional guard performs an additional session_exists call while the mux write lock is held. For Codex this walks ~/.codex/sessions recursively in QuickJS. A SessionStart hook can now hold the global mux lock through two full store scans, freezing all pane/mux mutations and violating the no-heavy-work-under-lock invariant. Snapshot pane state under the lock, probe outside it, then reacquire and commit only if the relevant binding/nonce remains unchanged.
    TESTS RUN: none (read-only review; no builds/tests started). Inspected focused useChatSession, PaneSessionChat watcher, tailer, registry, and hook-route tests.
    GATES REQUESTED: after fixes, add/run a deterministic watcher-promotes-before-registry-insert test via TEST_CAP_SECS=90 scripts/test-capped.sh --manifest-path src-tauri/Cargo.toml service::pane_chat::tailer_tests::pending_store_watch_promotes_to_tailer_and_streams_initial_batch; run the focused hook-route test module with the same capped runner; run npx tsx src/components/Terminal/useChatSession.test.ts and npx tsx src/components/Terminal/PaneSessionChat.watcher.test.tsx.
    FOLLOWUP: Existing focused tests do not cover either the pre-registration promotion interleaving or the mux-lock/file-walk boundary.
