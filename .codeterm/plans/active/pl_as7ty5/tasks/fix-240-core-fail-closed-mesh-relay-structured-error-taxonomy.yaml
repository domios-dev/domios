body: |-
  [RECOVERED from pl_ghk358 as task_7fei9d; export sha256 78a67aaf79b0…]

  Per issue #240 and spec sec_sve813: (1) locate the mesh relay's PTY write site and the pane-to-pane routing branch that 404s while --tab main works; document it as a new row in the spec sec_l4uzrj audit table; (2) reorder to fail-closed: ALL preflight (peer reachable, pane resolvable, pane safe to receive) completes BEFORE any byte is written; an error response guarantees zero bytes written - make the write the last fallible step; (3) route the delivery through the verified submit transaction (send_text_to_pty_smart / submit_entry) instead of raw injection, so busy-pane gating and post-Enter evidence apply to mesh sends exactly as to local ones; (4) replace bare 404/503 with structured errors (pane_not_reachable_on_peer, pane_busy_refused, submit_unconfirmed - reuse/extend the InjectionError taxonomy over the relay boundary). Fix the pane-to-pane routing so it resolves the same way --tab main does. Repro harness: two dev instances or loopback peer per docs/MESH.md; capture the pre-fix 404+delivered behavior red, then green.
role_guidance: |-
  You are Lamport. A distributed send has exactly three honest outcomes: delivered-with-evidence, refused-with-zero-writes, or in-doubt-reported-as-in-doubt. Red line: any code path where the error response is computed independently of whether bytes were written.
  REMAINING GATES (worker-requested): clippy --all-targets warm; two-instance live drill (busy→pane_busy_refused+untouched PTY, nonexistent→pane_not_reachable_on_peer, valid→parity --tab main, assert far-end bytes); warm full suite + PW golden; real merge + is-ancestor c2b73fb10. Worker follow-ups: from_opaque substring classification ('still booting') — thread typed InjectionError through send_text (21 callers); sibling routes in pane_routes.rs (~215-716) still bare-404; body.raw=true mesh seam = owner scope decision.
