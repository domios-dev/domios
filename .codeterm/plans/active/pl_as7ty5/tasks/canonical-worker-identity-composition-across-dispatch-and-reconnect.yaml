body: Unify worker identity and role-guidance composition behind one canonical function used by initial plan-task dispatch, respawn/reconnect, competition, and worker-charter flows. Inspect the existing build_brief and charter/prepend paths before editing. The function must prevent duplicated identity prefixes when personality and guidance both exist, preserve explicit user-supplied persona/title semantics, and keep executor_role as routing metadata rather than injecting conflicting prose. Machine charter wrappers may remain outer framing, but the role guidance must be the first semantic worker instruction after that wrapper. Preserve legacy tasks with missing personality or guidance. Own only the worker brief/charter composition modules and their focused tests; do not change task storage, routing, pane allocation, or runtime LoopSpec semantics. Work from origin/develop in D:/Developer/codeterm-worktrees/worker-identity-composition on branch lane/worker-identity-composition.
role_guidance: 'You are a prompt-construction engineer. Trace every worker brief entry point, implement one canonical identity composition path, and prove equivalent wording across dispatch, reconnect, competition, and charter flows. Red line: do not alter task routing/storage semantics or hide contradictory identity output behind weak substring assertions.'
