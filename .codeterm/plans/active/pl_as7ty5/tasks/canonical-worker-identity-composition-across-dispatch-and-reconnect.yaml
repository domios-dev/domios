id: task_50muai
name: Canonical worker identity composition across dispatch and reconnect
type: implementation
model: gpt-5.4
model_rationale: Normal Codex implementation is sufficient for a bounded prompt-composition fix with focused Rust snapshot tests; the behavior is correctness-sensitive but not architecture-heavy.
personality: Lamport
acceptance_criteria:
- Initial dispatch with personality Hopper and guidance beginning You are Hopper... produces one canonical identity prefix, never You are Hopper. You are Hopper....
- A single canonical composition function is used by initial dispatch, respawn/reconnect, competition, and charter/prepend flows, with snapshot tests proving equivalent semantic ordering.
- Machine charter wrappers may precede the brief, but role guidance is the first semantic worker instruction after the wrapper and no later generic identity contradicts it.
- Tasks with no personality, no guidance, or legacy serialized fields retain valid deterministic prompts without invented or contradictory identity text.
- executor_role remains metadata/routing input and is not duplicated as conflicting worker prose.
- Focused tests, git diff --check, and file-size checks pass; changed files remain within the declared ownership boundary.
test_plan: '1. Run the focused Rust test command covering worker brief/charter composition: cargo test -p codeterm --lib plan_task_dispatch -- --nocapture (or the exact narrowed package/filter discovered from the existing test module); pass condition: all composition tests pass. 2. Add/run exact snapshot cases for personality+guidance, no personality, reconnect/charter wrapper, competition, and legacy task fields; pass condition: each expected full prompt equals the canonical fixture and contains one identity, with role guidance immediately after any machine wrapper. 3. Run git diff --check and scripts/check-file-sizes.sh; pass condition: both exit 0 and no source file exceeds the project limit. 4. Run the focused prompt/plan test command required by the touched modules and report exact command/output; no local heavy build or release build is permitted.'
correctness: Identity uniqueness; semantic ordering after machine wrappers; parity across dispatch/reconnect/competition/charter; legacy serialization compatibility; no routing/storage/runtime semantic changes; exact snapshot oracle rather than substring-only assertions; source-size discipline.
