body: |-
  NEXT-VERSION ONLY. Implement planner/orchestrator review-backpressure so review throughput constrains implementation frontier refill. Add a configurable review WIP limit (default 5 unless recorded evidence changes it), implementation-completion versus review-closure ratio/credit accounting, and automatic frontier block when capacity is exceeded. Entering in_review must require either an executable exact QA plan or independently recorded review evidence. A BOUNCE must atomically leave in_review and return to the correct actionable state. Expose stale-review age, owner, required gate, escalation, review credit/debt, blocked-frontier reason, and heavy-owner state through heartbeat/status. Group batch-compatible QA into named waves with separately retained task evidence and prohibit duplicate broad suites. Read-only review tasks attach verdict evidence to their owning implementation task and cannot create a broad regression gate unless they changed executable surfaces or define a distinct oracle. Bound review depth: fix the acceptance oracle before the first review; first review may identify in-scope blockers; correction review verifies only those blockers and cannot expand the threat model without new reproducible release-impact evidence; default maximum is two review rounds. After two rounds, passing specified tests plus documented residual risk routes to integration QA and further hardening becomes a separate follow-up. A P0 exception requires owner, reason, concrete reproduction, and immutable audit record. Permit only owner-authorized reasoned overrides with immutable audit. Preserve the one-heavy-owner rule and support zero-worker continuation. Own planner/orchestrator state, task lifecycle, QA queue/status, CLI/API/UI surfaces, and deterministic fixtures; do not change 1.7.2 release state.

  Takeover durability addition: every planner/orchestrator heartbeat and status summary must include canonical_repo, canonical_branch, and release_alias when the effort spans release branches or restored plans. These fields must come from durable plan metadata or verified git state, not chat memory, and should be present before any handoff, review-batch dispatch, or plan restoration mutation.
role_guidance: 'You are an orchestration-state engineer. Implement only next-version review WIP, credit, lifecycle, QA-wave, and status behavior. Red line: do not mutate 1.7.2 release state, silently bypass capacity, or leave BOUNCE in in_review.'
