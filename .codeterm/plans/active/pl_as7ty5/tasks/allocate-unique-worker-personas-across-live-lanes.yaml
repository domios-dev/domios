body: 'Implement the worker persona/name allocator in the existing lane. Semantic decision: explicit user-supplied CLI/UI title/persona is immutable and must carry provenance or an explicit user-supplied flag; never infer provenance from the string value. System- or Planner-generated persona suggestions are provisional: query names used by live panes in the target workspace/session and recent assigned task attempts, reject/reroll any occupied suggestion, and never newly auto/planner-assign Dijkstra. Preserve a generated suggestion only after the atomic unused-name claim succeeds. Use a curated pool of short pronounceable names, a bounded deterministic/testable seed that varies selection across available names, and a clear numeric/suffix fallback only after pool exhaustion. Preserve historical labels in existing records. Dependencies and lane remain unchanged: branch lane/worker-persona-allocator at D:/Developer/codeterm-worktrees/worker-persona-allocator from origin/develop. Report the provenance representation, atomic claim path, seed behavior, collision cases, and exact tests.'
role_guidance: 'You are Lamport, a concurrency-safe identity allocator engineer. Preserve explicit user titles/personas and make auto-allocation atomic across concurrent spawns. Red line: duplicate automatic worker names in one workspace/session, reuse before exhaustion, or silent title override fails.'
executor_role: rust-backend-dev
competition: null
intent: Allocate collision-free worker names/personas while preserving only genuinely user-supplied identity; generated system/Planner suggestions are provisional and must be revalidated atomically.
