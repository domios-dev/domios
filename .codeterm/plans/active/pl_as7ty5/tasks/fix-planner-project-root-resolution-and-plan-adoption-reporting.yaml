body: 'Fix all confirmed restart recovery defects in one bounded planner CLI/state lane. (1) Plan creation/resolution must use the workspace repository root, not the AppData pseudo-project. (2) After a production restart, existing plan files must be indexed from workspace cwd and retain owner/planner binding rather than appearing absent/unbound. (3) Every pre-restart in_progress worker task and open execution_attempt must restore pane/task/plan binding, lane base/branch/worktree, liveness classification, and report route when its pane/session restores; an absent pane must deterministically reconcile to needs-reassign without losing attempt history. (4) Task status must never silently drift to parked or pending. (5) Plan move/adopt must count and transfer sidecar task files, preserve task ids/history/strides, and dry-run task_count must equal canonical task count. Exact ownership must be verified before edit across project resolution, plan index/restart, pane/session restore, task attempts/reconcile, and move/adopt services. Dependencies: controlled self-improvement loop; independent review and integration QA before release. Branch/worktree: lane/planner-project-resolution at D:/Developer/codeterm-worktrees/planner-project-resolution from origin/develop. Report contract: STATUS in_review; exact files; pre/post canonical state/attempt IDs; remote restart fixture results; status/liveness/report-route evidence; dry-run/real move counts; no production data mutation.'
role_guidance: 'You are Lamport, a planner CLI state-consistency engineer. Make project resolution deterministic across restart/workspace cwd and make plan move/adopt dry-run report real sidecar task counts. Red line: a fix that silently chooses a different plan store or loses/miscounts task files fails.'
executor_role: rust-backend-dev
competition: null
intent: Restore deterministic production restart recovery for plan project root/indexing, owner/planner binding, worker lane/attempt/report state, and move/adopt sidecar task preservation without silent task-status drift.
