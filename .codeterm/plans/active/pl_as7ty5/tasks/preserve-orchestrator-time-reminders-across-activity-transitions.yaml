body: 'Fix the confirmed scheduler/reminder correctness defect. Current evidence: prod emits [plan-reminder] ticks every 60 seconds with candidate panes, but due remains 0 for more than one hour because TurnCounter::reset removes the timed reminder entry and startup/background.rs invokes reset whenever a pane transitions Idle->Working. An execution-plan owner with one or more open tasks therefore continuously re-arms time reminders from zero; orchestrator heartbeat set only persists reinjection focus/lanes and does not schedule wake-up delivery. Split activity/turn/poll reset behavior from the independent time-reminder deadline. An active Orchestrator that owns an execution plan with >=1 open task must remain time-eligible across Idle->Working transitions and ordinary reports. Preserve pause, completion, park, explicit disable, and plan closure semantics. Expose last_tick, last_due, last_delivery, and delivery failure/retry reason in plan/orchestrator status. Own only scheduler/reminder, lifecycle transition, plan/orchestrator status, and focused test surfaces discovered by trace; do not alter unrelated heartbeat prompt content. Work from origin/develop in D:/Developer/codeterm-worktrees/orchestrator-reminder-deadlines on branch lane/orchestrator-reminder-deadlines.'
role_guidance: 'You are a scheduler correctness engineer. Separate activity reset from time-deadline eligibility and prove reminder delivery under continuous normal worker activity. Red line: never reset a live execution-plan owner''s due deadline merely because its pane transitions Idle/Working or emits an ordinary report; preserve pause/complete/park semantics exactly.'
