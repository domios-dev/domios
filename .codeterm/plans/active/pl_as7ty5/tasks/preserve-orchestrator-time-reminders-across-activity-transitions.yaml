id: task_4d5ay7
name: Preserve orchestrator time reminders across activity transitions
type: implement
model: gpt-5.5
model_rationale: This release-blocking scheduler correctness fix spans reminder eligibility, durable plan state, lifecycle transitions, observability, and real isolated-daemon delivery; gpt-5.5 is required.
personality: Lamport
personality_provenance: null
acceptance_criteria:
- Repeated Idle->Working transitions and ordinary reports do not reset or remove the time-reminder deadline for an active execution-plan owner with at least one open task.
- A deterministic simulated interval over 30 minutes reaches due and delivers despite continuous normal activity; due timing is measured from the intended deadline, not the last activity reset.
- Paused, completed, parked, closed, disabled, and no-open-task plan states retain their existing reminder suppression/clear behavior.
- plan/orchestrator status exposes truthful last_tick, last_due, last_delivery, and delivery failure/retry reason.
- An isolated real daemon proves one reminder delivery under repeated Idle->Working transitions without a restart, and telemetry agrees with [plan-reminder] logs.
- Focused tests, isolated check, diff check, and file-size check pass without a local heavy/release build.
test_plan: 'Oracle: deterministic deadline regression plus isolated real-daemon delivery. 1. Add focused unit tests around TurnCounter/reminder state that repeatedly apply Idle->Working transitions and ordinary reports across a simulated interval exceeding 30 minutes with an execution-plan owner and open tasks; pass: due becomes true at the original deadline and remains eligible until successful delivery, never restarting from zero. 2. Add fixtures for paused, completed, parked, closed, disabled, and no-open-task plans; pass: each suppresses or clears reminders only according to its existing semantic contract. 3. Exercise delivery success and failure/retry; pass: plan/orchestrator status exposes last_tick, last_due, last_delivery, and failure/retry reason with deterministic values. 4. Start an isolated daemon instance, create an execution-plan owner with at least one open task, cause repeated Idle->Working transitions and ordinary reports for the configured test interval, then observe real reminder delivery; pass: a reminder arrives once at the deadline without daemon restart and status telemetry matches logs. 5. Run the exact focused cargo test filters discovered from the touched modules, then build.sh check in the isolated remote QA checkout; pass: exit 0. 6. Run git diff --check and scripts/check-file-sizes.sh; pass: both exit 0. Do not run a local heavy or release build.'
correctness: Independent deadline versus activity reset; no reminder starvation under normal Orchestrator work; exact terminal-state suppression; idempotent delivery/retry; observable scheduler state; deterministic unit regression; real isolated-daemon proof; no heartbeat-state conflation.
