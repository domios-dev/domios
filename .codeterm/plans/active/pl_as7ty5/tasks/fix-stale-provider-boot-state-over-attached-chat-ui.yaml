body: 'Fix the provider startup regression shown by user screenshots: a PTY-backed Codex/Orchestrator chat can be attached and usable while persisted/runtime `boot_stage=spawn_failed` or loading remains stale. Opening Terminal currently happens to cause a later reconciliation, but Chat must not require a Terminal mount. Once `chat_start` attaches or a chat event arrives, the Chat surface is authoritative: no late boot/loading/failure overlay may cover it or interrupt the composer. Retry must be pane-generic; it must never invoke the General Agent-only route for a normal orchestrator/worker pane. Preserve real launch failures before Chat attachment and hide Retry when `canRetry=false`.'
