id: task_k16xu0
name: Convert agent-flow golden tests to stub provider, keep live LLM shard
type: qa
model: opus
model_rationale: Once the runtime stub lands, the 25+ real-LLM golden tests (03-agents, cross-pane-chat, 20-new-session pair spawns, 12-web live chats, 10-restore, 07-cron) can verify the same UI/plumbing in seconds; only a handful must stay truly end-to-end.
personality: null
personality_provenance: null
acceptance_criteria:
- Every converted test uses the stub provider and keeps its original oracle (same DOM/API assertions), with per-test caps right-sized from 300-420s down to 60-90s
- Provider-sensitive tests (restore matrix, chat parsing/rendering, session identity, status rail) run as a matrix over stub:claude, stub:codex, stub:opencode — not claude-only; provider-agnostic plumbing tests may run one stub
- 3-5 true end-to-end tests remain on real providers under a live tag with their own project (at least one per PTY provider currently installed); golden excludes live
- Converted golden shard total time drops by at least 50 percent vs the task_rhbf8k shard-table baseline, measured on one platform
test_plan: '1) Inventory all specs spawning real agents (spawnAgent/spawnWorker/waitForOrchestrator/waitForSingleAgent across 8 files). 2) Per test decide: convert (verifies plumbing/UI) vs keep live (verifies real provider behavior: one spawn-report round-trip, one multi-turn tool loop, one restore-resume). 3) Convert: agent_type stub + scripted transcript; keep identical final assertions; drop setTimeout caps to 60-90s. 4) Each converted spec green twice in isolation with --timeout=90000. 5) Run the converted golden shard with --global-timeout and record before/after wall-clock. 6) live project runs its 3-5 tests green once as proof.'
correctness: Oracles unchanged — only the agent transport is scripted; real-provider behavior still covered by the live shard; no test silently weakened.
