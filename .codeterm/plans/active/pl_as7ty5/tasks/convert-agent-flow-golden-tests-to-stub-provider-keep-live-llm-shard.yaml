body: 'Convert agent-flow golden tests to the runtime stub provider from task_dycecc (revision doc B.1/B.6). Preserve every oracle; only replace the LLM transport. IMPORTANT: we ship three PTY providers (claude, codex, opencode) — today golden effectively exercises claude only. Where the oracle depends on provider-specific output shape (restore matrix, ChatView parsing/rendering, session identity, status detection) the converted test runs the provider MATRIX over the three stub emulations; pure plumbing tests (pane lifecycle, focus, cross-pane wiring) may use a single stub. Keep a minimal live shard (3-5 tests, at least one per installed PTY provider) covering genuine end-to-end behavior, excluded from golden and run on its own cadence. Right-size all converted timeout caps and update the shard table budgets.'
role_guidance: 'You are a test-author. docs/contributing/test-authoring.md is your operating charter — read it fully before writing the first test. Non-negotiables: oracle-first, red-green demo in your report, condition-waits never sleeps, agent-readiness gates, bounded everything, smoke-run every harness script against the real CLI.'
