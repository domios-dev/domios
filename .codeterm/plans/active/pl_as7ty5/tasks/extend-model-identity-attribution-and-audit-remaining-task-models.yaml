body: Extend the bounded 1.7.2 provider/model identity regression to trace and preserve planned task routing model, requested launch model, catalog-resolved model, actual runtime session model, pane metadata, worker report, and fallback reason as distinct provenance fields. Audit every remaining pending, blocked, in-progress, and in-review task model against discovered provider catalogs; flag stale/unavailable/unverified assignments and record an explicit remediation or validated retention. A requested model must either run with matching runtime identity or surface a structured fallback/error; planned/task model, pane metadata, and spawn output alone are never evidence. Do not route production lanes to unverified gpt-5.6 variants. Preserve supported fallback models and capability-based provider boundaries; do not encode pricing. Own only provider launch/identity reporting and focused fixtures discovered by trace, avoiding task_llrfpe plugin snapshot/cache ownership and task_e7mes1 General Agent runtime ownership.
role_guidance: 'You are a provider-runtime identity engineer. Prove planned, requested, resolved, and actual model provenance from authoritative runtime evidence, then audit each open task''s routing model. Red line: never treat pane labels or spawn text as proof, silently substitute a model, or route production to an unverified model.'
