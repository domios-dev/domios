acceptance_criteria:
- All remaining 13-canvas golden specs that reference dead world-canvas-only selectors are either converted to current mission-control flow-shell assertions or retired/deleted with a short rationale recorded. A bounded 13-canvas golden verification plan is provided and at least the touched specs pass in isolation with --timeout=30000 --global-timeout=600000. No mission-control-live visibility oracle is weakened.
test_plan: 1. Grep tests/playwright/suites/13-canvas for canvas-plan-node, spec-node, canvas-presence-pin, world-canvas, CanvasViewInner-era selectors. 2. For each touched file, run npx playwright test --config=tests/playwright/playwright.config.ts --project=golden <file> --reporter=line --timeout=30000 --global-timeout=600000, or prove it is absent from --list after deletion. 3. Run a bounded split 13-canvas golden verification shard on eight/web-mode from a warm checkout.
correctness: Preserve real current-product coverage. Do not keep tests for unmounted dead UI just to preserve line count. Do not weaken current mission-control flow shell visibility/readiness assertions.
