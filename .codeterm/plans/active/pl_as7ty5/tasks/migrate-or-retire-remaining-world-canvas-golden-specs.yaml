body: The macOS canvas gate fix proved that several 13-canvas golden specs still target the old unmounted world-canvas surface (CanvasViewInner/canvas-plan-node/spec-node/presence). Triage the remaining world-canvas family one file at a time. Convert tests whose user-visible intent maps cleanly to the current mission-control flow shell; delete or remove from golden tests whose only coverage is dead UI with no product equivalent. Do not restore CanvasViewInner unless the product owner explicitly asks for that surface back.
