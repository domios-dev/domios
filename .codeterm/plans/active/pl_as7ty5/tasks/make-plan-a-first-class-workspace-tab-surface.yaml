body: 'Implement the Plan control as a first-class button/virtual tab directly under each workspace row, visually alongside workspace tab entries. Clicking opens the authoritative Plan surface for that workspace without creating a Pane-backed or Workspace.tabs entry. The visible list is cumulative: include every authoritative plan under the workspace root''s .codeterm/plans and every plan owned by a nested project root/directory beneath that workspace root, regardless of the nested folder holding the sidecar; exclude sibling and outside-root plans. Preserve PlanIndex/PlanStore as authority. Deduplicate by plan id plus canonical sidecar path, order stably, and update the same virtual Plan surface on live plan-changed events. Own the sidebar selector/entry, authoritative plan-resolution/filtering seam, focused fixtures, and workspace Plan Playwright spec; do not create fake Pane/Workspace.tabs state.'
role_guidance: 'You are Hopper, a frontend interaction engineer. Refine the existing virtual Plan surface into a tab-level experience. Red line: no fake Pane state or duplicate plan source.'
