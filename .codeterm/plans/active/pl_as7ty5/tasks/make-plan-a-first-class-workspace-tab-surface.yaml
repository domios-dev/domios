acceptance_criteria:
- Each workspace row exposes one stable workspace-plan:<workspace_id> first-class virtual Plan button/tab that opens authoritative Plan surface navigation with no Pane or Workspace.tabs entry.
- Workspace Plan view cumulatively includes root and nested-root authoritative plans, excludes siblings/outside roots, deduplicates by plan id/canonical sidecar, orders stably, and updates live.
- Nested-root cascade, dedupe, ordering, live update, and shown sidebar button structure are covered by focused and Playwright fixtures.
test_plan: 'Oracle: authoritative PlanIndex/PlanStore fixture plus sidebar Playwright. 1. Seed workspace root A/.codeterm/plans with plans A1/A2, nested roots A/packages/p1 and A/tools/p2 with sidecars, sibling B with plan B1, and outside root C with C1; pass: A Plan surface lists A1/A2/p1/p2 only. 2. Seed duplicate plan id and canonical sidecar aliases across root/nested indexes; pass: one canonical entry per plan id/canonical sidecar and stable deterministic order across reloads. 3. Emit plan-changed for nested p1; pass: same workspace-plan:<workspace_id> surface updates in place without duplicate rows or fake Workspace.tabs/Pane state. 4. Render shown sidebar structure; pass: Plan is directly under its workspace row, visually alongside workspace tab entries, with stable data-tab-id/data-tab-kind, aria-pressed, and aria-current only when active. 5. Run focused entry/filter tests and npx playwright test tests/playwright/suites/13-canvas/workspace-plan-entry.spec.ts --config=tests/playwright/playwright.config.ts --project=golden; pass: root/nested inclusion, sibling exclusion, stable ordering, dedupe, click/navigation, and live update assertions pass. 6. Run git diff --check and scripts/check-file-sizes.sh; pass: both exit 0.'
correctness: Authoritative cumulative workspace-root ownership; no cross-root leakage; canonical dedupe/stability; live virtual-tab updates; no fake pane/tab state.
