id: task_luatne
name: Purge fixed sleeps and tighten polling across Playwright suites
type: qa
model: sonnet
model_rationale: '88 fixed sleeps across suites/helpers (hotspots: canvas-inspect x11, pin-general x8, tab-switch-latency x7, canvas-perf x6) waste 30-45s, violate the charter, and cause flake; pollMarkerInDom polls at 1000ms with 240s default and pollUntil backs off to 2000ms — late detection across 100+ marker waits adds tens of seconds.'
personality: null
personality_provenance: null
acceptance_criteria:
- Zero fixed sleeps remain in suites/ and helpers/ except explicitly justified animation/debounce waits each carrying a one-line justification
- pollMarkerInDom polling tightened to 250ms and pollUntil backoff capped at 1000ms with all dependent tests still green in isolation
- Every touched spec passes twice in isolation on the owning platform before commit
test_plan: '1) grep -rn (waitForTimeout|setTimeout\(r,) tests/playwright/{suites,helpers} -> inventory. 2) Replace each with a condition-wait (expect.poll / waitForFunction / locator waits) tied to the state the sleep was masking. 3) Tighten helpers/poll.ts backoff cap to 1000ms and fixtures.ts pollMarkerInDom polling to 250ms. 4) For each touched file: npx playwright test <file> --timeout=30000 --global-timeout=600000 --reporter=line twice, green both. 5) Final grep proves zero unjustified sleeps.'
correctness: No behavioral coverage lost; waits observe real conditions; per-file green x2 in isolation on the platform that runs that suite.
