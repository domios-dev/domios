  text: |-
    STATUS: done
    CHANGES: src-tauri/src/api/hook_routes.rs (bind_reported_session restructured: snapshot pane probe-inputs under read lock, run provider session_exists probes with NO lock held, reacquire write lock and commit via new commit_reported_session only if snapshot still current; bounded retry on race; provisional/materialized + pane-own-session + all conflict semantics preserved). Split grown test module -> src-tauri/src/api/hook_routes/tests.rs (file was 1274 lines, now 640 + 633; under 1200 limit).
    LANE SHA: 383884aa781cc72739149705b06f997cd05bb9b8 (lane/task_hsc3uw-binding-lock, pushed)
    TESTS RUN (lane-local, no compile): rustfmt --check CLEAN; git diff --check CLEAN; scripts/check-file-sizes.sh PASS (no file >1200); scripts/check-mux-write.sh PASS; scripts/check-comment-length.sh no hook_routes violation; scripts/check-blocking-in-async.sh PASS (via pre-push). Did NOT compile/run tests in cold lane per lane policy.
    GATES REQUESTED: capped Rust unit tests for the module in a warm checkout:
      scripts/test-capped.sh -- --manifest-path src-tauri/Cargo.toml --lib api::hook_routes::tests
      (includes the four materialization quadrants + new deterministic regression 'session_exists_probe_never_runs_under_mux_lock', which asserts session_exists is invoked (probe_calls>0) yet no mux read/write guard is held during the probe via try_write, and 'commit_reported_session' returns Ok(None)->retry when the snapshot (cwd/agent_session_id) drifts so a stale snapshot cannot commit).
    FOLLOWUP: Signature of bind_reported_session changed from &mut MultiplexerState to &MuxState (Arc<TimedRwLock>) so it owns the lock boundary; sole non-test caller hook_session_start updated. No behavior change to REST/hook contract.
