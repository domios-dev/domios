body: 'Fix P1 global mux lock violation in bind_reported_session. Current path calls provider session_exists recursively while mux write lock is held, which can scan Codex store via QuickJS and freeze all pane mutations. Snapshot only required pane binding/nonce state under lock, release lock, probe incoming/current materialization outside, then reacquire and commit only if relevant binding/nonce preconditions are unchanged; on race return/retry safely, never guess from global newest session. Preserve provisional-vs-materialized semantics and existing conflict behavior. Add regression/instrumented test proving session_exists is not invoked while mux lock is held plus existing four materialization quadrants. Lane only: no dev/build/broad tests; rustfmt/diff/file-size, canonical owns capped module.'
