body: |-
  Root defect: chat_start on a bound session whose JSONL does not exist yet (src-tauri/src/commands/pane.rs:394-408) returns {pending:true} and registers NOTHING — no watch, no tailer — so store materialization is invisible to the daemon and the client is forced to poll.
  FIX: the pending path registers a store-watch owned by chat_registry (same owned-thread pattern as the pane_chat tailer, with its own poll interval and a death cap like the tailer's >10-missed-polls rule): when session_jsonl_path (or provider detect) materializes, start the real tailer and PUSH the first pane-chat-msg-{pane} batch — the client needs zero retries (its Phase-1 backoff remains as a safety net). Pane session-id rotation retargets the watch daemon-side (chat_registry already keys pane->session); the stale watch must stop (no orphan threads).
  Destination: canonical feat/1.7.2-stability via lane; worker lane runs NO dev/broad builds — focused Rust tests only via scripts/test-capped.sh.
