  text: |-
    IN_REVIEW: STATUS: in_review
    CHANGES: amended ac8665681 removes the pending-store watch expiry: it now persists until registry cancellation, session rotation, or tailer promotion. The regression holds the provider path absent for >3 seconds, verifies it remains registered, promotes it, then proves one registry stop releases the one mount. sessionJsonlPath now calls try_call::<Option<String>>().flatten(), so valid JS null is not deserialized as String/logged as invalid JSON; a direct null unit test covers it.
    TESTS RUN: ./build.sh fmt-check passed; targeted rustfmt --check passed; git diff --check passed; scripts/check-file-sizes.sh --fail passed; normal light pre-push passed. No cargo/dev/test execution in this worker lane by instruction.
    GATES REQUESTED: Run one at a time from canonical feat/1.7.2-stability: TEST_CAP_SECS=90 scripts/test-capped.sh --manifest-path src-tauri/Cargo.toml --lib pending_store_watch_promotes_to_tailer_and_streams_initial_batch ; then TEST_CAP_SECS=90 scripts/test-capped.sh --manifest-path src-tauri/Cargo.toml --lib rotation_stops_stale_pending_watch_before_replacement ; then TEST_CAP_SECS=90 scripts/test-capped.sh --manifest-path src-tauri/Cargo.toml --lib session_jsonl_path_accepts_plugin_null
    FOLLOWUP: No frontend retry loop was added or retained by this backend patch. The watcher lifecycle is exclusively registry cancellation/promotion, and no provider identity is hardcoded in production code.
