    STATUS: done (bounce addressed)
    SHA: 676d41f4c (amended lane/task_kb1ncv-pw-sharding, force-pushed with --force-with-lease)

    BOUNCE FIXES:
    (1) teardownInstances kills-all-on-failure: moved lifecycle.kill(instance) INSIDE the per-instance try. A synchronous kill throw is now caught, pushed to failures, and the reverse sweep continues to the remaining instances. New unit test 'a synchronous kill failure still tears down the rest and surfaces': pw2 kill throws -> proves killed==[pw2,pw1] (both kill attempts made), asserted==[pw1] (pw1 still assertStopped; pw2 skipped after its kill threw), and AggregateError carries the pw2 kill failure. Existing assert-failure test still green.
    (2) Comment discipline: removed the two multi-line JSDoc blocks over buildDevInstanceEnv and devInstanceTeardownPorts (default no-comments; names carry meaning), and reduced the teardownInstances doc to a 2-line // WHY (reverse order + per-instance-failure isolation). Verified: only comment lines added to dev-instance.ts are those 2 lines.

    CHANGES since 0a4bb84e0: tests/playwright/helpers/dev-instance.ts (+kill in try, comments trimmed), tests/playwright/helpers/dev-instance.test.ts (+1 test). +31/-12.

    TESTS RUN (lane-local, no daemon/build/browser):
