id: task_kb1ncv
name: Multi-instance parallel Playwright sharding on one machine
type: implementation
model: opus
model_rationale: workers:1 is the structural ceiling — all tests share one daemon and UI focus. CODETERM_INSTANCE already gives each dev daemon its own data dir and port; pinning one Playwright worker per instance yields true same-machine parallelism once restart tests are isolated.
personality: null
personality_provenance: null
acceptance_criteria:
- Harness can boot N gated dev instances (CODETERM_INSTANCE=pw1..pwN, distinct ports) and each Playwright worker is pinned to exactly one instance for its whole lifetime
- A 2-worker run of two disjoint deterministic shards passes with zero cross-instance interference and measurable wall-clock reduction vs serial
- 'All instances are provably dead after the run: no orphan daemons, ports freed'
test_plan: '1) Extend helpers (dev-console/api-client/global-setup) to resolve port and token per worker from instance env. 2) Config: workers N with a worker-scoped fixture binding workerIndex to instance. 3) Proof run on one remote machine: shards 06-mem+11-api vs a 13-canvas subset in parallel (2 workers), both green, wall-clock less than serial sum. 4) Post-run: netstat shows no listener on instance ports; no codeterm dev processes remain. 5) Serial mode workers:1 still works unchanged for golden default.'
correctness: No shared state across workers — each instance owns data dir, port, UI page; teardown always reached even on failure; prod untouched.
