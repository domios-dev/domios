  kind: status_update
  text: |-
    STATUS: done
    SHA: 0a4bb84e0 (branch lane/task_kb1ncv-pw-sharding, pushed)

    CONTRACT: The N worker-scoped CODETERM_INSTANCE slot infra (distinct data dirs / API+Vite+CDP ports / per-instance token via own data dir; per-worker pinning via TEST_PARALLEL_INDEX; per-slot cargo target dir on Windows N>1; serial workers=1 unchanged) already exists on feat/1.7.2-stability. This task's outstanding deliverable was the missing fake-job/unit coverage for env routing and teardown, which lived inline in private, un-testable, effectful functions.

    CHANGES (5 files, +234/-43):
    - dev-instance.ts: extracted pure helpers buildDevInstanceEnv (per-slot CODETERM_INSTANCE/ports/datadir/token-dir/CARGO_TARGET_DIR/CDP arg), devInstanceTeardownPorts, and teardownInstances (reverse-order, injectable kill/assertStopped, kills-all-on-failure + AggregateError).
    - dev-console.ts: bash() now uses buildDevInstanceEnv; assertDevConsoleStopped uses devInstanceTeardownPorts; exported windowsCleanupArgs for prod-safety scoping test. Behavior-preserving mechanical extraction.
    - global-setup.ts: both teardown paths (setup-failure and returned cleanup) route through teardownInstances.
    - dev-instance.test.ts: +8 tests (env routing per slot, disjoint slots + private cargo dirs, serial/non-win cargo fallback, no-mutation, teardown ports never prod, reverse-order teardown, deterministic teardown-on-failure).
    - dev-console.test.ts: +1 test (windows cleanup plan scoped to instance identifier/name, never 7685/7686).

    TESTS RUN (lane-local, no daemon/build):
    - npx tsx tests/playwright/helpers/dev-instance.test.ts  =>  12/12 pass (includes all new env-routing + teardown fake-job tests).
    - npx tsx tests/playwright/helpers/dev-console.test.ts  =>  BLOCKED in this cold lane worktree: node_modules absent, @playwright/test not resolvable. Pre-existing condition (baseline dev-console.test.ts already imports dev-console -> @playwright/test); NOT a regression. Runs in a warm checkout.

    GATES REQUESTED (warm QA checkout with node_modules installed):
    - npm run test:unit    (runs scripts/ts-unit-tests.sh -> npx tsx over all helper *.test.ts, incl. the new dev-console.test.ts scoping test)
    - npm run lint         (biome; unavailable in cold lane, no node_modules)

    CANONICAL PROOF (QA-owned; I did NOT run these - red line respected, never started multiple real builds, never touched prod 7685):
    - Real two-instance timing proof: CT_E2E_WORKERS=2 npm run test:pw:golden  (or CT_E2E_WORKERS=2 playwright test -c tests/playwright --project=golden) on a warm integration checkout, asserting two isolated pw1/pw2 dev instances run in parallel on disjoint ports/data dirs.

    FOLLOWUP: Extraction is behavior-preserving; the real Playwright run path is unchanged. dev-console.ts static typecheck/lint also needs the warm checkout (no node_modules in lane).
