body: 'Break the workers:1 ceiling (revision doc B.3): teach the Playwright harness to run N workers, each against its own env-gated dev instance (CODETERM_INSTANCE, own port and data dir), with restart tests already quarantined by task_cgoixr. Deliver the harness change plus a 2-worker proof run with timing evidence. Serial golden remains the default until platform owners adopt N-worker runs.'
role_guidance: 'You are a test-author with infra scope over tests/playwright/helpers. docs/contributing/test-authoring.md is your charter. Red line: never touch prod 7685; every spawned instance uses CODETERM_INSTANCE with its own port and is torn down by the harness; a leaked daemon is a failed task.'
