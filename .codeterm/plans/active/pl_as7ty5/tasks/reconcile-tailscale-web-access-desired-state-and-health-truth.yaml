body: 'Implement the backend web-access/Serve reconciliation snapshot chosen by gate_bxfzf4. Own and verify src-tauri/crates/codeterm-mesh/src/serve_setup.rs; src-tauri/crates/codeterm-mesh/src/manager.rs; src-tauri/crates/codeterm-mesh/src/peer_services.rs; src-tauri/crates/codeterm-mesh/src/lib.rs; src-tauri/src/commands_mesh.rs; src-tauri/src/api/network_routes.rs; src/lib/webAccess.ts only for the backend contract boundary if required. Discover bundled/system Tailscale binaries; handle client/server skew and version-aware syntax; preserve existing routes; choose/report a free port; reconcile desired route idempotently; classify Ready, Setup required/operator_bootstrap_required, Conflict, Unhealthy; verify HTTPS/MagicDNS URL with local API health and daemon-version/build comparison; support disable/reset without destroying unrelated routes. Ubuntu evidence: serve {} and 443 free but non-root Serve denied until sudo tailscale set --operator=rollacode. Mac-Air evidence: existing 443->7685 and 8443->7686, HTTPS health 200, CLI/daemon version skew. rollacode-bot evidence: bundled binary, existing routes preserved, 7685 URL health 200, daemon skew. Dependencies: task_zl68wp accepted/closed; frontend task depends on this snapshot contract. Branch/worktree lane/web-access-serve-reconciler at D:/Developer/codeterm-worktrees/web-access-serve-reconciler from origin/develop. Report STATUS in_review with exact files, snapshot schema, route diff, platform command/output, health/version result, and no-overwrite evidence.'
role_guidance: 'You are Lamport, a cross-platform Tailscale desired-state and health-contract engineer. Reconcile without overwriting existing routes, expose truthful operator/health/version/conflict state, and keep elevation explicit. Red line: false Ready, destructive route replacement, password handling, or unsupported CLI syntax fails.'
