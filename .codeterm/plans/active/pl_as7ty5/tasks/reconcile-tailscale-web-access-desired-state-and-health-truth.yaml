name: Reconcile Tailscale Web access desired state and health truth
type: implement
model: gpt-5.5
model_rationale: 'Routing rationale: bounded backend desired-state reconciliation using verified mesh/serve sources and real Ubuntu/Mac observations; gpt-5.4 is appropriate.'
personality: Lamport
