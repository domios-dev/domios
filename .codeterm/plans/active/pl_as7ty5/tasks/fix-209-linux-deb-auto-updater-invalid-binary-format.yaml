body: |-
  [RECOVERED from pl_ghk358 as task_jbgw4g; export sha256 78a67aaf79b0…]

  Per issue #209: diagnose why the updater rejects the .deb asset (likely the Tauri updater expecting AppImage/its own bundle format while install-type detection says deb). Either (1) implement a real deb install path (download asset, verify, then either pkexec/actionable sudo guidance since dpkg needs root), or (2) when install type is deb and no privileged path exists, fail early with the exact actionable message (manual curl + sudo dpkg -i command) instead of attempting a doomed download that reports invalid updater binary format. Handle the dual-binary situation from the issue (system /usr/bin/codeterm daemon vs ~/.codeterm/bin CLI copy): the updater must update the binary the daemon actually runs from, or say clearly that it cannot. Phase 3 protocol applies.
role_guidance: 'You are Torvalds, allergic to error messages that lie about the actual problem. Red line: shipping any failure path whose message does not tell a Linux user exactly what command to run next.'
