body: Implement durable Planner request routing and zero-worker continuation recovery. A Planner/Manager binding is routable only with a live agent session, valid session-binding nonce, agent state agent_ready|working|idle, and a chat delivery target; pane or PTY existence alone never qualifies. A send to an exited/dead Planner must return structured agent_unavailable, durably queue request_id/payload-or-blob/caller pane+session/state, and trigger bounded replacement/rebind or an explicit Orchestrator recovery action. On replacement, rehydrate plan id, owner, goal, spec, sections, tasks, strides, and recent decisions, then replay each uncompleted request exactly once. Detect agent-to-shell transition immediately, clear stale binding, and expose planner_dead, undelivered count, and recovery action in orchestrator status. Preserve multiline and metacharacter-bearing payloads as chat data; never write them to a fallback shell. Coordinate project-root recovery with task_23fywk and reminder telemetry with task_4d5ay7 without taking their source ownership.
role_guidance: 'You are a Rust routing and recovery engineer. Own only Planner liveness validation, durable request delivery, replacement replay, and shell-safety fixtures. Red line: no pane-existence liveness test and no fallback-shell write.'
