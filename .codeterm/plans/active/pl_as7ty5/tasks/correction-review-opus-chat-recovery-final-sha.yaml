  text: |-
    STATUS: done
    VERDICT: ACCEPT (all three chat-recovery corrections)

    SCOPE: read-only review of feat/1.7.2-stability @ 90041c73f, three corrections only.

    (1) Watcher registration authority/lifecycle — ca8b4b56f
      store_watch.rs:22-44,67-96 PendingStoreWatch gates promotion behind promotion_authority(AtomicBool).
      register() sets authority=true (Release) ONLY after chat_registry.insert() returns true; the poll thread
      loads authority(Acquire) at store_watch.rs:89 and declines promotion (continue) until then. insert()==false
      (raced usable tailer) shuts down the pending handle (registry.rs:81) so no orphan and authority stays false.
      Ordering (insert -> authority store, authority load -> replace_if_current) closes the old lost-promotion race.
      pane.rs:419 uses handle.register(&svc.chat_registry). Regression: tailer_tests.rs
      pending_store_watch_needs_registration_authority_before_promotion is deterministic (store_seen/authority_rejected
      channels) and proves decline-before-register then promote-after. CORRECT.

    (2) One-listener / no-polling / composer persistence / early rapid SID rotation — fea9578ef
      useChatSession.ts: single pane-chat-msg listener effect (305-357); attach effect (359-396) captures
      generation and bails on attachGenerationRef.current!=generation (370,384) so a stale/superseded chat_start
      cannot clobber state; rotation effect (398-411) coalesces via rotationTimerRef guard and now fires regardless
      of attachmentState (removed idle/attaching gate) so an EARLY rotation before first attach re-targets latest sid;
      setStructured(null) only on paneId change (319), not on rotation -> messages/composer persist; rotate reads
      agentSessionIdRef.current (latest). Regressions T6/T7/T8 assert coalesce-to-latest (sid-3), stops==0 &&
      unlistens==0 (one listener, no churn), and no extra chat_start after 30s advance (no polling), across idle/
      attaching/failed states. CORRECT.

    (3) session_exists outside mux lock with stale-snapshot rejection — 383884aa7
      hook_routes.rs:454-499 snapshots (cwd, prev_sid) under a scoped read guard (dropped at 464), runs
      session_exists probes with NO lock held (466-480), then takes write lock and commit_reported_session
      (505-633) which rejects (Ok(None)->reprobe) if pane.cwd/agent_session_id moved (518-521); commit consumes
      probe.new_materialized/prev_materialized, never re-probes under lock. MAX_ATTEMPTS=4 -> CONFLICT. Terminal
      rejections (nonce mismatch, cross-pane, provider) propagate via ?. Provisional-vs-materialized + pane-own +
      nonce semantics preserved (tests.rs: provisional_claim_cannot_evict_materialized_binding,
      last_provisional_claim_wins, nonce/duplicate/wrong-provider tests moved intact). MuxState =
      Arc<TimedRwLock<MultiplexerState>> so &MuxState signature is sound. Deterministic regression
      session_exists_probe_never_runs_under_mux_lock uses a provider that try_write()s during the probe and asserts
      probe_calls>0 && !lock_held. Residual: tiny TOCTOU window where a nonce-less foreign report races store
      materialization -> conservative reject, self-heals on retry (monotonic materialization); inherent to moving the
      scan out of the lock, benign, not a defect. CORRECT.

    CHANGES: none (read-only)
    TESTS RUN: none (code-only inspection lane; task forbade running tests)
    GATES REQUESTED: warm QA checkout, capped:
      scripts/test-capped.sh pane_chat::store_watch pane_chat::tailer_tests
      scripts/test-capped.sh api::hook_routes
      (frontend) node/vitest run of src/components/Terminal/useChatSession.test.ts (T6/T7/T8)
    FOLLOWUP: No dedicated test for the commit_reported_session reprobe loop (Ok(None) path); logic is simple and
      the primary out-of-lock invariant is proven — optional to add a concurrency-injected reprobe test later.
