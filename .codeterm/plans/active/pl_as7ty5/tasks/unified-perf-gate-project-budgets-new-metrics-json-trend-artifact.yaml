id: task_9im93u
name: 'Unified perf gate project: budgets, new metrics, JSON trend artifact'
type: qa
model: opus
model_rationale: Perf budgets already exist scattered across 4 specs (keystroke p95 32ms, tab-switch p95 150ms, hidden-pane re-renders max 3, longtask under 500ms) but are not a gate; making CodeTerm fly requires one fast deterministic perf project with hard asserts and trend data, run per-push on remote machines.
personality: null
personality_provenance: null
acceptance_criteria:
- 'A perf Playwright project exists containing the four existing budget tests plus new metrics: PTY write-to-render replay latency (frame-bounded), long-history opens at bottom without burst scroll, cold open to interactive, IPC starvation guard (get_config p95 under churn)'
- Every perf run emits a JSON artifact with p50/p95/max per metric under tests/playwright/artifacts/perf/ and budgets are hard expect asserts
- Full perf project completes in under 10 minutes on a remote machine using the stub provider, zero real LLM
test_plan: '1) Config: add perf project (grep @perf) to playwright.config.ts. 2) Promote and retag composer-output-performance, tab-switch-latency, and the multitab-perf pair into it. 3) New specs using helpers/canvas-perf.ts observers: PTY replay (write large buffer via panes send, measure write-to-render p95, assert frame-bounded slicing), long-transcript open lands scrolled to bottom with zero burst-scroll longtask over 100ms, cold connectUi-to-shell-interactive ms, get_config p95 while stub-agent churn runs. 4) afterEach writes the metrics artifact. 5) Full run on ROG or eight: npx playwright test --project=perf --global-timeout=600000 green under 10 min, artifact present with all metrics.'
correctness: 'Budgets assert user-perceived latency invariants: input responsive while heavy work runs, frame-bounded PTY output, bottom-anchored history open; metrics deterministic via stub provider; regressions fail the gate, not just log.'
