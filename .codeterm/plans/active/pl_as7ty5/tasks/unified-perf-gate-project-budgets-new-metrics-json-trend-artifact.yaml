model_rationale: Perf budgets already exist scattered across 4 specs (keystroke p95 32ms, tab-switch p95 150ms, hidden-pane re-renders max 3, longtask under 500ms) but are not a gate; making CodeTerm fly requires one fast deterministic perf project with hard asserts and trend data, run per-push on remote machines.
