body: |-
  [RECOVERED from pl_ghk358 as task_rr8tdo; export sha256 78a67aaf79b0…]

  Per issue #236: in src-tauri/src/api/plan_routes/tasks.rs apply lane before (or atomically with) status validation so one command carrying both succeeds; add per-plan write serialization or store-level CAS so concurrent create/PATCH cannot overwrite each other (existing CAS in plan_ops.rs covers Team plan creation only - extend the pattern to task mutations). Keep REST, socket, and CLI behavior aligned. Required regressions from the issue: (a) REST/socket/CLI twins - one command with status+lane succeeds on each surface; (b) error-contract test - diagnostics never promise a same-command op the handler rejects; (c) parallel-mutation test - 8 tasks mutated concurrently land exactly 3 todo / 1 review / 1 blocked / 3 done without retries.
role_guidance: |-
  You are Lamport. Concurrency claims require adversarial tests, not reasoning about likely schedules. Red line: a CAS or serialization claim without a test that hammers concurrent writers and asserts exact final state.
  (NOTE 2026-07-18: the plan-storage migration data loss may share territory — plan store write integrity.)
