  text: "IN_REVIEW: STATUS: in_review\nCHANGES: none; read-only audit in D:/Developer/codeterm-worktrees/release-1.7.2-integration at HEAD=origin/develop=0ba27f17dd663feec3c263e2f44923e366fb5a4e.\nBUILD/TYPECHECK/TESTS: PASS git fetch origin develop; PASS git rev-parse HEAD origin/develop; PASS gh api graphql issue snapshot for #230/#209/#203/#185/#179/#180/#184/#188/#189/#205/#206/#207; PASS targeted rg/Get-Content/git log/git merge-base ancestry checks; PASS codeterm plan state pl_as7ty5 --json; PASS codeterm plan doctor pl_as7ty5 --kind quality; PASS codeterm agent models codex; PASS codeterm pane status --pane e88e18c8; PASS codeterm pane list.\nFOLLOWUP: Evidence matrix.\nRETained implementation issues:\n- #230 https://github.com/rollacode/codeterm/issues/230 | classification: still-open design/behavior gap | original/oracle: planner-created sequencing tasks should remain pending, not look parked; oracle is plan state/canvas semantics that distinguish dependency wait from parked deferral | source evidence: docs/ORCHESTRATION.md defines parked as explicit deferral out of open-work set and codeterm-plan service treats Parked as non-open; no waiting/dependency status exists in current plan types/state/rendering | reproducibility: reproducible by inspection; no counter-evidence in origin/develop | severity/blast radius: medium UX/planner correctness, can mislead users about stalled work | next action: execution task if 1.7.2 wants planner-state change; otherwise keep open.\n- #209 https://github.com/rollacode/codeterm/issues/209 | classification: still-open Linux updater defect | original/oracle: deb install path should auto-install or fail with actionable sudo/manual message, not invalid updater binary format | source evidence: src-tauri/src/update/mod.rs detects Deb installs; src-tauri/src/update/checker.rs advertises manual dpkg command; src-tauri/src/update/apply.rs still delegates auto-install to tauri-plugin-updater download_and_install() with no Deb-specific fallback or sudo/manual branch | reproducibility: issue report remains the only runtime oracle here; source does not show a fix | severity/blast radius: high on Linux package installs; update path broken/misleading | next action: implementation on Linux host with live repro.\n- #203 https://github.com/rollacode/codeterm/issues/203 | classification: code-level fix present but closure evidence incomplete in this audit -> keep actionable until Windows oracle is rerun | original/oracle: restored panes must not spawn visible shell/conhost storm; no legacy conhost 0x4 children | source/ancestry: 671a339e, 37c2e2a, 182418218 are ancestors of origin/develop; src-tauri/pty-fork/src/win/psuedocon.rs removed std-handle use and only sets SHOWWINDOW; src-tauri/crates/codeterm-pty/src/pty/manager.rs has Windows regression tests for output and legacy conhost children; process_util no_window audit exists | reproducibility: live Windows repro not rerun in this lane | severity/blast radius: high on Windows startup with many panes | next action: QA lane on ROG to verify task-manager/child-process oracle before closure.\n- #185 https://github.com/rollacode/codeterm/issues/185 | classification: still-open intermittent UI defect with no fix evidence | original/oracle: Chat|Terminal switch and sidebar provider icons disappear together, then recover | source evidence: PaneModeSwitch still renders from src/components/Terminal/PaneTopBar.tsx; sidebar icons still come through shared tab row/HierarchyTree with tests asserting icons exist, but no commit or test references this intermittent disappearance specifically | reproducibility: not reproduced here; no fix ancestry found | severity/blast radius: medium UI/state coherence on active agent panes | next action: targeted repro + state/source capture before implementation.\n- #179 https://github.com/rollacode/codeterm/issues/179 | classification: partial code fix only; issue should stay actionable until hidden/cron skill-loading oracle is rerun | original/oracle: cron/spawned agents must load ~/.codeterm/skills without silent failure or home-wide find escalation | source/ancestry: prompts now carry mandatory mem skill lookup rules in src-tauri/prompts/general_agent.md and bridge_mem.md via ancestor cee2c93f (#206); archived plan evidence cites startup/skill-mirror hooks plus hidden cron lane with f9fedcb3, but this audit did not verify the actual ~/.codeterm/skills loader end-to-end | reproducibility: not rerun live in this lane | severity/blast radius: high for cron reliability and agent safety (home-wide find/OOM) | next action: implementation/QA lane to prove skill path resolution and bounded failure behavior.\nAdditional retained defects explicitly requested:\n- Plan tab defect | classification: resolved as design, not bug | oracle: first-class workspace Plan surface should exist without duplicating pane tabs | evidence/ancestry: 0d3a29c/4ad55e1/5746475 are in origin/develop; WorkspacePlanEntry + canvasFocusStore + workspace-plan-entry Playwright spec prove current virtual-row behavior | reproducibility: current behavior matches intended design | severity: none for closure; only follow-up is optional selector/identity polish.\n- Nested Git repository defect | classification: fixed in develop but closure should wait for narrow plugin test lane acceptance | oracle: nested/worktree repos should be discoverable without escaping bounds | evidence/ancestry: 1d580e66 feat(git): responsive panel layouts, multi-repo discovery, bubble overlap fix; 7a4098388 fix(git): bubble bound to active tab, not pane focus; worktree test; src-tauri/src/api/git_routes/tests.rs has worktrees_are_first_class_repos(); git plugin UI contains repo switcher | reproducibility: code/test evidence only in this lane | severity: medium | next action: accept Turing lane if its bounded test additions/oracle are accepted.\n- Plugin settings defect | classification: largely fixed, one stale-model refresh follow-up remains | oracle: plugin snapshot/settings surfaces must be cached intelligibly and refresh coherently | evidence/ancestry: ebe6e48ce moved network diff off hot path, 0111ad7d single-flight snapshot rebuild, action.rs owns 15s Rust cache and invalidation, ExtensionsView owns 60s channel-refresh TTL; web route mirrors snapshot off async runtime | reproducibility: yes by source/test inspection; no contradictory issue remains | severity: low-medium; remaining gap is live discovered-model refresh UX | next action: optional follow-up for models-updated invalidation, not blocker by itself.\n- Model parity defect | classification: bundled/live parity currently good; stale refresh UX remains actionable | oracle: available models should come from provider capabilities, not stale manifest guesses | evidence: plugins/provider-codex/plugin.json and codeterm agent models codex both show gpt-5.5 default, gpt-5.4, gpt-5.4-mini, gpt-5.3-codex, gpt-5.2; no gpt-5.4-nano evidence; chatModelBubbleApi and pluginProviderMeta consume available_models; provider tests cover source-bundle-live filtering/sort | reproducibility: live CLI + source agree | severity: low for parity, medium for stale refresh UX | next action: only fix frontend descriptor refresh if 1.7.2 wants live-update UX.\n- Role-routing/planner defect | classification: reproducible open correctness bug | oracle: plan state planner_resolution should not claim planner pane is not live when pane exists and is Idle | exact CLI inconsistency: at 2026-07-10T00:07:26.8577152+03:00, codeterm plan state pl_as7ty5 --json returned planner_resolution.kind=orchestrator_fallback, \bound_pane_id=e88e18c8, \reason=planner pane e88e18c8 not live; immediately after, codeterm pane status --pane e88e18c8 returned pane: e88e18c8, \title: planner ready, status: Idle; codeterm pane list also listed e88e18c8 under workspace codeterm/ship 1.7.2 | source evidence: src-tauri/crates/codeterm-plan/src/plan/peer.rs falls back whenever PaneProbe.live_agent is false, even if exists=true | severity/blast radius: medium planner routing/status truthfulness | next action: bounded fix in resolve_planner_ref semantics plus unit/service regression.\nClosed items confirmed closed with ancestry; no duplicate implementation lane should be reopened from this audit:\n- #180 CLOSED https://github.com/rollacode/codeterm/issues/180 | ancestry: a407932ef in origin/develop; archived plan evidence references restart contract/tests; no open lane here targeting #180 specifically.\n- #184 CLOSED https://github.com/rollacode/codeterm/issues/184 | ancestry: 4f10ba5f5 and 9553e89cf in origin/develop; no duplicate lane needed.\n- #188 CLOSED https://github.com/rollacode/codeterm/issues/188 | ancestry: 8edf39456 in origin/develop plus src-tauri/src/webview_watchdog.rs present; no duplicate lane needed.\n- #189 CLOSED https://github.com/rollacode/codeterm/issues/189 | ancestry: 44f47be78 in origin/develop; no duplicate lane needed.\n- #205 CLOSED https://github.com/rollacode/codeterm/issues/205 | ancestry: e36f39e84 in origin/develop; no duplicate lane needed.\n- #206 CLOSED https://github.com/rollacode/codeterm/issues/206 | ancestry: cee2c93f7 in origin/develop and prompt text present; no duplicate lane needed.\n- #207 CLOSED https://github.com/rollacode/codeterm/issues/207 | code ancestry: f9fedcb30 hidden-task delivery fix is in origin/develop, but original issue included auth-outage behavior too. Leave issue itself closed per GitHub state, but do not reopen a duplicate lane unless synthesis decides to spin a new follow-up scoped to remaining auth-outage/skill-loading evidence gaps rather than #207 itself."
