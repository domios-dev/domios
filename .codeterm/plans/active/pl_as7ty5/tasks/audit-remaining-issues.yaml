    FOLLOWUP: Corrected rows plus unchanged-row affirmation.
    CORRECTED ROWS
    - #209 https://github.com/rollacode/codeterm/issues/209 | corrected classification: fixed_needs_live_Linux_verification | ancestry/source evidence: commit 7af748f8a is an ancestor of origin/develop; src-tauri/src/update/channel.rs now routes Deb to latest-deb.json / latest-rc-deb.json / latest-nightly-deb.json; src-tauri/src/update/apply.rs resolves updater endpoints through default_endpoints_for_install_method(opts.channel, &opts.install_method) before download_and_install(). This fixes the earlier no source fix claim. Remaining reason it is not closure-complete in this lane: no live Linux .deb auto-install rerun was performed here, so the issue stays at code-fixed, live-Linux-oracle-pending.
    - Nested Git defect | corrected classification: implementation_required | exact current oracle failure: plugins/git/src/plugin.ts:495-499 still early-returns the containing repo root from git rev-parse --show-toplevel and never scans descendants inside that root; if cwd is inside a parent repo containing nested repos/worktrees, the plugin returns only the parent root. Native git_routes worktree tests and older UI commits do not satisfy this plugin oracle because the active multi-repo discovery logic for the plugin panel is still the early-return implementation in gitRepos(). Commit history on this file in origin/develop does not include a later fix beyond 1d580e66b/f1363d598 introducing the surface.
    - Plan tab defect | corrected classification: implementation_required visual/navigation identity polish | ancestry/source evidence: 0d3a29cbc, 4ad55e193, e72f13b63, and the Playwright workspace-plan-entry spec are all in origin/develop and prove the current virtual Plan row architecture is shipped. Correction: that does not satisfy the user-reported oracle that the Plan surface should read/behave like a first-class workspace tab. Current source still renders a distinct virtual row in src/components/Sidebar/WorkspacePlanEntry.tsx with separate selection logic in src/components/Sidebar/sidebarSelection.ts, not a true tab-identity surface. So architecture is present, but the reported visual/navigation defect remains implementation-required.
    - #185 https://github.com/rollacode/codeterm/issues/185 | corrected classification: fixed_needs_verification | ancestry/source evidence: commit 4fe94e589 fix: preserve agent descriptor cache during provider loads is an ancestor of origin/develop; src/hooks/useAgentProviders.test.ts explicitly says Regression for GH #185 and verifies a secondary mount does not wipe the shared descriptor cache while provider fetch is in flight; src/hooks/useAgentProviders.ts now guards syncAgentDescriptorCache(items, loading) so loading beats do not clear the cache. I did not prove the full far-end intermittent oracle from the original screenshot session in this lane, so this row is code-fixed but still needs live verification, not implementation-required.
    - #179 https://github.com/rollacode/codeterm/issues/179 | corrected classification: fixed_needs_live_cron_verification | exact implementation evidence: src-tauri/src/lib.rs seeds canonical skills and calls commands::mirror_skills_to_providers() at startup, then re-runs the mirror on contributions-changed kind=agent_provider; src-tauri/src/commands/skills.rs contains the actual mirror implementation. Commits 10a538ad4 fix: mirror canonical skills into provider dirs so agents load fresh skills (#178), d8b1cc2e2 fix: re-mirror skills on agent_provider activation, not just startup (#178), and a924c1c8d fix(skills): provider dirs hold codeterm only are all in origin/develop. The implementation detail matters: provider dirs are intentionally mirrored with exactly codeterm, while other skills remain canonical in ~/.codeterm/skills and are expected to be found through mem/prompt discipline rather than provider-dir injection. Because this lane did not run a live hidden cron/spawned-agent skill-load oracle against ~/.codeterm/skills, the row stays fixed_needs_live_cron_verification rather than closed.
    UNCHANGED-ROW AFFIRMATION
    - Keep #203 as fixed_needs_Windows_verification.
    - Keep closed issue rows unchanged: #180, #184, #188, #189, #205, #206, #207 remain closed with the previously reported merged ancestry and no duplicate implementation lane requested from this audit.
