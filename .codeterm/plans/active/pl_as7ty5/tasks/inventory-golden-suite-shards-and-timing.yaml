    # Golden Test Shard Plan — task_rhbf8k

    Static inventory only. No Playwright run. Source of truth: `@golden` grep over
    `tests/playwright/suites/**` (180 literal matches, 65 files) reconciled against
    the plan's discovery total of **183**. The +3 delta is dynamic parameterization
    in `10-restore/restore-matrix.spec.ts` (provider matrix expands one `@golden`
    title into several `--list` entries; env-tunable via `RM_PROVIDERS`). All 65
    golden files are placed in exactly one shard; the 3 dynamic cases live with
    their file in Shard C.

    Config facts (`playwright.config.ts`): `workers:1`, `fullyParallel:false`,
    base `timeout:90s`, `golden` project override `timeout:300s`, `expect:10s`,
    `retries:0`. Serial per machine — sharding here means routing whole files to
    one of three physical machines, each running its shard serially. Do NOT split
    a `.spec.ts` file across shards (shared describe/fixture state).

    Platforms: `eight` = macOS (web-mirror Chromium @7686), `ROG` = Windows
    (native WebView2 over CDP — the only faithful PTY / terminal-DOM / native-render
    path), `ubunta` = Linux (web-mirror Chromium). Native-DOM/PTY-sensitive shards
    belong on ROG; web-mirror UI shards run on eight/ubunta. Visual-baseline shards
    (canvas) must be pinned to ONE platform to avoid font/render drift — pin to eight.

    ## Shard table (14 shards, 183 tests, each file once)

    | Shard | Files / group | Suite dirs | ~Tests | Risk class | Per-test budget | Recommended platform order |
    |---|---|---|---|---|---|---|
    | **A — api-core** | `11-api/api-core.spec.ts` | 11-api | 9 | Deterministic API (low) | 120s | eight ✅DONE (9 pass/1.6s) → any |
    | **B — mem+cron** | `06-mem/mem-core.spec.ts`, `07-cron/cron.spec.ts` | 06,07 | 8 | Deterministic + 1 real-run cron (med) | 300s | ROG 1st → eight/ubunta |
    | **C — mux+restore** | `02-multiplexer/multiplexer.spec.ts`, `10-restore/restore-matrix.spec.ts` | 02,10 | 7 (3+~4 param) | Stateful kill/restart, PTY restore (high) | 300s | **ROG** (native PTY fidelity) |
    | **D — agents (stub matrix)** | `03-agents/agents.spec.ts`, `03-agents/cross-pane-chat.spec.ts` | 03 | 13 | Stub provider matrix, terminal-DOM/ChatView reads (high) | 90–150s | **ROG** (native terminal DOM/PTY) |
    | **E — mesh** | `04-mesh/mesh.spec.ts` | 04 | 2 | Stub-peer network convergence/hysteresis (med) | 420s | ROG 1st (fast harness check) → any |
    | **F — web core** | `12-web/web.spec.ts`, `web-parity.spec.ts`, `web-access.spec.ts` | 12-web | 17 | Web-mirror UI parity (med) | 300s | eight / ubunta |
    | **G — web net/perf** | `12-web/network-primitives.spec.ts`, `multitab-perf.spec.ts`, `tab-switch-bounce.spec.ts` | 12-web | 10 | Web-mirror timing/perf sensitive (med) | 300s | ubunta / eight |
    | **H — web media+mesh-ui** | `12-web/mesh-web-ui.spec.ts`, `chat-image-paste.spec.ts`, `voice-indicator.spec.ts`, `voice-warm-mic.spec.ts` | 12-web | 11 | Web-mirror media/mic + mesh UI (med) | 300s | ubunta / eight |
    | **I — canvas A (plans/visual)** | `13-canvas/plan-header-mobile.spec.ts`(8), `visual-regression.spec.ts`(5), `plan-done-heavy.spec.ts`(3), `plan-detail-overlay.spec.ts`(3), `plan-card-metadata.spec.ts`(3), `plan-view-mode.spec.ts`(2), `workspace-plan-entry.spec.ts`(1) | 13-canvas | 25 | Visual-baseline drift (high, platform-pinned) | 300s | **eight only** (baseline owner) |
    | **J — canvas B (worlds/nav/misc)** | `13-canvas/` remaining 22 golden files: `canvas-reconnecting-banner`(2),`canvas-plan-document`(2),`mission-control-flow`(2) + 19×1: `canvas-section-zones,-nav,-calm-ux,-section-agent,-multiview-overflow,-layout-integrity,-presence,-perf-baseline,-zoom-drift,-worlds,-visual-sweep,-worlds-v3,-worlds-v2,-task-titles,-working-points,-tag-filter,figma-acceptance-fixtures,quiet-tab-chrome,canvas-spec-plan-link` | 13-canvas | 25 | Canvas render/interaction (med-high, pin) | 300s | **eight only** (same baseline platform) |
    | **K — chat-view** | `16-chat-view/` all 10 golden files: `tool-output-cards`(3),`chat-rendering`(3),`chat-plan-links`(2),`composer-output-performance`(2),`watcher-pane,composer-focus-steal,send-on-fresh-pane,chat-picker-default,opencode-assistant-replies,cursor-new-rebinds-session`(1 each) | 16-chat-view | 16 | Web-mirror UI + 1 real-agent (opencode) (med) | 300s | ubunta / eight |
    | **L — ui-misc** | `18-reorder/reorder.spec.ts`(4), `18-reorder/pin-general.spec.ts`(3), `15-extensions/extensions.spec.ts`(3), `14-memory-ui/memory-panel.spec.ts`(2), `13-settings/settings.spec.ts`(1) | 18,15,14,13-settings | 13 | Deterministic web UI (low-med) | 300s | ubunta 1st → eight |
    | **M — web-stability** | `19-web-stability/web-stability.spec.ts`(16), `tab-switch-wake-resync.spec.ts`(1) | 19 | 17 | Mesh/web-stability convergence (high) | 300s | ubunta / eight |
    | **N — new-session picker** | `20-new-session/picker.spec.ts` | 20 | 17 | Web UI + orchestrator/pair real-spawn (med-high) | 300s | eight / ubunta |

    **Column totals:** 9+8+7+6+2+17+10+11+25+25+16+13+17+17 = **183** ✅

    Files with zero `@golden` (excluded, not in any shard): `01-smoke/smoke.spec.ts`,
    `17-open-shell/lmstudio.spec.ts`, and canvas non-golden files (`canvas-perf`,
    `canvas-ux1-schematic`, `canvas-visual`, `_diag`, `tab-switch-latency`).

    ## Q3 — fast first shard already run on macOS
    **Shard A (`11-api/api-core.spec.ts`)** — 9 passed in 1.6s on `eight` (macOS).
    Deterministic REST/PTY-echo, no real LLM, 120s cap. Confirmed green; do not re-run.

    ## Q4 — recommended next first-shards
    - **ROG (Windows) first → Shard E (mesh, 2 tests)**, then Shard B, then the long
      native shards C and D. Rationale: mesh uses stub peers (no real LLM), converges
      fast, and validates the Windows CDP/WebView2 harness + daemon adoption before
      committing ROG's serial queue to the 420s agent/PTY shards that only ROG can
      faithfully verify. Reserve C and D for ROG since they need native terminal-DOM/PTY.
    - **ubunta (Linux) first → Shard L (ui-misc, 13 tests)**, then G/H/M/K. Rationale:
      reorder/settings/memory-ui/extensions are deterministic web-mirror UI with no
      real-agent dependency — fastest way to warm Chromium web-mirror + confirm the
      dev token/CDP path on Linux before the longer web-stability/picker shards.

    ## Routing summary (parallel across 3 machines)
    - **eight (macOS):** A ✅ → I → J (canvas baseline owner) → F → N
    - **ROG (Windows native):** E → B → C → D  (all native-PTY / terminal-DOM work)
    - **ubunta (Linux):** L → G → H → M → K

    Serial-within-machine (workers:1). Canvas visual shards (I,J) are pinned to eight
    so baselines stay on one render platform. Agent/restore/mux (C,D) are pinned to
    ROG because web-mirror cannot validate native PTY/terminal-DOM.
