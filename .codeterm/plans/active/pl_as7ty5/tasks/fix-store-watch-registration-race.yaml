body: 'Fix P1 pre-registration promotion race in pending chat store-watch. Current spawn_store_watch starts polling before ChatRegistry insert; if the store appears before insert, replace_if_current sees no entry, kills promoted tailer, and caller inserts a dead watcher. Design explicit registration-before-promotion authority (activation handshake or equivalent) without holding registry locks across thread startup. Add deterministic regression forcing store availability before activation/registration, then prove promotion emits initial batch and registry holds a live tailer. Preserve one watch per pane/session, rotation/stop cleanup, no frontend polling. Lane only: no dev/build/broad tests; rustfmt/diff/file-size and exact test code, canonical runs capped test.'
