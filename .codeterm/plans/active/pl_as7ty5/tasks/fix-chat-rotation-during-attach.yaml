body: 'Fix rotation swallowed during idle/attaching/failed in useChatSession. previousSessionIdRef currently advances before the attachment-state gate, so a provisional-to-materialized sid arriving during initial chat_start is never acted on after state reaches awaiting_store/attached. Track pending/latest target or only advance the handled sid when scheduling/performing attach. Coalesce rapid rotations, preserve one listener, zero chat_stop/unlisten for automatic rotations, and ensure the next attach uses latest sid. Add deterministic fake-timer test for rotation while initial chat_start promise is in flight, then resolve pending and prove exactly one latest-sid resync. Preserve existing T1-T8 and no polling. Lane: focused tsx/biome only, no dev/browser/build.'
