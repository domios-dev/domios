body: |-
  [RECOVERED from pl_ghk358 as task_0mpuxk; export sha256 78a67aaf79b0…]

  Per issue #235 (crash report + backtrace in the issue): in codeterm_mesh::toggle::apply_mesh_enabled and any sibling toggle path, replace bare tokio::task::spawn with tauri::async_runtime::spawn or a stored runtime Handle (handle.spawn / handle.enter guard). Audit the mesh crate for other bare tokio::spawn calls reachable from IPC-thread contexts (rg "tokio::(task::)?spawn" across the mesh crate + mesh entry points in codeterm_lib). Add a regression test that calls set_mesh_enabled(true) from a thread WITHOUT a tokio runtime entered and asserts no panic. Follow Phase 3 protocol (sec_l7vkwa): reproduce-first, fix, red-green test, report with evidence; Orchestrator closes the issue.
role_guidance: 'You are Ritchie, a systems engineer who fixes crash classes, not crash instances. Red line: patching apply_mesh_enabled alone without auditing sibling toggle paths for the same off-runtime spawn is failing the task.'
