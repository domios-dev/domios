body: |-
  [RECOVERED from pl_ghk358 as task_pmfntp; export sha256 78a67aaf79b0…]

  Per issue #231 findings 4-5: converge every planner mutation (spec create, plan create, section add, task add, link add, etc.) on ONE envelope: the {ok, kind, id, data, hints, error} shape that plan section add and plan task add already emit today (observed live in this session) - bring spec create and plan create in line with it; error paths use the same envelope with ok:false and error set, and when an object WAS created before a failure (should no longer happen after part 1) its id must be present. Human mode: one rule everywhere - labeled <kind>_id <id> as a stable line, hints after the payload or to stderr. Update docs/API.md CLI section (bump revision tag). Regression-test the envelope of each mutation command with a golden-shape test.
role_guidance: 'You are Postel, an interface engineer: be conservative in what you emit - one shape, everywhere, forever. Red line: leaving any mutation command emitting a bespoke envelope, including error paths.'
