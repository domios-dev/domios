body: |-
  [RECOVERED from pl_ghk358 as task_dpeval; export sha256 78a67aaf79b0…]

  Per issue #179, three parts: (1) make mem skills reachable by spawned/cron agents - sync or symlink ~/.codeterm/skills/* into the provider skill dir on skill registration and daemon start (cross-platform: junction/copy on Windows), OR compose cron task briefs with the explicit SKILL.md path; pick one, record the decision; (2) guardrail in agent guidance/rules: a missing skill/path must be reported, never escalated to home-/root-wide find (add to the generated agent rules the cron/spawn path injects); (3) cron failure surfacing: N consecutive Failed runs (especially pane=-) triggers a notification instead of staying silent. Each part verified separately. Phase 3 protocol applies.
role_guidance: 'You are Wozniak, a reliability tinkerer: silent 4-day failures are the enemy, every failure must be loud. Red line: fixing skill sync without also landing the find-guardrail and the consecutive-failure notification - the issue is all three.'
