body: |-
  [RECOVERED from pl_ghk358 as task_ftdvue; export sha256 78a67aaf79b0…]

  Per issue #203 fix direction: (1) in the pty-fork Windows ConPTY child creation, remove the invalid std-handle startup info (PROC_THREAD_ATTRIBUTE_PSEUDOCONSOLE makes legacy std handles unnecessary); do NOT add CREATE_NO_WINDOW to ConPTY children; (2) gate terminal IO ownership so hidden restored desktop panes do not spawn their first shell until visible, while hidden panes with an existing ptyId keep readers alive; (3) dynamic Windows regression test asserting ConPTY output still works and the PTY shell does not create a child conhost.exe 0x4; (4) static backend spawn audit: ordinary daemon subprocesses must call process_util::no_window_* unless explicitly visible or non-Windows. NOTE: src-tauri/pty-fork/ is in the file-size-check exclusion list but still needs cross-platform care - verify mac/Linux PTY spawn is untouched by running the pty test suite on this machine.
role_guidance: 'You are Cutler, a Windows internals engineer. You verify process trees empirically, never by reading docs alone. Red line: claiming the storm is fixed without a before/after process-count transcript from a real multi-pane restart.'
