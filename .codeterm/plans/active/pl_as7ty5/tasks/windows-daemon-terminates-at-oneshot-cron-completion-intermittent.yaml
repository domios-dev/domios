  kind: evidence
  text: ' ROG root-caused daemon death with cdb: std::process::abort from interprocess CannotUnwind drop during named-pipe JSON-RPC response write after cron_complete killed its own child CLI client via close_pane/TerminateJobObject. Job-object daemon-membership theory disproven. Fix in src-tauri/src/service/cron.rs defers close_pane, oneshot delete, and emit by 250ms so the socket response reaches the cron-complete CLI before its pane tree is killed. Verified 5/5 focused restart-project oneshot runs and 3/3 API-only repro survives after fix; before fix API-only repro died 3/3. Commit 4d75255c local on ROG, push requested before close.'
