body: 'Diagnose and fix the intermittent Windows daemon termination at oneshot cron completion. Full evidence chain gathered on BLACKSTAR-local repro (2 deaths / 4 completions, two full restart-project runs + one standalone survivor + one full-run survivor) and on ROG (same signature during Windows restart-project verification). Death is TerminateProcess-class: instant, all threads, nothing logged, no WER dump. Harness exonerated: gateway job logs account for every harness kill; none coincide with the death. Correlates with recently restarted daemon and concurrent hidden-agent ConPTY spawn ~2s before the fatal ConPTY teardown.'
role_guidance: 'You are a Rust engineer on the daemon runtime and codeterm-pty. This is native-level debugging: instrument, capture the terminator, fix the mechanism — no speculative patches. Red line: the fix must be justified by an observed terminator identity or captured native failure, not by a theory that merely sounds plausible.'
