model_rationale: 'GitHub #233: codeterm service show --json panics on BrokenPipe when the downstream consumer exits early, unlike standard Unix CLIs. GitHub #234: service add --json returns a bearer-like push token even when push is disabled, leaking it into scrollback. Same command family, both bounded.'
