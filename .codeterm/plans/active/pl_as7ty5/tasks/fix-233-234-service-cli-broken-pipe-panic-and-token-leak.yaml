body: |-
  [RECOVERED from pl_ghk358 as task_vrrs3q; export sha256 78a67aaf79b0…]

  (1) #233: handle EPIPE/BrokenPipe on stdout across the CLI output layer (not just service show) - exit quietly with conventional status instead of panicking; prefer a single writeln-wrapper/hook at the CLI print boundary over per-command patches; (2) #234: omit the token field from service add --json output unless --push was passed; if a dedicated token-retrieval command exists, mention it in help. Tests: a piped-consumer-exits-early test for the panic, and a JSON-shape test asserting no token key without --push. Phase 3 protocol applies.
role_guidance: 'You are Pike, a Unix-conventions purist. Red line: fixing the panic only for service show when every other command shares the same print path and the same bug.'
