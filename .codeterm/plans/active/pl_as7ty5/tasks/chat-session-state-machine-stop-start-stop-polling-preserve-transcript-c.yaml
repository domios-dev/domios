body: |-
  Structural fix for the prod churn on pane e3fa0754: useChatSession models retry as effect-restart — restartToken and agentSessionId sit in the deps of the ONE effect owning subscription + chat_start (src/components/Terminal/useChatSession.ts:259-323), so a bound session with no JSONL loops cleanup(chat_stop+unlisten) -> re-listen -> re-chat_start every 1s forever, resetting loading/visibleMessageCount/clientOrder each cycle; PaneSessionChat's 'if (loading) return Loading chat…' early-return unmounts the composer every cycle.
  FIX (client only, 2 files): (a) split the effect — pane-chat-msg subscription keyed [paneId, active] ONLY, alive for the pane's lifetime; chat_start becomes a ref-guarded async request. (b) explicit reducer machine starting -> attached | awaiting_store | failed; keep the hook's return surface (loading = first-start only; recovering = awaiting_store). (c) pending -> stay subscribed, NO chat_stop, NO re-listen; re-invoke chat_start only with exponential backoff 1s,2s,4s,8s cap 15s; never touch loading/visibleMessageCount/clientOrder on retries. (d) agentSessionId out of effect deps: rotation while awaiting_store updates a ref the next retry reads; rotation while attached = one bounded resync (single chat_start; mergeById merge path already exists at :298-306; transcript preserved). (e) PaneSessionChat: loading early-return only before first settle; composer stays mounted through awaiting_store (recovery banner in the message area; boot covered by ChatSetupState). (f) manual reconnect (retry / CHAT_REATTACHED_EVENT) keeps full stop+start — user-initiated, bounded.
  Destination: canonical feat/1.7.2-stability via lane; worker lane runs NO dev/broad builds — focused unit/component tests only.
