body: 'Andrey: the golden Playwright suite uses the stub transport and never exercises real template spawns, so real-launch bugs (orchestrator-pair bare-shell w6v9dt, REM shell-drop kkpmdi) slipped through. As we add new command/template TYPES (not just claude/codex), each spawn must be gated on the REAL launch path, treated as emergent behavior: assert the spawned surface actually comes up (agent process live, first chat message arrives, no bare shell, follow-ups delivered). Build on hp9204''s @live real-pair-launch gate: generalize it into a per-template-type spawn smoke (orchestration pair, single agent, and a slot for future command types) that runs on real launch (stub disabled), with a bounded manual fallback where a live provider is required. Also wire the chat-empty ''setting up'' loading state (sibling UX task) so the spawn oracle can key on first-message-arrival, which is the same signal the UI uses.'
