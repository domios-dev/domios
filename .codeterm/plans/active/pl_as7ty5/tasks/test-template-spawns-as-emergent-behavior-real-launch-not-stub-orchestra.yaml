acceptance_criteria:
- Each template/command spawn type has a real-launch (stub-disabled) gate asserting the surface comes up (process live, first message arrives, no bare shell)
- Adding a new command type requires adding its spawn smoke — documented as the contract
test_plan: |
  1) Inspect tests/playwright/suites/20-new-session/picker-live.spec.ts and existing spawn helpers; extract a reusable stub-disabled real-spawn smoke matrix for template types: orchestration pair and single agent, with a future command-type slot documented.
  2) Add or adjust tests only in tests/playwright suites/helpers. Every new or edited title must pass alone first with: npx playwright test <file> -g "<exact title>" --project=live --timeout=30000 --global-timeout=600000 --reporter=line --trace=on.
  3) Required oracle per template: returned pane ids exist, provider process/session materializes through status/chat, first visible chat/setup message arrives or setup loading state is visible until it arrives, no bare shell prompt remains, and pair follow-up is delivered for orchestration pair.
  4) Do not run broad golden/full; no dev/build ownership in worker lanes. Stop at clean patch/commit plus exact verification commands and artifacts for integration QA.
correctness: Real spawn paths must be gated; the stub suite is blind to launch regressions by design
