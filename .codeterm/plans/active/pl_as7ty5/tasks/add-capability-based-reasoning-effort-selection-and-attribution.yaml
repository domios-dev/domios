body: Add first-class, provider-capability-based reasoning-effort selection for agent spawn and plan task dispatch. CodeTerm currently passes only a model selector; Codex exposes effort through an interactive model picker and the CLI rejects scripting that picker. Introduce a provider capability descriptor for supported effort levels and launch/switch semantics; expose discovered levels in CLI/API/UI; accept an explicit reasoning-effort at task routing and dispatch; preserve planned/requested/resolved/actual effort provenance on task, execution attempt, pane/session, and report; and reject unsupported combinations structurally rather than silently falling back. Keep model identity ownership coordinated with task_korvfm but do not duplicate its requested-versus-actual model fixtures. Support providers by capabilities, never provider-id branching. Own the minimal CLI, service/API, provider interface, and UI surfaces found during trace.
role_guidance: 'You are a provider-capability full-stack engineer. Add explicit reasoning-effort selection and provenance across routing, dispatch, runtime, and reporting. Red line: no provider-id branching, no interactive PTY automation as the generic API, and no silent unsupported-effort fallback.'
