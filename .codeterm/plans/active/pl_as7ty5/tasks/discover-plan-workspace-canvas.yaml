      PROPOSED STABLE FIRST-CLASS TAB IDENTITY/LIFECYCLE
      - Do not add a second plan store. PlanStore/.codeterm/plans remains authoritative.
      - Treat the Plan row as a first-class virtual navigation tab within the workspace, but derive it from the existing plan index.
      - Stable identity should be workspace-scoped and deterministic: virtual id workspace-plan:${workspace.id} for aggregate row; workspace-plan:${workspace.id}:${plan_id} if per-plan tab semantics are required.
      - It should not be persisted into backend Workspace.tabs[] unless the multiplexer type is explicitly widened beyond pane tabs. Current Tab requires pane_id, so storing Plan there would force fake pane ids and duplicate state.
      - Lifecycle:
        1. Plan mutation writes PlanStore only.
        2. Backend emits plan-changed { plan_id }.
        3. PlansProvider refetches index; usePlans patches/refetches full plans.
        4. deriveWorkspacePlanEntries maps index rows to owning workspace by file_path under workspace.cwd/.codeterm/plans.
        5. WorkspacePlanTreeSlot renders the stable virtual Plan row before real tabs.
        6. Click sets active workspace then calls openWorkspacePlanForEntries -> canvasFocusStore.openWorkspace({ planId? }).
        7. App renders CanvasView mode=workspace while workspaceCanvasVisible is true.
        8. Real tab activation hides/deactivates workspace canvas and tab highlight returns to Workspace.tabs[].
      - This rejects duplicate planner state: no separate planner tab table, no fake pane, no second store for plan visibility. If durable selection is needed, persist only UI nav selection (workspace-plan:${workspace.id}) in frontend/main-view state, not plan content.

