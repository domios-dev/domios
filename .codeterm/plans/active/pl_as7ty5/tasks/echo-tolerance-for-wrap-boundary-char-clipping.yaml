  [RECOVERED from pl_ghk358 as task_ybbmgs; export sha256 78a67aaf79b0…; original depends_on: task_t2uxx8]

  Separate from task_t2uxx8 (done; placeholder + suffix-gate scope). First determine WHERE the char is lost: feed a synthetic wrapped composer screen through screen_state.tail_text and compare against the vt100 grid - if tail_text clips the last column, fix extraction there (preferred: the data was on screen, return it). If the terra composer genuinely renders the clipped char away (soft-wrap indicator eating the wrap column), then add bounded tolerance in screen_contains_echo: match allowing a single dropped char at each soft-wrap boundary (e.g. compare against the expected string with wrap-column chars optionally elided, or a windowed fuzzy pass gated to wrapped multi-row matches only). Tolerance must NOT weaken short-input corruption detection: the observed_corruption_is_detected_as_missing_echo test (nset/unset case) must stay red-detecting. Use the sub-defect 3 tail from spec sec_gnk2xm as the literal fixture.
role_guidance: |-
  You are Hamming: distinguish signal loss in the channel from corruption of the message - fix the channel if the data was there. Red line: adding fuzzy matching before proving where the character was lost.
  (4th live occurrence same day: "drill;" -> "drill" at wrap column.)
