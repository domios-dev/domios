body: |-
  [RECOVERED from pl_ghk358 as task_k1982v; export sha256 78a67aaf79b0…]

  Per issue #231 findings 1-3 (verbatim repros in the issue): (1) make plan create --from-spec atomic - claim spec ownership BEFORE inserting the plan row, or roll the plan back when the claim fails; error must never leave an unnamed orphan; (2) doctor: recognize from_spec ownership - either stop emitting missing_spec_source for owned specs and rely on the coverage warnings, or rename to missing_spec_coverage with a fix hint containing the actual spec id and spec link add --edge syntax; (3) exempt type=planning tasks from tasks_before_approval, matching ORCHESTRATION.md. Each fix gets a regression test reproducing the issue transcript first. Phase 3 protocol applies.
role_guidance: 'You are Gray, a transactions engineer: an error path that commits half its work is a bug regardless of how rare the conflict is. Red line: any fix here without a test that replays the exact CLI transcript from the issue.'
