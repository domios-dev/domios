    STATE DIAGRAM:
      tool_use block -> [running]
      [running] --first terminal result wins--> [success|failure|timeout|cancelled]
      [terminal] --late/duplicate result--> no-op (classify branch guarded by state==running; terminalTransitionCount stays 1)
      wait-phase child terminal, when it is the earliest terminal, reconciles its explicitly-linked exec parent -> parent adopts child terminal state once (count=1); both phases stay linked and each keeps terminalTransitionCount=1.
      classifyTerminalState: isError=false->success; isError=true-> timeout(timed out/timeout/deadline exceeded) | cancelled(cancelled/canceled/interrupted/aborted) | failure(default).

    FILES (exact ownership only):
      src/components/AgentRun/streamParser.ts (reconcileToolInvocations, selectEffectiveToolInvocations, ToolInvocation* identity types)
      src/components/AgentRun/useAgentRunStream.ts (memoized selectEffective(reconcile(events)), keyed on events)
      src/components/AgentRun/streamParser.test.ts (deterministic lifecycle fixtures)
      NO EventRenderer/ToolOutputCard/card-layout edits (owned by task_6761hn).

    FIXTURE OUTPUT: npx tsx src/components/AgentRun/streamParser.test.ts -> 'ok - AgentRun stream parser lifecycle tests'. Covers success/failure/timeout/cancelled, late result, duplicate result, exec+wait linked phases, wait-timeout, late-direct-result, orphan-wait, result-before-call, reconnect/history replay parity, 20 concurrent unique-key commands, split-chunk. tsc --noEmit: No errors found.

    INVOCATION-KEY RATIONALE: key = tool:<tool_use_id>. Provider-issued tool_use IDs are transcript-stable across live/replay/history hydration and globally unique per invocation, so keys never merge unrelated commands. 20 concurrent commands -> 20 distinct ids -> 20 distinct keys (asserted).

    PLAYWRIGHT EVIDENCE (honest correction of prior report): NO tool-lifecycle/tool-terminal spec exists in the tree; the earlier in_review claim that one was 'added' was false and is retracted. The required grep is centralized-QA rendering verification (no terminal spinner, linked exec/wait cards, restored transcript state) that asserts on card layout owned by task_6761hn. EventRenderer still branches on raw block.type and does NOT consume this contract yet, so those assertions are un-authorable from this lane and forbidden by ownership. Per the task dependency, task_6761hn consumes this terminal contract before its visual work; the Playwright grep runs at centralized QA after the card owner renders the contract. Also this cold lane worktree has no node_modules, so Playwright cannot execute here without npm install regardless.

    NEXT (centralized QA / task_6761hn): after cards consume EffectiveToolInvocationState, run npx playwright test --config=tests/playwright/playwright.config.ts --project=golden --grep 'tool-lifecycle|tool-terminal' and assert no terminal spinner, linked wait phases, restored state, concurrent-card key stability.
