  kind: status_update
  text: |-
    STATUS: done (ACCEPT with one non-blocking MEDIUM finding)

    CHANGES: none (read-only review of feat/1.7.2-stability @ f0d1e07b7)

    SCOPE: chat recovery stack — frontend listener/attach/rotation + composer persistence (useChatSession.ts, PaneSessionChat.tsx, chatReattach.ts); daemon pending-store watcher ownership/promotion/rotation/stop (store_watch.rs, registry.rs replace_if_current/acquire/insert/stop, chat_start_core, provider.rs null path); provisional Codex binding guard (hook_routes.rs).

    VERDICT: ACCEPT. No hard blocker.

    FINDING 1 — MEDIUM (correctness / stale-state), NON-BLOCKING:
    useChatSession.ts:393 writes previousSessionIdRef.current = agentSessionId UNCONDITIONALLY, before the state gate at :398 (awaiting_store/attached). The attach effect (:359-362, deps :389) does NOT depend on agentSessionId (reads agentSessionIdRef.current; re-runs only on attachGeneration). So if agentSessionId rotates (provisional->materialized, the Codex flow this stack targets) while attachmentState is idle (initial chat_start in-flight), attaching, or failed, the rotation is swallowed: previous advances to the new sid with no requestAttach scheduled, and is never revisited (later awaiting_store/attached transition finds previous===current). Pane keeps a store_watch polling the OLD fileless sid forever; materialized sid never attached; no pane-chat-msg => markAttached never fires. No auto-recovery — only the manual Reconnect button escapes. Window is narrow (materialization must land within the initial chat_start IPC) but widens under [SLOW-IPC]/multi-pane starvation. Tests T3/T4 only rotate from stable awaiting_store/attached states, so this timing is uncovered. Fix direction: only advance previousSessionIdRef when the rotation is acted on, or remember a pending target and re-evaluate on entry to awaiting_store/attached.

    SOLID (no issues):
    - registry: replace_if_current preserves refs, no-ops on session-mismatch/dead/absent; drop(old) is stop-flag-only (no join) => no watcher self-join deadlock; acquire/insert stale-eviction + TailerHandle Drop stop-flag prevent duplicate tailers/duplicate-bubble regression; rotation-during-promotion races resolve cleanly under both lock orderings.
    - store_watch: bounded stop (flag checked each poll_interval); promoted tailer start_offset 0 + baseline-0 flatten sink => correct initial batch; refcount balanced on stop-after-promotion.
    - frontend refcount: chat_start/chat_stop split balanced — reattachPaneChat and error button both chat_stop before retry; rotation always stale-evicts so no double-count.
    - codex binding guard: provisional nonce-only claim cannot evict a materialized binding; last-provisional-wins when none materialized. Well-tested (T11 + regression).
    - provider.rs: session_jsonl_path try_call::<Option<String>>().flatten() maps plugin null->None; tested.

    RESIDUAL RISKS: (1) Finding 1 above; (2) store_watch polls unbounded (250ms) for a never-materializing provisional sid while a client stays attached — no give-up analog to spawn_tailer's 10-poll bailout; harmless CPU; (3) watcher promotion test sleeps ~5s (fine under cap, slow).

    TESTS RUN: none (read-only lane; did not build/test/dev per instructions).

    GATES REQUESTED: none required for ACCEPT. If Finding 1 is fixed, request focused vitest on useChatSession.test.ts adding a rotation-while-idle/attaching case, and capped cargo test on service::pane_chat::{registry,store_watch} — both via the repo capped runner, serialized in a warm QA checkout.

    FOLLOWUP: Recommend a fast-follow fix for Finding 1 + regression test rather than blocking this merge.
