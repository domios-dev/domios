body: |-
  [RECOVERED from pl_ghk358 as task_qfcx4i; export sha256 78a67aaf79b0…]

  The injected wire format is known-good: agent/reports.rs:94-95 emits "status: <label>" as a line followed by the free-form message, and the -=-codeterm:report ...-=- marker payload observed live carries both. So the loss is downstream; identify WHICH layer and fix there, reporting the verdict: (a) marker parsing - src/lib/chatPrefixes.ts:40-53 maps marker.payload to body with report:true (check whether a status-line extraction discards the remainder); (b) the report-card renderer - locate it via rg "report" src/components (it is NOT in ChatView/ChatView.tsx) and check what it renders besides the parsed status; (c) any backend intermediary (messenger wrap, watcher/observe) that re-emits reports structurally. Fix: AgentReport free-form message renders alongside structured fields (status chip + full multiline body) for BOTH local and mesh-relayed reports. Fixture: a report payload with status: Partial plus a multiline body (use one of the three real Curie payloads from this session). Tests: unit test on the parser layer (chatPrefixes or card model) asserting status AND body survive; Playwright assertion that a chat transcript containing the fixture renders both the status chip and body text visibly.

  BLOCK REASON: only the isolated Playwright gate remains — build.sh require_integration_owner (line 311) refuses dev from a lane; merge lane b03065045 then run the spec alone from canonical. Full globalSetup evidence was in the (lost) task body; lane tip pushed and green.
role_guidance: 'You are Wirth: data must survive every representation change intact. First find WHERE the body dies - do not patch the renderer if the parser already ate it. Red line: a fix without the layer verdict, or a test using a synthetic one-liner instead of the real multiline Curie payload.'
