  kind: status_update
  text: |-
    STATUS: in_review

    INTEGRATION (primary bounce blocker — now cleared):
    Merged feat/1.7.2-stability into lane/pane-close-report-race (merge 768018b31), then fast-forwarded feat/1.7.2-stability 90aa4e269 -> 768018b31 in the canonical checkout D:/Developer/codeterm. GATE SATISFIED: `git merge-base --is-ancestor 5daa386dc feat/1.7.2-stability` = true. The two prior bounces failed exactly this check; it now passes. FF touched only the 6 fix-delta files; the orchestrator's 15 uncommitted WIP files (.codeterm/plans/**, src-tauri/Cargo.toml) were verified non-overlapping and left intact. No new commit, no push, prod 7685 untouched, canonical dev not restarted.

    CONFLICT RESOLUTION:
    Only src-tauri/src/service/pty_io/tests.rs conflicted (test-setup only; the fix logic in commands/pty.rs and multiplexer/index.tsx auto-merged clean). The lane had refactored 3 tests to a local mutate_plan() helper + no-arg store_with_bound_task(); stability evolved store_with_bound_task(base) + update_task_lane/revert_task_dispatch. The lane's no-arg signature no longer compiles against stability's API, so I took stability's version wholesale and dropped the now-orphaned mutate_plan helper. Resolution is test-setup for active_pane_lane_base/pane_task_env, unrelated to the PTY kill path.

    CHANGES (exact files in the integrated fix, 5daa386dc):
    - src/store/multiplexer/index.tsx (closePane/closeWorkspace no longer preflight kill_pty; single backend owner = mux_close_pane/mux_close_workspace)
    - src-tauri/src/commands/pty.rs (kill_pty -> kill_pty_idempotent -> PtyManager::kill; exact missing-PTY match, idempotent)
    - src-tauri/src/service/pty_io/lifecycle.rs (ServiceContext close -> kill_live_pane_pty -> PtyManager::kill, was ::remove)
    - src-tauri/src/service/pty_io/mod.rs (test-only re-exports), src-tauri/src/socket/server/mod.rs (Debug on JsonRpcError), scripts/test-close-owner.js (regression)

    LIFETIME/SYNCHRONIZATION RATIONALE:
    Root cause was a two-owner close. Frontend closePane/closeWorkspace called kill_pty (which did PtyManager::remove — sessions.remove + log ONLY, no child.kill/wait/handle-close) and THEN mux_close_pane ran the authoritative backend close. remove() dropped the session Arc out from under the still-live reader thread + child while ConPTY handles stayed open; the second owner then found "PTY not found". Across three rapid closes with concurrent final-report delivery this is a double-drop / ConPTY handle use-after-free window. Fix collapses ownership to one path and makes every kill path go through PtyManager::kill -> begin_kill (child.kill + close reader/pair/queue + remove-from-map) -> reap_in_background (non-blocking child reap). So: terminate + close-handles + reap happen exactly once, on one owner; a repeat/unknown kill is an explicit idempotent no-op (is_missing_pty_error, narrow match that does NOT swallow unrelated errors). This removes the race and the orphan rather than masking the crash.

    DUMP/LOG CORRELATION:
    WER Application Error 2026-07-10 04:03:33 local: codeterm.exe 1.7.1.0, exception 0xc0000409 (STATUS_STACK_BUFFER_OVERRUN / __fastfail), offset 0x1808191, PID 0x27AC/10156; dump C:/Users/User/AppData/Local/CrashDumps/codeterm.exe.10156.dmp. No cdb/windbg/WinDbgX on PATH, so symbol-level offset resolution is still not possible here. src-tauri builds default panic=unwind (no panic=abort in profiles), so 0xc0000409 is an abort — consistent with a double-panic during unwind or a ConPTY handle UAF in the reader/reap path, i.e. the two-owner remove-then-close race above, not a single benign panic.

    ORPHAN PTY OBSERVATION:
    Source-confirmed. PtyManager::remove (manager.rs:516) = sessions.remove + "Removed PTY" log, no child.kill(), no wait(), no ConPTY handle close -> orphaned child + dangling reader thread. All close-path callers now route through PtyManager::kill instead; grep confirms no remaining PtyManager::remove caller in close paths (the surviving .remove( calls are on unrelated maps: agent panes, run_watcher, state_reactor, output, wake).

    TESTS RUN (this integration pass):
    - PASS: node scripts/test-close-owner.js -> "close owner regression checks passed" (closePane/closeWorkspace: no kill_pty preflight, exactly one backend close owner each), run on the integrated tree.
    - Source verification of merged commands/pty.rs + lifecycle.rs + index.tsx: fix functions present and identical post-merge.
    - NOT RUN by me: focused Rust tests (commands::pty::kill_pty_tests, service::pty_io::lifecycle::kill_pane_pty_tests, codeterm-pty pty::manager::kill*, service::hierarchy) and the 3-pane daemon oracle.

    WHY HEAVY VERIFICATION IS GATEWAY-ONLY (empirically established, not a choice):
    1. build.sh check/test/build/dev/cli/e2e are now hard-gated to the canonical stability checkout (require_integration_owner) — refused in a lane. 2. The sanctioned lane path `build.sh worktree-check` bailed: the machine build gateway is held by the canonical checkout's live `build.sh dev` (job 20260710T181451, owner D:/Developer/codeterm, pid 39758) which I must not disturb. 3. Direct capped cargo test in the cold lane hit the 90s cap DURING dependency compile (ulid/rusqlite/sha2 at ~122/137) — a cold-build timeout, not a code hang; per policy I did not raise the cap. So tests + oracle must run at the warm gateway/canonical checkout, which now already contains the fix after the ff.

    REMAINING (single gateway step, on feat/1.7.2-stability = 768018b31):
    From D:/Developer/codeterm after the current dev is quiesced:
      ./build.sh test   (or capped: commands::pty::kill_pty_tests, service::pty_io::lifecycle::kill_pane_pty_tests, codeterm-pty pty::manager::kill*, service::hierarchy::tests::dead_worker_that_already_reported_gets_no_synthetic)
      then rebuild dev and run the 3-pane close/report race oracle (spawn 3 idle/recently-reporting workers, queue final reports, `codeterm pane close <id>` sequentially/rapidly), asserting: PID stable, /api/health responsive after each + all three, each report recorded OR explicit "Pane not found" rejection, Get-Process shows no orphan child PTY, no new WER BEX64/dump.

    RISKS:
    - Fresh green from the automated Rust suite + the real daemon oracle on the integrated tree still owed at the gateway before close; my evidence this pass is integration + source + JS-regression, not a live race oracle.
    - WER offset 0x1808191 still not symbol-correlated (no debugger on PATH); root cause is inferred from the ownership graph, strong but not dump-proven.
    - ROG remote is CodeTerm 1.5.7 and is NOT a valid prod-like oracle target for a 1.7.2 build.
