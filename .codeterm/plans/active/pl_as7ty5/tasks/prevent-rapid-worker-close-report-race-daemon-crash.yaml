  kind: status_update
  text: |-
    STATUS: partial
    CHANGES: src-tauri/src/commands/pty.rs; src-tauri/src/service/pty_io/lifecycle.rs; src/store/multiplexer/index.tsx
    RATIONALE: traced close ownership across frontend closePane/closeWorkspace -> mux_close_pane -> ServiceContext::close_pane -> kill_ptys -> PtyManager::kill, plus direct kill_pty/PtyKill -> kill_pane_pty. The unsafe edge was frontend pre-close kill_pty and command/service kill helpers using PtyManager::remove, which dropped the manager entry without terminating/reaping the child. A subsequent mux_close_pane then could not find the PTY to kill, leaving orphan PTYs and widening the close/reap/report race. Fix makes normal UI close single-owner through mux_close_pane and makes direct kill_pty/kill_pane_pty call PtyManager::kill so child kill+background reap always happens.
    DUMP_LOG: WER Application Error at 2026-07-10 04:03:33 local: codeterm.exe 1.7.1.0, exception 0xc0000409, offset 0x0000000001808191, PID 0x27AC/10156. WER report at 04:03:36 references C:/Users/User/AppData/Local/CrashDumps/codeterm.exe.10156.dmp. No cdb/windbg/WinDbgX available on PATH, so stack symbol correlation not completed. Local dev log was stale (June 29) and did not contain the July 10 close/reap sequence.
    ORPHAN PTY OBSERVATION: source-level orphan confirmed: PtyManager::remove only removes the session and logs Removed PTY; it does not child.kill() or wait(). Both frontend close paths could call kill_pty before mux_close_pane, causing the authoritative close to lose the only manager handle and fail to kill/reap. Existing PtyManager::kill test confirms kill removes the manager entry and terminates child.
    TESTS RUN: PASS: CARGO_TEST_CMD='cargo test -p codeterm-pty' ../scripts/test-capped.sh -- pty::manager::tests::kill_terminates_child_and_removes_session -- --nocapture. PASS: CARGO_TEST_CMD='cargo test -p codeterm-pty' ../scripts/test-capped.sh -- pty::manager::tests::kill_returns_err_for_unknown_pty -- --nocapture. BLOCKED: cargo test -p codeterm service::hierarchy::tests::dead_worker_that_already_reported_gets_no_synthetic could not reach tests in this cold Windows lane: first missing bundled-embed, then bundled-cli, then dist Tauri resource; created repo stubs for first two only and stopped before app build. BLOCKED: pnpm exec tsc --noEmit failed because tsc/node_modules are unavailable. NOT RUN: remote isolated ROG/dev three-pane daemon oracle; visible ROG mesh instance is CodeTerm 1.5.7 and must not be used as prod-like target.
    REMOTE: codeterm identify --mesh ROG returned platform windows, version 1.5.7; pane list showed live panes. No prod 7685 touched, no dev restart/build/release packaging run.
    RISKS: service-crate compile/test and real daemon race oracle still required on prepared dev/ROG isolated instance before release. Need independent review of close/report lifecycle after remote QA.
