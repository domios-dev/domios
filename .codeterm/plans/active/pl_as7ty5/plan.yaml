  rules:
  - No worker starts cargo/build/dev directly while a machine QA/build owner exists
  learnings:
  - id: learn_oejfvf
    text: When the user forbids local builds, inspect repository pre-push hooks before publishing. If the hook runs cargo/build locally, use git push --no-verify and make the equivalent self-hosted CI workflow an explicit mandatory gate; verify no build processes remain.
    ts: 1783634304933
    tag: ci-only
  - id: learn_n6hlgf
    text: When source changes have tracked generated bundles, include the generation consistency check in the first remote CI wave before Playwright; UI gates that fail during compile/setup provide no UI oracle and must be bounced as build failures.
    ts: 1783641663649
    tag: null
  - id: learn_wjyoaz
    text: Do not treat stored heartbeat focus as evidence that timed plan reminders are armed. Verify scheduler logs and last-delivery state. Reminder cadence for an execution plan with open work must survive owner Idle-to-Working transitions; activity-specific counters and time-based deadlines require separate reset semantics and observable due/delivery telemetry.
    ts: 1783666713738
    tag: null
  - id: learn_5uudvq
    text: Milestone boundaries are execution stops, not advisory text. Before dispatching beyond a completed group, inspect pending_regression_gates and claim exactly one warm-checkout QA gate per physical machine. Worker-local broad builds do not satisfy milestone gates. If build infrastructure blocks QA, record that blocker explicitly and freeze frontier expansion until the central gate can run.
    ts: 1783666819779
    tag: null
  - id: learn_wnzo00
    text: A build-isolation oracle must not reproduce machine thrash by launching multiple full builds. Test queue serialization with fake jobs first. The machine build gateway owns one warm integration target; worktrees submit reviewed source, not dev builds. Share immutable compiler cache, never a mutable target across concurrent branches.
    ts: 1783669329904
    tag: null
  - id: learn_x3h9e7
    text: 'Review throughput is a bounded resource. Do not refill implementation lanes when in_review exceeds the accepted WIP limit or the single heavy QA gateway is unavailable. Every review must have one executable exit: close on independent acceptance, bounce atomically out of in_review, or join a named compatible centralized QA batch. Audit stale BOUNCE labels before dispatch and drain review below the threshold before reopening the implementation frontier.'
    ts: 1783677173172
    tag: null
  - id: learn_rh9tr4
    text: 'Read-only independent review tasks must not create duplicate broad regression gates. Their terminal result is evidence for the owning implementation task: ACCEPT routes that implementation into its existing compatible QA batch; BOUNCE returns it to source correction. Create a new broad gate only when the review itself changes executable surfaces or defines a distinct oracle.'
    ts: 1783678349338
    tag: null
  - id: learn_6okeef
    text: Independent review has a bounded acceptance surface. Define the oracle before review. First review may find in-scope blockers; the correction review verifies only those blockers and must not expand the threat model without new reproducible release-impact evidence. After two rounds, passing specified tests plus documented residual risk routes to integration QA; new hardening ideas become separate follow-ups. One-time cutover tools are judged against their explicit stopped-daemon/local-filesystem/operator boundary, not silently escalated to database-grade universal crash durability. Any P0 exception beyond two rounds requires an owner-recorded reason and concrete user-impact reproduction.
    ts: 1783684911556
    tag: null
  - id: learn_imkiov
    text: A passed centralized broad gate should satisfy compatible completed groups once, not create one duplicate cargo+TS+Playwright run per group. Attach the same evidence record to compatible groups and run only distinct missing surfaces.
    ts: 1783688285808
    tag: null
  - id: learn_fb60j9
    text: refresh stranded orchestrator on pane 4c17f607 (resumption never observed) — decide re-seed vs hand off
    ts: 1783691075366
    tag: refresh-stranded
  - id: learn_kno9kw
    text: For remote performance/Playwright work, require the worker to verify /api/health build_sha equals the tested commit before measuring and again after any pushed fix; otherwise metrics can describe a stale build even when the branch has advanced.
    ts: 1783776187466
    tag: null
  - id: learn_wjfrcm
    text: When a planner-owned Playwright speedup task lands partial focused evidence, immediately assign the missing platform/broad gate to a machine owner before accepting it; otherwise the task sits in_review and creates a regression-gate leak that blocks the next frontier.
    ts: 1783792491720
    tag: gate-leak
