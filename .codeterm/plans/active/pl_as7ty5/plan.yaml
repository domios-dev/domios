id: pl_as7ty5
title: General 1.7.2 plan
sections:
- id: sec_ga5tvr
  title: 'Discovery wave: evidence baseline'
  handle: discovery-wave-evidence-baseline
  tags: []
  body: "Run only from C:/Developer/codeterm-worktrees/release-1.7.2-integration, refreshed from origin/develop. Establish evidence for #230, #209, #203, #185, #179 and user-reported surfaces. Trace real workspace Plan tab/canvas state, plugin snapshot lifecycle, provider model discovery, Git discovery, version, and release paths. Record exact files, symbols, test oracles, accepted gaps, severity, and blast radius. The discovery report must classify the CODETERM_ROLE/planner-binding mismatch and any other reproducible workflow defect for the controlled loop.\r\n"
  subsections: []
  canvas:
    x: null
    y: null
    collapsed: false
  attachments: []
- id: sec_oi6846
  title: Synthesis and replanning decision gate
  handle: synthesis-and-replanning-decision-gate
  tags: []
  body: "Consume discovery evidence and cut the approved implementation, review, integration, and verification graph. Resolve the workspace Plan tab identity/lifecycle, bounded nested-repository scan policy, plugin snapshot cache ownership/invalidation, and source/bundle/live provider-model parity. Preserve pending status for dependency waiting; #230 explicitly rejects using parked as normal sequencing. No implementation task is cut before Orchestrator approval.\r\n"
  subsections: []
  canvas:
    x: null
    y: null
    collapsed: false
  attachments: []
- id: sec_rlqrqc
  title: Implementation ownership lanes
  handle: implementation-ownership-lanes
  tags: []
  body: "After approval, create disjoint fresh-origin/develop lanes for Plan workspace tab/canvas, Git multi-repository discovery, plugin settings cache/loading UX, model/provider parity, and only those open issues proven implementation-required. Every lane owns discovered files only, uses C:/Developer/codeterm-worktrees/<branch-slug> and lane/<slug>, specifies its exact test oracle and issue references, and has a Codex model selected from live discovery.\r\n"
  subsections: []
  canvas:
    x: null
    y: null
    collapsed: false
  attachments: []
- id: sec_d52ka9
  title: Integration and independent review
  handle: integration-and-independent-review
  tags: []
  body: "Integrate only develop-based branches into the clean release integration checkout. Inspect actual diffs and run focused oracles. Strong-model independent reviewers refute high-risk workspace/canvas state, plugin cache hot paths, provider boundary/session behavior, role correctness, and final integration. Broad regression runs only in the warm integration checkout; no local release packaging.\r\n"
  subsections: []
  canvas:
    x: null
    y: null
    collapsed: false
  attachments: []
- id: sec_f6g3fr
  title: UI and Playwright gates
  handle: ui-and-playwright-gates
  tags: []
  body: "Use a healthy dev instance and focused stable-selector Playwright tests for workspace Plan tabs/canvas and Plugin settings. Verify loading, error, empty, cached reopen, mutation invalidation, workspace navigation, and live planner-state update; then run the relevant golden project. State whether Windows real WebView2 or macOS/Linux web mode was exercised.\r\n"
  subsections: []
  canvas:
    x: null
    y: null
    collapsed: false
  attachments: []
- id: sec_3dtg4b
  title: Issue reconciliation
  handle: issue-reconciliation
  tags: []
  body: "Maintain an evidence row for each remaining issue through reproduction or original-oracle verification, classification, independent review, and closure recommendation. #230 remains explicit: dependency sequencing must remain pending or waiting, not appear parked. Closed #180, #184, #188, #189, #205, #206, and #207 receive no duplicate task. New reproducible defects proceed only through the bounded controlled loop.\r\n"
  subsections: []
  canvas:
    x: null
    y: null
    collapsed: false
  attachments: []
- id: sec_s5h1yl
  title: Version, PR, and release CI
  handle: version-pr-and-release-ci
  tags: []
  body: "After accepted integration and issue reconciliation, prepare version/release metadata only when discovery proves a source change is needed. Do not commit, push, tag, or publish without explicit user authorization. CI and self-hosted release machines perform build, signing, notarization, and publishing; require the GitHub CI matrix.\r\n"
  subsections: []
  canvas:
    x: null
    y: null
    collapsed: false
  attachments: []
- id: sec_i692yk
  title: Release closeout and archive
  handle: release-closeout-and-archive
  tags: []
  body: |
    Release closeout is an in-scope 1.7.2 phase. It runs only after CI publish, public updater verification, issue reconciliation, and cleanup evidence. Remove merged sibling lanes and archive only after all dependencies are complete; preserve active integration and the dirty orchestrator checkout.
  subsections: []
  canvas:
    x: null
    y: null
    collapsed: false
  attachments: []
- id: sec_h9tsba
  title: Controlled self-improvement loop
  handle: controlled-self-improvement-loop
  tags: []
  body: "Loop: reproduce -> record exact evidence, timestamp, severity, and blast radius -> admit only correctness, clarity, reliability, or release-impacting defects -> bounded regression-backed follow-up -> independent review -> update evidence -> replan or discard. Stop when the defect is disproven, out of scope, or verified. This loop cannot authorize broad refactors or visual preference churn.\r\n"
  subsections: []
  canvas:
    x: null
    y: null
    collapsed: false
  attachments: []
- id: sec_47k6nr
  title: PTY delivery guarantee — recovered phases (pl_ghk358)
  handle: pty-delivery-guarantee-recovered-phases-pl-ghk358
  tags: []
  body: 'Parent for the 14 execution phases recovered from lost plan pl_ghk358. Provenance: recovery export sha256 78a67aaf79b07838e39251ebaff501a63bc3321b6f1ebc8cc1085a7a85ef2e07. Original phase ordering and gating preserved; statuses carried over. No task under this parent closes from report volume — evidence only.'
  subsections:
  - id: sec_ulrw9o
    title: Phase 1 — Land & verify in-flight PTY delivery fix
    handle: phase-1-land-verify-in-flight-pty-delivery-fix
    tags: []
    body: |-
      The canonical checkout (this worktree) is currently dirty (uncommitted diff to submit_transaction.rs, plus unrelated in-flight files per git status). Do NOT edit or commit directly here.
      Required flow: (1) create an isolated scratch lane at `../codeterm-worktrees/<branch-slug>` (a fresh git worktree off the integration target, e.g. `git worktree add ../codeterm-worktrees/land-pty-echo-activity -b fix/pty-echo-activity-wait <integration-target>`); (2) reproduce the intended diff there — either `git -C <canonical> diff -- src-tauri/src/service/pty_io/submit_transaction.rs | git apply` into the lane, or hand-port the same change (wait_for_paste_activity, the run() no-verify-echo branch fix, the 2 new tests) — never edit the dirty canonical checkout itself; (3) run the targeted Rust test modules inside the lane; (4) commit in the lane with a message describing the behavior; (5) integrate with a REAL merge commit into the integration target (never cherry-pick/squash/patch-copy — see AGENTS.md "Lane integration preserves ancestry") and verify `git merge-base --is-ancestor <lane-tip> <target-tip>` before the lane branch/worktree is removed.
    subsections: []
    canvas:
      x: null
      y: null
      collapsed: false
    attachments: []
  - id: sec_e8prso
    title: Phase 2 — PTY audit consolidation & evidence hardening
    handle: phase-2-pty-audit-consolidation-evidence-hardening
    tags: []
    body: 'Resolve the 3 open gaps recorded in spec section sec_btbfo0: weak VerifySubmitStrategy::None tier, dead idle_after_drain param + wait_for_echo/wait_for_submit_tui_drained duplication, and missing 3+-retry regression coverage. Land as focused, independently testable commits — no behavior change without a passing test proving it.'
    subsections: []
    canvas:
      x: null
      y: null
      collapsed: false
    attachments: []
  - id: sec_wume9m
    title: Phase 3 — Issue-triage intake protocol
    handle: phase-3-issue-triage-intake-protocol
    tags: []
    body: 'Common HOW for every issue task in later phases: (1) re-read the linked GitHub issue with `gh issue view <n> --repo rollacode/codeterm`, (2) reproduce or confirm the reported state against current master/this branch before touching code, (3) implement the fix at the cited file/line, (4) add or extend a regression test that fails on the pre-fix code and passes after, (5) run the exact test command from the task''s test plan and capture output, (6) report to the Orchestrator with repro-before/fix/test-evidence. Only the Orchestrator runs `gh issue close`, after accepting the report.'
    subsections: []
    canvas:
      x: null
      y: null
      collapsed: false
    attachments: []
  - id: sec_2v3bf1
    title: 'Phase 4 — Crash & data-integrity issues (#235 #237 #236 #239)'
    handle: phase-4-crash-data-integrity-issues-235-237-236-239
    tags: []
    body: 'Highest-severity cluster: a UI-triggerable app crash (#235), an unbounded-growth hang in service list (#237), lost concurrent task-mutation writes (#236), and a broken mem CLI transport (#239). These affect daemon availability and data correctness, so they run before DX polish.'
    subsections: []
    canvas:
      x: null
      y: null
      collapsed: false
    attachments: []
  - id: sec_rblbtq
    title: 'Phase 5 — Platform & release issues (#203 #209)'
    handle: phase-5-platform-release-issues-203-209
    tags: []
    body: Windows startup shell/conhost storm (#203, fix direction already scoped in the issue) and Linux .deb auto-updater failure (#209). Platform-specific; verify per-OS since these are the two failure classes this repo explicitly must handle cross-platform (AGENTS.md Cross-platform section).
    subsections: []
    canvas:
      x: null
      y: null
      collapsed: false
    attachments: []
  - id: sec_vczm4q
    title: 'Phase 6 — Planner/CLI DX & orchestration issues (#230 #231 #232)'
    handle: phase-6-planner-cli-dx-orchestration-issues-230-231-232
    tags: []
    body: 'Planner-CLI self-hosting defects surfaced by agents authoring plans (this very subsystem): task default status (#230), the 10-finding planner CLI DX report (#231, split into 3 bounded tasks: store-atomicity/doctor-logic bugs, JSON-envelope/id-emission/docs consistency, doctor-vs-lint rule parity), and orchestration spawn-path bugs (#232: persona collision, mesh-spawn HTTP 500). Fixing these improves the same tooling this plan is authored with.'
    subsections: []
    canvas:
      x: null
      y: null
      collapsed: false
    attachments: []
  - id: sec_26vyj0
    title: 'Phase 7 — Small CLI/bridge hygiene issues (#233 #234 #238)'
    handle: phase-7-small-cli-bridge-hygiene-issues-233-234-238
    tags: []
    body: 'Bounded, low-risk fixes: CLI panic on broken stdout pipe + push-token leak in service JSON output (#233+#234, same command family — one task), and Telegram bridge literal-\n rendering (#238). Quick wins, no architectural decisions needed.'
    subsections: []
    canvas:
      x: null
      y: null
      collapsed: false
    attachments: []
  - id: sec_x8tyzd
    title: Phase 8 — Frontend issue (#185)
    handle: phase-8-frontend-issue-185
    tags: []
    body: Intermittent disappearance of PaneModeSwitch + sidebar provider icons together — investigate the shared-state hypothesis (provider registry/capabilities/mux snapshot transiently empty) before patching either symptom in isolation, since they blank together.
    subsections: []
    canvas:
      x: null
      y: null
      collapsed: false
    attachments: []
  - id: sec_hx9g11
    title: Phase 9 — Cron/skill-loading reliability (#179)
    handle: phase-9-cron-skill-loading-reliability-179
    tags: []
    body: 'Two gaps: mem-registered skills under ~/.codeterm/skills/ are unreachable via the Skill tool for cron/spawned agents, and a missing-skill miss escalates to a destructive home-wide find that OOMs. Both must be fixed together — a lookup fix without a guardrail still leaves the OOM footgun for any other missing-path case.'
    subsections: []
    canvas:
      x: null
      y: null
      collapsed: false
    attachments: []
  - id: sec_8dw6t1
    title: Phase 10 — Closure gate
    handle: phase-10-closure-gate
    tags: []
    body: 'Before any `gh issue close`: the linked task(s) must be in_review/accepted with (a) a red-before-green regression test or (b) a captured before/after command transcript proving the repro no longer reproduces. Run the full capped Rust suite once at this boundary as the milestone regression gate (this touches many small subsystems across phases 4-9).'
    subsections: []
    canvas:
      x: null
      y: null
      collapsed: false
    attachments: []
  - id: sec_78sgdr
    title: Phase 1b — Mesh delivery integrity (#240, P0)
    handle: phase-1b-mesh-delivery-integrity-240-p0
    tags: []
    body: |-
      P0, runs alongside/immediately after Phase 1: the mesh relay is the discovered bypass of the submit transaction (spec sec_sve813). Order of work: FIRST locate the mesh-relay write site and the 404 origin (routing) — the fail-closed reordering and the taxonomy hang off that one chokepoint; THEN idempotency/dedupe on top of the corrected error semantics; action transport (--actions enter) is separable and can run in parallel. Every fix lands with a mesh drill repro (two-instance or loopback-peer harness) plus unit tests; the audit table in spec sec_l4uzrj gains a mesh-relay row as part of the first task.
      (NOTE: premise later corrected by task_7fei9d — reporting, not routing; see sec_sve813/sec_l4uzrj.)
    subsections: []
    canvas:
      x: null
      y: null
      collapsed: false
    attachments: []
  - id: sec_nvqtbf
    title: Phase 11 — Chat UI agent-binding regression (research-first)
    handle: phase-11-chat-ui-agent-binding-regression-research-first
    tags: []
    body: 'Research-only lane until evidence is complete: reproduce the Spawning-Agent-over-live-PTY state, trace the binding lifecycle (pane.agent_session_id / session_binding_nonce / chat view predicate), incorporate Fable@eight''s macOS evidence when it lands, and produce a written root-cause + decision options for the Orchestrator. Patch tasks are cut only AFTER acceptance of the research report. Check overlap with task_k1982v (#231 ownership relations) before concluding.'
    subsections: []
    canvas:
      x: null
      y: null
      collapsed: false
    attachments: []
  - id: sec_v05qe4
    title: Phase 12 — Architecture refactor lane integration
    handle: phase-12-architecture-refactor-lane-integration
    tags: []
    body: 'Sequencing: spawn factory integrates first (independent surface, live-proof gate); message gateway phase 1 waits for task_7fei9d to land (parked behind #240 by design); board team-scope reworks its bounce before re-review. Each lane merges with a real merge commit + ancestry verification. These lanes stay OUT of Phase 1b scope - they are architecture consolidation, not the #240 bug fixes, even where they touch neighboring code.'
    subsections: []
    canvas:
      x: null
      y: null
      collapsed: false
    attachments: []
  - id: sec_rs7a3j
    title: Phase 1c — Provider acceptance observability (P0)
    handle: phase-1c-provider-acceptance-observability-p0
    tags: []
    body: 'Reopened by prod evidence at 31f335d48: optimistic write is not acceptance. Order: FIRST reproduce and root-cause the Codex parked-composer regression (confirm/refute the disarmed-Enter-retry mechanism) - a deterministic fix may be small and ship immediately; THEN build the acceptance seam (states 1-4, delivery_state query, provider acceptance capability, bounded acceptance-keyed retry) as the durable close of the goal. Screen scrape stays as fallback evidence only; session-store ground truth is the acceptance oracle wherever a provider writes one. All prior "delivery verified" acceptances are downgraded to states 1-3 evidence pending this phase.'
    subsections: []
    canvas:
      x: null
      y: null
      collapsed: false
    attachments: []
