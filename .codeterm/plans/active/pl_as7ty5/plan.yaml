gates:
- id: gate_0itx8j
  question: After fresh source-flow evidence, which first-class workspace Plan tab identity and lifecycle preserves one authoritative planner state?
  context: 'Planner decision gate. Resolve in the synthesis task from verified workspace/tab/canvas ownership and live event evidence. Default decision criterion: reuse the existing workspace tab identity plus plan id; reject duplicated plan stores.'
  blocking_task_ids: []
  routed_to_pane_id: 4c17f607
  asked_by_pane_id: e88e18c8
  asked_at: 1783629655253
  status: answered
  answer:
    text: Use a workspace-scoped synthetic Plan tab whose stable identity is derived from the authoritative daemon plan_id (for example tab key plan:<plan_id>) and whose content reads/subscribes to the existing PlanStore APIs/events. Creating or attaching an active plan projects exactly one tab into its owning workspace; focusing/closing the visual tab changes navigation only and must not duplicate, mutate, archive, or delete planner state. Reopen derives from the active workspace-plan relation. The canvas and tab are two views of the same plan_id, with explicit loading/error/orphan handling and no second plan store.
    by_pane_id: 4c17f607
    at: 1783629704834
  escalated_at: null
  escalation_note: null
- id: gate_re4jpj
  question: After snapshot lifecycle evidence, which cache owner and real mutation events make Plugins settings reopen immediately without stale state or toast noise?
  context: 'Planner decision gate. Resolve in synthesis from verified plugin_manager_snapshot callers and mutation paths. Default decision criterion: cache one successful authoritative snapshot in shared state and invalidate only after successful state-changing plugin actions.'
  blocking_task_ids: []
  routed_to_pane_id: 4c17f607
  asked_by_pane_id: e88e18c8
  asked_at: 1783629665001
  status: answered
  answer:
    text: Own one last-successful plugin snapshot in a shared frontend external store/query cache used by Plugins settings, Extensions view, titlebar, bubbles, and provider metadata. Render cached data immediately on reopen and revalidate in-panel (stale-while-revalidate); first load/error/empty states belong inside the panel, never a global toast. Replace cache only after a successful authoritative snapshot. Invalidate/refetch after successful state-changing plugin_manager_action operations (install, update, remove, enable/disable/activate where supported, channel add/remove/refresh) and the daemon contributions-changed/plugin lifecycle event; dedupe concurrent reads and keep the previous snapshot on refresh failure.
    by_pane_id: 4c17f607
    at: 1783629714350
  escalated_at: null
  escalation_note: null
- id: gate_bxfzf4
  question: After Mesh screenshot and real-machine Tailscale evidence, should Web UI be a global top-bar action with state Local, Tailscale URL, or Setup required, with Globe/ExternalLink icon, one-click Open, adjacent setup/status menu, and optional per-peer secondary action only when a URL exists? Decide authoritative state owner, visibility/permission behavior, exact responsive selectors, and whether Settings > Network remains configuration-only.
  context: 'Recommendation to validate: global top-bar Web UI action is the primary discoverability surface; use existing current access state, no marketing card, no toast loading, no Mesh-canvas-only control. Evidence must include the current Mesh Map isolated WEB UI label, real URL availability, and Tailscale Serve status/errors. Do not block or park existing tasks; this gate is evidence-pending.'
  blocking_task_ids: []
  routed_to_pane_id: e88e18c8
  asked_by_pane_id: e88e18c8
  asked_at: 1783657208785
  status: answered
  answer:
    text: 'Use a first-class global Web UI control in the Mesh header beside peer/service counts: Globe icon + ''Web UI'' + compact state (Ready, Setup required, Conflict, Unhealthy) and primary Open action when healthy; adjacent menu owns Setup/Repair/Copy URL/Disable and inline progress/errors. Remove the tiny canvas-only WEB UI label. Keep per-peer Open Web UI as a secondary contextual action only when that peer advertises a verified URL. Settings > Network owns detailed configuration. State source is one backend web-access/Serve reconciliation snapshot with local API health, Tailscale binary/version/operator/route/conflict/URL probe and daemon-version skew; frontend does not infer from peer cards. Responsive selectors must expose data-testid=mesh-web-ui-action, data-web-ui-state, mesh-web-ui-menu, and peer-web-ui-open without overlap on narrow widths.'
    by_pane_id: 4c17f607
    at: 1783657476800
  escalated_at: null
  escalation_note: null
