id: task_yad682
name: 'Plan views: survive daemon restarts (no dead TypeError screens)'
type: fix
model: claude/sonnet
model_rationale: Every daemon restart currently kills every open plan view permanently — users read it as data loss; seen repeatedly today during the restart-heavy integration cycle
acceptance_criteria:
- Killing and restarting the dev daemon with a plan tab open recovers automatically to live data with no manual reload (demonstrated on dev)
- No raw exception strings render in any plan surface; shared quiet ErrorState with visible retry + auto-backoff
- Reconnect refetch fires on daemon-health recovery signal, not only on timer
test_plan: 'Component tests with mocked failing-then-recovering fetch; live dev test: build.sh kill + dev while plan tab open, screenshot recovery; unit test backoff schedule'
correctness: Backoff must cap and jitter (no stampede on recovery); retry must not duplicate in-flight requests; error state must preserve last-known-good data when available (stale-while-error) rather than blanking
