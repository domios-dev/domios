id: task_e0619a82133b4abbb0c4a13f678e6b82
name: Read-only Board view
type: implement
model: cursor:auto
model_rationale: A kanban-like read-only board is useful for watching active agents and task status, but Spec and Plan must stay visible as separate higher-level entities above the task lanes.
acceptance_criteria:
- Board shows Spec and Plan above task columns, not hidden inside a column.
- Board groups tasks by status and shows agent/pane presence calmly.
- No drag/drop or direct status mutation UI is exposed.
test_plan: Projection unit tests for status grouping; Playwright smoke verifies board columns, spec/plan summaries, and no draggable task affordance.
correctness: Board is a read-only operations dashboard for agents, not an editing kanban.
