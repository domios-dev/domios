body: |
  Implement Board view with read-only status columns such as Pending, In progress, In review, Blocked, Done/Cancelled. Above the columns, render compact Spec and Plan summary bands/cards as separate entities. Task cards show title, status, assigned agent/pane, branch/worktree if present, and latest milestone. No user drag/drop; status changes still go through plan/report CLI.
