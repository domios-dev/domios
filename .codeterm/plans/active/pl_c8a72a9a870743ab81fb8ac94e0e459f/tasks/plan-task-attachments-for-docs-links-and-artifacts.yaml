type: feature
model: codex or cursor
model_rationale: Dogfood orchestration needs durable task-scoped context and evidence, not scattered chat history.
acceptance_criteria:
- Tasks can hold typed attachments such as markdown docs, links, local artifacts, screenshots, traces, and custom references.
