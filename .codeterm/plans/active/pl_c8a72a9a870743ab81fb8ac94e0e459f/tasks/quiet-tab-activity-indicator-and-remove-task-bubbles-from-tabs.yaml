model_rationale: 'The current active-task/tab chrome is too noisy: animated indicator blinks aggressively and task/focus bubbles on tabs distract from work. Keep a subtle signal, remove tab-level task bubbles, and leave task context to the pane input/canvas presence surfaces.'
acceptance_criteria:
- 'Tab activity signal remains visible but calm: no aggressive blinking/pulsing, no layout jump.'
- Task/focus bubbles are removed from tab chrome; task context is not shown as large bubbles on each tab.
- No regression to pane focus, active agent status, or canvas presence indicators.
test_plan: Focused TS/TSX test for tab indicator/rendering if applicable; Playwright visual gate or existing tab/sidebar test proving no tab task bubbles and calm indicator.
correctness: Do not remove the signal entirely; move or suppress only the noisy tab-level chrome. Keep files under 1000 lines.
