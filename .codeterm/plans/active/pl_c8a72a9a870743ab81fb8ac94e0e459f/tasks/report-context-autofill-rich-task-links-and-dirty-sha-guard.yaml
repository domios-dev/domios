id: task_05afbfb263b642dabf213a6bbe4c553c
name: Report context autofill, rich task links, and dirty SHA guard
type: bug
model: codex:gpt-5.5
model_rationale: Worker reports should be structured and trustworthy. The worker should not have to hand-type task id/status metadata when it was spawned from a plan task; the report message should carry parseable plan/task/status/branch/sha fields so the orchestrator chat can render a useful task link. Readiness reports must also guard against dirty worktrees or stale/base SHAs.
acceptance_criteria:
- Plan task assignment/spawn path provides enough context to the worker environment or prompt so codeterm report can default plan_id and task_id without manual flags.
- codeterm report / agent report output stored in reports includes parseable task metadata and the rendered injected message can show task id/name/status/branch/sha as structured fields or a task link, not just free text.
- Readiness statuses such as in_review warn or fail when local worktree is dirty, SHA is missing, or SHA is still the base commit while files are changed.
- Progress/partial/research reports stay lightweight and are not forced to commit; the guard targets readiness/acceptance evidence.
test_plan: CLI parser/env tests, report-store/rendering tests, and at least one service test proving a plan-assigned worker report defaults plan/task and updates the task/report metadata.
correctness: Keep report routing backwards-compatible for plain non-plan reports. Avoid hot-path git shellouts in daemon/UI; local git checks belong in CLI when cwd is available.
