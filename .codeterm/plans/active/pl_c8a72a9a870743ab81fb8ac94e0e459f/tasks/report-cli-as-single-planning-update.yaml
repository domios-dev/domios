id: task_530d8ab59822494198a4170d25b42d14
name: Report CLI as single planning update
type: implement
model: codex:gpt-5.5
model_rationale: 'Worker reporting should be the canonical one-call planning update: write a working point/milestone, update task status when appropriate, and notify the orchestrator. Today agent report is close, but the command is verbose, status semantics can confuse done vs in_review, and blocked/partial behavior needs to be explicit.'
acceptance_criteria:
- A worker can run one short command using env-derived plan/task ids to record progress and update task status.
- in_review/blocked/partial semantics are deterministic and covered by tests; done does not let a worker silently close its own task.
- Owner receives a useful notification and plan task gets a structured working point.
test_plan: CLI parse/render tests plus service tests around submit_report status transitions and milestone text; smoke with a temp plan/task/pane if practical.
correctness: Reporting is the single ergonomic write path from worker execution into Plan state, without unsafe extra CLI calls.
