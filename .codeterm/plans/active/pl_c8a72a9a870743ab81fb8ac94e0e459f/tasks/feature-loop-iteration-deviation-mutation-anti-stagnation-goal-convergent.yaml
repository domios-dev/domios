id: task_d505a5ea4ace4093b29a0e8187339e7c
name: 'FEATURE: loop iteration deviation/mutation (anti-stagnation, goal-convergent)'
type: implement
model: null
model_rationale: Refine loops can churn in place (same strides, no movement toward stop-when) without converging on the goal; the loop must detect stagnation and deviate while keeping the goal vector.
acceptance_criteria:
- LoopSpec tracks per-iteration progress signal + a stagnation counter (consecutive no-progress iters). On stagnation >= K, the loop emits a DEVIATION directive (a varied angle/mutation hint) for the next iteration, GOAL-anchored (must still serve the loop goal/stop-when). Surfaced in the state snapshot + heartbeat. Convergence = stop-when met; stagnation guard = max iters/budget.
test_plan: 'Unit: a loop with repeated no-progress iters trips the stagnation counter and yields a deviation directive after K; a loop making progress never deviates; deviation directive references the goal. Behaviour bench under evals/ for stagnation->deviation->convergence.'
correctness: Deviation increases exploration ONLY under detected stagnation and never abandons the goal vector; bounded by iter/budget stop-guard.
