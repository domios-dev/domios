acceptance_criteria:
- A workspace with project plans exposes a persistent Plan entry directly under the workspace in the sidebar; selecting a pane/task focus can open/switch to that Plan entry and zoom the canvas to one or more focused plan items.
test_plan: Focused unit tests for workspace tab/action derivation and focus target resolution; UI/Playwright or component test covering sidebar Plan entry visibility and click/focus behavior where practical.
correctness: Plan entry is not closable like a normal tab; it disappears only when the workspace has no relevant plans. Pane task affordance routes to the full plan canvas, not a separate mini-task view, and zooms/blinks the focused task/plan element(s).
