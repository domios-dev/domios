    - 'ANDREY: canvas OPEN FOR PLUGINS — plugin creates EXTERNAL node kinds (GitHub node etc), visible on canvas, AGENTS query via CLI. FOUNDATION EXISTS: FE nodeRegistry.registerNodeRenderer(kind,renderer)+open-kind fallback; BE CanvasElement{kind:String}+Plan.elements. GAPS: (1) plugin API to register node kind+renderer; (2) plugins create/update CanvasElement via batch add_element/host API; (3) agent CLI codeterm canvas nodes list|show; (4) capability+JS parity. Honors plugin boundary: core asks capabilities not identities.'
    - 'ANDREY ROOT-CAUSE: installed CLI is GLOBAL (~/.codeterm/bin); a worker ./build.sh cli rebuilt it and its socket-discovery now resolves to a DIFFERENT instance (batchtest), so orchestrator ''codeterm plan record'' hit the wrong daemon. FIX: CLI per-dev-instance location OR strictly honor CODETERM_API_PORT/CODETERM_INSTANCE in socket-discovery so rebuilding one dev CLI never hijacks another. Sibling of the isolated-dev-in-worktree task. Workaround: dogfood via curl to the right port.'
    - 'CONFIRMED by BE independently: CODETERM_INSTANCE/CODETERM_API_PORT alone do NOT redirect the CLI — socket-discovery picks a stale/other instance socket unless CODETERM_DATA_DIR or CODETERM_SOCKET_PATH is EXPLICIT. WORKAROUND (works): CODETERM_SOCKET_PATH=/tmp/codeterm-dev-<instance>.sock (main dev = /tmp/codeterm-dev.sock). FIX: socket-discovery must derive the socket path from CODETERM_INSTANCE (and CODETERM_API_PORT) deterministically, so each dev''s CLI targets its own daemon without manual CODETERM_SOCKET_PATH.'
    - 'ANDREY (hard rule §31): the board is live (workers add tasks/strides, plans mutate) but NONE of it may EVER move the user camera/zoom/focus. Programmatic/remote change = node updates IN PLACE, zero camera motion. User-initiated motion (minimap click, Plan/show-me button, their own canvas focus, drill, zoom/fit) is fine. Agent/CLI canvas focus = OFF-SCREEN SIGNAL (edge dot/glow toward the change + optional count, click to fly), NOT auto-pan. Applies to dominance(§25.3)/handoff(§27.4)/status(§25.6)/auto-pack. Playwright: after a live mutation, camera transform byte-identical.'
    - 'INCIDENT: prod (7685) got killed. ROOT CAUSE: build.sh kill targets lsof on CT_PORT=${CODETERM_API_PORT:-7686}; an orchestrator/worker pane in PROD exports CODETERM_API_PORT=7685, so a bare ./build.sh kill nuked prod. FIX (committed 1932a235): hard guard right after CT_PORT resolution — any build.sh action aborts (exit 2) if resolved port==7685, with a message telling the caller to set 7686/instance. Tested: CODETERM_API_PORT=7685 ./build.sh kill now refuses, prod stays alive.'
    - 'ANDREY: clicking a workspace does NOT enter the plan board. The only entry today is the per-pane Plan button (on an agent). If you create an agent with NO plan attached → you cannot reach the plan view = SOFT-LOCK. FIX: put a Plan/Canvas button on the WORKSPACE TAB itself, enabled when the workspace has active plans, opening the workspace overview board (all plans). Independent of any agent having a bound plan.'
    - 'ANDREY: General (and any workspace) CAN own plans. CROSS-WORKSPACE plans must be allowed — a plan whose tabs span multiple workspaces. Make it CLEAR on the board that it is cross-workspace (participants from different workspaces) and that it BELONGS to the main orchestrator of a specific workspace. So: plan ownership = an orchestrator pane in one workspace; membership/tabs can span workspaces; UI labels it cross-workspace.'
