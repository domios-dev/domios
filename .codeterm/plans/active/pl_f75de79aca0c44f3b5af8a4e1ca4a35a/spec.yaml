  body: '65 specs / 205 tests / 19 numbered suites. STRONG (preserve): clean suite taxonomy; behavior+oracle titles (''bad token is rejected with a rendered error, not a broken app''); exemplary header doc-blocks in 13-canvas and 16-chat-view (what/why/root-cause, testplan refs, quoted user complaints); ~4.5 real expects per test with genuine oracles (DOM order, round-trips, negative cases). Two run targets: Windows CDP against the real desktop app; macOS/Linux web-mode chromium against /web/.'
