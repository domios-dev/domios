- attachments: []
  body: 'G1 HEADERLESS SPECS (~10 files, the unclear ones): 16-chat-view/{chat-rendering,chat-picker-default}, 12-web/web-parity, 14-memory-ui/memory-panel, 19-web-stability/web-stability, 17-open-shell/lmstudio, 13-canvas/{canvas-perf-baseline,canvas-zoom-drift,workspace-plan-entry,_diag} — no stated test case; in-suite codenames (RAIL-4, GRP-4) undecodable without headers. G2 SLEEP-WAITS: 70 waitForTimeout across ~14 files (worst: 18-reorder, 16-chat-view, 12-web/tab-status-rail) — flake seeds + runtime padding. G3 WEAK ORACLES: 122 toBeVisible/toBeTruthy; audit where sole final assertion. G4 NO VISUAL BASELINES: every visual regression of the parent release cycle (misaligned canvas edges, overflow, glued timestamps) was caught by the USER post-merge, not by tests. G5 NO COVERAGE MAP: ''what has zero tests'' is unanswerable today. G6 orchestration e2e scattered across evals/ with no single entrypoint. G7 no flake policy — flaky tests get retried toward green instead of quarantined.'
