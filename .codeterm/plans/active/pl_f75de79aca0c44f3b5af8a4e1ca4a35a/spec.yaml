  title: Gaps (evidence-based)
- attachments: []
  body: 'P1 Every spec carries a 3-8 line header: WHAT is tested, WHY it exists (regression root-cause or feature contract), the ORACLE in one sentence — enforced by a gate script (contracts without gates rot; proven 4x in the parent effort). P2 Waits are condition-based; justified sleep residue only, inline-annotated. P3 Final oracles are behavioral (content/state/round-trip), never bare visibility. P4 Key surfaces have checked-in per-platform screenshot goldens; baselines regenerate only via a reviewed script. P5 Deterministic seeded fixtures over live setup wherever timing does not matter. P6 One-command orchestration golden tier for releases. P7 Coverage map auto-generated from headers; zero-coverage surfaces listed loudly. P8 Flaky = quarantined + task filed, never retried-to-green; traces attached to every red QA stride. NON-GOALS: no test-count worship; no rewriting healthy specs; no pixel tests on native/CDP targets (web-mode chromium is the render target).'
