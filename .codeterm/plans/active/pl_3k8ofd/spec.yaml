  title: The overnight iteration loop
- attachments: []
  body: |
    Two recurring traps cost real time. (1) A worker that finishes but never commits, then has its worktree force-removed, loses everything — preserve before cleanup. (2) Symlinking node_modules into a worktree where an agent runs pnpm install corrupts the main node_modules into a self-referential symlink, breaking tsx repo-wide with exit 194 — give each worktree its own real node_modules and never commit node_modules. Both are now guarded.
  canvas:
    collapsed: false
    x: null
    y: null
  handle: infra-lessons-learned-the-hard-way
  id: sec_qn00lq
  subsections: []
  tags: []
  title: Infra lessons (learned the hard way)
- attachments: []
  body: |
    The canvas must NEVER hide information by zoom (today task cards drop body text at far zoom → empty boxes; unacceptable). All content is always present; zoom + node sizing make it readable. Far = legible overview; on approach = progressively more detail that ADDS, never removes. Approaches under evaluation: wider A4-ish nodes, text that scales with zoom (with a font floor), density swaps, internal columns/chunking so a detailed node never balloons into a kilometer-tall портянка that flies off-screen.
