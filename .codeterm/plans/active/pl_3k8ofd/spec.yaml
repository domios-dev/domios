    Continuous text counter-scale is rejected (feels bad). Replace with DISCRETE designed node view modes — Document (full markdown), Card (title+badges+digest), Tile (title+status+counts) — each at a fixed readable size, looking good at its distance. Plus manual controls: zoom in/out/fit/reset buttons, a view-mode switch (Document/Card/Tile), a text on/off toggle. Optional auto-by-distance, user-overridable. No overflow; verify via Playwright across modes×zoom.
