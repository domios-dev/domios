- attachments: []
  body: |
    Canvas is a Figma-like 2D board, scoped per workspace, that visualizes live multi-agent orchestration: the orchestrators in a workspace, the **plans** they own, and for each plan the cascade Spec → Tasks → chain of report-milestones, looping into self-improving processes. It is the spatial, persistent counterpart to orchestration that today lives only as ephemeral chat + the report ledger. Two entry points: click a workspace for the overview of all plans, or the per-pane **Plan** button to focus on what that agent works on.

    **[EDITED DIRECTLY IN THE .MD FILE — no CLI]**
  canvas:
    collapsed: false
    x: null
    y: null
  handle: concept-vision
  id: sec_zmgmug
  subsections: []
  tags: []
  title: Concept & vision
- attachments: []
  body: |
    A Plan nests Sections (a tree, each with markdown body), Tasks (name, type, model, model_rationale, status, status_label, section_ids many-to-many, body, milestones), and Milestones/Steps (kind, text, links, loop_id, iteration). Identity is stable across restart (session_id over pane_id). Every entity carries its own ElementCanvas position. Source of truth = per-project JSON at <project>/.codeterm/plans/<id>.json; an in-memory index enables fast cross-project listing; the daemon is the single writer (atomic temp-write + rename).
  canvas:
    collapsed: false
    x: null
    y: null
  handle: data-model
  id: sec_xretem
  subsections: []
  tags: []
  title: Data model
- attachments: []
  body: |
    v1's spec said 'a plan is a frame whose contents are section-cascade-left → task-rows → milestone-columns' — rendered, that produced a giant box with three disconnected bands: scattered sections, floating tasks, milestones flying off with no edges. v2 replaces it: one COMPACT sectioned plan node (the hero), a separate SPEC node, satellite TASK cards joined by curved edges to their exact section rows, and STEP bubble CLUSTERS hung off each task. Nothing floats. Coverage shows as a fill tint on covered rows (amber pops on uncovered). Deterministic auto-pack — no manual dragging — so realtime additions slot in cleanly.
