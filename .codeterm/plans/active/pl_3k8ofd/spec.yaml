  body: |
    Coverage is derived, never stored: per section = count of tasks referencing it + a status rollup (none/pending/in_progress/done); plan-level = fraction of sections with >=1 task. Rendered as a fill tint on each covered row, a strong amber+dashed treatment on uncovered rows (so gaps pop), and a labeled footer '2/2 tasks · 86% covered'. Surfaced on the CLI via plan coverage / plan gaps.
