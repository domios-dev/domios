  body: |
    CodeTerm's prefix-builder injects -=-codeterm:...-=- only at the START of injected messages (reminders/delayed/model-to-model/mesh), so the NEXT message glues in the renderer (visible bug). Fix: wrap the whole injected block in <codeterm>-=- ... -=-</codeterm> (closing delimiter at the END too), and make the chat renderer STRIP/SEPARATE those blocks so two messages never glue. Render the codeterm meta as a distinct chip, the real message separately.
