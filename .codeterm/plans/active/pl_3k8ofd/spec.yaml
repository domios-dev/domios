  body: |
    Two-tier tags: declared COLORED facets (area/phase/risk — drive color/group/filter, reuse milestone_kinds idiom) + free UNCOLORED topics (long tail, search/handles). PRIMARY facet = essence headline (tints node, seeds handle). Handle <primary-facet>-<topic> names tasks readably (kills T10) AND names .md files (fixes opaque sec_<uuid>.md). Per-distance payload: Tile = tags SUBSTITUTE body (fix gray far-view), Card = tags+digest, Document = tags recede to header strip. Tag Map = HUD legend+filter (not word cloud). Authored via .md front-matter (live watcher) + CLI; auto-suggest never silently colors. Per design §19.
