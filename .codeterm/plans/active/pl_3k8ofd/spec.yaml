  body: |
    The board was polished from 'structurally correct' to 'Figma-grade' over 10 build iterations, each design-reviewed by a fresh independent critic using the frontend-design skill, scored against a 10-dimension rubric. Roles: Mira (lead designer-engineer, opus), Dax (adversarial critic, opus), Rex (mechanical fixer, codex). Cycle: build → integrate → per-zone Playwright screenshot → independent score → fold critique → repeat. The loop caught real over-corrections (edges loud↔invisible, spec demoted↔chromeless) a single builder could not self-see.
