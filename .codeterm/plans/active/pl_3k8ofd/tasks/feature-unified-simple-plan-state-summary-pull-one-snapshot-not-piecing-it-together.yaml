id: task_xnbi61
name: 'FEATURE: unified simple plan STATE/summary pull (one snapshot, not piecing it together)'
type: implement
model: null
model_rationale: Orchestrating means assembling state piecemeal (reconcile + plan get + presence + strides) every cycle — slow and error-prone. One snapshot fixes the loop's read path.
acceptance_criteria:
- 'codeterm plan state <id> (+ GET /api/plans/{id}/state) returns ONE read-only snapshot: goal vector, status/owner, task counts by status + %done, section coverage %, drift summary, active loops (target/budget/spent/stop-when), heartbeat (focus/lanes), open lanes (pending+in_review ids+names), live agents bound to tasks, last N strides.'
test_plan: 'Unit: aggregator over a fixture plan yields correct counts/coverage/open-lanes. CLI returns valid JSON (--json) + human view. Read-only: no plan mutation (assert bytes unchanged after call).'
correctness: A single call replaces the reconcile+get+presence+strides fan-out with one consistent snapshot; read-only, O(plan).
