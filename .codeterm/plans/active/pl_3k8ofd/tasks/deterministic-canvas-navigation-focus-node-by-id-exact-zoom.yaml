name: 'Deterministic canvas navigation: focus node by id @ exact zoom'
type: implement
model: null
model_rationale: 'BLOCKER for the §39 canvas-improvement loop: there was no working way to land the camera on a known node, so the Playwright criterion fumbled pan/zoom heuristics and false-skipped. Root cause found: canvas-focus is a silent no-op on web (backend emits {task_id,plan_id,pane_id}, client listener read {node_ids,plan_ids} — keys never matched).'
acceptance_criteria:
- POST /api/canvas/focus {task_id} centers the target card and mounts it (card center within 25% of viewport center)
- Optional scale lands the camera at that exact zoom (+/-5%), card centered
- codeterm canvas focus --task <id> [--scale N] moves the open board end-to-end
- '@canvas-worlds-v3 mounts its probe via focus-by-id and runs GREEN (no skip), sampling W1/W2/W3'
test_plan: 'Playwright web-mode against dev 7686: (a) focus a known in_progress task id, assert mounted+centered; (b) focus with scale, assert canvasScale within 5%; (c) drive the worlds dive via focus@scale and assert body reveal + progressive worlds. Unit: listener resolves task_id/plan_id/pane_id -> node ids.'
correctness: 'Contract parity: both backend lanes (REST canvas_focus, socket canvas.focus) emit the SAME keys the client listener consumes; a task/plan node id equals its id; pane_id resolves to its assigned tasks. No reliance on viewport-center pan/zoom heuristics.'
