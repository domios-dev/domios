  Per §37.2: zoom regulates granularity. Top(W0)=plan shows only in-progress tasks sorted. Closer=plan sections legible + task bubbles INSIDE the plan (count of tasks on this plan). Click/zoom a bubble→fly to task→its fixed boxes (§37.1/§35.3); fly back to plan. On any plan SECTION show which SPEC SECTION it belongs to + fly there; spec section→fly into plan section. section↔task + section↔spec navigable edges, all user-initiated (§31). Needs the §29 spec entity wired first (spec=plan bug).
