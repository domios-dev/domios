id: task_pr1tpg
name: IMPLEMENT §33 mergeable storage (explode + append-log + compaction) — proactive, before data grows
type: implement
model: claude:opus
model_rationale: Storage rewrite is cheap now and risky later; mergeability removes cross-worktree clobbering at the source.
acceptance_criteria:
- Two worktrees writing the same plan never produce a merge conflict on a clean rebase
- 'Compaction is reversible: full pre-image written to purge_log before fold'
- Append-log bounded — compaction caps journal size on a quiet tick
test_plan: 1) Two clones append concurrently -> git merge clean. 2) Kill mid-compaction -> snapshot intact. 3) 10k strides -> log stays bounded after tick.
correctness: 'No write path may lose a mutation: every append is fsync-ordered before ack; compaction only deletes journal lines it has folded.'
