- id: sec_h1gy43
  title: Phase 0 — dependency audit and final crate map
  handle: phase-0-dependency-audit-and-final-crate-map
  tags: []
  body: 'Produce the REAL module dependency graph of src-tauri/src (SCIP index or cargo-modules + grep for crate:: paths), overlay the draft crate graph from the spec, list every cycle/cross-edge that blocks a clean cut, and emit the FINAL crate map (name -> module list -> allowed deps) as an amendment to the spec section ''Target crate graph''. No code moves in this phase.'
  subsections: []
  canvas:
    x: null
    y: null
    collapsed: false
  attachments: []
- id: sec_2jgobq
  title: Phase 1 — workspace scaffold + leaf crates
  handle: phase-1-workspace-scaffold-leaf-crates
  tags: []
  body: 'Convert src-tauri to a cargo workspace (members under src-tauri/crates/), keeping codeterm_lib as the single member first (pure plumbing: profiles inherited, build.sh/test-capped/clippy-gate/CI/file-size all green). Then extract the leaf crates from the phase-0 map (types, util) with tests moving along. Each extraction = one lane, move+rewire only.'
  subsections: []
  canvas:
    x: null
    y: null
    collapsed: false
  attachments: []
- id: sec_uqsxn3
  title: Phase 2 — domain crates
  handle: phase-2-domain-crates
  tags: []
  body: 'Extract domain crates one lane each, in the final order the phase-0 audit declares safe (docs/spikes/workspace-split-dep-graph.md): plan, mem, mesh, pty, bridge, plugin. The pty group is bisected into two lanes (in-place boundary inversion, then pure crate cut) because it mixes lock-ordering-sensitive rewiring with the largest mechanical move. Every lane follows two-commit discipline: commit 1 = port inversion in place (workspace green), commit 2 = pure move + re-export shims. Gate per lane: crate tests green + whole-workspace green on 3 platforms + no tauri dep outside app + test-count parity for moved modules + cargo-metadata dep-whitelist proof.'
  subsections: []
  canvas:
    x: null
    y: null
    collapsed: false
  attachments: []
- id: sec_6dlcu4
  title: Phase 3 — thin app crate + enforcement
  handle: phase-3-thin-app-crate-enforcement
  tags: []
  body: 'src-tauri app crate keeps only tauri commands, startup wiring, and cross-domain integration tests (single tests/main.rs). Add enforcement so the split cannot rot: CI check that only the app crate depends on tauri (cargo metadata assert), and mod.rs/file-size discipline notes updated in AGENTS.md + docs. Measure and record the before/after edit-compile-link timings in the retrospective.'
  subsections: []
  canvas:
    x: null
    y: null
    collapsed: false
  attachments: []
