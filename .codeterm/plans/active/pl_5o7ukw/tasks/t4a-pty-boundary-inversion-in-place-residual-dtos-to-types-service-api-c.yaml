body: |
  PTY boundary inversion — IN PLACE, NO crate move. Prepares the pty group (`pty/**`, `multiplexer/**`, `session/**`, `dispatch/**`, `resize_owner.rs`) for the T4b cut. The fattest, riskiest group is deliberately bisected: this lane does ALL semantic rewiring; T4b is then a mechanical move.

  ## Part 1 — residual DTO moves to codeterm-types (+ re-export shims)
  DTOs the phase-0 audit assigned to codeterm-types that the types lane did not move:
  - `agent/status.rs` (`PaneStatus`) — verified pure: zero service/api/tauri refs
  - `multiplexer/types` pane DTOs consumed cross-domain: `PendingPrompt`, `AgentRole`, pane/workspace snapshot DTOs per the audit's pty<->types row
  - decide `native_prompt` input DTO placement: plain input structs -> types; prompt/screen-state LOGIC stays in pty group
  This also dissolves `plugin -> multiplexer` (5 refs) and the `agent <-> multiplexer/pty` DTO edges ahead of T6.

  ## Part 2 — invert app-directed calls
  - `multiplexer -> service` (12 refs, `multiplexer/commands.rs`): command-execution adapters move to app; mux emits typed events/commands instead
  - `dispatch -> service/api` (4 refs, incl. `api::agent_routes::list_agent_provider_values`): adapters move to app
  - introduce `PtyEventSink` / `MuxCommandPort` traits defined group-side, implemented app-side

  Every commit keeps the workspace green (single app crate + existing leaf crates throughout — no new crate here).
