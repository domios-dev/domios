body: |
  Extract `codeterm-bridge` — domain crate 5 of 6.

  ## Scope (move + rewire only)
  Move `bridge/**` + `transcribe/**` + `chatpipeline/**` into `src-tauri/crates/codeterm-bridge`.

  ## Pre-move (first commit)
  `message_markers` structs -> codeterm-types + re-export shim (6 bridge refs + 8 service refs; the audit assigned these to types but the types lane did not move them).

  ## Ports (traits DEFINED in codeterm-bridge, IMPLEMENTED in app)
  - `BridgePanePort` — replaces 4 refs `bridge/manager -> service::general_agent` / OutboundSender wiring
  - `ChatPreprocessorPort` — NEW blocker the audit missed: `chatpipeline -> chatpreprocessor` (3 refs) crosses into the plugin group, and bridge extracts BEFORE plugin. The `chatpreprocessor` module STAYS app-side until the plugin task moves it into codeterm-plugin; this port keeps the dependency direction clean and its impl re-points in T6.
  - `AttachmentStorePort` — replaces 2 refs `bridge/telegram -> attachments` (evict / save)

  ## Capability registration
  `transcribe -> plugin::capability::CapabilityRegistry` (1 ref) lifts to an app-side adapter module per the audit strategy — bridge exposes plain processors.

  ## Tests
  Protocol tests travel with the crate. `bridge/migrate_test` uses a `startup` helper (1 ref) — that test relocates to the app crate's integration tests (hard rule c: cross-domain integration tests live in app as ONE tests/main.rs binary).

  ## Lane discipline
  Two commits: commit 1 = pre-move + port inversion in place, green; commit 2 = pure move + shims + Cargo wiring.
