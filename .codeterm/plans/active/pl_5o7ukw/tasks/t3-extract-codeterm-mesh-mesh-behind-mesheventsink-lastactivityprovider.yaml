body: |
  Extract `codeterm-mesh` — domain crate 3 of 6. Smallest cut; validates the app-owned event-sink pattern across REST/CLI cheaply.

  ## Scope (move + rewire only)
  Move `mesh/**` into `src-tauri/crates/codeterm-mesh`. `mesh/types.rs` already lives in codeterm-types (api/auth `AccessLevel` refs shim-resolved).

  ## Ports (traits DEFINED in codeterm-mesh, IMPLEMENTED in app)
  - `MeshEventSink` — replaces 2 refs `mesh/toggle -> api::events::emit_everywhere`
  - `LastActivityProvider` — replaces 2 refs `mesh/manager -> user_last_activity::UserLastActivity`

  ## Config
  3 `config::load_config` refs (broadcast) — pass a config snapshot/provider closure in; no config loading inside the crate.

  ## Already dissolved (import rewrites only)
  `process_util` (5) -> codeterm-util; `paths` (3) -> depend on `codeterm-paths` directly (tauri-free, allowed).

  ## Lane discipline
  Two commits: commit 1 = port inversion in place, green; commit 2 = pure move + re-export shims + Cargo wiring.
