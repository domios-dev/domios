body: |
  Extract `codeterm-plan` — domain crate 1 of 6 (phase-2 order: plan, mem, mesh, pty, bridge, plugin).

  ## Scope (move + rewire only)
  Move into `src-tauri/crates/codeterm-plan` (workspace member, precedent shape = codeterm-types/codeterm-util: pub-use re-exports at old paths, tests travel with modules):
  - `plan/**` (top-level module — fresh rescan confirms ZERO outbound edges already)
  - `service/plan/**` (the entire blocker surface lives here)
  - `service/hierarchy/plan_reminder_nudge.rs`

  ## Ports (traits DEFINED in codeterm-plan, IMPLEMENTED in app)
  - `PlanEventSink` — replaces 1 ref to `api::events` emit
  - `PlanSearchPort` — replaces 2 refs to `mem` search
  - `PlanSkillPort` — provider skill file access
  - `PlanClock` — time source
  - `PlanLaneStatePort` (or DTO-move to codeterm-types if the data is plain) — replaces 3 `multiplexer` refs (lane liveness pane state) and 1 `usage` ref

  ## Prompts blocker (audit missed this — 34 refs)
  `service/plan -> crate::prompts` = 34 refs across ~15 constants (WORKER_*, QA_PIPELINE_DISCIPLINE, PLAN_SKILLS_*, TESTING_DISCIPLINE, ...). Move the plan-consumed prompt constants into a `prompts` module inside codeterm-plan; app `prompts.rs` re-exports them so app callers (e.g. runaway_sweeper) are untouched. Constant VALUES byte-identical — only location changes. Note: app `prompts.rs -> service/plan/reflection::ReflectionWindow` (2 refs) becomes app->plan, which is the legal direction.

  ## Stays in app
  Socket plan read/route adapters (`socket/server/plan.rs`, `plan_read.rs`), REST plan routes, dispatch wiring.

  ## Lane discipline
  Two commits minimum: commit 1 = port inversion in place (workspace green, no crate move); commit 2 = pure move + re-export shims + Cargo wiring. `config`/`agent`/`paths`/`process_util` refs resolve through existing codeterm-types/util/paths shims — just rewrite imports.
