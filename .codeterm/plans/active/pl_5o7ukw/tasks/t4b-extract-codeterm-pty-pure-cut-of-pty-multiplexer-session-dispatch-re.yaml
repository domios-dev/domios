body: |
  Extract `codeterm-pty` — pure cut, ONLY after the pty-boundary-inversion task is merged. All semantic rewiring already done there; this lane is mechanical.

  ## Scope (pure move)
  Move `pty/**` + `multiplexer/**` + `session/**` + `dispatch/**` + `resize_owner.rs` into `src-tauri/crates/codeterm-pty`:
  - re-export shims at all old paths; app/socket/commands callers compile untouched
  - `session <-> multiplexer` mutual refs become intra-crate (fine)
  - `portable-pty` dependency moves into the crate
  - Cargo workspace member wiring

  Diff outside the moved directories + shims + Cargo.toml should be ~zero — that is the pure-move proof and a review criterion.

  ## Platform note
  This crate owns ConPTY (Windows) — Windows CI green is MANDATORY before merge, not optional. The unix kill-process-group and windows `taskkill /T` fixes live in these code paths; they must not be touched beyond import rewrites.
