- id: sec_u06tja
  title: Success criteria & correctness vector
  handle: success-criteria-correctness-vector
  tags: []
  body: |2-

    A submission is only reported successful when:
    1. **Echo evidence**: either the literal text (normalized-whitespace substring or suffix-match for ≥1024-byte pastes, inject_verify.rs:161-188) or the paste-placeholder (`[Pasted text #N(+M lines)]`) is observed on screen, OR (when `verify_echo=false`) at least one screen-activity generation tick is observed after paste (`wait_for_paste_activity`) — never a blind no-op.
    2. **Submit evidence** (when `enter=true` and `verify_submit=true`): a strategy-specific post-Enter signal — new shell prompt + changed hash (`ShellPrompt`), input-drained-and-stable (`TuiInputDrained`, with anti-flap candidate/reappearance tracking for long bodies that scroll), or a bare generation tick (`None` — the weakest tier, used for unknown/plain shells).
    3. Long/wrapped/multi-line input must reach the SAME evidence bar as short input — never a silently relaxed check because the literal text doesn't fit in the 8-row tail window.

    **Correctness vector (observable proof):** `cargo test` (capped, scripts/test-capped.sh) green for `service::pty_io::submit_transaction::tests` and `service::pty_io::inject_verify::tests` (or whatever module path today's tests resolve to — see Plan/Verification section for exact commands), AND `pytest tests/e2e/test_inject_verify.py tests/e2e/test_pty_io.py -v` green against a healthy dev daemon (port 7686).

    **CONTRACT AMENDMENT (owner-directed, commit 9dbcda652, deployed in 31f335d48):** delivery is now **optimistic** — screen-scrape verification no longer VETOES a send (`require_submission` softened; `PtyClosed` stays fatal). Evidence is still gathered via `submit_observed`/`echo_observed` flags; anti-false-positive tests retargeted to the flags.

    **AMENDMENT TO THE AMENDMENT (2026-07-17, prod evidence):** optimistic write is **NOT acceptance and does NOT close the delivery guarantee**. Production 31f335d48 shows CodeTerm-delivered text sitting UNSENT in a target Codex composer with the send reported ok — the original user-facing failure, now silent. The guarantee remains open until **provider acceptance** is an observable, testable state (see the Acceptance model section). Candidate regression mechanism, to be confirmed: send.rs:275 records that codex/opencode swallow a `\r` during paste ingestion — "so verification stays" — i.e. the pre-9dbcda652 verify loop's Enter RETRY was the mechanism that made Codex sends land; softening the veto plausibly also disarmed that retry, resurfacing the swallowed-Enter failure without any error signal.
