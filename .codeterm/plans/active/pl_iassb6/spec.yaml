- id: sec_2owasd
  title: '#240 P0: cross-mesh delivery violates the guarantee'
  handle: 240-p0-cross-mesh-delivery-violates-the-guarantee
  tags: []
  body: |2-

    **GitHub #240 (two independent repros this week, ROG→BLACKSTAR and eight→BLACKSTAR, prod 1.7.1):** cross-mesh pane-to-pane `codeterm send --tab <pane> --mesh <peer>` returns **HTTP 404 to the sender yet still injects the raw text into the target's live PTY** — captured mid-command splice into a running PowerShell one-liner on pane 166df18d (ParserError, command destroyed). `--tab main --mesh` routes fine; only direct pane-to-pane 404s.

    **AUDIT CORRECTION (superseded 2026-07-17 by task_7fei9d review evidence):** the earlier claim here that the mesh relay writes raw PTY bytes bypassing `submit_transaction::run()` is **NOT confirmed and was wrong as premise**. The relay is a generic HTTP proxy re-issuing the peer's own `/api/panes/{id}/send`; mesh delivery already rode the verified transaction (Messenger::deliver → send_text → send_text_to_pty_smart → submit_entry). The #240 defect is **REPORTING, not routing**: the transaction's outcomes were collapsed to a bare 404, so bytes-written-then-verify-failed surfaced as "pane not found" (and "--tab main works / pane-to-pane 404s" is the same cause — warm pane confirms, busy/booting target fails verify). Residual honest limit: `submit_unconfirmed` inherently means bytes DID reach the PTY; the enforceable invariant is "reported state and actual writes never disagree", not "no error after any write". Known fail-open seam left deliberately out of task_7fei9d scope: `body.raw=true` relayed over mesh still bypasses the verified transaction (write_raw keystroke passthrough) — a scope decision for the Orchestrator/owner, tracked here.

    Companion evidence (Fable@eight session report, C:\Users\User\.codeterm\general\research\orchestration-economics-bundle\reports\fable-task_9246rj-report-and-stripansi-fix.md):
    - Every mesh send that returned 404 was actually delivered — one self-assignment landed 3x on the target Main pane (**retry → duplicate delivery hazard**: sender is told failure, retries, target gets N copies).
    - `--actions enter` relayed cross-mesh arrives as an **empty stamped message instead of a keypress** (one occurrence returned HTTP 503) — reproduced against agent panes via mesh AND local send.

    **Required properties (WHAT):**
    1. **Fail-closed:** a relay that reports any error has written NOTHING to the target PTY — error taxonomy and the write must be ordered so bytes-after-404 is structurally impossible.
    2. **Structured error taxonomy:** pane-not-reachable-on-peer, busy-pane-refused, submit-unconfirmed etc. — never a bare 404/503 that lies about delivery state.
    3. **Idempotency:** sender attaches a delivery key; target dedupes retries so at-most-once delivery holds even when the sender retries on a (mis)reported failure.
    4. **Busy-pane safety:** never inject into a pane mid-command; route through the verified submit transaction (prompt/TUI gating) or refuse with a reason — raw splice into a live command line is never acceptable.
    5. **Action transport:** `--actions enter` delivers a keypress at the target, never an empty stamped message.
