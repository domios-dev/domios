    1. **Spawn factory** — `origin/lane/spawn-factory` @ b11e61ab: unifies agent spawn identity + team introductions behind a spawn factory (fe06b9434), gates booting team-member intro on launch readiness (d381f577a) and pair intro delivery on recipient receptivity (b11e61ab). Fable has proven bidirectional live intros on this tip; that proof must be REPRODUCED post-merge, not carried over on trust.
    2. **Message gateway phase 1** — `origin/lane/message-gateway` @ 7dc7dcd6: parity wrapper seam for message delivery. Deliberately PARKED behind #240 (task_7fei9d rewrites the mesh relay error/write ordering in the same territory); integrating the seam first would force task_7fei9d to re-fight merge conflicts on the load-bearing messenger boundary.
    3. **Board team-scoped plan binding** — `origin/lane/board-team-scope` @ cd1613dff (scope workspace plan board to team-bound plans + make scoping structurally required). Currently BOUNCED — the bounce reasons must be obtained from the Orchestrator's bounce record and addressed before any integration attempt.

