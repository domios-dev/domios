- id: sec_477xyr
  title: 'Live defect: Enter not submitted after paste (chat UI / cross-pane)'
  handle: live-defect-enter-not-submitted-after-paste-chat-ui-cross-pane
  tags: []
  body: |2-

    **User report (Andrey, 2026-07-16, prod):** when sending from the Chat UI or when panes message each other, the paste lands in the agent TUI composer but **Enter is never pressed** — the message sits unsent. Critical, user-visible.

    **Traced cause candidate:** both paths converge on `send_text_to_pty_smart` (Direct entry, `verify_echo:false, verify_submit:true`): Chat UI → `chat_send_text` (commands/pane.rs:658) → `send_text_when_ready` → `send_text`; cross-pane → `Messenger::deliver` (messenger.rs:281) → `svc.send_text`. In the committed code, `run()` gated the paste-wait on `enter || opts.verify_echo` — so even with `verify_echo:false` it ran `wait_for_paste`, which demands `screen_contains_echo`; when no literal/suffix/placeholder match occurs, it times out with `EchoMismatch` **before `write_enter` is ever called**. Result: paste visible, no Enter — the reported symptom. Landing the uncommitted `wait_for_paste_activity` diff is Phase 1.

    **LIVE REPRO CAPTURED 2026-07-16 (this planning session):** `codeterm agent report` from pane 02d1339c to the Orchestrator pane (gpt-5.6-terra TUI) failed twice with `RPC error -32603: expected echo not found on screen`; the captured screen_tail shows the composer holding `[Pasted Content 2935 chars]` / `[Pasted Content 2256 chars] #2`. **New sub-defect:** `paste_placeholder_regex` (inject_verify.rs:138-141) matches only `[Pasted text #N( +M lines)?]` (Claude-style) — it misses the `[Pasted Content N chars]` shape this TUI renders, so placeholder-based echo confirmation can never succeed there. Report delivery (Report entry) uses verify_echo=true semantics on that path, so the fix needs BOTH the Phase 1 gate fix AND the widened placeholder regex.

    **SUB-DEFECT 2 (suffix-gate dead zone):** a ~800-byte report echoed literally into the composer but its head scrolled out of the 8-row tail window while `ECHO_SUFFIX_MATCH_MIN_INPUT_BYTES=1024` blocked the suffix fallback — inputs between tail capacity and 1024 bytes can never pass echo verification on a wrapping composer. Covered by task_t2uxx8.

    **SUB-DEFECT 3 (wrap-boundary char clipping):** a 344-byte report visibly present in the composer (twice, after a retry) still failed echo verify — the captured tail shows `status+body; liv` + newline + `payloads`: the composer's soft-wrap (or `tail_text` column clipping) dropped the character at the wrap column (`live` → `liv`), so neither normalized-substring variant can match. Echo matching needs tolerance for a clipped char at wrap boundaries, or tail extraction must not lose the last column. Fixture: this tail is in the 2026-07-16 planning transcript (third failed `agent report`). (Fourth occurrence same day: `drill;` → `drill` at wrap column.)

    **Why this section exists separately:** unit tests prove the state machine; they do NOT prove the live symptom is gone in a running build. End-to-end verification against a live dev daemon is required before the goal counts as met.
