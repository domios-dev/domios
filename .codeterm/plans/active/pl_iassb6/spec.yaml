- id: sec_x9h7e6
  title: Chat UI agent-binding regression (research-first)
  handle: chat-ui-agent-binding-regression-research-first
  tags: []
  body: |2-

    **User-reported regression:** a live, working PTY pane sometimes shows the **Spawning Agent** screen after the Chat UI loses its pane/session binding — the agent is fine, the binding state machine is not. Fable@eight is collecting macOS state-machine evidence (in progress; attach when it lands).

    **Explicit constraint: research before patch.** No fix may be prescribed until the regression is reproduced and the binding lifecycle (pane ↔ agent session ↔ chat view state) is traced end-to-end: what invalidates the binding, what the UI's spawning-screen predicate actually reads, and where the false transition originates. Per the provider-discipline rules, detection must key off the pane's OWN session (architecture rule 3) — a suspected violation class here.

    **Possible overlap:** #231's team-scoped plan/planner duplication work (task_k1982v) touches session/ownership relations; if binding evidence shows shared cause, link the tasks rather than duplicating the trace.

    **SCENARIO 2 (P0, user-visible): "Orchestrator could not start" after crash recovery.** A live team recovers from power loss or a killed process with its **planner intact but the orchestrator failed to start** — the user sees the could-not-start state on a team that was healthy before the crash. This is the same binding/lifecycle state machine exercised through the restore path instead of the steady-state path: session restore must rebind pane ↔ agent session ↔ team role, and the orchestrator's rebind demonstrably can fail while the planner's succeeds. Root cause REQUIRED before any patch — the recovery ordering (which bindings restore first, what the orchestrator-start predicate reads during restore, what a half-restored team looks like to it) must be traced with the same rigor as scenario 1. Repro levers: kill -9 the app process / power-cycle with a live 2-role team, then observe restore.
