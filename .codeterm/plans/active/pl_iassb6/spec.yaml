sections:
- id: sec_3dcoby
  title: Problem & audit baseline
  handle: problem-audit-baseline
  tags: []
  body: |2-

    **What:** `submit_transaction::run()` (src-tauri/src/service/pty_io/submit_transaction.rs:195-308) is the single state machine behind every automatic PTY submission: arm a screen-change generation before paste, write bracketed-paste text, wait for echo (`wait_for_paste`/`wait_for_paste_activity`), write Enter, then loop on `submitted()`/TUI-drain evidence before reporting `submit_observed: true`. `InjectionResult::require_submission` (inject_verify.rs:40-55) is the gate that refuses success without that evidence.

    **Why it exists:** three same-day commits (2026-07-15) rewrote this path — `ca5686431` "acknowledge PTY submit transactions" (deleted the old pty_io/wake.rs), `46f88e4d3` "enforce acknowledged delivery invariants", `2dd093dbe` "require causal submit evidence". A 4th change is sitting **uncommitted** in the working tree right now (adds `wait_for_paste_activity`, switches the no-verify-echo branch from a no-op clone to an actual activity wait, adds 2 tests). This plan's job is to finish, verify, and extend that in-flight work — not rediscover it.

    **Audit — every automatic PTY send path, classified:**

    | Call site | Entry tag | Route |
    |---|---|---|
    | `pty_io/send.rs:289` `send_text_to_pty_smart` (agent panes) | Direct | submit_entry → send_text_verified → submit_text |
    | `pty_io/send.rs:434` `send_text_to_pty` (pty-id direct, enter gates verify_echo/verify_submit) | Direct | same |
    | `pty_io/send.rs:195` `send_to_authenticated_agent_session` (planner auth path) | Planner | same |
    | `messenger.rs:271-289` `Messenger::deliver` (mesh/report fanout) | Report / Messenger | wraps svc.send_text → nested Direct underneath (label-only nesting, not a policy difference today) |
    | `messenger.rs:333-344` `deliver_planner_session` (PTY-backed planner) | Planner | same |
    | `orchestrator/launch.rs:364` ConfirmedFallback launch delivery | Direct | same, verify_echo:false / verify_submit:true |
    | `pty_io/inject.rs:54` `send_text_verified` | n/a (helper) | calls submit_transaction::submit_text directly |
    | `pty_io/batch.rs:33` | n/a | calls send_text_to_pty_smart |
    | `api/pane_routes/send.rs:123` `send_text` (HTTP entry; the mesh relay forwards to it verbatim) | Direct / Report / Messenger | resolve_pane → ensure_pane_pty_for_send → await_pty_link (all pre-write) → Messenger::deliver or send_text_when_ready → nested submit_entry → submit_text |

    No call site found that writes raw PTY bytes for automatic submission while bypassing `submit_transaction::run()` — `write_raw`/`inject_raw_keys_async` (send.rs:458-469) are keystroke-passthrough (vim j/k, arrows), not automatic text submission, and are out of scope.

    **Mesh-relay row resolved (#240, task_7fei9d).** The relay (`api/mesh_routes/relay.rs::mesh_relay`) is a generic HTTP proxy: it re-issues the call against the peer's own `/api/panes/{id}/send` and writes no PTY bytes itself. So sec_sve813's suspicion that the mesh path bypasses `submit_transaction::run()` is **not confirmed** — mesh delivery already rode the verified transaction via `Messenger::deliver → svc.send_text → send_text_to_pty_smart → submit_entry`. The real #240 defect was **reporting, not routing**: every delivery failure was collapsed to a bare `404 "Pane not found"` (send.rs:384/398, pre-fix), so a `SubmitNeverConfirmed` raised *after* the paste reached the PTY told the caller the pane did not exist — the "404 + delivered" symptom. `--tab main` appeared to work only because a warm general pane confirms submission; any busy/booting target failed verification and surfaced as a routing-shaped 404. Fixed by `service/delivery_error.rs`: preflight (reachability → PTY → link) is ordered strictly before the write, the write is the last fallible step, and failures carry `pane_not_reachable_on_peer` / `pane_busy_refused` / `pty_unavailable` / `submit_unconfirmed` plus an explicit `bytes_written` flag across the relay boundary.

    **Known gap:** `wait_for_echo` and `wait_for_submit_tui_drained` (inject_verify.rs:190-298) are no longer called from `submit_transaction::run()` — only from tests and the separate shell-spawn launch path (`pty_io/inject.rs:70-174`, a bare-shell launch with no agent TUI yet). The primary submit path reimplements equivalent drain/echo logic inline. Two parallel implementations risk silent divergence.
