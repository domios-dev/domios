- id: sec_0uu2gg
  title: Open gaps & decisions needed (PTY)
  handle: open-gaps-decisions-needed-pty
  tags: []
  body: |2-

    1. **Weak evidence tier**: `submitted()` for `VerifySubmitStrategy::None` (submit_transaction.rs:158) accepts *any* generation tick after Enter as proof of submission — no hash/content check. Used for plain shells / providers with no declared strategy. Decide: tighten to a hash-change check (matching `ShellPrompt`'s bar), or explicitly document why a bare tick is sufficient for this tier.
    2. **Dead/ignored parameter**: `idle_after_drain` on `wait_for_submit_tui_drained` (inject_verify.rs:271-298) is accepted but never used (`_idle_after_drain`) — no settle time is enforced there. The real anti-flap logic (candidate/reappearance tracking) lives only in `submit_transaction.rs::run()`. Decide: delete the unused param + the now-superseded helper if truly dead on all live paths, or wire it up if a live path still needs it.
    3. **Duplication**: `wait_for_echo`/`wait_for_submit_tui_drained` vs the inline logic in `submit_transaction.rs::run()` — confirm which callers still use the standalone helpers (shell-spawn launch in pty_io/inject.rs:70-174 per audit) and either delete the duplicate or extract one shared implementation.
    4. **Retry-loop coverage gap**: `MAX_ENTER_ATTEMPTS = 2` retry logic (submit_transaction.rs:228-298) has no test for 3+ rapid stale-generation cycles overlapping with a long/wrapped body — only single-retry cases are covered today.
    5. **UI surfacing**: no Playwright/frontend coverage confirms `SubmitNeverConfirmed`/`EchoMismatch` reach the user distinctly from a generic failure. Out of scope for this plan unless a task explicitly picks it up (tracked here so it isn't silently dropped).
