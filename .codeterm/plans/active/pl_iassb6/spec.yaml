- id: sec_8odicn
  title: 'Issue-triage scope: WHAT & WHY'
  handle: issue-triage-scope-what-why
  tags: []
  body: |2-

    **What:** after the PTY delivery-guarantee work lands, audit and resolve every currently **open, non-roadmap** GitHub issue in `rollacode/codeterm`: #179, #185, #203, #209, #230, #231, #232, #233, #234, #235, #236, #237, #238, #239. Issue #175 (`roadmap` label) is explicitly excluded — it is idea-capture, not a bug/fix.

    **Why:** these are field-reported defects (crashes, hangs, silent CLI failures, cron/agent reliability gaps, DX friction in the planner CLI itself) accumulated across recent sessions on rollacode-bot, BLACKSTAR, and Linux/macOS/Windows hosts. Left open they keep costing operator time (service-health cron failures, mesh crashes requiring app restart, CLI scripts silently mis-parsing JSON).

    **Non-goals / constraints:**
    - Roadmap-labeled issues are out of scope for this plan.
    - **No issue is closed without an accepted implementation AND evidence** (a passing regression test or documented repro-no-longer-reproduces + a real command transcript) — closure is an Orchestrator decision, not a worker self-close.
    - PTY delivery-guarantee work (see prior spec sections) is the first priority; issue-triage tasks are sequenced after it, not interleaved into the same lane.
    - Where an issue bundles multiple distinct bugs (#231 has 10 findings, #232 has 2), split into separately acceptance-testable tasks rather than one giant task — see Plan phases for the split.

    **Success criteria:** each issue has one or more tasks whose acceptance criteria quote the issue's own repro/expected-behavior text, and whose test plan proves the fix against that repro. A GitHub issue is only closed by the Orchestrator after the linked task(s) reach `in_review`/accepted with evidence attached.

    (Later amendment via task_eee5uy why-update: scope widened to 15 issues including #240.)
