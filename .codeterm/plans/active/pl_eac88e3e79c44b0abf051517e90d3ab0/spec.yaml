  body: 'P1 DUPLICATED TRUTH: structured fields (status, title, handle, executor_role) live in BOTH plan.json and each sidecar YAML frontmatter — every status flip double-writes; the 135-file frontmatter churn walls are this duplication breathing. P2 MISNAMED FILES: sidecars are 60-80 percent YAML frontmatter with thin bodies — YAML records wearing .md extensions; .md must change only on hand edits and today it does not. P3 RUNTIME STATE IN THE GIT WORKTREE: daemon writes land in the repo, polluting whichever branch is checked out (stray Plans commits on release/v1.6.2), fighting merges, training dirty-check alarm fatigue. P4 WHOLE-PLAN FAN-OUT: every mutation re-serializes goal+sections+all tasks (persist_bodies); the write-if-changed pre-fix stops identical rewrites, the fan-out itself remains. P5 LAZY FORMAT MIGRATIONS: serializer changes re-emit every file on first touch instead of one explicit wave.'
