  title: Target architecture
- attachments: []
  body: 'Per plan directory, exactly this: goal.yaml (auto-generated, freely hand-editable — daemon respects edits); spec.yaml (ALL spec sections in one file — section folders die); plan.yaml (plan-level metadata + ALL plan sections in one file); tasks/<handle>.yaml (the complete task record — every structured field PLUS the body as a YAML block scalar, one self-contained hand-editable file per task); tasks/<handle>.jsonl (the task''s stride/activity log, append-only). KILLED: plan.json (its graph metadata moves into plan.yaml), INDEX.md inside the plan (indices are DERIVED artifacts — the daemon''s own cache/sqlite serves search/board; a human-readable index may be rendered at export time only), sections/ folders on both spec and plan, frontmattered .md sidecars (the format IS yaml, so the files are named .yaml — honest naming). PROPERTIES: everything hand-editable and watched (edit a yaml -> daemon reconciles); write-if-changed + per-entity writes apply (a task mutation touches exactly its one yaml); lives in the machine-owned state dir per the Option-B decision, with ''plan export'' rendering snapshots into the repo. Supersedes A1/A2''s abstract wording — this section is the concrete contract.'
