  text: |
    DISCIPLINE INCIDENT ANALYSIS (Planner, at Orchestrator's own request — polling violation on ubunta pane 5a3a8690). ROOT CAUSE, three layers: (1) AFFORDANCE ASYMMETRY (the real bug): agent lanes have a completion contract (agent report -> injected wake); plain shell panes have NOTHING — so a long remote shell command has no legitimate 'wait' shape, and the orchestrator falls back to terminal-driver mode. The rule says 'don't poll' but offers no alternative for this surface; a rule without an affordance loses to friction every time. (2) KNOWN TRIGGER, NEW SURFACE: urgency + direct pane access = implementer-mode slip — same trigger class as the integration-checkout tripwire; polling is implementer-mode applied to WAITING. (3) The permission-prompt detour (steering remote Claude before switching to a shell) burned patience and set up the tactical loop. THE MISSING PRIMITIVE ALREADY EXISTS — no new tooling needed: a shell command can self-report via the CLI from ANY pane. Required wrapper pattern for every long-running shell gate, local or mesh: '<long command>; codeterm send --pane <ORCH_PANE> [--mesh <ORCH_PEER>] "GATE:<task_id> rc=0 <one-line>"'. For an ALREADY-RUNNING command (the live 5a3a8690 case): start one companion watcher in the remote pane — 'while pgrep -f "cargo|build.sh" >/dev/null; do sleep 30; done; codeterm send --pane <ORCH> --mesh <PEER> "GATE:linux-dev-build done"' — the sleep loop runs REMOTELY and unattended; zero local polling. FIXES ROUTED: (a) prompt — TEXT D added to the prompt-surgery lane, placed in orchestration_toolset.md (mechanics belong in the toolset, not the role suffix; suffix budget stays intact); (b) tooling smell-detector task filed separately (daemon-side nudge when an orchestrator repeatedly get-texts the same pane); (c) no scolding warranted — self-report + root-cause ask is exactly the reflection loop working as designed.
