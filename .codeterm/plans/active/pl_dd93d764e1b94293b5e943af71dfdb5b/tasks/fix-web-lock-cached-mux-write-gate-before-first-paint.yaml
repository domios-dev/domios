id: task_3e39b1b85b0f4afe9c795a5a63607ccb
name: 'fix(web): lock cached mux write gate before first paint'
type: fix
model: cheap
model_rationale: Small, localized frontend state-gate fix with straightforward tests; cheap model is sufficient.
acceptance_criteria:
- On web boot with sync cached state, guarded mutating calls are blocked before effects run and cannot target stale cached pane/tab ids.
- Successful mux_get_state reconcile unlocks the gate and normal Sidebar/Terminal actions resume.
- No native/Tauri boot path is locked when no cached web snapshot is used.
test_plan: Add/extend multiplexer/state cache tests with a cached-state initial render case. Run the focused TS tests for stateCache/multiplexer provider logic; if a component harness exists, assert a Sidebar action before reconcile does not invoke mux_set_active_tab.
correctness: The gate's initial state must be computed from the same cache-hydration signal that paints cached panes. Do not rely on useEffect timing to protect the first rendered frame.
