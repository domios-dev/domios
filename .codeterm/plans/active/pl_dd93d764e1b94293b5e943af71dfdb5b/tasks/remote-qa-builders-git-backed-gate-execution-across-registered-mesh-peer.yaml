name: 'Remote QA builders: git-backed gate execution across registered mesh peers'
type: feature
model: gpt-5.5/high
model_rationale: Distributed-systems design over existing mesh+qa primitives; strong model for the design, staged build
acceptance_criteria:
- Builder registration + mesh-visible builder list (register on two peers, orchestrator lists both with platforms)
- 'Ref execution drill: queue a gate for a pushed lane ref -> builder fetches detached, sha-verified, runs serially, structured result lands as a task stride + orchestrator report'
- 'Serialization proven: two gates queued to one builder run strictly sequentially (timestamps in results); timeout kills + reports honestly'
- 'Safety: builder refuses foreign-repo refs, dirty checkout (with sidecar exclusions), and unpinned sha mismatch; workers on builder machines still cannot run heavy gates locally'
- plan qa --builder/--platform routes remotely with the same UX as local; honest refusal when no builder matches
- Zero repo/machine literals in product code (stranger's-repo check at gate)
test_plan: Phase drills across two real peers (ubunta + one more) against a scratch repo fixture; serialization + timeout + refusal matrix; mesh-security review of the gate-spec execution surface; capped everything
correctness: Git is the only content channel (no patch shipping); detached checkouts never mutate builder branches; results are evidence (strides), not side-channel chat; builder liveness via existing presence — no new heartbeat protocol
