  text: |
    PRIORITY CORRECTION (round-76, Andrey via Orchestrator — SUPERSEDES the post-release sequencing in the body): this is RELEASE-BLOCKING NOW — review throughput is gated on manual QA runs today. MINIMAL CORE, ships first, explicitly scoped (everything else in the body stays as the staged follow-up): (M1) BUILDER REGISTRATION, minimal: 'codeterm qa builder register --label <platform>' on the builder machine — registry entry + mesh-visible list; liveness = existing presence; NO auto-pick yet (orchestrator names the builder explicitly). (M2) REMOTE ROUTING: 'plan qa --task X --builder <peer>' enqueues to that builder's serial queue; builder fetches the task's recorded lane ref DETACHED into its warm checkout, sha-verified, runs the gate spec, result lands as a stride + report. NO platform matching, NO artifact store, NO watchdog chips in the core. (M3) ONE-QA ENFORCEMENT unchanged from 5a6d58c5 (local registry + worker build detection) — lands together or first; the builder entry IS a registry entry, one implementation. MINIMAL-CORE ACCEPTANCE (replaces the full criteria set for the release gate; full set stays for the staged follow-up): (A) register builders on ubunta + ROG; orchestrator lists both; (B) route one REAL pending gate from the current in_review queue through each (a live lane ref, not a fixture) — structured result stride + report received, verdict actionable; (C) serialization holds on one builder under two queued gates; (D) refusals work: unregistered builder name, foreign-repo ref, dirty checkout; (E) zero repo/machine literals (stranger's-repo check). DEPLOYMENT REALITY CHECK for the dispatch: builders run the CURRENT prod CodeTerm — the minimal core must ship to those machines to be usable, which means this lands in the release build itself OR runs from dev builds on the builder machines during the endgame; the orchestrator picks the pragmatic path and records it. SEQUENCE: dispatch immediately alongside 5a6d58c5 (shared registry code — ideally one worker, one branch).
