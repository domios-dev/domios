body: |
  USER SCREENSHOT (round-54, desktop List view): four defects. (1) LAYOUT DRIFT ('что-то съехало'): ~350px of dead space above the PLAN strip — the list surface starts mid-screen; diagnose what reserves that space (hidden companion bubble? in-flight strip placeholder? stale spacer in PlanViewShell/PlanListView) and make content start at the top of the surface. (2) PLAN HEADER NOT VISIBLY COLLAPSIBLE: the plan summary card (title, goal text, focus line) has no collapse affordance — user expects the section to fold like the mobile compact header already does. Add a right-side chevron (same affordance family as the sidebar workspace/group handle), default expanded on desktop, collapsed state persisted per plan; collapsed shows one compact row (title + % + state chip). Component: src/components/Canvas/planView/PlanContextHeader.tsx. (3) MOBILE PASS for List: at 390x844 verify+fix row height and touch targets >=44px, section-tag chips truncation (currently mid-word ellipsis 'Wave 24 — New-session U…' wastes width — truncate smarter or hide on narrow), time column stays visible, filter strip wraps. (4) HONEST BADGES, two lies: (a) 'Drafting' chip while plan mode is approved/execution — PlanContextHeader.tsx:48 renders planningState verbatim; legacy plans default planning_state to drafting ('new field lies about legacy data' class) — when plan mode is approved/execution/complete and planning_state is drafting-by-default, derive the chip from mode, or show nothing; (b) 'PLANNER No planner' (line 141 fallback) while the plan HAS a bound planner_ref — the resolver returns null when the planner pane lives on another daemon (planner pane is on prod, UI is dev); when planner_ref is set but the pane is not local, show 'planner: <short-id> (offline/remote)' instead of the false 'No planner'.
role_guidance: Frontend worker; PlanContextHeader is shared with Board — coordinate with the Board polish task (same files, prefer one worker for both).
