model_rationale: Primary-surface visual design + interaction + model work; design quality is the whole point — opus with a frontend-design stance.
acceptance_criteria:
- Plan-context header band (goal/focus/owner/progress/spec) replaces the floating summary cards; click-through opens plan/spec detail.
- Done column collapsed by default (recent 5 + count + Show-all scrolling in-column); page height bounded on the 200-done fixture.
- Cards clickable -> task detail overlay; columns scroll independently with sticky headers; empty columns read cheaply.
- Existing plan-board-* testids preserved; plan-board-done-toggle + plan-context-header added.
test_plan: npm run test:unit (boardModel + PlanBoardView tests); dev visual pass on real plan + done-heavy fixture; 2 screenshots attached to report
correctness: No unbounded growth with done count; no per-render fetch regressions; multi-plan workspace stacking still works.
