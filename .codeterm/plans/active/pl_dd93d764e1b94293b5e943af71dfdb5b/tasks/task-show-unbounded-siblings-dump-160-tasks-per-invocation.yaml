name: 'task show: unbounded siblings dump — 160 tasks per invocation'
type: bug
model: claude/sonnet
model_rationale: Tiny output-shaping fix; big token/readability win for every agent on large plans
acceptance_criteria:
- Default task show on a 160-task plan emits <=1 sibling summary line (byte-count before/after in the report)
- --siblings lists open-only with short ids + truncated names; --all includes done; --json unchanged
test_plan: CLI snapshot test on a large-plan fixture asserting bounded output; run against the live plan as demo
correctness: --json output shape untouched; no information loss, only relocation behind flags
