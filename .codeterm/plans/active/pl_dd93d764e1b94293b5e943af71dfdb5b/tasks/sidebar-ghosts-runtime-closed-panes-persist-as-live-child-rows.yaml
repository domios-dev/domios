body: |
  ORCHESTRATOR FORENSICS (round-65, user-visible trust issue): after worker panes close, the sidebar keeps rendering them as live child rows under the orchestrator group — while the backend truth is unambiguous: 'codeterm pane status' returns Pane-not-found for those ids AND the workspace's pane_ids list excludes them. Frontend state desync: rows render from a stale source that outlives pane close. SIBLING CLASS, distinct instance: task_63c585953fef4dbdb9e1d906077f8b18 (done) fixed RESTORE-time ghosts (dead panes resurrected as tabs at session restore); this is RUNTIME-close ghosts — the reconciliation gap on the close event path. INVESTIGATE: which store feeds the orchestrator-group child rows (SidebarWorkspaceTabs group containment / hierarchy tree state) and why pane-close events (or the panes-list refresh) do not evict entries — suspects: a cached hierarchy/group membership map keyed by pane id that is only ADDED to, never reconciled against state.panes; or group rows built from task lane data (assigned_pane_id) instead of live panes. REQUIRED BEHAVIOR: (1) sidebar child rows render ONLY panes present in the live panes state — a close event or refresh removes the row within one render cycle; (2) a task whose assigned_pane_id no longer exists is represented ONLY as the pane-gone lane state on plan surfaces (chips from task_03bf8da6 / watchdog task_1d0572d0) — NEVER as a sidebar tab; (3) reconciliation is structural (derive rows from state.panes membership every render), not event-patching (a missed event must not leave a ghost). Add the regression test the restore-ghosts fix got, but for the runtime path: close a child pane via API while the group renders -> row gone on next state tick; component test with a stale-membership fixture.
role_guidance: Frontend worker; start from SidebarWorkspaceTabs group-membership derivation and the panes-refresh reducer; read the task_63c58595 fix first — same class, other path.
