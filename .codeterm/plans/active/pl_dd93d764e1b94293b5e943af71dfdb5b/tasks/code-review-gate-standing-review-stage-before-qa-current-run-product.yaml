body: |
  ANDREY'S QUESTION ANSWERED (round-77): NO standing code-review gate exists. Today's pipeline is worker report -> orchestrator accept/bounce (judgment on the REPORT text, not the diff) -> QA queue (runs TESTS, reviews nothing). The R1-R5 branch reviews were a one-off sweep; the 'Adversarial review + integration gate' task was one-shot. Tests catch broken behavior; nobody systematically reads the code for design violations, security, provider-boundary leaks, comment hygiene, file-size discipline. TWO DELIVERABLES: (1) CURRENT RUN (immediate, process-only, no code): before the develop PR, every lane merged since the R1-R5 sweep gets a diff review — orchestrator dispatches read-only reviewer lanes over the ACCUMULATED diff (like R1-R5 but scoped to post-sweep merges), findings -> fix tasks; the develop-PR task (task_b3789e40) gains a criterion: 'post-sweep diff reviewed, findings dispositioned'. (2) PRODUCT (the standing gate): a REVIEW stage in the task pipeline between in_review and QA/done — mechanics kept LIGHT per Andrey's explicit constraint ('не нагружать бесполезными правилами — гайдить'): (a) task field review_required (default ON for type=feature/bug touching product code, OFF for docs/process — orchestrator can flip per task); (b) 'codeterm plan review --task X' assigns a read-only reviewer lane (cheap model default) whose charter is the DIFF: design violations, boundary leaks (capability-vs-provider-id, structural fingerprints), security, hygiene (comments/file-size), test honesty (do the new tests actually assert the fix); reviewer verdict = stride (approve / findings list) — orchestrator still owns accept; (c) gate wiring: plan qa refuses (or warns, config) when review_required and no approve-stride exists — review BEFORE burning QA machine time; (d) the transition hint (5a6d58c5's in_review hint) mentions review when required. GUIDANCE NOT BUREAUCRACY: one reviewer, cheap model, diff-scoped, verdict-as-stride; no approval committees, no mandatory rounds — a bounce-worthy finding is just a finding, same bounce discipline as everything else. Product-general: review_required + plan review + refusal are product mechanics; zero repo assumptions.
role_guidance: Backend+prompt worker; coordinate with 5a6d58c5 (transition hint) and 3165f160 (gate wiring); the current-run sweep is orchestrator process work, not this lane's code.
