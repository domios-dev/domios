id: task_321a3a84ac404b0b83643db41d2069b9
name: 'fix(plan-storage): isolate corrupt markdown sidecars so one file cannot drop a plan'
type: implement
model: gpt-5.5
model_rationale: 'HIGH review finding from R1 plan service/storage: hydrate_body/read_to_string errors from one sidecar currently propagate to load_file_into_index and make scan_project skip the whole plan.'
acceptance_criteria:
- A single unreadable or invalid-UTF8 goal/task/section/milestone/element markdown sidecar does not remove the plan from PlanStore or fail scan_project for that plan.
- Hydration preserves usable plan.json fields and other readable sidecars; corrupt sidecar failures are logged or surfaced as repair debt without panicking.
- Existing malformed strides.jsonl line tolerance remains intact.
test_plan: Add Rust tests that write invalid UTF-8 bytes to a task or milestone markdown sidecar, call scan_project or reload_from_disk, and assert the plan remains loadable with other tasks/strides intact. Run scripts/test-capped.sh with the exact test filter.
correctness: No single corrupt sidecar file outside plan.json can kill an otherwise readable plan; user-data errors are isolated and recoverable.
