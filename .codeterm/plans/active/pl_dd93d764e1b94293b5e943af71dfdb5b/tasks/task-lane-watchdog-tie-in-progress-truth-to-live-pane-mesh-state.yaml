body: |
  DESIGN (Planner, round-59, at Orchestrator request — Board currently lies: tasks sit in_progress with gone/idle panes and no report; 11/13 pane-less evidence in task_03bf8da6). RELATIONSHIP TO EXISTING PIECES (do not duplicate): plan reconcile already computes in_progress_pane_gone/stale_in_review but only ON DEMAND — this watchdog makes lane truth CONTINUOUS and richer; recording discipline (auto-fill pane/peer/branch) and UI fallback chips belong to task_03bf8da6 — this lane consumes those fields and adds the LIVE states; liveness verdict logic must be ONE shared helper with reconcile and plan-lanes (task_d1450940) — three consumers, one implementation, or the verdicts will disagree. STATE MODEL per in_progress/in_review task WITH an assigned pane (pane-less tasks stay task_03bf8da6's 'no pane recorded' — the watchdog does not invent state for them): WORKING = pane exists AND (tracker status Working OR output activity OR stride/report within T_activity); IDLE-STALLED = pane exists, tracker Idle/Waiting beyond T_stall (default 10min) with no new stride and no pending user prompt; REPORT-OVERDUE = pane Working but no stride/report beyond T_overdue (default 45min) — long honest work exists, this is amber not red; PANE-GONE = pane absent locally AND (no peer recorded OR peer reports it absent); PEER-OFFLINE = peer recorded and mesh presence says offline — DISTINCT from gone: a sleeping laptop must NOT trigger reassignment (the eight/Dali case), it parks the verdict until the peer returns. ESCALATION LADDER, conservative by design: observe -> on IDLE-STALLED ping ONCE (inject a single bounded status-request nudge into the worker pane via existing Messenger::deliver + wake confirmer; response window 5min) -> no response: set status_label (stalled / pane-gone / report-overdue), record a stride with the evidence (last activity ts, tracker status), and notify the ORCHESTRATOR through the existing plan heartbeat/nudge channel; PANE-GONE flips status_label=needs-reassign immediately (same verdict reconcile prescribes today). THE WATCHDOG NEVER auto-blocks, auto-cancels, or reassigns tasks — it flags, records, and notifies; transitions stay orchestrator authority (config [orchestration.lane_watchdog]: enabled, t_stall_secs, t_overdue_secs, auto_flag_pane_gone bool). NO POLLING LOOPS: local = subscribe to existing agent_tracker status transitions + PTY output-activity events; one coarse 60s timer sweeps the in-memory lane set for threshold crossings only (bounded: O(active lanes)); mesh = piggyback existing mesh presence/announce cadence + a single relay pane-exists check with timeout ONLY when a verdict is about to flip to gone (never periodic per-lane relay pings). UI: the state chips render through task_03bf8da6's Working-on row (working=presence pulse, idle-stalled=amber, report-overdue=amber clock, pane-gone=red, peer-offline=grey moon) — coordinate, do not build a second chip system. PROMPT/REPORT DISCIPLINE: already owned by task_03bf8da6 part 3 (auto-fill + report refusal) — this task DEPENDS on it, does not duplicate it. MINIMAL PRE-RELEASE CORE if time pressures: state derivation + pane-gone/idle-stalled flags + strides + orchestrator notify (skip ping-once and peer-offline nuance -> follow-up); the ladder and mesh states are the full acceptance.
role_guidance: 'Rust daemon worker, strong; read plan reconcile drift logic + agent_tracker + mesh presence first; coordinate explicitly with task_03bf8da6 (fields+chips) and task_d1450940 (shared helper). Sequence: after task_03bf8da6 lands its auto-fill (the watchdog needs populated lanes to watch).'
