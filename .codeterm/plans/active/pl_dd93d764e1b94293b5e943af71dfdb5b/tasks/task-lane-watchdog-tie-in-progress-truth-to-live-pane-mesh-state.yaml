name: 'Task-lane watchdog: tie in_progress truth to live pane/mesh state'
type: feature
model: gpt-5.5/high
model_rationale: Daemon subsystem with escalation semantics and event-driven constraints; strong model for the core, chips ride the observability lane
acceptance_criteria:
- 'Shared liveness helper: reconcile, watchdog (and plan lanes when it lands) return identical verdicts on a fixture matrix (unit-proven, one implementation)'
- 'Live drill on dev: kill a worker pane -> task flagged needs-reassign + stride + orchestrator nudge within 90s without any manual reconcile call'
- 'Idle-stall drill: idle worker beyond threshold -> ONE ping -> no response -> stalled label + stride + notify; a Working pane with no report past T_overdue gets report-overdue (amber), never stalled'
- 'Peer-offline drill (ubunta offline simulation): lane parks as peer-offline, NO needs-reassign flip; recovers to working when peer returns'
- Zero periodic per-lane mesh pings (log-proven over a 30min soak); local detection event-driven + one 60s threshold timer
- Watchdog never mutates task.status itself — only status_label + strides + notifications (grep + test)
test_plan: 'Unit: state derivation matrix (pane x tracker-status x activity x peer-presence), threshold crossings, ladder transitions; live dev drills per criteria (kill-pane, idle-stall, peer-offline via mesh offline command); 30min soak with log audit for ping discipline; capped runs, one at a time'
correctness: 'Conservative bias: false ''working'' beats false ''gone'' — never reassign on ambiguity; peer-offline is not pane-gone; respects lock ordering and never holds a guard across await; all thresholds config-gated with sane defaults; notifications go through existing channels (no new delivery path)'
