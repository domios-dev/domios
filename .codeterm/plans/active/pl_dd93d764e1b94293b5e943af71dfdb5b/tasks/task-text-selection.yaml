body: |
  Make task text selectable across plan task surfaces. Scope: Board task cards, List task rows, task detail overlay/slide-over surfaces, and any compact task chips that show meaningful text. Users must be able to drag-select/copy task titles, descriptions, criteria snippets, branch/agent labels, and body text where visible. Preserve card/row click-to-open behavior when the user clicks normally; do not open/navigate while the user is selecting text. Avoid global user-select:none on task content; use narrower drag handles or selection guards if needed.
