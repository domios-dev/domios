model_rationale: 'User-facing UX issue: task cards/rows/details must allow selecting and copying task text without click/drag handlers stealing selection.'
acceptance_criteria:
- Task title/body text can be selected and copied in Board, List, and Detail surfaces
- Normal click still opens the task detail; text drag selection does not trigger open/navigation
- Keyboard focus and accessible button semantics remain intact
test_plan: Add focused component tests for selection guard/click behavior where practical; manually verify in dev UI on Board/List/Detail after integration; run relevant PlanBoardView/PlanListView/PlanDetailOverlay tests and git diff --check.
correctness: Fix interaction semantics without disabling existing task open actions or breaking keyboard accessibility.
