body: |
  Make cancelled task counts/status chips in plan surfaces clickable. The user should be able to click the cancelled count in the plan summary/header/status area and immediately see the cancelled tasks, either by applying a cancelled filter in List/Board or opening a compact filtered task list. Preserve current count display. Do not show raw ids; show task titles/handles and allow opening task detail. Include empty state when there are no cancelled tasks.
