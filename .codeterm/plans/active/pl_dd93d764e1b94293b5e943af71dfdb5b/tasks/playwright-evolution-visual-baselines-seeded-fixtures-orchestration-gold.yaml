body: |
  SUITE EVOLUTION (round-103b, sequel to the hygiene task task_9d3ffaa2 — hygiene pays the debt, this raises the ceiling). STAGED, each stage lands independently: STAGE 1 — VISUAL BASELINES (first, highest payoff): Playwright toHaveScreenshot with checked-in goldens for the key surfaces at fixed fixture+viewport: Board (seeded plan), List, Canvas fit-zoom, sidebar with a seeded pair tree, task detail; maxDiffPixels tuned tight; baselines regenerate ONLY via an explicit script with a reviewed diff (a lane cannot silently move the golden); rationale: every visual regression this effort (misaligned canvas lines, overflow, glued timestamps, chip noise) was caught by the USER post-merge — pixel-diff catches them pre-gate. Platform note: goldens are per-platform (web-mode chromium is the stable render target; CDP/native excluded from pixel tests). STAGE 2 — SEEDED FIXTURES LIBRARY: generalize the existing perfFixtureProfile pattern into tests/playwright/fixtures/: deterministic world-states (plan-with-known-tasks, pane-tree-with-statuses, mid-stream chat transcript) injectable per test; migrate the 5 flakiest live-setup tests onto fixtures as proof. STAGE 3 — ORCHESTRATION GOLDEN TIER: one command (scripts or evals/orchestration-golden/) chaining the existing eval harnesses — creation-matrix core routes, restore-matrix identity oracle, refresh-cycle drill, report round-trip — as the per-release orchestration gate on the QA machine; no new tests, consolidation + one entrypoint + one summary table. STAGE 4 — COVERAGE MAP: script parses the (now-mandatory) spec headers into surface -> specs map, renders markdown; sections with zero coverage listed loudly — feeds planner gap-filing. STAGE 5 — POLICY PAIR: @quarantine tag (flaky test quarantined + task filed, never retried-to-green; reflection window counts quarantine size) and trace-on-failure default wired into QA report strides. Each stage gates separately; do not batch all five into one mega-lane.
role_guidance: QA-minded worker; sequence strictly after the hygiene task (headers are Stage 4's input); one stage per lane.
