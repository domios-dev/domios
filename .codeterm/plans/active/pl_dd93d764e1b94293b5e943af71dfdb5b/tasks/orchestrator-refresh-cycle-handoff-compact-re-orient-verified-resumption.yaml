id: task_d1ccca1dc0124114b35fa935bfbed0a5
name: 'Orchestrator refresh cycle: handoff -> compact -> re-orient -> verified resumption'
type: feature
model: claude/opus
model_rationale: 'Andrey''s explicit routing: designed by Planner, executed by Opus — a daemon-side ordered state machine where a subtle ordering bug silently kills the orchestrator''s continuity; needs a careful, strong implementer'
acceptance_criteria:
- Manual 'codeterm orchestrator refresh' runs S1-S5 as a verified-ordered state machine; drill transcript proves the order for BOTH providers (or documented capability fallback for the one lacking compact)
- 'Continuity proof: post-refresh current_focus matches the pre-refresh frontier; zero manual pings needed for resumption in 3 consecutive drills'
- 'Failure branches drilled: hung compact proceeds to re-orient; stranded resumption re-nudges once then alerts with a decision gate'
- Capability-keyed compact (no provider-id literals); [orchestration.refresh] config with after_reflection default OFF until drills pass
- 'Token accounting recorded: cycle cost vs drift cost, real numbers'
test_plan: Rust unit for the state machine transitions (table-driven, mirror wake.rs tests); scripted e2e drill series on dev for claude+codex orchestrators with transcript-order assertions and both failure branches; capped, one at a time; drill scripts land in evals/orchestrator-refresh/
correctness: 'NEVER strand the orchestrator: every branch ends in either verified resumption or a loud alert — silence is the one forbidden outcome; injections go through Messenger::deliver (wake-confirmer included); compaction detection uses structural signatures, never literal strings; the state machine must be idempotent (double-trigger coalesces, mirror wake.rs needle design)'
