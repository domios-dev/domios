body: |
  USER DIRECTIVE (round-93, verbatim intent: 'это очень важно' x3 — accepted for IMMEDIATE execution): the orchestrator burns giant token volume partly because long sessions accumulate drifted compaction summaries and re-derivation turns; after each retro/self-improvement the orchestrator should COMPACT and then RE-READ its ground truth (docs, plan state, handoff) so it continues from clean, small, accurate context. CodeTerm controls the pane, so this can be a DAEMON-ORCHESTRATED SEQUENCE with verified ordering — that ordering is the whole game: a refresh that compacts but never resumes is a dead orchestrator, worse than the waste it prevents. THE SEQUENCE (daemon-side state machine, each step advances ONLY on verified completion of the previous — reuse the wake-confirmer pattern from service/pty_io/wake.rs, which already solved delivery-vs-submit verification): (S1) HANDOFF SNAPSHOT: inject a request (or piggyback the reflection block) for the orchestrator to record a HANDOFF stride on the plan: current_focus, in-flight lanes with expected next events, unjudged reports, promises made to the user — ONLY the delta that lives in its head and not already in plan state; verify the stride landed (plan read-back) before proceeding. (S2) COMPACT: capability-keyed — the provider descriptor declares its compact command (/compact for Claude; codex per its CLI if supported; NO capability -> mode B fallback: clean pane restart with session resume via the provider's resume mechanism, or skip-with-log if neither exists — never pretend); send via Messenger::deliver (gets wake-confirmer submit verification for free). (S3) WAIT FOR COMPACTION SETTLE: detect completion via pane status + screen signature (compaction has a visible transcript signature per provider — fixture it, structural fingerprints rule applies: shape not literal copy), bounded timeout (default 120s) -> on timeout, log + proceed to S4 anyway (re-orientation is safe regardless; a hung compact must not strand the orchestrator). (S4) RE-ORIENT INJECTION, only after S3 settles: one fixed template message: 'Refresh complete. Re-orient: (1) codeterm plan state <plan_id>; (2) read your latest HANDOFF stride; (3) codeterm docs ORCHESTRATION --head 60 if role rules feel fuzzy; (4) re-derive the frontier and set current_focus. Resume work now.' — plus the mem-preferences block when task_5939a153 lands (same injection point, coordinate). (S5) VERIFY RESUMPTION: the orchestrator's next observable action within T (default 180s) must be a plan-state read or heartbeat — detected via CLI-call telemetry (same daemon-side seam the polling-smell detector uses) or pane status flip to Working; if absent: ONE re-nudge (the S4 template again), then alert (notification + planner-routed decision gate 'refresh stranded the orchestrator on pane X'). TRIGGERS: (a) manual 'codeterm orchestrator refresh [--pane X]' — ships first, the testable primitive; (b) post-reflection: after a reflection block's learning is recorded (the existing clear signal), config [orchestration.refresh] after_reflection=true, default OFF until the drill series proves reliability; (c) context-pressure trigger is OUT OF SCOPE (provider context introspection is not portable — do not build). TESTING IS THE ACCEPTANCE (user: 'важно протестировать правильно, что серия в правильном порядке'): a scripted e2e drill against dev, BOTH claude and codex orchestrator panes: seed a live orchestrator mid-plan with in-flight state -> trigger refresh -> assert the TRANSCRIPT ORDER: handoff stride timestamp < compact command < compaction signature < re-orient injection < first post-refresh plan-state call; assert the orchestrator's post-refresh current_focus matches the pre-refresh frontier (continuity proof — it resumed the RIGHT work, not just any work); timeout branches: hung compact -> S4 fires anyway; dead resumption -> re-nudge -> alert. The order assertions are the core deliverable — a passing drill IS the proof Andrey asked for. TOKEN ACCOUNTING in the report: measure one refresh cycle's cost (handoff+reorient turns) vs the measured cost of 10 post-drift turns — the cycle should pay for itself within a few turns; record the numbers, no vibes.
role_guidance: 'You are Opus, chosen deliberately for this: a daemon-side sequencing mechanism where subtle ordering bugs silently kill an orchestrator''s continuity. Read service/pty_io/wake.rs FIRST — it is the proven pattern (verified delivery, idempotent watcher, needle design) this extends from one step to five. Build the manual trigger first, drill it until the order assertions pass, only then wire the reflection trigger.'
