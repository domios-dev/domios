model_rationale: Cheap-model list rendering guard; isolated to plan list model/view tests.
acceptance_criteria:
- Done filter and text search no longer render hundreds of historical done rows by default.
- Users can still intentionally inspect all matching done rows via explicit expansion or virtualization.
