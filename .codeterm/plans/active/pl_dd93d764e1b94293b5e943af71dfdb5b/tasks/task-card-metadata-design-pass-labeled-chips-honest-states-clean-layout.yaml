body: |
  PRESENTATION POLISH of the Working-on row (pairs with task_03bf8da6 which owns data/recording; THIS lane owns how it reads — dispatch after or to the same worker). DEFECT LIST from the orchestrator's screenshot review of the first implementation: random small icons with no labels; repeated warning triangles stacking per card; 'pane gone' rendered for lanes that are DONE/accepted or legitimately closed (LOGIC RULE: liveness chips render ONLY for in_progress/in_review — done/cancelled/blocked cards show static metadata, never liveness warnings; an accepted lane whose pane closed is CLEAN, not gone); branch strings overflow oddly and TIMESTAMP GLUES TO BRANCH ('origin/feat/canvas-updates12m' — missing separator/element boundary); model/agent/pane/branch hierarchy unreadable; blocked/done cards carry inconsistent metadata sets. REDESIGN SPEC: (1) structured chip row with QUIET LABELS, fixed order: Agent (glyph+model), Pane (title/short-id, clickable -> focus when local; peer-labeled when remote), Peer (only when remote), Branch (icon + name, middle-truncated to keep the lane/<slug> tail readable, never gluing to neighbors), Age (own chip, relative), Gate (requested/queued/running from GATES data when present); (2) ONE visual grammar for absent/unknown states: a single muted 'missing' style (no triangle spam — at most ONE warning-tier chip per card, the most severe: gone > stalled > overdue > missing-branch); (3) zero raw '#'-slug rows (the handle line goes — detail surfaces carry it); (4) per-status metadata contract: in_progress/in_review = full row; blocked = reason label + gate ref only; done/cancelled = branch + closed-age only; (5) compact grace: at narrow width chips wrap to max 2 lines then collapse into a '+N' overflow popover — no mid-word truncation (ties to the list/board mobile lanes task_ba0445f2/task_4b7568d6 — reuse their breakpoints). ACCEPTANCE = SCREENSHOTS on THIS live plan: desktop fit, narrow 390px, one card of each status class, before/after side-by-side; plus the logic rule proven by a done-task-with-closed-pane card showing NO liveness warning.
role_guidance: Frontend worker with design taste; read the 03bf implementation + the mockup-attached mission-control precedent for the visual family; same-worker-as-03bf preferred.
