name: 'Migration sweep 2: Settings panels onto shared primitives'
type: implementation
model: sonnet
model_rationale: Continuation of Wave 27 after shared primitives and the first-run/new-session sweep. Settings panels are disjoint from Mission Control v2 and ROG native soak, so they can run in parallel now.
acceptance_criteria:
- Settings tabs touched by the sweep render with the shared primitives; bespoke button/chip/card/form-row counts shrink; no behavior regressions in settings workflows; net production LOC is negative or justified in the report; files remain under 1000 lines.
test_plan: Run the changed Settings component tests or add focused tests if none cover the migrated controls. Run npx tsx src/components/shared/shared.grepgate.test.ts and prove the baseline shrinks. Run npx tsc --noEmit. Run a targeted Playwright/web smoke against Settings with --timeout=30000 --global-timeout=600000 after curl health succeeds; capture before/after screenshots or explain why a screenshot is not available. Run git diff --check and scripts/check-file-sizes.sh.
correctness: 'Reuse shared primitives rather than duplicating new button/chip/card/form markup. Keep desktop/mobile behavior and accessibility intact: button type must not accidentally submit forms, disabled/loading states must remain honest, labels/errors stay associated with inputs, and no Settings business logic changes.'
