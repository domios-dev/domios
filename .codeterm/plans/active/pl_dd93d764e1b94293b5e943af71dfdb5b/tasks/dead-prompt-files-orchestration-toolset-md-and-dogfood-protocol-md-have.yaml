body: |
  CRITICAL FINDING (Planner survey, round-56, verified): src-tauri/src/prompts.rs loads prompts exclusively via include_str! — the full constant list (41 consts) contains NO loader for src-tauri/prompts/orchestration_toolset.md (17 lines) nor src-tauri/prompts/dogfood_protocol.md (11 lines). Both are DEAD FILES. Impact: orchestration_toolset.md was edited MULTIPLE times during this effort (planning_state gating, ownership rekey to planner_ref, heartbeat-pointer dedup — all by Planner/lanes believing it ships) — every one of those edits silently changed NOTHING in live agent behavior. Worse: the prompt-surgery lane (task_dc526c355bc644fda4799f03c7bc3ba0) has TEXT D pinned to land in this dead file. REQUIRED, in order: (1) git log --follow src-tauri/prompts/orchestration_toolset.md — establish whether it EVER had a loader and which commit orphaned it (likely when onboarding text was inlined into src-tauri/src/service/orchestrator_onboard.rs — that file carries an inline 'Full orchestration reference' block; diff the two for content overlap). (2) DECIDE per file: (a) orchestration_toolset.md — if its current 17 lines carry live-worthy content not already in orchestrator_onboard.rs/ORCHESTRATION.md, WIRE it (include_str const + insert into the orchestrator onboarding assembly next to the suffix) and add a wiring test; if fully redundant, DELETE it and port any unique lines into the live source; (b) dogfood_protocol.md — same decision tree. (3) Retarget TEXT D: coordinate with task_dc526c35 — TEXT D lands wherever the toolset content LIVES after this fix (wired file or orchestrator_onboard.rs); update that task's pin stride reference in your report. (4) GUARD RAIL so this class dies: add a unit test in prompts.rs that asserts every .md file under src-tauri/prompts/ is referenced by an include_str! in the crate (walk the dir at test time via env!(CARGO_MANIFEST_DIR); allowlist-free — a new prompt file without a loader fails the build's test run). This is the 'file exists but nothing loads it' cousin of the 'new field lies about legacy data' class — make it structurally impossible.
role_guidance: Rust worker with care for prompt semantics; read docs/PROMPTS.md first; coordinate explicitly with the prompt-surgery lane.
