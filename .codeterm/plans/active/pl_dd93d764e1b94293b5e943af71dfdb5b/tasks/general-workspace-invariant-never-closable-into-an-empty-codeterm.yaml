name: 'General workspace invariant: never closable into an empty CodeTerm'
type: bug
model: claude/sonnet
model_rationale: Invariant enforcement across backend ensure + frontend close paths; clear leads, bounded scope
acceptance_criteria:
- No user action sequence (enumerated close paths tested) can produce a CodeTerm without a General workspace containing picker or agent
- Backend recreates the General workspace if externally removed (event-driven, not just startup)
- Closing the last picker/agent in General respawns picker or is blocked (both paths tested)
- Session restore with zero restorable panes lands on the picker
test_plan: 'Reducer unit tests for every close action on the last-General-tab state; Playwright: close-path matrix incl. restart-with-empty-state; isolation-first, capped'
correctness: Protection must not break closing OTHER workspaces or normal tab closes; auto-repair must be idempotent (no duplicate General workspaces — dedup logic already exists, reuse it)
