body: |
  ANDREY'S SPEC (round-77, verbatim intent, design carefully — 'главное не нагружать бесполезными правилами — гайдить'). PART A — QUEUE-PRESSURE NUDGES (extends the existing plan_reminder_nudge plumbing, no new channel): (1) in_review pressure: >3 tasks sitting in_review (configurable) -> one periodic nudge 'N reports await your verdict, oldest Xh — judge or route to QA'; rate-limited (1/hour max), stops when the queue drains; (2) in_progress pressure: in_progress count above a threshold (default ~8) OR watchdog-flagged lanes accumulating -> 'revision nudge': suggest running the closeout sweep (plan lanes / reconcile); (3) DESIGN THE FAMILY, don't hardcode two cases: a small digest-rule table (condition over plan-state counters -> message template -> rate limit) so future nudges (stale blocked, unmerged-on-closed, gate-queue depth) are config entries, not code — but ship ONLY the two above enabled; more default-on rules require evidence they guide rather than nag. PART B — TOKEN/USAGE DIGEST IN HEARTBEATS (Andrey: 'это оч важно'): (1) the daemon already snapshots provider usage (codex /status parser with fixture matrix, claude usage) — PROMOTE from experimental to default-on: [usage] config section, enabled by default when a provider with usage capability is installed; (2) GENERALIZED: keyed on a provider CAPABILITY (usage_snapshot) — every installed provider that can report budgets participates; never provider-id lists (hard rule); (3) FRESHNESS: at heartbeat assembly, if the last usage snapshot is older than 3 min, refresh first (bounded — a hung provider must not delay the heartbeat: stale-with-timestamp beats blocking); (4) HEARTBEAT BLOCK, compact: one line per provider — 'claude: 62% of 5h window (resets 14:20) | codex: 91% weekly — REDUCE'; (5) BALANCING GUIDANCE at >80% (Andrey's threshold): append one guidance line — 'codex >80%: prefer routing new dispatches to claude/cursor until reset' — GUIDANCE in the digest, not enforcement (the orchestrator weighs it; routing why still rules); (6) OPTIONAL separate digest cadence: usage-only mini-digest more frequent than full heartbeats, config-gated, DEFAULT OFF until dogfood proves it earns attention. ANTI-BLOAT ACCEPTANCE: total prompt/heartbeat growth from this task <= 6 lines in the worst case; every nudge names a concrete next command; nothing fires when thresholds are not crossed (silent by default).
role_guidance: Backend worker in heartbeat/reminders + provider usage paths; read the codex /status fixture work (task_24b2badf lane) and the existing experimental usage code first.
