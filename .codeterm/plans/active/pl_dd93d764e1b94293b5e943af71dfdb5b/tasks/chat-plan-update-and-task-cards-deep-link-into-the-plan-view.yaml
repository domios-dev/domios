body: |
  USER INTENT: plan updates and task mentions in chat must be CLICKABLE — from the card in chat straight to that plan/task in the plan view ('прям с этих карточек в чате перейти в план'). CURRENT STATE (leads): packages/chat-ui/src/codeterm/templates.ts has NO plan templates — 'codeterm plan record/task add/task update/state' invocations fall through to generic command rendering; reports and strides mentioning task ids render as plain text. The plan surface opens today via the sidebar entry (src/components/Sidebar/WorkspacePlanEntry.tsx, data-workspace-action='plan', onClick passed from Sidebar) — trace that handler to find/extract the canonical 'open plan view for plan X (optionally focused on task Y)' store action; if it is inline-only, lift it into the multiplexer store so chat can call it. REQUIRED: (1) template entries for the plan command family: 'plan task add' -> card 'Task created: <name>' with plan+task ids; 'plan record' -> 'Plan updated: <step kind/first line>'; 'plan task update --status' -> status-change card; 'plan state' stays compact; (2) each card gets a click affordance (whole card or a quiet 'open in plan' suffix) that opens the plan view for that plan_id and, when a task id is present, opens/scrolls to that task's detail (Board card focus or List row + detail panel — reuse whatever detail-focus mechanism the board already has); (3) task-id mentions inside report/send bubbles (pattern task_[0-9a-f]{32} together with a pl_ id in context) become inline links with the same deep-link behavior — conservative matching, no false links on arbitrary hex; (4) cross-workspace correctness: the plan may belong to another workspace — switch workspace + open plan, same as sidebar does; if the plan no longer exists (deleted), a quiet toast, not a crash. Component tests for template rendering + link extraction; Playwright: click a task card in chat -> plan view opens with that task focused (data-testids already exist on the shell).
role_guidance: Frontend worker; coordinate with the sent-bubble lane (task_41669c2a) — same files (templates.ts/CodetermCard), sequence or share a branch to avoid conflicts.
