- id: sec_urnv7g
  title: UI verification via Playwright
  handle: ui-verification
  tags: []
  body: |-
    **WHAT:** Playwright (web-mode on macOS) asserts plans/specs/tasks render correctly from v2 storage: board/list/canvas views open, markdown bodies render via RichMarkdown, task detail shows criteria/test-plan.

    **WHY:** Storage and UI were rewritten in the same window; only a browser-level assertion proves the user-facing surface. Existing golden project covers chat, not plan canvas bodies.

    **Acceptance gate:** a spec under tests/playwright asserting: plan opens, a known markdown body renders as HTML (not literal `**`), task detail panel shows quality fields. Verified alone first, then in golden.
  subsections: []
