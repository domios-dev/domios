- id: sec_hohado
  title: Recreate plans as load test
  handle: plans-load-test
  tags: []
  body: |-
    **WHAT:** Read every real plan and recreate a FRESH COPY through the public API (new ids, full v2 structure: goal.yaml, spec.yaml, plan.yaml, tasks/*.yaml, strides) - then diff copy vs original semantically.

    **WHY:** Exercises the entire write path at real scale (248-task plan) and proves the storage rewrite end-to-end. Decision (Andrey): copies only, originals untouched; copies deleted after verification.

    **Acceptance gate:** copy of pl_c8a72a9a (248 tasks) created via CLI/batch, semantic diff clean, churn = only the copy dir, copies removed.
  subsections: []
