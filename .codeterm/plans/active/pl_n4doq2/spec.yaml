- id: sec_btfggm
  title: Truthful build hash in health
  handle: build-hash-stamp
  tags: []
  body: |-
    **WHAT:** `/api/health` `build` must reflect the compiled commit.

    **WHY:** build.rs stamps the git hash without `rerun-if-changed=.git/HEAD`, so incremental builds keep a stale hash - we shipped 3 self-installs where the ONLY trustworthy freshness signal was binary md5 or behavioural probes.

    **Acceptance gate:** two consecutive commits + incremental builds report different hashes; documented in dev-run skill.
  subsections: []
