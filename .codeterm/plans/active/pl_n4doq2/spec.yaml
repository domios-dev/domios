  attachments: []
- id: sec_w6edvo
  title: Body patch operations
  handle: body-patch-ops
  tags: []
  body: |-
    **WHAT:** Append/patch semantics for bodies instead of full replacement.

    **WHY:** `SetTaskBody`/`--body` resend the entire body to change one line - the single biggest token tax when iterating on prose. `plan locate` + direct Edit already covers in-place edits locally; patch ops close the gap for RPC/mesh callers.

    **Acceptance gate:** `--append-body` on task update + an `AppendTaskBody` batch op; documented in PLAN-EDITING.
  subsections: []
  canvas:
    x: null
    y: null
    collapsed: false
  attachments: []
- id: sec_hy2qvn
  title: Short ids for existing entities
  handle: short-ids-regen
  tags: []
  body: |-
    **WHAT:** Regenerate legacy 32-hex ids (pl_/sp_/sec_/task_) to short base36 slugs across existing plans, updating every cross-reference (section_ids, spec_links, primary_spec_id, parent_task_id, lineage, stride logs, canvas layout keys).

    **WHY:** New entities already mint 6-char ids; old entities drag 32-hex ids that bloat every yaml, log line, and agent prompt.

    **Constraint:** One-off migration script (python), deep-compare gated, backup first - NOT a runtime shim. Daemon restart after.

    **Open question:** rewrite ids inside strides.jsonl history or leave history verbatim (append-only principle vs consistency)?
  subsections: []
