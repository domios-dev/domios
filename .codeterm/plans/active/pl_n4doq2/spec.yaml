sections:
- id: sec_p0e9tl
  title: Batch mutations in one call
  handle: batch-mutations
  tags: []
  body: |-
    **WHAT:** One CLI invocation carrying N mutation ops.

    **WHY:** Closing out a work session today costs N round-trips (`task update` x statuses + milestones + links); each call pays CLI startup, RPC, and hint noise. The daemon already exposes `plan.batch` (UpsertTask, SetTaskStatus, SetTaskBody, AddMilestone, UpsertSpecSection, LinkSpecSection, ...) but only `plan record` fronts a subset.

    **Acceptance gate:** `codeterm plan batch --file ops.json` (or stdin) executes an op list atomically; errors name the failing op index; `--json` output is machine-lean.
  subsections: []
