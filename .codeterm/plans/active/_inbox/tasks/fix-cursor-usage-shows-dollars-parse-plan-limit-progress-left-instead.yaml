body: |
  Cursor provider usage/status shows dollars instead of plan-limit progress. User wants "how much limit is left" (a % progress like claude/codex), not spend dollars.

  ## Diagnosis (verified in code)
  - `plugins/provider-cursor/src/plugin.ts` `fetchUsage()` (line ~272) calls Cursor Connect-RPC API (GetMonthlyInvoice, GetAggregatedUsageEvents, GetCurrentPeriodUsage) and extracts `planUsage.{limit, remaining, includedSpend}` as dollars -> cents.
  - `parseUsage()` (line ~316) fills ONLY `spend_*` fields and leaves `session_pct`/`weekly_pct` null BY DESIGN (comment: "billed by spend"). That assumption is outdated — Cursor plans are now rate-limit/progress based (cursor-agent /usage shows % bars).
  - Consequences: `src/components/Usage/UsageBubble.tsx` line 65 `isSpend = spend_cents != null` -> renders a neutral $ pill, no warn/danger classify(), and `src-tauri/src/usage/projection.rs` burn-rate engine keys ONLY off session_pct/weekly_pct -> cursor gets no projection at all.
  - Unit ambiguity already flagged in code: `cursorDollarsToCents` comment (line ~823) admits field units are unverified.

  ## Plan (mostly plugin-side, one tiny frontend tweak)
  1. PROBE (evidence first): with the live keychain token (`security find-generic-password -s cursor-access-token -a cursor-user -w`), dump raw JSON of GetCurrentPeriodUsage (+ siblings) and run cursor-agent /usage side-by-side. Map which fields produce the % bars the TUI shows (plan %, maybe separate burst/session window). Decide pct formula: e.g. (limit-remaining)/limit*100 or includedSpend/limit*100 — and confirm whether limit/remaining are really dollars.
  2. PLUGIN FIX (plugins/provider-cursor/src/plugin.ts): compute plan-progress pct in parseUsage; fill weekly_pct + weekly_resets_at_ms (= invoice periodEnd) for the billing/plan window; fill session_pct only if the probe reveals a shorter rate-limit window. Keep spend_* fields as secondary detail. Update tests (tests/plugin.test.ts fetchUsage/parseUsage block, lines ~600-634) with a real captured fixture. Rebuild plugin.js, npm run sync:versions + check:versions (system-plugin hash lockstep).
  3. FRONTEND PRIORITY TWEAK (1 line): UsageBubble.tsx — prefer pct rendering when session_pct/weekly_pct present even if spend_cents is set: `isSpend = spend_cents != null && weekly_pct == null && session_pct == null`. Keep $ in UsageDetail as secondary row.
  4. VERIFY: dev restart, open a cursor pane, bubble shows N% with classify colors; usage projection rows appear for provider=cursor.

  ## Notes
  - Fixable ~90% in the plugin; only the bubble priority line is core UI.
  - Do NOT branch on provider id in core — the pct-preference tweak is capability/data-shaped, not provider-named.
  - Out of scope of pl_5o7ukw (workspace split) — separate small lane.
