# Native Blueprint v2. Check with explicit author bindings before apply.
schema_version: 2
kind: watch
name: '{{name}}'
note: Wait for a build verdict and notify on either terminal result.
intent: Wait for a build verdict and notify on either terminal result.
inputs:
  name:
    type: string
    description: Short Blueprint name, 3 to 40 characters
  failed_pattern:
    type: string
    description: Failed pattern
  passed_pattern:
    type: string
    description: Passed pattern
  read_only_build_probe:
    type: string
    description: Read only build probe
steps:
- id: source
  uses: probe
  with:
    command:
      input: read_only_build_probe
  every:
    lit: 20s
  timeout:
    lit: 1h
- id: decide
  uses: ask
  with:
    question:
      lit: classify-build-result
  buckets:
  - waiting
  - passed
  - failed
  routes:
    waiting: '@stop'
    passed: passed_1
    failed: failed_1
  matches:
    passed:
      input: passed_pattern
    failed:
      input: failed_pattern
  until: passed
- id: passed_1
  uses: notify
  routes:
    done: '@stop'
- id: failed_1
  uses: notify
  routes:
    done: '@stop'
