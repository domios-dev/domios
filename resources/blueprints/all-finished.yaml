# Native Blueprint v2. Check with explicit author bindings before apply.
schema_version: 2
kind: watch
name: '{{name}}'
note: Use one verdict probe for all work; keep `waiting` silent and route only `alldone`.
intent: Use one verdict probe for all work; keep `waiting` silent and route only `alldone`.
inputs:
  name:
    type: string
    description: Short Blueprint name, 3 to 40 characters
  all_terminal_pattern:
    type: string
    description: All terminal pattern
  one_verdict_probe:
    type: string
    description: One verdict probe
steps:
- id: source
  uses: probe
  with:
    command:
      input: one_verdict_probe
  every:
    lit: 20s
  timeout:
    lit: 1h
- id: decide
  uses: ask
  with:
    question:
      lit: classify-all-work
  buckets:
  - waiting
  - alldone
  routes:
    waiting: '@stop'
    alldone: alldone_1
  matches:
    alldone:
      input: all_terminal_pattern
  until: alldone
- id: alldone_1
  uses: notify
  routes:
    done: '@stop'
