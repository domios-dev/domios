# Native Blueprint v2. Check with explicit author bindings before apply.
schema_version: 2
kind: pipeline
name: Github
note: Watch run, jobs or PR checks; report failed jobs early while CI is in progress.
intent: Watch run, jobs or PR checks; report failed jobs early while CI is in progress.
inputs:
  id:
    type: integer
    description: Positive run or pull request ID
  interval:
    type: string
    default: 60s
    description: Probe interval, at least 10s
  repo:
    type: string
    description: GitHub owner/repository
  resource:
    type: string
    default: run
    description: Resource
    enum:
    - run
    - jobs
  timeout_ms:
    type: integer
    default: 60000
    description: Probe timeout in milliseconds
owner: team
trigger:
  type: schedule
  every:
    input: interval
steps:
- id: step_1
  name: Check source
  uses: github
  with:
    repo:
      input: repo
    resource:
      input: resource
    id:
      input: id
    timeout_ms:
      input: timeout_ms
  routes:
    done: '@next'
    failed: '@stop'
    failing: '@next'
result:
  to: owner
