# Native Blueprint v2. Check with explicit author bindings before apply.
schema_version: 2
kind: watch
name: '{{name}}'
note: Keep watching a bounded retry process until its pass result arrives.
intent: Keep watching a bounded retry process until its pass result arrives.
inputs:
  name:
    type: string
    description: Short Blueprint name, 3 to 40 characters
  passed_pattern:
    type: string
    description: Passed pattern
  retry_status_probe:
    type: string
    description: Retry status probe
steps:
- id: source
  uses: probe
  with:
    command:
      input: retry_status_probe
  every:
    lit: 20s
  timeout:
    lit: 1h
- id: decide
  uses: ask
  with:
    question:
      lit: classify-retry-result
  buckets:
  - waiting
  - passed
  routes:
    waiting: '@stop'
    passed: passed_1
  matches:
    passed:
      input: passed_pattern
  until: passed
- id: passed_1
  uses: notify
  routes:
    done: '@stop'
