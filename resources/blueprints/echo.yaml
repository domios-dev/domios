# Native Blueprint v2. Check with explicit author bindings before apply.
schema_version: 2
kind: pipeline
name: Echo example
note: Echo an author-supplied message and return it to the owner tab.
intent: Echo an author-supplied message and return it to the owner tab.
inputs:
  message:
    type: string
    description: Message
    default: ready
owner: team
trigger:
  type: input
  kind:
    lit: text
  source:
    input: message
steps:
- id: echo
  uses: filter
  with:
    pattern:
      lit: (?s).*
    bucket:
      lit: matched
  routes:
    matched: '@stop'
result:
  to: owner
