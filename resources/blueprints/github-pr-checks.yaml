# Native Blueprint v2. Check with explicit author bindings before apply.
schema_version: 2
kind: pipeline
name: Github Pr Checks
note: Wait for one pull request check set to complete.
intent: Wait for one pull request check set to complete.
inputs:
  id:
    type: integer
    description: Positive run or pull request ID
  interval:
    type: string
    default: 60s
    description: Probe interval, at least 10s
  repo:
    type: string
    description: GitHub owner/repository
  timeout_ms:
    type: integer
    default: 60000
    description: Probe timeout in milliseconds
owner: team
trigger:
  type: schedule
  every:
    input: interval
steps:
- id: step_1
  name: Check source
  uses: github
  with:
    repo:
      input: repo
    resource:
      lit: pr_checks
    id:
      input: id
    timeout_ms:
      input: timeout_ms
  routes:
    done: '@next'
    failed: '@stop'
result:
  to: owner
