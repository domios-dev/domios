# Native Blueprint v2. Check with explicit author bindings before apply.
schema_version: 2
kind: watch
name: '{{name}}'
note: Watch one PR until all checks pass; notify on a failing check.
intent: Watch one PR until all checks pass; notify on a failing check.
inputs:
  name:
    type: string
    description: Short Blueprint name, 3 to 40 characters
  pr_verdict_probe:
    type: string
    description: Read-only command printing waiting, passed or failed for one PR.
steps:
- id: source
  uses: probe
  with:
    command:
      input: pr_verdict_probe
  every:
    lit: 60s
  timeout:
    lit: 3h
- id: decide
  uses: ask
  with:
    question:
      lit: classify-pr-checks
  buckets:
  - waiting
  - passed
  - failed
  routes:
    waiting: '@stop'
    passed: passed_1
    failed: failed_1
  matches:
    waiting:
      lit: (?m)^waiting\r?$
    passed:
      lit: (?m)^passed\r?$
    failed:
      lit: (?m)^failed\r?$
  until: passed
  rearm_on_change:
  - failed
- id: passed_1
  uses: notify
  routes:
    done: '@stop'
- id: failed_1
  uses: notify
  routes:
    done: '@stop'
