# Native Blueprint v2. Check with explicit author bindings before apply.
schema_version: 2
kind: watch
name: Team Watch
note: Observe one Team member's tab and notify when the watched state changes.
intent: Observe one Team member's tab and notify when the watched state changes.
inputs:
  changed_pattern:
    type: string
    description: Changed pattern
  tab_id:
    type: string
    description: Tab id
steps:
- id: source
  uses: observe
  with:
    kind:
      lit: tab
    id:
      input: tab_id
  every:
    lit: 20s
  timeout:
    lit: 1h
- id: decide
  uses: ask
  with:
    question:
      lit: classify-member-state
  buckets:
  - waiting
  - changed
  routes:
    waiting: '@stop'
    changed: changed_1
  matches:
    changed:
      input: changed_pattern
- id: changed_1
  uses: notify
  routes:
    done: '@stop'
