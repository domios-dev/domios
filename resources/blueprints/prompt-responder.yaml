# Native Blueprint v2. Check with explicit author bindings before apply.
schema_version: 2
kind: watch
name: Prompt Responder
note: Request a safe response to a supported permission prompt on one observed agent tab.
intent: Request a safe response to a supported permission prompt on one observed agent tab.
inputs:
  permission_pattern:
    type: string
    description: Permission pattern
  tab_id:
    type: string
    description: Tab id
steps:
- id: source
  uses: observe
  with:
    kind:
      lit: tab
    id:
      input: tab_id
  every:
    lit: 20s
  timeout:
    lit: 1h
- id: decide
  uses: ask
  with:
    question:
      lit: classify-current-prompt
  buckets:
  - permission
  routes:
    permission: permission_1
  matches:
    permission:
      input: permission_pattern
  until: permission
- id: permission_1
  uses: respond_prompt
  with:
    target:
      lit: permission
  routes:
    done: '@stop'
