# Native Blueprint v2. Check with explicit author bindings before apply.
schema_version: 2
kind: pipeline
name: Http Health
note: Watch an HTTP endpoint and report up/down with the response code. Redirects are not followed.
intent: Watch an HTTP endpoint and report up/down with the response code. Redirects are not followed.
inputs:
  expected_status:
    type: string
    default: 2xx
    description: Expected status
  interval:
    type: string
    default: 20s
    description: Probe interval, at least 10s
  timeout_ms:
    type: integer
    default: 3000
    description: Probe timeout in milliseconds
  url:
    type: string
    description: HTTP endpoint URL
owner: team
trigger:
  type: schedule
  every:
    input: interval
steps:
- id: step_1
  name: Check source
  uses: http
  with:
    url:
      input: url
    expected_status:
      input: expected_status
    timeout_ms:
      input: timeout_ms
  routes:
    up: '@next'
    down: '@next'
    failed: '@stop'
result:
  to: owner
