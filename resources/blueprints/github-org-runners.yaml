# Native Blueprint v2. Check with explicit author bindings before apply.
schema_version: 2
kind: pipeline
name: Github Org Runners
note: Watch labelled self-hosted runner availability and its online count.
intent: Watch labelled self-hosted runner availability and its online count.
inputs:
  interval:
    type: string
    default: 60s
    description: Probe interval, at least 10s
  label:
    type: string
    default: self-hosted
    description: Runner label to match
  org:
    type: string
    description: GitHub organization
  timeout_ms:
    type: integer
    default: 60000
    description: Probe timeout in milliseconds
owner: team
trigger:
  type: schedule
  every:
    input: interval
steps:
- id: step_1
  name: Check source
  uses: github
  with:
    org:
      input: org
    resource:
      lit: runners
    label:
      input: label
    timeout_ms:
      input: timeout_ms
  routes:
    online: '@next'
    offline: '@next'
    failed: '@stop'
result:
  to: owner
