<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in to Domios</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main>
    <h1>Sign in to Domios</h1>
    <p>Continue to your desktop with your account.</p>
    <div id="providers" hidden>
      <button id="google" type="button">Continue with Google</button>
      <button id="facebook" type="button">Continue with Facebook</button>
      <button id="apple" type="button" hidden>Continue with Apple</button>
      <button id="local" type="button" hidden>Continue with local account</button>
      <form id="email-form">
        <label for="email">Email address</label>
        <input id="email" type="email" autocomplete="email" required maxlength="254">
        <button type="submit" id="email-submit">Send sign-in link</button>
      </form>
    </div>
    <p id="status" role="status" aria-live="polite">Preparing sign-in…</p>
  </main>
</body>
</html>
