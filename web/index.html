<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f8fa" media="(prefers-color-scheme: light)" />
    <meta name="description" content="The distributed OS for AI agents. Give your agents a place to live, coordinate as teams, and work across your machines. Available for macOS, Windows, and Linux." />
    <meta property="og:title" content="Domios" />
    <meta property="og:description" content="The distributed OS for AI agents. A home on every machine. A team across them." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://domios.dev" />
    <meta property="og:image" content="https://domios.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="Domios. Agents live here. The distributed OS for AI agents." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Domios" />
    <meta name="twitter:description" content="The distributed OS for AI agents. A home on every machine. A team across them." />
    <meta name="twitter:image" content="https://domios.dev/og-image.png" />
    <meta name="twitter:image:alt" content="Domios. Agents live here. The distributed OS for AI agents." />
    <meta name="color-scheme" content="dark light" />
    <link rel="canonical" href="https://domios.dev" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Domios</title>
    <script>
      (() => {
        let theme;
        try { theme = localStorage.getItem('domios-theme'); } catch {}
        document.documentElement.dataset.theme = theme === 'light' || theme === 'dark'
          ? theme : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.querySelectorAll('meta[name="theme-color"]').forEach(meta => meta.setAttribute('content', document.documentElement.dataset.theme === 'dark' ? '#0d1117' : '#f6f8fa'));
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Domios is the distributed OS for AI agents. <a href="https://github.com/rollacode/codeterm-releases/releases/latest">Download for macOS, Windows, or Linux</a>.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
