<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d1117" />
    <meta name="description" content="The OS for AI agents. Give your agents a place to live, coordinate as teams, and work across your machines. Available for macOS, Windows, and Linux." />
    <meta property="og:title" content="Domios — Agents live here." />
    <meta property="og:description" content="The OS for AI agents. Your agents, your machines. Working together." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://domios.dev" />
    <meta name="color-scheme" content="dark light" />
    <link rel="canonical" href="https://domios.dev" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Domios — Agents live here.</title>
    <script>
      (() => {
        let theme;
        try { theme = localStorage.getItem('domios-theme'); } catch {}
        document.documentElement.dataset.theme = theme === 'light' || theme === 'dark'
          ? theme : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Domios is the OS for AI agents. <a href="https://github.com/rollacode/codeterm-releases/releases/latest">Download for macOS, Windows, or Linux</a>.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
