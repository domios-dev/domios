# Codex prompt-idle regression replay.
# Captures the exact failure mode seen in dev: Codex is visibly back at the
# composer prompt, but Chat UI remains stuck in Working because prompt redraws or
# cursor churn prevent semantic-idle from crossing the old threshold.
id: codex_prompt_idle_regression_v1
title: Codex ready prompt must clear Working
providers: [codex]
first_capture: codex
workspace_setup:
  files: []
  terminal: { cols: 120, rows: 32 }

pacing:
  strategy: adaptive_stability
  min_dwell_ms: 900
  stability_quiet_ms: 1800
  max_wait_ms: 90000
  tolerate_volatile_rows: true

focus_churn:
  enabled: true
  cycles: 6
  delay_ms: 250

turns:
  - n: 1
    user: "йо"
    expect: { phases: [working, idle], card: none, negative: casual_short }
    idle_after_ms: 10000
    focus_churn: { enabled: true, cycles: 8, delay_ms: 250 }
  - n: 2
    user: "просто проверяю связь, ответь одной короткой фразой и остановись"
    expect: { phases: [working, idle], card: none, negative: ready_prompt_after_short_turn }
    idle_after_ms: 15000
    focus_churn: { enabled: true, cycles: 10, delay_ms: 250 }
  - n: 3
    user: "Create a tiny TODO/checklist if your UI supports it with exactly three items, then answer with exactly one sentence."
    expect: { phases: [working, idle], card: none, target: todo_surface }
    idle_after_ms: 15000
    focus_churn: { enabled: true, cycles: 10, delay_ms: 250 }

stop:
  after_final_idle_ms: 12000
  focus_churn: true

oracle:
  forbid_card_on_all_negative_frames: true
  require_no_working_during_idle_holds: true
