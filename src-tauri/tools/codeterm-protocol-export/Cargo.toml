[package]
name = "codeterm-protocol-export"
version = "0.0.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[lints]
workspace = true

[dependencies]
codeterm-mem = { path = "../../crates/codeterm-mem", default-features = false }
codeterm-agent-model = { path = "../../crates/codeterm-agent-model", default-features = false }
codeterm-worker-services = { path = "../../crates/codeterm-worker-services", default-features = false }
codeterm-storage = { path = "../../crates/codeterm-storage", default-features = false }
codeterm-plugin = { path = "../../crates/codeterm-plugin" }
codeterm-mesh = { path = "../../crates/codeterm-mesh" }
codeterm-pty = { path = "../../crates/codeterm-pty" }
codeterm-types = { path = "../../crates/codeterm-types" }
ts-rs = { version = "12.0.1", features = ["serde-json-impl", "no-serde-warnings"] }
workspace-hack = { version = "0.1", path = "../../crates/workspace-hack" }
