[package]
license = "AGPL-3.0-only"
name = "codeterm-devtools"
version = "0.0.0"
edition = "2021"
publish = false

[lints]
workspace = true

[features]
default = ["embeddings"]
embeddings = ["codeterm-service-core/embeddings"]
# Workspace-wide all-target builds skip these harnesses unless a caller asks for them.
dev-tools = []

[dependencies]
workspace-hack = { version = "0.1", path = "../../crates/workspace-hack" }
codeterm-service-core = { path = "../../crates/codeterm-service-core", default-features = false }
codeterm-decision = { path = "../../crates/codeterm-decision" }
codeterm-types = { path = "../../crates/codeterm-types" }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
codeterm-service-core = { path = "../../crates/codeterm-service-core", default-features = false, features = ["test-support"] }
codeterm-bridge = { path = "../../crates/codeterm-bridge" }
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.23"
tokio = { version = "1", features = ["full", "test-util"] }

# Cross-domain integration tests that belong to no single domain crate.
[[test]]
name = "main"
path = "tests/main.rs"

[[test]]
name = "bridge_migrate_test"
path = "tests/bridge_migrate_test.rs"
test = false

[[test]]
name = "chatpipeline_seams_test"
path = "tests/chatpipeline_seams_test.rs"
test = false

# Deterministic mem-recall bench runner. Default and stub modes run offline
# without an LLM or embeddings; live decision mode is an explicit owner-run option.
[[bin]]
name = "mem-bench"
path = "src/bin/mem_bench.rs"
required-features = ["dev-tools"]

[[bin]]
name = "mem_ab_bench"
path = "src/bin/mem_ab_bench.rs"
required-features = ["dev-tools"]

# Fast parser-iteration harness: run a provider's usage parser against a raw text fixture.
[[bin]]
name = "parser-eval"
path = "src/bin/parser_eval.rs"
required-features = ["dev-tools"]

[[bin]]
name = "storage-verify"
path = "src/bin/storage-verify.rs"
required-features = ["dev-tools"]

# One-off legacy plan.json to store_v2 yaml migration. Rehearse on a project copy with --dry-run first.
[[bin]]
name = "convert-plan-storage"
path = "src/bin/convert-plan-storage.rs"
required-features = ["dev-tools"]
