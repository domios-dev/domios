[package]
name = "codeterm-sentinel"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
codeterm-blueprint-types = { path = "../codeterm-blueprint-types" }
codeterm-cron = { path = "../codeterm-cron" }
codeterm-paths = { path = "../../../crates/codeterm-paths" }
codeterm-plugin = { path = "../codeterm-plugin" }
codeterm-pty = { path = "../codeterm-pty" }
codeterm-storage = { path = "../codeterm-storage" }
codeterm-types = { path = "../codeterm-types" }
codeterm-util = { path = "../codeterm-util" }
log = "0.4"
parking_lot = "0.12"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
rusqlite = { version = "0.32", features = ["bundled", "blob", "functions", "load_extension"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
wait-timeout = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
