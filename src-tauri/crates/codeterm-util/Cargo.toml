[package]
name = "codeterm-util"
version = "1.6.2"
edition = "2021"

[dependencies]
codeterm-paths = { path = "../../../crates/codeterm-paths" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
parking_lot = "0.12"
regex = "1"
log = "0.4"
uuid = { version = "1", features = ["v4"] }
vt100 = "0.16"
tokio = { version = "1", features = ["process"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["processenv", "processthreadsapi", "handleapi", "tlhelp32"] }
winreg = "0.10"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
