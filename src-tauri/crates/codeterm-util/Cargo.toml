[package]
name = "codeterm-util"
version = "1.6.2"
edition = "2021"

[dependencies]
codeterm-paths = { path = "../../../crates/codeterm-paths" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
parking_lot = "0.12"
log = "0.4"
uuid = { version = "1", features = ["v4"] }
vt100 = "0.16"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["processenv", "processthreadsapi", "handleapi", "tlhelp32"] }
winreg = "0.10"

[dev-dependencies]
tempfile = "3"
