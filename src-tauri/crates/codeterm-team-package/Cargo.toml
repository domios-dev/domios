[package]
license = "Apache-2.0"
name = "codeterm-team-package"
version = "0.0.0"
edition = "2021"

# Portable by design: no internal crate, so a standalone or wasm validator can be built from it.
[dependencies]
include_dir = "0.7"
schemars = "0.8.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "12.0.1", features = ["serde-json-impl", "no-serde-warnings"] }
yaml-rust2 = { version = "0.13", default-features = false }
zip = { version = "9.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# The standalone reference validator; it adds no dependency beyond the library's.
[[bin]]
name = "atp-validate"
path = "src/bin/atp-validate/main.rs"

[lints]
workspace = true
