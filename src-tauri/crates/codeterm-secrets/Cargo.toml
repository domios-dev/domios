[package]
name = "codeterm-secrets"
version = "1.6.2"
edition = "2021"

[dependencies]
hostname = "0.4.2"
async-trait = "0.1"
codeterm-config = { path = "../codeterm-config" }
codeterm-paths = { path = "../../../crates/codeterm-paths" }
codeterm-plugin = { path = "../codeterm-plugin" }
codeterm-util = { path = "../codeterm-util" }
dirs = "6"
log = "0.4"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "macros"] }
zeroize = { version = "1", features = ["zeroize_derive"] }
