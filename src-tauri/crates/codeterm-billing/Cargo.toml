[package]
name = "codeterm-billing"
version = "0.1.0"
edition = "2021"

[dependencies]
codeterm-account = { path = "../codeterm-account" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }
url = "2"

[lints]
workspace = true
