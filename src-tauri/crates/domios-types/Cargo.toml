[package]
license = "AGPL-3.0-only"
name = "domios-types"
version = "0.0.0"
edition = "2021"

[dependencies]
domios-wire = { path = "../domios-wire" }
domios-provider-signals = { path = "../domios-provider-signals" }
domios-notify-types = { path = "../domios-notify-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ts-rs = { version = "12.0.1", features = ["serde-json-impl", "no-serde-warnings"] }
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
