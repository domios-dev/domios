[package]
name = "codeterm-neighbors"
version = "0.0.0"
edition = "2021"
license = "AGPL-3.0-only"

[lints]
workspace = true

[features]
default = ["runtime"]
runtime = ["dep:googleapis-tonic-google-firestore-v1", "dep:prost-types", "dep:tokio-stream", "dep:tonic", "dep:windows-sys", "dep:security-framework", "dep:secret-service"]

[dependencies]
aes-gcm = "0.10"
async-trait = "0.1"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hkdf = "0.12"
googleapis-tonic-google-firestore-v1 = { version = "=0.34.0", optional = true }
prost-types = { version = "0.14", optional = true }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "macros", "process", "io-util", "time"] }
tokio-stream = { version = "0.1", optional = true }
tonic = { version = "=0.14.6", default-features = false, features = ["transport", "codegen", "tls-ring", "tls-native-roots"], optional = true }
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = { version = "1", features = ["zeroize_derive"] }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
secret-service = { version = "=5.2.0", default-features = false, features = ["rt-tokio-crypto-rust"], optional = true }

[dev-dependencies]
tempfile = "3"
