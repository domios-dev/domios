[package]
license = "PolyForm-Shield-1.0.0"
name = "domios-bridge"
version = "0.0.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
domios-plugin = { path = "../domios-plugin" }
chrono = { version = "0.4", features = ["serde"] }
domios-types = { path = "../domios-types" }
domios-wire = { path = "../domios-wire" }
domios-util = { path = "../domios-util" }
log = "0.4"
parking_lot = "0.12"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "time", "macros"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
axum = "0.8"
tempfile = "3"
tokio = { version = "1", features = ["full"] }

[lints]
workspace = true
