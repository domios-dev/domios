[package]
name = "codeterm-host-runtime"
version = "0.0.0"
edition = "2021"

[lints]
workspace = true

[features]
test-support = ["dep:codeterm-service-core", "codeterm-service-core/test-support"]

[dependencies]
codeterm-events = { path = "../codeterm-events" }
tauri = { version = "2", features = ["tray-icon", "test", "webview-data-url"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

codeterm-service-core = { path = "../codeterm-service-core", default-features = false, optional = true }

[dev-dependencies]
codeterm-service-core = { path = "../codeterm-service-core", default-features = false, features = ["test-support"] }
