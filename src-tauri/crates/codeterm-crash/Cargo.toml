[package]
name = "codeterm-crash"
version = "0.0.0"
edition = "2021"

[lints]
workspace = true

[dependencies]
codeterm-paths = { path = "../../../crates/codeterm-paths" }
codeterm-build-info = { path = "../codeterm-build-info" }
codeterm-shutdown = { path = "../codeterm-shutdown" }
codeterm-keepawake = { path = "../codeterm-keepawake" }
codeterm-util = { path = "../codeterm-util" }
chrono = { version = "0.4", features = ["serde"] }
log = { version = "0.4", features = ["release_max_level_info"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
hostname = "0.4.2"
tokio = { version = "1", features = ["rt", "signal", "net", "macros", "time"] }
crash-handler = "0.6"
crash-context = "0.6"
minidump-writer = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
wait-timeout = "0.2"
