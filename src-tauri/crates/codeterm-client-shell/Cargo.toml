[package]
license = "AGPL-3.0-only"
name = "codeterm-client-shell"
version = "0.0.0"
edition = "2021"

[lints]
workspace = true

[features]
# Swaps the Tauri runtime for the mock runtime in dependent test builds.
test-support = []
dev-updater-allowlocal = ["codeterm-update/dev-updater-allowlocal"]

[dependencies]
codeterm-build-info = { path = "../codeterm-build-info" }
codeterm-crash = { path = "../codeterm-crash" }
codeterm-paths = { path = "../codeterm-paths" }
codeterm-update = { path = "../codeterm-update" }
codeterm-util = { path = "../codeterm-util" }
async-trait = "0.1"
dirs = "6"
log = { version = "0.4", features = ["release_max_level_info"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "test", "webview-data-url"] }
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["rt", "macros"] }
url = "2"
which = "8"
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-single-instance = "2"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSView", "NSResponder", "NSPasteboard"] }
objc2-foundation = "0.3"

[target.'cfg(windows)'.dependencies]
clipboard-win = "5"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_RestartManager", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "test-util"] }
