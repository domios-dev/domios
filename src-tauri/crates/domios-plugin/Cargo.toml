[package]
license = "AGPL-3.0-only"
name = "domios-plugin"
version = "0.0.0"
edition = "2021"

[dependencies]
domios-build-info = { path = "../domios-build-info" }
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
domios-types = { path = "../domios-types" }
domios-decision = { path = "../domios-decision" }
domios-provider-signals = { path = "../domios-provider-signals" }
domios-blueprint-types = { path = "../domios-blueprint-types" }
domios-local-recording = { path = "../domios-local-recording" }
domios-usage = { path = "../domios-usage" }
domios-wire = { path = "../domios-wire" }
domios-util = { path = "../domios-util" }
domios-paths = { path = "../domios-paths" }
dirs = "6"
futures-executor = "0.3"
futures-util = "0.3"
include_dir = "0.7"
indexmap = { version = "2", features = ["serde"] }
log = "0.4"
md-5 = "0.10"
notify = { version = "8.2", default-features = false, features = ["macos_fsevent"] }
parking_lot = "0.12"
quick-xml = "0.37"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rquickjs = { version = "0.11", features = ["loader", "macro", "parallel"] }
rusqlite = { version = "0.32", features = ["bundled", "blob", "functions", "limits", "load_extension"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
semver = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tokio = { version = "1", features = ["sync", "rt", "time", "macros"] }
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
wait-timeout = "0.2"
libc = "0.2"

[features]
test-support = []

[dev-dependencies]
domios-paths = { path = "../domios-paths", features = ["isolated-data-root"] }
axum = { version = "0.8", features = ["json"] }
tempfile = "3"
tokio = { version = "1", features = ["full"] }

[lints]
workspace = true
