[package]
license = "LicenseRef-Domios-1.0"
name = "codeterm-pty"
version = "0.0.0"
edition = "2021"

[dependencies]
arc-swap = "1"
codeterm-types = { path = "../codeterm-types" }
codeterm-entitlements = { path = "../codeterm-entitlements" }
codeterm-provider-signals = { path = "../codeterm-provider-signals" }
codeterm-storage = { path = "../codeterm-storage" }
codeterm-util = { path = "../codeterm-util" }
codeterm-build-info = { path = "../codeterm-build-info" }
codeterm-paths = { path = "../codeterm-paths" }
portable-pty = { path = "../../pty-fork" }
vt100 = "0.16"
vte = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"
log = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["sync", "rt"] }
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
ulid = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
wait-timeout = "0.2"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_RemoteDesktop", "Win32_System_WindowsProgramming", "Win32_Storage_FileSystem"] }

[lints]
workspace = true
