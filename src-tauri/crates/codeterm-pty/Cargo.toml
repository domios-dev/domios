[package]
name = "codeterm-pty"
version = "1.6.2"
edition = "2021"

[dependencies]
codeterm-types = { path = "../codeterm-types" }
codeterm-util = { path = "../codeterm-util" }
codeterm-paths = { path = "../../../crates/codeterm-paths" }
portable-pty = { path = "../../pty-fork" }
vt100 = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"
log = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["sync", "rt"] }
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
ulid = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
wait-timeout = "0.2"
