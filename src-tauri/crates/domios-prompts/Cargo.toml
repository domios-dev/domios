[package]
license = "PolyForm-Shield-1.0.0"
name = "domios-prompts"
version = "0.0.0"
edition = "2021"

[lints]
workspace = true

[dependencies]
domios-build-info = { path = "../domios-build-info" }
domios-mem = { path = "../domios-mem", default-features = false }
domios-paths = { path = "../domios-paths" }
domios-plan = { path = "../domios-plan" }
domios-plugin = { path = "../domios-plugin" }
domios-types = { path = "../domios-types" }
dirs = "6"
log = "0.4"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
toml = "0.8"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
