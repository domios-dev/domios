[package]
name = "codeterm-plugin"
version = "1.6.2"
edition = "2021"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
codeterm-types = { path = "../codeterm-types" }
codeterm-util = { path = "../codeterm-util" }
codeterm-paths = { path = "../../../crates/codeterm-paths" }
dirs = "6"
futures-executor = "0.3"
futures-util = "0.3"
include_dir = "0.7"
log = "0.4"
md-5 = "0.10"
parking_lot = "0.12"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rquickjs = { version = "0.11", features = ["loader", "macro", "parallel"] }
rusqlite = { version = "0.32", features = ["bundled", "blob", "functions", "load_extension"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tokio = { version = "1", features = ["sync", "rt", "time", "macros"] }
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
wait-timeout = "0.2"
libc = "0.2"

[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
axum = { version = "0.8", features = ["json"] }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
