[package]
name = "codeterm-frontend-bundle"
version = "0.1.0"
edition = "2021"

[dependencies]
flate2 = "1"
minisign-verify = "0.2"
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
rusqlite = { version = "0.32", features = ["bundled"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tar = "0.4"
tempfile = "3"
url = "2"
uuid = { version = "1", features = ["v4"] }
