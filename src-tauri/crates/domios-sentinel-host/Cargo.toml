[package]
license = "PolyForm-Shield-1.0.0"
name = "domios-sentinel-host"
version = "0.0.0"
edition = "2021"

[lints]
workspace = true

[lib]
name = "domios_sentinel_host"

[dependencies]
domios-service-core = { path = "../domios-service-core", default-features = false }
domios-sentinel = { path = "../domios-sentinel" }
domios-blueprint-types = { path = "../domios-blueprint-types" }
domios-cron = { path = "../domios-cron" }
domios-storage = { path = "../domios-storage" }
domios-plugin = { path = "../domios-plugin" }
domios-types = { path = "../domios-types" }
domios-util = { path = "../domios-util" }
domios-events = { path = "../domios-events" }
domios-decision = { path = "../domios-decision" }
domios-pty = { path = "../domios-pty" }
domios-shutdown = { path = "../domios-shutdown" }
domios-analytics = { path = "../domios-analytics" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
uuid = { version = "1", features = ["v4", "serde"] }
log = { version = "0.4", features = ["release_max_level_info"] }
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
regex = "1"
cron = "0.13"
rusqlite = { version = "0.32", features = ["bundled", "blob", "functions", "load_extension"] }
tempfile = "3"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
domios-service-core = { path = "../domios-service-core", default-features = false, features = ["test-support"] }
domios-sentinel = { path = "../domios-sentinel", features = ["test-support"] }
domios-decision = { path = "../domios-decision", features = ["decision-fixture-clock"] }
domios-storage = { path = "../domios-storage", features = ["test-support"] }

[features]
test-support = ["domios-service-core/test-support", "domios-sentinel/test-support"]
