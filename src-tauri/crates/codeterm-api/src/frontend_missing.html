    p { max-width: 30rem; margin: 0; color: #9da7b1; font-size: 1rem; line-height: 1.6; }
    @media (prefers-color-scheme: light) {
      :root, body { background: #f6f8fa; color: #1f2328; }
      svg { color: #0969da; }
      p { color: #57606a; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

</head>
