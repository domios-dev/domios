[package]
name = "codeterm-neighbors-service"
version = "0.0.0"
edition = "2021"
license = "AGPL-3.0-only"

[lints]
workspace = true

[features]
test-support = ["codeterm-service-core/test-support"]

[dependencies]
codeterm-service-core = { path = "../codeterm-service-core", default-features = false }
workspace-hack = { version = "0.1", path = "../workspace-hack" }
codeterm-notification-core = { path = "../codeterm-notification-core" }
codeterm-account = { path = "../codeterm-account" }
codeterm-neighbors = { path = "../codeterm-neighbors" }
codeterm-billing = { path = "../codeterm-billing" }
codeterm-entitlements = { path = "../codeterm-entitlements" }
codeterm-analytics = { path = "../codeterm-analytics" }
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
uuid = { version = "1", features = ["v4", "serde"] }
codeterm-types = { path = "../codeterm-types" }
codeterm-wire = { path = "../codeterm-wire" }
codeterm-provider-signals = { path = "../codeterm-provider-signals" }
codeterm-events = { path = "../codeterm-events" }
codeterm-secrets = { path = "../codeterm-secrets" }
codeterm-util = { path = "../codeterm-util" }
codeterm-mesh = { path = "../codeterm-mesh" }
codeterm-plugin = { path = "../codeterm-plugin" }
log = { version = "0.4", features = ["release_max_level_info"] }
parking_lot = "0.12"
base64 = "0.23"
axum = { version = "0.8", features = ["multipart"] }
tower = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "stream", "blocking"] }
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }
hostname = "0.4.2"
ed25519-dalek = { version = "2", features = ["rand_core"] }
url = "2"
rand = "0.8.6"
async-trait = "0.1"
zeroize = { version = "1", features = ["zeroize_derive"] }
codeterm-paths = { path = "../codeterm-paths" }

[dev-dependencies]
codeterm-service-core = { path = "../codeterm-service-core", default-features = false, features = ["test-support"] }
