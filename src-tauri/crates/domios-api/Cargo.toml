[package]
license = "AGPL-3.0-only"
name = "domios-api"
version = "0.0.0"
edition = "2021"

[lints]
workspace = true

[lib]
name = "domios_api"

[dependencies]
domios-commands = { path = "../domios-commands" }
domios-service-core = { path = "../domios-service-core", default-features = false }
domios-orchestration = { path = "../domios-orchestration" }
domios-sentinel-host = { path = "../domios-sentinel-host" }
domios-notification-core = { path = "../domios-notification-core" }
domios-account = { path = "../domios-account" }
domios-billing = { path = "../domios-billing" }
domios-analytics = { path = "../domios-analytics" }
domios-frontend-bundle = { path = "../domios-frontend-bundle" }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
uuid = { version = "1", features = ["v4", "serde"] }
domios-types = { path = "../domios-types" }
domios-blueprint-types = { path = "../domios-blueprint-types" }
domios-wire = { path = "../domios-wire" }
domios-decision = { path = "../domios-decision" }
domios-events = { path = "../domios-events" }
domios-util = { path = "../domios-util" }
domios-update = { path = "../domios-update" }
domios-frontend-shell = { path = "../domios-frontend-shell" }
domios-mesh = { path = "../domios-mesh" }
domios-mem = { path = "../domios-mem", default-features = false }
domios-plan = { path = "../domios-plan" }
domios-bridge = { path = "../domios-bridge" }
domios-pty = { path = "../domios-pty" }
domios-plugin = { path = "../domios-plugin" }
domios-storage = { path = "../domios-storage" }
domios-usage = { path = "../domios-usage" }
domios-build-info = { path = "../domios-build-info" }
log = { version = "0.4", features = ["release_max_level_info"] }
parking_lot = "0.12"
base64 = "0.22"
toml = "0.8"
dirs = "6"
axum = { version = "0.8", features = ["multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["catch-panic", "compression-gzip", "cors", "fs", "set-header"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "stream", "blocking"] }
async-stream = "0.3"
futures-core = "0.3"
futures-util = "0.3"
http-body = "1"
cron = "0.13"
chrono = { version = "0.4", features = ["serde"] }
url = "2"
rusqlite = { version = "0.32", features = ["bundled", "blob", "functions", "load_extension"] }
regex = "1"
ulid = "1"
async-trait = "0.1"
domios-paths = { path = "../domios-paths" }
domios-plugins = { path = "../domios-plugins" }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
domios-service-core = { path = "../domios-service-core", default-features = false, features = ["test-support"] }
domios-orchestration = { path = "../domios-orchestration", features = ["test-support"] }
domios-sentinel-host = { path = "../domios-sentinel-host", features = ["test-support"] }
mockito = "1"

[features]
test-support = ["domios-service-core/test-support"]
