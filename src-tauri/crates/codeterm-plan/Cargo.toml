[package]
name = "codeterm-plan"
version = "1.6.2"
edition = "2021"

[dependencies]
codeterm-types = { path = "../codeterm-types" }
codeterm-util = { path = "../codeterm-util" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
rusqlite = { version = "0.32", features = ["bundled", "blob", "functions", "load_extension"] }
notify = { version = "7", default-features = false, features = ["macos_fsevent"] }
notify-debouncer-mini = "0.5"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
serde_yaml = "0.9"

[dev-dependencies]
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
