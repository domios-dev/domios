[package]
license = "AGPL-3.0-only"
name = "codeterm-plan"
version = "0.0.0"
edition = "2021"

[dependencies]
codeterm-paths = { path = "../codeterm-paths" }
codeterm-types = { path = "../codeterm-types" }
codeterm-usage = { path = "../codeterm-usage" }
codeterm-util = { path = "../codeterm-util" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
rusqlite = { version = "0.32", features = ["bundled", "blob", "functions", "load_extension"] }
notify = { version = "7", default-features = false, features = ["macos_fsevent"] }
notify-debouncer-mini = "0.5"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
serde_yaml = "0.9"
tempfile = { version = "3", optional = true }

[features]
# Exposes PlanStore::new_for_test + TestSearchPort to downstream test builds
# (the app crate enables this via a dev-dependency). Off in normal builds.
test-support = ["dep:tempfile"]

[dev-dependencies]
codeterm-plan = { path = ".", features = ["test-support"] }
uuid = { version = "1", features = ["v4"] }
filetime = "0.2"

[lints]
workspace = true
