[package]
license = "AGPL-3.0-only"
name = "codeterm-update"
version = "0.0.0"
edition = "2021"

[lints]
workspace = true

[features]
# Enables file:// and loopback HTTP manifest sources.
dev-updater-allowlocal = []

[dependencies]
base64 = "0.23"
minisign-verify = "0.2"
sha2 = "0.10"
tempfile = "3"
codeterm-process-identity = { path = "../codeterm-process-identity" }
codeterm-build-info = { path = "../codeterm-build-info" }
codeterm-paths = { path = "../codeterm-paths" }
codeterm-plugins = { path = "../codeterm-plugins" }
codeterm-types = { path = "../codeterm-types" }
async-trait = "0.1"
log = "0.4"
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "macros", "fs", "io-util", "time"] }
uuid = { version = "1", features = ["v4"] }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "sync", "macros", "test-util"] }
