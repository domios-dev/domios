[package]
license = "PolyForm-Shield-1.0.0"
name = "domios-storage"
version = "0.0.0"
edition = "2021"

[features]
# Writer hold gates, fault injection and layout probes for contract tests only.
test-support = []

[dependencies]
domios-paths = { path = "../domios-paths" }
domios-types = { path = "../domios-types" }
domios-blueprint-types = { path = "../domios-blueprint-types" }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Windows publication (no-replace, write-through move) and reparse-point inspection.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[lints]
workspace = true
