[package]
license = "PolyForm-Shield-1.0.0"
name = "codeterm-mem"
version = "0.0.0"
edition = "2021"

[[example]]
name = "blueprint_recall_eval"
path = "../../../evals/blueprint-recall/runner/main.rs"

[dependencies]
codeterm-blueprint-types = { path = "../codeterm-blueprint-types" }
codeterm-types = { path = "../codeterm-types" }
codeterm-decision = { path = "../codeterm-decision" }
codeterm-util = { path = "../codeterm-util" }
codeterm-mem-store = { path = "../../../crates/mem-store" }
codeterm-paths = { path = "../codeterm-paths" }
parking_lot = "0.12"
rusqlite = { version = "0.32", features = ["bundled", "blob", "functions", "load_extension"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["sync", "rt", "time", "macros", "process"] }
rand = "0.8"
sha2 = "0.10"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
ulid = "1"
log = "0.4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
zeroize = "1"
sqlite-vec = { version = "0.1.9", optional = true }
rayon = { version = "1", optional = true }
candle-core = { version = "0.11", optional = true, default-features = false }
candle-nn = { version = "0.11", optional = true, default-features = false }
candle-transformers = { version = "0.11", optional = true, default-features = false }
tokenizers = { version = "0.22", optional = true, default-features = false, features = ["onig"] }
hf-hub = { version = "0.4", optional = true, default-features = false, features = ["ureq"] }
ndarray = { version = "0.17", optional = true }
hnsw_rs = { version = "0.3", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
annembed = { version = "0.1.6", optional = true, default-features = false, features = ["macos-accelerate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_System_SystemServices"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = ["embeddings"]
embeddings = ["dep:sqlite-vec", "dep:rayon", "dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers", "dep:hf-hub", "dep:annembed", "dep:ndarray", "dep:hnsw_rs"]

[dev-dependencies]
codeterm-util = { path = "../codeterm-util", features = ["test-support"] }
tempfile = "3"

[lints]
workspace = true
