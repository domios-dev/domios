schema_version: 2
kind: pipeline
name: latency-percentiles
note: Compute p50, p95 and max over latency samples and say whether p95 breaches the
  SLO.
intent: check whether response times are inside our latency objective
anchors: []
inputs:
  args:
    $ref: Args
    description: Typed named arguments
types:
  Args:
    type: object
    additionalProperties: false
    required:
    - samples
    - slo_ms
    properties:
      samples:
        type: array
        items:
          type: integer
      slo_ms:
        type: integer
  Latency:
    type: object
    additionalProperties: false
    required:
    - breach
    - count
    - max
    - p50
    - p95
    properties:
      breach:
        type: boolean
      count:
        type: integer
      max:
        type: integer
      p50:
        type: integer
      p95:
        type: integer
steps:
- id: percentiles
  does: Nearest-rank p50 and p95 of the samples; breach when p95 exceeds the SLO
  code:
    lang: python
    src: |
      import math
      def main(a):
          xs = sorted(a["samples"])
          if not xs:
              return {"count": 0, "p50": 0, "p95": 0, "max": 0, "breach": False}
          rank = lambda q: xs[max(0, math.ceil(q * len(xs)) - 1)]
          p95 = rank(0.95)
          return {"count": len(xs), "p50": rank(0.5), "p95": p95, "max": xs[-1], "breach": p95 > a["slo_ms"]}
  in:
    $ref: Args
  out:
    $ref: Latency
  routes:
    done: next
    failed: stop
result:
  type:
    $ref: Latency
  from: percentiles.out
