[package]
license = "AGPL-3.0-only"
name = "codeterm-browser"
version = "0.0.0"
edition = "2021"

[dependencies]
ts-rs = { version = "12.0.1", features = ["serde-json-impl", "no-serde-warnings"] }
codeterm-util = { path = "../codeterm-util" }
async-trait = "0.1"
base64 = "0.23"
dirs = "6"
futures-util = "0.3"
log = "0.4"
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "unbounded_depth"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.30"
url = "2"
uuid = { version = "1", features = ["v4"] }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace", "NSRunningApplication", "block2", "libc"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSBundle", "NSError", "NSString", "NSURL"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
