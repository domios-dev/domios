[package]
name = "codeterm-provider-ops"
version = "0.0.0"
edition = "2021"

[lints]
workspace = true

[dependencies]
codeterm-agent-model = { path = "../codeterm-agent-model" }
codeterm-plugin = { path = "../codeterm-plugin" }
codeterm-supporter = { path = "../codeterm-supporter" }
codeterm-types = { path = "../codeterm-types" }
codeterm-util = { path = "../codeterm-util" }
dirs = "6"
log = "0.4"
notify = { version = "7", default-features = false, features = ["macos_fsevent"] }
parking_lot = "0.12"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wait-timeout = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_Pipes", "Win32_Security", "Win32_System_IO", "Win32_System_JobObjects", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"

[features]
test-support = []
