[package]
name = "codeterm-bridge"
version = "1.6.2"
edition = "2021"

[dependencies]
async-trait = "0.1"
codeterm-plugin = { path = "../codeterm-plugin" }
chrono = { version = "0.4", features = ["serde"] }
codeterm-types = { path = "../codeterm-types" }
codeterm-util = { path = "../codeterm-util" }
log = "0.4"
parking_lot = "0.12"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "time", "macros"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
