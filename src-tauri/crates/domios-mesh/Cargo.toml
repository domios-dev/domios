[package]
license = "PolyForm-Shield-1.0.0"
name = "domios-mesh"
version = "0.0.0"
edition = "2021"

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
domios-paths = { path = "../domios-paths" }
domios-build-info = { path = "../domios-build-info" }
domios-types = { path = "../domios-types" }
domios-util = { path = "../domios-util" }
ed25519-dalek = { version = "2", features = ["rand_core"] }
log = "0.4"
mdns-sd = "0.11"
parking_lot = "0.12"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "sync"] }
uuid = { version = "1", features = ["v4", "serde"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
dirs = "6"
hostname = "0.4.2"
if-addrs = "0.13"
chrono = { version = "0.4", features = ["serde"] }
semver = "1"

[dev-dependencies]
domios-paths = { path = "../domios-paths", features = ["isolated-data-root"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }

[lints]
workspace = true
