[package]
license = "AGPL-3.0-only"
name = "domios-notifications"
version = "0.0.0"
edition = "2021"

[lints]
workspace = true

[dependencies]
domios-notification-core = { path = "../domios-notification-core" }
domios-bridge = { path = "../domios-bridge" }
domios-config = { path = "../domios-config" }
domios-plugin = { path = "../domios-plugin" }
domios-types = { path = "../domios-types" }
domios-agent-model = { path = "../domios-agent-model" }
domios-pty = { path = "../domios-pty" }
domios-paths = { path = "../domios-paths" }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
uuid = { version = "1", features = ["v4"] }
toml = "0.8"

[dev-dependencies]
domios-util = { path = "../domios-util" }
tempfile = "3"
