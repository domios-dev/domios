[package]
name = "codeterm-worker-services"
version = "0.0.0"
edition = "2021"

[lints]
workspace = true

[features]
test-support = []

[dependencies]
uuid = { version = "1", features = ["v4", "serde"] }
codeterm-types = { path = "../codeterm-types" }
codeterm-pty = { path = "../codeterm-pty" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
parking_lot = "0.12"
rusqlite = { version = "0.32", features = ["bundled", "blob", "functions", "load_extension"] }
log = { version = "0.4", features = ["release_max_level_info"] }
url = "2"
sha2 = "0.10"
regex = "1"

[dev-dependencies]
tempfile = "3"
