[package]
license = "AGPL-3.0-only"
name = "codeterm-entitlements"
version = "0.0.0"
edition = "2021"

[dependencies]
base64 = "0.23"
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"

[lints]
workspace = true
