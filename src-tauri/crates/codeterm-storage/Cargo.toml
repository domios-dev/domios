[package]
name = "codeterm-storage"
version = "0.1.0"
edition = "2021"

[features]
# Writer hold gates, fault injection and layout probes for contract tests only.
test-support = []

[dependencies]
codeterm-paths = { path = "../../../crates/codeterm-paths" }
codeterm-types = { path = "../codeterm-types" }
codeterm-blueprint-types = { path = "../codeterm-blueprint-types" }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Windows publication (no-replace, write-through move) and reparse-point inspection.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
