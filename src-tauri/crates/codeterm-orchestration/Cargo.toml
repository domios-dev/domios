[package]
license = "AGPL-3.0-only"
name = "codeterm-orchestration"
version = "0.0.0"
edition = "2021"

[lints]
workspace = true

[lib]
name = "codeterm_orchestration"

[features]
test-support = ["codeterm-service-core/test-support", "codeterm-plan/test-support"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
codeterm-blueprint-types = { path = "../codeterm-blueprint-types" }
codeterm-mem = { path = "../codeterm-mem", default-features = false }
codeterm-notification-core = { path = "../codeterm-notification-core" }
codeterm-plan = { path = "../codeterm-plan" }
codeterm-wire = { path = "../codeterm-wire" }
codeterm-team-package = { path = "../codeterm-team-package" }
workspace-hack = { version = "0.1", path = "../workspace-hack" }
codeterm-service-core = { path = "../codeterm-service-core", default-features = false }
codeterm-analytics = { path = "../codeterm-analytics" }
codeterm-events = { path = "../codeterm-events" }
codeterm-paths = { path = "../codeterm-paths" }
codeterm-types = { path = "../codeterm-types" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
log = { version = "0.4", features = ["release_max_level_info"] }
parking_lot = "0.12"
tempfile = "3"

[dev-dependencies]
codeterm-prompts = { path = "../codeterm-prompts" }
codeterm-provider-signals = { path = "../codeterm-provider-signals" }
codeterm-plugin = { path = "../codeterm-plugin" }
rusqlite = { version = "0.32", features = ["bundled", "blob", "functions", "load_extension"] }
codeterm-plan = { path = "../codeterm-plan", features = ["test-support"] }
tokio = { version = "1", features = ["test-util"] }
codeterm-service-core = { path = "../codeterm-service-core", default-features = false, features = ["test-support"] }
codeterm-sentinel = { path = "../codeterm-sentinel", features = ["test-support"] }
