[package]
name = "codeterm-service-core"
version = "0.0.0"
edition = "2021"

[lints]
workspace = true

[lib]
name = "codeterm_service_core"

[dependencies]
codeterm-provider-ops = { path = "../codeterm-provider-ops" }
codeterm-supporter = { path = "../codeterm-supporter" }
codeterm-worker-services = { path = "../codeterm-worker-services" }
codeterm-local-preview = { path = "../codeterm-local-preview" }
codeterm-lanes = { path = "../codeterm-lanes" }
codeterm-agent-model = { path = "../codeterm-agent-model" }

codeterm-prompts = { path = "../codeterm-prompts" }
codeterm-agent-detect = { path = "../codeterm-agent-detect" }
codeterm-notification-core = { path = "../codeterm-notification-core" }
codeterm-repowatch = { path = "../codeterm-repowatch" }
codeterm-account = { path = "../codeterm-account" }
codeterm-billing = { path = "../codeterm-billing" }
tauri-plugin-deep-link = "2"
codeterm-analytics = { path = "../codeterm-analytics" }
codeterm-frontend-bundle = { path = "../codeterm-frontend-bundle" }
tempfile = "3"
tauri = { version = "2", features = ["tray-icon", "test", "webview-data-url"] }
# Embedded JavaScript runtime for plugin code (provider TS bundles run
# here when called from headless / background Rust code paths). Features chosen to keep
# binary size minimal — no parallel/multi-context, no async, just the
# core eval surface + ES modules.
rquickjs = { version = "0.11", features = ["loader", "macro", "parallel"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
portable-pty = { path = "../../pty-fork" }
tokio = { version = "1", features = ["full", "test-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_yaml = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
codeterm-types = { path = "../codeterm-types" }
codeterm-blueprint-types = { path = "../codeterm-blueprint-types" }
codeterm-local-recording = { path = "../codeterm-local-recording" }
codeterm-wire = { path = "../codeterm-wire" }
codeterm-sentinel = { path = "../codeterm-sentinel" }
codeterm-decision = { path = "../codeterm-decision" }
codeterm-provider-signals = { path = "../codeterm-provider-signals" }
codeterm-events = { path = "../codeterm-events" }
codeterm-config = { path = "../codeterm-config" }
codeterm-secrets = { path = "../codeterm-secrets" }
codeterm-keepawake = { path = "../codeterm-keepawake" }
codeterm-cron = { path = "../codeterm-cron" }
codeterm-shutdown = { path = "../codeterm-shutdown" }
codeterm-util = { path = "../codeterm-util" }
codeterm-browser = { path = "../codeterm-browser" }
codeterm-mesh = { path = "../codeterm-mesh" }
codeterm-mem = { path = "../codeterm-mem", default-features = false }
codeterm-plan = { path = "../codeterm-plan" }
codeterm-bridge = { path = "../codeterm-bridge" }
codeterm-pty = { path = "../codeterm-pty" }
codeterm-plugin = { path = "../codeterm-plugin" }
codeterm-storage = { path = "../codeterm-storage" }
codeterm-usage = { path = "../codeterm-usage" }
codeterm-build-info = { path = "../codeterm-build-info" }
log = { version = "0.4", features = ["release_max_level_info"] }
fern = "0.7"
parking_lot = "0.12"
arc-swap = "1"
bytes = "1"
base64 = "0.22"
interprocess = "2"
sha2 = "0.10"
# Embedded bundled-plugin bytes for the first-launch bootstrap. The
# Dir struct is built at compile time from <repo>/plugins/ so a fresh
# binary on an air-gapped machine still has working providers.
include_dir = "0.7"
md-5 = "0.10"
toml = "0.8"
dirs = "6"
axum = { version = "0.8", features = ["multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["catch-panic", "compression-gzip", "cors", "fs", "set-header"] }
git2 = { version = "0.19", features = ["vendored-openssl"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "stream", "blocking"] }
async-stream = "0.3"
futures-core = "0.3"
futures-util = "0.3"
# Native async WebSocket framing shares Tokio's runtime; sidecars use loopback without TLS.
tokio-tungstenite = "0.28"
futures-executor = "0.3"
png = "0.17"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
cron = "0.13"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
vt100 = "0.16"
semver = "1"
hostname = "0.4.2"
notify = { version = "7", default-features = false, features = ["macos_fsevent"] }
notify-debouncer-mini = "0.5"
mdns-sd = "0.11"
if-addrs = "0.13"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
aes-gcm = "0.10"
url = "2"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled", "blob", "functions", "load_extension"] }
regex = "1"
ulid = "1"
async-trait = "0.1"
zeroize = { version = "1", features = ["zeroize_derive"] }
which = "7"
wait-timeout = "0.2"
sqlite-vec = { version = "0.1.9", optional = true }
fastembed = { version = "5", optional = true }
ndarray = { version = "0.17", optional = true }
hnsw_rs = { version = "0.3", optional = true }
codeterm-mem-store = { path = "../../../crates/mem-store" }
codeterm-paths = { path = "../../../crates/codeterm-paths" }
codeterm-plugins = { path = "../codeterm-plugins" }
crash-handler = "0.6"
crash-context = "0.6"
minidump-writer = "0.10"

[features]
default = ["embeddings"]
# annembed (UMAP graph layout) is macOS-only: its LAPACK backend is the
# Accelerate framework; Windows/Linux have no provider wired and fail at
# link time. Declared in the macOS target section below.
embeddings = ["codeterm-mem/embeddings", "dep:sqlite-vec", "dep:fastembed", "dep:annembed", "dep:ndarray", "dep:hnsw_rs"]
dev-updater-allowlocal = []
test-support = ["codeterm-provider-ops/test-support", "codeterm-worker-services/test-support", "codeterm-lanes/test-support", "codeterm-local-preview/test-support", "codeterm-plugin/test-support", "codeterm-plan/test-support", "codeterm-storage/test-support", "codeterm-sentinel/test-support", "codeterm-decision/decision-fixture-clock", "codeterm-agent-model/test-support", "codeterm-supporter/test-support"]

# Low-level syscalls (e.g. fd-limit raise in fdlimit.rs) on all Unix incl Linux.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# macOS uses the system Accelerate framework for the annembed LAPACK path.
[target.'cfg(target_os = "macos")'.dependencies]
codeterm-input-macos = { path = "../codeterm-input-macos" }
annembed = { version = "0.1.6", optional = true, default-features = false, features = ["macos-accelerate"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSView", "NSResponder", "NSPasteboard"] }
objc2-foundation = "0.3"

# x86_64 macOS: pyke does not ship an ort prebuilt for this target, so we
# enable fastembed's `ort-load-dynamic` feature and dlopen libonnxruntime
# at runtime from a dylib bundled next to the app binary. arm64 keeps
# static linking via the default `download-binaries` path.
[target.'cfg(all(target_os = "macos", target_arch = "x86_64"))'.dependencies]
fastembed = { version = "5", optional = true, features = ["ort-load-dynamic"] }

[target.'cfg(windows)'.dependencies]
codeterm-input-windows = { path = "../codeterm-input-windows" }
conpty = "0.7"
clipboard-win = "5"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_RestartManager", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
codeterm-provider-ops = { path = "../codeterm-provider-ops", features = ["test-support"] }
codeterm-supporter = { path = "../codeterm-supporter", features = ["test-support"] }
codeterm-worker-services = { path = "../codeterm-worker-services", features = ["test-support"] }
codeterm-lanes = { path = "../codeterm-lanes", features = ["test-support"] }
codeterm-agent-model = { path = "../codeterm-agent-model", features = ["test-support"] }
codeterm-plugin = { path = "../codeterm-plugin", features = ["test-support"] }
codeterm-sentinel = { path = "../codeterm-sentinel", features = ["test-support"] }
codeterm-decision = { path = "../codeterm-decision", features = ["decision-fixture-clock"] }
mockito = "1"
filetime = "0.2.29"
vt100 = "0.16"
# Enables PlanStore::new_for_test + TestSearchPort in the app's test build only.
codeterm-plan = { path = "../codeterm-plan", features = ["test-support"] }
# Writer hold gates and fault injection for the storage_contract_ tests only.
codeterm-storage = { path = "../codeterm-storage", features = ["test-support"] }
