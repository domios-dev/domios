<!doctype html>
<html lang="en">

<title>Domios daemon unavailable</title>
<style>
body { margin: 0; background: #14161b; color: #e4e6eb; font: 16px system-ui; }
main { max-width: 36rem; margin: 15vh auto; padding: 2rem; }

<main role="status" aria-live="polite">
<h1>Daemon unavailable</h1>
<p>Domios will reconnect when its daemon listener returns.</p>
<p>Use “Retry daemon listener” in the Domios tray menu to retry a failed bind.</p>
</main>
