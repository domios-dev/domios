[package]
license = "AGPL-3.0-only"
name = "codeterm-account"
version = "0.0.0"
edition = "2021"

[dependencies]
log = "0.4"
async-trait = "0.1"
base64 = "0.23"
codeterm-entitlements = { path = "../codeterm-entitlements" }
codeterm-util = { path = "../codeterm-util" }
parking_lot = "0.12"
ed25519-dalek = "2"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "macros", "rt", "test-util", "process"] }
url = "2"
zeroize = { version = "1", features = ["zeroize_derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[lints]
workspace = true

[dev-dependencies]
codeterm-util = { path = "../codeterm-util", features = ["test-support"] }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
