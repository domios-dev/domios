[package]
name = "domios-server"
version = "0.0.0"
edition = "2021"
license = "AGPL-3.0-only"

[lints]
workspace = true

[dependencies]
codeterm-process-identity = { path = "../codeterm-process-identity" }
codeterm-service-core = { path = "../codeterm-service-core", default-features = false }
codeterm-api = { path = "../codeterm-api", default-features = false }
codeterm-socket = { path = "../codeterm-socket", default-features = false }
codeterm-commands = { path = "../codeterm-commands", default-features = false }
codeterm-orchestration = { path = "../codeterm-orchestration", default-features = false }
codeterm-sentinel-host = { path = "../codeterm-sentinel-host", default-features = false }
codeterm-build-info = { path = "../codeterm-build-info" }
codeterm-plan = { path = "../codeterm-plan" }
codeterm-plugin = { path = "../codeterm-plugin" }
codeterm-plugins = { path = "../codeterm-plugins" }
codeterm-events = { path = "../codeterm-events" }
codeterm-types = { path = "../codeterm-types" }
codeterm-util = { path = "../codeterm-util" }
codeterm-update = { path = "../codeterm-update" }
codeterm-frontend-shell = { path = "../codeterm-frontend-shell" }
codeterm-billing = { path = "../codeterm-billing" }
codeterm-frontend-bundle = { path = "../codeterm-frontend-bundle" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
async-stream = "0.3"
parking_lot = "0.12"
log = { version = "0.4", features = ["release_max_level_info"] }
fern = "0.7"
chrono = "0.4"
url = "2"
dirs = "6"
uuid = { version = "1", features = ["v4", "serde"] }
include_dir = "0.7"
interprocess = { version = "2", features = ["tokio"] }
sha2 = "0.10"
tempfile = "3"

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
widestring = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Threading"] }

[build-dependencies]
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
codeterm-mem = { path = "../codeterm-mem", default-features = false }
codeterm-service-core = { path = "../codeterm-service-core", default-features = false, features = ["test-support"] }

[features]
default = ["embeddings"]
embeddings = ["codeterm-service-core/embeddings"]
