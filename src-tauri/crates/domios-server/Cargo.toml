[package]
name = "domios-server"
version = "0.0.0"
edition = "2021"
license = "AGPL-3.0-only"

[lints]
workspace = true

[dependencies]
domios-process-identity = { path = "../domios-process-identity" }
domios-service-core = { path = "../domios-service-core", default-features = false }
domios-api = { path = "../domios-api", default-features = false }
domios-socket = { path = "../domios-socket", default-features = false }
domios-commands = { path = "../domios-commands", default-features = false }
domios-orchestration = { path = "../domios-orchestration", default-features = false }
domios-sentinel-host = { path = "../domios-sentinel-host", default-features = false }
domios-build-info = { path = "../domios-build-info" }
domios-plan = { path = "../domios-plan" }
domios-plugin = { path = "../domios-plugin" }
domios-plugins = { path = "../domios-plugins" }
domios-events = { path = "../domios-events" }
domios-types = { path = "../domios-types" }
domios-util = { path = "../domios-util" }
domios-update = { path = "../domios-update" }
domios-frontend-shell = { path = "../domios-frontend-shell" }
domios-billing = { path = "../domios-billing" }
domios-frontend-bundle = { path = "../domios-frontend-bundle" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
rusqlite = { version = "0.32", features = ["bundled"] }
log = { version = "0.4", features = ["release_max_level_info"] }
fern = "0.7"
chrono = "0.4"
url = "2"
dirs = "6"
uuid = { version = "1", features = ["v4", "serde"] }
include_dir = "0.7"
interprocess = { version = "2", features = ["tokio"] }
sha2 = "0.10"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
widestring = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Threading"] }

[build-dependencies]
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
domios-service-core = { path = "../domios-service-core", default-features = false, features = ["test-support"] }

[features]
default = ["embeddings"]
embeddings = ["domios-service-core/embeddings"]
