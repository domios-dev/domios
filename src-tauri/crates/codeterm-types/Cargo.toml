[package]
name = "codeterm-types"
version = "1.6.2"
edition = "2021"

[features]
decision-fixture-clock = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }
uuid = { version = "1", features = ["v4", "serde"] }
