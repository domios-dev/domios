[package]
license = "PolyForm-Shield-1.0.0"
name = "domios-agent-model"
version = "0.0.0"
edition = "2021"

[lints]
workspace = true

[dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
domios-paths = { path = "../domios-paths" }
domios-blueprint-types = { path = "../domios-blueprint-types" }
domios-sentinel = { path = "../domios-sentinel" }
domios-storage = { path = "../domios-storage" }
domios-cron = { path = "../domios-cron" }
domios-agent-detect = { path = "../domios-agent-detect" }
domios-config = { path = "../domios-config" }
domios-plugin = { path = "../domios-plugin" }
domios-pty = { path = "../domios-pty" }
domios-types = { path = "../domios-types" }
domios-plan = { path = "../domios-plan" }
domios-util = { path = "../domios-util" }
domios-mem = { path = "../domios-mem", default-features = false }
log = { version = "0.4", features = ["release_max_level_info"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
parking_lot = "0.12"
rusqlite = { version = "0.32", features = ["bundled", "blob", "functions", "load_extension"] }
regex = "1"
ulid = "1"
uuid = { version = "1", features = ["v4", "serde"] }
toml = "0.8"
sha2 = "0.10"

[features]
test-support = ["domios-storage/test-support", "domios-plugin/test-support"]

[dev-dependencies]
domios-storage = { path = "../domios-storage", features = ["test-support"] }
domios-plugin = { path = "../domios-plugin", features = ["test-support"] }
vt100 = "0.16"
