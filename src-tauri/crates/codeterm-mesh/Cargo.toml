[package]
license = "PolyForm-Shield-1.0.0"
name = "codeterm-mesh"
version = "0.0.0"
edition = "2021"

[dependencies]
base64 = "0.22"
codeterm-entitlements = { path = "../codeterm-entitlements" }
codeterm-paths = { path = "../codeterm-paths" }
codeterm-build-info = { path = "../codeterm-build-info" }
codeterm-types = { path = "../codeterm-types" }
codeterm-util = { path = "../codeterm-util" }
ed25519-dalek = { version = "2", features = ["rand_core"] }
log = "0.4"
parking_lot = "0.12"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6"
hostname = "0.4.2"
if-addrs = "0.13"
chrono = { version = "0.4", features = ["serde"] }
semver = "1"

[dev-dependencies]
codeterm-paths = { path = "../codeterm-paths", features = ["isolated-data-root"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }

[features]
test-support = []

[lints]
workspace = true
