[package]
name = "codeterm-mesh"
version = "1.6.2"
edition = "2021"

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
codeterm-paths = { path = "../../../crates/codeterm-paths" }
codeterm-types = { path = "../codeterm-types" }
codeterm-util = { path = "../codeterm-util" }
ed25519-dalek = { version = "2", features = ["rand_core"] }
log = "0.4"
mdns-sd = "0.11"
parking_lot = "0.12"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "sync"] }
uuid = { version = "1", features = ["v4", "serde"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
dirs = "6"
hostname = "0.4.2"
if-addrs = "0.13"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
serde_json = "1"
