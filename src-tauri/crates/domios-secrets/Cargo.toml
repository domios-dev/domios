[package]
license = "PolyForm-Shield-1.0.0"
name = "domios-secrets"
version = "0.0.0"
edition = "2021"

[dependencies]
hostname = "0.4.2"
async-trait = "0.1"
domios-config = { path = "../domios-config" }
domios-paths = { path = "../domios-paths" }
domios-plugin = { path = "../domios-plugin" }
domios-util = { path = "../domios-util" }
dirs = "6"
log = "0.4"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "macros"] }
zeroize = { version = "1", features = ["zeroize_derive"] }

[lints]
workspace = true
