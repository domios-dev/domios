# video-studio — Agentic Team Protocol (ATP) builtin package
name: dev.domios/video-studio
version: 1.0.0
title: Video studio
description: >-
  Makes a product video in HTML: scenes built from the real app are rendered frame by
  frame into a master, short cuts, a silent loop and captions, or shipped as a live web
  embed. The script is approved before any render, one editor owns the timeline, every
  export is checked against its platform, and nothing goes public without the owner.
icon: icon.svg
authors:
  - name: Domios
    url: https://domios.dev
license: Apache-2.0
when:
  - make a launch video or trailer for the product
  - edit and render a video in HTML from the real app
  - cut a 16:9 trailer and a 9:16 short with burned-in captions
  - build video scenes from real app components and render them frame by frame
  - make a product film for YouTube or Product Hunt
  - embed a live web film on the site

project: required

inputs:
  goal: What the video is for and the one message it must land, or where its script lives
  plays_on:
    description: Where it plays; a live embed on a site changes the whole build
    required: false
    choices: [video file, live web embed, both]
    default: video file
  formats:
    description: Length and aspect ratios
    required: false
    default: a 16:9 1920x1080 master of 45-90 s at 30 fps plus a 9:16 1080x1920 cut of 15-30 s
  voice:
    description: Voiceover or captions only, and the language
    required: false
    default: captions only, in English
  deadline:
    description: The date the final cut is due, kept in this one place
    required: false
    default: none

permissions:
  network: true
  repo_write: true
  shell: true
  browser: true

secrets:
  - name: TTS_API_KEY
    purpose: Text-to-speech key with word timestamps, used only when the owner wants a voiceover
    required: false

files:
  - path: docs/film-pipeline.md
    description: How an HTML film is built, rendered and reviewed, and what cost the most last time
  - path: docs/delivery-specs.md
    description: Every export, its size, codec and caption rules, and when it is due

roles:
  orchestrator:
    kind: manager
    name: Director
    files: [docs/film-pipeline.md, docs/delivery-specs.md]
    instructions_file: managers/orchestrator.md

  planner:
    kind: manager
    files: [docs/film-pipeline.md, docs/delivery-specs.md]
    instructions_file: managers/planner.md

  storyboarder:
    kind: worker
    description: Writes the script, beats and shot list for approval before any render.
    files: [docs/film-pipeline.md]
    instructions_file: workers/storyboarder.md

  scene_builder:
    kind: worker
    description: Builds one scene as a pure function of time from the real app.
    files: [docs/film-pipeline.md]
    instructions_file: workers/scene_builder.md

  editor:
    kind: worker
    description: Owns the timeline, the audio and every render.
    files: [docs/film-pipeline.md, docs/delivery-specs.md]
    instructions_file: workers/editor.md

  export_qa:
    kind: worker
    description: Checks every export against its platform before the owner sees it.
    files: [docs/delivery-specs.md]
    instructions_file: workers/export_qa.md

  publisher:
    kind: worker
    description: Delivers approved exports and verifies them live.
    files: [docs/delivery-specs.md]
    instructions_file: workers/publisher.md
