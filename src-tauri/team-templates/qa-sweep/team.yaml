# qa-sweep — Agentic Team Protocol (ATP) builtin package
name: dev.domios/qa-sweep
version: 1.0.0
title: QA sweep
description: >-
  Sweeps a set of pull requests: one Worker per PR reviews it in its own lane, writes its
  review doc and fixes on the PR branch, then the approved PRs are integrated by real merge
  and gated on the merge SHA with no open Criticals. The owner decides approval and merge.
icon: assets/icon.svg
authors:
  - name: Domios
    url: https://domios.dev
license: Apache-2.0
when:
  - review a batch of open pull requests
  - run a QA sweep over pull requests before merging
  - review each PR in parallel and fix findings on the PR branch
  - integrate approved pull requests and gate the merge SHA
  - prove there are no open Critical findings before a merge

project: required

inputs:
  pull_requests: Which pull requests to sweep, as numbers, links or a query such as all open PRs into the base branch
  base_branch: Branch the pull requests target and the integration merge starts from

permissions:
  network: true
  repo_write: true
  shell: true
  browser: true

files:
  - path: assets/icon.svg
    description: Package icon
    content: |
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#1f9d74" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="12" r="2"/><path d="M6 7v10M8 5h3a5 5 0 0 1 5 5"/><path d="M14 18l2 2 4-4"/></svg>
  - path: docs/review-doc.md
    description: What every PR review doc contains and how findings are graded

managers:
  orchestrator:
    name: Marshal
    files: [docs/review-doc.md]
    instructions_file: managers/orchestrator.md

  planner:
    instructions_file: managers/planner.md

workers:
  pr_reviewer:
    description: Reviews one pull request in its own lane, writes its review doc and fixes on the PR branch.
    files: [docs/review-doc.md]
    instructions_file: workers/pr_reviewer.md

  gatekeeper:
    description: Runs the final no-Criticals gate and the proof on the integration merge SHA.
    files: [docs/review-doc.md]
    instructions_file: workers/gatekeeper.md
