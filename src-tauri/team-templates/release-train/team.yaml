# release-train — Agentic Team Protocol (ATP) builtin package
name: dev.domios/release-train
version: 1.0.0
title: Release train
description: >-
  Qualifies one release candidate of the project on its release branch: one build owner
  compiles, QA proves the exact SHA live, the release manager drives CI and the release PR,
  and publication waits for the owner's explicit GO.
icon: assets/icon.svg
authors:
  - name: Domios
    url: https://domios.dev
license: Apache-2.0
when:
  - ship a Domios release
  - run the release train for a version
  - qualify a release candidate and publish after owner GO
  - cut a release branch, run CI and open the release PR
  - verify a release candidate live on its exact SHA

project: required

inputs:
  version: Version to release, for example 1.19.2
  release_branch: Release branch that carries the candidate, for example release/1.19.2

permissions:
  network: true
  repo_write: true
  shell: true
  browser: true

files:
  - path: assets/icon.svg
    description: Package icon
    content: |
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#c8711f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="13" rx="3"/><path d="M5 10h14"/><circle cx="9" cy="13" r="0.5"/><circle cx="15" cy="13" r="0.5"/><path d="M8 16l-3 5M16 16l3 5M7 19h10"/></svg>

managers:
  orchestrator:
    name: Conductor
    instructions_file: managers/orchestrator.md

  planner:
    instructions_file: managers/planner.md

workers:
  build_owner:
    description: The only role that compiles, refreshes the test instance and runs gates.
    instructions_file: workers/build_owner.md

  qa:
    description: Proves the candidate live on its exact SHA, then runs the focused checks.
    instructions_file: workers/qa.md

  release_manager:
    description: Drives CI, qualification and the release PR up to the owner's publication GO.
    instructions_file: workers/release_manager.md
