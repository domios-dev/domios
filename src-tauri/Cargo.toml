[package]
name = "codeterm"
version = "0.9.0"
edition = "2021"
default-run = "codeterm"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-webdriver = { version = "0.2", optional = true }
portable-pty = { path = "pty-fork" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
log = "0.4"
fern = "0.7"
parking_lot = "0.12"
base64 = "0.22"
interprocess = "2"
sha2 = "0.10"
toml = "0.8"
dirs = "6"
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
git2 = { version = "0.19", features = ["vendored-openssl"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "stream", "blocking"] }
async-stream = "0.3"
futures-core = "0.3"
png = "0.17"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
cron = "0.13"
chrono = "0.4"
vt100 = "0.16"
semver = "1"
hostname = "0.4.2"
notify = { version = "7", default-features = false, features = ["macos_fsevent"] }
notify-debouncer-mini = "0.5"
mdns-sd = "0.11"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
aes-gcm = "0.10"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled", "blob", "functions", "load_extension"] }
regex = "1"
ulid = "1"
sqlite-vec = { version = "0.1.9", optional = true }
fastembed = { version = "5", optional = true }

[features]
default = ["embeddings"]
webdriver = ["tauri-plugin-webdriver"]
embeddings = ["dep:sqlite-vec", "dep:fastembed"]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSView", "NSResponder", "NSPasteboard"] }
objc2-foundation = "0.3"

[target.'cfg(windows)'.dependencies]
conpty = "0.7"
clipboard-win = "5"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "codeterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Deterministic mem-recall bench runner. Reuses the `mem` module from the
# lib crate directly (no tokio background tasks, no LLM, no embeddings
# required) so evals compile fast and run offline.
[[bin]]
name = "mem-bench"
path = "src/bin/mem_bench.rs"
