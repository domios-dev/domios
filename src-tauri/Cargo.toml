[package]
name = "codeterm"
version = "1.7.3"
edition = "2021"
default-run = "codeterm"

[workspace]
members = [".", "crates/codeterm-types", "crates/codeterm-util", "crates/codeterm-mesh", "crates/codeterm-mem", "crates/codeterm-plan", "crates/codeterm-bridge", "crates/codeterm-pty", "crates/codeterm-plugin"]
exclude = ["pty-fork"]
resolver = "2"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "test"] }
# Embedded JavaScript runtime for plugin code (provider TS bundles run
# here when called from headless / background Rust code paths). See
# docs/plans/relay/20-provider-plugins-ts.md. Features chosen to keep
# binary size minimal — no parallel/multi-context, no async, just the
# core eval surface + ES modules.
rquickjs = { version = "0.11", features = ["loader", "macro", "parallel"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
portable-pty = { path = "pty-fork" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
codeterm-types = { path = "crates/codeterm-types" }
codeterm-util = { path = "crates/codeterm-util" }
codeterm-mesh = { path = "crates/codeterm-mesh" }
codeterm-mem = { path = "crates/codeterm-mem", features = ["embeddings"] }
codeterm-plan = { path = "crates/codeterm-plan" }
codeterm-bridge = { path = "crates/codeterm-bridge" }
codeterm-pty = { path = "crates/codeterm-pty" }
codeterm-plugin = { path = "crates/codeterm-plugin" }
log = "0.4"
fern = "0.7"
parking_lot = "0.12"
base64 = "0.22"
interprocess = "2"
sha2 = "0.10"
# Embedded bundled-plugin bytes for the first-launch bootstrap. The
# Dir struct is built at compile time from <repo>/plugins/ so a fresh
# binary on an air-gapped machine still has working providers.
include_dir = "0.7"
md-5 = "0.10"
toml = "0.8"
dirs = "6"
axum = { version = "0.8", features = ["multipart"] }
tower-http = { version = "0.6", features = ["catch-panic", "compression-gzip", "cors", "fs", "set-header"] }
git2 = { version = "0.19", features = ["vendored-openssl"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "stream", "blocking"] }
async-stream = "0.3"
futures-core = "0.3"
futures-util = "0.3"
futures-executor = "0.3"
png = "0.17"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
cron = "0.13"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
vt100 = "0.16"
semver = "1"
hostname = "0.4.2"
notify = { version = "7", default-features = false, features = ["macos_fsevent"] }
notify-debouncer-mini = "0.5"
mdns-sd = "0.11"
if-addrs = "0.13"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
aes-gcm = "0.10"
url = "2"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled", "blob", "functions", "load_extension"] }
regex = "1"
ulid = "1"
async-trait = "0.1"
zeroize = { version = "1", features = ["zeroize_derive"] }
which = "7"
wait-timeout = "0.2"
sqlite-vec = { version = "0.1.9", optional = true }
fastembed = { version = "5", optional = true }
ndarray = { version = "0.17", optional = true }
hnsw_rs = { version = "0.3", optional = true }
codeterm-mem-store = { path = "../crates/mem-store" }
codeterm-paths = { path = "../crates/codeterm-paths" }
codeterm-plugins = { path = "../crates/codeterm-plugins" }
crash-handler = "0.6"
crash-context = "0.6"
minidump-writer = "0.10"

[features]
default = ["embeddings"]
# annembed (UMAP graph layout) is macOS-only: its LAPACK backend is the
# Accelerate framework; Windows/Linux have no provider wired and fail at
# link time. Declared in the macOS target section below.
embeddings = ["dep:sqlite-vec", "dep:fastembed", "dep:annembed", "dep:ndarray", "dep:hnsw_rs"]
dev-updater-allowlocal = []

# Low-level syscalls (e.g. fd-limit raise in fdlimit.rs) on all Unix incl Linux.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# macOS uses the system Accelerate framework for the annembed LAPACK path.
[target.'cfg(target_os = "macos")'.dependencies]
annembed = { version = "0.1.6", optional = true, default-features = false, features = ["macos-accelerate"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSView", "NSResponder", "NSPasteboard"] }
objc2-foundation = "0.3"

# x86_64 macOS: pyke does not ship an ort prebuilt for this target, so we
# enable fastembed's `ort-load-dynamic` feature and dlopen libonnxruntime
# at runtime from a dylib bundled next to the app binary. arm64 keeps
# static linking via the default `download-binaries` path.
[target.'cfg(all(target_os = "macos", target_arch = "x86_64"))'.dependencies]
fastembed = { version = "5", optional = true, features = ["ort-load-dynamic"] }

[target.'cfg(windows)'.dependencies]
conpty = "0.7"
clipboard-win = "5"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
mockito = "1"
filetime = "0.2.29"
tower = "0.5"
vt100 = "0.16"
# Enables PlanStore::new_for_test + TestSearchPort in the app's test build only.
codeterm-plan = { path = "crates/codeterm-plan", features = ["test-support"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
sha2 = "0.10"

[lib]
name = "codeterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[test]]
name = "main"
path = "tests/main.rs"

# Deterministic mem-recall bench runner. Reuses the `mem` module from the
# lib crate directly (no tokio background tasks, no LLM, no embeddings
# required) so evals compile fast and run offline.
[[bin]]
name = "mem-bench"
path = "src/bin/mem_bench.rs"

# Isolated embedding worker — fastembed/ort runs here so its Windows
# memory leak is bounded by periodic child restart (parent kills and
# respawns after N inferences or memory threshold).
[[bin]]
name = "codeterm-embed"
path = "src/bin/codeterm_embed.rs"

# Fast parser-iteration harness: run a provider's usage parser against
# a raw text fixture and print extracted fields. ~2s rebuild vs full dev.
[[bin]]
name = "parser-eval"
path = "src/bin/parser_eval.rs"

# Build-speed profiles (round-16 build audit). dev: unpacked split-debuginfo
# skips dSYM packing on macOS (faster links); line-tables keep usable
# backtraces at a fraction of the debuginfo; deps carry no debuginfo at all.
[profile.dev]
split-debuginfo = "unpacked"
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# One-off legacy plan.json → store_v2 yaml migration (T7). Deep-compare gate;
# never deletes on mismatch. Rehearse on a project copy with --dry-run first.
[[bin]]
name = "convert-plan-storage"
path = "../scripts/convert-plan-storage.rs"
