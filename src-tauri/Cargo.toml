[package]
name = "codeterm"
version = "1.14.9-dev.6"
edition = "2021"
default-run = "codeterm"

[workspace]
members = ["crates/codeterm-api", ".", "crates/codeterm-input-macos", "crates/codeterm-input-windows", "crates/codeterm-account", "crates/codeterm-billing", "crates/codeterm-analytics", "crates/codeterm-frontend-bundle", "crates/codeterm-types", "crates/codeterm-wire", "crates/codeterm-sentinel", "crates/codeterm-decision", "crates/codeterm-provider-signals", "crates/codeterm-util", "crates/codeterm-browser", "crates/codeterm-mesh", "crates/codeterm-mem", "crates/codeterm-plan", "crates/codeterm-bridge", "crates/codeterm-pty", "crates/codeterm-plugin", "crates/codeterm-plugins", "crates/codeterm-storage", "crates/codeterm-agent-detect", "crates/codeterm-notification-core", "crates/codeterm-repowatch", "crates/codeterm-usage", "crates/codeterm-blueprint-types", "crates/codeterm-local-recording", "crates/codeterm-notify-types", "crates/codeterm-events", "crates/codeterm-config", "crates/codeterm-secrets", "crates/codeterm-keepawake", "crates/codeterm-cron", "crates/codeterm-shutdown", "crates/codeterm-service-core", "crates/codeterm-socket", "crates/codeterm-build-info"]
exclude = ["pty-fork", "vendor/tauri-runtime-wry"]
resolver = "2"

[workspace.lints.rust]
warnings = "deny"

[lints]
workspace = true

[dependencies]
codeterm-commands = { path = "crates/codeterm-commands" }
codeterm-api = { path = "crates/codeterm-api" }
codeterm-service-core = { path = "crates/codeterm-service-core", default-features = false }
codeterm-socket = { path = "crates/codeterm-socket" }
codeterm-build-info = { path = "crates/codeterm-build-info" }
tauri = { version = "2", features = ["tray-icon", "test", "webview-data-url"] }
# tauri-build reads plugin ACL manifests only from direct dependencies.
tauri-plugin-deep-link = "2"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tokio = { version = "1", features = ["full", "test-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
codeterm-types = { path = "crates/codeterm-types" }
codeterm-decision = { path = "crates/codeterm-decision" }
codeterm-mem = { path = "crates/codeterm-mem", default-features = false }
codeterm-bridge = { path = "crates/codeterm-bridge" }
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
fastembed = { version = "5", optional = true }

[features]
default = ["embeddings"]
embeddings = ["codeterm-service-core/embeddings", "dep:fastembed"]
dev-updater-allowlocal = ["codeterm-commands/dev-updater-allowlocal"]

# x86_64 macOS: pyke does not ship an ort prebuilt for this target, so we
# enable fastembed's `ort-load-dynamic` feature and dlopen libonnxruntime
# at runtime from a dylib bundled next to the app binary. arm64 keeps
# static linking via the default `download-binaries` path.
[target.'cfg(all(target_os = "macos", target_arch = "x86_64"))'.dependencies]
fastembed = { version = "5", optional = true, features = ["ort-load-dynamic"] }

[dev-dependencies]
codeterm-service-core = { path = "crates/codeterm-service-core", default-features = false, features = ["test-support"] }
vt100 = "0.16"

[build-dependencies]
tauri-build = { version = "2", features = [] }
sha2 = "0.10"

[lib]
name = "codeterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[test]]
name = "main"
path = "tests/main.rs"

# Deterministic mem-recall bench runner. Reuses the `mem` module from the
# lib crate directly. Default and stub modes run offline without an LLM
# or embeddings; live decision mode is an explicit owner-run option.
[[bin]]
name = "mem-bench"
path = "src/bin/mem_bench.rs"

# Isolated embedding worker — fastembed/ort runs here so its Windows
# memory leak is bounded by periodic child restart (parent kills and
# respawns after N inferences or memory threshold).
[[bin]]
name = "codeterm-embed"
path = "src/bin/codeterm_embed.rs"

# Fast parser-iteration harness: run a provider's usage parser against
# a raw text fixture and print extracted fields. ~2s rebuild vs full dev.
[[bin]]
name = "parser-eval"
path = "src/bin/parser_eval.rs"

[[bin]]
name = "storage-verify"
path = "src/bin/storage-verify.rs"

# Build-speed profiles (round-16 build audit). dev: unpacked split-debuginfo
# skips dSYM packing on macOS (faster links); line-tables keep usable
# backtraces at a fraction of the debuginfo; deps carry no debuginfo at all.
[profile.dev]
split-debuginfo = "unpacked"
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.test]
split-debuginfo = "unpacked"
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

# One-off legacy plan.json → store_v2 yaml migration (T7). Deep-compare gate;
# never deletes on mismatch. Rehearse on a project copy with --dry-run first.
[[bin]]
name = "convert-plan-storage"
path = "../scripts/convert-plan-storage.rs"

[patch.crates-io]
tauri-runtime-wry = { path = "vendor/tauri-runtime-wry" }
