[package]
license = "AGPL-3.0-only"
name = "codeterm"
version = "1.17.1"
edition = "2021"
default-run = "domios-app"

[workspace]
members = ["crates/codeterm-process-identity", "crates/codeterm-paths", "crates/domios-server", "crates/codeterm-crash", "crates/codeterm-worker-services", "crates/codeterm-local-preview", "crates/codeterm-lanes", "crates/codeterm-api", ".", "crates/codeterm-input-macos", "crates/codeterm-input-windows", "crates/codeterm-account", "crates/codeterm-neighbors", "crates/codeterm-billing", "crates/codeterm-analytics", "crates/codeterm-frontend-bundle", "crates/codeterm-types", "crates/codeterm-wire", "crates/codeterm-sentinel", "crates/codeterm-decision", "crates/codeterm-provider-signals", "crates/codeterm-util", "crates/codeterm-browser", "crates/codeterm-mesh", "crates/codeterm-mem", "crates/codeterm-mem-postgres", "crates/codeterm-plan", "crates/codeterm-bridge", "crates/codeterm-pty", "crates/codeterm-plugin", "crates/codeterm-plugins", "crates/codeterm-storage", "crates/codeterm-agent-detect", "crates/codeterm-notification-core", "crates/codeterm-repowatch", "crates/codeterm-usage", "crates/codeterm-blueprint-types", "crates/codeterm-local-recording", "crates/codeterm-notify-types", "crates/codeterm-events", "crates/codeterm-config", "crates/codeterm-secrets", "crates/codeterm-keepawake", "crates/codeterm-cron", "crates/codeterm-shutdown", "crates/codeterm-service-core", "crates/codeterm-surface", "crates/codeterm-notifications",
    "crates/codeterm-provider-ops", "crates/codeterm-recall", "crates/codeterm-supporter", "crates/codeterm-socket", "crates/codeterm-commands", "crates/codeterm-sentinel-host", "crates/codeterm-orchestration", "crates/codeterm-build-info", "crates/codeterm-prompts", "crates/codeterm-agent-model", "crates/codeterm-entitlements", "crates/codeterm-update", "crates/codeterm-client-shell", "crates/codeterm-frontend-shell", "crates/workspace-hack", "tools/codeterm-devtools", "../cli"]
exclude = ["pty-fork"]
resolver = "2"

[workspace.package]
license = "AGPL-3.0-only"

[workspace.lints.rust]
warnings = "deny"

[lints]
workspace = true

[dependencies]
codeterm-build-info = { path = "crates/codeterm-build-info" }
codeterm-client-shell = { path = "crates/codeterm-client-shell" }
codeterm-frontend-shell = { path = "crates/codeterm-frontend-shell" }
codeterm-paths = { path = "crates/codeterm-paths" }
codeterm-process-identity = { path = "crates/codeterm-process-identity" }
codeterm-types = { path = "crates/codeterm-types" }
codeterm-update = { path = "crates/codeterm-update" }
codeterm-util = { path = "crates/codeterm-util" }
tauri = { version = "2", features = ["tray-icon", "test", "webview-data-url"] }
# tauri-build reads plugin ACL manifests only from direct dependencies.
tauri-plugin-deep-link = "2"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tokio = { version = "1", features = ["full", "test-util"] }
interprocess = { version = "2", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
log = { version = "0.4", features = ["release_max_level_info"] }
shell-words = "1"
parking_lot = "0.12"
async-trait = "0.1"
png = "0.17"
dirs = "6"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
workspace-hack = { version = "0.1", path = "crates/workspace-hack" }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }

[target.'cfg(target_os = "macos")'.dependencies]
codeterm-crash = { path = "crates/codeterm-crash" }
core-foundation = "0.10"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSView", "NSResponder", "NSPasteboard"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[features]
dev-updater-allowlocal = ["codeterm-client-shell/dev-updater-allowlocal"]

[dev-dependencies]
codeterm-client-shell = { path = "crates/codeterm-client-shell", features = ["test-support"] }
tempfile = "3"

[build-dependencies]
tauri-build = { version = "2", features = [] }
sha2 = "0.10"

[lib]
name = "codeterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The CLI binary is named codeterm; the app binary differs so both build into one target directory.
[[bin]]
name = "domios-app"
path = "src/main.rs"

# Build-speed profiles (round-16 build audit). dev: unpacked split-debuginfo
# skips dSYM packing on macOS (faster links); line-tables keep usable
# backtraces at a fraction of the debuginfo; deps carry no debuginfo at all.
[profile.dev]
split-debuginfo = "unpacked"
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Startup verifies complete executable images, including the larger DEV artifacts.
[profile.dev.package.sha2]
opt-level = 3

# Building the CLI's clap command is ~10^4x slower unoptimized; dev/test parsing otherwise hangs for minutes.
[profile.dev.package.codeterm-cli]
opt-level = 1

# Agents exec the release CLI constantly; incremental keeps its iterative release rebuilds cheap.
[profile.release.package.codeterm-cli]
incremental = true

[profile.test]
split-debuginfo = "unpacked"
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

