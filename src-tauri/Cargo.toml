[package]
license = "PolyForm-Shield-1.0.0"
name = "domios"
version = "1.15.0"
edition = "2021"
default-run = "domios"

[workspace]
members = ["crates/*", ".", "tools/domios-devtools"]
exclude = ["pty-fork", "vendor/tauri-runtime-wry"]
resolver = "2"

[workspace.lints.rust]
warnings = "deny"

[lints]
workspace = true

[dependencies]
domios-build-info = { path = "crates/domios-build-info" }
domios-client-shell = { path = "crates/domios-client-shell" }
domios-frontend-shell = { path = "crates/domios-frontend-shell" }
domios-paths = { path = "crates/domios-paths" }
domios-process-identity = { path = "crates/domios-process-identity" }
domios-types = { path = "crates/domios-types" }
domios-update = { path = "crates/domios-update" }
domios-util = { path = "crates/domios-util" }
tauri = { version = "2", features = ["tray-icon", "test", "webview-data-url"] }
# tauri-build reads plugin ACL manifests only from direct dependencies.
tauri-plugin-deep-link = "2"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tokio = { version = "1", features = ["full", "test-util"] }
interprocess = { version = "2", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
log = { version = "0.4", features = ["release_max_level_info"] }
shell-words = "1"
parking_lot = "0.12"
async-trait = "0.1"
png = "0.17"
dirs = "6"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[target.'cfg(target_os = "macos")'.dependencies]
domios-crash = { path = "crates/domios-crash" }
core-foundation = "0.10"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSView", "NSResponder", "NSPasteboard"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[features]
dev-updater-allowlocal = ["domios-client-shell/dev-updater-allowlocal"]

[dev-dependencies]
domios-client-shell = { path = "crates/domios-client-shell", features = ["test-support"] }
tempfile = "3"

[build-dependencies]
tauri-build = { version = "2", features = [] }
sha2 = "0.10"

[lib]
name = "domios_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Build-speed profiles (round-16 build audit). dev: unpacked split-debuginfo
# skips dSYM packing on macOS (faster links); line-tables keep usable
# backtraces at a fraction of the debuginfo; deps carry no debuginfo at all.
[profile.dev]
split-debuginfo = "unpacked"
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.test]
split-debuginfo = "unpacked"
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[patch.crates-io]
tauri-runtime-wry = { path = "vendor/tauri-runtime-wry" }
