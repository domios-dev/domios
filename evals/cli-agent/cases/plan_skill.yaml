- id: plan.skill.recall.learned-procedure
  command: "plan skill"
  prompt: "You are orchestrating an active plan. A worker just figured out the exact seeding + run recipe to reproduce a flaky parser test, and you want the next lane to reuse it instead of rediscovering it. Capture it so future workers on this plan inherit it."
  expect: |
    Reaches for the plan-skills mechanism instead of leaving the recipe in chat:
    checks `codeterm plan skill list` first (improve before adding), then records
    the procedure with `codeterm plan skill new <slug>`. The recorded skill names
    the FIXED oracle (the exact reproduce/run command) vs the mutable parts.
    Must NOT invent a mem-only or markdown-file workaround; the plan skill store
    is the home. Must not fail on socket/port.
  safety: execute
- id: plan.skill.new.oracle-first
  command: "plan skill new"
  prompt: "Record a plan skill for verifying the vague-test-plan doctor gate: the check command is `cargo test test_plan_vague`."
  expect: |
    Runs `codeterm plan skill new <slug>` and authors a SKILL.md whose body names
    the check command as the fixed oracle. Cites the `--check`/oracle when
    describing keep/discard. English only.
  safety: execute
- id: plan.skill.edit.oracle-immutable
  command: "plan skill edit"
  prompt: "A bounce showed the old workaround was wrong, but the proving command `cargo test loop_engine::stagnation_deviates_only_after_k` is still the oracle. Update the existing plan skill without weakening that oracle."
  expect: |
    Uses the existing plan-skill surface (`codeterm plan skill list` and
    `codeterm plan skill edit <slug>` or `show` first) and keeps the exact check
    command as the fixed oracle. Must describe the bounce outcome as keep,
    discard, or supersede without changing the oracle to make the result pass.
    Must NOT move the recipe into chat, mem-only notes, or a markdown side file.
  safety: execute
- id: plan.skill.new.bounded-bounce-research
  command: "plan skill new"
  prompt: "Capture a reusable bounce-unwinding recipe for a planner task: start with repo files and existing fixtures, allow one bounded external-doc lookup only if the repo is insufficient, and stop once you can route the next follow-up."
  expect: |
    Reaches for `codeterm plan skill new <slug>` and writes a procedure that is
    repo-first, bounded, and oracle-preserving. The skill must rank evidence
    applicability, name a stop rule/budget, and gate follow-ups so it does not
    create duplicate or unbounded research tasks. Must mention keep/discard or
    supersede. English only.
  safety: execute
- id: plan.skill.edit.followup-dedup
  command: "plan skill edit"
  prompt: "A second bounce proved that spawning another identical research follow-up would be waste. Update the existing bounce-unwinding skill so it tells the orchestrator to split or reroute instead of cloning the same follow-up."
  expect: |
    Uses the existing plan-skill surface and updates the skill with explicit
    bounded follow-up gating: no duplicate follow-up for the same finding, split
    or reroute after repeated bounce, and preserve the original oracle. Must NOT
    create a new parallel skill for the same recipe when an existing one fits.
  safety: execute
