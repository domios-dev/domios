# Check and apply this file with codeterm blueprint.
schema_version: 1
name: Runners {{repo}} {{label}}
note: Watch labelled self-hosted runner availability and its online count.
owner: team
inputs:
  interval:
    type: string
    default: 60s
    description: Probe interval, at least 10s
  label:
    type: string
    default: self-hosted
    description: Runner label to match
  repo:
    type: string
    description: GitHub owner/repository
  timeout_ms:
    type: integer
    default: 60000
    description: Probe timeout in milliseconds
pipeline:
  trigger:
    type: schedule
    every: '{{interval}}'
  steps:
  - name: Check source
    input: text
    uses: github
    with:
      repo: '{{repo}}'
      resource: runners
      label: '{{label}}'
      timeout_ms: '{{timeout_ms}}'
    'on':
      online: next
      offline: next
      failed: stop
  result:
    to: owner
