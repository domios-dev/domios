schema_version: 1
name: Standup digest
note: Each morning gather yesterday's commit log and have an agent write a short standup digest for the team.
owner: team
inputs:
  repo_path:
    type: string
    description: Local repository path
pipeline:
  trigger: {type: schedule, every: 24h}
  steps:
    - name: commits
      input: text
      run: git -C '{{repo_path}}' log --since=yesterday --oneline
      on: {done: next, failed: stop}
    - name: digest
      input: text
      uses: agent
      with: {provider: claude, profile: writer, task: Summarize these commits as a three-line standup update, deadline_ms: 60000, max_tokens: 800, max_turns: 1}
      on: {done: stop, failed: stop}
  result: {to: team}
