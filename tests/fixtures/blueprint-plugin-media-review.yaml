schema_version: 2
kind: pipeline
name: Fixture media review
owner: tab
trigger:
  type: input
  kind: {lit: text}
  source: {lit: {text: "fixture prompt"}}
steps:
  - id: generate
    uses: fixture.generate
    plugin: &paid
      revision: 1
      spending: {unit: micro_credits, run_ceiling: 3, step_allowance: 2}
    with: {prompt: {lit: "fixture prompt"}}
    out:
      type: object
      media: json
      properties:
        image:
          type: array
          items:
            type: object
            properties:
              kind: {type: string}
              handle: {type: string}
              media: {type: string}
            required: [kind, handle, media]
            additionalProperties: false
      required: [image]
      additionalProperties: false
    on: {done: "@next", failed: "@stop"}
  - id: review
    uses: agent
    with:
      provider: {lit: fixture-review}
      profile: {lit: fixture}
      task: {lit: "Inspect the supplied image bytes and return a typed verdict."}
      deadline_ms: {lit: 5000}
      max_tokens: {lit: 1000}
      max_turns: {lit: 1}
      review: {lit: true}
    bind: {images: generate.out.image}
    on: {pass: "@next", retry: "@stop", choose: "@stop", failed: "@stop"}
  - id: variant
    uses: fixture.generate
    plugin: *paid
    with: {prompt: {lit: "fixture variant"}}
    on: {done: "@next", failed: "@stop"}
  - id: failed_take
    uses: fixture.generate
    plugin: *paid
    with: {prompt: {lit: "fixture failure"}}
    on: {done: "@next", failed: "@next"}
  - id: expensive
    uses: fixture.generate
    plugin:
      revision: 1
      spending: {unit: micro_credits, run_ceiling: 3, step_allowance: 5}
    with: {prompt: {lit: "must wait for owner"}}
    on: {done: "@stop", failed: "@stop"}
result: {to: notify}
