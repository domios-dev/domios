[package]
name = "codeterm-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "codeterm"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
interprocess = "2"
reqwest = { version = "0.12", features = ["blocking", "json"] }
dirs = "5"
toml = "0.8"
