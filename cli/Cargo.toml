[package]
license = "PolyForm-Shield-1.0.0"
name = "domios-cli"
version = "1.15.0"
edition = "2021"

[[bin]]
name = "domios"
path = "src/main.rs"

[lints.rust]
warnings = "deny"

[dependencies]
include_dir = "0.7"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
interprocess = "2"
reqwest = { version = "0.12", features = ["blocking", "json"] }
dirs = "5"
toml = "0.8"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
urlencoding = "2"
regex = "1"
# Direct SQLite access for `mem run-worker` subprocess. Subprocess opens the
# shared knowledge.db (multi-process WAL) without going through the daemon.
rusqlite = { version = "0.32", features = ["bundled"] }
sqlite-vec = "0.1.9"
chrono = "0.4"
sha2 = "0.10"
# Transliteration for `tab find` — lets users search "далтон" → "Dalton"
# without minding the input language.
deunicode = "1"
domios-mem-store = { path = "../src-tauri/crates/mem-store" }
domios-plugins = { path = "../src-tauri/crates/domios-plugins" }
# In-process reuse of the daemon's strict PluginManifest + QuickJS loader for
# `plugin validate` — the CLI never grows its own manifest interpretation.
domios-plugin = { path = "../src-tauri/crates/domios-plugin" }
domios-build-info = { path = "../src-tauri/crates/domios-build-info" }
domios-paths = { path = "../src-tauri/crates/domios-paths" }
domios-process-identity = { path = "../src-tauri/crates/domios-process-identity" }
# The notification level set is defined once in the daemon-shared crate; the CLI
# derives its flag values from it instead of mirroring the enum.
domios-types = { path = "../src-tauri/crates/domios-types" }
domios-notification-core = { path = "../src-tauri/crates/domios-notification-core" }
domios-blueprint-types = { path = "../src-tauri/crates/domios-blueprint-types" }
domios-mesh = { path = "../src-tauri/crates/domios-mesh" }
domios-wire = { path = "../src-tauri/crates/domios-wire" }

[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
domios-plugin = { path = "../src-tauri/crates/domios-plugin", features = ["test-support"] }
tempfile = "3"

# CLI ships release (agents exec it constantly — startup latency matters),
# but incremental makes iterative release rebuilds cheap on dev restarts.
[profile.release]
incremental = true

[profile.dev]
split-debuginfo = "unpacked"
debug = "line-tables-only"

# Building Cli::command is ~10^4x slower unoptimized (release: 0ms) — every dev/test
# calling try_parse_from otherwise hangs for minutes. opt-1 on just this crate fixes it.
[profile.dev.package.domios-cli]
opt-level = 1
