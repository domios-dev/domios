[package]
name = "codeterm-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "codeterm"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
interprocess = "2"
reqwest = { version = "0.12", features = ["blocking", "json"] }
dirs = "5"
toml = "0.8"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
urlencoding = "2"
# Direct SQLite access for `mem run-worker` subprocess. Subprocess opens the
# shared knowledge.db (multi-process WAL) without going through the daemon.
rusqlite = { version = "0.32", features = ["bundled"] }
sqlite-vec = "0.1.9"
chrono = "0.4"
regex = "1"
tree-sitter = "0.22"
tree-sitter-rust = "0.21"
ignore = "0.4"
bincode = "1.3"

[dev-dependencies]
tempfile = "3"
