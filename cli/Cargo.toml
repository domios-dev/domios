[package]
name = "codeterm-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "codeterm"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
interprocess = "2"
reqwest = { version = "0.12", features = ["blocking", "json"] }
dirs = "5"
toml = "0.8"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
urlencoding = "2"
# Direct SQLite access for `mem run-worker` subprocess. Subprocess opens the
# shared knowledge.db (multi-process WAL) without going through the daemon.
rusqlite = { version = "0.32", features = ["bundled"] }
sqlite-vec = "0.1.9"
chrono = "0.4"
sha2 = "0.10"

# project-map (Phase 1: Tier-0 indexer)
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
tree-sitter-java = "0.23"
tree-sitter-swift = "0.7"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-c-sharp = "0.23"
tree-sitter-php = "0.24"
tree-sitter-scala = "0.26"
tree-sitter-dart = "0.2"
tree-sitter-elixir = "0.3"
tree-sitter-lua = "0.5"
tree-sitter-ocaml = "0.24"
ignore = "0.4"
walkdir = "2"
regex = "1"
scip = "0.7"
protobuf = "3"
serde_yaml = "0.9"

[dev-dependencies]
tempfile = "3"
