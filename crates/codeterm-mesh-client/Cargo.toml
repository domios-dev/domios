[package]
name = "codeterm-mesh-client"
version = "0.1.0"
edition = "2021"
description = "Lightweight mesh client for CodeTerm relay"
license = "MIT"
authors = ["CodeTerm Team"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Crypto
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
tracing = "0.1"
rand = "0.8"
parking_lot = "0.12"

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"