<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Fixed scale: a terminal UI must not pinch-zoom; viewport-fit covers
         the iOS notch so safe-area insets apply. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>CodeTerm</title>
    <!-- PWA/home-screen metas: manifest link is injected at runtime by
         PwaSetup with the API token baked into start_url. -->
    <meta name="theme-color" content="#0d1117" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CodeTerm" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        /* dvh tracks the real visible viewport on mobile (shrinks under
           browser chrome / keyboard); plain 100% is the fallback. */
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        background: transparent;
      }
      /* Installed (standalone) web app: content extends under the iOS status
         bar (black-translucent), so pad the top inset and fill it with bg. */
      @media all and (display-mode: standalone) {
        html, body { background: #0d1117; }
        #root { padding-top: env(safe-area-inset-top, 0px); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
