<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Fixed scale: a terminal UI must not pinch-zoom; viewport-fit covers
         the iOS notch so safe-area insets apply. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>CodeTerm</title>
    <!-- PWA/home-screen metas: manifest link is injected at runtime by
         PwaSetup with the API token baked into start_url. -->
    <meta name="theme-color" content="#0d1117" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CodeTerm" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("codeterm-theme-css-v1");
          if (!raw) return;
          var vars = JSON.parse(raw);
          if (!vars || typeof vars !== "object") return;
          var root = document.documentElement;
          Object.keys(vars).forEach(function (key) {
            if (key.indexOf("--ct-") === 0 && typeof vars[key] === "string") {
              root.style.setProperty(key, vars[key]);
            }
          });
          var bg = vars["--ct-bg"];
          if (typeof bg === "string") {
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute("content", bg);
            root.style.background = bg;
            var hex = bg.replace("#", "");
            if (hex.length === 6) {
              var r = parseInt(hex.slice(0, 2), 16);
              var g = parseInt(hex.slice(2, 4), 16);
              var b = parseInt(hex.slice(4, 6), 16);
              root.style.colorScheme = (r + g + b) / 3 > 128 ? "light" : "dark";
            }
          }
        } catch (_) {
          /* first-paint theme cache is best effort */
        }
      })();
    </script>
    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        /* dvh tracks the real visible viewport on mobile (shrinks under
           browser chrome / keyboard); plain 100% is the fallback. */
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        background: var(--ct-bg, #0d1117);
      }
      /* Single source for safe-area insets. The script below overrides these
         with JS-probed px values in standalone mode, where env() is unreliable
         on cold start (WebKit bug 274773). */
      :root {
        --ct-safe-top: env(safe-area-inset-top, 0px);
        --ct-safe-bottom: env(safe-area-inset-bottom, 0px);
      }
      /* Non-zero only when content extends under the status bar (installed
         web app / fullscreen); 0 in regular browsers and Tauri. */
      #root { padding-top: var(--ct-safe-top); }
      /* .standalone is set by an inline script below — iOS home-screen apps
         don't reliably match the display-mode media query. 100vh is the ONLY
         unit correct from PWA cold start: 100dvh initializes wrong until a
         device rotation, and height:100% silently breaks viewport-fit=cover
         under black-translucent (WebKit letterboxing quirks). */
      html.standalone, html.standalone body, html.standalone #root {
        height: 100vh;
        background: var(--ct-bg, #0d1117);
      }
      /* --vv-height is fed from visualViewport (useKeyboardInset) — the shell
         shrinks to the visible area when the keyboard opens instead of being
         pushed off-screen. */
      html.standalone #root {
        height: var(--vv-height, 100vh);
      }
    </style>
    <script>
      (function () {
        if (
          navigator.standalone !== true &&
          !window.matchMedia("(display-mode: standalone)").matches
        ) {
          return;
        }
        document.documentElement.classList.add("standalone");
        // WebKit bug 274773: env(safe-area-inset-*) can stay 0 on standalone
        // cold start, and a single viewport-fit toggle is not always enough.
        // Probe the resolved values into --ct-safe-* and keep re-toggling
        // until WebKit reports a real top inset (iOS portrait always has one).
        var root = document.documentElement;
        var meta = document.querySelector('meta[name="viewport"]');
        var content = meta.getAttribute("content");
        function probe(prop) {
          var el = document.createElement("div");
          el.style.cssText =
            "position:fixed;top:0;left:0;width:0;visibility:hidden;" +
            "pointer-events:none;height:env(" + prop + ",0px)";
          root.appendChild(el);
          var v = el.offsetHeight;
          el.remove();
          return v;
        }
        function apply() {
          var top = probe("safe-area-inset-top");
          root.style.setProperty("--ct-safe-top", top + "px");
          root.style.setProperty(
            "--ct-safe-bottom",
            probe("safe-area-inset-bottom") + "px"
          );
          return top;
        }
        var attempts = 0;
        function kick() {
          meta.setAttribute(
            "content",
            content.replace("viewport-fit=cover", "viewport-fit=auto")
          );
          requestAnimationFrame(function () {
            meta.setAttribute("content", content);
            requestAnimationFrame(function () {
              var stale =
                apply() === 0 &&
                navigator.standalone === true &&
                window.matchMedia("(orientation: portrait)").matches;
              if (stale && ++attempts < 6) setTimeout(kick, 150 * attempts);
            });
          });
        }
        kick();
        window.addEventListener("resize", apply);
        window.addEventListener("orientationchange", function () {
          setTimeout(apply, 300);
        });
        document.addEventListener("visibilitychange", function () {
          if (!document.hidden) apply();
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        function messageOf(value) {
          if (value && typeof value.message === "string") return value.message;
          if (typeof value === "string") return value;
          return "The frontend module failed to load.";
        }
        function showBootError(value) {
          if (document.documentElement.dataset.codetermMounted === "true") return;
          var root = document.getElementById("root");
          if (!root || root.dataset.bootError === "true") return;
          root.dataset.bootError = "true";
          root.innerHTML =
            '<div style="display:flex;height:100%;flex-direction:column;background:#0d1117">' +
            '<header data-tauri-drag-region style="box-sizing:border-box;display:flex;height:32px;flex:0 0 32px;align-items:center;justify-content:space-between;padding-left:12px;border-bottom:1px solid #334155;background:#111827;color:#94a3b8;font:12px/1 system-ui,sans-serif;user-select:none">' +
            '<span data-tauri-drag-region>CodeTerm</span><nav data-window-controls aria-label="Window controls" style="display:flex;height:100%">' +
            '<button type="button" data-window-action="minimize" aria-label="Minimize">—</button><button type="button" data-window-action="toggle_maximize" aria-label="Maximize">□</button><button type="button" data-window-action="close" aria-label="Close">×</button></nav></header>' +
            '<main role="alert" style="box-sizing:border-box;display:grid;min-height:0;flex:1;padding:32px;place-items:center;color:#d8dee9;background:#0d1117">' +
            '<section style="box-sizing:border-box;width:min(760px,100%);padding:28px;border:1px solid #334155;border-radius:14px;background:#111827">' +
            '<strong style="color:#fb7185">CodeTerm UI failed to start</strong>' +
            '<pre style="max-height:40vh;overflow:auto;white-space:pre-wrap;word-break:break-word;color:#fecdd3">' +
            messageOf(value).replace(/[&<>"']/g, function (char) {
              return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char];
            }) +
            '</pre><button type="button" onclick="window.location.reload()" style="padding:9px 14px;border:1px solid #60a5fa;border-radius:8px;background:#2563eb;color:white">Reload interface</button>' +
            "</section></main></div>";
          var internals = window.__TAURI_INTERNALS__;
          var controls = root.querySelector("[data-window-controls]");
          if (!internals || !internals.metadata || !internals.metadata.currentWindow) {
            if (controls) controls.remove();
            return;
          }
          root.querySelectorAll("[data-window-action]").forEach(function (button) {
            button.style.cssText = "width:46px;height:100%;border:0;background:transparent;color:inherit;cursor:pointer";
            button.addEventListener("click", function () {
              internals.invoke("plugin:window|" + button.dataset.windowAction, {
                label: internals.metadata.currentWindow.label,
              });
            });
          });
        }
        window.addEventListener("error", function (event) { showBootError(event.error || event.message); });
        window.addEventListener("unhandledrejection", function (event) { showBootError(event.reason); });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
